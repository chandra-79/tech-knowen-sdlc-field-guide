</script><script>
const DOCS=[];
function doc(id,title,stage,what,why,who,when,where,which,how,sections){DOCS.push({id,title,stage,what,why,who,when,where,which,how,sections});}
const S=(heading,text,columns,rows)=>({heading,text,columns,rows});
doc('stakeholders','Stakeholder register & discovery notes','requirements','A list of affected people, their needs and the questions still to resolve.','Prevents a design based only on the loudest or most visible user.','Business analyst maintains it; customers, support, operations and the product owner review it.','Start during discovery. Update when a new affected group or unresolved need is found.','A shared project workspace, linked from the requirements index. The sample location is /requirements/stakeholders.','Feeds the BRD, requirements, acceptance criteria and risk discussions.','Identify people → ask about their work → record examples and conflicts → assign follow-up owners.',[
S('Worked example · STK-001','Harbour Bank is a fictional teaching case. The initial conversation is about understanding account balances and moving funds between two owned accounts. No real customer information is needed.'),
S('People and needs','', ['Stakeholder','Need / concern','Useful question'],[['Customer','Clear balances and understandable receipts','How should a completed transfer be distinguished from a rejected one?'],['Product owner','An agreed, teachable first version','Are external payees and fees excluded?'],['Support colleague','A reference for investigating an issue','Which details help locate a completed transaction?'],['Operations / security','Controlled changes and reliable evidence','Which controls belong at a trusted server?'],['Trainer / learner','An offline, resettable example','Can each scenario be repeated from known balances?']]),
S('Discovery decisions','Owned-account transfers only. SGD only. No fees or overdrafts. Deposits and withdrawals simulate completed cash events. Open real-system questions: identity verification, authoritative ledger integration, retention policy and service targets. Product owner and relevant specialists must resolve these before a real project baseline.')]);
doc('brd','Business Requirements Document (BRD)','requirements','Explains the business problem, desired outcomes, boundaries and constraints.','Keeps the project focused on a useful result rather than a list of screens.','Business analyst drafts; product owner, sponsor and affected business representatives review.','Create during discovery, before committing to scope. Revisit when the business objective or boundary changes.','Versioned requirements workspace; /requirements/BRD-001 in this example.','Links stakeholder needs to the SRS / FRD and supports prioritisation.','Describe the problem → define outcomes → state scope and exclusions → identify risks → agree how success will be judged.',[
S('Worked example · BRD-001','Problem: learners can name SDLC stages but struggle to see how a business need becomes a tested banking feature. Objective: provide a self-service teaching journey connecting requirements, decisions, documents and visible behaviour.'),
S('Scope and business outcomes','', ['Item','Agreed teaching scope'],[['BR-01 · Customer tasks','Login, logout, check balances, deposit, withdraw and transfer between two owned accounts.'],['BR-02 · Money boundary','SGD 0.01–10,000.00 per operation; no fees, interest, overdrafts or external payees.'],['BR-03 · Learning outcome','A participant can explain a feature, identify its requirement and find its test evidence.'],['Out of scope','Real authentication, real cash handling, bank connections, regulatory certification, production availability claims.'],['Acceptance approach','Complete the six feature walkthroughs, explain key error paths and trace FR-06 to design and test cases.']]),
S('Constraints and risks','One offline HTML file. No installation or network dependency. Example risk: learners may mistake a clickable prototype for a secure banking system. Response: distinguish implemented demo behaviour from proposed real-system controls throughout the guide. No business performance improvement is claimed without measurement.')]);
doc('srs','Software Requirements Specification (SRS)','requirements','Records what the software must do and the conditions it must satisfy.','Makes expected behaviour clear enough for design, development and verification.','Business analyst and technical lead collaborate; product owner, testers, security and operations review.','Baseline enough detail before implementing a feature. Update through reviewed changes, not silent edits.','Versioned requirements workspace; /requirements/SRS-001.','Expands the BRD; links to the FRD, designs, tests and RTM.','Give each requirement an ID → use observable language → define exceptions and limits → review feasibility and testability.',[
S('Worked example · SRS-001','System: Harbour Bank teaching simulator. Currency: SGD. Initial balances: current account 2,500.00 and savings account 1,000.00. Every reload or Reset demo returns to this starting point. All requirements below describe the local training model unless explicitly labelled real-system design.'),
S('Requirements register','Read each statement with its ID. IDs are reused in the designs and tests.', ['ID','Area','Requirement','Evidence link'],REQUIREMENTS),
S('Important assumptions','There is one fictional customer and two accounts. Balance means immediately available balance: no pending holds. The simulation commits synchronously in one tab and is not a test of distributed-system concurrency. Five-minute inactivity and a 30-second login lock are classroom rules, not universal banking standards.')]);
doc('frd','Functional Requirements Document (FRD)','requirements','Describes user actions, system responses and exception behaviour in detail.','Prevents the happy path from hiding important rules and failure cases.','Business analyst drafts with users; developers and testers check that behaviour is unambiguous.','After a feature is understood, before its detailed design and tests are finalised. Refine as questions arise.','The feature specification area; /requirements/FRD-001.','Uses SRS IDs and connects to UI flows, detailed design and test cases. Some organisations combine SRS and FRD.','Walk through a task → state preconditions → describe each response → cover failure and cancellation → define the result.',[
S('Worked example · FRD-001: Transfer','Precondition: learner is logged in. Starting example: current 2,500.00; savings 1,000.00. Actor chooses current → savings, enters 200.00 and selects Review. The review shows account names and amount; no money moves yet.'),
S('Main and alternative paths','', ['Step / condition','Required response'],[['Confirm valid review','Recheck session, account choices, amount and funds. Commit debit and credit together. Display a receipt and updated balances.'],['Cancel review','Return to the form; keep balances and completed history unchanged.'],['Same source and destination','Explain that two different accounts must be chosen.'],['Insufficient funds','Reject the request. Neither account changes.'],['Invalid format / limit','Explain the amount rule; do not create a completed transaction.'],['Repeated confirmation','A reviewed request commits once. Preparing a new transfer creates a new request.'],['Session expires before confirmation','End the session; discard the pending review; require login.']]),
S('Postconditions and companion functions','After the example succeeds, current is 2,300.00 and savings is 1,200.00. Combined funds remain 3,500.00. Login starts a simulated session; logout ends it. Balance is read-only. Deposit adds to one account; withdrawal subtracts without allowing an overdraft. The same review/cancel/confirm pattern applies to these operations.')]);
doc('backlog','User stories & acceptance criteria','requirements','A small set of user-focused features with explicit conditions for acceptance.','Helps a team deliver useful slices and discuss examples before building.','Product owner prioritises; analyst, developers, testers and users refine criteria.','During planning and refinement, before the story is implemented; update when scope is agreed to change.','A backlog board or versioned story list; /requirements/backlog.','Links business outcomes to FR IDs, test cases and the Definition of Done.','Describe the user and need → add concrete examples → separate acceptance criteria from implementation choices.',[
S('Worked example · US-06','As the fictional account holder, the customer needs to move money between owned accounts so the right account has funds available. Linked requirement: FR-06. Priority: essential for this learning case.'),
S('Acceptance examples','', ['Given','When','Then'],[['Current 2,500.00; savings 1,000.00; logged in','Confirm a 200.00 transfer','Current 2,300.00; savings 1,200.00; one receipt.'],['The same starting balances','Try to transfer 2,500.01','Clear rejection; no balance changes.'],['A valid transfer is being reviewed','Cancel','No completed transaction or balance change.'],['A session has ended','Try to confirm','Login required; the transfer does not execute.']]),
S('Definition of Done for the teaching increment','Acceptance cases checked; code reviewed; relevant regression tests run; labels and keyboard use checked; document links updated; known limitations stated. This checklist is an example for this increment, not a universal Scrum-mandated checklist.')]);
doc('rtm','Requirements Traceability Matrix (RTM)','testing','A map connecting requirements to designs, tests and recorded evidence.','Shows missing links and helps find what must be revisited after a change.','Analyst and test lead maintain it; product owner and technical lead review coverage and gaps.','Start when requirements receive IDs. Maintain throughout design, testing and change.','Shared quality workspace; /quality/RTM-001, with links to the controlled requirements.','Connects BRD → SRS / FRD → HLD / LLD → test cases → results / defects.','List requirement IDs → link designs and tests → record execution evidence separately → review missing and outdated links.',[
S('Worked example · RTM-001','The rows demonstrate traceability, not proof of execution. Test result links should be added after someone runs a named version in a stated environment.'),
S('Coverage links','', ['Requirement','Design / document','Test cases','Evidence status'],[['FR-01','UI-001 login; SECURITY-001','TC-01–03','Planned; record actual run results'],['FR-02','UI-001; session rules','TC-04–05','Planned'],['FR-03','DATA-001; UI-001 balances','TC-06','Planned'],['FR-04','LLD-001 amount rules','TC-07–09','Planned'],['FR-05','LLD-001; FRD-001','TC-10–11','Planned'],['FR-06','HLD-001; LLD-001; ADR-001','TC-12–15','Planned'],['BR-02','SRS-001 amount limit','TC-08,11,16','Planned'],['NFR-01','UI-001 accessibility','TC-17','Partial manual scope'],['NFR-02','RELEASE-001 offline package','TC-18','Planned'],['NFR-03','SECURITY-001; real-system architecture','Specialist design and security review','Not executable in offline demo']]),
S('Change example','If the maximum amount changes, follow BR-02 to the validation design, visible help, boundary tests and user guide. A test with no requirement link may expose a missing requirement or may have a legitimate non-functional purpose that needs to be recorded.')]);
doc('hld','High-Level Design (HLD)','design','Shows the main parts, responsibilities and connections of the proposed solution.','Lets different roles understand the whole service before discussing internal detail.','Architect or technical lead drafts; business, security, developers, testers and operations review.','After scope and major constraints are understood; revise when significant design assumptions change.','Architecture workspace; /design/HLD-001.','Connects SRS requirements to LLD, data design, interfaces and operational plans.','Draw system boundaries → name component responsibilities → explain data movement → identify risks and failure boundaries.',[
S('Worked example · HLD-001','Proposed real system: customer browser → trusted banking service → transactional ledger database. An identity service establishes identity; the banking service authorises every account action. An audit facility records important events without recording credentials.'),
S('Responsibility map','', ['Part','Responsibility','Important boundary'],[['Browser interface','Collect input; explain errors; show review and receipt','Input is untrusted; browser checks are not security enforcement.'],['Identity / session service','Authenticate and manage sessions','Real credentials and sessions require server controls.'],['Banking service','Authorise accounts; validate rules; manage idempotency','Does not trust account ownership claimed by the browser.'],['Ledger database','Commit balanced transfer entries and durable state','Atomicity and concurrency need a real transactional implementation.'],['Operations / audit','Observe failures and investigate events','Access, retention and monitoring need agreed policies.']]),
S('Offline implementation boundary','The supplied demo combines interface, rules and temporary ledger in one browser tab. It intentionally illustrates behaviour rather than this production architecture. Reload resets its state. It cannot demonstrate server security, durable storage, multi-user isolation or recovery guarantees.')]);
doc('lld','Low-Level Design (LLD)','design','Explains the detailed rules and processing needed to implement one component.','Reduces guesses about validation, ordering, exceptions and outcomes.','Developer or technical analyst drafts; technical lead and tester review.','Before or during implementation of a small feature; revise with reviewed behaviour changes.','Component design folder; /design/LLD-001.','Uses FRD behaviour and HLD responsibilities; feeds unit, integration and exception tests.','Choose one operation → define input rules → order the checks → state each failure result → specify successful state changes.',[
S('Worked example · LLD-001: Transfer','Input: source account ID, destination ID, decimal amount and a request identifier. The demo parses the amount to whole cents. The proposed real service obtains the actor from its trusted session, not from a submitted customer ID.'),
S('Processing rules','1. Require a valid session. 2. Check two different owned accounts. 3. Accept only a positive amount with no more than two decimal places and within the example limit. 4. Recheck available funds. 5. In a real service, atomically record debit and credit with an idempotency record. 6. Return a receipt. A failed check must not alter either balance.'),
S('Worked numbers and repeated requests','200.00 becomes 20,000 cents. Current 250,000 − 20,000 = 230,000; savings 100,000 + 20,000 = 120,000. The total stays 350,000 cents. In the demo, consuming a pending review prevents the same confirmation from running twice. This is not durable server idempotency or a concurrency guarantee.')]);
doc('data-model','Data dictionary & ledger model','design','Defines the information held by the system and the meaning of each field.','Prevents teams from using the same word or value in incompatible ways.','Data designer or developer drafts; analyst, security, testers and database specialists review.','During design, before data is exchanged or stored; update with schema changes.','Data design workspace; /design/DATA-001.','Supports HLD, API contracts, validation, tests, migration and recovery plans.','Identify entities → define fields and units → state relationships → record invariants and retention questions.',[
S('Worked example · DATA-001','Two account records belong to the same fictional customer. The UI displays SGD amounts; calculations use integer cents. Available and ledger balances are treated as equal because holds and pending transactions are outside this teaching scope.'),
S('Dictionary','', ['Field','Meaning','Example / rule'],[['account.id','Stable account identifier','current or savings; fixed demo accounts'],['account.balanceCents','Immediately available amount in SGD cents','250000 means SGD 2,500.00; never negative'],['transaction.id','Reference for a committed operation','HB-0001; unique within one demo run'],['transaction.type','Kind of operation','deposit, withdraw or transfer'],['transaction.amountCents','Positive amount being moved','20000; integer, maximum 1000000'],['transaction.source / destination','Relevant accounts','Transfer requires different owned accounts'],['transaction.createdAt','Time of completion','ISO timestamp, shown in local time to the learner']]),
S('Invariants and real-system extension','A transfer preserves the sum of the two customer balances. A deposit increases it; a withdrawal decreases it because the demo represents an external cash event. A real general ledger would also contain the balancing external/cash-side entries. Do not mistake this two-account teaching view for a complete banking accounting system.')]);
doc('api','Interface / API contract','design','An agreement about what one component sends to another and what responses mean.','Lets teams build and test interactions without guessing formats or failures.','Service developer drafts; consuming teams, testers and security review.','Agree before integrating components. Version breaking changes explicitly.','Interface specification workspace; /design/API-001.','Connects FRD behaviour, HLD components, data definitions and integration tests.','Name the operation → define inputs and identity context → describe successful and failed responses → cover retries.',[
S('Worked example · API-001 · proposed real service','A conceptual POST /transfers accepts sourceAccountId, destinationAccountId and amountCents. A request key identifies one intended transfer. Authentication comes from the real server-managed session. The offline demo does not expose or call an API.'),
S('Contract example','', ['Case','Response meaning'],[['Valid new request','201: receipt ID, committed amount and resulting balances.'],['Malformed amount or fields','400: validation error; no ledger change.'],['No valid session','401: authenticate again; no account operation.'],['Account not authorised','403: refuse access; no account details leaked.'],['Insufficient funds','409: request conflicts with current balance; no partial debit.'],['Repeat same key and same payload','Return the original committed outcome; do not debit again.'],['Repeat key with different payload','409: reject key reuse for a different request.']]),
S('How to read this document','HTTP status numbers describe the proposed interface, not a universal rule for every banking API. A real team must agree exact schemas, key lifetime, error handling, authentication and transaction semantics. Integration tests check both sides honour the contract.')]);
doc('ui','User Interface Requirements & screen flow (UIRD)','design','Shows the screens, navigation and information needed for each user task.','Makes behaviour understandable and reveals missing messages before implementation.','Designer or analyst drafts; representative users, testers and developers review.','Start while refining requirements. Validate with a prototype before treating a design as settled.','Design workspace; /design/UI-001, linked to the local banking demo.','Links FR-01–06 to screen states and acceptance tests.','Sketch the task → include errors and cancellation → identify labels and focus behaviour → check with users.',[
S('Worked example · UI-001','Login → account overview → choose Deposit, Withdraw or Transfer → enter details → Review → Confirm → Receipt → account overview. Logout is available while logged in. Balance is read-only; a receipt appears only after confirmation.'),
S('Screen rules','', ['Screen','What the user sees / can do'],[['Login','Clearly displayed training credentials; labelled fields; generic error; lock duration if applicable.'],['Overview / balance','Two named accounts, SGD balances, completed history and links to tasks.'],['Amount form','Account selector, amount rule, validation message and Review button.'],['Review','Explicit source/destination and amount; Confirm and Cancel.'],['Receipt','Reference, amount, operation and resulting balances.'],['Ended session','Login screen with a clear explanation; no pending confirmation.']]),
S('Accessibility checks','Use visible labels and keyboard-operable buttons. Put errors in a live status region and keep the entered values available for correction. Use text as well as colour for success and failure. Check narrow windows and enlarged text. A complete conformance claim requires a broader accessibility audit.')]);
doc('adr','Architecture Decision Record (ADR)','design','A short record of an important decision, its reasons and its consequences.','Preserves the reasoning so later teams do not repeat the same debate blindly.','Decision owner, usually technical lead or architect; affected specialists review.','Write when choosing among meaningful alternatives; supersede rather than silently rewrite history.','Versioned architecture decisions; /design/decisions/ADR-001.','Connects requirements and risks with HLD / LLD and later change reviews.','State the problem → list feasible options → choose with reasons → record consequences and review triggers.',[
S('Worked example · ADR-001: Represent money in integer cents','Status: accepted for this teaching implementation. Context: SGD has two decimal places in this case and the demo must reject fractional-cent input. Decision: parse validated decimal text into integer cents before arithmetic.'),
S('Options and consequences','Option A: general floating-point arithmetic with formatting at the end. Risk: intermediate rounding can obscure the intended monetary value. Option B: integer cents. Selected for this bounded SGD case because values and invariants are easy to inspect. Consequence: currency scale and limits must be explicit.'),
S('Review trigger','Reconsider this choice when adding currencies with different minor units, interest calculations requiring additional precision, or larger values. A real service may use a suitable decimal type and explicit rounding policy. The decision does not establish that all financial arithmetic should use the same representation.')]);
doc('threat-model','Security & threat assessment','design','A simple record of valuable information, possible misuse and the controls needed.','Brings security into design instead of treating it as a final checklist.','Security specialist and technical lead with analyst, operations and testers.','Start during requirements and design; revisit after new interfaces, data or threats are introduced.','Restricted design workspace in a real project; fictional sample /design/SECURITY-001.','Links security requirements to architecture, tests, operational controls and risk acceptance.','Identify assets → draw trust boundaries → describe misuse → choose controls → state remaining risk and evidence.',[
S('Worked example · SECURITY-001','Assets: account ownership, balances, transaction integrity and credentials. Trust boundary: a real browser is outside the trusted service. The supplied local demo contains visible training credentials and editable local state, so it cannot protect real assets.'),
S('Threats and controls for a real service','', ['Misuse / failure','Proposed control','Evidence needed'],[['Repeated password guessing','Suitable authentication controls, rate limiting and monitoring','Specialist review and controlled authentication tests'],['Changing an account ID','Server-side ownership checks on every account action','Authorisation tests across different customers'],['Repeated transfer request','Durable idempotency and atomic transactions','Retry, failure and concurrency tests'],['Session reused after logout','Server-side invalidation and appropriate session handling','Session lifecycle tests'],['Sensitive information in logs','Data minimisation, access control and redaction','Log review and access tests']]),
S('Teaching rule versus production policy','Three failures, a 30-second lock and a five-minute idle timeout are illustrative demo settings. A real bank must determine suitable controls with security, business and regulatory specialists. The local timer and visible password are behaviour demonstrations only.')]);
doc('development-plan','Development work plan','development','Breaks the feature into small, reviewable implementation tasks.','Makes dependencies and completion evidence visible without turning estimates into guarantees.','Technical lead and developers with testers and product owner.','Plan each increment after sufficient refinement; adjust with evidence.','Project board or versioned implementation plan; /development/PLAN-001.','Uses the backlog and designs; produces changes, tests and build records.','Choose a small outcome → identify tasks and dependencies → assign owners → define evidence for completion.',[
S('Worked example · PLAN-001','Increment: transfer between the two owned accounts. Sequence: establish amount validation, account selection, review state, commit rules, receipt and regression checks. Keep UI behaviour and money rules independently understandable.'),
S('Work items','', ['Task','Owner role','Completion evidence'],[['Validate amount text and limits','Developer','Boundary and invalid-input checks'],['Review and cancel flow','UI developer / reviewer','No state change before confirmation'],['Transfer commit and receipt','Developer','Conservation and duplicate-confirmation checks'],['Connect requirements to tests','Tester / analyst','Updated FR-06 traceability row'],['Document limitations','Technical lead','Real-system gaps visible in HLD and guide']]),
S('Working agreements','Use meaningful version-control messages. Review changes before release. Do not log credentials. Separate configuration from rules. Revisit an unclear requirement rather than guessing. Choose tools for their function: editor/IDE, version control, test tools, debugger and profiler have different jobs.')]);
doc('code-review','Review checklist & Definition of Done','development','A compact quality agreement and a record of review observations.','Avoids confusing “written” with “ready for the agreed increment”.','Technical lead maintains criteria; peer reviewer, tester and product owner contribute.','Agree before completion is claimed; apply to each relevant change.','Change review record; /development/REVIEW-001.','Uses acceptance criteria and coding standards; supports test and release decisions.','Check behaviour → inspect clarity and risks → record findings → resolve or explicitly defer them → attach evidence.',[
S('Worked example · REVIEW-001','Change: FR-06 transfer implementation. Review questions: Are amount values integers in cents? Can source and destination match? Does cancellation leave state unchanged? Is confirmation consumed once? Can a logged-out user execute a transaction?'),
S('Completion criteria','Required examples checked; no unresolved critical finding; source readable; error paths explained; affected document and test links updated; known demo limitations stated. “Done” for the teaching increment does not mean a secure production banking system exists.'),
S('Example observation','Finding: a confirmation handler could reuse a pending request. Action: clear the pending request as part of the synchronous commit and ignore a confirmation without an active request. Evidence: run TC-15. Status in a real review record must be completed by the reviewer, not assumed from this example.')]);
doc('build-record','Build & configuration record','development','Identifies exactly which source and settings produced a deliverable.','Allows others to reproduce, test or investigate the same version.','Build owner or release engineer; tester and release lead verify the artifact identity.','Create for each candidate release. Update by producing a new record, not relabelling a different file.','Release workspace; /releases/BUILD-001, alongside artifact checksum and change list.','Connects reviewed source to test runs and deployment evidence.','Record version → identify source and artifact → list relevant settings → check dependencies → attach verification.',[
S('Worked example · BUILD-001','Product: SDLC Field Guide / Harbour Bank teaching demo. Package: one self-contained HTML file. Build approach: embed local content, styles and JavaScript. Runtime dependency: a modern browser with JavaScript enabled. No server, installation, external font or CDN is required.'),
S('Configuration','Starting balances: current 250000 cents, savings 100000 cents. Limit: 1000000 cents per operation. Login: learner / Learn123!. Idle timeout: five minutes. Failed-login lock: three failures for thirty seconds. These are documented training rules.'),
S('Evidence to record for a real release','Record the actual source revision, filename, checksum, build time, browser versions and test run reference. Do not invent those values. An artifact with changed source needs a new identity and suitable checks.')]);
doc('test-plan','Test plan','testing','Explains what will be tested, why, how and with which data and environments.','Directs effort towards important risks and makes untested areas visible.','Test lead with developers, product owner and relevant specialists.','Begin during requirements. Refine as the design and executable system become available.','Quality workspace; /quality/TEST-PLAN-001.','Uses SRS, risks and design; leads to test cases, results, defects and a summary.','Set scope → rank risks → choose test levels and data → define evidence and exit criteria → record exclusions.',[
S('Worked example · TEST-PLAN-001','Goal: evaluate the local banking behaviour and the offline learning guide. Priority risks: incorrect money movement, unintended confirmation, unauthenticated operations, confusing errors and offline failure. Target current desktop browsers and a narrow viewport.'),
S('Approach','Review requirements and documents first. Check parsing and state-change rules at unit scope; review/confirm/session interactions at integration scope; complete user journeys at system scope. Use normal, boundary, invalid, cancellation and repetition cases. Record the browser, version, starting state and actual result.'),
S('Exit and exclusions','Exit proposal: essential demo journeys work, no unresolved critical money-rule defect, documentation agrees with behaviour, and known limitations are visible. Excluded: real bank integration, production authentication, durable storage, multi-user concurrency, penetration testing and regulatory validation. These exclusions prevent overstating the evidence.')]);
doc('test-cases','Test cases & execution sheet','testing','Repeatable checks with preconditions, actions and expected results.','Lets another person reproduce the same check and compare observations.','Tester or developer drafts; requirement owner reviews expected behaviour.','Write examples during refinement; execute against an identified version; rerun affected checks after change.','Quality workspace; /quality/TC-001; attach actual result, status and evidence for each run.','Each test links to SRS / FRD IDs and appears in the RTM.','Reset known data → follow one case → compare actual and expected → record result → link any defect.',[
S('Worked example · 18 test cases','These are executable teaching cases, not pre-filled claims of success. Unless stated otherwise, use Reset demo, then log in. Reset between independent cases. For parameterised inputs, record each input separately.'),
S('Cases','', ['ID','Requirement','Precondition','Action','Expected result'],TESTS),
S('Execution record format','For each run record: test ID; artifact/version; date/time; browser; actual input; actual result; Pass/Fail/Blocked/Not run; evidence reference; defect ID if applicable. Do not enter Pass simply because a linked test exists.')]);
doc('defect','Defect report','testing','A precise description of unexpected behaviour and how to reproduce it.','Reduces investigation time and separates evidence from opinion.','The person finding the issue records it; developer and tester investigate; product owner helps prioritise.','Create when behaviour differs from an agreed expectation; update through investigation, fix and confirmation.','Issue tracker; /quality/DEF-001 with controlled reproduction data.','Links a requirement, failed test, affected version and eventual fix.','State conditions → list steps → compare expected and actual → attach relevant evidence → assess impact.',[
S('Worked example · DEF-001 · hypothetical defect','Title: transfer is recorded twice when the same confirmation is processed twice. This is a deliberately hypothetical report for practice, not a claim that the supplied demo has this defect. Linked items: FR-06 and TC-15.'),
S('Reproduction and impact','Starting balances: 2,500.00 / 1,000.00. Review a 200.00 transfer. Process the same confirmation twice in the defective version. Expected: 2,300.00 / 1,200.00 and one receipt. Hypothetical actual: 2,100.00 / 1,400.00 and two receipts. Impact: the customer moves more money than intended. Proposed severity: high; priority requires the release owner’s decision.'),
S('Evidence and workflow','Attach the exact version, timestamps, steps and sanitised event evidence. Lifecycle: New → Triaged → In progress → Ready for retest → Confirmed fixed / Reopened. After a fix, rerun TC-15 plus relevant transfer regression tests. Severity describes impact; priority describes scheduling.')]);
doc('test-summary','Test summary & release recommendation','testing','Summarises the evidence, failures, gaps and remaining risk of a test cycle.','Helps decision-makers understand readiness without reading every log.','Test lead prepares; product owner, release lead and specialists review their risks.','At the end of a test cycle and whenever material evidence changes.','Quality/release workspace; /quality/SUMMARY-001.','Uses execution records, RTM and defects; informs UAT and deployment decisions.','Identify version and scope → summarise actual results → list gaps and defects → state recommendation and conditions.',[
S('Worked example · SUMMARY-001 · illustrative reporting exercise','Hypothetical cycle: 18 cases planned; 15 passed, 1 failed, 1 blocked, 1 not run. These figures demonstrate report structure; they are not measured results for this file. The hypothetical failure is TC-15, linked to DEF-001.'),
S('Recommendation','Do not release the hypothetical defective version for participant demonstrations until the repeated-confirmation defect is corrected and relevant tests are rerun. Resolve the blocked test environment and decide explicitly whether the unrun case is required before release.'),
S('Residual risk','Even a fully passing local test cycle would not establish production banking security, concurrency or recovery. Record what was actually tested and the basis for each recommendation. Keep product acceptance separate from a claim that every possible defect is absent.')]);
doc('uat','User Acceptance Test (UAT) record','testing','Records whether intended users can complete agreed tasks and accept the outcomes.','Checks fitness for the agreed use, not just internal technical correctness.','Business representative or product owner coordinates; representative users execute; testers support.','After a sufficiently stable candidate exists and before the relevant acceptance decision.','Acceptance workspace; /quality/UAT-001 with participant observations.','Uses business outcomes, user stories and acceptance criteria; informs release approval.','Choose representative tasks → observe completion → capture confusion and outcomes → resolve issues → record the decision.',[
S('Worked example · UAT-001','Scenario A: log in, find the available current balance and explain what it means. Scenario B: transfer 200.00 to savings and identify the receipt. Scenario C: cancel a withdrawal and verify that funds did not move. Scenario D: log out and explain how access changes.'),
S('Acceptance questions','Can the learner distinguish Review from Confirm? Can they explain a rejected amount? Can they locate the requirement and test for a transfer? Does the training-only status remain clear? Record observed difficulties, not just whether the learner eventually succeeded.'),
S('Decision record','Example fields: candidate version, task outcomes, usability observations, outstanding issues, accept/accept with conditions/reject, decision owner and date. These are to be completed after a real session. Beta feedback is useful but does not replace explicitly agreed acceptance criteria.')]);
doc('deployment-plan','Deployment checklist & rollback plan','deployment','A repeatable sequence for introducing a version, checking it and recovering if needed.','Prevents release knowledge from existing only in one person’s memory.','Release lead coordinates; operations, developers, testers and business representatives verify their actions.','Prepare before release; rehearse significant changes; complete evidence during execution.','Controlled release workspace; /releases/DEPLOY-001.','Uses build identity, test summary, UAT and operational guidance.','Confirm readiness → preserve prior version → introduce the candidate → run smoke checks → decide continue or recover.',[
S('Worked example · DEPLOY-001: Offline guide','1. Identify the exact HTML file and record its checksum. 2. Preserve the previous accepted file. 3. Open the candidate with network disabled. 4. Confirm all guide sections, a worked document and a transfer can be opened and completed respectively. 5. Check the training labels. 6. Share that checked file through the agreed participant channel.'),
S('Smoke checks and recovery','Smoke checks: open the guide, log in, view balances, cancel an operation, complete a transfer and log out. If an essential check fails, stop distribution and restore the previous checked file. Tell participants which file replaces the faulty version. Local demo data is disposable and resets on reload.'),
S('Real-system distinction','A real banking release needs controlled access, server configuration, database compatibility, monitoring and tested recovery. Reverting an application does not automatically reverse data changes. Choose recreate, rolling, blue/green or a staged approach according to actual service needs.')]);
doc('release-notes','Release notes','deployment','A reader-friendly description of what a release includes, changes and limits.','Helps users and support teams understand the version they have received.','Product or release owner drafts; developers, testers and support verify accuracy.','Prepare with each release and update only by publishing a corrected version.','Release package and support knowledge base; /releases/RELEASE-001.','Summarises the build, accepted changes, known issues and user guidance.','Name the version → list user-visible capabilities → state limits → explain how to start and get support.',[
S('Worked example · RELEASE-001 · teaching release 1.0','Included: six lifecycle stage guides; a worked document library; course concept notes; self-checks; fictional banking pages for login/logout, balances, deposits, withdrawals and transfers; local search and in-page document reading.'),
S('How to use','Open the single HTML file in a modern browser. Use the guide navigation or search. The banking page shows the training credentials. Keep the file together as one file when sharing; no companion folder is required.'),
S('Known boundaries','The bank is a simulation. Data lives only in the current tab and resets on reload. There is no real customer identity, backend service, cash operation or bank connection. Source-reference websites require internet, but the guide and demo do not. A browser preview inside an email application may block scripts; open the guide in a full browser.')]);
doc('user-guide','Participant & demo user guide','deployment','Step-by-step instructions for completing the user’s tasks.','Allows a learner to use the product independently and recover from common mistakes.','Trainer or technical writer drafts; representative learners verify the instructions.','Write as the interface stabilises; update whenever labels or workflows change.','Inside the participant guide; /help/USER-001 in the example project.','Uses the FRD and UI specification; informs usability and UAT checks.','Describe prerequisites → show the shortest successful path → explain errors and cancellation → state reset behaviour.',[
S('Worked example · USER-001','Open Banking demo. Sign in with learner and Learn123!. The overview shows current SGD 2,500.00 and savings SGD 1,000.00 on a fresh run. Choose Balance to inspect them without changing funds.'),
S('Complete the tasks','Deposit: choose an account, enter 75.25, review and confirm. Withdraw: choose an account and a valid amount within its balance. Transfer: choose different source and destination accounts, enter 200.00, review and confirm. Cancel leaves funds unchanged. A successful confirmation creates a receipt and history entry.'),
S('Troubleshooting and reset','Amounts must be positive SGD values with no more than two decimal places and at most 10,000.00. If funds are insufficient, lower the amount or choose another account. After three wrong logins, wait thirty seconds or Reset demo. Logout ends the session but keeps this tab’s balances. Reload or Reset demo restores the starting state.')]);
doc('operations','Operations runbook','maintenance','Practical instructions for recognising and responding to service problems.','Makes support actions consistent and identifies when to escalate.','Operations or support lead maintains it with developers and security.','Prepare before handover; update after incidents and important changes.','Support workspace; /operations/RUNBOOK-001 with access appropriate to its content.','Uses deployment guidance, architecture, monitoring and incident records.','Describe normal behaviour → list symptoms → define safe checks → name escalation paths → record recovery evidence.',[
S('Worked example · RUNBOOK-001: Training support','Normal: the file opens offline; initial balances appear after login; a confirmed transfer preserves combined funds. If the interface is blank, check that the local file is complete and opened in a browser with JavaScript enabled.'),
S('Symptom and response','', ['Symptom','Safe response'],[['Forgotten training credentials','Read the credentials shown on the demo login screen.'],['Unexpected demo balances','Inspect transaction history; Reset demo for a clean exercise.'],['Repeated login rejected','Check the 30-second classroom lock and exact credentials.'],['Source website cannot open offline','Use the included explanation; consult the optional source later online.'],['Reported money-rule defect','Record version, exact steps, starting balances and actual results; stop using the affected exercise until reviewed.']]),
S('Real service extension','A real runbook also needs authorised on-call contacts, service indicators, alerts, dependency checks and tested recovery actions. Never silently modify customer records as a workaround. Escalation, audit and reconciliation procedures must be agreed before operation.')]);
doc('dr-plan','Availability & disaster recovery plan','deployment','Explains how a service remains available and how it is restored after serious disruption.','Separates handling an individual failure from recovering after a major event.','Operations/reliability lead with business owner, database specialists and security.','Define needs during design; rehearse before reliance on the service and after material change.','Controlled operations workspace; /operations/DR-001.','Connects business service needs to architecture, backup, recovery tests and incident management.','Agree acceptable interruption and data loss → design controls → rehearse restoration → verify data and record evidence.',[
S('Worked example · DR-001','For this disposable training demo, recovery is reopening the original checked file and starting with fresh balances. There is no promise of retaining demo transactions. Keep a separate copy of the checked file for redistribution.'),
S('Real-system design questions','High availability asks how service continues when a component fails. Disaster recovery asks how service is restored after a more serious event. RTO is the target restoration time; RPO is the target maximum loss of recent data, expressed as time. Business owners must agree suitable values; none are invented here.'),
S('Rehearsal evidence','For a real ledger, restore into a controlled environment, verify access and data integrity, reconcile relevant records and record elapsed recovery time against the agreed target. A successful backup job alone is not evidence that restoration works.')]);
doc('change-request','Change request & impact assessment','maintenance','Describes a proposed change, its reasons, consequences and decision.','Prevents a seemingly small edit from creating inconsistent rules across the system.','Requester and analyst describe the need; product owner decides priority with technical, testing and operations input.','Before changing an agreed baseline or service behaviour; update with the decision and outcome.','Change register; /maintenance/CR-001, linked to affected requirements and releases.','Uses RTM to identify impacted design, tests, user guidance and operational controls.','State the need → identify affected items → estimate effort and risks → decide → verify and communicate.',[
S('Worked example · CR-001 · proposed only','Proposal: allow transfers up to SGD 15,000.00 for an approved future scenario. Reason: demonstrate impact analysis for a new business limit. Current implemented limit remains SGD 10,000.00. This proposal has not been accepted or implemented.'),
S('Impact map','Affected items: BR-02 and SRS-001; amount validation in LLD-001; UI-001 help text; TC-11 and TC-16 boundaries; USER-001; release notes. Consider whether deposit and withdrawal limits should change too rather than accidentally changing every operation.'),
S('Decision and evidence','Decision fields: approved/rejected/deferred, accountable owner, reasons, planned version and conditions. Before release, test new boundaries, previous ordinary amounts, insufficient funds and invalid input. Communicate the exact operation-specific rule and update traceability.')]);
doc('incident','Incident record & learning review','maintenance','Records a service disruption, response and the actions needed to reduce recurrence.','Separates restoring service from understanding and improving the underlying system.','Incident lead coordinates; support, developers, operations and business representatives contribute.','Record during response; hold a review once service is stable and useful evidence is available.','Incident workspace; /operations/INC-001 with appropriate access and evidence retention.','Links monitoring, runbooks, defects, changes and verification of follow-up actions.','Record impact and timeline → stabilise service → analyse contributing conditions → assign actions → verify completion.',[
S('Worked example · INC-001 · fictional exercise','Scenario: a newly distributed training file prevents a transfer after review. Impact: learners cannot complete the transfer exercise. Detection: a participant reports the exact steps. Immediate response: reproduce safely, pause use of that version and provide the previous checked file.'),
S('Timeline and learning','Record actual timestamps rather than estimating a convenient sequence: report received, issue reproduced, distribution paused, replacement issued and recovery confirmed. Analyse why the release check missed the review-to-confirm path. Avoid blaming an individual instead of examining the conditions.'),
S('Follow-up actions','Release owner adds the complete transfer journey to smoke checks. Tester adds the missed condition to regression coverage. Writer clarifies version identification. Each action needs an owner, due date and evidence of effectiveness, not just a statement that a meeting occurred.')]);
doc('maintenance-plan','Maintenance & support plan','maintenance','Organises ongoing correction, adaptation, improvement and eventual retirement.','Keeps the service useful while protecting existing behaviour and controlling change.','Product owner and support lead with developers, testers and operations.','Prepare before handover and review as needs, risks and dependencies evolve.','Service workspace; /maintenance/MAINT-001.','Uses feedback, incidents, dependency information, change requests and release evidence.','Collect needs → classify and prioritise → assess impact → schedule and verify → observe the result.',[
S('Worked example · MAINT-001','Corrective: fix a discovered validation defect. Adaptive: update the guide for a changed browser behaviour. Perfective: make document navigation easier. Preventive: remove a known latent fault before it causes a user-visible failure. One change may have more than one motivation.'),
S('Service routine','Review learner feedback after each course delivery. Triage defects by impact. Recheck the six core demo tasks after a relevant change. Review source references before republishing substantial technical guidance. Keep the prior checked guide available during a new release.'),
S('Retirement and cost','When replacing the guide, identify the replacement and communicate which version to use. Maintenance effort depends on change demand, understandable structure, tests, documentation and available skills. The presentation’s 55/45 cost chart is illustrative, not a budget rule.')]);
doc('mrd','Market Requirements Document (MRD)','requirements','Describes the target users, their problems and the evidence behind a proposed opportunity.','Avoids assuming that an attractive feature is needed by the intended audience.','Product researcher or product manager; users, business owner and analyst review.','During discovery, before prioritising a product opportunity; update when research changes the understanding.','Discovery workspace; /requirements/MRD-001.','Informs the BRD and PRD; evidence and assumptions should remain distinguishable.','Define audience → gather observations → describe unmet needs → distinguish evidence from hypotheses → recommend next research.',[
S('Worked example · MRD-001','Audience: adult learners new to software delivery. Hypothesis: linking a familiar banking task to the documents behind it will make SDLC concepts easier to understand. This is a teaching hypothesis, not a claim of completed market research.'),
S('Research plan','Observe learners explaining a transfer before and after using the guide. Ask which documents they would consult for a rule, a design decision and a test. Collect consent-based feedback without requesting real banking details. Record actual observations and disagreements rather than inventing favourable statistics.'),
S('Opportunity and boundary','Proposed opportunity: a self-help guide with familiar tasks, short explanations and worked documents. Success needs evidence from learners. This document does not define a production bank’s market, prices or commercial demand.')]);
doc('prd','Product Requirements Document (PRD)','requirements','Brings the product goal, intended users, feature scope and release priorities together.','Helps people understand what the product should achieve and what belongs in the next version.','Product manager or product owner with analyst, design, engineering and support.','During product definition and refinement; update when priorities or agreed scope change.','Product workspace; /requirements/PRD-001.','Uses BRD / MRD input and links features to SRS / FRD and acceptance evidence.','Describe users and goal → define essential journeys → prioritise scope → state exclusions and acceptance.',[
S('Worked example · PRD-001','Product: SDLC Field Guide. Goal: help a non-technical participant connect lifecycle concepts to a working fictional banking journey. Essential journeys: read a stage, understand a document, trace a feature, use the demo and check understanding.'),
S('First-release priorities','Essential: all six banking tasks; all six lifecycle stages; clear document guidance; local search; explicit simulation limits. Included support: glossary, worked test cases and course self-checks. Public version: GitHub Pages and optional star/feedback links. No in-site download or export controls.'),
S('Out of scope and acceptance','No real bank account, payments, backend login, saved customer records or completion certificate. Acceptance requires coherent document links, usable demo journeys and understandable error messages. Learner feedback informs later improvements rather than adding every possible feature now.')]);
doc('crd','Customer Requirements Document (CRD)','requirements','Records a particular customer group’s needs and constraints in its own context.','Separates the customer’s intended outcome from an assumed technical solution.','Business analyst with the customer representative; product owner and testers review.','During customer discovery and clarification; update when that customer’s agreed needs change.','Customer requirements workspace; /requirements/CRD-001.','Feeds BRD, SRS, FRD and acceptance scenarios. Organisations may combine these records.','Describe the customer task → capture needs and exceptions → confirm interpretation → translate into verifiable requirements.',[
S('Worked example · CRD-001','Customer persona: a fictional account holder who wants to understand available money and move it between owned accounts. Needs: see clear balances, review an operation before committing, understand rejection and receive a reference after success.'),
S('Customer statements clarified','“Show my money” becomes separate named account balances in SGD. “Move it safely” becomes review, confirmation, no partial transfer and an explicit rejection when funds are insufficient. “Stop when finished” becomes logout and requiring a new session before account actions.'),
S('Confirmation','Review normal and failed scenarios with a representative customer. Record questions and decisions, especially where the customer’s wording is subjective. The fictional persona and statements here are examples, not an interview transcript or signed customer agreement.')]);
doc('quality-requirements','Quality Requirements Document (QRD)','requirements','Specifies qualities such as clarity, integrity, accessibility and compatibility under stated conditions.','Makes quality expectations observable instead of relying on words such as “good” or “reliable”.','Analyst with testers, users, security and relevant technical specialists; business owner agrees priorities.','Define during requirements and refine with the design; revisit when service conditions change.','Requirements workspace; /requirements/QRD-001.','Connects non-functional requirements to UI design, architecture and suitable tests.','Name the quality → describe the conditions → state the expected evidence → distinguish target from achieved result.',[
S('Worked example · QRD-001','Q-01 Clarity: amount fields identify SGD and valid limits; rejected input produces text explaining the correction. Q-02 Integrity: cancelling or rejecting a request leaves balances unchanged; a transfer preserves the combined customer balance.'),
S('Accessibility and compatibility','Q-03 Interaction: essential controls have labels, are reachable by keyboard and have visible focus. Status is expressed in words, not only colour. Q-04 Packaging: a local copy works with network access disabled and no supporting asset files. Verify on named browser versions during testing.'),
S('What remains a real-project decision','Production response-time, availability, recovery and security targets depend on workload and business needs. Record measurable values with those conditions before making a claim. The local demo cannot prove production availability, server security or full accessibility conformance.')]);
doc('technical-requirements','Technical Requirements Document (TRD)','requirements','Records required technical constraints and interfaces without confusing them with arbitrary preferences.','Helps the design satisfy genuine environmental limits and makes assumptions visible.','Technical analyst or lead with operations, security and the requirement owner.','During requirements and design, before committing to incompatible tools or interfaces.','Requirements/design workspace; /requirements/TRD-001.','Uses SRS constraints and informs HLD, LLD, API contracts and build configuration.','Record the constraint → explain its reason → identify verification → separate mandatory needs from proposed choices.',[
S('Worked example · TRD-001','T-01: the guide is self-contained HTML with embedded styles, content and browser logic. T-02: no external runtime libraries, fonts, servers or API calls are required for the learning experience. T-03: represent the bounded SGD demo amounts in integer cents.'),
S('Environment and persistence','T-04: use a modern browser with JavaScript enabled. T-05: keep banking state only in memory; reload resets it. Theme preference may use local storage when permitted, with a safe fallback when unavailable. Public hosting serves the same static content through GitHub Pages.'),
S('Design boundary','These constraints apply to the educational product. A real bank needs a different technical specification covering trusted services, durable ledger storage, security controls, integrations, monitoring and recovery. Do not reuse the single-file architecture as a production banking design.')]);

</script><script>
const bank={loggedIn:false,accounts:{current:250000,savings:100000},history:[],pending:null,failures:0,lockUntil:0,lastActive:0,tab:'overview',message:'',kind:'',form:{amount:'',source:'current',destination:'savings'}};
const money=c=>'SGD '+(c/100).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});
const accountName=id=>id==='current'?'Current account':'Savings account';
function amountToCents(raw){const s=String(raw).trim();if(!/^\d+(\.\d{1,2})?$/.test(s))throw Error('Enter a positive amount using digits and no more than two decimal places.');const [w,f='']=s.split('.');const n=Number(w)*100+Number(f.padEnd(2,'0'));if(!Number.isSafeInteger(n)||n<1||n>1000000)throw Error('Enter an amount from SGD 0.01 to SGD 10,000.00.');return n;}
function validSession(touch=false){if(bank.loggedIn&&Date.now()-bank.lastActive>=300000){bank.loggedIn=false;bank.pending=null;bank.message='The training session timed out. Log in again to continue.';bank.kind='error';}if(bank.loggedIn&&touch)bank.lastActive=Date.now();return bank.loggedIn;}
function validateOperation(type,source,destination,raw){if(!validSession())throw Error('Log in before using account operations.');if(!['deposit','withdraw','transfer'].includes(type))throw Error('Choose a valid operation.');if(!Object.hasOwn(bank.accounts,source))throw Error('Choose an available account.');const cents=amountToCents(raw);if(type==='transfer'&&(!Object.hasOwn(bank.accounts,destination)||source===destination))throw Error('Choose two different accounts for a transfer.');if(type!=='deposit'&&cents>bank.accounts[source])throw Error('Insufficient funds. Choose an amount within the available balance.');return cents;}
function prepareOperation(type,source,destination,raw){const cents=validateOperation(type,source,destination,raw);bank.pending={type,source,destination,cents,key:`review-${Date.now()}-${Math.random().toString(36).slice(2)}`};bank.lastActive=Date.now();bank.message='';bank.kind='';return {type,amount:money(cents),source:accountName(source),destination:type==='transfer'?accountName(destination):null};}
function confirmOperation(){if(!bank.pending)throw Error('No active review to confirm. Start a new operation.');const p=bank.pending;validateOperation(p.type,p.source,p.destination,(p.cents/100).toFixed(2));const updated={...bank.accounts};if(p.type==='deposit')updated[p.source]+=p.cents;else updated[p.source]-=p.cents;if(p.type==='transfer')updated[p.destination]+=p.cents;if(!Object.values(updated).every(n=>Number.isSafeInteger(n)&&n>=0))throw Error('The operation would exceed this simulation’s supported balance range.');const row={id:`HB-${String(bank.history.length+1).padStart(4,'0')}`,type:p.type,source:p.source,destination:p.type==='transfer'?p.destination:null,cents:p.cents,time:new Date().toISOString(),balances:{...updated}};bank.pending=null;bank.accounts=updated;bank.history.unshift(row);bank.lastActive=Date.now();bank.tab='receipt';bank.message='';bank.kind='';return row;}
function resetBank(){Object.assign(bank,{loggedIn:false,accounts:{current:250000,savings:100000},history:[],pending:null,failures:0,lockUntil:0,lastActive:0,tab:'overview',message:'Demo reset. Starting balances have been restored.',kind:'success',form:{amount:'',source:'current',destination:'savings'}});}
function bankNotice(){return bank.message?`<p class="${bank.kind||'hint'}" role="status">${esc(bank.message)}</p>`:'';}
function loginBank(username,password){if(Date.now()<bank.lockUntil)throw Error(`Training login is locked. Try again in ${Math.ceil((bank.lockUntil-Date.now())/1000)} seconds.`);if(username!=='learner'||password!=='Learn123!'){bank.failures++;if(bank.failures>=3){bank.lockUntil=Date.now()+30000;bank.failures=0;throw Error('Three unsuccessful attempts. Training login is locked for 30 seconds.');}throw Error('The username or password is incorrect. Use the training credentials shown below.');}bank.loggedIn=true;bank.lastActive=Date.now();bank.failures=0;bank.lockUntil=0;bank.tab='overview';bank.message='';bank.kind='';}
function renderBank(){validSession();const titles={overview:'Account overview',balance:'Check balance',deposit:'Deposit funds',withdraw:'Withdraw funds',transfer:'Transfer funds',receipt:'Transaction receipt'};let inner='';
if(!bank.loggedIn)inner=`<div class="bank-grid"><form id="login-form"><h2 style="margin-top:0">Welcome to Harbour Bank</h2><p>Sign in to the fictional banking demo.</p>${bankNotice()}<label for="username">Training username</label><input id="username" name="username" autocomplete="off" required><label for="password">Training password</label><input id="password" name="password" type="password" autocomplete="off" required><div class="actions"><button class="btn" type="submit">Log in</button></div><p class="hint">Use <strong>learner</strong> / <strong>Learn123!</strong><br>These are public training values, not real credentials.</p></form><aside class="callout"><h3>Try the complete journey</h3><ol><li>Check the two starting balances.</li><li>Transfer SGD 200.00 from current to savings.</li><li>Read the receipt and updated balances.</li><li>Log out and try accessing an account.</li></ol><a href="#/doc/user-guide">Read the step-by-step guide</a></aside></div>`;
else if(bank.pending){const p=bank.pending;inner=`<h2 style="margin-top:0">Review ${esc(p.type)}</h2>${bankNotice()}<p>No funds move until confirmation.</p><dl class="doc-meta"><div><dt>Operation</dt><dd>${esc(p.type)}</dd></div><div><dt>Amount</dt><dd>${money(p.cents)}</dd></div><div><dt>${p.type==='deposit'?'To account':'From account'}</dt><dd>${accountName(p.source)}</dd></div>${p.type==='transfer'?`<div><dt>To account</dt><dd>${accountName(p.destination)}</dd></div>`:''}</dl><div class="actions"><button class="btn" id="confirm-operation">Confirm ${esc(p.type)}</button><button id="cancel-operation">Cancel</button></div><p class="hint">Related: <a href="#/doc/frd">FRD behaviour</a> · <a href="#/doc/lld">Detailed rules</a> · <a href="#/doc/test-cases">Test cases</a></p>`;}
else if(['deposit','withdraw','transfer'].includes(bank.tab)){const type=bank.tab;inner=`<h2 style="margin-top:0">${titles[type]}</h2><p class="hint">${type==='transfer'?'Transfers move funds between your two owned accounts.':'This records a simulated cash event; no real money is deposited or withdrawn.'}</p>${bankNotice()}<form id="operation-form"><label for="source">${type==='deposit'?'Deposit to':'From account'}</label><select id="source" name="source">${['current','savings'].map(a=>`<option value="${a}" ${bank.form.source===a?'selected':''}>${accountName(a)} · ${money(bank.accounts[a])}</option>`).join('')}</select>${type==='transfer'?`<label for="destination">To account</label><select id="destination" name="destination">${['savings','current'].map(a=>`<option value="${a}" ${bank.form.destination===a?'selected':''}>${accountName(a)}</option>`).join('')}</select>`:''}<label for="amount">Amount (SGD)</label><input id="amount" name="amount" inputmode="decimal" autocomplete="off" placeholder="200.00" value="${esc(bank.form.amount)}" aria-describedby="amount-help" required><p class="hint" id="amount-help">SGD 0.01–10,000.00, at most two decimal places. No fees or overdraft.</p><button class="btn" type="submit">Review ${type}</button></form>`;}
else if(bank.tab==='receipt'&&bank.history.length){const r=bank.history[0];inner=`<div class="receipt"><span class="badge">COMPLETED · SIMULATION</span><h2>Transaction ${r.id}</h2><p>${esc(r.type)} · <strong>${money(r.cents)}</strong></p><p>${r.type==='deposit'?'To':'From'} ${accountName(r.source)}${r.destination?' → '+accountName(r.destination):''}</p><p class="hint">${new Date(r.time).toLocaleString()}</p>${balances(r.balances)}<div class="actions"><button class="btn" data-bank-tab="overview">Back to overview</button></div></div>`;}
else inner=`<h2 style="margin-top:0">${titles[bank.tab]||titles.overview}</h2>${bankNotice()}${balances(bank.accounts)}<h3>Completed transactions</h3>${bank.history.length?table(['Reference','Operation','Amount','Accounts','Time'],bank.history.map(r=>[r.id,r.type,money(r.cents),`${accountName(r.source)}${r.destination?' → '+accountName(r.destination):''}`,new Date(r.time).toLocaleTimeString()])):'<p class="empty">No completed transactions in this demo run. A review or cancellation does not create a completed transaction.</p>'}`;
return `<div class="eyebrow">Interactive case study</div><h1>Harbour Bank demo</h1><p class="lede">Explore the screens. Check the rules. Follow the evidence back to the documents.</p><div class="bank"><div class="bank-top"><span class="bank-brand">Harbour Bank</span><span>Fictional training service</span></div><div class="demo-note">SIMULATION ONLY · No bank connection · This tab’s balances reset when the file reloads.</div>${bank.loggedIn?`<nav class="bank-tabs" aria-label="Banking pages">${['overview','balance','deposit','withdraw','transfer'].map(t=>`<button data-bank-tab="${t}" aria-current="${bank.tab===t}">${titles[t]}</button>`).join('')}<button id="bank-logout">Log out</button></nav>`:''}<div class="bank-body">${inner}</div></div><div class="actions no-print"><button id="reset-bank">Reset demo</button>${bank.loggedIn?'<button id="expire-bank">Simulate timeout</button>':''}<a href="#/doc/test-cases" class="btn secondary">Run the test cases</a></div><details><summary>What the demo proves—and what it does not</summary><div><p>It demonstrates the specified local behaviour: validation, review, cancellation, balances and receipts. All logic and data are visible in the browser. It does not demonstrate production authentication, server authorisation, durable idempotency, concurrency, audit security, recovery or a real bank connection.</p><p><a href="#/doc/hld">Compare the proposed real architecture</a> and <a href="#/doc/threat-model">security assessment</a>.</p></div></details>`;}
function balances(a){return `<div class="bank-grid">${Object.entries(a).map(([id,n])=>`<section><div class="hint">${accountName(id)}</div><div class="balance">${money(n)}</div><div class="hint">Available balance · no pending holds in this case</div></section>`).join('')}</div>`;}
function bindBank(){document.querySelector('#login-form')?.addEventListener('submit',e=>{e.preventDefault();try{loginBank(e.target.username.value.trim(),e.target.password.value);}catch(err){bank.message=err.message;bank.kind='error';}render();});document.querySelectorAll('[data-bank-tab]').forEach(b=>b.onclick=()=>{if(validSession(true)){bank.pending=null;bank.tab=b.dataset.bankTab;bank.form={amount:'',source:'current',destination:'savings'};bank.message='';}render();});document.querySelector('#operation-form')?.addEventListener('submit',e=>{e.preventDefault();bank.form={amount:e.target.amount.value,source:e.target.source.value,destination:e.target.destination?.value||'savings'};try{prepareOperation(bank.tab,bank.form.source,bank.form.destination,bank.form.amount);}catch(err){bank.message=err.message;bank.kind='error';}render();});document.querySelector('#confirm-operation')?.addEventListener('click',()=>{try{confirmOperation();}catch(err){bank.message=err.message;bank.kind='error';if(!bank.loggedIn)bank.pending=null;}render();});document.querySelector('#cancel-operation')?.addEventListener('click',()=>{bank.pending=null;bank.message='Cancelled. No balances changed.';bank.kind='success';validSession(true);render();});document.querySelector('#bank-logout')?.addEventListener('click',()=>{bank.loggedIn=false;bank.pending=null;bank.message='Logged out. Account actions now require login.';bank.kind='success';render();});document.querySelector('#reset-bank')?.addEventListener('click',()=>{if(confirm('Reset this fictional session and restore the starting balances?')){resetBank();render();}});document.querySelector('#expire-bank')?.addEventListener('click',()=>{bank.lastActive=Date.now()-300001;validSession();render();});}
setInterval(()=>{const was=bank.loggedIn;validSession();if(was&&!bank.loggedIn&&location.hash.startsWith('#/demo'))render();},1000);

inks need internet access.</p></div>`;}
function start(){return `${crumb('Start here')}<div class="eyebrow">No technical background required</div><h1>A clear way through the guide.</h1><p class="lede">Start with the task people need to complete. Then follow the decisions and evidence that make a dependable service possible.</p>${section('words','Six everyday questions',table(['Stage','Plain-language question','Banking example'],[['Requirements','What is needed, and why?','Move money between two owned accounts.'],['Design','How should it work?','Review first; debit and credit together.'],['Development','How is the behaviour built?','Implement amount checks and confirmation.'],['Testing','What evidence shows it works?','Check success, insufficient funds and cancellation.'],['Deployment','How is the version introduced?','Share a checked release and user guidance.'],['Maintenance','How does it stay useful?','Fix a defect or update an agreed rule.']]))}${section('path','A suggested first visit',`<ol><li>Read the <a href="#/case">banking scenario</a> and its boundaries.</li><li>Open the <a href="#/demo">demo</a>, log in and complete one transfer.</li><li>Read ${docLink('brd')} for the business purpose.</li><li>Follow FR-06 through ${docLink('frd')}, ${docLink('lld')} and ${docLink('rtm')}.</li><li>Run TC-12 and TC-14 in ${docLink('test-cases')}.</li><li>Use <a href="#/practice">self-checks</a> to explain the distinctions in your own words.</li></ol>`)}${section('read','How to read the documents',`<p>Every document starts with seven practical questions: <strong>what, why, who, when, where, which and how</strong>. Then it provides a worked banking example. The sample paths show where information could live in a real project; they are not extra files needed by this guide.</p>${diag('documents')}<p>Document names and owners vary across organisations. A small team may combine several documents. Keep the information useful, traceable and proportionate to the risk.</p>`)}${section('scope','Three kinds of evidence',table(['Label','Meaning'],[['Worked sample','An example of how a document can be completed. It is not a real approval or observed test result.'],['Demo behaviour','Something visible and testable in this local simulation.'],['Real-system design','A proposed control that needs a real implementation and its own verification.']]))}<details><summary>How to use the guide</summary><div><p>Read the worked documents directly in the guide. Search and the banking simulation run in the browser. Source references and GitHub links open online.</p><p>Banking state lasts only while the file stays loaded in the tab. Reload restores the starting balances. No document download or export controls are provided.</p></div></details>`;}
function stagePage(id){const s=STAGES.find(x=>x.id===id);if(!s)return missing();const idx=STAGES.indexOf(s);return `${crumb(s.title)}<div class="eyebrow">Stage 0${idx+1} · Course slides ${s.slides}</div><h1>${s.title}</h1><p class="lede">${s.intro}</p><div class="article-grid"><article>${section('purpose','What happens here?',`<p>${s.example}</p><dl class="doc-meta"><div><dt>Who contributes?</dt><dd>${s.who}</dd></div><div><dt>When?</dt><dd>${s.when}</dd></div><div><dt>Inputs</dt><dd>${s.input}</dd></div><div><dt>Outputs</dt><dd>${s.output}</dd></div></dl>`)}${section('steps','How to approach the work',`<ol>${s.steps.map(x=>`<li>${x}</li>`).join('')}</ol>`)}${section('documents','Documents used in this stage',`<div class="catalog">${s.docs.map(id=>{const d=DOCS.find(x=>x.id===id);return `<a href="#/doc/${id}"><span class="tag">${d.stage.toUpperCase()}</span><h3>${d.title}</h3><p>${d.what}</p></a>`;}).join('')}</div>`)}${section('ready','What does “ready to move on” mean?',`<p>${s.exit}</p><div class="callout"><p>${s.risk}</p></div><p>Activities can overlap and repeat. A failed test can send a question back to requirements or design; deployment feedback can create maintenance work.</p>`)}${section('think','Try explaining it',`<p><strong>${s.ask}</strong></p><details><summary>Show a suggested answer</summary><div>${s.answer}</div></details><a href="#/practice?stage=${s.id}">Open this stage’s self-checks →</a>`)}${section('concepts','Explore the related concepts',`<ul>${COURSE.concepts.filter(c=>c.stage===s.id).map(c=>`<li><a href="#/concept/${c.id}">${esc(c.title)}</a> <span class="hint">· slide ${c.slide}</span></li>`).join('')}</ul>`)}${refs(s.refs)}<div class="lesson-nav">${idx?`<a href="#/stage/${STAGES[idx-1].id}">← ${STAGES[idx-1].title}</a>`:'<a href="#/start">← Start here</a>'}${idx<5?`<a href="#/stage/${STAGES[idx+1].id}">${STAGES[idx+1].title} →</a>`:'<a href="#/practice">Practise →</a>'}</div></article><aside class="toc"><strong>On this page</strong>${['purpose','steps','documents','ready','think','concepts','references'].map((id,i)=>`<a href="#main" data-scroll="${id}">${['Purpose & people','Steps','Documents','Readiness','Self-check','Concepts','Sources'][i]}</a>`).join('')}</aside></div>`;}
function documentPage(id){const d=DOCS.find(x=>x.id===id);if(!d)return missing();return `${crumb('Document library')}<div class="eyebrow">${d.stage} · Worked training sample</div><h1>${esc(d.title)}</h1><p class="lede">${d.what}</p><dl class="doc-meta">${[['What is it?',d.what],['Why create it?',d.why],['Who creates and reviews it?',d.who],['When is it created or updated?',d.when],['Where is it kept?',d.where],['Which documents connect to it?',d.which],['How is it prepared?',d.how]].map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl>${d.sections.map((s,i)=>section('doc-section-'+i,esc(s.heading),`${s.text?`<p>${esc(s.text)}</p>`:''}${s.rows?table(s.columns,s.rows):''}`)).join('')}<div class="callout"><p>Sample status: an original teaching example, not an actual bank record, approval or certification. Adapt roles and document detail to the organisation. Record actual outcomes only after the relevant work is performed.</p></div><p><a href="#/stage/${d.stage}">Return to ${d.stage}</a> · <a href="#/documents">All documents</a> · <a href="#/demo">Try the related behaviour</a></p>`;}
function documents(){return `${crumb('Document library')}<div class="eyebrow">Simple structure · filled-in examples</div><h1>The document library.</h1><p class="lede">Read the purpose first, then see exactly how it applies to Harbour Bank. All ${DOCS.length} examples include creation guidance and connections to other work.</p><label for="doc-filter">Filter by lifecycle stage</label><select id="doc-filter"><option value="all">All stages</option>${STAGES.map(s=>`<option value="${s.id}">${s.title}</option>`).join('')}</select><div id="doc-catalog" class="catalog" style="margin-top:24px">${catalogDocs(DOCS)}</div><h2>Choosing the right amount of documentation</h2><p>These examples separate documents to make their purposes visible. They do not mean every project needs ${DOCS.length} separate files. Combine related information when it improves understanding, while preserving decisions, ownership and traceability.</p>`;}
