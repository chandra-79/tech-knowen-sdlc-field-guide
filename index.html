function validateOperation(type,source,destination,raw){if(!validSession())throw Error('Log in before using account operations.');if(!['deposit','withdraw','transfer'].includes(type))throw Error('Choose a valid operation.');if(!Object.hasOwn(bank.accounts,source))throw Error('Choose an available account.');const cents=amountToCents(raw);if(type==='transfer'&&(!Object.hasOwn(bank.accounts,destination)||source===destination))throw Error('Choose two different accounts for a transfer.');if(type!=='deposit'&&cents>bank.accounts[source])throw Error('Insufficient funds. Choose an amount within the available balance.');return cents;}
function prepareOperation(type,source,destination,raw){const cents=validateOperation(type,source,destination,raw);bank.pending={type,source,destination,cents,key:`review-${Date.now()}-${Math.random().toString(36).slice(2)}`};bank.lastActive=Date.now();bank.message='';bank.kind='';return {type,amount:money(cents),source:accountName(source),destination:type==='transfer'?accountName(destination):null};}
function confirmOperation(){if(!bank.pending)throw Error('No active review to confirm. Start a new operation.');const p=bank.pending;validateOperation(p.type,p.source,p.destination,(p.cents/100).toFixed(2));const updated={...bank.accounts};if(p.type==='deposit')updated[p.source]+=p.cents;else updated[p.source]-=p.cents;if(p.type==='transfer')updated[p.destination]+=p.cents;if(!Object.values(updated).every(n=>Number.isSafeInteger(n)&&n>=0))throw Error('The operation would exceed this simulation’s supported balance range.');const row={id:`HB-${String(bank.history.length+1).padStart(4,'0')}`,type:p.type,source:p.source,destination:p.type==='transfer'?p.destination:null,cents:p.cents,time:new Date().toISOString(),balances:{...updated}};bank.pending=null;bank.accounts=updated;bank.history.unshift(row);bank.lastActive=Date.now();bank.tab='receipt';bank.message='';bank.kind='';return row;}
function resetBank(){Object.assign(bank,{loggedIn:false,accounts:{current:250000,savings:100000},history:[],pending:null,failures:0,lockUntil:0,lastActive:0,tab:'overview',message:'Demo reset. Starting balances have been restored.',kind:'success',form:{amount:'',source:'current',destination:'savings'}});}
function bankNotice(){return bank.message?`<p class="${bank.kind||'hint'}" role="status">${esc(bank.message)}</p>`:'';}
function loginBank(username,password){if(Date.now()<bank.lockUntil)throw Error(`Training login is locked. Try again in ${Math.ceil((bank.lockUntil-Date.now())/1000)} seconds.`);if(username!=='learner'||password!=='Learn123!'){bank.failures++;if(bank.failures>=3){bank.lockUntil=Date.now()+30000;bank.failures=0;throw Error('Three unsuccessful attempts. Training login is locked for 30 seconds.');}throw Error('The username or password is incorrect. Use the training credentials shown below.');}bank.loggedIn=true;bank.lastActive=Date.now();bank.failures=0;bank.lockUntil=0;bank.tab='overview';bank.message='';bank.kind='';}
function renderBank(){validSession();const titles={overview:'Account overview',balance:'Check balance',deposit:'Deposit funds',withdraw:'Withdraw funds',transfer:'Transfer funds',receipt:'Transaction receipt'};let inner='';
if(!bank.loggedIn)inner=`<div class="bank-grid"><form id="login-form"><h2 style="margin-top:0">Welcome to Harbour Bank</h2><p>Sign in to the fictional banking demo.</p>${bankNotice()}<label for="username">Training username</label><input id="username" name="username" autocomplete="off" required><label for="password">Training password</label><input id="password" name="password" type="password" autocomplete="off" required><div class="actions"><button class="btn" type="submit">Log in</button></div><p class="hint">Use <strong>learner</strong> / <strong>Learn123!</strong><br>These are public training values, not real credentials.</p></form><aside class="callout"><h3>Try the complete journey</h3><ol><li>Check the two starting balances.</li><li>Transfer SGD 200.00 from current to savings.</li><li>Read the receipt and updated balances.</li><li>Log out and try accessing an account.</li></ol><a href="#/doc/user-guide">Read the step-by-step guide</a></aside></div>`;
else if(bank.pending){const p=bank.pending;inner=`<h2 style="margin-top:0">Review ${esc(p.type)}</h2>${bankNotice()}<p>No funds move until confirmation.</p><dl class="doc-meta"><div><dt>Operation</dt><dd>${esc(p.type)}</dd></div><div><dt>Amount</dt><dd>${money(p.cents)}</dd></div><div><dt>${p.type==='deposit'?'To account':'From account'}</dt><dd>${accountName(p.source)}</dd></div>${p.type==='transfer'?`<div><dt>To account</dt><dd>${accountName(p.destination)}</dd></div>`:''}</dl><div class="actions"><button class="btn" id="confirm-operation">Confirm ${esc(p.type)}</button><button id="cancel-operation">Cancel</button></div><p class="hint">Related: <a href="#/doc/frd">FRD behaviour</a> · <a href="#/doc/lld">Detailed rules</a> · <a href="#/doc/test-cases">Test cases</a></p>`;}
else if(['deposit','withdraw','transfer'].includes(bank.tab)){const type=bank.tab;inner=`<h2 style="margin-top:0">${titles[type]}</h2><p class="hint">${type==='transfer'?'Transfers move funds between your two owned accounts.':'This records a simulated cash event; no real money is deposited or withdrawn.'}</p>${bankNotice()}<form id="operation-form"><label for="source">${type==='deposit'?'Deposit to':'From account'}</label><select id="source" name="source">${['current','savings'].map(a=>`<option value="${a}" ${bank.form.source===a?'selected':''}>${accountName(a)} · ${money(bank.accounts[a])}</option>`).join('')}</select>${type==='transfer'?`<label for="destination">To account</label><select id="destination" name="destination">${['savings','current'].map(a=>`<option value="${a}" ${bank.form.destination===a?'selected':''}>${accountName(a)}</option>`).join('')}</select>`:''}<label for="amount">Amount (SGD)</label><input id="amount" name="amount" inputmode="decimal" autocomplete="off" placeholder="200.00" value="${esc(bank.form.amount)}" aria-describedby="amount-help" required><p class="hint" id="amount-help">SGD 0.01–10,000.00, at most two decimal places. No fees or overdraft.</p><button class="btn" type="submit">Review ${type}</button></form>`;}
else if(bank.tab==='receipt'&&bank.history.length){const r=bank.history[0];inner=`<div class="receipt"><span class="badge">COMPLETED · SIMULATION</span><h2>Transaction ${r.id}</h2><p>${esc(r.type)} · <strong>${money(r.cents)}</strong></p><p>${r.type==='deposit'?'To':'From'} ${accountName(r.source)}${r.destination?' → '+accountName(r.destination):''}</p><p class="hint">${new Date(r.time).toLocaleString()}</p>${balances(r.balances)}<div class="actions"><button class="btn" data-bank-tab="overview">Back to overview</button></div></div>`;}
else inner=`<h2 style="margin-top:0">${titles[bank.tab]||titles.overview}</h2>${bankNotice()}${balances(bank.accounts)}<h3>Completed transactions</h3>${bank.history.length?table(['Reference','Operation','Amount','Accounts','Time'],bank.history.map(r=>[r.id,r.type,money(r.cents),`${accountName(r.source)}${r.destination?' → '+accountName(r.destination):''}`,new Date(r.time).toLocaleTimeString()])):'<p class="empty">No completed transactions in this demo run. A review or cancellation does not create a completed transaction.</p>'}`;
return `<div class="eyebrow">Interactive case study</div><h1>Harbour Bank demo</h1><p class="lede">Explore the screens. Check the rules. Follow the evidence back to the documents.</p><div class="bank"><div class="bank-top"><span class="bank-brand">Harbour Bank</span><span>Fictional training service</span></div><div class="demo-note">SIMULATION ONLY · No bank connection · This tab’s balances reset when the file reloads.</div>${bank.loggedIn?`<nav class="bank-tabs" aria-label="Banking pages">${['overview','balance','deposit','withdraw','transfer'].map(t=>`<button data-bank-tab="${t}" aria-current="${bank.tab===t}">${titles[t]}</button>`).join('')}<button id="bank-logout">Log out</button></nav>`:''}<div class="bank-body">${inner}</div></div><div class="actions no-print"><button id="reset-bank">Reset demo</button>${bank.loggedIn?'<button id="expire-bank">Simulate timeout</button>':''}<a href="#/doc/test-cases" class="btn secondary">Run the test cases</a></div><details><summary>What the demo proves—and what it does not</summary><div><p>It demonstrates the specified local behaviour: validation, review, cancellation, balances and receipts. All logic and data are visible in the browser. It does not demonstrate production authentication, server authorisation, durable idempotency, concurrency, audit security, recovery or a real bank connection.</p><p><a href="#/doc/hld">Compare the proposed real architecture</a> and <a href="#/doc/threat-model">security assessment</a>.</p></div></details>`;}
function balances(a){return `<div class="bank-grid">${Object.entries(a).map(([id,n])=>`<section><div class="hint">${accountName(id)}</div><div class="balance">${money(n)}</div><div class="hint">Available balance · no pending holds in this case</div></section>`).join('')}</div>`;}
function bindBank(){document.querySelector('#login-form')?.addEventListener('submit',e=>{e.preventDefault();try{loginBank(e.target.username.value.trim(),e.target.password.value);}catch(err){bank.message=err.message;bank.kind='error';}render();});document.querySelectorAll('[data-bank-tab]').forEach(b=>b.onclick=()=>{if(validSession(true)){bank.pending=null;bank.tab=b.dataset.bankTab;bank.form={amount:'',source:'current',destination:'savings'};bank.message='';}render();});document.querySelector('#operation-form')?.addEventListener('submit',e=>{e.preventDefault();bank.form={amount:e.target.amount.value,source:e.target.source.value,destination:e.target.destination?.value||'savings'};try{prepareOperation(bank.tab,bank.form.source,bank.form.destination,bank.form.amount);}catch(err){bank.message=err.message;bank.kind='error';}render();});document.querySelector('#confirm-operation')?.addEventListener('click',()=>{try{confirmOperation();}catch(err){bank.message=err.message;bank.kind='error';if(!bank.loggedIn)bank.pending=null;}render();});document.querySelector('#cancel-operation')?.addEventListener('click',()=>{bank.pending=null;bank.message='Cancelled. No balances changed.';bank.kind='success';validSession(true);render();});document.querySelector('#bank-logout')?.addEventListener('click',()=>{bank.loggedIn=false;bank.pending=null;bank.message='Logged out. Account actions now require login.';bank.kind='success';render();});document.querySelector('#reset-bank')?.addEventListener('click',()=>{if(confirm('Reset this fictional session and restore the starting balances?')){resetBank();render();}});document.querySelector('#expire-bank')?.addEventListener('click',()=>{bank.lastActive=Date.now()-300001;validSession();render();});}

e the guide, or suggest an improvement. These optional links need internet access.</p></div>`;}
function start(){return `${crumb('Start here')}<div class="eyebrow">No technical background required</div><h1>A clear way through the guide.</h1><p class="lede">Start with the task people need to complete. Then follow the decisions and evidence that make a dependable service possible.</p>${section('words','Six everyday questions',table(['Stage','Plain-language question','Banking example'],[['Requirements','What is needed, and why?','Move money between two owned accounts.'],['Design','How should it work?','Review first; debit and credit together.'],['Development','How is the behaviour built?','Implement amount checks and confirmation.'],['Testing','What evidence shows it works?','Check success, insufficient funds and cancellation.'],['Deployment','How is the version introduced?','Share a checked release and user guidance.'],['Maintenance','How does it stay useful?','Fix a defect or update an agreed rule.']]))}${section('path','A suggested first visit',`<ol><li>Read the <a href="#/case">banking scenario</a> and its boundaries.</li><li>Open the <a href="#/demo">demo</a>, log in and complete one transfer.</li><li>Read ${docLink('brd')} for the business purpose.</li><li>Follow FR-06 through ${docLink('frd')}, ${docLink('lld')} and ${docLink('rtm')}.</li><li>Run TC-12 and TC-14 in ${docLink('test-cases')}.</li><li>Use <a href="#/practice">self-checks</a> to explain the distinctions in your own words.</li></ol>`)}${section('read','How to read the documents',`<p>Every document starts with seven practical questions: <strong>what, why, who, when, where, which and how</strong>. Then it provides a worked banking example. The sample paths show where information could live in a real project; they are not extra files needed by this guide.</p>${diag('documents')}<p>Document names and owners vary across organisations. A small team may combine several documents. Keep the information useful, traceable and proportionate to the risk.</p>`)}${section('scope','Three kinds of evidence',table(['Label','Meaning'],[['Worked sample','An example of how a document can be completed. It is not a real approval or observed test result.'],['Demo behaviour','Something visible and testable in this local simulation.'],['Real-system design','A proposed control that needs a real implementation and its own verification.']]))}<details><summary>How to use the guide</summary><div><p>Read the worked documents directly in the guide. Search and the banking simulation run in the browser. Source references and GitHub links open online.</p><p>Banking state lasts only while the file stays loaded in the tab. Reload restores the starting balances. No document download or export controls are provided.</p></div></details>`;}
function stagePage(id){const s=STAGES.find(x=>x.id===id);if(!s)return missing();const idx=STAGES.indexOf(s);return `${crumb(s.title)}<div class="eyebrow">Stage 0${idx+1}</div><h1>${s.title}</h1><p class="lede">${s.intro}</p><div class="article-grid"><article>${section('outcomes','What you will be able to do',`<ul>${LEARNING_OUTCOMES[s.id].map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`)}${section('purpose','What happens here?',`<p>${s.example}</p><dl class="doc-meta"><div><dt>Who contributes?</dt><dd>${s.who}</dd></div><div><dt>When?</dt><dd>${s.when}</dd></div><div><dt>Inputs</dt><dd>${s.input}</dd></div><div><dt>Outputs</dt><dd>${s.output}</dd></div></dl>`)}${section('steps','How to approach the work',`<ol>${s.steps.map(x=>`<li>${x}</li>`).join('')}</ol>`)}${section('documents','Documents used in this stage',`<div class="catalog">${s.docs.map(id=>{const d=DOCS.find(x=>x.id===id);return `<a href="#/doc/${id}"><span class="tag">${d.stage.toUpperCase()}</span><h3>${d.title}</h3><p>${d.what}</p></a>`;}).join('')}</div>`)}${section('ready','What does “ready to move on” mean?',`<p>${s.exit}</p><div class="callout"><p>${s.risk}</p></div><p>Activities can overlap and repeat. A failed test can send a question back to requirements or design; deployment feedback can create maintenance work.</p>`)}${section('think','Try explaining it',`<p><strong>${s.ask}</strong></p><details><summary>Show a suggested answer</summary><div>${s.answer}</div></details><a href="#/practice?stage=${s.id}">Open this stage’s self-checks →</a>`)}${section('concepts','Explore the related concepts',`<ul>${GUIDE.concepts.filter(c=>c.stage===s.id).map(c=>`<li><a href="#/concept/${c.id}">${esc(c.title)}</a></li>`).join('')}</ul>`)}${refs(s.refs)}<div class="stage-nav">${idx?`<a href="#/stage/${STAGES[idx-1].id}">← ${STAGES[idx-1].title}</a>`:'<a href="#/start">← Start here</a>'}${idx<5?`<a href="#/stage/${STAGES[idx+1].id}">${STAGES[idx+1].title} →</a>`:'<a href="#/practice">Practise →</a>'}</div></article><aside class="toc"><strong>On this page</strong>${['outcomes','purpose','steps','documents','ready','think','concepts','references'].map((id,i)=>`<a href="#main" data-scroll="${id}">${['Learning objectives','Purpose & people','Steps','Documents','Readiness','Self-check','Concepts','Sources'][i]}</a>`).join('')}</aside></div>`;}
function documentPage(id,caseId='banking'){const d=(caseId==='banking'?DOCS:CASES.find(c=>c.id===caseId)?.documents||[]).find(x=>x.id===id);if(!d)return missing();return `${crumb(CASE_LABELS[caseId].title+' · Document library')}<div class="eyebrow">${d.stage} · Worked example</div><h1>${esc(d.title)}</h1><p class="lede">${d.what}</p><dl class="doc-meta">${[['What is it?',d.what],['Why create it?',d.why],['Who creates and reviews it?',d.who],['When is it created or updated?',d.when],['Where is it kept?',d.where],['Which documents connect to it?',d.which],['How is it prepared?',d.how]].map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl>${d.sections.map((s,i)=>section('doc-section-'+i,esc(s.heading),`${s.text?`<p>${esc(s.text)}</p>`:''}${s.rows?table(s.columns,s.rows):''}`)).join('')}<div class="callout"><p>Sample status: an original teaching example, not an actual bank record, approval or certification. Adapt roles and document detail to the organisation. Record actual outcomes only after the relevant work is performed.</p></div><p><a href="${caseId==='banking'?'#/stage/'+d.stage:caseHref(caseId)}">Return to ${caseId==='banking'?d.stage:CASE_LABELS[caseId].title}</a> · <a href="#/documents?case=${caseId}">All documents</a> · <a href="${caseDemoHref(caseId)}">Try the related behaviour</a></p>`;}
function selectedDocumentCase(){const id=new URLSearchParams(route().split('?')[1]||'').get('case')||'banking';return Object.hasOwn(CASE_LABELS,id)?id:'banking';}
function documents(){const caseId=selectedDocumentCase();const ds=caseId==='banking'?DOCS:CASES.find(c=>c.id===caseId)?.documents||[];return `${crumb('Document library')}<div class="eyebrow">Simple structure · Filled examples</div><h1>The document library.</h1><p class="lede">Read the purpose first, then see how it applies to ${esc(CASE_LABELS[caseId].brand)}. Every example explains what, why, who, when, where, which and how.</p><div class="bank-grid"><div><label for="case-filter">Choose a case study</label><select id="case-filter">${Object.entries(CASE_LABELS).map(([id,c])=>`<option value="${id}" ${id===caseId?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><div><label for="doc-filter">Filter by lifecycle stage</label><select id="doc-filter"><option value="all">All stages</option>${STAGES.map(s=>`<option value="${s.id}">${s.title}</option>`).join('')}</select></div></div><p>${ds.length} worked documents for this case.</p><div id="doc-catalog" class="catalog" style="margin-top:24px">${catalogDocs(ds,caseId)}</div><h2>Choosing the right amount of documentation</h2><p>These examples separate documents to make their purposes visible. A real project does not automatically need ${ds.length} separate files. Combine related information when it helps, while preserving decisions, ownership and evidence.</p>`;}
const catalogDocs=(ds,caseId='banking')=>ds.map(d=>`<a href="${caseDocHref(caseId,d.id)}"><span class="tag">${d.stage.toUpperCase()}</span><h3>${esc(d.title)}</h3><p>${esc(d.what)}</p></a>`).join('');
const FEATURES=[['Login','FR-01','Use the training credentials to begin a session. Try an incorrect password to inspect the error.','TC-01–03','frd'],['Logout','FR-02','End the session, then attempt to return to an account task. The task requires login again.','TC-04–05','threat-model'],['Check balance','FR-03','Read the current and savings amounts. This action does not move funds.','TC-06','data-model'],['Withdraw','FR-04','Review a simulated cash withdrawal. Confirm an amount within the balance; cancel another.','TC-07–09','lld'],['Deposit','FR-05','Review and confirm a simulated cash deposit. Inspect the resulting receipt.','TC-10–11','frd'],['Funds transfer','FR-06','Move 200.00 current → savings and verify that the combined balance stays the same.','TC-12–15','rtm']];
function casePage(){return `${crumb('Banking case study')}<div class="eyebrow">Fictional case · Harbour Bank</div><h1>One customer. Two accounts.<br>Six connected tasks.</h1><p class="lede">The same case runs through every worked document. The rules are deliberately small enough to understand without a banking or technology background.</p><div class="callout"><p>Current account starts at <strong>SGD 2,500.00</strong>; savings starts at <strong>SGD 1,000.00</strong>. All transaction examples assume these starting balances unless they explicitly state a sequence. Reset before an independent exercise.</p></div>${section('journeys','The six feature journeys',FEATURES.map(([a,id,b,tests,doc])=>`<details><summary>${a} <span class="badge">${id}</span></summary><div><p>${b}</p><p>Expected evidence: ${tests}. Read ${docLink(doc)} and ${docLink('test-cases')}.</p><a class="btn" href="#/demo">Try it in the demo</a></div></details>`).join(''))}${section('boundaries','Rules and boundaries',table(['Topic','This teaching case'],[['Customer / accounts','One fictional person; current and savings accounts are both owned by that person.'],['Currency / amount','SGD; 0.01–10,000.00 inclusive per transaction; at most two decimal places.'],['Available funds','No overdraft, fees, pending holds or interest.'],['Deposit / withdrawal','A simplified record of a completed cash event; no physical ATM, bank connection or real money.'],['Transfers','Only between the two owned accounts. Both balances update together.'],['Session','Public training credentials; three failed attempts lock for 30 seconds; five-minute banking inactivity timeout.'],['Storage','State exists in the current tab. Reload or Reset demo restores the initial state.'],['Security','Behaviour is simulated locally; real server security remains a design topic.']]))}${section('trace','Follow a transfer end to end',diag('documents')+`<ol><li>${docLink('brd')}: why the customer needs the task.</li><li>${docLink('srs')} and ${docLink('frd')}: FR-06 and its success/error rules.</li><li>${docLink('hld')}, ${docLink('lld')} and ${docLink('adr')}: structure, processing and monetary representation.</li><li>${docLink('rtm')} and ${docLink('test-cases')}: TC-12–15 and the evidence to record.</li><li>${docLink('deployment-plan')} and ${docLink('operations')}: release and support.</li><li>${docLink('change-request')}: what changes when the rules evolve.</li></ol>`)}${section('system','From screen to proposed real service',diag('context')+`<p>The local demo combines these responsibilities in one tab to support learning. A real service separates trust boundaries and needs specialist implementation and verification.</p>`)}${section('process','A transfer’s decision path',diag('transfer'))}`;}
function conceptPage(id){const c=GUIDE.concepts.find(c=>c.id===id);if(!c)return missing();return `${crumb('Concepts')}<div class="eyebrow">${c.stage} · Concept guide</div><h1>${esc(c.title)}</h1><p class="lede">${esc(c.explanation)}</p><h2>Think it through</h2><div class="callout"><p>${esc(c.ask)}</p></div><h2>Connect it to a case</h2><p>Apply this idea to a transfer, order, rental or repair booking. Identify the requirement, decision or evidence involved. Compare the worked document with what the related demonstration actually does.</p><div class="actions"><a class="btn" href="#/cases">Explore the cases</a><a class="btn secondary" href="#/documents">Find a document</a></div>${c.sources.length?`<h2>Reference links</h2><ul>${c.sources.map(u=>`<li><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a></li>`).join('')}</ul><p class="hint">Reference sites require internet; the explanation above is included offline.</p>`:''}<p><a href="#/concepts">← All concepts</a></p>`;}
const GLOSSARY=[['Acceptance criteria','Conditions that make a particular feature acceptable. Example: a rejected transfer changes neither balance.'],['Artifact','A useful work product, such as a document, diagram, build or test result.'],['Authentication','Establishing who is attempting access. The local login only simulates this.'],['Authorisation','Deciding what an identified person is allowed to do. Real account checks belong at a trusted server.'],['API','An agreed way for components to request information or actions from one another.'],['Atomic transaction','A set of related changes that completes together or not at all. A transfer must not leave only its debit completed.'],['Baseline','An agreed version used as a reference for controlled changes.'],['Black-box testing','Choosing tests from specified behaviour, without relying on internal implementation.'],['BRD','Business Requirements Document: the business need, outcomes and scope.'],['Build','An identifiable packaged version of software.'],['Concurrency','More than one activity progressing during an overlapping period; it can create competition for the same data.'],['Defect / bug','A flaw that may cause behaviour to differ from what is required.'],['Failure','An observed instance of incorrect behaviour.'],['Definition of Done','Agreed quality criteria for a usable increment.'],['Deployment','Introducing a version into its target environment and checking it there.'],['Disaster recovery','Restoring service after a serious disruption.'],['FRD','Functional Requirements Document: detailed functions and user interactions.'],['Functional requirement','What the system must do, such as reject a transfer with insufficient funds.'],['Non-functional requirement','A required quality or constraint, such as accessibility or performance under stated conditions.'],['HLD','High-Level Design: major parts and their relationships.'],['LLD','Low-Level Design: enough component detail to guide construction.'],['Idempotency','Handling a repeat of the same intended request without repeating its business effect.'],['Integration test','A test of interactions between components.'],['Ledger','A record of financial entries. The demo uses only a simplified view of two customer balances.'],['Migration','A controlled move or change of data, structure or service.'],['Mock / stub','A controlled substitute used to isolate behaviour during a test.'],['Prototype','An early representation used to explore or validate an idea.'],['Regression test','A repeated check for unwanted effects after a change.'],['Requirement','An agreed need, expected behaviour or condition to satisfy.'],['Risk','An uncertain event or condition and its possible impact.'],['Rollback','A recovery action intended to return to an earlier acceptable state; data compatibility still matters.'],['RTM','Requirements Traceability Matrix: links among requirements, tests and evidence.'],['RTO / RPO','Target restoration time / target maximum loss of recent data expressed as time. Values need business agreement.'],['Scope','The boundary of what is included and excluded.'],['Session','A period or state of authenticated interaction.'],['Smoke test','A selected basic check that a build or deployment is usable enough for further work.'],['SRS','Software Requirements Specification: behaviour, quality requirements, constraints and boundaries.'],['Stakeholder','A person or group that influences or is affected by the work.'],['Test case','Preconditions, actions and expected results for a repeatable check.'],['TDD','Test-driven development: small failing test, implementation to pass it, then refactoring.'],['Refactoring','Improving internal structure while preserving intended observable behaviour.'],['UAT','User Acceptance Testing: checks fitness for agreed user needs and acceptance conditions.'],['Unit test','A check of an individual separately testable unit.'],['Validation','Checking suitability for intended needs; the meaning should be clear in context.'],['Verification','Checking a work product against specified requirements or rules.'],['Version control','Recording and managing revisions to files and their history.'],['White-box testing','Choosing tests using internal structure such as branches or paths.']];
function concepts(){return `${crumb('Concepts & glossary')}<div class="eyebrow">Plain language first</div><h1>Understand the vocabulary.</h1><p class="lede">Use the glossary for a quick explanation, or open a concept for an example and discussion question.</p><details open><summary>Quick glossary · ${GLOSSARY.length} terms</summary><div>${table(['Term','Meaning and example'],GLOSSARY)}</div></details>${['foundations',...STAGES.map(s=>s.id)].map(key=>`<h2>${key[0].toUpperCase()+key.slice(1)}</h2><ul>${GUIDE.concepts.filter(c=>c.stage===key).map(c=>`<li><a href="#/concept/${c.id}">${esc(c.title)}</a></li>`).join('')}</ul>`).join('')}`;}
function practice(){const selected=new URLSearchParams(route().split('?')[1]||'').get('stage')||'all';const qs=GUIDE.quizzes.filter(q=>selected==='all'||q.stage===selected);return `${crumb('Practice & self-checks')}<div class="eyebrow">Explain it · try it · check the evidence</div><h1>Learn by working through it.</h1><p class="lede">Use the exercises to connect documents and behaviour. Self-check answers are for learning; they are not a formal assessment or pass certificate.</p><h2>Four guided exercises</h2>${[
['1 · Explain a requirement','Read FR-06. Describe its normal result and two ways it can be rejected. Identify which document explains the business need.','A valid owned-account transfer updates both balances and creates a receipt. Same-account and insufficient-funds requests are rejected without changing balances. The BRD explains the business purpose.'],
['2 · Follow the numbers','Reset and log in. Deposit 75.25 to savings, withdraw 100.00 from current, then transfer 200.00 current → savings. Predict the final balances before confirming.','Current: 2,500.00 − 100.00 − 200.00 = 2,200.00. Savings: 1,000.00 + 75.25 + 200.00 = 1,275.25. Combined: 3,475.25. The transfer preserves the total; the deposit and withdrawal change it.'],
['3 · Record a test','Run TC-14 from a reset state. Record the requirement, preconditions, exact input, expected result and actual result. If they differ, draft a defect report.','An attempted 2,500.01 transfer from current is rejected. Both balances remain 2,500.00 / 1,000.00. The actual result must come from the observed run, not from this answer.'],
['4 · Assess a change','Read CR-001. List at least five things affected by raising the transfer limit. Explain why changing the help text alone is insufficient.','Affected items include BR-02, SRS, detailed validation, UI guidance, boundary tests, user guide and release notes. The rule, implementation and evidence must remain consistent. The proposed change is not implemented in this version.']
].map(([h,p,a])=>`<details><summary>${h}</summary><div><p>${p}</p><details><summary>Suggested answer</summary><div>${a}</div></details></div></details>`).join('')}<div class="actions"><a class="btn" href="#/demo">Open the demo</a><a class="btn secondary" href="#/doc/test-cases">Read all 18 test cases</a></div><h2>Self-checks</h2><label for="quiz-filter">Choose a topic</label><select id="quiz-filter">${['all','foundations',...STAGES.map(s=>s.id)].map(k=>`<option value="${k}" ${selected===k?'selected':''}>${k[0].toUpperCase()+k.slice(1)}</option>`).join('')}</select><p>${qs.length} questions shown. Choose an answer, then check its explanation.</p>${qs.map((q,i)=>`<form class="quiz" data-quiz="${q.id}"><h3>${i+1}. ${esc(q.question)}</h3><p class="hint">${q.stage}${q.correct.length>1?' · select all correct options':''}</p>${q.options.map((o,n)=>`<label class="quiz-choice"><input type="${q.correct.length>1?'checkbox':'radio'}" name="answer" value="${n}"><span>${String.fromCharCode(65+n)}. ${esc(o)}</span></label>`).join('')}<button type="submit">Check answer</button><div class="quiz-feedback" aria-live="polite"></div></form>`).join('')}`;}
function sources(){return `${crumb('Sources & scope')}<div class="eyebrow">Self-contained explanations · public references</div><h1>A field guide you can use on its own.</h1><p class="lede">TechKnowen’s SDLC Field Guide explains software delivery through practical questions, worked documents and fictional business scenarios. No external learning pack is needed.</p><h2>How the guide is organised</h2><p>Follow requirements, design, development, testing, deployment and maintenance. These groups organise the work; they do not require a project to follow a rigid one-way sequence. Concepts, examples and self-checks are written for this guide in plain language.</p><p>Banking, shopping, rentals and a community repair hub demonstrate different rules using the same approach. Worked records are illustrative; real organisations must establish their own responsibilities, controls and acceptance evidence.</p><h2>Sources and attribution</h2><p>Public technical references support the explanations and provide further reading. Linked organisations do not endorse this guide. No formal accreditation is claimed. References require internet access; explanations and examples are included in the guide.</p><ul class="source-list">${Object.values(SOURCES).map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.title}</a><br>${s.note}</li>`).join('')}</ul><p>Individual concept pages also link to relevant public sources. Those references remain the work of their respective authors.</p><h2>TechKnowen and Ajna</h2><p>Explore <a href="https://ajnacs.com/" target="_blank" rel="noopener noreferrer">Ajna Consulting Services</a> for architecture, engineering and technical enablement.</p><h2>Contribute and help others find it</h2><p>If the guide is useful, star the repository or share its link. Report an unclear rule or incorrect example with enough detail to reproduce it.</p><div class="actions"><a class="btn" href="${REPO}" target="_blank" rel="noopener noreferrer">☆ Star on GitHub</a><a class="btn secondary" href="${REPO}/issues/new" target="_blank" rel="noopener noreferrer">Suggest an improvement</a><button data-share>Share the guide</button></div><p class="hint" id="share-status" role="status"></p>`;}
function searchPage(){const q=new URLSearchParams(route().split('?')[1]||'').get('q')||'';const key=q.trim().toLowerCase();const records=[...STAGES.map(s=>({title:s.title+' stage',url:'/stage/'+s.id,body:s.intro+' '+s.example+' '+s.steps.join(' ')})),...DOCS.map(d=>({title:d.title,url:'/doc/'+d.id,body:[d.what,d.why,d.who,d.how,...d.sections.flatMap(s=>[s.text,JSON.stringify(s.rows||[])])].join(' ')})),...CASES.flatMap(c=>[{title:c.title,url:'/case/'+c.id,body:c.intro+' '+c.scope+' '+c.rules.map(r=>r.text).join(' ')},...c.documents.map(d=>({title:c.title+' · '+d.title,url:'/case/'+c.id+'/doc/'+d.id,body:[d.what,d.why,d.how,...d.sections.flatMap(s=>[s.text,JSON.stringify(s.rows||[])])].join(' ')}))]),...GUIDE.concepts.map(c=>({title:c.title,url:'/concept/'+c.id,body:c.explanation+' '+c.ask})),...GLOSSARY.map(([a,b])=>({title:a,url:'/concepts',body:b}))];const matches=key?records.filter(r=>(r.title+' '+r.body).toLowerCase().includes(key)):[];return `${crumb('Search')}<h1>Search the guide</h1><p>${key?`${matches.length} results for <strong>${esc(q)}</strong>`:'Enter a concept, document name, requirement ID or task in the search box.'}</p>${matches.length?matches.map(r=>`<a class="search-result" href="#${r.url}"><h3>${esc(r.title)}</h3><p>${esc(r.body.slice(0,220))}${r.body.length>220?'…':''}</p></a>`).join(''):key?'<p class="empty">No matches. Try “transfer”, “FR-06”, “test”, “design” or “BRD”.</p>':''}`;}
const missing=()=>`${crumb('Page not found')}<h1>This page is not in the guide.</h1><p>Use the navigation or search to find a topic.</p><a href="#/">Return to the overview</a>`;
function render(){const p=route().split('?')[0];let html;if(p==='/')html=home();else if(p==='/start')html=start();else if(p.startsWith('/stage/'))html=stagePage(p.slice(7));else if(p==='/documents')html=documents();else if(p.startsWith('/doc/'))html=documentPage(p.slice(5));else if(p==='/cases')html=caseIndex();else if(p==='/case')html=casePage();else if(p.startsWith('/case/')){const bits=p.split('/');html=bits[3]==='doc'?documentPage(bits[4],bits[2]):bits[3]==='demo'?renderCaseDemo(bits[2]):otherCasePage(bits[2]);}else if(p==='/demo')html=renderBank();else if(p==='/concepts')html=concepts();else if(p.startsWith('/concept/'))html=conceptPage(p.slice(9));else if(p==='/practice')html=practice();else if(p==='/sources')html=sources();else if(p==='/search')html=searchPage();else html=missing();document.querySelector('#main').innerHTML=html;nav();document.title=(document.querySelector('h1')?.innerText.replace(/\s+/g,' ').trim()||'Guide')+' · SDLC Field Guide';bind();}
function bind(){document.querySelectorAll('[data-scroll]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.scroll)?.scrollIntoView({behavior:'smooth'});});document.querySelector('#case-filter')?.addEventListener('change',e=>navigate('/documents?case='+e.target.value));document.querySelector('#doc-filter')?.addEventListener('change',e=>{const id=selectedDocumentCase();const ds=id==='banking'?DOCS:CASES.find(c=>c.id===id)?.documents||[];document.querySelector('#doc-catalog').innerHTML=catalogDocs(ds.filter(d=>e.target.value==='all'||d.stage===e.target.value),id);});document.querySelector('#quiz-filter')?.addEventListener('change',e=>navigate('/practice?stage='+e.target.value));document.querySelectorAll('[data-quiz]').forEach(form=>form.onsubmit=e=>{e.preventDefault();const q=GUIDE.quizzes.find(q=>q.id===form.dataset.quiz);const chosen=[...form.querySelectorAll('input:checked')].map(i=>Number(i.value));if(!chosen.length){form.querySelector('.quiz-feedback').innerHTML='<p class="error">Choose an answer before checking.</p>';return;}const correct=checkQuiz(q,chosen);form.querySelector('.quiz-feedback').innerHTML=`<p class="${correct?'success':'error'}"><strong>${correct?'Correct.':'Not quite.'}</strong> Answer: ${esc(q.answer)}</p><p>${esc(q.rationale)}</p>`;});document.querySelectorAll('[data-share]').forEach(b=>b.onclick=shareGuide);if(route().split('?')[0]==='/demo')bindBank();if(/^\/case\/[^/]+\/demo$/.test(route().split('?')[0]))bindCaseDemo();}
async function shareGuide(){const url=PUBLIC_URL;const s=document.querySelector('#share-status');try{if(navigator.share){await navigator.share({title:'SDLC Field Guide · TechKnowen',text:'A plain-language software lifecycle guide with worked banking documents and an interactive demo.',url});if(s)s.textContent='Share options opened.';}else{await navigator.clipboard.writeText(url);if(s)s.textContent='Guide link copied.';}}catch(e){if(e.name!=='AbortError'&&s){s.textContent='Share this link: '+url;}}}
document.querySelector('#search-form').addEventListener('submit',e=>{e.preventDefault();navigate('/search?q='+encodeURIComponent(document.querySelector('#search').value));});document.querySelector('#menu').onclick=()=>{const on=document.body.classList.toggle('nav-open');document.querySelector('#menu').setAttribute('aria-expanded',String(on));};document.querySelector('#theme').onclick=()=>{const dark=document.body.classList.toggle('dark');try{localStorage.setItem('tk-guide-theme',dark?'dark':'light');}catch{}document.querySelector('#theme').setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');};try{if(localStorage.getItem('tk-guide-theme')==='dark')document.body.classList.add('dark');}catch{}
window.addEventListener('hashchange',()=>{document.body.classList.remove('nav-open');document.querySelector('#menu').setAttribute('aria-expanded','false');render();window.scrollTo(0,0);document.querySelector('#main').focus({preventScroll:true});});
render();
// Optional page-scoped agent tools use exactly the same state and rules as the visible demo.
if(document.modelContext?.registerTool){const life=new AbortController();const register=tool=>{try{Promise.resolve(document.modelContext.registerTool(tool,{signal:life.signal})).catch(()=>{});}catch{}};register({name:'read_training_bank_state',description:'Read the fictional local banking simulation state. No real banking connection.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({loggedIn:bank.loggedIn&&Date.now()-bank.lastActive<300000,balancesInCents:{...bank.accounts},completedTransactions:bank.history.length,reviewPending:!!bank.pending})});register({name:'prepare_training_transaction_review',description:'Validate a fictional transaction and open its review screen. Does not confirm or move funds.',inputSchema:{type:'object',properties:{type:{type:'string',enum:['deposit','withdraw','transfer']},source:{type:'string',enum:['current','savings']},destination:{type:'string',enum:['current','savings']},amount:{type:'string'}},required:['type','source','amount'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(!input||typeof input!=='object')throw Error('Provide transaction details.');const r=prepareOperation(input.type,input.source,input.destination,input.amount);bank.tab=input.type;location.hash='/demo';render();return {status:'review_only',...r};}});window.addEventListener('pagehide',()=>life.abort(),{once:true});}

document.querySelector('.skip').onclick=e=>{e.preventDefault();document.querySelector('#main').focus();document.querySelector('#main').scrollIntoView();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('nav-open');document.querySelector('#menu').setAttribute('aria-expanded','false');}});

</script></body></html>
