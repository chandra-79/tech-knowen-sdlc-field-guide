y that judgement."}]}, {"id": "uat", "title": "User acceptance review", "stage": "testing", "what": "Defines how representative readers would judge whether the demo communicates its intended outcomes.", "why": "Adds human understanding checks to the mechanical verification of stock and order transitions.", "who": "The customer representative and product owner would conduct acceptance activities with a facilitator.", "when": "Use after a working candidate is available and core correctness checks have been examined.", "where": "Keep observations beside the CRD, BRD outcomes, and readiness review.", "which": "Acceptance addresses suitability for the educational purpose; it is not production-commerce approval.", "how": "Ask participants to predict, operate, and explain the results without coaching the desired answer.", "sections": [{"heading": "Proposed acceptance session", "text": "Give a reader a clean instance and ask them to buy two notebooks. Before each action, ask what they expect on-hand and available stock to show. Then ask them to return that order and explain a repeated return. Observe misunderstanding and recovery rather than marking a task successful solely because the reader found the buttons."}, {"heading": "Acceptance activities", "columns": ["Activity", "Evidence sought", "Unacceptable misunderstanding"], "rows": [["Review two notebooks", "Reader distinguishes on-hand 5 from available 3", "Believes review already purchased them"], ["Confirm and retry", "Reader sees one order and stable stock", "Believes replay creates a second purchase"], ["Return one of two orders", "Reader predicts only its quantity restored", "Believes all orders were reversed"], ["Refresh expectation", "Reader knows local history resets", "Believes orders are permanently stored"]]}, {"heading": "Acceptance status", "text": "Not conducted. No participant, decision maker, signature, or approval is recorded. If observations show that the fixed timer excludes some readers or simulation labels mislead them, return those concerns to design and requirements rather than treating a technical pass as sufficient acceptance."}]}, {"id": "accessibility-review", "title": "Accessibility review plan", "stage": "testing", "what": "Examines keyboard, error, status, layout, and timing barriers in the proposed shopping flow.", "why": "Ensures a visible countdown does not conceal an exclusionary or confusing interaction.", "who": "The designer and accessibility reviewer would inspect a real candidate with suitable tools and participants.", "when": "Use during design and again after controls and dynamic states are implemented.", "where": "Link findings to SHOP-QR-01, case 18, and any proposed timing change.", "which": "Distinguish scoped checks from a complete standards conformance assessment.", "how": "Test the actual flow, record the conditions, and connect each barrier to a concrete correction.", "sections": [{"heading": "Dynamic interaction concerns", "text": "Review, confirmation, expiry, and return change the page without necessarily changing its address. Users need a clear focus location and meaningful status feedback after each action. Quantity messages should be associated with their field. Announce a meaningful expiry state, but avoid announcing the countdown every second and overwhelming other content."}, {"heading": "Review areas", "columns": ["Area", "Proposed check", "Evidence to capture"], "rows": [["Keyboard", "Complete selection, cancel, confirm, and return", "Focus order and any trap"], ["Errors", "Submit zero and fractional quantities", "Field association and useful correction text"], ["Status", "Let a review expire while focus is on Confirm", "Announcement, disabled/stale action response, recovery"], ["Layout", "Inspect at 320 CSS pixels", "Reflow and readable action controls"], ["Timing", "Assess the fixed 120-second hold", "Applicable timing criteria, barriers, and any proposed change"]]}, {"heading": "Timing decision still required", "text": "W3C timing guidance requires careful consideration of adjustable time limits and applicable exceptions. This case keeps a 120-second rule for its simulation, but records the resulting question as unresolved for conformance. Do not claim that an inventory hold automatically qualifies for an exception. A real service would need an evidence-based timing and stock-policy decision."}], "refs": ["https://www.w3.org/WAI/WCAG22/Understanding/timing-adjustable.html"]}, {"id": "test-data", "title": "Test data and fixtures", "stage": "testing", "what": "Defines reproducible fictional states for boundary, replay, and per-order return checks.", "why": "Prevents a passing-looking result caused by leftover stock or an unnoticed previous hold.", "who": "The tester maintains fixtures with developer support for reset and controlled time.", "when": "Use before every independent execution and when reproducing a reported defect.", "where": "Keep fixture definitions linked to the relevant case setup and data model.", "which": "Use synthetic local identifiers only; no real customer or payment data is needed.", "how": "Build valid states through commands where practical and inspect their invariants before testing.", "sections": [{"heading": "Baseline fixture FRESH", "text": "DEMO-CUSTOMER has no selected product, pending review, order, or refund. NOTEBOOK has unitCents 1200 and onHand 5. BOTTLE has unitCents 2000 and onHand 2. Clock is t=0. Clear reservation-to-order links along with records during reset, so an old token cannot retrieve a prior test's result."}, {"heading": "Named fixtures", "columns": ["Fixture", "How to create", "State to verify"], "rows": [["HOLD-N2", "Review 2 notebooks at t=0", "On-hand 5, held 2, available 3; expiry 120"], ["SOLD-B1", "Review and confirm 1 bottle before deadline", "Bottle on-hand/available 1; one SGD 20.00 order"], ["TWO-ORDERS-HOLD", "Complete 2 notebooks and 1 bottle separately; review 1 notebook", "Notebook on-hand 3, held 1, available 2; two orders"], ["RETURNED-N2", "Complete and fully return 2 notebooks", "Notebook on-hand 5; one returned order and SGD 24.00 refund"], ["INVALID-QUANTITIES", "Use values 0, -1, 1.5, abc, Infinity, unsafe integer", "Each attempt begins with no hold"]]}, {"heading": "Boundary clock use", "text": "Create a hold at t=0, then set the test clock directly to 119, 120, or 121 seconds as the case specifies. Avoid waiting on wall-clock timers in deterministic model checks. Capture time in the result so a discrepancy can be separated from a fixture error. Reset each independent subcase."}]}, {"id": "exploratory-charter", "title": "Exploratory testing charter", "stage": "testing", "what": "Guides investigation of confusing or unexpected action sequences beyond the 18 scripted cases.", "why": "Finds interaction gaps that arise when readers change their minds or use stale controls.", "who": "The tester explores with the designer or another observer when useful.", "when": "Use after basic checks, especially after a UI change or a report with an unclear sequence.", "where": "Store observations with exact actions and link confirmed problems to defects or requirement questions.", "which": "Explore deliberately within the demo scope instead of inventing real payment or account scenarios.", "how": "Time-box a session, vary action order, inspect state, and separate observations from hypotheses.", "sections": [{"heading": "Mission and boundaries", "text": "Explore whether Market Lane makes stock commitments understandable when the reader hesitates, retries, returns to an older order, or encounters expiry. Start from an identified build and fresh state. Remain within one local instance, one selected product per order, and simulated payments. This charter is a proposed session, not an executed test report."}, {"heading": "Exploration prompts", "columns": ["Focus", "Try", "Watch for"], "rows": [["Stale controls", "Open order A, create another review, then return A", "Wrong record changed or pending hold lost"], ["Uncertain outcome", "Repeat confirm using keyboard and pointer quickly", "Duplicate order or inconsistent message"], ["Expiry visibility", "Background the view, advance time, then interact", "Late confirmation accepted because timer paused"], ["Recovery", "Cancel, change product, review again, revisit old action", "Old IDs affecting the new hold"]]}, {"heading": "Session output", "text": "Record the sequence, controlled time, before/after stock, IDs, and the exact message that was confusing. A useful finding may be an ambiguous requirement rather than a code defect. Keep speculative causes separate and turn reproducible failures into small cases linked to the existing rules."}]}, {"id": "deployment-plan", "title": "Deployment plan", "stage": "deployment", "what": "Defines a proposed sequence for publishing an identified, checked demonstration build.", "why": "Prevents packaging success from being confused with readiness to demonstrate the shopping rules.", "who": "The release owner coordinates evidence; the developer supports build and rollback mechanics.", "when": "Use only after a candidate exists and before an actual publication decision.", "where": "Keep with the build record, release notes, readiness review, and hosting configuration evidence.", "which": "Deploy a simulated local-state app; never introduce live payment settings as a release shortcut.", "how": "Identify the artifact, verify notices and transitions, decide readiness, publish, and inspect the result.", "sections": [{"heading": "Proposed release sequence", "text": "Record the source revision, dependencies, build command, and artifact identity. Run the required checks and resolve release-blocking findings. Review simulation labels, memory-reset wording, and hosting settings. Obtain an actual readiness decision before publishing. After deployment, inspect the delivered candidate and repeat a minimal purchase/cancel/return smoke check; none of these actions is claimed here."}, {"heading": "Deployment checkpoints", "columns": ["Checkpoint", "Evidence needed", "Stop condition"], "rows": [["Candidate identified", "Completed actual build record", "Unknown source or artifact"], ["Behaviour checked", "Actual results linked to SHOP cases", "Negative stock, duplicate order/refund, late confirmation"], ["Presentation honest", "Visible simulation and reset notices", "Real-payment appearance or credential capture"], ["Published candidate verified", "Artifact/version and smoke-check record", "Wrong version or broken controls"]]}, {"heading": "Rollback and state", "text": "For a real deployment of this demo, rollback means serving a previous known artifact and verifying it. Local orders belong to each in-memory instance and are not migrated or recovered by deployment. Tell users that refreshing starts over. An operational retail system would require a separate state migration and transaction recovery plan."}]}, {"id": "release-notes", "title": "Illustrative release notes", "stage": "deployment", "what": "Summarises the intended capabilities and limitations of the proposed shopping demonstration release.", "why": "Helps readers understand what they can try and what a restart will erase.", "who": "The product owner drafts notes; the release owner checks them against the actual candidate.", "when": "Finalise only when the implemented and checked scope is known.", "where": "Publish beside the demo entry point and retain the corresponding candidate record.", "which": "Describe observed shipped behaviour in actual notes; this example is explicitly an unreleased proposal.", "how": "Use customer-facing language and clearly separate supported actions from excluded commercial features.", "sections": [{"heading": "Status and intended experience", "text": "Status: illustrative draft, not a release announcement. Market Lane is intended to demonstrate selecting one product and quantity, a 120-second stock hold, simulated purchase confirmation, cancellation, expiry, and full returns. The two products are Notebook at SGD 12.00 and Bottle at SGD 20.00. Multiple completed orders can remain in one tab."}, {"heading": "What the proposed version includes", "columns": ["Capability", "Visible behaviour", "Limit"], "rows": [["Review", "Available stock reflects the temporary hold", "On-hand stock changes only at confirmation"], ["Confirmation retry", "Existing order is shown", "Protection lasts only within the instance"], ["Full return", "One refund and stock restoration per order", "No partial returns or real funds"], ["Reset", "Original stock and empty history", "Previous local orders cannot be recovered"]]}, {"heading": "Known boundary", "text": "There is no multi-product basket, account login, shipping, tax, discount, card entry, shared stock across tabs, or durable history. The fixed time limit needs accessibility assessment before any conformance claim. Actual release notes must reference the identified candidate and reflect executed evidence; this draft does not assert completion or approval."}]}, {"id": "user-guide", "title": "Customer guide", "stage": "deployment", "what": "Explains how to operate the fictional shop and interpret the stock and order states.", "why": "Reduces confusion between held items, completed purchases, and simulated refunds.", "who": "A reader uses the guide; the designer checks wording against the actual interface.", "when": "Show before first use and make it available during review and recovery.", "where": "Place near the demo controls with links from expiry and reset explanations.", "which": "Keep instructions about the user's task here; implementation details belong in design records.", "how": "Use the exact two-product example and explain the consequence before each committing action.", "sections": [{"heading": "Make a simulated purchase", "text": "Select Notebook and quantity 2. The total is SGD 24.00. Review holds two notebooks for 120 seconds: on-hand remains 5, held is 2, and available is 3. Confirm simulated payment before the deadline to create one order. On-hand then becomes 3, held becomes 0, and available stays 3. No real money is charged."}, {"heading": "Actions and outcomes", "columns": ["Action", "What happens", "What to do next"], "rows": [["Cancel review", "The hold clears; on-hand does not change", "Change selection and review again"], ["Wait until the deadline", "The hold expires; no order is created", "Create a fresh review"], ["Repeat confirmation", "The existing successful order is retrieved", "Check its ID and status"], ["Return entire order", "Its full quantity and simulated amount are restored once", "Read the refund summary"], ["Refresh or reset", "This local instance starts over", "Do not expect previous orders to remain"]]}, {"heading": "Orders and returns", "text": "You may complete more than one order, but only one review can be pending at a time. Each order contains one product. Return the specific completed order you intend to reverse; other orders stay unchanged. A repeated return does not add more stock or another refund. Do not enter real personal or payment information."}]}, {"id": "readiness-review", "title": "Readiness review", "stage": "deployment", "what": "Combines behaviour, presentation, accessibility, build, and support evidence for a proposed release decision.", "why": "Prevents one successful path from overriding missing evidence on retries and expiry.", "who": "The product and release owners make the actual decision with technical and testing input.", "when": "Use immediately before publication and after any material change to the candidate.", "where": "Link the exact build to executed results, unresolved issues, and the decision record.", "which": "Assess readiness for a bounded demonstration, not for operating an online retailer.", "how": "Name missing evidence, distinguish blockers from accepted limitations, and record a real decision explicitly.", "sections": [{"heading": "Current readiness position", "text": "Decision status: not assessed for an actual build. The dataset supplies requirements, designs, and 18 expected-result cases, but no candidate identity, execution results, accessibility review findings, or approval. Therefore these documents alone do not support a claim that Market Lane is ready for release."}, {"heading": "Required decision inputs", "columns": ["Input", "Current authored status", "Consequence"], "rows": [["Identified build", "Not supplied", "Cannot tie observations to a candidate"], ["Core transition evidence", "18 cases specified; not executed", "Cannot claim stock and replay correctness"], ["Interaction/accessibility evidence", "Checks proposed; timing issue recorded", "Cannot claim conformance or suitability"], ["Support and reset wording", "Illustrative guidance drafted", "Must compare with actual delivered behaviour"], ["Release decision", "Not recorded", "Publication decision remains outstanding"]]}, {"heading": "Proposed blocker policy", "text": "Do not approve a candidate with negative availability, duplicate orders, duplicate refunds, stale cancellation affecting a new hold, or first confirmation succeeding at or after expiry. Also stop if the interface suggests real payment or requests real credentials. Any accepted presentation limitation needs an explicit owner and rationale rather than a silent omission."}]}, {"id": "operations", "title": "Demo operations guide", "stage": "maintenance", "what": "Describes practical support for a temporary local shopping demonstration after publication.", "why": "Helps maintainers diagnose state questions without pretending to administer a real commerce backend.", "who": "The release and support owner uses the guide with developer assistance for reproducible faults.", "when": "Use when a reader reports an unexpected balance of stock, order state, or reset.", "where": "Keep with the user guide, incident template, and candidate version information.", "which": "Support the in-memory demonstration; inventory administration and real refunds are outside its operations.", "how": "Capture the action sequence and state, explain the boundary, then choose reproduction or reset.", "sections": [{"heading": "Normal operating behaviour", "text": "A hold changes available stock but not on-hand. A first confirmation before expiry reduces on-hand and consumes the hold. Expiry is reconciled on reads and commands even if a visual timer paused. Refresh clears all local records. These behaviours should be used to distinguish an expected transition from a genuine defect."}, {"heading": "Support triage", "columns": ["Report", "First check", "Next action"], "rows": [["My available stock dropped at review", "Is on-hand unchanged and a hold visible?", "Explain the pending commitment"], ["The order disappeared on refresh", "Was this a restarted local instance?", "Explain temporary memory"], ["My return changed another order", "Capture both order IDs and stock", "Reproduce as a potential defect"], ["An expired review still confirmed", "Capture deadline and first-confirm time", "Investigate a release-blocking boundary fault"]]}, {"heading": "Data and repair limits", "text": "Request only fictional IDs, quantities, sequence, and build information. Do not request bank, card, password, or address data. Capture useful evidence before resetting a faulty instance. Reset is a recovery convenience for the demo, not a repair of durable customer records and not a substitute for fixing a reproducible defect."}]}, {"id": "dr-plan", "title": "Recovery and continuity plan", "stage": "maintenance", "what": "Explains what recovery means for a demo that deliberately keeps no durable order history.", "why": "Prevents users and maintainers from assuming that simulated orders can be restored after refresh.", "who": "The release owner communicates limits; the developer verifies reset and artifact recovery behaviour.", "when": "Use when the app fails, a tab closes, or a candidate must be rolled back.", "where": "Link from operations and deployment guidance so state loss is consistently described.", "which": "Separate restoring a usable demonstration from recovering real transactional records.", "how": "Restore the application and exact initial state; design durable recovery separately if scope expands.", "sections": [{"heading": "Local recovery objective", "text": "The demo's recovery goal is a usable new instance with notebook stock 5, bottle stock 2, and empty history. It cannot recover previous in-memory reservations, orders, refunds, or hold-token links after loss. No backup, recovery time commitment, or recovery point guarantee is claimed. Explain this limit before users start."}, {"heading": "Failure scenarios", "columns": ["Failure", "Demo recovery", "Information not recovered"], "rows": [["Browser refresh or closed tab", "Open a fresh instance", "Prior local orders and refunds"], ["Corrupted local state", "Capture evidence, then reset", "Previous instance history"], ["Faulty published artifact", "Serve a known prior artifact and recheck", "Any abandoned in-memory state"], ["Future server failure", "Outside current implementation", "Would need durable transaction recovery design"]]}, {"heading": "Future-service requirements", "text": "A real service would need coordinated recovery of orders, stock, reservations, refunds, and replay records. Restoring one collection without the others could duplicate a sale or return. Recovery objectives, backups, restore exercises, and payment reconciliation would need explicit requirements and executed evidence; copying this local reset procedure would be insufficient."}]}, {"id": "change-request", "title": "Proposed change request", "stage": "maintenance", "what": "Shows how to evaluate a future account-login request without quietly adding it to the demo.", "why": "Exposes the identity, persistence, privacy, and support work hidden behind a familiar login screen.", "who": "The product owner receives the request; analyst and technical reviewers assess its consequences.", "when": "Use before scheduling any work that changes the agreed public-demo boundary.", "where": "Keep linked to SHOP-FR-08, the PRD, privacy register, and architecture decision.", "which": "Treat account login as new scope; it is not implemented or approved here.", "how": "State the request, value hypothesis, affected decisions, alternatives, and current disposition.", "sections": [{"heading": "Request CR-SHOP-01", "text": "Proposed future request: let readers sign in and retain simulated order history across visits. Intended benefit: continue an exercise later. Current disposition: deferred for separate discovery, not approved and not implemented. The present version remains a public, one-customer, in-memory demo with no account login."}, {"heading": "Impact assessment", "columns": ["Area", "Question introduced", "Affected record"], "rows": [["Identity", "Who owns each order and can return it?", "API, threat-model"], ["Persistence", "How long are orders and replay history retained?", "Data-model, dr-plan"], ["Privacy", "What personal data is actually necessary?", "Privacy-register"], ["Inventory", "Is stock private per learner or shared?", "SRS, concurrency-review"], ["Support", "How are access and deletion requests handled?", "Operations, user-guide"]]}, {"heading": "Lower-scope alternative", "text": "First investigate whether a downloadable fictional exercise summary meets the continuation need without an account. That alternative also needs a product decision and must not be inserted silently. If login is selected, revise SHOP-FR-08, create the new requirements, reconsider architecture, and expand checking before changing the release scope."}]}, {"id": "incident", "title": "Illustrative incident record", "stage": "maintenance", "what": "Shows how maintainers could handle a report that repeated return inflated stock.", "why": "Connects user impact, immediate containment, investigation, and durable corrective work.", "who": "The support owner coordinates; the developer and tester investigate the reproduced sequence.", "when": "Use for an actual service disruption or confusing defect report, preserving its evidence.", "where": "Link a real incident to the deployed candidate and corresponding defect/change records.", "which": "This authored scenario is hypothetical; it does not report an actual outage or customer impact.", "how": "Record known facts separately from assumptions and capture state before resetting the demo.", "sections": [{"heading": "Scenario INC-SHOP-01", "text": "Hypothetical report: after buying two notebooks and returning that order twice, the reader sees notebook on-hand stock 7. Expected is 5. There are no real funds or customer orders in this demo. The suspected defect matches DEF-SHOP-01, but the actual sequence, build, and record counts would still need confirmation."}, {"heading": "Proposed response timeline", "columns": ["Step", "Action", "Evidence or decision"], "rows": [["Triage", "Ask for build, fictional order ID, and action sequence", "Avoid real personal/payment information"], ["Contain", "Pause the affected demonstration if reproduced", "Prevent misleading teaching results"], ["Investigate", "Replay from reset and inspect repeat-return branch", "Confirm or reject duplicate-restoration hypothesis"], ["Correct", "Fix the model-level once-only transition", "Link code change to SHOP-FR-07"], ["Recover", "Deploy a checked candidate and reset affected instances", "Explain that prior local history is not recoverable"]]}, {"heading": "Follow-through", "text": "Verify case 16 and the related confirmation replay and invalid-return cases before proposing closure. Update user-facing explanation only if behaviour or limitations changed. A post-incident review should ask why the invariant and repeat action escaped earlier checking, rather than attributing the problem merely to the reader pressing twice."}]}, {"id": "maintenance-plan", "title": "Maintenance plan", "stage": "maintenance", "what": "Defines ongoing review of dependencies, defects, case consistency, and the demo's stated limitations.", "why": "Keeps a small educational application coherent as code, browsers, and explanations change.", "who": "The maintainer coordinates with the content author, developer, tester, and release owner.", "when": "Use after publication and whenever a dependency update or content change affects behaviour.", "where": "Keep scheduled work and completed evidence linked to the requirement baseline and release history.", "which": "Maintain the fixed case deliberately; do not let routine updates become unreviewed feature expansion.", "how": "Assess impact, change the smallest coherent set of artifacts, and collect relevant regression evidence.", "sections": [{"heading": "Maintenance commitments", "text": "Preserve the two prices, initial stocks, one-product orders, 120-second hold, once-only confirmation, and per-order full return unless an approved requirement change replaces them. Review browser and dependency changes that affect input parsing, timing, focus, or rendering. Ensure documentation still matches the candidate, especially reset and simulation notices."}, {"heading": "Work categories", "columns": ["Trigger", "Proposed response", "Evidence"], "rows": [["Replay or stock defect", "Prioritise model correction", "Affected SHOP cases plus invariant checks"], ["Dependency update", "Assess numeric, timer, focus, and build impact", "Identified candidate and targeted checks"], ["Confusing wording", "Observe the misunderstanding and revise consistently", "UI, guide, CRD/UAT alignment"], ["New commercial feature request", "Open scope analysis before coding", "Change request and revised requirements"], ["Hosting change", "Inspect delivered configuration and logs", "Deployment and privacy-register updates"]]}, {"heading": "Review cadence and ownership", "text": "Choose a practical cadence when the actual hosting and ownership arrangement exists; no recurring automation is created by this document. Also review after each material change or incident. Record who owns the next action and what would close it. Retire the demo if its intended support cannot be sustained, with clear notice to readers."}]}, {"id": "service-measures", "title": "Service measures and learning signals", "stage": "maintenance", "what": "Defines useful measures for understanding correctness and usability without inventing current statistics.", "why": "Prevents activity counts from being mistaken for evidence that readers learned or stock stayed correct.", "who": "The product owner selects learning questions; the maintainer and tester define reliable collection.", "when": "Use when deciding whether a change improved the demonstration or introduced a regression.", "where": "Keep measure definitions with their data source and privacy implications.", "which": "Distinguish local correctness diagnostics from optional user research and any future analytics.", "how": "Define numerator, denominator, interpretation, and action before collecting a metric.", "sections": [{"heading": "Measurement boundary", "text": "No telemetry is claimed to be implemented and no observed metrics are supplied. Local diagnostic counters could support tests without identifying a reader. User research could examine whether people distinguish on-hand, held, and available stock. External analytics would be new data handling and would require review of purpose, collection, retention, and hosting behaviour."}, {"heading": "Proposed measures", "columns": ["Measure", "Definition", "Interpretation and action"], "rows": [["Duplicate-order invariant breaches", "Reservations linked to more than one order", "Any observed breach blocks release"], ["Duplicate-refund invariant breaches", "Orders linked to more than one refund", "Any observed breach requires investigation"], ["Late first-confirm successes", "First confirmations accepted at now >= expiresAt", "Expected zero; inspect clock and state logic"], ["Expiry recovery comprehension", "Observed readers who can explain recovery / readers assessed", "Explore confusion; avoid population claims from small samples"], ["Review rejection reasons", "Counts by invalid quantity, stock, or pending-review conflict", "Improve clarity after inspecting context"]]}, {"heading": "Reporting discipline", "text": "Show the observation period, candidate, collection method, and denominator. If no attempts occurred, report no observations rather than a perfect success rate. A high confirmation count does not show understanding, and a low error count may mean little testing. Use measures to decide what to inspect next, with qualitative evidence alongside them."}]}]}, {"id": "rentals", "title": "Car rentals", "brand": "Open Road", "intro": "Open Road is a fictional car-rental booking demonstration for exploring software delivery. Its decisions, records, and document examples are drafts for discussion. Planned checks have not been executed, and no business, security, release, or user-acceptance approval is claimed.", "scope": "The core journey chooses City or Family, enters fictional day offsets, reviews a simple quote under a 120-second hold, confirms a simulated payment and booking, and cancels a future booking for a full simulated refund. Dates are offsets in one fictional month; the rental interval excludes the return day. There are no real rentals, personal-data fields, actual payments, fees, taxes, deposits, insurance, inspection, handover, or physical-return workflows. Production controls in the documents are proposals requiring separate design, implementation, evidence, and business-approved policies.", "startingState": "City costs SGD 60 per day; Family costs SGD 90 per day. There are no confirmed bookings, no pending review, and no simulated payments or refunds. Family is unavailable on [10,12); this fixed maintenance block is not editable. All new bookings are treated as future bookings. The state exists only in the current browser's memory; initialization restores this defined starting state.", "roles": [{"role": "Learner acting as renter", "responsibility": "Select a car and fictional interval, inspect the review, confirm simulated payment, and explore cancellation without submitting personal information."}, {"role": "Rental product owner", "responsibility": "Decide and version the demo rules; obtain business-approved real-world rental and refund policies before any production proposal proceeds."}, {"role": "Rental operations representative", "responsibility": "Explain fleet availability and the fixed Family maintenance block; review any proposed real handover or inspection process separately."}, {"role": "Developer", "responsibility": "Implement interval, money, and state-transition rules; preserve reviewed details and prevent duplicate simulated effects."}, {"role": "Tester and accessibility reviewer", "responsibility": "Design and execute evidence-based checks for boundaries, holds, cancellations, keyboard use, and understandable status information."}, {"role": "Release and service owner", "responsibility": "Assess proposed release evidence and operational needs, distinguish browser demonstration checks from production readiness, and track unresolved risks."}], "rules": [{"id": "RENT-FR-01", "title": "Fixed fleet and fictional days", "text": "Offer exactly City at SGD 60 per day and Family at SGD 90 per day. Pickup and return are integer offsets within day 1 through day 30 of a fictional scheduling month, not real calendar dates."}, {"id": "RENT-FR-02", "title": "Valid rental interval", "text": "Require integer pickup and return values from 1 through 30, pickup strictly before return, and duration return minus pickup from 1 through 14 days inclusive. Invalid input creates no hold, booking, simulated payment, or refund."}, {"id": "RENT-FR-03", "title": "Availability and maintenance", "text": "Treat every rental interval as [pickup, return): pickup is included and return is excluded. Two intervals for the same car overlap when each starts before the other ends. Confirmed bookings and an active review hold block their intervals; adjacency is allowed. Family has a fixed maintenance block [10,12). The interface never permits changing that block."}, {"id": "RENT-FR-04", "title": "Exact simple price", "text": "Quote duration multiplied by the selected car's daily rate, calculated in integer cents and displayed in SGD. City [5,8) is three days and SGD 180. Include no fees, taxes, deposit, insurance, discount, or currency conversion."}, {"id": "RENT-FR-05", "title": "One review and temporary hold", "text": "A valid available selection creates one pending review with a fixed car, interval, duration, total, and review identifier. Its hold lasts 120 seconds from creation. At most one review may be pending in this browser demonstration; cancel it or let it expire before creating another. Changing a selection requires a new review."}, {"id": "RENT-FR-06", "title": "Cancel a pending review", "text": "Cancelling a pending review releases its hold immediately and creates no booking or simulated payment. Cancelling an already cancelled or expired review has no additional effect."}, {"id": "RENT-FR-07", "title": "Expire holds precisely", "text": "A review is active only before its creation time plus 120 seconds. At that instant or later it is expired, its interval is released, and confirmation is rejected without booking or simulated payment. Re-evaluate expiry when processing an action; a stale countdown must not authorize confirmation."}, {"id": "RENT-FR-08", "title": "Confirm once with simulated payment", "text": "Confirm an active valid review by recording one simulated payment for its reviewed total and one confirmed booking that reserves the reviewed car interval, then consume the hold. Repeating confirmation for that same review returns its existing outcome without another booking or simulated payment."}, {"id": "RENT-FR-09", "title": "Cancel future bookings and refund once", "text": "Cancelling a confirmed booking before pickup releases its reserved interval and records one full simulated refund equal to its recorded payment. All confirmed bookings are treated as future bookings in this demonstration. Repeating cancellation must not create another refund."}, {"id": "RENT-FR-10", "title": "Keep the demonstration bounded", "text": "Keep booking, hold, and simulated payment records in the current browser's memory. Collect no licence, payment-card, identity, contact, or other personal data and make no real payment. This is not a shared rental service. Inspection, vehicle handover, and physical return are not implemented. Real rental terms and production controls require business-approved policies and separate implementation."}], "journeys": [{"title": "Book City for three fictional days", "steps": ["Choose City and pickup day 5, return day 8.", "Request review; inspect three days, SGD 180, and the 120-second hold.", "Confirm before the hold expires.", "Inspect the single confirmed booking and simulated payment."], "success": "City [5,8) is reserved once, SGD 180 is recorded as a simulated payment, and the review hold is consumed.", "failure": "Invalid dates, an unavailable interval, or an expired review creates no booking or simulated payment."}, {"title": "Respect maintenance while allowing adjacency", "steps": ["Choose Family and request [9,11).", "Observe the maintenance conflict with [10,12).", "Choose [8,10) and review the two-day SGD 180 quote.", "Cancel the pending review to release its hold."], "success": "The overlapping request is rejected, the adjacent request is allowed, and cancellation leaves no booking or payment.", "failure": "Accepting the overlap or rejecting adjacency contradicts RENT-FR-03."}, {"title": "Recover after an expired review", "steps": ["Create a City [20,22) review.", "Allow elapsed time to reach 120 seconds.", "Attempt confirmation and inspect the expired outcome.", "Request a new review and confirm it before its new expiry."], "success": "The expired review has no booking or payment; only the fresh review can confirm once.", "failure": "A stale countdown or repeated click must not revive the expired review."}, {"title": "Cancel a confirmed future booking", "steps": ["Confirm City [5,8) at SGD 180.", "Cancel the confirmed booking; every demo booking is treated as future.", "Inspect the full SGD 180 simulated refund and released interval.", "Repeat cancellation and check that no further refund is created."], "success": "One full simulated refund is linked to the original simulated payment and the car becomes available for [5,8).", "failure": "Partial refunds, extra refunds, cancellation fees, and actual payment requests are outside the defined behavior."}], "stages": [{"id": "requirements", "focus": "Agree what reservation, price, expiry, and cancellation mean.", "example": "RENT-FR-03 allows City [8,10) beside an existing [5,8) booking; Family [9,11) conflicts with maintenance.", "evidence": "Draft rules, interval examples, stakeholder questions, and the requirements-to-test mapping.", "decision": "Product owner and operations must resolve ambiguities before treating a requirement baseline as accepted; no acceptance is claimed.", "practice": "Explain why return day 8 can also be another renter's pickup day in this simplified model."}, {"id": "design", "focus": "Separate selection, validation, one review hold, booking, and simulated financial records.", "example": "Confirmation consumes an active review and produces one booking plus one simulated payment for the frozen quote.", "evidence": "State model, data definitions, overlap decision table, interface failure contract, and design alternatives.", "decision": "Choose the simplest in-memory design for the demo; identify a separate server-authoritative proposal for production.", "practice": "Draw the state change when a user confirms exactly 120 seconds after review creation."}, {"id": "development", "focus": "Implement small rule-based increments with exact money and controlled time.", "example": "Build the half-open interval function, price calculation, review transitions, and duplicate-confirmation guard.", "evidence": "Proposed code-review checklist, build record, and focused developer test cases; no implementation run is claimed here.", "decision": "Integrate a change only after its relevant checks and review evidence are available.", "practice": "Describe how the same review identifier prevents a repeated confirmation from adding a second payment."}, {"id": "testing", "focus": "Investigate boundaries, overlap, adjacency, expiry, cancellation, and demo limits.", "example": "RENT-TC-14 distinguishes confirmation at 119 seconds from 120 and 121 seconds.", "evidence": "Eighteen planned cases, fictional fixtures, exploratory charter, defect example, and an unexecuted test summary.", "decision": "Assess failures and uncovered risks using recorded evidence; a test plan alone does not justify release.", "practice": "Select the cases most likely to reveal an incorrect use of <= in the overlap calculation."}, {"id": "deployment", "focus": "Prepare a clearly labelled browser demonstration and its rollback instructions.", "example": "Verify the delivered build initializes two cars and the immutable Family [10,12) block without live integrations.", "evidence": "Draft deployment plan, release notes, user guide, and readiness checklist with pending decisions.", "decision": "A release owner must review actual build and test evidence before authorizing publication; authorization is not recorded here.", "practice": "Explain which visible wording prevents learners mistaking simulated payment for a real charge."}, {"id": "maintenance", "focus": "Keep rules, tests, dependencies, and user guidance consistent as the example evolves.", "example": "A proposed change to hold duration would affect requirements, countdown, expiry checks, tests, and explanatory text.", "evidence": "Change request, incident scenario, maintenance plan, service measures, and recovery exercise proposal.", "decision": "Keep production policy proposals separate from current demo behavior until approved, implemented, and verified.", "practice": "Trace a hypothetical hold-duration change to every document and test that must be reconsidered."}], "exercises": [{"title": "Count days precisely", "prompt": "What duration and quote should City [5,8) show, and is day 8 occupied by this booking?", "answer": "Three days and SGD 180. Day 8 is excluded, so a new interval starting at day 8 may be adjacent without overlap."}, {"title": "Challenge a maintenance boundary", "prompt": "Which Family intervals are available in a fresh demo: [8,10), [9,11), and [12,14)?", "answer": "[8,10) and [12,14) are adjacent to maintenance and available at SGD 180 each. [9,11) overlaps [10,12) and is rejected."}, {"title": "Separate dates from elapsed seconds", "prompt": "A review for fictional days [20,22) was created 120 seconds ago. Can it confirm?", "answer": "No. Fictional rental days and the real elapsed hold timer are different measures. At 120 seconds the review is expired and must be replaced by a new review."}, {"title": "Explain a safe retry", "prompt": "The same City [5,8) review is confirmed twice. What records should exist?", "answer": "One booking and one SGD 180 simulated payment, linked to the same review. The retry reports the original outcome without creating further effects."}, {"title": "Cancel without inventing charges", "prompt": "A confirmed Family [1,3) booking is cancelled twice. What is the refund total?", "answer": "One full simulated refund of SGD 180. Every demo booking is future; the second cancellation adds nothing. There are no fees, deposits, or real payment movements."}, {"title": "Read evidence honestly", "prompt": "All 18 cases are written and linked to requirements. Does that establish a tested release?", "answer": "No. They are planned cases. Actual execution results, environment details, defect assessment, accessibility evidence, and the required release decision remain to be supplied."}], "documents": [{"id": "stakeholders", "title": "Stakeholder map", "stage": "requirements", "what": "Map the people who shape the booking demonstration and its proposed future service.", "why": "Resolve availability, cancellation, accessibility, and production-policy questions with the right people.", "who": "The product owner maintains the map with rental operations, developers, testers, and the release owner.", "when": "Create it before baselining rules and revisit it when a proposed feature changes responsibilities.", "where": "Keep it beside the requirements and decision log in the case repository.", "which": "Use it for the two-car demonstration and for identifying separate production decision owners.", "how": "Record each interest, question, decision authority, and unresolved dependency; participation does not imply approval.", "sections": [{"heading": "Current decision boundary", "text": "The learner acts as a renter without providing personal information. Operations contributes availability knowledge but cannot edit the fixed Family block through the demo. Any real rental terms require named business approval outside this example."}, {"heading": "Interests and decisions", "columns": ["Stakeholder", "Concern", "Decision or contribution"], "rows": [["Product owner", "Predictable learning scope", "Resolve demo rules and decide whether a production proposal warrants discovery."], ["Rental operations", "Maintenance and interval availability", "Validate the intended meaning of [10,12) and identify real turnaround policies as future work."], ["Learner and accessibility participant", "Understandable review and recovery", "Explain confusion around fictional days, countdown, and simulated payment."], ["Developer and tester", "Unambiguous behavior", "Challenge edge cases and supply implementation and execution evidence."], ["Release owner", "Honest readiness claims", "Require actual evidence before making a release decision."]]}, {"heading": "Open participation task", "text": "Arrange a review of the boundary examples with the product owner and operations representative. Record attendance, disagreements, and decisions only after the review occurs; this map contains no completed consultation claim."}]}, {"id": "brd", "title": "Business requirements document", "stage": "requirements", "what": "Describe Open Road’s booking problem, intended business outcomes and bounded scope.", "why": "Keep the example focused on reliable booking decisions instead of an undefined full rental operation.", "who": "The product owner drafts it with operations and learning stakeholders.", "when": "Use it before product scope is accepted and when a proposed change adds a new business process.", "where": "Store it with the scope statement and prioritization record.", "which": "Address quote, reservation, expiry, and cancellation; exclude real customer onboarding and vehicle handling.", "how": "Connect each desired outcome to a measurable demonstration behavior and a clear limitation.", "sections": [{"heading": "Problem and outcome", "text": "Open Road needs to quote and reserve a vehicle without accepting conflicting date intervals. Customers need to know the price, when a temporary hold becomes a confirmed booking, and what cancellation changes. Fleet coordinators need maintenance periods to remain unavailable. Two vehicles and fictional day numbers keep the worked example small enough to inspect."}, {"heading": "Business outcomes", "columns": ["Outcome", "Observable demonstration", "Boundary"], "rows": [["Avoid conflicting promises", "Reject overlapping same-car intervals and permit adjacent intervals.", "No real fleet feed or turnaround buffer."], ["Make booking commitments clear", "Only confirmation creates a booking and simulated payment.", "A pending review expires after 120 seconds."], ["Reverse eligible future bookings predictably", "Release the interval and refund the simulated amount once.", "No real refund processing or rental penalties."]]}, {"heading": "Business policy gate", "text": "Daily rates and full future cancellation are teaching rules, not advertised rental terms. A real service would need business-approved policies for eligibility, actual dates, maintenance, handover, charges, and refunds before production requirements could be accepted."}]}, {"id": "mrd", "title": "Market requirements document", "stage": "requirements", "what": "Frame a hypothetical audience and market-learning questions without claiming completed market research.", "why": "Distinguish an educational rental example from a validated commercial opportunity.", "who": "The product owner would coordinate research with rental operators and potential users.", "when": "Use during discovery if a real service is proposed; retain the current demo audience assumption explicitly.", "where": "Keep research hypotheses and future evidence beside the business requirements.", "which": "Focus on understanding reservation certainty and cancellation, not competitor price comparisons.", "how": "State hypotheses, propose suitable inquiry, and identify what evidence would change the product direction.", "sections": [{"heading": "Audience hypothesis", "text": "The current audience is a learner exploring software delivery. A hypothetical commercial audience might include renters who need clear availability and small operators managing scarce vehicles. Those commercial needs have not been researched or validated by this case."}, {"heading": "Questions requiring research", "columns": ["Hypothesis", "Proposed inquiry", "Decision informed"], "rows": [["People confuse quotes and bookings", "Observe participants explain the review and confirmation states.", "Wording and commitment signals."], ["Operators need predictable maintenance protection", "Interview operators about scheduling and turnaround rules.", "Whether the simple interval model needs additional approved rules."], ["Transparent cancellation matters", "Ask renters to explain a proposed cancellation policy in their own words.", "Real refund terms and policy presentation."]]}, {"heading": "Research limits", "text": "No market size, customer interview result, conversion improvement, or competitive claim is asserted. The SGD 60 and SGD 90 rates are fixed demonstration inputs and must not be interpreted as market evidence."}]}, {"id": "prd", "title": "Product requirements document", "stage": "requirements", "what": "Specify the bounded user experience and acceptance intent for the Open Road demonstration.", "why": "Align interface work, rules, and tests around one complete booking-and-cancellation journey.", "who": "The product owner owns scope; design, development, and testing contribute feasibility and evidence.", "when": "Establish before implementation and revise through a recorded change decision.", "where": "Place it beside RENT-FR requirements, interface sketches, and the backlog.", "which": "Cover car selection, fictional offsets, review hold, simulated confirmation, and future cancellation.", "how": "Describe the intended journey, explicit exclusions, and links to stable requirement IDs.", "sections": [{"heading": "Experience promise", "text": "A learner can see exactly which car and interval are proposed, the duration and simple SGD total, whether the temporary hold remains active, and whether a booking has actually been confirmed. Cancellation distinguishes releasing an unpaid review from refunding a paid simulated booking."}, {"heading": "Product slices", "columns": ["Slice", "Required behavior", "Requirement links"], "rows": [["Select and quote", "Choose City or Family; validate offsets; show duration times daily rate.", "RENT-FR-01, RENT-FR-02, RENT-FR-04"], ["Review and confirm", "Create one 120-second hold and confirm its fixed details once.", "RENT-FR-05, RENT-FR-07, RENT-FR-08"], ["Cancel and recover", "Release a pending hold or fully refund a confirmed future booking once.", "RENT-FR-06, RENT-FR-09"], ["Understand limitations", "Show fictional timing and simulated payment without personal-data fields.", "RENT-FR-10"]]}, {"heading": "Acceptance boundary", "text": "Acceptance must be supported by executed checks and participant evidence. This draft does not include vehicle inspection, physical pickup or return, customer accounts, real payment, or an editable maintenance calendar."}]}, {"id": "crd", "title": "Customer requirements document", "stage": "requirements", "what": "Capture the learner-as-renter needs behind the booking journey.", "why": "Prevent technically correct booking states from becoming confusing user experiences.", "who": "A product analyst would gather needs with learner participants and an accessibility reviewer.", "when": "Use during discovery and revisit after observed user sessions.", "where": "Keep it beside the product requirements and UAT scenarios.", "which": "Use renter-facing language while preserving the fictional-day and simulated-payment boundary.", "how": "Translate needs into understandable statements and link each to a demonstrable response.", "sections": [{"heading": "Customer perspective", "text": "The participant wants to know whether a car is available, how much the selected interval costs, what pressing confirm means, and whether cancellation reverses that simulated commitment. These are drafted needs, not findings from completed interviews."}, {"heading": "Draft needs", "columns": ["Customer need", "Product response", "Linked rule"], "rows": [["I need to know what days I reserve", "Show pickup included and return excluded with the duration.", "RENT-FR-02, RENT-FR-03"], ["I need to know when my hold ends", "Show pending and expired states with a 120-second hold explanation.", "RENT-FR-05, RENT-FR-07"], ["I need to avoid paying twice", "Reuse the outcome when the same review is confirmed again.", "RENT-FR-08"], ["I need to understand cancellation", "Differentiate no-payment hold release from a full simulated booking refund.", "RENT-FR-06, RENT-FR-09"]]}, {"heading": "Validation activity", "text": "Ask participants to predict the outcome before each action, then explain the result. Record misunderstandings about the return boundary and payment simulation before deciding whether wording or workflow needs change."}]}, {"id": "srs", "title": "Software requirements specification", "stage": "requirements", "what": "Consolidate precise software obligations and domain boundaries.", "why": "Give implementation and testing a single consistent interpretation of the rental model.", "who": "The product owner and analyst maintain rules with developer and tester review.", "when": "Baseline only after unresolved behavior is decided; update before changed behavior is implemented.", "where": "Store it with versioned functional rules, quality requirements, and traceability.", "which": "Include all ten RENT-FR rules and the fixed maintenance constraint.", "how": "Use stable identifiers, explicit interval semantics, integer money, and state-transition outcomes.", "sections": [{"heading": "Domain definitions", "text": "Day offsets are integers 1 through 30 in a fictional month. Duration equals return minus pickup, with a permitted range of 1 through 14. An interval [a,b) includes a and excludes b. Money is stored in integer cents; displayed totals use SGD."}, {"heading": "Specification groups", "columns": ["Group", "Obligation", "Rule references"], "rows": [["Selection and price", "Fixed fleet, legal offsets, simple daily-rate quote.", "RENT-FR-01, RENT-FR-02, RENT-FR-04"], ["Availability", "No overlapping reservation for the same car; allow adjacency; keep Family [10,12).", "RENT-FR-03"], ["Pending state", "One fixed review, 120-second hold, explicit cancellation, exact expiry.", "RENT-FR-05, RENT-FR-06, RENT-FR-07"], ["Committed state", "Confirm once; cancel future booking with one full simulated refund.", "RENT-FR-08, RENT-FR-09"], ["Scope", "Browser-memory simulation; no personal data or real rental execution.", "RENT-FR-10"]]}, {"heading": "Specification discipline", "text": "The functional requirements document carries the full rule text. Changes must preserve these links and define any revised test expectations. Real eligibility, customer identity, provider payment, and physical return requirements are future discovery topics, not hidden obligations of this demo."}]}, {"id": "frd", "title": "Functional requirements document", "stage": "requirements", "what": "State the ten testable functional rules of the rental demonstration.", "why": "Make booking, hold, and cancellation behavior precise enough for independent review.", "who": "The product owner proposes the rules; operations, development, and testing review them.", "when": "Use before coding and whenever a change alters visible behavior.", "where": "Keep the canonical RENT-FR list beside the RTM and test cases.", "which": "Use RENT-FR-01 through RENT-FR-10 without inventing extra charges or real-calendar behavior.", "how": "For each rule, define valid input, transition, outcome, and prohibited side effects.", "sections": [{"heading": "Rule status", "text": "These are the defined rules for this educational case. They do not assert business approval for a commercial service or completed verification of an implementation."}, {"heading": "Canonical rules", "columns": ["Requirement ID", "Title", "Required behavior"], "rows": [["RENT-FR-01", "Fixed fleet and fictional days", "Offer exactly City at SGD 60 per day and Family at SGD 90 per day. Pickup and return are integer offsets within day 1 through day 30 of a fictional scheduling month, not real calendar dates."], ["RENT-FR-02", "Valid rental interval", "Require integer pickup and return values from 1 through 30, pickup strictly before return, and duration return minus pickup from 1 through 14 days inclusive. Invalid input creates no hold, booking, simulated payment, or refund."], ["RENT-FR-03", "Availability and maintenance", "Treat every rental interval as [pickup, return): pickup is included and return is excluded. Two intervals for the same car overlap when each starts before the other ends. Confirmed bookings and an active review hold block their intervals; adjacency is allowed. Family has a fixed maintenance block [10,12). The interface never permits changing that block."], ["RENT-FR-04", "Exact simple price", "Quote duration multiplied by the selected car's daily rate, calculated in integer cents and displayed in SGD. City [5,8) is three days and SGD 180. Include no fees, taxes, deposit, insurance, discount, or currency conversion."], ["RENT-FR-05", "One review and temporary hold", "A valid available selection creates one pending review with a fixed car, interval, duration, total, and review identifier. Its hold lasts 120 seconds from creation. At most one review may be pending in this browser demonstration; cancel it or let it expire before creating another. Changing a selection requires a new review."], ["RENT-FR-06", "Cancel a pending review", "Cancelling a pending review releases its hold immediately and creates no booking or simulated payment. Cancelling an already cancelled or expired review has no additional effect."], ["RENT-FR-07", "Expire holds precisely", "A review is active only before its creation time plus 120 seconds. At that instant or later it is expired, its interval is released, and confirmation is rejected without booking or simulated payment. Re-evaluate expiry when processing an action; a stale countdown must not authorize confirmation."], ["RENT-FR-08", "Confirm once with simulated payment", "Confirm an active valid review by recording one simulated payment for its reviewed total and one confirmed booking that reserves the reviewed car interval, then consume the hold. Repeating confirmation for that same review returns its existing outcome without another booking or simulated payment."], ["RENT-FR-09", "Cancel future bookings and refund once", "Cancelling a confirmed booking before pickup releases its reserved interval and records one full simulated refund equal to its recorded payment. All confirmed bookings are treated as future bookings in this demonstration. Repeating cancellation must not create another refund."], ["RENT-FR-10", "Keep the demonstration bounded", "Keep booking, hold, and simulated payment records in the current browser's memory. Collect no licence, payment-card, identity, contact, or other personal data and make no real payment. This is not a shared rental service. Inspection, vehicle handover, and physical return are not implemented. Real rental terms and production controls require business-approved policies and separate implementation."]]}, {"heading": "Reading the rules together", "text": "A valid date range is not automatically available, and a valid quote is not a confirmed booking. Expiry is checked before confirmation; the review snapshot supplies the confirmed details. Cancellation of an unpaid pending review creates no refund, while cancellation of a confirmed future booking refunds its original simulated payment once."}]}, {"id": "quality-requirements", "title": "Quality requirements", "stage": "requirements", "what": "Define proposed observable qualities for clarity, accessibility, responsiveness, and reliable outcomes.", "why": "Avoid treating correct price arithmetic as complete product quality.", "who": "The product owner, accessibility reviewer, developer, and tester agree evidence expectations.", "when": "Define alongside functional rules and examine during each meaningful change.", "where": "Store beside test objectives, accessibility review, and service measures.", "which": "Separate local demo quality checks from future production availability or security targets.", "how": "State measurable or inspectable criteria and record evidence only after checks run.", "sections": [{"heading": "Proposed quality baseline", "text": "The demonstration should be operable by keyboard, communicate statuses in text, and keep price and interval information consistent across review and result. These are acceptance proposals requiring inspection; no conformity claim is made."}, {"heading": "Quality criteria", "columns": ["Characteristic", "Proposed criterion", "Evidence needed"], "rows": [["Clarity", "Every confirmation view states car, [pickup,return), duration, SGD total, and simulation status.", "Screen inspection and participant explanation."], ["Accessibility", "Fields have programmatic labels; errors identify fields; keyboard focus remains usable through expiry and cancellation.", "Keyboard and assistive-technology observations."], ["Reliability", "Rejected or expired actions leave booking and simulated financial counts unchanged.", "State snapshots for relevant planned cases."], ["Responsiveness", "Measure local interaction latency on a recorded device before selecting a justified numerical target.", "Repeated measurements with browser and build recorded."]]}, {"heading": "Production separation", "text": "A real rental service would need business-approved service targets and a tested availability strategy. This browser example provides no evidence about shared-service capacity, uptime, fraud resistance, or live payment reliability."}]}, {"id": "technical-requirements", "title": "Technical requirements", "stage": "requirements", "what": "Describe implementation constraints that preserve the simple domain model.", "why": "Prevent floating-point amounts, real-date conversion, or hidden persistence from changing its meaning.", "who": "The technical lead proposes constraints and reviewers assess their consequences.", "when": "Before implementation choices and whenever a dependency changes representation or state handling.", "where": "Keep alongside the data model, detailed design, and dependency register.", "which": "Use browser-memory state, explicit elapsed hold timing, integer day offsets, and integer cents.", "how": "Specify representations and enforce domain checks at the transition boundary.", "sections": [{"heading": "Runtime boundary", "text": "The demo runs in one browser session without a booking server. Current state is not a shared authority across tabs or users. Initializing the demonstration restores the fixed fleet and maintenance block with no booking or financial records."}, {"heading": "Representations", "columns": ["Concern", "Required representation", "Reason"], "rows": [["Rental interval", "Two integers pickup and return, each 1..30; duration return-pickup.", "Avoid time zones and calendar-month ambiguity."], ["Price", "6000 cents/day for City; 9000 cents/day for Family; integer total.", "Keep simple SGD arithmetic exact."], ["Review", "Identifier, immutable quote snapshot, creation time, expiry time, and status.", "Separate pending intent from confirmed effects."], ["Availability", "Half-open intervals; fixed Family [10,12); confirmed and active-held intervals.", "Permit adjacency while rejecting overlap."]]}, {"heading": "Proposed production replacement", "text": "A production design would need an authoritative server clock, durable records, authorization, concurrency controls, and reconciled payment outcomes. Those are separate proposals and are not achieved by the local representations above."}]}, {"id": "backlog", "title": "Product backlog", "stage": "requirements", "what": "Arrange the work needed to build and verify the bounded booking journey.", "why": "Make dependencies and excluded features visible before effort is committed.", "who": "The product owner orders the backlog with development and testing input.", "when": "Refine before implementation and when feedback changes risk or scope.", "where": "Keep the backlog linked to RENT-FR IDs and evidence documents.", "which": "Prioritize domain rules, then the complete review-confirm-cancel flow, then quality evidence.", "how": "Describe a usable outcome and acceptance evidence for each item rather than a vague activity.", "sections": [{"heading": "Ordering rationale", "text": "Availability and state rules are prerequisites for trustworthy screens. The backlog below is a proposed order, not a progress report or a commitment that any item is implemented."}, {"heading": "Draft work items", "columns": ["Item", "Outcome and dependency", "Acceptance evidence"], "rows": [["RB-01 Interval and price rules", "Validate days and price; depends on RENT-FR-01..04.", "RENT-TC-01..12 planned cases executed with evidence."], ["RB-02 Review hold", "One snapshot with cancellation and 120-second expiry; depends on RB-01.", "RENT-TC-13..15 results plus review-state inspection."], ["RB-03 Confirm and refund", "One booking/payment and one cancellation/refund; depends on RB-02.", "RENT-TC-16..17 results and state count checks."], ["RB-04 Accessible bounded interface", "Explain fictional dates and simulation; keep maintenance read-only.", "RENT-TC-18 plus accessibility review and UAT."], ["RB-05 Release evidence", "Assemble actual build, result, and readiness records.", "Release decision recorded after evidence review."]]}, {"heading": "Deferred proposals", "text": "Customer onboarding, licences, actual payments, calendar dates, inspection, handover, and physical return are excluded. A request for them starts discovery and policy approval rather than silently enlarging RB-04."}]}, {"id": "rtm", "title": "Requirements traceability matrix", "stage": "requirements", "what": "Link each rental requirement to design responsibility and planned tests.", "why": "Expose gaps and support change analysis without confusing planned coverage with passing evidence.", "who": "The analyst or tester maintains links with requirement and implementation owners.", "when": "Update when a rule, design element, test, or result changes.", "where": "Keep beside the canonical FRD and versioned execution records.", "which": "Trace RENT-FR-01 through RENT-FR-10 in both directions.", "how": "Record planned links now; add actual build and outcome evidence after execution.", "sections": [{"heading": "Coverage status", "text": "Every requirement below has proposed test links. All listed tests remain planned and unexecuted. The matrix therefore shows intended coverage, not a passing release or demonstrated completeness."}, {"heading": "Requirement-to-test links", "columns": ["Requirement", "Design responsibility", "Planned test IDs"], "rows": [["RENT-FR-01", "Fleet catalogue and fictional-day input", "RENT-TC-01, RENT-TC-02, RENT-TC-18"], ["RENT-FR-02", "Interval validator", "RENT-TC-01, RENT-TC-03, RENT-TC-04, RENT-TC-05"], ["RENT-FR-03", "Overlap predicate and availability filter", "RENT-TC-06, RENT-TC-07, RENT-TC-08, RENT-TC-09, RENT-TC-10, RENT-TC-11, RENT-TC-12, RENT-TC-17, RENT-TC-18"], ["RENT-FR-04", "Integer-cent quote calculator", "RENT-TC-01, RENT-TC-02, RENT-TC-05, RENT-TC-09, RENT-TC-10, RENT-TC-12, RENT-TC-16"], ["RENT-FR-05", "Review snapshot and single pending slot", "RENT-TC-13, RENT-TC-14, RENT-TC-15"], ["RENT-FR-06", "Pending-review cancellation transition", "RENT-TC-15"], ["RENT-FR-07", "Action-time expiry guard", "RENT-TC-14"], ["RENT-FR-08", "Confirmation transition and review outcome lookup", "RENT-TC-16"], ["RENT-FR-09", "Booking cancellation and refund guard", "RENT-TC-17"], ["RENT-FR-10", "Memory-only boundary and interface exclusions", "RENT-TC-18"]]}, {"heading": "Backward and change review", "text": "Starting from a test, identify the rule and reason it exists. Starting from a changed rule, reconsider its design, tests, UI text, user guide, and previously recorded evidence. A result from an earlier rule version must retain that version context."}]}, {"id": "hld", "title": "High-level design", "stage": "design", "what": "Show the major parts of the browser rental demonstration and their relationships.", "why": "Clarify who owns input, rules, pending intent, and confirmed records.", "who": "The developer or technical lead drafts it with product and testing reviewers.", "when": "Before detailed implementation and when a proposed feature changes boundaries.", "where": "Keep beside the data model, state contract, and architecture decisions.", "which": "Describe a single browser application, not deployed rental microservices.", "how": "Assign responsibilities and follow one booking from selection to confirmation and cancellation.", "sections": [{"heading": "Application structure", "text": "The view collects car and day offsets. A domain module validates intervals, availability, and price. A state controller owns one pending review, bookings, and simulated financial records. Views render that state; they do not independently calculate a second price or authorize a transfer to another state."}, {"heading": "Components", "columns": ["Component", "Responsibility", "Boundary"], "rows": [["Selection and review view", "Display choices, quote, remaining hold time, and result.", "Collect no personal or card information."], ["Domain rules", "Validate days; calculate cents; evaluate half-open overlap.", "Treat Family [10,12) as fixed input."], ["State controller", "Create, expire, cancel, and consume reviews; confirm and refund once.", "Single browser-memory authority only."], ["Evidence helpers", "Expose fixture setup and controlled timing for planned tests.", "Test support does not imply a production admin interface."]]}, {"heading": "Production alternative", "text": "A future shared service would move authoritative reservations, time, authorization, and durable financial records behind server interfaces. The browser-only diagram intentionally makes no claim about cross-user exclusivity."}]}, {"id": "lld", "title": "Low-level design", "stage": "design", "what": "Specify calculations and state-transition rules closely enough to implement.", "why": "Prevent small operator or ordering mistakes from causing overlap or duplicated effects.", "who": "Developers own the design and testers challenge boundary examples.", "when": "Before writing the corresponding rule and transition functions.", "where": "Keep close to domain code and linked unit-level test plans.", "which": "Cover interval validation, half-open overlap, review expiry, confirmation, and cancellation.", "how": "Define preconditions, checks, and one coherent state update for each action.", "sections": [{"heading": "Core calculations", "text": "duration = return - pickup. totalCents = duration × dailyRateCents. Intervals [a,b) and [c,d) overlap exactly when a < d and c < b. Equality at a shared endpoint is adjacency. Validate the input interval before testing overlap."}, {"heading": "Transition detail", "columns": ["Action", "Checks in order", "Effects"], "rows": [["Create review", "Legal car and interval; no active pending review; no conflicting booking or maintenance.", "Freeze quote and identity; create expiry at creation plus 120 seconds."], ["Confirm review", "Return an existing outcome for a confirmed identifier; otherwise require the matching active unexpired review.", "Record one booking and simulated payment; consume its hold together."], ["Cancel pending", "Match pending identifier and evaluate terminal status.", "Release active hold; no payment or refund."], ["Cancel booking", "Find confirmed future booking; detect any existing cancellation.", "Release interval and record full original-amount simulated refund once."]]}, {"heading": "Boundary handling", "text": "Re-evaluate expiry when an action runs, even if the visible timer has not refreshed. A failed precondition must leave booking and simulated financial state unchanged. References to the same review or booking must resolve to the same outcome within the current session."}]}, {"id": "data-model", "title": "Data model", "stage": "design", "what": "Define the minimal entities and relationships used by the demonstration.", "why": "Keep quotes, reservations, and simulated money distinguishable and traceable.", "who": "Developers maintain the model with product and tester review.", "when": "Before state implementation and before adding or changing stored fields.", "where": "Keep beside the detailed design and privacy register.", "which": "Use fictional fleet, review, booking, payment, and refund data only.", "how": "Give stateful records identifiers and link financial effects to their originating review or booking.", "sections": [{"heading": "Data boundary", "text": "There are no renter names, addresses, contact details, licence numbers, card details, or real calendar dates. These records live in browser memory. Initial state contains the fleet and maintenance block only."}, {"heading": "Entities and constraints", "columns": ["Entity", "Fields or relationship", "Invariant"], "rows": [["Car", "carId, name, dailyRateCents", "Exactly City/6000 and Family/9000."], ["Maintenance", "carId, pickup, return", "Family [10,12), immutable in the interface."], ["Review", "reviewId, carId, pickup, return, duration, totalCents, createdAt, expiresAt, status", "At most one pending; expiresAt = createdAt + 120 seconds."], ["Booking", "bookingId, reviewId, carId, pickup, return, totalCents, status", "One booking per confirmed review; all treated as future."], ["Simulated payment", "paymentId, bookingId, amountCents", "One full quote amount per confirmed booking."], ["Simulated refund", "refundId, bookingId, paymentId, amountCents", "At most one full original payment amount per cancellation."]]}, {"heading": "Availability projection", "text": "Only confirmed bookings and the active pending hold occupy rental intervals; cancelled bookings and expired reviews do not. The maintenance block always occupies Family [10,12). Historical simulated records remain distinguishable from current availability for the life of the session."}]}, {"id": "api", "title": "Interface contract", "stage": "design", "what": "Describe the domain operations the interface calls; no network API is implemented by this case.", "why": "Make inputs, outcomes, and duplicate-action behavior explicit.", "who": "Developers define operations and testers use the contract to design checks.", "when": "Before wiring views to state transitions and before any proposed server integration.", "where": "Keep alongside detailed design and the interface failure contract.", "which": "Use local create-review, confirm-review, cancel-review, and cancel-booking operations.", "how": "Pass record identifiers, return explicit statuses, and leave rejected actions without side effects.", "sections": [{"heading": "Local interface scope", "text": "The browser view invokes local operations over in-memory state. The names below are conceptual contracts, not claims that HTTP endpoints or a payment provider exist. Every operation evaluates the same canonical domain rules."}, {"heading": "Operations", "columns": ["Operation", "Input", "Outcome"], "rows": [["createReview", "carId, pickup, return, current elapsed clock", "Pending snapshot or invalid-input, unavailable, or pending-review-exists."], ["confirmReview", "reviewId and current elapsed clock", "Existing confirmed result or one new booking/payment; otherwise expired or invalid-state."], ["cancelReview", "reviewId", "Cancelled or already-terminal result; no simulated money."], ["cancelBooking", "bookingId", "One cancellation/full simulated refund or existing cancellation result."]]}, {"heading": "Future service contract", "text": "A real API proposal would need identity, authorization, durable idempotency, shared availability enforcement, and safe handling of uncertain provider outcomes. Those contracts require separate design and review; browser operation names do not supply those protections."}]}, {"id": "ui", "title": "User interface specification", "stage": "design", "what": "Describe the information and actions shown during the rental journey.", "why": "Help people distinguish available selections, held reviews, bookings, and refunds.", "who": "A designer drafts it with product and accessibility reviewers.", "when": "Before interface implementation and after participant feedback reveals confusion.", "where": "Keep with screen sketches, user-guide wording, and accessibility checks.", "which": "Use explicit day-offset labels and simulated-payment language throughout.", "how": "Define each state’s visible details, allowed actions, and recovery guidance.", "sections": [{"heading": "Selection and wording", "text": "Display City — SGD 60/day and Family — SGD 90/day. Label inputs “Pickup day (1–30)” and “Return day (1–30)” and explain that return day is excluded. Show the fixed Family maintenance interval as information, with no editing control."}, {"heading": "Screen states", "columns": ["State", "Information", "Actions"], "rows": [["Selecting", "Car, pickup, return, duration constraints, maintenance note.", "Request review."], ["Pending review", "Frozen car, interval, duration, SGD total, expiry status, simulation notice.", "Confirm simulated payment or cancel review."], ["Expired review", "Explain that no booking or payment was created.", "Return to selection and request a fresh review."], ["Confirmed booking", "Booking identity, reserved interval, recorded simulated payment.", "Cancel future booking for full simulated refund."], ["Cancelled booking", "Released interval and original-amount simulated refund.", "Inspect result or start a new selection."]]}, {"heading": "Interaction clarity", "text": "Associate error text with its field and announce significant status changes. Avoid announcing every countdown tick. Retain a useful keyboard focus target when a review expires or disappears; changing selection cannot silently alter an already reviewed quote."}]}, {"id": "adr", "title": "Architecture decision record", "stage": "design", "what": "Record the proposed choice of a single browser-memory model for this educational case.", "why": "Explain the simplicity gained and the production capabilities deliberately absent.", "who": "The technical lead proposes the decision; product a
