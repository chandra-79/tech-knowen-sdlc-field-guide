ross-roles", "stage": "testing", "title": "Share quality work across roles", "explanation": "Developers and testers contribute different perspectives while sharing responsibility for quality. Developers can inspect calculations and add quick checks close to the code. Testers can investigate unusual journeys and question assumptions across the whole feature. For Harbour Bank, they should agree what insufficient funds means before a defect debate begins. Job titles vary between teams; explicit responsibilities and collaboration matter more than handing quality to one designated person.", "ask": "What should developers and testers agree before investigating a disputed transfer result?", "sources": ["https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695671/5.10%2B-%2BSTP%2B-%2BSoftware%2BTest%2BPlan", "https://scrumguides.org/scrum-guide.html"]}, {"id": "involve-users-in-acceptance", "stage": "testing", "title": "Involve users in acceptance", "explanation": "User acceptance testing brings people who understand the work into judging whether the solution supports it. Ask Harbour Bank participants to move money between their fictional accounts, inspect the review, correct a mistake, and explain the result. Give them realistic goals and agreed acceptance criteria. Their feedback can reveal missing business meaning; approval from a participant does not substitute for technical, accessibility, or security evidence outside that exercise.", "ask": "What realistic task would reveal whether the review step helps a user notice an incorrect direction?", "sources": ["https://www.nasa.gov/reference/5-0-product-realization/", "https://learn.microsoft.com/en-us/dynamics365/guidance/implementation-guide/testing-strategy-test-types"]}, {"id": "test-functions-and-quality-characteristics", "stage": "testing", "title": "Test functions and quality characteristics", "explanation": "Functional testing examines what the software does; quality-focused testing examines characteristics such as responsiveness, accessibility, and reliability. Harbour Bank must calculate the right balances, but users also need readable information and workable keyboard controls. Separate objectives help avoid assuming that correct arithmetic means the whole experience is satisfactory. State the conditions for each check, including devices, browsers, and any agreed timing target, so results remain meaningful.", "ask": "Which quality problem could prevent a correct transfer calculation from being useful to a customer?", "sources": ["https://learn.microsoft.com/en-us/dynamics365/guidance/implementation-guide/testing-strategy-test-types", "https://www.w3.org/WAI/fundamentals/accessibility-principles/"]}, {"id": "retest-a-fix-and-check-for-regressions", "stage": "testing", "title": "Retest a fix and check for regressions", "explanation": "Confirmation testing checks that a particular defect has been fixed. Regression testing investigates whether a change harmed behavior that should still work. If Harbour Bank fixes zero-value transfers, rerun that rejected case, then check a valid cent transfer, insufficient funds, review, and confirmation. The right regression scope depends on what changed and what it could affect. Repeating only the previously failing case leaves neighboring behavior unexamined.", "ask": "After changing the amount parser, which previously working cases would you revisit?", "sources": ["https://learn.microsoft.com/en-us/dynamics365/guidance/implementation-guide/testing-strategy-test-types", "https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695451/SWE-068%2B-%2BEvaluate%2BTest%2BResults"]}, {"id": "choose-tools-for-the-testing-question", "stage": "testing", "title": "Choose tools for the testing question", "explanation": "Select a testing tool by the question it helps answer and the effort needed to maintain it. A unit-test runner suits Harbour Bank’s amount rules; browser automation suits a repeatable transfer journey; a human session helps assess confusing wording. Consider reliability, team skills, reporting, and environment support. Start with a small trial using a real test need before committing to a tool or counting its installation as testing progress.", "ask": "What Harbour Bank test would you use to evaluate a proposed browser automation tool?", "sources": ["https://learn.microsoft.com/en-us/azure/well-architected/operational-excellence/testing"]}, {"id": "understand-automation-limits", "stage": "testing", "title": "Understand automation limits", "explanation": "Automation repeats programmed actions and comparisons efficiently, but it inherits the assumptions written into those checks. A script can confirm that Harbour Bank displays an amount without noticing that the account direction is confusing. Automated checks also need maintenance when behavior intentionally changes. Combine reliable repeated checks with investigation and user observation, and examine failures rather than repeatedly rerunning a flaky test until a green result appears.", "ask": "What judgment about the review screen would be difficult to capture in a simple automated assertion?", "sources": ["https://learn.microsoft.com/en-us/azure/well-architected/operational-excellence/testing"]}, {"id": "retain-evidence-of-test-outcomes", "stage": "testing", "title": "Retain evidence of test outcomes", "explanation": "Useful test evidence connects the expected result to what actually happened on a known software version. For Harbour Bank, record the starting balances, transfer details, resulting balances, and whether confirmation occurred. Include enough supporting information to investigate a difference. Distinguish passed, failed, blocked, and unexecuted cases. A screenshot of a success message alone cannot establish that the correct accounts changed by the correct amount.", "ask": "What evidence would demonstrate that a rejected transfer preserved both balances?", "sources": ["https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695451/SWE-068%2B-%2BEvaluate%2BTest%2BResults", "https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695671/5.10%2B-%2BSTP%2B-%2BSoftware%2BTest%2BPlan"]}, {"id": "move-defects-through-a-clear-workflow", "stage": "testing", "title": "Move defects through a clear workflow", "explanation": "A defect workflow makes the next action and its owner visible. A Harbour Bank issue might move from reported to assessed, assigned, fixed, and checked before closure. Teams may also defer an issue or reject it with a recorded reason. Severity describes impact, while priority describes scheduling urgency. State names can vary; what matters is that a claimed fix receives appropriate evidence and an unresolved risk remains visible.", "ask": "What evidence should be required before closing an issue about duplicated confirmation?", "sources": ["https://learn.microsoft.com/en-us/azure/devops/boards/backlogs/manage-bugs?view=azure-devops"]}, {"id": "write-a-defect-report-others-can-use", "stage": "testing", "title": "Write a defect report others can use", "explanation": "A useful defect report gives another person a clear starting point. Include a specific title, software version, starting state, steps, expected result, actual result, and relevant evidence. For Harbour Bank, say which account supplied the money and whether review was completed. Describe the user impact without guessing the cause. “Savings decreases after a current-to-savings transfer” is more actionable than “banking is broken” and helps the team reproduce the observation.", "ask": "Which missing detail would most obstruct investigation of a report that says only “the balance is wrong”?", "sources": ["https://learn.microsoft.com/en-us/azure/devops/boards/backlogs/manage-bugs?view=azure-devops"]}, {"id": "describe-observations-objectively", "stage": "testing", "title": "Describe observations objectively", "explanation": "Objective wording separates observation from interpretation. “After confirming SGD 100 from current to savings, current shows SGD 2,300” reports a checkable result from a known starting balance of SGD 2,500. “The developer forgot subtraction” assumes a cause and attributes blame before investigation. Include the expected SGD 2,400 and evidence of the steps. Precise language makes disagreements easier to resolve because colleagues can examine the same facts.", "ask": "How would you rewrite “this careless code loses money” as an observation another person can verify?", "sources": ["https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695451/SWE-068%2B-%2BEvaluate%2BTest%2BResults"]}, {"id": "make-results-reproducible", "stage": "testing", "title": "Make results reproducible", "explanation": "Reproducibility means another person can recreate the relevant conditions and investigate the same behavior. Reset Harbour Bank, specify the browser and version, list the account direction and exact input, then describe every action through review and confirmation. If the issue happens intermittently, record frequency and circumstances instead of pretending it is consistent. Missing starting state often turns a useful failure into a lengthy exchange of guesses.", "ask": "What would you record when repeated confirmation changes balances only occasionally?", "sources": ["https://learn.microsoft.com/en-us/azure/devops/boards/backlogs/manage-bugs?view=azure-devops"]}, {"id": "collaborate-on-failures-constructively", "stage": "testing", "title": "Collaborate on failures constructively", "explanation": "A failure is shared information about the product. Bring developers, testers, and business participants together around the requirement and observed evidence. If Harbour Bank rejects an amount someone expected to accept, inspect the balance, account direction, and agreed rule before deciding whether the code or expectation needs changing. Ask for the reasoning behind a choice and record the resolution. Respectful disagreement can expose an assumption that everyone previously overlooked.", "ask": "What neutral opening would help discuss a disagreement about an insufficient-funds result?", "sources": ["https://cheatsheetseries.owasp.org/cheatsheets/Secure_Code_Review_Cheat_Sheet.html", "https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695671/5.10%2B-%2BSTP%2B-%2BSoftware%2BTest%2BPlan"]}, {"id": "plan-testing-around-scope-and-risk", "stage": "testing", "title": "Plan testing around scope and risk", "explanation": "A test plan explains the scope, objectives, approach, responsibilities, environment, schedule, and criteria for stopping or completing testing. Harbour Bank’s plan should identify transfer calculations, rejected inputs, review behavior, and accessibility checks, along with its browser-only limits. Plan the starting data and evidence too. Update the plan when risks or requirements change, and make exclusions explicit so stakeholders know which conclusions the work can support.", "ask": "Which exclusion must the plan state to prevent a browser demonstration being treated as a production-security assessment?", "sources": ["https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695671/5.10%2B-%2BSTP%2B-%2BSoftware%2BTest%2BPlan"]}, {"id": "trace-requirements-forward-and-backward", "stage": "testing", "title": "Trace requirements forward and backward", "explanation": "Forward traceability follows a requirement into design, implementation, and tests. Backward traceability follows an item back to the need that justifies it. For Harbour Bank, the review requirement should lead to a review screen and checks proving balances remain unchanged before confirmation. Starting from a confirmation test should lead back to the same requirement. Both directions help reveal missing work, unexplained behavior, and the likely reach of a change.", "ask": "What might you discover by tracing an existing test backward when it has no linked requirement?", "sources": ["https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695427/SWE-052%2B-%2BBidirectional%2BTraceability"]}, {"id": "separate-coverage-from-pass-rate", "stage": "testing", "title": "Separate coverage from pass rate", "explanation": "Coverage describes which selected requirements or conditions have been addressed; pass rate describes outcomes among executed tests. Harbour Bank can pass every executed case while leaving the savings-to-current direction untested. Also distinguish a requirement linked to a planned test from one supported by completed evidence. Report the coverage definition, missing areas, and execution status together. A percentage without its denominator can create more confidence than the evidence deserves.", "ask": "How could a report show a 100 percent pass rate while transfer coverage remains incomplete?", "sources": ["https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695427/SWE-052%2B-%2BBidirectional%2BTraceability", "https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695451/SWE-068%2B-%2BEvaluate%2BTest%2BResults"]}, {"id": "keep-the-traceability-matrix-current", "stage": "testing", "title": "Keep the traceability matrix current", "explanation": "A requirements traceability matrix, or RTM, records links between requirements and the work that addresses them. Harbour Bank can use a simple table with requirement ID, design reference, test ID, execution status, and evidence link. Give someone responsibility for updating it when items change. Stable identifiers help preserve the history, while review of broken or outdated links keeps the table useful for decisions rather than merely complete-looking.", "ask": "Which matrix fields should change when a test is revised but has not yet been rerun?", "sources": ["https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695427/SWE-052%2B-%2BBidirectional%2BTraceability", "https://swehb.nasa.gov/spaces/SWEHBVC/pages/100598308/Software%2BRequirements%2BAnalysis"]}, {"id": "trace-a-banking-rule-into-tests", "stage": "testing", "title": "Trace a banking rule into tests", "explanation": "Consider requirement HB-AMOUNT: accept the amount range SGD 0.01 through SGD 10,000, subject to sufficient funds. Link it to amount validation and tests for zero, one cent, 10,000, and 10,000.01. Harbour Bank starts with only SGD 2,500 in current, so a 10,000 transfer must fail the balance check. Test the upper amount boundary separately at the rule level; do not mistake an insufficient-funds rejection for proof of the limit.", "ask": "Why does rejecting SGD 10,000.01 from a SGD 2,500 account fail to prove which rule caused the rejection?", "sources": ["https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695427/SWE-052%2B-%2BBidirectional%2BTraceability", "https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695671/5.10%2B-%2BSTP%2B-%2BSoftware%2BTest%2BPlan"]}, {"id": "identify-gaps-and-expected-rejections", "stage": "testing", "title": "Identify gaps and expected rejections", "explanation": "An uncovered case has no adequate test evidence; an expected rejection can be a successful test outcome. Harbour Bank should reject a transfer to the same account and preserve both balances. Mark that case passed when the expected rejection occurs. Keep a different status for cases never run or blocked by another issue. This distinction prevents a list of green results from concealing missing checks or incorrectly treating every error message as failure.", "ask": "How would you label a same-account transfer that is correctly rejected, versus one that has never been tested?", "sources": ["https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695671/5.10%2B-%2BSTP%2B-%2BSoftware%2BTest%2BPlan", "https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695451/SWE-068%2B-%2BEvaluate%2BTest%2BResults"]}, {"id": "follow-traceability-through-change", "stage": "testing", "title": "Follow traceability through change", "explanation": "When a requirement changes, follow its links before editing isolated files. If Harbour Bank hypothetically introduced a lower transfer cap, review the rule text, validator, displayed guidance, boundary cases, and stored expectations together. Record the new requirement version and rerun affected checks. Historical results remain evidence for their original version; they do not automatically establish the new behavior. Traceability helps identify this work but still needs informed review.", "ask": "Which linked items could become misleading immediately after a transfer-limit change?", "sources": ["https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695427/SWE-052%2B-%2BBidirectional%2BTraceability", "https://swehb.nasa.gov/spaces/SWEHBVC/pages/100598308/Software%2BRequirements%2BAnalysis"]}, {"id": "recognize-functional-data-and-quality-failures", "stage": "testing", "title": "Recognize functional, data, and quality failures", "explanation": "Failures can concern actions, information, or quality characteristics, and one incident may span several categories. Harbour Bank skipping review is a functional failure; storing or showing the wrong balance is a data failure; making confirmation unreachable by keyboard is an accessibility failure. Categorizing the observation helps choose investigators and further checks. Preserve the full user impact rather than forcing the issue into a single label that hides part of the problem.", "ask": "Which categories apply if confirmation succeeds but the displayed balance is stale and the result is never announced to a screen reader?", "sources": ["https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695451/SWE-068%2B-%2BEvaluate%2BTest%2BResults", "https://www.w3.org/WAI/fundamentals/accessibility-principles/"]}, {"id": "test-transaction-boundaries", "stage": "testing", "title": "Test the edges of an allowed range", "explanation": "Boundary testing concentrates on values at and around the points where behavior should change. Harbour Bank permits transaction amounts from SGD 0.01 through SGD 10,000.00 inclusive, so useful amount checks include 0.00, 0.01, 0.02, 9,999.99, 10,000.00, and 10,000.01. Test the balance rule separately: an amount can pass the permitted range yet exceed available funds. With a starting current balance of SGD 2,500, a large transfer should fail for insufficient funds. This separation helps identify which rule actually rejected an input.", "ask": "How would you test the maximum amount rule without accidentally testing only the available balance rule?", "sources": ["https://www.istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf"]}, {"id": "group-equivalent-test-inputs", "stage": "testing", "title": "Choose representatives from input groups", "explanation": "Equivalence partitioning groups inputs that are expected to receive the same kind of treatment, then selects representatives from each group. For Harbour Bank, candidate groups include valid amounts within the balance, valid amounts above the balance, values outside the permitted range, and text that is not an amount. Grouping makes test selection deliberate when trying every possible input is impractical. Check that each proposed group really follows the same rule. A value with three decimal places may need its own precision case rather than being treated as ordinary valid money.", "ask": "Which different invalid inputs should produce different explanations for the user?", "sources": ["https://www.istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf"]}, {"id": "test-state-transitions", "stage": "testing", "title": "Test the journey between states", "explanation": "A state describes the situation a system is currently in, and an event may move it to another state. Harbour Bank's transfer journey can be examined as entering details, reviewing, and completing or cancelling. Check the transitions as well as the screens: review must not move money, cancellation must preserve balances, and confirmation must apply the reviewed details once. Starting from SGD 2,500 current and SGD 1,000 savings, a confirmed SGD 100 transfer should produce SGD 2,400 and SGD 1,100. Also investigate attempts to skip or repeat steps.", "ask": "What should happen if the user edits the amount after seeing the review summary?", "sources": ["https://stately.ai/docs/transitions"]}, {"id": "exploratory-testing-charters", "stage": "testing", "title": "Explore with a focused question", "explanation": "Exploratory testing combines learning about the product with choosing and performing tests. Give a session a clear question, such as whether Harbour Bank remains understandable when the user changes their mind repeatedly. Try plausible variations, follow surprising results, and record what you attempted and observed. For example, switch accounts, correct an amount, cancel review, and start again. A focused investigation can reveal combinations that a prepared checklist missed. Keep notes detailed enough for someone else to reproduce a problem and distinguish observed failures from questions needing further investigation.", "ask": "What uncertain behavior would you explore for fifteen minutes, and what evidence would you keep?", "sources": ["https://www.satisfice.com/blog/archives/1509"]}, {"id": "evaluate-accessibility-in-use", "stage": "testing", "title": "Combine accessibility checks with real use", "explanation": "Accessibility evaluation needs several kinds of evidence. Automated tools can identify some detectable issues, while manual checks and work with disabled users reveal other barriers. For Harbour Bank, try the full journey with a keyboard, inspect whether focus remains understandable, and check how labels, errors, and confirmation information are announced by assistive technology. Evaluate corrections and cancellation as carefully as success. A clean scanner report cannot establish that everyone can complete a task. Record the tested conditions and remaining gaps so the result is useful rather than a blanket assurance.", "ask": "What accessibility barrier could remain even when an automated scan reports no errors?", "sources": ["https://www.w3.org/WAI/test-evaluate/"]}, {"id": "security-testing-abuse-cases", "stage": "testing", "title": "Test attempts to break the rules", "explanation": "Security testing asks what happens when someone uses the system in ways the normal journey does not invite. In an authorized test environment for a proposed real Harbour Bank service, testers would check altered account identifiers, missing permissions, tampered amounts, and repeated requests. Expected results must cover both rejection and the absence of unintended balance changes or information disclosure. The browser prototype can illustrate input handling, but it has no server security controls to validate. Scope the investigation and preserve clear evidence about which protections were actually examined.", "ask": "Which rule needs a test that sends an altered request instead of only clicking through the screen?", "sources": ["https://owasp.org/projects/web-security-testing-guide"]}, {"id": "performance-from-user-experience", "stage": "testing", "title": "Measure the delays users experience", "explanation": "Performance testing starts with the task people are trying to finish and the conditions in which they do it. Measure meaningful moments, such as when a screen becomes usable and how quickly an interaction receives feedback. A smooth Harbour Bank demo on a fast laptop does not establish performance on slower devices or prove the capacity of a future server. State the device, connection, workload, and measurement method. Look beyond a single average, because a minority of very slow experiences can disappear inside an otherwise reassuring number.", "ask": "Which delay would matter most to someone who is unsure whether their transfer was accepted?", "sources": ["https://web.dev/articles/user-centric-performance-metrics"]}, {"id": "verify-ai-generated-tests", "stage": "testing", "title": "Check whether generated tests prove the rule", "explanation": "AI can suggest test cases, but a passing generated test is useful only when its expected result is independently correct. Compare each expectation with the agreed requirement and calculate important examples yourself. If an AI test accepts SGD 0.00 or expects balances to change during review, the test contains the same mistake you want to prevent. For Harbour Bank, independently check that a transfer preserves the combined balance and changes each account by the correct number of cents. Also inspect which important conditions the generated suite never exercises.", "ask": "How would you discover that both generated code and its generated tests share the same wrong assumption?", "sources": ["https://docs.github.com/copilot/responsible-use/chat-in-github"]}, {"id": "release-preparation", "stage": "deployment", "title": "Preparing a release", "explanation": "A release brings a particular version to its intended users. Preparation answers four practical questions: what is changing, who may be affected, what evidence supports release, and what will happen if the change fails? For Harbour Bank, a clearer transfer review screen still needs checks that its amount and account names match the transaction. A release decision belongs to named people who understand the remaining risks.", "ask": "What evidence would you ask for before making a new transfer screen available?", "sources": ["https://docs.aws.amazon.com/whitepapers/latest/introduction-devops-aws/deployment-strategies.html"]}, {"id": "deployment-and-release", "stage": "deployment", "title": "Deployment and release", "explanation": "Deployment places software into an environment; release makes a capability available to users. The two can happen together or separately. A team might deploy a new receipt design while keeping access limited until support guidance is ready. Distinguishing these events helps people understand whether a version merely exists on the system or is already affecting customers. Record both the deployed version and the features enabled for each audience.", "ask": "Could a version be deployed successfully while its new feature remains unavailable?", "sources": ["https://docs.aws.amazon.com/whitepapers/latest/introduction-devops-aws/deployment-strategies.html"]}, {"id": "release-responsibilities", "stage": "deployment", "title": "People involved in a release", "explanation": "A release crosses job boundaries. Developers explain the change, testers describe observed results, operations checks the running environment, and the product owner assesses user impact. A named release lead coordinates these inputs rather than replacing them. For Harbour Bank, somebody must decide whether a receipt-format defect is acceptable and somebody must know how to restore the previous version. Record names or accountable roles before the release window.", "ask": "Who should act if the release passes installation checks but customers cannot transfer?", "sources": ["https://docs.aws.amazon.com/whitepapers/latest/introduction-devops-aws/deployment-strategies.html"]}, {"id": "support-handover", "stage": "deployment", "title": "A handover that support can use", "explanation": "A useful handover helps a colleague handle the next real problem. Describe the service purpose, common symptoms, safe checks, escalation contacts and limits of support authority. For Harbour Bank, a missing receipt might mean a lost response rather than a failed transfer. Support therefore needs a way to inspect transaction status before suggesting a retry. The local demo has no support backend; its user guide explains its reset and memory-only behaviour.", "ask": "What could go wrong if support advised every customer to repeat a missing receipt transaction?", "sources": ["https://sre.google/sre-book/monitoring-distributed-systems/"]}, {"id": "environment-purpose", "stage": "deployment", "title": "Why projects use different environments", "explanation": "An environment is a place where a version runs with particular data and settings. Developers need fast feedback; testers need controlled conditions; staging supports release rehearsal; production serves users. Names vary, and small projects may combine some purposes. A staging transfer using invented accounts can test a release procedure without changing real balances. Confidence depends on relevant similarities and known differences, not simply calling an environment production-like.", "ask": "Which differences between staging and production could invalidate a transfer test?", "sources": ["https://docs.aws.amazon.com/whitepapers/latest/introduction-devops-aws/deployment-strategies.html"]}, {"id": "availability-and-recovery", "stage": "deployment", "title": "Availability and recovery are different goals", "explanation": "Availability concerns keeping a service usable; recovery concerns restoring it after disruption. Redundant application instances may survive one machine failing but will not necessarily protect against corrupted data. A proposed real banking service therefore needs both continuity measures and tested restoration arrangements. The business should define tolerable interruption and data loss. This browser demonstration has neither a redundant server service nor durable recovery, so its reset is not a disaster-recovery mechanism.", "ask": "Would a second server help if both servers use the same damaged data?", "sources": ["https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/plan-for-disaster-recovery-dr.html"]}, {"id": "rollout-purpose", "stage": "deployment", "title": "Start with the rollout risk", "explanation": "Choosing a rollout approach starts with the failure you want to limit. If a new transfer service might behave differently under load, exposing a small audience can produce early evidence. If the change requires an incompatible database update, traffic routing alone may not make rollback safe. Compare the users exposed, time to detect failure, available capacity and recovery options. A familiar strategy name does not answer these questions automatically.", "ask": "What must be known before choosing a gradual rollout for a data-changing feature?", "sources": ["https://docs.aws.amazon.com/whitepapers/latest/introduction-devops-aws/deployment-strategies.html"]}, {"id": "recreate-release", "stage": "deployment", "title": "Replacing everything during a planned stop", "explanation": "A recreate rollout removes the running application instances before starting the replacement instances. That can create a period when the service is unavailable. It may be acceptable for an internal tool with an agreed maintenance window, but requires communication and recovery preparation. For Harbour Bank, the team would need a policy for in-progress transfers before stopping a real service. Ending processes abruptly is not a substitute for managing unfinished work.", "ask": "What should happen to a transfer already accepted when the maintenance window starts?", "sources": ["https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"]}, {"id": "rolling-release", "stage": "deployment", "title": "Replacing instances in batches", "explanation": "A rolling update introduces replacement application instances while some older instances continue running. Health checks and capacity limits control progress. During the transition, both versions may handle requests, so shared data and interfaces must remain compatible. For example, adding an optional receipt field may be easier to roll out than removing a field that older instances still require. A rolling update reduces some interruption risks but cannot by itself guarantee uninterrupted service.", "ask": "Which check would reveal that old and new instances disagree about a receipt field?", "sources": ["https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"]}, {"id": "blue-green-release", "stage": "deployment", "title": "Switching between two environments", "explanation": "Blue/green release prepares a second environment and then directs users to it. The first environment can remain available for recovery, subject to cost and compatibility constraints. For a banking service, switching traffic back does not undo transfers already recorded or reverse a database change. The plan must account for shared state, in-progress requests and downstream systems. Rehearsing the switch and reversal provides stronger evidence than a diagram showing two boxes.", "ask": "What information must remain usable by the old version after a traffic switch?", "sources": ["https://docs.aws.amazon.com/whitepapers/latest/introduction-devops-aws/deployment-strategies.html"]}, {"id": "phased-and-canary-release", "stage": "deployment", "title": "Expanding access with evidence", "explanation": "A phased release adds users or locations in planned steps. A canary release uses an initial limited exposure to evaluate a new version before wider rollout. The important detail is the decision rule: what observation allows expansion, and what stops it? For a proposed banking release, unexpected duplicate receipts might justify a pause even when the error percentage looks small. Choose signals that reflect the consequence of failure, not only traffic volume.", "ask": "Why might one money-consistency failure outweigh many successful page views?", "sources": ["https://docs.aws.amazon.com/whitepapers/latest/introduction-devops-aws/deployment-strategies.html"]}, {"id": "ab-experiment", "stage": "deployment", "title": "Comparing user outcomes with A/B experiments", "explanation": "An A/B experiment assigns eligible users or requests to alternatives and compares a planned outcome. For example, two instruction texts could be compared for successful completion of a transfer review task. Decide the measure, allocation method and analysis approach before interpreting results. A difference can reflect chance or poor experiment design. Safety controls must remain equivalent; an experiment about clarity should never weaken transaction checks to make one version appear faster.", "ask": "What could make a comparison misleading even when one version has more completions?", "sources": ["https://firebase.google.com/docs/ab-testing/ab-concepts"]}, {"id": "shadow-observation", "stage": "deployment", "title": "Observing a version without serving its answers", "explanation": "Shadowing sends a copy of live input to another implementation while users continue receiving the established service response. It can reveal differences without making the new answers authoritative. A banking shadow must not independently move money, send receipts or trigger downstream payments. Sensitive input also needs appropriate controls. Comparing only response text may miss hidden side effects, so isolation and an explicit comparison plan are essential before such an experiment.", "ask": "Which side effects would have to be disabled in a shadow transfer service?", "sources": ["https://docs.aws.amazon.com/sagemaker/latest/dg/model-shadow-deployment.html"]}, {"id": "release-choice-record", "stage": "deployment", "title": "Recording why a release approach fits", "explanation": "A short release decision records the alternatives considered, why one fits the change and what could invalidate the choice. For Harbour Bank, a cosmetic help-text change has a different risk from changing stored account identifiers. Include recovery constraints, monitoring signals and who can pause the rollout. Keeping the reasoning with the release plan helps the next team distinguish a reusable practice from a choice made for one particular situation.", "ask": "What changed condition would make you revisit a previously successful rollout approach?", "sources": ["https://docs.aws.amazon.com/whitepapers/latest/introduction-devops-aws/deployment-strategies.html"]}, {"id": "release-readiness-gates", "stage": "deployment", "title": "Decide readiness using explicit evidence", "explanation": "A readiness gate is a decision point with agreed evidence for proceeding, stopping, or resolving a gap. For a real Harbour Bank release, that evidence would include relevant test results, operational ownership, a recovery plan, and checks that critical user journeys still work. Agree the criteria before release pressure builds and name who can accept remaining risk. Publishing the browser demonstration needs checks appropriate to a fictional prototype, not a claim of banking readiness. Record the release version so any later problem can be connected to what actually changed.", "ask": "What missing evidence would make you stop a release even if the deadline had arrived?", "sources": ["https://learn.microsoft.com/en-us/azure/well-architected/operational-excellence/safe-deployments"]}, {"id": "feature-flags-and-exposure", "stage": "deployment", "title": "Control who sees a new feature", "explanation": "A feature flag is a setting that changes whether a particular behavior is available. A real service can use flags to expose a change gradually and disable it if agreed warning signs appear. For Harbour Bank, a proposed new help panel could be introduced to a limited group while the team watches relevant evidence. Test both enabled and disabled behavior, assign an owner, and plan when to remove obsolete flags. Switching a feature off does not undo data it already changed or replace the need for authorization checks.", "ask": "What evidence would tell you to expand a flagged feature to more users or switch it off?", "sources": ["https://learn.microsoft.com/en-us/azure/well-architected/operational-excellence/safe-deployments"]}, {"id": "database-migration-planning", "stage": "deployment", "title": "Plan changes to stored data carefully", "explanation": "A database migration changes the structure or contents of persistent data, such as adding a field or changing how a value is represented. A proposed real Harbour Bank migration would need to account for existing records, validation, running software versions, and the effect on service availability. Rehearse the operation with representative safe data and decide how correctness will be checked afterward. Removing a field can also remove its contents, so reverting application code may not restore what was lost. The in-memory demonstration has no production database to migrate.", "ask": "What would still be missing if you restored yesterday's application code after deleting a database field?", "sources": ["https://www.postgresql.org/docs/current/ddl-alter.html"]}, {"id": "recovery-objectives", "stage": "deployment", "title": "Agree what recovery must achieve", "explanation": "Recovery planning asks how quickly a service must return and how much recent data loss, if any, the organization can tolerate. These are commonly expressed as recovery time and recovery point objectives. The chosen targets should follow business needs and be demonstrated through recovery exercises. For a real transfer service, restoring old balances without reconciling later transactions could create serious inconsistencies. Harbour Bank's browser reset simply returns a fictional demonstration to its initial state; it is not evidence of disaster recovery. Document the steps, owners, and verification of restored data.", "ask": "How would you know that a recovered service was both available and holding the correct records?", "sources": ["https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/plan-for-disaster-recovery-dr.html"]}, {"id": "design-operational-observability", "stage": "deployment", "title": "Make service behavior explainable", "explanation": "Observability helps a team understand what a running system is doing from the evidence it emits. Metrics summarize behavior, logs record events, and traces connect work across components. A real Harbour Bank service would need to distinguish rejected transfers, technical failures, and completed requests while protecting sensitive information. Decide which questions operators must answer before choosing signals to collect. A total error count alone may hide which user journey is affected. The browser demonstration can illustrate events, but it does not provide monitoring of a real banking service.", "ask": "What information would an operator need to explain a reported transfer failure without exposing private details?", "sources": ["https://opentelemetry.io/docs/concepts/observability-primer/"]}, {"id": "keep-service-useful", "stage": "maintenance", "title": "Keeping a service useful after launch", "explanation": "Users discover needs and problems while a service is operating. Maintenance turns those observations into controlled work rather than unrelated quick fixes. A confusing transfer receipt may require revised wording, a requirement clarification and checks of previous journeys. Record the problem, decide its priority, change the affected parts and verify the outcome. The aim is continued usefulness with understood risk, not simply keeping the application running unchanged.", "ask": "Which evidence would show that a receipt improvement actually helped users?", "sources": ["https://www.computer.org/education/bodies-of-knowledge/software-engineering"]}, {"id": "maintenance-scope", "stage": "maintenance", "title": "What maintenance can include", "explanation": "Maintenance covers changes to delivered software and its supporting information. Work might correct a calculation, accommodate a new dependency, improve usability or reduce the likelihood of a future fault. An operational restart can restore service without correcting the underlying software issue; the two activities should be recorded distinctly. For Harbour Bank, a temporary workaround for a display problem should not be mistaken for a verified permanent change.", "ask": "How would you distinguish restoring service today from preventing the same failure next week?", "sources": ["https://www.computer.org/education/bodies-of-knowledge/software-engineering"]}, {"id": "change-triggers", "stage": "maintenance", "title": "Where change requests come from", "explanation": "A change can begin with a user complaint, a new business rule, an unsupported dependency or an observed security weakness. The trigger does not tell you the right solution. If users repeatedly abandon a transfer review, investigate whether wording, performance or account selection is the problem. Record what is known and what still needs evidence. That separates a legitimate need from an attractive but untested proposal.", "ask": "What would you investigate before deciding to remove the review step?", "sources": ["https://www.computer.org/education/bodies-of-knowledge/software-engineering"]}, {"id": "evolve-integrate-retire", "stage": "maintenance", "title": "Evolving, integrating and retiring services", "explanation": "A service may gain capabilities, connect to another system or reach the end of its useful life. Each direction creates work beyond changing code. A new account provider needs agreed data and failure behaviour; retirement needs notice, dependency checks and decisions about records. Do not assume that switching off a screen ends every obligation. Use a clear transition plan that identifies affected people, retained information and the point at which responsibility transfers.", "ask": "Which dependency could continue using a service after its public screen is closed?", "sources": ["https://www.computer.org/education/bodies-of-knowledge/software-engineering"]}, {"id": "change-with-continuity", "stage": "maintenance", "title": "Changing software while people depend on it", "explanation": "Maintenance must consider both the requested improvement and the behaviour users already rely on. Changing amount formatting may seem harmless, yet could affect automated reports or error messages. Review related requirements and interfaces before deciding the change is small. Use regression checks to look for unintended effects, and watch the service after release. A successful implementation is only one part of showing that the change is safe enough to keep.", "ask": "Which existing journeys would you retest after changing currency formatting?", "sources": ["https://www.computer.org/education/bodies-of-knowledge/software-engineering"]}, {"id": "lifetime-costs", "stage": "maintenance", "title": "Understanding costs across a service lifetime", "explanation": "Initial delivery is only one part of software cost. Support, hosting, monitoring, updates, investigation and retirement also consume time or money. There is no fixed maintenance percentage suitable for every service. A long-lived banking product with many integrations may have very different costs from a short-lived demonstration. Estimate from the expected workload and service conditions, state assumptions, and revise estimates when actual effort or change demand becomes clearer.", "ask": "What information would make a lifetime-cost estimate more useful than a fixed percentage?", "sources": ["https://www.computer.org/education/bodies-of-knowledge/software-engineering"]}, {"id": "maintainability-effort", "stage": "maintenance", "title": "Why a small change may take a long time", "explanation": "Effort depends on how well people can understand the current behaviour and its dependencies. An amount-validation change may touch screens, APIs, tests and user guidance. Missing ownership or outdated documents can make investigation harder than implementation. Maintainability improves when responsibilities are clear, changes are traceable and useful automated checks exist. Count the affected behaviours and uncertainty rather than estimating only from the number of lines someone expects to edit.", "ask": "What would you inspect before estimating a change to the transfer limit?", "sources": ["https://www.computer.org/education/bodies-of-knowledge/software-engineering"]}, {"id": "maintenance-categories", "stage": "maintenance", "title": "Four useful ways to describe maintenance", "explanation": "Corrective maintenance fixes an observed fault. Adaptive maintenance responds to a changed operating environment. Perfective maintenance improves useful capability or quality. Preventive maintenance addresses potential faults before they cause operational failure. A real change can have more than one purpose, so the label supports discussion rather than replacing analysis. For Harbour Bank, correcting a wrong receipt total differs from improving receipt readability even though both affect the same screen.", "ask": "How would you classify updating an integration because its provider changed the interface?", "sources": ["https://www.computer.org/education/bodies-of-knowledge/software-engineering"]}, {"id": "maintenance-priorities", "stage": "maintenance", "title": "Prioritising maintenance by consequence", "explanation": "Maintenance backlogs often mix urgent defects, visible improvements and less visible risk reduction. Assess user impact, urgency, dependencies and the cost of waiting. A rare duplicate transfer is more serious than a frequent cosmetic mismatch because the consequences differ. Record the reason for priority and revisit it as evidence changes. Teams also need capacity for preventive work; waiting for every weakness to become an incident can increase disruption and cost.", "ask": "What information would help compare a severe rare defect with a minor frequent one?", "sources": ["https://www.computer.org/education/bodies-of-knowledge/software-engineering"]}, {"id": "maintenance-feedback-loop", "stage": "maintenance", "title": "Closing the loop after a change", "explanation": "A maintenance task begins with an observed gap and ends with evidence about its effect. Follow the gap through analysis, a chosen change, verification, delivery and observation. If a clearer error message is released, look at whether users can correct the input, not only whether the text changed. Update the relevant documents so the next person sees current behaviour. If the result is disappointing, use the new evidence to reconsider the diagnosis.", "ask": "What follow-up would you plan before changing an insufficient-funds message?", "sources": ["https://sre.google/sre-book/monitoring-distributed-systems/"]}, {"id": "shared-responsibility", "stage": "maintenance", "title": "Sharing work without losing accountability", "explanation": "Several roles may contribute to the same activity, but a decision still needs an accountable owner. A tester may identify an unclear transfer rule; an analyst clarifies it with the product owner; developers and operations assess implications. A responsibility table should explain who leads, contributes and accepts the result for this organisation. It is a conversation aid, not a universal rule that prevents someone from raising a concern outside their job title.", "ask": "Who should resolve a disagreement about expected behaviour after a defect is reported?", "sources": ["https://www.computer.org/education/bodies-of-knowledge/software-engineering"]}, {"id": "coordinate-incident-response", "stage": "maintenance", "title": "Coordinate people during an incident", "explanation": "Incident response organizes the work needed to limit harm and restore service when something significant goes wrong. Clear roles help one person coordinate, others investigate or recover the system, and another keep affected people informed. For a hypothetical real Harbour Bank outage, first establish what users can and cannot do, preserve useful evidence, and avoid uncoordinated changes that make diagnosis harder. Record decisions and times as the response unfolds. A prepared process reduces confusion, but teams still need judgment when the situation differs from the examples they rehearsed.", "ask": "During a serious incident, who would decide the next action and who would keep users informed?", "sources": ["https://sre.google/sre-book/managing-incidents/"]}, {"id": "service-level-objectives", "stage": "maintenance", "title": "Define reliability from the user's task", "explanation": "A service level objective, or SLO, is a target for a defined measure of service behavior over a stated period. A real Harbour Bank team might define a target for eligible transfer requests receiving a correct response within an agreed time. Specify what counts, how it is measured, and which failures matter to users. Compare actual performance with the target to guide reliability work and release decisions. The remaining tolerance for failure is often called an error budget. A browser demo cannot establish production reliability against such an objective.", "ask": "What would your reliability measure miss if it only checked whether the homepage was reachable?", "sources": ["https://sre.google/workbook/implementing-slos/"]}, {"id": "learn-from-problem-analysis", "stage": "maintenance", "title": "Investigate conditions that allowed a failure", "explanation": "After restoring service, problem analysis examines how a failure became possible and why existing protections did not contain it. Reconstruct the sequence from evidence and consider contributing conditions across design, tools, communication, and workload. If a hypothetical Harbour Bank release showed incorrect balances, 'someone made a mistake' would explain little about prevention. Ask which checks were missing, which signals were overlooked, and what made the error easy to introduce. Agree practical actions with owners and review dates, then verify whether those actions reduce the chance or impact of recurrence.", "ask": "What change to the working system would make the same human mistake less damaging next time?", "sources": ["https://sre.google/sre-book/postmortem-culture/"]}, {"id": "maintain-dependency-health", "stage": "maintenance", "title": "Keep dependencies healthy over time", "explanation": "Dependency maintenance is continuing work, because reused software changes after your release. Keep an inventory, follow relevant vulnerability information, assess which components are affected, and plan updates with suitable verification. For Harbour Bank, a currency or interface library update could fix a defect while also changing behavior the team relies on. Review the change and rerun the checks that cover that behavior. Prioritize according to exposure and impact rather than treating every update as identical. Record exceptions and their owners so delayed work does not quietly become permanent neglect.", "ask": "What would make one dependency update urgent while another could wait for the next planned release?", "sources": ["https://cheatsheetseries.owasp.org/cheatsheets/Vulnerable_Dependency_Management_Cheat_Sheet.html"]}, {"id": "retire-a-service-responsibly", "stage": "maintenance", "title": "Plan the end of a service", "explanation": "Retirement is part of a service's life, not simply switching off a server. Identify remaining users, connected services, records that must be retained, and information that should be removed under the agreed policy. Explain alternatives and timing, and provide support for the transition. Retiring a fictional Harbour Bank prototype is much simpler than retiring a real account service, but old links and misleading availability messages still matter. Confirm that responsibilities have been transferred or completed so the organization does not leave people dependent on an abandoned capability.", "ask": "Who or what might still depend on a service after the team believes its work is finished?", "sources": ["https://www.gov.uk/service-manual/agile-delivery/retiring-your-service"]}], "quizzes": [{"id": "software-service", "stage": "foundations", "question": "A balance screen works, but staff cannot explain an error to customers. What is missing from the service view?", "options": ["A brighter background", "More screen animations", "A different programming language", "Support knowledge and processes"], "correct": [3], "type": "single", "answer": "D. Support knowledge and processes", "rationale": "A usable service includes people and operational guidance as well as software. Changing appearance does not address the support gap."}, {"id": "problem-first", "stage": "foundations", "question": "People ask for a bigger transfer button. What is the most useful first response?", "options": ["Ask which task is difficult and observe an example", "Build it immediately", "Reject the request because it concerns appearance", "Replace the whole application"], "correct": [0], "type": "single", "answer": "A. Ask which task is difficult and observe an example", "rationale": "The requested screen change is a possible solution. Understanding the underlying difficulty helps determine whether size, wording, position or something else should change."}, {"id": "delivery-evidence", "stage": "foundations", "question": "Which two items provide stronger evidence of useful delivery than a count of completed tasks? Select two.", "options": ["A verified result against acceptance criteria", "A list of hours spent in meetings", "A large number of document pages", "A user completes the agreed journey"], "correct": [0, 3], "type": "multiple", "answer": "A. A verified result against acceptance criteria; D. A user completes the agreed journey", "rationale": "Task counts describe activity. A completed user journey and observed acceptance result connect the work to its intended outcome, while still leaving other conditions to investigate."}, {"id": "feedback-loop", "stage": "foundations", "question": "A test reveals that the withdrawal rule is ambiguous. What should happen?", "options": ["Hide the failed test", "Clarify the rule with its owner and update affected work", "Wait until the next annual review", "Let the tester invent a permanent business rule"], "correct": [1], "type": "single", "answer": "B. Clarify the rule with its owner and update affected work", "rationale": "Feedback may return to requirements at any point. Clarification should reach the design, implementation and tests that depend on the rule."}, {"id": "workflow-order", "stage": "foundations", "question": "Which statement best describes the six stages in this guide?", "options": ["They must never overlap", "Every organisation must use these exact names", "Only developers contribute to them", "They organise related work that may repeat and overlap"], "correct": [3], "type": "single", "answer": "D. They organise related work that may repeat and overlap", "rationale": "The stages help readers organise decisions and evidence. Iterative teams revisit them, and organisations may use different names or groupings."}, {"id": "proportionate-process", "stage": "foundations", "question": "A small internal tool needs a low-risk wording change. Which approach is proportionate?", "options": ["Require all possible documents to be recreated", "Assume a long approval chain guarantees quality", "Use a brief recorded review and relevant checks", "Skip every check"], "correct": [2], "type": "single", "answer": "C. Use a brief recorded review and relevant checks", "rationale": "Match evidence to the change and its consequences. Proportionate work preserves useful review and traceability without adding paperwork unrelated to the risk."}, {"id": "ai-accountability", "stage": "foundations", "question": "An AI assistant produces a convincing requirement. Who must decide whether it is correct?", "options": ["The first person who copies it", "Nobody if the text is fluent", "Only the AI vendor", "The accountable people using evidence and stakeholder needs"], "correct": [3], "type": "single", "answer": "D. The accountable people using evidence and stakeholder needs", "rationale": "Generated wording can contain incorrect assumptions. People must verify the intended behaviour, sources and examples before adopting it."}, {"id": "observable-quality", "stage": "requirements", "question": "Which requirement is most directly testable?", "options": ["Ensure customers always love it", "Show the selected source account, destination and amount before confirmation", "Make transfers excellent", "Use an innovative design"], "correct": [1], "type": "single", "answer": "B. Show the selected source account, destination and amount before confirmation", "rationale": "The review fields can be inspected in a defined state. Vague praise does not establish an observable result."}, {"id": "stakeholder-reach", "stage": "requirements", "question": "Who may need to review a transfer error message besides the person using the screen?", "options": ["Nobody else", "Only people who wrote the first prototype", "Only the logo designer", "Support staff who help resolve the error"], "correct": [3], "type": "single", "answer": "D. Support staff who help resolve the error", "rationale": "Support staff see failure and recovery needs that may not appear in the normal user journey. Relevant security and accessibility specialists may also contribute."}, {"id": "needs-and-constraints", "stage": "requirements", "question": "Which two are constraints or quality expectations rather than separate user functions? Select two.", "options": ["Display the current balance", "Use SGD only in this example", "Transfer funds", "Allow the journey to be completed with a keyboard"], "correct": [1, 3], "type": "multiple", "answer": "B. Use SGD only in this example; D. Allow the journey to be completed with a keyboard", "rationale": "Currency scope constrains behaviour, and keyboard access describes an accessibility expectation. Transfer and balance viewing are user functions."}, {"id": "scope-question", "stage": "requirements", "question": "A reader asks to transfer money to an overseas friend in the Harbour Bank demo. How should the request be treated?", "options": ["Assume it is already supported", "Quietly change the examples", "Pretend the friend owns the savings account", "Record it as a proposed scope change; this demo permits owned-account transfers only"], "correct": [3], "type": "single", "answer": "D. Record it as a proposed scope change; this demo permits owned-account transfers only", "rationale": "A new payee and cross-border transfer introduce different requirements and risks. They cannot be treated as an existing two-account feature."}, {"id": "acceptance-rule", "stage": "requirements", "question": "Which acceptance statement best covers a cancelled transfer review?", "options": ["Cancellation always creates a deposit", "The page looks modern", "The customer may cancel somehow", "Cancelling leaves both balances and the completed transaction list unchanged"], "correct": [3], "type": "single", "answer": "D. Cancelling leaves both balances and the completed transaction list unchanged", "rationale": "The statement identifies observable effects and protected state. It gives design and testing a shared expected result."}, {"id": "document-purpose", "stage": "requirements", "question": "A sponsor wants to understand why a proposed service is needed. Which document is the best starting point?", "options": ["A raw error log", "The installation commands", "The BRD or equivalent business-purpose record", "A low-level function specification"], "correct": [2], "type": "single", "answer": "C. The BRD or equivalent business-purpose record", "rationale": "The business-purpose record connects a problem, stakeholders, expected benefit and scope. Technical details can support later decisions without replacing that purpose."}, {"id": "assumption-review", "stage": "requirements", "question": "The team assumes every customer can receive an SMS. What is the responsible next step?", "options": ["Record an owner and a way to verify it with affected users", "Treat the assumption as a fact", "Ask an AI to guarantee it", "Remove alternative access without review"], "correct": [0], "type": "single", "answer": "A. Record an owner and a way to verify it with affected users", "rationale": "An assumption should have a verification plan and a consequence if false. Accessibility and access needs deserve evidence from affected people."}, {"id": "atomic-transfer", "stage": "design", "question": "A real transfer debits one account but crashes before crediting the other. Which design concern is exposed?", "options": ["Font consistency", "Image compression", "Atomicity of the money movement", "Search ranking"], "correct": [2], "type": "single", "answer": "C. Atomicity of the money movement", "rationale": "Debit and credit must be coordinated so the agreed operation completes together or has no partial effect. A screen alone cannot provide this guarantee."}, {"id": "authorization", "stage": "design", "question": "A person is successfully logged in. What must a real service still check before showing an account?", "options": ["Nothing; login permits every account", "Whether the browser is maximised", "Only the colour of the login page", "Whether the person is permitted to access that account"], "correct": [3], "type": "single", "answer": "D. Whether the person is permitted to access that account", "rationale": "Authentication and authorization answer different questions. Establishing identity does not grant access to all resources."}, {"id": "repeated-request", "stage": "design", "question": "A transfer succeeds but the response is lost. Why does a real service need a repeat-request strategy?", "options": ["To recognise the same request and avoid applying its effect twice", "To ignore every later request", "To deliberately repeat the debit", "To remove all logs"], "correct": [0], "type": "single", "answer": "A. To recognise the same request and avoid applying its effect twice", "rationale": "A stable request identity and durable result handling can support safe retries. This must be designed and verified on the service; disabling a browser button is not equivalent."}, {"id": "architecture-level", "stage": "design", "question": "Which description belongs most naturally in a high-level design?", "options": ["A single test execution timestamp", "Application, transaction service and storage responsibilities", "The exact wording of one validation error", "The complete list of user passwords"], "correct": [1], "type": "single", "answer": "B. Application, transaction service and storage responsibilities", "rationale": "High-level design communicates the main parts and relationships. Detailed behaviour and evidence belong in more focused records, and real secrets should not be documented openly."}, {"id": "decision-record", "stage": "design", "question": "What should an architecture decision record preserve?", "options": ["A guarantee that the decision never changes", "Context, options, choice, reasons and consequences", "Only the winning technology name", "Every private chat message"], "correct": [1], "type": "single", "answer": "B. Context, options, choice, reasons and consequences", "rationale": "A decision record helps later readers understand why a choice fit the circumstances. New evidence can justify a new decision."}, {"id": "concurrent-reservation", "stage": "design", "question": "Two shoppers attempt to buy the last item at the same time. Which design must be considered?", "options": ["A larger product photo only", "Two independent successful reservations for one item", "A coordinated stock reservation rule", "Waiting to discover overselling after dispatch"], "correct": [2], "type": "single", "answer": "C. A coordinated stock reservation rule", "rationale": "Availability must be checked and updated under a consistency rule that protects the scarce item. The exact implementation depends on the system design."}, {"id": "accessible-errors", "stage": "design", "question": "Which two help a person correct an invalid amount? Select two.", "options": ["A clear explanation of the accepted range and format", "An error linked to the amount field", "Erasing every other completed field", "Only a red border"], "correct": [0, 1], "type": "multiple", "answer": "A. A clear explanation of the accepted range and format; B. An error linked to the amount field", "rationale": "Accessible errors identify the affected control and explain recovery. Colour alone does not communicate enough information to every user."}, {"id": "integer-money", "stage": "development", "question": "Why does the Harbour Bank demo store SGD 10.25 as 1,025 cents?", "options": ["To use whole-unit arithmetic for this fixed two-decimal currency", "To encrypt the amount", "Because all currencies always have two decimal places", "To make the amount bigger"], "correct": [0], "type": "single", "answer": "A. To use whole-unit arithmetic for this fixed two-decimal currency", "rationale": "Whole cents avoid some decimal representation problems in this narrow case. They are not encryption and do not define monetary handling for every currency."}, {"id": "peer-review", "stage": "development", "question": "A developer asks a colleague to review an amount-validation change. What is most useful?", "options": ["Assume review replaces execution tests", "Comment only on line count", "Check its behaviour, assumptions and relevant tests", "Approve because the author is experienced"], "correct": [2], "type": "single", "answer": "C. Check its behaviour, assumptions and relevant tests", "rationale": "Review can identify unclear logic and missing cases. It complements tests and should focus on risks and requirements."}, {"id": "unit-boundary", "stage": "development", "question": "Which check most directly exercises amount validation as a small isolated behaviour?", "options": ["Passing 1.234 and expecting rejection", "Checking a whole release announcement", "Measuring repository popularity", "Interviewing a sponsor"], "correct": [0], "type": "single", "answer": "A. Passing 1.234 and expecting rejection", "rationale": "The check isolates one rule and its expected result. Wider integration and user journeys need additional evidence."}, {"id": "integration-behaviour", "stage": "development", "question": "The review screen and transaction logic pass separate checks. What additional check is needed when they are connected?", "options": ["Assume separate success proves combined success", "Delete the interface contract", "Test only the page title", "Confirm that the reviewed details are the details actually submitted"], "correct": [3], "type": "single", "answer": "D. Confirm that the reviewed details are the details actually submitted", "rationale": "Working components can disagree at their boundary. Integration checks examine how data, failures and state cross that boundary."}, {"id": "test-first-cycle", "stage": "development", "question": "A team uses test-driven development for a small amount rule. Which sequence fits the approach?", "options": ["Write a failing check, implement enough to pass, improve structure while checks stay green", "Refactor unrelated features before identifying behaviour", "Write all production code and omit tests", "Collect screenshots without expected results"], "correct": [0], "type": "single", "answer": "A. Write a failing check, implement enough to pass, improve structure while checks stay green", "rationale": "Test-driven development uses short feedback cycles around a specific behaviour. It does not remove the need for broader testing or design judgment."}, {"id": "reproducible-build", "stage": "development", "question": "What helps another person reproduce a release?", "options": ["Recorded source version, dependency versions and build instructions", "An unrecorded manual edit", "A screenshot of the developer desktop", "A folder named final-final"], "correct": [0], "type": "single", "answer": "A. Recorded source version, dependency versions and build instructions", "rationale": "Reproduction needs the inputs and procedure, not a reassuring filename. Environment differences should also be recorded when they affect output."}, {"id": "secret-handling", "stage": "development", "question": "An API key appears in a proposed code change. What should the team do?", "options": ["Publish it because the repository is convenient", "Hide it in a comment", "Rename it to password2", "Remove it from the change and use an approved secret-management process; rotate it if exposed"], "correct": [3], "type": "single", "answer": "D. Remove it from the change and use an approved secret-management process; rotate it if exposed", "rationale": "Secrets require controlled storage and access. Renaming or commenting out an exposed secret does not revoke its value."}, {"id": "boundary-amount", "stage": "testing", "question": "With a fresh current balance of SGD 2,500.00, which pair checks the insufficient-funds boundary for withdrawal?", "options": ["2,500.00 and 2,500.01", "Only a blank amount", "Only 100.00", "1.00 and 2.00"], "correct": [0], "type": "single", "answer": "A. 2,500.00 and 2,500.01", "rationale": "The pair examines the last permitted value at that balance and the first value beyond it. Reset between independent tests to preserve the stated starting condition."}, {"id": "expected-vs-actual", "stage": "testing", "question": "A test has been written but never run. What status is honest?", "options": ["Accepted by the business", "Not run", "Passed", "Failed automatically"], "correct": [1], "type": "single", "answer": "B. Not run", "rationale": "A planned expected result is not an observation. Record execution evidence before assigning a result."}, {"id": "traceability-limit", "stage": "testing", "question": "FR-06 has links to four test cases. What can that fact alone establish?", "options": ["That all transfers are correct", "That no requirement is missing", "That four relationships have been recorded", "That the tests passed"], "correct": [2], "type": "single", "answer": "C. That four relationships have been recorded", "rationale": "Traceability shows links and can expose coverage gaps. Results, relevance and remaining risk require separate examination."}, {"id": "defect-report-quality", "stage": "testing", "question": "Which report is most useful for reproducing a problem?", "options": ["Starting from reset balances, cancel a 100.00 transfer review; observed history gained an entry; expected no new entry", "It is broken again", "Customers might complain someday", "The developer is careless"], "correct": [0], "type": "single", "answer": "A. Starting from reset balances, cancel a 100.00 transfer review; observed history gained an entry; expected no new entry", "rationale": "A useful report includes preconditions, actions, actual result and expected result. Evidence supports investigation without assigning personal blame."}, {"id": "confirmation-regression", "stage": "testing", "question": "A fix corrects a duplicate receipt. Which two checks serve different useful purposes? Select two.", "options": ["Repeat the failing example to confirm the fix", "Record a pass without running it", "Check related journeys for unintended effects", "Assume the patch cannot affect anything else"], "correct": [0, 2], "type": "multiple", "answer": "A. Repeat the failing example to confirm the fix; C. Check related journeys for unintended effects", "rationale": "Confirmation testing revisits the defect; regression testing looks for adverse effects elsewhere. Both are selected according to the change and risk."}, {"id": "test-state", "stage": "testing", "question": "Why should two independent banking tests start from reset state?", "options": ["Because every real bank resets balances", "So their preconditions match the expected results", "To avoid writing expected values", "To hide defects"], "correct": [1], "type": "single", "answer": "B. So their preconditions match the expected results", "rationale": "One test can change the conditions for another. Resetting the local demonstration makes independent cases reproducible; it is not a real banking practice."}, {"id": "all-tests-pass", "stage": "testing", "question": "Every selected test passed. What is the appropriate conclusion?", "options": ["All future versions are accepted", "Those checks passed under their recorded conditions; remaining risk still needs review", "The service needs no monitoring", "No defect can exist"], "correct": [1], "type": "single", "answer": "B. Those checks passed under their recorded conditions; remaining risk still needs review", "rationale": "Tests provide bounded evidence. Untested inputs, environments, interactions and future changes can still reveal problems."}, {"id": "ai-test-review", "stage": "testing", "question": "An AI proposes a test expecting a transfer to increase the combined account balance. What should the reviewer do?", "options": ["Accept the fluent explanation", "Delete every transfer test", "Change the requirement silently", "Reject or correct the expected result using the conservation rule"], "correct": [3], "type": "single", "answer": "D. Reject or correct the expected result using the conservation rule", "rationale": "For an internal transfer with no fees or interest, the combined balance stays constant. Expected results must come from agreed rules, not confidence in generated text."}, {"id": "release-readiness", "stage": "deployment", "question": "Which two should be known before a risky release? Select two.", "options": ["The exact version and relevant verification results", "How to recognise failure and who can stop or recover", "Only how many developers worked on it", "Only the launch slogan"], "correct": [0, 1], "type": "multiple", "answer": "A. The exact version and relevant verification results; B. How to recognise failure and who can stop or recover", "rationale": "Readiness connects an identifiable change with evidence and a workable response to failure. Team size and slogans do not establish safe release."}, {"id": "canary-decision", "stage": "deployment", "question": "A team exposes a new receipt service to a small group and expands only when defined signals are acceptable. What is the purpose?", "options": ["Avoid deciding what success means", "Guarantee no failures", "Use limited exposure to evaluate release risk", "Make all data public"], "correct": [2], "type": "single", "answer": "C. Use limited exposure to evaluate release risk", "rationale": "A canary limits initial exposure and supports a decision based on evidence. The signals and stop conditions must be defined and suitable for the consequences."}, {"id": "database-rollback", "stage": "deployment", "question": "Why can switching back to old application code be unsafe after a database change?", "options": ["Old code always runs faster", "The old code may no longer understand the changed data", "Database changes never persist", "A traffic switch reverses every transaction"], "correct": [1], "type": "single", "answer": "B. The old code may no longer understand the changed data", "rationale": "Application and data compatibility must be planned together. Recovery may require a forward correction or other carefully verified strategy."}, {"id": "recovery-goals", "stage": "deployment", "question": "Which pair correctly distinguishes recovery objectives?", "options": ["RTO means revenue; RPO means headcount", "Both mean zero failure guaranteed", "Both describe screen colour", "RTO concerns interruption time; RPO concerns tolerable data loss expressed in time"], "correct": [3], "type": "single", "answer": "D. RTO concerns interruption time; RPO concerns tolerable data loss expressed in time", "rationale": "These objectives express business tolerances that recovery designs and exercises must support. Setting a target does not demonstrate it can be achieved."}, {"id": "shadow-side-effects", "stage": "deployment", "question": "What must a shadow transfer service avoid?", "options": ["Recording safe diagnostic evidence", "Applying copied requests as additional real money movements", "Comparing response behaviour", "Isolating test outputs"], "correct": [1], "type": "single", "answer": "B. Applying copied requests as additional real money movements", "rationale": "Copied traffic must not create duplicate real effects. Side effects such as transactions and notifications require explicit isolation."}, {"id": "monitoring-meaning", "stage": "deployment", "question": "The homepage responds, but confirmed transfers fail. What does this show?", "options": ["Business outcomes cannot be monitored", "The service is fully healthy", "Only the logo needs changing", "A page availability check is insufficient to represent the complete user journey"], "correct": [3], "type": "single", "answer": "D. A page availability check is insufficient to represent the complete user journey", "rationale": "Monitoring should include signals tied to important user outcomes. A reachable page does not prove successful money movement."}, {"id": "adaptive-change", "stage": "maintenance", "question": "A supported database version reaches end of support, requiring a compatibility update. Which maintenance purpose is most prominent?", "options": ["Only cosmetic", "Recreating the original business case", "Adaptive", "None because users requested nothing"], "correct": [2], "type": "single", "answer": "C. Adaptive", "rationale": "Adaptive work responds to a changed environment. The update may also include corrective or preventive elements."}, {"id": "change-impact", "stage": "maintenance", "question": "The permitted amount changes. What is the best response?", "options": ["Trace the rule into validation, documents, tests and user guidance", "Update only the field label", "Mark existing tests passed without review", "Ignore the server implementation"], "correct": [0], "type": "single", "answer": "A. Trace the rule into validation, documents, tests and user guidance", "rationale": "A single rule may have several representations. Impact analysis helps keep them consistent and identifies new verification needs."}, {"id": "incident-learning", "stage": "maintenance", "question": "After recovery, what makes an incident review useful?", "options": ["A timeline, contributing conditions and owned follow-up actions", "Choosing somebody to blame without evidence", "Deleting the records", "Declaring all problems unavoidable"], "correct": [0], "type": "single", "answer": "A. A timeline, contributing conditions and owned follow-up actions", "rationale": "The purpose is t
