const FEATURES=[['Login','FR-01','Use the training credentials to begin a session. Try an incorrect password to inspect the error.','TC-01–03','frd'],['Logout','FR-02','End the session, then attempt to return to an account task. The task requires login again.','TC-04–05','threat-model'],['Check balance','FR-03','Read the current and savings amounts. This action does not move funds.','TC-06','data-model'],['Withdraw','FR-04','Review a simulated cash withdrawal. Confirm an amount within the balance; cancel another.','TC-07–09','lld'],['Deposit','FR-05','Review and confirm a simulated cash deposit. Inspect the resulting receipt.','TC-10–11','frd'],['Funds transfer','FR-06','Move 200.00 current → savings and verify that the combined balance stays the same.','TC-12–15','rtm']];
function casePage(){return `${crumb('Banking case study')}<div class="eyebrow">Fictional case · Harbour Bank</div><h1>One customer. Two accounts.<br>Six connected tasks.</h1><p class="lede">The same case runs through every worked document. The rules are deliberately small enough to understand without a banking or technology background.</p><div class="callout"><p>Current account starts at <strong>SGD 2,500.00</strong>; savings starts at <strong>SGD 1,000.00</strong>. All transaction examples assume these starting balances unless they explicitly state a sequence. Reset before an independent exercise.</p></div>${section('journeys','The six feature journeys',FEATURES.map(([a,id,b,tests,doc])=>`<details><summary>${a} <span class="badge">${id}</span></summary><div><p>${b}</p><p>Expected evidence: ${tests}. Read ${docLink(doc)} and ${docLink('test-cases')}.</p><a class="btn" href="#/demo">Try it in the demo</a></div></details>`).join(''))}${section('boundaries','Rules and boundaries',table(['Topic','This teaching case'],[['Customer / accounts','One fictional person; current and savings accounts are both owned by that person.'],['Currency / amount','SGD; 0.01–10,000.00 inclusive per transaction; at most two decimal places.'],['Available funds','No overdraft, fees, pending holds or interest.'],['Deposit / withdrawal','A simplified record of a completed cash event; no physical ATM, bank connection or real money.'],['Transfers','Only between the two owned accounts. Both balances update together.'],['Session','Public training credentials; three failed attempts lock for 30 seconds; five-minute banking inactivity timeout.'],['Storage','State exists in the current tab. Reload or Reset demo restores the initial state.'],['Security','Behaviour is simulated locally; real server security remains a design topic.']]))}${section('trace','Follow a transfer end to end',diag('documents')+`<ol><li>${docLink('brd')}: why the customer needs the task.</li><li>${docLink('srs')} and ${docLink('frd')}: FR-06 and its success/error rules.</li><li>${docLink('hld')}, ${docLink('lld')} and ${docLink('adr')}: structure, processing and monetary representation.</li><li>${docLink('rtm')} and ${docLink('test-cases')}: TC-12–15 and the evidence to record.</li><li>${docLink('deployment-plan')} and ${docLink('operations')}: release and support.</li><li>${docLink('change-request')}: what changes when the rules evolve.</li></ol>`)}${section('system','From screen to proposed real service',diag('context')+`<p>The local demo combines these responsibilities in one tab to support learning. A real service separates trust boundaries and needs specialist implementation and verification.</p>`)}${section('process','A transfer’s decision path',diag('transfer'))}`;}
function conceptPage(id){const c=COURSE.concepts.find(c=>c.id===id);if(!c)return missing();return `${crumb('Concepts')}<div class="eyebrow">${c.stage} · Course slide ${c.slide}</div><h1>${esc(c.title)}</h1><p class="lede">${esc(c.explanation)}</p><h2>Think it through</h2><div class="callout"><p>${esc(c.ask)}</p></div><h2>Connect it to the banking case</h2><p>Consider where this idea affects login, balances or money movement. Identify the requirement, decision or evidence involved. Then compare the relevant worked document with what the demo actually does.</p><div class="actions"><a class="btn" href="#/case">Explore the case</a><a class="btn secondary" href="#/documents">Find a document</a></div>${c.sources.length?`<h2>Reference links</h2><ul>${c.sources.map(u=>`<li><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a></li>`).join('')}</ul><p class="hint">Reference sites require internet; the explanation above is included offline.</p>`:''}<p><a href="#/concepts">← All concepts</a></p>`;}
const GLOSSARY=[['Acceptance criteria','Conditions that make a particular feature acceptable. Example: a rejected transfer changes neither balance.'],['Artifact','A useful work product, such as a document, diagram, build or test result.'],['Authentication','Establishing who is attempting access. The local login only simulates this.'],['Authorisation','Deciding what an identified person is allowed to do. Real account checks belong at a trusted server.'],['API','An agreed way for components to request information or actions from one another.'],['Atomic transaction','A set of related changes that completes together or not at all. A transfer must not leave only its debit completed.'],['Baseline','An agreed version used as a reference for controlled changes.'],['Black-box testing','Choosing tests from specified behaviour, without relying on internal implementation.'],['BRD','Business Requirements Document: the business need, outcomes and scope.'],['Build','An identifiable packaged version of software.'],['Concurrency','More than one activity progressing during an overlapping period; it can create competition for the same data.'],['Defect / bug','A flaw that may cause behaviour to differ from what is required.'],['Failure','An observed instance of incorrect behaviour.'],['Definition of Done','Agreed quality criteria for a usable increment.'],['Deployment','Introducing a version into its target environment and checking it there.'],['Disaster recovery','Restoring service after a serious disruption.'],['FRD','Functional Requirements Document: detailed functions and user interactions.'],['Functional requirement','What the system must do, such as reject a transfer with insufficient funds.'],['Non-functional requirement','A required quality or constraint, such as accessibility or performance under stated conditions.'],['HLD','High-Level Design: major parts and their relationships.'],['LLD','Low-Level Design: enough component detail to guide construction.'],['Idempotency','Handling a repeat of the same intended request without repeating its business effect.'],['Integration test','A test of interactions between components.'],['Ledger','A record of financial entries. The demo uses only a simplified view of two customer balances.'],['Migration','A controlled move or change of data, structure or service.'],['Mock / stub','A controlled substitute used to isolate behaviour during a test.'],['Prototype','An early representation used to explore or validate an idea.'],['Regression test','A repeated check for unwanted effects after a change.'],['Requirement','An agreed need, expected behaviour or condition to satisfy.'],['Risk','An uncertain event or condition and its possible impact.'],['Rollback','A recovery action intended to return to an earlier acceptable state; data compatibility still matters.'],['RTM','Requirements Traceability Matrix: links among requirements, tests and evidence.'],['RTO / RPO','Target restoration time / target maximum loss of recent data expressed as time. Values need business agreement.'],['Scope','The boundary of what is included and excluded.'],['Session','A period or state of authenticated interaction.'],['Smoke test','A selected basic check that a build or deployment is usable enough for further work.'],['SRS','Software Requirements Specification: behaviour, quality requirements, constraints and boundaries.'],['Stakeholder','A person or group that influences or is affected by the work.'],['Test case','Preconditions, actions and expected results for a repeatable check.'],['TDD','Test-driven development: small failing test, implementation to pass it, then refactoring.'],['Refactoring','Improving internal structure while preserving intended observable behaviour.'],['UAT','User Acceptance Testing: checks fitness for agreed user needs and acceptance conditions.'],['Unit test','A check of an individual separately testable unit.'],['Validation','Checking suitability for intended needs; the meaning should be clear in context.'],['Verification','Checking a work product against specified requirements or rules.'],['Version control','Recording and managing revisions to files and their history.'],['White-box testing','Choosing tests using internal structure such as branches or paths.']];

function practice(){const selected=new URLSearchParams(route().split('?')[1]||'').get('stage')||'all';const qs=COURSE.quizzes.filter(q=>selected==='all'||q.stage===selected);return `${crumb('Practice & self-checks')}<div class="eyebrow">Explain it · try it · check the evidence</div><h1>Learn by working through it.</h1><p class="lede">Use the exercises to connect documents and behaviour. Self-check answers are for learning; they are not a formal course assessment or pass certificate.</p><h2>Four guided exercises</h2>${[
['1 · Explain a requirement','Read FR-06. Describe its normal result and two ways it can be rejected. Identify which document explains the business need.','A valid owned-account transfer updates both balances and creates a receipt. Same-account and insufficient-funds requests are rejected without changing balances. The BRD explains the business purpose.'],
['2 · Follow the numbers','Reset and log in. Deposit 75.25 to savings, withdraw 100.00 from current, then transfer 200.00 current → savings. Predict the final balances before confirming.','Current: 2,500.00 − 100.00 − 200.00 = 2,200.00. Savings: 1,000.00 + 75.25 + 200.00 = 1,275.25. Combined: 3,475.25. The transfer preserves the total; the deposit and withdrawal change it.'],
['3 · Record a test','Run TC-14 from a reset state. Record the requirement, preconditions, exact input, expected result and actual result. If they differ, draft a defect report.','An attempted 2,500.01 transfer from current is rejected. Both balances remain 2,500.00 / 1,000.00. The actual result must come from the observed run, not from this answer.'],
['4 · Assess a change','Read CR-001. List at least five things affected by raising the transfer limit. Explain why changing the help text alone is insufficient.','Affected items include BR-02, SRS, detailed validation, UI guidance, boundary tests, user guide and release notes. The rule, implementation and evidence must remain consistent. The proposed change is not implemented in this version.']
].map(([h,p,a])=>`<details><summary>${h}</summary><div><p>${p}</p><details><summary>Suggested answer</summary><div>${a}</div></details></div></details>`).join('')}<div class="actions"><a class="btn" href="#/demo">Open the demo</a><a class="btn secondary" href="#/doc/test-cases">Read all 18 test cases</a></div><h2>Course self-checks</h2><label for="quiz-filter">Choose a topic</label><select id="quiz-filter">${['all','foundations',...STAGES.map(s=>s.id)].map(k=>`<option value="${k}" ${k===selected?'selected':''}>${k[0].toUpperCase()+k.slice(1)}</option>`).join('')}</select><p class="hint">${qs.length} questions shown. Select an answer, then check the explanation.</p>${qs.map(q=>`<form class="quiz" data-quiz="${q.slide}"><h3>${esc(q.question)}</h3><p class="hint">${q.stage} · course slide ${q.slide}${q.correct.length>1?' · select all correct options':''}</p>${q.slide===37?`<ol type="A">${q.options.map(o=>`<li>${esc(o)}</li>`).join('')}</ol><label for="order-37">Enter the six option letters in order</label><input id="order-37" name="order" placeholder="A B C D E F" autocomplete="off">`:q.options.map((o,i)=>`<label class="quiz-choice"><input type="${q.correct.length>1?'checkbox':'radio'}" name="answer" value="${i}"><span>${String.fromCharCode(65+i)}. ${esc(o)}</span></label>`).join('')}<button type="submit">Check answer</button><div class="quiz-feedback" aria-live="polite"></div></form>`).join('')}`;}
function sources(){return `${crumb('Sources & scope')}<div class="eyebrow">Original teaching examples · traceable references</div><h1>What this guide is based on.</h1><p class="lede">This is a participant companion to the corrected “SDLC and Methodologies” course. Its worked banking documents and simulator are original fictional examples, written to explain the concepts in practical terms.</p><h2>Scope and use</h2><p>The six-stage structure is a teaching framework, not a requirement to perform every project sequentially. Roles, document names and approval arrangements vary. Samples demonstrate useful information; they are not actual bank records, regulatory approvals or production-ready specifications.</p><p>Concept notes use course slide numbers to help participants refer back. The guide does not embed the PowerPoint, third-party slide artwork or institutional branding. No formal accreditation or certification is claimed.</p><h2>Reference library</h2><p>These optional references open online. The explanations and worked examples are included in the guide itself. Reference links were checked during preparation in September 2026; external pages may change.</p><ul class="source-list">${Object.values(SOURCES).map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.title}</a><br>${s.note}</li>`).join('')}</ul><h2>Contribute and help others find it</h2><p>Stars help people bookmark and discover the repository, but are not a quality certification. Suggestions with a clear example are especially useful.</p><div class="actions"><a class="btn" href="${REPO}" target="_blank" rel="noopener noreferrer">☆ Star on GitHub</a><a class="btn secondary" href="${REPO}/issues/new" target="_blank" rel="noopener noreferrer">Suggest an improvement</a><button data-share>Share the guide</button></div><p class="hint" id="share-status" role="status"></p>`;}
function searchPage(){const q=new URLSearchParams(route().split('?')[1]||'').get('q')||'';const key=q.trim().toLowerCase();const records=[...STAGES.map(s=>({title:s.title+' stage',url:'/stage/'+s.id,body:s.intro+' '+s.example+' '+s.steps.join(' ')})),...DOCS.map(d=>({title:d.title,url:'/doc/'+d.id,body:[d.what,d.why,d.who,d.how,...d.sections.flatMap(s=>[s.text,JSON.stringify(s.rows||[])])].join(' ')})),...COURSE.concepts.map(c=>({title:c.title,url:'/concept/'+c.id,body:c.explanation+' '+c.ask})),...GLOSSARY.map(([a,b])=>({title:a,url:'/concepts',body:b}))];const matches=key?records.filter(r=>(r.title+' '+r.body).toLowerCase().includes(key)):[];return `${crumb('Search')}<h1>Search the guide</h1><p>${key?`${matches.length} results for <strong>${esc(q)}</strong>`:'Enter a concept, document name, requirement ID or task in the search box.'}</p>${matches.length?matches.map(r=>`<a class="search-result" href="#${r.url}"><h3>${esc(r.title)}</h3><p>${esc(r.body.slice(0,220))}${r.body.length>220?'…':''}</p></a>`).join(''):key?'<p class="empty">No matches. Try “transfer”, “FR-06”, “test”, “design” or “BRD”.</p>':''}`;}
const missing=()=>`${crumb('Page not found')}<h1>This page is not in the guide.</h1><p>Use the navigation or search to find a topic.</p><a href="#/">Return to the overview</a>`;
function render(){const p=route().split('?')[0];let html;if(p==='/')html=home();else if(p==='/start')html=start();else if(p.startsWith('/stage/'))html=stagePage(p.slice(7));else if(p==='/documents')html=documents();else if(p.startsWith('/doc/'))html=documentPage(p.slice(5));else if(p==='/case')html=casePage();else if(p==='/demo')html=renderBank();else if(p==='/concepts')html=concepts();else if(p.startsWith('/concept/'))html=conceptPage(p.slice(9));else if(p==='/practice')html=practice();else if(p==='/sources')html=sources();else if(p==='/search')html=searchPage();else html=missing();document.querySelector('#main').innerHTML=html;nav();document.title=(document.querySelector('h1')?.innerText.replace(/\s+/g,' ').trim()||'Guide')+' · SDLC Field Guide';bind();}
function bind(){document.querySelectorAll('[data-scroll]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.scroll)?.scrollIntoView({behavior:'smooth'});});document.querySelector('#doc-filter')?.addEventListener('change',e=>{document.querySelector('#doc-catalog').innerHTML=catalogDocs(DOCS.filter(d=>e.target.value==='all'||d.stage===e.target.value));});document.querySelector('#quiz-filter')?.addEventListener('change',e=>navigate('/practice?stage='+e.target.value));document.querySelectorAll('[data-quiz]').forEach(form=>form.onsubmit=e=>{e.preventDefault();const q=COURSE.quizzes.find(q=>q.slide===Number(form.dataset.quiz));let correct=false;if(q.slide===37){const v=form.order.value.toUpperCase().replace(/[^A-F]/g,'');if(!v){form.querySelector('.quiz-feedback').innerHTML='<p class="error">Enter an order before checking.</p>';return;}correct=v==='DAECBF';}else{const chosen=[...form.querySelectorAll('input:checked')].map(i=>Number(i.value)).sort();if(!chosen.length){form.querySelector('.quiz-feedback').innerHTML='<p class="error">Choose an answer before checking.</p>';return;}correct=JSON.stringify(chosen)===JSON.stringify([...q.correct].sort());}form.querySelector('.quiz-feedback').innerHTML=`<p class="${correct?'success':'error'}"><strong>${correct?'Correct.':'Not quite.'}</strong> Answer: ${esc(q.answer)}</p><p>${esc(q.rationale)}</p>`;});document.querySelectorAll('[data-share]').forEach(b=>b.onclick=shareGuide);if(route().split('?')[0]==='/demo')bindBank();}
async function shareGuide(){const url=PUBLIC_URL;const s=document.querySelector('#share-status');try{if(navigator.share){await navigator.share({title:'SDLC Field Guide · Tech Knowen',text:'A plain-language software lifecycle guide with worked banking documents and an interactive demo.',url});if(s)s.textContent='Share options opened.';}else{await navigator.clipboard.writeText(url);if(s)s.textContent='Guide link copied.';}}catch(e){if(e.name!=='AbortError'&&s){s.textContent='Share this link: '+url;}}}
document.querySelector('#search-form').addEventListener('submit',e=>{e.preventDefault();navigate('/search?q='+encodeURIComponent(document.querySelector('#search').value));});document.querySelector('#menu').onclick=()=>{const on=document.body.classList.toggle('nav-open');document.querySelector('#menu').setAttribute('aria-expanded',String(on));};document.querySelector('#theme').onclick=()=>{const dark=document.body.classList.toggle('dark');try{localStorage.setItem('tk-guide-theme',dark?'dark':'light');}catch{}document.querySelector('#theme').setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');};try{if(localStorage.getItem('tk-guide-theme')==='dark')document.body.classList.add('dark');}catch{}
window.addEventListener('hashchange',()=>{document.body.classList.remove('nav-open');document.querySelector('#menu').setAttribute('aria-expanded','false');render();window.scrollTo(0,0);document.querySelector('#main').focus({preventScroll:true});});
render();

if(document.modelContext?.registerTool){const life=new AbortController();const register=tool=>{try{Promise.resolve(document.modelContext.registerTool(tool,{signal:life.signal})).catch(()=>{});}catch{}};register({name:'read_training_bank_state',description:'Read the fictional local banking simulation state. No real banking connection.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({loggedIn:bank.loggedIn&&Date.now()-bank.lastActive<300000,balancesInCents:{...bank.accounts},completedTransactions:bank.history.length,reviewPending:!!bank.pending})});register({name:'prepare_training_transaction_review',description:'Validate a fictional transaction and open its review screen. Does not confirm or move funds.',inputSchema:{type:'object',properties:{type:{type:'string',enum:['deposit','withdraw','transfer']},source:{type:'string',enum:['current','savings']},destination:{type:'string',enum:['current','savings']},amount:{type:'string'}},required:['type','source','amount'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(!input||typeof input!=='object')throw Error('Provide transaction details.');const r=prepareOperation(input.type,input.source,input.destination,input.amount);bank.tab=input.type;location.hash='/demo';render();return {status:'review_only',...r};}});window.addEventListener('pagehide',()=>life.abort(),{once:true});}

document.querySelector('.skip').onclick=e=>{e.preventDefault();document.querySelector('#main').focus();document.querySelector('#main').scrollIntoView();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('nav-open');document.querySelector('#menu').setAttribute('aria-expanded','false');}});
