<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142642"><title>SDLC Field Guide · Tech Knowen</title><meta name="description" content="A participant guide to the software lifecycle, with worked banking documents, linked examples and an interactive fictional banking demo."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23142642'/%3E%3Cpath d='M7 8h8v18H7zm10 0h8v18h-8' fill='%23ffca63'/%3E%3C/svg%3E"><style>
:root{color-scheme:light;--ink:#152640;--muted:#5d6d82;--paper:#fff;--bg:#f4f7fb;--line:#dbe3ee;--accent:#195dd5;--soft:#edf4ff;--gold:#ffcd70}*{box-sizing:border-box}body{margin:0;font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}a{color:var(--accent);text-underline-offset:3px}button,input,select,textarea{font:inherit}button{cursor:pointer}button,a,input,select,summary{outline-offset:4px}button{border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);padding:8px 14px}button:hover{border-color:var(--accent)}input,select,textarea{border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);padding:10px 12px;max-width:100%}label{display:block;font-weight:600;margin:12px 0 5px}h1,h2,h3{line-height:1.22;letter-spacing:-.025em}h1{font-size:clamp(2rem,4vw,3.4rem);margin:12px 0 20px;max-width:850px}h2{font-size:1.65rem;margin-top:40px}h3{font-size:1.18rem}p{max-width:76ch}#sidebar{background:#142642;color:#d8e4f7;position:fixed;inset:0 auto 0 0;width:270px;overflow-y:auto;padding:32px 24px;z-index:20}.brand{display:flex;gap:13px;color:var(--gold);font-size:28px;font-weight:800;text-decoration:none;align-items:center;margin-bottom:38px}.brand span{font-size:13px;letter-spacing:.14em;color:white}.brand small{font-size:11px;display:block;color:#9db1cd;letter-spacing:.15em;margin-top:3px}nav .nav-title{font-size:12px;font-weight:700;letter-spacing:.15em;color:#93a8c5;margin:23px 10px 10px}nav a{display:flex;gap:12px;text-decoration:none;color:#c6d6ee;padding:9px 12px;border-radius:6px;font-size:15px;margin:3px 0}nav a:hover{background:#203957;color:white}nav a.active{background:#2b466a;color:#fff;border-left:3px solid var(--gold)}.nav-no{font-size:12px;color:#93a8c5;align-self:center}.sidebar-footer{margin:36px 10px 0;font-size:12px;color:#9db1cd;border-top:1px solid #314562;padding-top:20px}.shell{margin-left:270px}header{height:78px;display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--line);padding:0 42px;background:var(--paper);position:sticky;top:0;z-index:10}.top-label{font-size:12px;font-weight:700;letter-spacing:.15em;color:var(--muted)}#search-form{display:flex;margin-left:auto;width:min(390px,55%)}#search-form input{width:100%;border-right:0;border-radius:6px 0 0 6px;background:var(--bg);font-size:14px}#search-form button{border-radius:0 6px 6px 0}#theme{font-size:22px;padding:3px 12px}#menu{display:none}main{max-width:1380px;margin:auto;padding:40px 48px 64px;min-height:78vh}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:750;text-transform:uppercase;color:var(--accent)}.lede{font-size:19px;color:var(--muted);line-height:1.7;max-width:770px}.badge{display:inline-block;background:var(--soft);color:var(--accent);font-size:12px;font-weight:650;padding:4px 9px;border-radius:4px}.hero-line{height:5px;width:70px;background:var(--gold);margin:26px 0}.stage-list{border-top:1px solid var(--line);margin-top:28px}.stage-row{display:grid;grid-template-columns:52px 1fr auto;gap:24px;padding:22px 0;border-bottom:1px solid var(--line);align-items:center;text-decoration:none;color:var(--ink)}.stage-row:hover h3{color:var(--accent)}.stage-row .big-no{font:500 27px/1.2 Georgia,serif;color:var(--muted)}.stage-row h3{margin:0 0 5px}.stage-row p{margin:0;color:var(--muted);font-size:15px}.stage-row .arrow{font-size:22px;color:var(--accent)}.home-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:40px}.case-panel{background:var(--ink);color:white;padding:28px;border-radius:8px;align-self:start;margin-top:30px}.case-panel p{color:#cedcee;font-size:15px}.case-panel .eyebrow{color:var(--gold)}.case-panel a{color:white}.btn{display:inline-block;text-decoration:none;border-radius:5px;background:var(--accent);color:white;padding:10px 17px;font-weight:650;border:1px solid transparent}.btn.secondary{background:var(--paper);color:var(--ink);border-color:var(--line)}.case-panel .btn{background:var(--gold);color:#142642}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}footer{padding:24px 48px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;gap:20px;flex-wrap:wrap}footer span{margin-left:auto}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.skip{position:fixed;top:-100px;left:10px;z-index:100;background:white;padding:12px}.skip:focus{top:8px}.callout{border-left:4px solid var(--accent);padding:15px 20px;background:var(--soft);margin:24px 0}.callout p{margin:0}.breadcrumb{font-size:14px;color:var(--muted);margin-bottom:24px}.article-grid{display:grid;grid-template-columns:minmax(0,1fr) 225px;gap:42px}.toc{font-size:14px;position:sticky;top:105px;align-self:start;border-left:1px solid var(--line);padding-left:20px}.toc a{display:block;margin:9px 0;color:var(--muted);text-decoration:none}.toc a:hover{color:var(--accent)}.table-wrap{overflow:auto;margin:20px 0;border:1px solid var(--line);border-radius:7px}table{border-collapse:collapse;width:100%;font-size:14px;background:var(--paper)}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#17263d;color:#e0eaff;padding:23px;border-radius:7px;font:14px/1.7 ui-monospace,monospace}.doc-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:7px;overflow:hidden;margin:28px 0}.doc-meta div{background:var(--paper);padding:14px 18px}.doc-meta dt{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em;font-weight:700}.doc-meta dd{margin:5px 0 0;font-size:15px}.catalog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.catalog a{border:1px solid var(--line);padding:21px;background:var(--paper);border-radius:6px;text-decoration:none;color:var(--ink)}.catalog a:hover{border-color:var(--accent)}.catalog h3{margin:6px 0}.catalog p{font-size:14px;color:var(--muted);margin:8px 0 0}.tag{font-size:12px;font-weight:600;color:var(--accent)}details{border:1px solid var(--line);border-radius:6px;margin:14px 0;background:var(--paper)}summary{cursor:pointer;padding:14px 18px;font-weight:650}details>div{padding:0 18px 18px}.diagram{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:22px;background:var(--paper);border:1px solid var(--line);border-radius:7px}.diagram .node{padding:14px;border:1px solid #9ab2d7;border-radius:5px;flex:1;min-width:135px;text-align:center}.diagram small{display:block;color:var(--muted)}.lesson-nav{display:flex;justify-content:space-between;margin-top:38px;border-top:1px solid var(--line);padding-top:22px}.bank{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}.bank-top{padding:18px 24px;background:#122e35;color:white;display:flex;gap:20px;justify-content:space-between;align-items:center}.bank-brand{font-family:Georgia,serif;font-size:25px}.bank-tabs{display:flex;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}.bank-tabs button[aria-current=true]{background:var(--ink);color:white}.bank-body{padding:26px}.bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.balance{font-size:2.6rem;letter-spacing:-.04em;font-weight:700;margin:7px 0}.bank label{font-size:14px}.bank input,.bank select{width:100%}.bank form{max-width:480px}.hint{font-size:14px;color:var(--muted)}.demo-note{padding:10px 16px;background:#fff2cc;color:#694d0a;font-size:13px}.error{color:#ac2433;background:#ffedf0;padding:12px 15px;border-radius:5px}.success{color:#155c43;background:#e5f5ee;padding:12px 15px;border-radius:5px}.receipt{background:var(--soft);padding:23px;border-radius:7px}.radio{display:flex;gap:8px;align-items:center}.quiz-choice{display:flex;align-items:start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:5px;margin:8px 0;font-weight:400}.quiz-choice input{margin-top:6px}.content-section{scroll-margin-top:95px}.source-list li{margin-bottom:14px}.empty{padding:25px;border:1px dashed var(--line);color:var(--muted)}body.dark{color-scheme:dark;--ink:#e4edfb;--muted:#a4b4ce;--paper:#19253a;--bg:#101b2d;--line:#33435b;--accent:#83b4ff;--soft:#233651}.dark .case-panel{background:#284367}.dark .btn{color:#142642}.dark .btn.secondary{color:var(--ink)}.dark .bank-tabs button[aria-current=true]{color:#142642}.dark .bank-top{background:#153e49}.dark .success{background:#183e34;color:#b3ead8}.dark .error{background:#512633;color:#ffbecb}@media(max-width:1100px){#sidebar{width:235px}.shell{margin-left:235px}main{padding:30px}.home-grid{grid-template-columns:1fr}.case-panel{margin-top:0}.article-grid{grid-template-columns:1fr}.toc{display:none}header{padding:0 30px}.top-label{display:none}}@media(max-width:760px){#sidebar{visibility:hidden;transform:translateX(-100%);transition:transform .18s;width:270px}.nav-open #sidebar{visibility:visible;transform:translateX(0)}.shell{margin-left:0}header{height:65px;padding:0 16px;gap:12px}#menu{display:block}#search-form{width:auto;flex:1}main{padding:27px 20px 45px}.doc-meta,.catalog,.bank-grid{grid-template-columns:1fr}.stage-row{gap:12px;grid-template-columns:32px 1fr auto}.stage-row .big-no{font-size:22px}.bank-body{padding:18px}footer{padding:22px 20px}footer span{margin-left:0}.balance{font-size:2.2rem}}@media print{#sidebar,header,footer,.actions,.toc,.lesson-nav,.no-print{display:none!important}.shell{margin:0}main{padding:0;max-width:none}body{background:white;color:#111}.article-grid{display:block}details>div{display:block}a{color:#111}pre{background:#f5f5f5;color:#111}table,.doc-meta{break-inside:auto}h2,h3{break-after:avoid}}
.quiz{padding:26px 0;border-bottom:1px solid var(--line);max-width:880px}.quiz h3{line-height:1.45}.quiz-feedback{margin-top:14px}.search-result{display:block;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line);padding:18px 0}.search-result p{color:var(--muted);font-size:15px}.search-result:hover h3{color:var(--accent)}.github-header{white-space:nowrap;font-size:13px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:7px 12px}@media(max-width:1100px){.github-header{display:none}}.doc-meta div:last-child:nth-child(odd){grid-column:1/-1}.table-wrap td a{overflow-wrap:anywhere}main{overflow-wrap:anywhere}.quiz-choice:hover{background:var(--soft)}details[open]>summary{border-bottom:1px solid var(--line);margin-bottom:12px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e5aa38}body.dark .case-panel .btn{color:#142642}

</style><meta property="og:title" content="SDLC Field Guide · Tech Knowen"><meta property="og:description" content="Plain-language software lifecycle lessons, 34 worked documents and a fictional banking demo."><meta property="og:type" content="website"><meta property="og:url" content="https://chandra-79.github.io/tech-knowen-sdlc-field-guide/"><meta name="twitter:card" content="summary"><link rel="canonical" href="https://chandra-79.github.io/tech-knowen-sdlc-field-guide/"></head><body><a class="skip" href="#main">Skip to content</a><aside id="sidebar"><a class="brand" href="#/">TK<span>TECH KNOWEN<small>SDLC FIELD GUIDE</small></span></a><nav id="navigation" aria-label="Guide"></nav><div class="sidebar-footer">A companion for practice.<br>Understand. Apply. Refer back.</div></aside><div class="shell"><header><button id="menu" aria-label="Toggle navigation" aria-expanded="false">☰</button><span class="top-label">PARTICIPANT WIKI</span><form id="search-form" role="search"><label class="sr-only" for="search">Search the guide</label><input id="search" type="search" placeholder="Search concepts, documents, examples…"><button aria-label="Search">⌕</button></form><a class="github-header" href="https://github.com/chandra-79/tech-knowen-sdlc-field-guide" target="_blank" rel="noopener noreferrer">☆ Star on GitHub</a><button id="theme" aria-label="Switch colour mode">◐</button></header><main id="main" tabindex="-1"></main><footer>Tech Knowen · SDLC Field Guide <a href="#/sources">Sources & scope</a><span>Fictional banking case · No real accounts or transactions</span></footer></div><script>
const COURSE={"concepts": [{"id": "concept-9", "slide": 9, "stage": "foundations", "title": "Software in everyday life", "points": [], "explanation": "The introduction establishes what software is and why a structured approach helps. An everyday banking or shopping application is more than its visible screens: it also depends on data, rules and supporting services.", "ask": "What happens behind the screen when an order is submitted?", "sources": []}, {"id": "concept-10", "slide": 10, "stage": "foundations", "title": "Objectives", "points": [], "explanation": "The lesson connects software's components, uses and development principles. An online shop needs instructions, organised product data and guidance for users and support staff. These elements must work together to provide a useful service.", "ask": "Which part is easiest to overlook when describing software?", "sources": []}, {"id": "concept-11", "slide": 11, "stage": "foundations", "title": "The Software Crisis", "points": [], "explanation": "The swing cartoon shows how the same request can be interpreted differently across roles. Each handover can introduce assumptions, leaving the delivered result unlike the original need. A shared example or early prototype can expose the misunderstanding. Artwork credit: projectcartoon.com, CC BY 3.0.", "ask": "Which handover would benefit most from an early clarification?", "sources": []}, {"id": "concept-12", "slide": 12, "stage": "foundations", "title": "Understand the problem.", "points": [], "explanation": "Pólya's problem-solving sequence separates understanding, planning, execution and checking. If checkout totals are wrong, reproducing the calculation and clarifying the expected result should precede a proposed fix. Checking afterwards establishes whether the solution addressed the problem.", "ask": "What could be missed by jumping straight to a solution?", "sources": []}, {"id": "concept-13", "slide": 13, "stage": "foundations", "title": "Software: definition", "points": [], "explanation": "Software includes executable instructions, organised data and information explaining its operation. A booking application needs rules for reservations, records of available places and guidance for handling cancellations. A working screen alone does not describe the whole product.", "ask": "What supporting information would a new operator need?", "sources": []}, {"id": "concept-14", "slide": 14, "stage": "foundations", "title": "Software transforms…", "points": [], "explanation": "Software transforms information into actions and useful outcomes across personal and business settings. A calendar application turns appointment details into reminders, while a business system turns orders into fulfilment tasks.", "ask": "What information enters a familiar application, and what useful result comes out?", "sources": []}, {"id": "concept-15", "slide": 15, "stage": "foundations", "title": "Software Diagrammatic Representation", "points": [], "explanation": "The diagram links inputs, processing components, outputs and feedback. In an ordering service, selected products are inputs, pricing rules calculate a total, and a confirmation is an output. A rejected payment provides feedback that changes the next action.", "ask": "How should the system respond to unsuccessful payment feedback?", "sources": []}, {"id": "concept-16", "slide": 16, "stage": "foundations", "title": "Software - a holistic view", "points": [], "explanation": "A system is a set of connected components working towards a purpose. An online shop may connect a catalogue, basket, payment service and stock records. A failure in one connection can affect the overall customer experience even when individual components work.", "ask": "Which dependency could prevent an order from completing?", "sources": []}, {"id": "concept-17", "slide": 17, "stage": "foundations", "title": "Importance of Software", "points": [], "explanation": "Software supports activities ranging from communication to transport and healthcare. For example, a delivery application combines addresses, routing and notifications to coordinate a physical service. Its value depends on the surrounding people, processes and equipment as well as code.", "ask": "What everyday activity becomes difficult when its supporting software fails?", "sources": []}, {"id": "concept-18", "slide": 18, "stage": "foundations", "title": "Physical and Software Products", "points": [], "explanation": "Physical products can wear through use; software instructions do not experience physical wear. Software still requires change as needs, dependencies and operating environments evolve. Both physical and software products may be standard offerings or customised solutions.", "ask": "Why might unchanged software stop meeting its users' needs?", "sources": []}, {"id": "concept-19", "slide": 19, "stage": "foundations", "title": "Benefits of Software", "points": [], "explanation": "Tactical benefits improve immediate tasks, while strategic benefits develop longer-term capability. Automatically sending an order confirmation saves daily effort; analysing demand patterns may support decisions about future services. The same system can provide both kinds of benefit.", "ask": "Which benefit would be visible immediately, and which needs longer observation?", "sources": []}, {"id": "concept-20", "slide": 20, "stage": "foundations", "title": "Software plays a dual role:", "points": [], "explanation": "Software can be a product people use and a means of creating or delivering other products. A browser provides a direct service, while a compiler helps produce another program. These roles overlap rather than forming completely separate categories.", "ask": "Can a familiar application play both roles?", "sources": []}, {"id": "concept-21", "slide": 21, "stage": "foundations", "title": "Software Domains (a few….)", "points": [], "explanation": "Software domains differ in their users, constraints and purposes. A banking system emphasises transaction rules, while an embedded vehicle controller must interact with physical equipment. Domain knowledge helps determine which requirements and risks deserve attention.", "ask": "Which risks would differ between a photo editor and a banking application?", "sources": []}, {"id": "concept-22", "slide": 22, "stage": "foundations", "title": "Programmers @ Work", "points": [], "explanation": "Programming connects business understanding with implementation and improvement. A request to reduce order errors might lead to quantity validation, followed by changes when users encounter an overlooked case. Coding therefore involves feedback rather than a single one-way handover.", "ask": "What question should be clarified before implementing quantity validation?", "sources": []}, {"id": "concept-23", "slide": 23, "stage": "foundations", "title": "Challenges of Software Development", "points": [], "explanation": "Missed deadlines and budgets often accompany uncertainty, weak communication or poorly managed change. A delivered feature can also fail if users cannot understand it or support teams cannot maintain it. Success needs more than finishing the code.", "ask": "Which warning sign would indicate that a project is drifting?", "sources": []}, {"id": "concept-24", "slide": 24, "stage": "foundations", "title": "Seven Principles of Software Development", "points": [], "explanation": "The principles attributed to David Hooker encourage useful, understandable and adaptable software. For example, a clear validation rule is easier to review and maintain than unnecessary complexity. Reuse should serve the problem rather than introduce unsuitable dependencies.", "ask": "Which principle would help a new team member understand an existing feature?", "sources": []}, {"id": "concept-25", "slide": 25, "stage": "foundations", "title": "“As Is” vs “To Be”", "points": [], "explanation": "The “As Is” view describes current work and its problems; the “To Be” view describes the intended future. A manual stock spreadsheet may cause duplicate reservations, while the proposed system records reservations consistently and shows availability.", "ask": "Which current problem should the future process demonstrably resolve?", "sources": []}, {"id": "concept-26", "slide": 26, "stage": "foundations", "title": "Software Development Process", "points": [], "explanation": "The six activities provide a teaching framework, with feedback allowing earlier decisions to be revisited. Testing an order may reveal an unclear quantity rule, sending the team back to requirements before changing the implementation.", "ask": "When would repeating an earlier activity prevent unnecessary rework?", "sources": []}, {"id": "concept-27", "slide": 27, "stage": "foundations", "title": "Software Development Process", "points": [], "explanation": "The SDLC organises development and maintenance without prescribing one universal sequence. An ordering application may evolve through small releases, each involving requirements, design, development and testing. The approach should suit the project's uncertainty, risks and constraints.", "ask": "What might cause the team to revisit a design after implementation begins?", "sources": []}, {"id": "concept-28", "slide": 28, "stage": "foundations", "title": "Software Development Life Cycle", "points": [], "explanation": "A software lifecycle connects a business need with delivery and continued use. Its duration depends on the work and the service's lifetime, not a fixed number of months. Related lifecycle terms can have different scopes, especially when hardware and operational processes are included.", "ask": "What might extend a product's lifecycle beyond its first release?", "sources": ["https://aws.amazon.com/what-is/sdlc/"]}, {"id": "concept-29", "slide": 29, "stage": "foundations", "title": "Why SDLC ?", "points": [], "explanation": "A lifecycle framework makes work, responsibilities and evidence easier to manage. For example, connecting an order requirement to a design decision and test result helps stakeholders see what has been addressed. The framework can support sequential or iterative delivery.", "ask": "Which piece of evidence would make project progress more trustworthy?", "sources": []}, {"id": "concept-30", "slide": 30, "stage": "foundations", "title": "Software Development Life Cycle (Process)", "points": [], "explanation": "These activity groupings describe related kinds of work, not rigid job boundaries. Communication clarifies an order rule, modelling explores the solution, and construction implements and tests it. Deployment and maintenance then introduce real-use feedback.", "ask": "Where would a customer-reported problem influence the next round of work?", "sources": []}, {"id": "concept-31", "slide": 31, "stage": "foundations", "title": "SDLC Stages", "points": [], "explanation": "The stage diagram provides a route through the course. For one order feature, requirements describe the need, design proposes a solution, and later activities establish whether it works in use. Arrows should not imply that feedback only travels forwards.", "ask": "Which stage might need revisiting after a failed test?", "sources": []}, {"id": "concept-32", "slide": 32, "stage": "foundations", "title": "SDLC: definition", "points": [], "explanation": "The SDLC is a framework for coordinating software work over time. Activities can overlap and repeat: a team may clarify the next requirement while testing an earlier feature. The framework supports informed decisions rather than guaranteeing a successful result.", "ask": "How could feedback improve a later iteration?", "sources": []}, {"id": "concept-33", "slide": 33, "stage": "foundations", "title": "SDLC: Benefits and Risks", "points": [], "explanation": "Structure can improve visibility and consistency, but rigid application can add cost or resist useful change. A short decision record may help a small team more than an elaborate approval process. The appropriate amount of process depends on risk and context.", "ask": "When does documentation help delivery, and when can it become unnecessary overhead?", "sources": ["https://aws.amazon.com/what-is/sdlc/"]}, {"id": "concept-34", "slide": 34, "stage": "foundations", "title": "Software Myths", "points": [], "explanation": "The statements are myths to challenge, not recommended practices. Adding people to a delayed project may initially increase coordination and onboarding work. Similarly, working code still needs validation, documentation and support appropriate to its use.", "ask": "Which myth could lead to the most avoidable rework?", "sources": []}, {"id": "concept-41", "slide": 41, "stage": "requirements", "title": "Objectives", "points": [], "explanation": "The lesson covers stakeholder needs, requirement types and ways to record and validate them. For example, placing an order is a function, while an agreed response-time target describes a quality expectation under stated conditions.", "ask": "Which stakeholders should help define those expectations?", "sources": []}, {"id": "concept-43", "slide": 43, "stage": "requirements", "title": "What are requirements?", "points": [], "explanation": "Requirements express needs and expected behaviour, not simply a preferred screen or technology. A customer may ask for an export button, while the underlying need is to reconcile orders with another system.", "ask": "What questions would reveal the purpose behind that request?", "sources": []}, {"id": "concept-44", "slide": 44, "stage": "requirements", "title": "Requirements Phase", "points": [], "explanation": "Requirements work investigates the problem, assumptions and constraints with affected stakeholders. For example, a request to reserve stock needs clarification about reservation expiry and payment failure before a solution is chosen.", "ask": "Which assumption about stock availability could create an incorrect order?", "sources": []}, {"id": "concept-45", "slide": 45, "stage": "requirements", "title": "Requirements Phase", "points": [], "explanation": "Missing stakeholders or premature conclusions can send a project towards the wrong solution. A checkout designed without support staff input might omit information needed to resolve failed payments. Responsibility for requirements is shared across relevant roles.", "ask": "Whose perspective could reveal an overlooked exception?", "sources": []}, {"id": "concept-46", "slide": 46, "stage": "requirements", "title": "Requirements - How?", "points": [], "explanation": "Elicitation discovers needs, analysis examines them, specification records them, and validation checks their suitability. A vague delivery request becomes useful only after its meaning and constraints are agreed. Requirements management keeps later changes controlled and traceable.", "ask": "Which activity would expose conflicting delivery expectations?", "sources": []}, {"id": "concept-47", "slide": 47, "stage": "requirements", "title": "Requirements", "points": [], "explanation": "Communication and planning support requirements work by building shared understanding and organising follow-up. If stock teams and sales teams interpret “available” differently, a conversation and recorded decision can prevent inconsistent implementation.", "ask": "What should be recorded after the meaning is agreed?", "sources": ["https://www.nasa.gov/reference/6-2-requirements-management/"]}, {"id": "concept-48", "slide": 48, "stage": "requirements", "title": "Principles of Effective", "points": [], "explanation": "Effective communication combines listening, preparation, collaboration and clear records. Planning adds boundaries, estimates and risk awareness. A short workshop can resolve an order rule, while an unresolved disagreement should be recorded with an owner and next step.", "ask": "How could a simple sketch uncover a misunderstanding?", "sources": []}, {"id": "concept-49", "slide": 49, "stage": "requirements", "title": "Requirements Engineering – Steps (1 of 2)", "points": [], "explanation": "The early activities establish scope, gather information, refine meaning and resolve competing priorities. For example, sales may want instant stock reservation while operations requires an expiry rule. Negotiation seeks an agreed outcome that accounts for both needs.", "ask": "Which question would help resolve that conflict?", "sources": []}, {"id": "concept-50", "slide": 50, "stage": "requirements", "title": "Requirements Engineering – Steps (2 of 2)", "points": [], "explanation": "Specification records the requirement; validation checks whether it is clear, feasible and consistent; management handles subsequent change. A quantity rule changing from five items to ten should trigger review of its related designs and tests.", "ask": "What should be checked before approving that change?", "sources": []}, {"id": "concept-51", "slide": 51, "stage": "requirements", "title": "Stakeholders", "points": [], "explanation": "Stakeholders include people who influence the work or are affected by its outcome. In an ordering service, customers, support staff and warehouse operators may all have relevant needs, even when they do not sponsor the project.", "ask": "Who might be affected without using the application directly?", "sources": ["https://www.nasa.gov/reference/4-1-stakeholder-expectations-definition/"]}, {"id": "concept-52", "slide": 52, "stage": "requirements", "title": "Requirement: Analysis", "points": [], "explanation": "Analysis examines conflicts, boundaries and interactions with the surrounding environment. If an application promises immediate confirmation but a payment provider responds later, the requirement must account for that delay and possible failure.", "ask": "Where should the system boundary be drawn in this example?", "sources": []}, {"id": "concept-53", "slide": 53, "stage": "requirements", "title": "Requirement: Classification", "points": [], "explanation": "Different classifications expose different concerns. “Submit an order” describes functionality; a measurable response-time target describes a quality requirement. A required review procedure concerns the development process. Several classifications may apply to the same set of requirements.", "ask": "Which requirement is likely to change, and why?", "sources": []}, {"id": "concept-54", "slide": 54, "stage": "requirements", "title": "Requirement: Outcomes", "points": [], "explanation": "BRD, SRS and FRD are common names for different views of requirements. The useful distinction is their purpose and content, because organisations may combine them or use different labels. An order objective should remain traceable to more detailed behaviour.", "ask": "What information would be lost if only a document title were reviewed?", "sources": ["https://www.nasa.gov/reference/6-2-requirements-management/"]}, {"id": "concept-55", "slide": 55, "stage": "requirements", "title": "Requirements Gathering – Business Requirements Document (BRD)", "points": [], "explanation": "A BRD explains the business need, intended outcomes, scope and constraints. For example, reducing order-entry mistakes is a business objective; choosing a specific interface control is a later solution decision. Business stakeholders help establish what success means.", "ask": "What evidence would show that the business objective was achieved?", "sources": []}, {"id": "concept-56", "slide": 56, "stage": "requirements", "title": "Requirements Gathering - Software Requirements Specification (SRS)", "points": [], "explanation": "An SRS records what the software must do and the conditions or limits it must satisfy. For an ordering service, that includes permitted quantities and behaviour when payment fails. Clear boundaries support review, estimation and verification.", "ask": "Which excluded behaviour should be stated explicitly to avoid an assumption?", "sources": []}, {"id": "concept-57", "slide": 57, "stage": "requirements", "title": "Requirements Gathering – Functional Requirements Document (FRD)", "points": [], "explanation": "An FRD describes detailed functions and interactions from the user's perspective. For example, it can describe selecting a product, entering a quantity and receiving validation feedback. Document naming and ownership vary, so the required information matters more than the label.", "ask": "What should happen when the entered quantity is invalid?", "sources": []}, {"id": "concept-58", "slide": 58, "stage": "requirements", "title": "Requirements Gathering – Other Documents", "points": [], "explanation": "Additional documents separate information when that helps the project. A user-interface document might describe interaction rules, while a quality document records measurable service expectations. Creating every possible document is unnecessary when the information can be managed clearly elsewhere.", "ask": "Which document would add useful clarity to a small ordering project?", "sources": []}, {"id": "concept-68", "slide": 68, "stage": "design", "title": "Objectives", "points": [], "explanation": "Design considers structure, detailed behaviour, quality concerns and ways to communicate decisions. A stock-reservation feature needs both a component view and rules for competing requests. Different diagrams reveal different aspects of the same solution.", "ask": "Which view would best explain two customers requesting the last item?", "sources": []}, {"id": "concept-70", "slide": 70, "stage": "design", "title": "Stage 2: Design", "points": [], "explanation": "High-level design describes major components and relationships; low-level design provides detail needed for construction. For example, a component diagram shows an order service connected to stock storage, while detailed design explains the reservation operation.", "ask": "What information belongs in the detailed view rather than the overview?", "sources": []}, {"id": "concept-71", "slide": 71, "stage": "design", "title": "Stage 2: Design", "points": [], "explanation": "Design records how requirements will be met, including assumptions and reasons for decisions. If stock is reserved before payment, the design should explain how an abandoned payment releases the reservation. Business and technical roles contribute different constraints.", "ask": "What could go wrong if the release rule were left undocumented?", "sources": []}, {"id": "concept-72", "slide": 72, "stage": "design", "title": "Software Design", "points": [], "explanation": "Models make proposed behaviour easier to inspect before implementation. A sequence diagram can expose a missing response when payment fails, while a prototype can reveal confusing user interaction. Models must be evaluated against requirements and risks.", "ask": "Which requirement could be checked using a prototype rather than production code?", "sources": []}, {"id": "concept-73", "slide": 73, "stage": "design", "title": "Design Outcomes", "points": [], "explanation": "HLD provides the overall structure; LLD explains how individual parts should work. An ordering HLD may identify catalogue, payment and stock components. Its LLD may describe validation, reservation expiry and error handling within one component.", "ask": "Could another developer implement the component from the available detail?", "sources": []}, {"id": "concept-74", "slide": 74, "stage": "design", "title": "Design – Key Issues", "points": [], "explanation": "Design issues often interact. Two buyers requesting the last item create a concurrency problem, while a network failure raises questions about recovery and persistence. A useful design considers these conditions rather than only the successful path.", "ask": "How should the service respond when payment succeeds but confirmation is delayed?", "sources": []}, {"id": "concept-75", "slide": 75, "stage": "design", "title": "Design – Architectural Styles", "points": [], "explanation": "Architectural styles organise components and their interactions in different ways. A layered design separates responsibilities; a client–server structure separates consumers from service providers. A real system can combine styles, chosen according to its requirements and constraints.", "ask": "What requirement might make one organisation of components preferable to another?", "sources": []}, {"id": "concept-76", "slide": 76, "stage": "design", "title": "Design - Design Patterns", "points": [], "explanation": "Design patterns describe reusable approaches to recurring problems in a context. An adapter, for example, can translate between an application's expected interface and a payment provider's interface. A pattern is guidance with trade-offs, not a solution to apply automatically.", "ask": "What would justify introducing an adapter in this example?", "sources": []}, {"id": "concept-77", "slide": 77, "stage": "design", "title": "Design – UI Design Principles", "points": [], "explanation": "Usable interfaces are understandable, consistent and recoverable for different users. A quantity field can show clear limits and explain how to correct an invalid entry without discarding the rest of the order. Accessibility needs should inform these decisions.", "ask": "How could the same task be completed without relying only on a mouse?", "sources": []}, {"id": "concept-78", "slide": 78, "stage": "design", "title": "Design - Notations", "points": [], "explanation": "Notations emphasise different questions. A sequence diagram shows interactions over time, a data flow diagram shows movement of information, and a decision table makes rule combinations explicit. The notation should help its intended audience understand the issue.", "ask": "Which notation would best explain several discount eligibility rules?", "sources": []}, {"id": "concept-79", "slide": 79, "stage": "design", "title": "Design – Strategies and Methods", "points": [], "explanation": "Design methods organise thinking around functions, reusable components, objects or data structures. An order system might combine a component-based payment integration with objects representing orders. These approaches are not necessarily mutually exclusive.", "ask": "Which approach would make a frequently changing part easier to replace?", "sources": []}, {"id": "concept-86", "slide": 86, "stage": "development", "title": "Objectives", "points": [], "explanation": "The lesson connects implementation with tools, developer testing and performance analysis. A developer can check a calculation independently, then verify its interaction with order processing. Tests and measurements provide evidence for changes.", "ask": "Why should a performance improvement be measured rather than assumed?", "sources": []}, {"id": "concept-88", "slide": 88, "stage": "development", "title": "Stage 3: Development", "points": [], "explanation": "Construction combines coding with verification, unit testing and debugging. Simple structure and clear responsibilities make change easier to understand. For example, keeping quantity validation in a well-defined function makes its behaviour easier to review and test.", "ask": "What would make that function difficult to verify?", "sources": []}, {"id": "concept-89", "slide": 89, "stage": "development", "title": "Development", "points": [], "explanation": "Development involves different responsibilities across interfaces, services, integrations and delivery support. A checkout change may require frontend validation, backend enforcement and operational input. Job titles vary, so coordination should focus on responsibilities and handovers.", "ask": "Who should be involved when a change affects both the interface and stored data?", "sources": []}, {"id": "concept-90", "slide": 90, "stage": "development", "title": "Development: Tools", "points": [], "explanation": "Different tools support different tasks: an IDE helps construction, a profiler identifies where execution time is spent, and a debugger helps investigate behaviour. A DBMS manages persistent data; version control records changes to source files. No single tool replaces the others.", "ask": "Which tool would help investigate a slow order calculation?", "sources": ["https://www.postgresql.org/about/"]}, {"id": "concept-91", "slide": 91, "stage": "development", "title": "Development: Developer Testing", "points": [], "explanation": "Unit tests focus on individual units, while integration tests examine interactions. A pricing function may pass its own tests but still receive the wrong values from the checkout component. Both levels provide useful, different evidence.", "ask": "What interaction could fail even when the two components pass their unit tests?", "sources": ["https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf"]}, {"id": "concept-92", "slide": 92, "stage": "development", "title": "Development: Performance analysis and tuning", "points": [], "explanation": "Performance analysis uses measurements to locate problems before tuning. A slow order page might spend most of its time waiting for repeated data queries rather than calculating totals. Changing the measured bottleneck is more useful than optimising an unrelated line of code.", "ask": "What measurement would help identify the actual bottleneck?", "sources": []}, {"id": "concept-93", "slide": 93, "stage": "development", "title": "Development: Test-First Programming", "points": [], "explanation": "TDD repeats a small cycle: write a failing test, implement enough behaviour to pass, then improve the structure while keeping tests passing. For example, first specify that quantity zero is rejected. TDD supports feedback but does not replace other testing.", "ask": "Why should the new test fail before the implementation is added?", "sources": ["https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf"]}, {"id": "concept-100", "slide": 100, "stage": "testing", "title": "Objectives", "points": [], "explanation": "The lesson connects agreed quality criteria, test approaches, defect evidence and traceability. An order requirement should lead to suitable checks and recorded outcomes. A completed test alone is less useful when its purpose or expected result is unclear.", "ask": "What information makes a test result useful for a release decision?", "sources": []}, {"id": "concept-102", "slide": 102, "stage": "testing", "title": "Definition of Done", "points": [], "explanation": "The Definition of Done makes the required quality criteria explicit for an increment. An order feature might need review, agreed tests and relevant support information before it qualifies. A usable increment may still await a business release decision and future enhancements.", "ask": "Which unmet criterion would prevent the feature from being considered Done?", "sources": ["https://scrumguides.org/scrum-guide.html#definition-of-done"]}, {"id": "concept-103", "slide": 103, "stage": "testing", "title": "Stage 4: Testing", "points": [], "explanation": "Static testing examines work products without executing the software; dynamic testing runs it and compares results with expectations. Reviewing a quantity rule is static, while submitting invalid quantities is dynamic. Practical test selection depends on risk and purpose.", "ask": "Which defect might a requirements review find before execution is possible?", "sources": ["https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf"]}, {"id": "concept-104", "slide": 104, "stage": "testing", "title": "Testing", "points": [], "explanation": "Testing provides evidence about quality and can reveal defects, but cannot establish that every possible use is correct. A failed payment scenario may uncover an order-state problem before release. The resulting evidence supports decisions about correction and remaining risk.", "ask": "What should decision-makers know besides the number of passed tests?", "sources": ["https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf"]}, {"id": "concept-105", "slide": 105, "stage": "testing", "title": "Testing", "points": [], "explanation": "Testing work can start during requirements and continue as designs and code evolve. Writing an expected result for order cancellation may expose an unclear refund rule early. Test plans should change when the agreed behaviour changes.", "ask": "Which question should be resolved before testing that cancellation outcome?", "sources": []}, {"id": "concept-106", "slide": 106, "stage": "testing", "title": "Testing", "points": [], "explanation": "Black-box tests derive from specified behaviour; white-box tests use internal structure. Checking permitted quantities against the rule is black-box testing. Exercising both branches of its implementation is white-box testing. Neither approach alone proves the absence of defects.", "ask": "Could every branch execute while an important requirement remains untested?", "sources": ["https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf"]}, {"id": "concept-107", "slide": 107, "stage": "testing", "title": "Testing: Terminology", "points": [], "explanation": "A defect is a flaw; a failure is the incorrect behaviour observed when relevant conditions trigger it. A wrong boundary comparison may remain unnoticed until a customer orders the maximum permitted quantity. Not every defect produces a failure on every run.", "ask": "What input would expose a boundary-check defect?", "sources": []}, {"id": "concept-108", "slide": 108, "stage": "testing", "title": "Testing: Key Issues", "points": [], "explanation": "Test selection and stopping criteria should reflect risks, coverage goals and constraints. Exhaustive testing is usually impractical, and some paths cannot occur. For quantity validation, boundary and invalid inputs provide more useful evidence than repeatedly checking the same ordinary value.", "ask": "What evidence would justify stopping this round of testing?", "sources": []}, {"id": "concept-109", "slide": 109, "stage": "testing", "title": "Testing: Who does it?", "points": [], "explanation": "Developers, reviewers and independent testers contribute complementary perspectives. A developer may verify the intended order path, while another reviewer challenges assumptions about failure or misuse. Shared responsibility does not remove the need for clear ownership of corrective actions.", "ask": "How could a fresh perspective reveal an overlooked case?", "sources": ["https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf"]}, {"id": "concept-110", "slide": 110, "stage": "testing", "title": "Testing: Who does it?", "points": [], "explanation": "Test specialists assess behaviour systematically; users and customers help assess fitness for use. Acceptance testing checks agreed criteria, while beta use provides feedback in real-use settings. For example, customers may identify confusing order terminology even when technical checks pass.", "ask": "What useful feedback could come from actual users?", "sources": ["https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf"]}, {"id": "concept-111", "slide": 111, "stage": "testing", "title": "Testing: Types (1 of 2)", "points": [], "explanation": "Unit, integration and system testing examine different scopes. A price function can be tested alone, then with the basket, then through the complete order journey. Passing at one level does not eliminate the need for evidence at the others.", "ask": "At which level would a broken basket-to-payment handover be most directly investigated?", "sources": []}, {"id": "concept-112", "slide": 112, "stage": "testing", "title": "Testing: Types (2 of 2)", "points": [], "explanation": "These test types address different quality concerns. A service can be checked for restoration after failure, resistance to unauthorised access, behaviour beyond expected capacity and performance under stated conditions. For example, a sale event may expose resource limits.", "ask": "Which test would assess whether saved orders survive a service failure?", "sources": []}, {"id": "concept-113", "slide": 113, "stage": "testing", "title": "Testing: Tools", "points": [], "explanation": "A harness controls test execution and records results; generators create candidate cases; capture/replay tools repeat interactions. For an order form, recorded clicks can save repetition, but assertions are still needed to check the outcome. Generated cases also need meaningful expectations.", "ask": "What could go unnoticed if a replay only checks that clicks completed?", "sources": []}, {"id": "concept-114", "slide": 114, "stage": "testing", "title": "Testing: Tools", "points": [], "explanation": "Assertions check expected conditions, coverage reports what was exercised, and regression tests look for unintended effects of change. A new discount rule should not break an existing pricing scenario. High coverage alone does not establish that the assertions are useful.", "ask": "What defect could remain despite every line being executed?", "sources": []}, {"id": "concept-115", "slide": 115, "stage": "testing", "title": "Testing: Outcome", "points": [], "explanation": "Test results record what was run and observed; defect reports describe problems requiring investigation. An invalid-quantity test may produce a failed result and a linked defect with reproduction steps. These artifacts support decisions rather than proving the entire product correct.", "ask": "What should a test result contain to be independently understood?", "sources": []}, {"id": "concept-116", "slide": 116, "stage": "testing", "title": "Testing: Bug handling", "points": [], "explanation": "A useful defect report describes observable behaviour and supports it with evidence. For example, record the submitted quantity, expected validation message and actual saved order. Clear reporting helps the team investigate the problem without guessing.", "ask": "Which missing detail would most hinder reproduction?", "sources": []}, {"id": "concept-117", "slide": 117, "stage": "testing", "title": "Testing: Documenting a bug", "points": [], "explanation": "A bug report combines reproduction steps, expected and actual results, environment details and relevant evidence. A screenshot may show an incorrect total, while a timestamped log helps locate the related event. Evidence should avoid exposing credentials or unnecessary personal data.", "ask": "Which detail would connect the visible problem to its recorded event?", "sources": []}, {"id": "concept-118", "slide": 118, "stage": "testing", "title": "Testing: Use objective descriptions", "points": [], "explanation": "Objective descriptions make problems easier to investigate than labels such as “ugly” or “huge”. Instead of “the page is slow”, record the action, observed delay and conditions, then compare them with the agreed expectation.", "ask": "How could a vague complaint be rewritten as a testable observation?", "sources": []}, {"id": "concept-119", "slide": 119, "stage": "testing", "title": "Testing: Help the developer to replicate the bug", "points": [], "explanation": "Reproduction depends on the conditions as well as the steps. A failed order may require a particular browser version, stock state or account setting. Suitable test data and a shared walkthrough help identify differences between environments.", "ask": "What condition could explain why a defect appears for only one tester?", "sources": []}, {"id": "concept-120", "slide": 120, "stage": "testing", "title": "Testing: Understand the psychology", "points": [], "explanation": "Different interpretations should be examined through evidence rather than personal criticism. If a developer and tester disagree about order cancellation, compare the requirement, test conditions and observed result. The disagreement may expose an unclear expectation rather than a coding error.", "ask": "What evidence would help resolve the disagreement fairly?", "sources": []}, {"id": "concept-121", "slide": 121, "stage": "testing", "title": "Testing: Planning", "points": [], "explanation": "An RTM connects requirements with tests and results so missing links can be identified. For example, a quantity-limit requirement should have associated boundary checks and recorded outcomes. A link shows planned coverage; it does not establish that a test passed.", "ask": "What should be investigated when a requirement has no linked test?", "sources": ["https://www.nasa.gov/reference/6-2-requirements-management/"]}, {"id": "concept-122", "slide": 122, "stage": "testing", "title": "Testing: Types of RTM", "points": [], "explanation": "Forward traceability starts with requirements; backward traceability starts with tests; bidirectional traceability supports both views. If the quantity limit changes, the links help identify affected tests. A test without a requirement link still needs a clear, legitimate purpose.", "ask": "How could backward tracing reveal an undocumented requirement or assumption?", "sources": []}, {"id": "concept-123", "slide": 123, "stage": "testing", "title": "Advantages of RTM", "points": [], "explanation": "An RTM makes recorded requirements, coverage gaps and related evidence easier to review. An order-validation requirement may link to both successful and unsuccessful scenarios. The matrix remains useful only when changes and test results are kept current.", "ask": "What misleading conclusion could follow from an outdated matrix?", "sources": []}, {"id": "concept-124", "slide": 124, "stage": "testing", "title": "Ways to prepare an RTM", "points": [], "explanation": "Building an RTM starts with identifiable requirements and meaningful links to tests and results. Assigning a stable ID to the quantity rule makes it easier to track across documents and revisions. Duplicate or ambiguous requirements should be clarified rather than copied blindly.", "ask": "Why is a stable requirement ID more useful than a page number?", "sources": []}, {"id": "concept-125", "slide": 125, "stage": "testing", "title": "RTM Sample", "points": [], "explanation": "BR96 is divided into product selection and quantity validation. FR57 requires selection of a listed product; FR58 allows only whole numbers from one to five. Separating them makes coverage clearer: selecting a valid product does not demonstrate that quantity validation works.", "ask": "Which requirement is violated by selecting a valid product with quantity zero?", "sources": []}, {"id": "concept-126", "slide": 126, "stage": "testing", "title": "RTM Sample", "points": [], "explanation": "TC01 and TC02 check product selection; TC03 and TC04 check quantities. Run each listed quantity separately, including blank and nonnumeric input, and record its result. Keyboard selection of a listed product is valid; the rejected case is an unlisted value.", "ask": "Why does passing quantity one not establish that quantity five also passes?", "sources": []}, {"id": "concept-127", "slide": 127, "stage": "testing", "title": "RTM Sample", "points": [], "explanation": "The matrix links BR96 to FR57 and FR58. TC01 and TC02 cover product selection; TC03 and TC04 cover quantity rules. Both requirements have High priority. Execution results should accompany the links elsewhere in the test records.", "ask": "What additional evidence is needed before claiming these requirements have passed testing?", "sources": []}, {"id": "concept-128", "slide": 128, "stage": "testing", "title": "Testing: Common quality issues", "points": [], "explanation": "Quality problems appear in different forms. An incorrect total is functional, a missed response-time target is non-functional, and inconsistent order records indicate a data mismatch. These categories guide investigation but can overlap when one defect has several effects.", "ask": "How could a data mismatch become visible as a functional failure?", "sources": []}, {"id": "concept-135", "slide": 135, "stage": "deployment", "title": "Objectives", "points": [], "explanation": "The lesson connects deployment tasks, environments, rollout approaches and handover evidence. An ordering release needs a suitable rollout plan and instructions for verification and recovery. The choice depends on service needs and the nature of the change.", "ask": "What requirement would influence whether downtime is acceptable?", "sources": []}, {"id": "concept-137", "slide": 137, "stage": "deployment", "title": "Stage 5: Deployment", "points": [], "explanation": "Deployment includes installing, configuring and checking the deployed service. For an order release, selected smoke checks might confirm that the application starts and a safe test journey works. These checks complement earlier testing rather than repeat every test in production.", "ask": "Which check would quickly reveal a configuration problem?", "sources": []}, {"id": "concept-138", "slide": 138, "stage": "deployment", "title": "Deployment", "points": [], "explanation": "Deployment requires coordinated responsibilities across application, database, infrastructure, testing and operations roles. A schema change may need both developer knowledge and database administration input. Clear ownership matters more than assuming one job title controls the entire release.", "ask": "Who should confirm that the recovery plan is workable?", "sources": []}, {"id": "concept-139", "slide": 139, "stage": "deployment", "title": "Deployment", "points": [], "explanation": "Checklists, deployment guides and knowledge transfer make release steps and responsibilities repeatable. A guide for an order service should explain prerequisites, verification and recovery actions, not merely installation commands. Operations needs enough context to recognise abnormal behaviour.", "ask": "What information would an on-call colleague need immediately after a failed release?", "sources": []}, {"id": "concept-140", "slide": 140, "stage": "deployment", "title": "Deployment – Example Environments", "points": [], "explanation": "The environments shown are an example rather than a mandatory sequence. Development supports construction, testing and staging support checks, and production serves real users. Disaster recovery provides arrangements for restoring service after serious disruption; it is not simply another routine promotion stage.", "ask": "Which environment should most closely reflect the conditions relevant to release risk?", "sources": []}, {"id": "concept-141", "slide": 141, "stage": "deployment", "title": "Deployment - Tasks", "points": [], "explanation": "Deployment tasks include configuration, appropriate verification and operational planning. High availability aims to sustain service through component failures; disaster recovery addresses restoration after more serious disruption. Their scope depends on service requirements rather than a universal checklist.", "ask": "How would losing one server differ from losing the main hosting location?", "sources": ["https://learn.microsoft.com/en-us/azure/well-architected/reliability/disaster-recovery"]}, {"id": "concept-142", "slide": 142, "stage": "deployment", "title": "Deployment Strategies", "points": [], "explanation": "These approaches serve different purposes and can be combined. Rolling and blue/green strategies control version replacement; canary limits early exposure; A/B testing compares outcomes; shadowing observes copied traffic. The decision starts with the risk or question being addressed.", "ask": "Is the immediate goal safer release, outcome comparison or observing behaviour?", "sources": []}, {"id": "concept-143", "slide": 143, "stage": "deployment", "title": "Recreate Deployment", "points": [], "explanation": "Recreate deployment stops the old instances before starting replacements, creating an unavailable interval for that service. It may suit a planned maintenance window when users can tolerate interruption. Preparation should include verification and recovery steps.", "ask": "What should users and support staff know before that window begins?", "sources": ["https://www.plutora.com/blog/deployment-strategies-6-explained-in-depth", "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy", "https://docs.aws.amazon.com/whitepapers/latest/introduction-devops-aws/deployment-strategies.html"]}, {"id": "concept-144", "slide": 144, "stage": "deployment", "title": "Rolling Update", "points": [], "explanation": "Consider an application running on six servers. A rolling update replaces a small number at a time while healthy servers continue serving users. Checks guide whether the rollout proceeds or pauses. Sufficient capacity and compatibility between versions are essential.", "ask": "What could happen if the new version changes data that the old version still needs?", "sources": ["https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#rolling-update-deployment"]}, {"id": "concept-145", "slide": 145, "stage": "deployment", "title": "Blue / Green Deployment", "points": [], "explanation": "Blue/green deployment prepares a parallel environment before switching traffic. An ordering release can be checked in Green while Blue serves users. Switching traffic back may be quick, but database or external changes can make recovery more complicated.", "ask": "What would prevent the old version from safely resuming service?", "sources": ["https://docs.aws.amazon.com/pdfs/whitepapers/latest/blue-green-deployments/blue-green-deployments.pdf"]}, {"id": "concept-146", "slide": 146, "stage": "deployment", "title": "Phased Rollout", "points": [], "explanation": "A phased rollout expands availability in stages. A canary first exposes a small subset and uses observed health to decide whether to expand. For example, a release might begin with a limited customer group while order failures are monitored.", "ask": "Which signal should trigger a pause before expanding the rollout?", "sources": ["https://docs.aws.amazon.com/whitepapers/latest/overview-deployment-options/canary-deployments.html", "https://developer.apple.com/help/app-store-connect/update-your-app/release-a-version-update-in-phases"]}, {"id": "concept-147", "slide": 147, "stage": "deployment", "title": "A/B Testing", "points": [], "explanation": "A/B testing compares defined outcomes between assigned variants. For example, two checkout layouts could be compared using a planned completion metric and suitable allocation. Group sizes need not be equal, and a difference alone does not automatically prove causation.", "ask": "What should be decided before interpreting the experiment's results?", "sources": ["https://firebase.google.com/docs/ab-testing/ab-concepts"]}, {"id": "concept-148", "slide": 148, "stage": "deployment", "title": "Shadow Deployment", "points": [], "explanation": "Shadow deployment sends copied traffic to a new version without returning its responses to users. An order service can compare results while the live version remains authoritative. Writes, payments, emails and other side effects must be isolated to avoid duplicate actions.", "ask": "What could happen if a shadow request triggered a real payment?", "sources": []}, {"id": "concept-149", "slide": 149, "stage": "deployment", "title": "Deployment Strategies: Summary", "points": [], "explanation": "Choose the approach according to the question and operational constraints. Recreate accepts an interruption, rolling replaces gradually, and blue/green switches environments. Canary evaluates release risk, A/B compares outcomes, and shadowing observes copied traffic without serving its responses.", "ask": "Which approach fits a team seeking early failure signals before wider exposure?", "sources": []}, {"id": "concept-155", "slide": 155, "stage": "maintenance", "title": "Objectives", "points": [], "explanation": "The lesson examines why software changes, the kinds of maintenance and the factors affecting effort. An old ordering service might require both a compatibility update and clearer documentation. Cost depends on the work and context, not simply the age of the software.", "ask": "Which factor would make a seemingly small change difficult?", "sources": []}, {"id": "concept-157", "slide": 157, "stage": "maintenance", "title": "Stage 6: Maintenance", "points": [], "explanation": "Maintenance changes existing software to correct faults, adapt to new conditions or improve its operation. A payment integration update may involve developers, support and operations together. The change should be analysed and verified with attention to existing behaviour.", "ask": "Which existing function could be affected by that update?", "sources": ["https://ieeecs-media.computer.org/media/education/swebok/swebok-v4.pdf"]}, {"id": "concept-158", "slide": 158, "stage": "maintenance", "title": "Need for change?", "points": [], "explanation": "Change can originate outside the software itself. New customer expectations, organisational rules or supported platform versions can make an existing solution inadequate. For example, a revised returns policy may require different approval steps even without a coding defect.", "ask": "Which external change would require the requirements to be reviewed?", "sources": []}, {"id": "concept-159", "slide": 159, "stage": "maintenance", "title": "Maintenance: Need", "points": [], "explanation": "Maintenance can improve, integrate, migrate or eventually retire a service. An ordering system may need to exchange data with a replacement warehouse platform. Retirement also requires planning for users, records and dependent services rather than simply switching the application off.", "ask": "What dependency should be identified before retiring a system?", "sources": []}, {"id": "concept-160", "slide": 160, "stage": "maintenance", "title": "Maintenance: Characteristics", "points": [], "explanation": "Maintenance balances needed changes with continuity of existing service. A security fix or performance improvement should be checked for unintended effects on order processing. Over a long service life, this work can consume substantial resources, depending on demand and complexity.", "ask": "What evidence would show that a maintenance change preserved essential behaviour?", "sources": ["https://ieeecs-media.computer.org/media/education/swebok/swebok-v4.pdf"]}, {"id": "concept-161", "slide": 161, "stage": "maintenance", "title": "Understanding lifetime software costs", "points": [], "explanation": "The 55% maintenance and 45% other-activities split is an illustrative example, not a universal measured estimate. In a hypothetical lifetime budget of 100 units, those shares would be 55 and 45 units. Actual costs depend on service life, change demand and maintainability.", "ask": "Which conditions could increase maintenance's share of lifetime cost?", "sources": ["https://www.computer.org/resources/software-maintenance"]}, {"id": "concept-162", "slide": 162, "stage": "maintenance", "title": "Factors affecting Maintenance Cost", "points": [], "explanation": "Maintenance effort rises when behaviour is hard to understand, skills are scarce or dependencies lose support. An undocumented integration may take longer to investigate than to change. Age alone does not determine cost; the surrounding conditions matter.", "ask": "What improvement could reduce the effort of the next maintenance task?", "sources": []}, {"id": "concept-163", "slide": 163, "stage": "maintenance", "title": "Maintenance: Categories", "points": [], "explanation": "Corrective work fixes discovered defects; adaptive work responds to environmental change; perfective work improves capabilities or qualities; preventive work addresses latent faults before operational failure. For example, adapting to a new operating system differs from correcting an already observed calculation error.", "ask": "Which category best fits fixing a known latent defect before users encounter it?", "sources": []}, {"id": "concept-164", "slide": 164, "stage": "maintenance", "title": "Maintenance: Issues", "points": [], "explanation": "Maintenance involves technical understanding, prioritisation, estimation and measurement. A small-looking order change may affect shared data or several integrations. Decisions should consider dependencies, service risk and evidence of improvement rather than only the number of code changes.", "ask": "What information is needed before estimating the work?", "sources": []}, {"id": "concept-165", "slide": 165, "stage": "maintenance", "title": "Maintenance Activities", "points": [], "explanation": "Monitoring identifies gaps that lead to analysis, design, implementation and verification. After a corrected order feature is delivered, monitoring resumes to confirm its effect and detect new issues. The final step closes the feedback loop rather than duplicating work accidentally.", "ask": "What observation would show that the change solved the original problem?", "sources": []}, {"id": "concept-170", "slide": 170, "stage": "maintenance", "title": "The Cross-Functional Team (Role Matrix)", "points": [], "explanation": "The matrix shows typical lead and collaborative roles, not universal job assignments. An order change can involve a business analyst, developers, testers and operations across several activities. Lead responsibility supports accountability without preventing others from contributing.", "ask": "Where could a weak handover leave an important responsibility uncovered?", "sources": []}], "quizzes": [{"slide": 35, "classification": "Minor", "issue": "The intended A/C answer matches slide 28, but broad industry “aliases” are less precise than the lesson’s terminology. Capitalise Identity consistently.", "question": "Which two labels are listed for SDLC in this lesson? Select two.", "options": ["Software Life Cycle", "Project Line of Control", "Development Life Cycle", "Business Lease Control"], "answer": "A and C", "notes": "These are the two labels listed in slide 28. Software and systems life cycles can have different scopes; avoid presenting every label on that slide as an exact universal synonym.", "lesson": "28", "source": "", "id": "quiz-35", "rationale": "The two accepted labels appear in this lesson's terminology. They do not make every similarly named lifecycle identical in scope. For example, a system lifecycle may also consider hardware and operational processes beyond the application.", "stage": "foundations", "correct": [0, 2]}, {"slide": 36, "classification": "Keep", "issue": "The False answer is sound. No visible question or option change is necessary.", "question": "The SDLC is strictly limited to a maximum of 3 stages.", "options": ["True", "False"], "answer": "False", "notes": "This lesson presents six activities. Other models group activities differently; there is no universal maximum of three.", "lesson": "26, 31", "source": "[AWS: SDLC models](https://aws.amazon.com/what-is/sdlc/)", "id": "quiz-36", "rationale": "There is no universal three-stage limit. This course uses six activity groups, while other organisations combine or rename activities. For example, a small team might discuss coding and testing together without eliminating either kind of work.", "stage": "foundations", "correct": [1]}, {"slide": 37, "classification": "Minor", "issue": "The stored sequence is correct for the pictured model; “the correct chronological order” needs a stated scope.", "question": "For the simplified sequential model shown in this lesson, put these activities in order.", "options": ["Design", "Deployment", "Testing", "Requirements", "Development", "Maintenance"], "answer": "D → A → E → C → B → F", "notes": "Requirements → Design → Development → Testing → Deployment → Maintenance. This is the lesson’s overview, not a prohibition on feedback, overlap or iteration.", "lesson": "26, 31 and repeated stage diagrams", "source": "[AWS: SDLC models](https://aws.amazon.com/what-is/sdlc/)", "id": "quiz-37", "rationale": "The answer follows the simplified sequential model presented here. In practice, finding a missing order rule during testing may lead back to requirements or design. The quiz checks the model's sequence rather than a rule prohibiting iteration.", "stage": "foundations", "correct": [3], "correctOrder": "D A E C B F"}, {"slide": 38, "classification": "Correct", "issue": "“Multiple people” in “every single stage” is not guaranteed; a small project or one person holding several roles is a counterexample.", "question": "Software delivery typically requires collaboration among business, development, testing and operations roles.", "options": ["True", "False"], "answer": "True", "notes": "Responsibilities cross role boundaries, but team size and participation vary. Do not infer a fixed minimum number of people at every stage.", "lesson": "30; role slides 45, 71, 89, 103, 138, 157", "source": "", "id": "quiz-38", "rationale": "Delivery needs complementary perspectives across business, development, testing and operations. For example, an order feature must satisfy users, handle exceptions and remain supportable. These responsibilities may be shared by fewer people in a small team.", "stage": "foundations", "correct": [0]}, {"slide": 39, "classification": "Correct", "issue": "The existing stem asks easy/difficult but supplies True/False; the stored False is not a valid response to that question. It also inherits slide 33’s generalisation.", "question": "Following an SDLC guarantees accurate cost estimates and prevents project overruns.", "options": ["True", "False"], "answer": "False", "notes": "A defined process supports planning and control; estimates still depend on uncertain scope, dependencies and delivery conditions. Revisit estimates when assumptions change.", "lesson": "33; coordinate with the planned correction to that lesson slide", "source": "", "id": "quiz-39", "rationale": "Following a lifecycle improves the basis for planning but does not remove uncertainty. A new integration or misunderstood requirement can change an estimate. Estimates should be revisited as evidence becomes available rather than treated as guarantees.", "stage": "foundations", "correct": [1]}, {"slide": 59, "classification": "Minor", "issue": "Communication and planning are the deck’s organisation, not a universal two-step definition of requirements engineering.", "question": "Which pair is highlighted in this lesson’s overview of requirements work?", "options": ["Focus and iterations", "Communication and planning", "Planning and quality"], "answer": "B — Communication and planning", "notes": "Slide 47 uses this pair. Slides 46, 49 and 50 also cover elicitation, analysis, specification, validation and management, so requirements work is broader.", "lesson": "46–50", "source": "", "id": "quiz-59", "rationale": "Communication and planning are the pair highlighted in this lesson. They support requirements work rather than replacing elicitation, analysis, specification and validation. For example, a stakeholder workshop needs both a useful conversation and planned follow-up.", "stage": "requirements", "correct": [1]}, {"slide": 60, "classification": "Correct", "issue": "The definition excludes affected parties who receive no benefit; the hint gives away the answer and leaves a parenthesis unclosed.", "question": "What broad term describes people or groups who affect, are affected by, or have an interest in the software project?", "options": ["Business owner", "End user", "Developer", "Accountant", "Stakeholder"], "answer": "E — Stakeholder", "notes": "Stakeholders include users and funders as well as affected or constraining parties. The first four roles can be stakeholders; E is the broad category.", "lesson": "45, 51", "source": "[NASA: stakeholder expectations](https://www.nasa.gov/reference/4-1-stakeholder-expectations-definition/)", "id": "quiz-60", "rationale": "“Stakeholder” includes all the listed roles when they influence or are affected by the project. For example, an accountant may need reliable transaction records even without using the checkout screen.", "stage": "requirements", "correct": [4]}, {"slide": 61, "classification": "Correct", "issue": "All four artifacts can be produced or started during requirements work. Slide 58’s own notes explicitly include RTM, contradicting the exclusion implied by A/B/D.", "question": "Which three documents primarily specify requirements, rather than record traceability links? Select three.", "options": ["BRD (Business Requirements Document)", "SRS (Software Requirements Specification)", "RTM (Requirements Traceability Matrix)", "FRD (Functional Requirements Document)"], "answer": "A, B and D", "notes": "The question now distinguishes purpose, not creation date. RTM primarily records relationships between requirements and other artifacts; it can begin during requirements work. Document names and separation vary by organisation.", "lesson": "54–58, especially slide 58 notes", "source": "[NASA: requirements management](https://www.nasa.gov/reference/6-2-requirements-management/)", "id": "quiz-61", "rationale": "BRD, SRS and FRD primarily describe requirements. An RTM records relationships among requirements, tests and evidence, although it may also display requirement text. For example, a quantity rule is specified in a requirement and linked to its checks in the matrix.", "stage": "requirements", "correct": [0, 1, 3]}, {"slide": 62, "classification": "Correct", "issue": "“Fasten” should mean “speed up”; endorsing an error-proof process is technically unsound.", "question": "Appropriate tools can make software development completely error-free.", "options": ["True", "False"], "answer": "False", "notes": "Tools can speed up work and reduce some errors, but they do not guarantee correctness. Suitable inputs, configuration and human checking still matter.", "lesson": "Tool support throughout the deck; requirements quality at 46, 48", "source": "[ISTQB CTFL 4.0.1](https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf) — section 6.2",
