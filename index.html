k, and consumes the hold. Replaying that token at t=121 returns the original order with no new effect. A first confirmation at exactly t=120 expires the pending hold; on-hand stays unchanged and availability rises as the hold clears. A missing token is rejected. A countdown alone cannot determine these outcomes."}, {"title": "From demo to real service", "prompt": "Two shoppers want the last bottle, a server restarts during confirmation, and one shopper cannot finish a review within 120 seconds. Name three separate design questions that the current in-memory demonstration cannot settle.", "answer": "Inventory needs an atomic server-side reservation strategy and a defined conflict response. Durable command/order records and recovery need a transaction and idempotency design that survives restarts. The time limit needs accessibility evaluation, including whether timing adjustments or a justified exception apply. Account authority, payment handling, privacy, and operational support require additional scope; the local demo proves none of them."}], "documents": [{"id": "stakeholders", "title": "Stakeholder map", "stage": "requirements", "what": "Identifies the people needed to define and challenge Market Lane's reservation and return behaviour.", "why": "Prevents a checkout-only view from overlooking stock reconciliation, accessibility, and support responsibilities.", "who": "The analyst proposes the map; named representatives would confirm responsibilities before real project work.", "when": "Use during discovery and revisit when a proposed feature introduces a new affected group.", "where": "Keep with the scope and link each unresolved concern to its decision owner.", "which": "Distinguish the fictional customer, the demo audience, and proposed future operational stakeholders.", "how": "Ask each group for one failure scenario, then record the decision it can inform.", "sections": [{"heading": "Proposed involvement", "text": "The customer representative evaluates clarity before and after confirmation. The developer explains local-state limits. The tester challenges replay and deadline behaviour. The release owner checks that the demonstration does not imply real payment or durable orders. These are proposed responsibilities, not appointments or recorded approvals."}, {"heading": "Concerns and decision rights", "columns": ["Stakeholder", "Concrete concern", "Decision contribution"], "rows": [["Customer representative", "Will my bottle still be held when I confirm?", "Review wording and expiry recovery"], ["Tester", "Could retry confirmation create a second order?", "Evidence against SHOP-FR-05"], ["Product owner", "Does login belong in this version?", "Keep future account login outside SHOP-FR-08"], ["Designer", "Can a keyboard user complete a timed review?", "Accessibility assessment and potential change request"]]}, {"heading": "Missing voice check", "text": "A real retail release would add inventory operations, payment specialists, security, privacy, and customer support representatives. Their absence is acceptable for this bounded simulation only because it has no real stock, money, accounts, or personal data. Adding those capabilities reopens the map."}]}, {"id": "brd", "title": "Business requirements document", "stage": "requirements", "what": "States the educational problem, intended outcome, and commercial features deliberately excluded from Market Lane.", "why": "Anchors decisions in understanding stock movement instead of expanding into a complete shop.", "who": "The product owner and analyst draft it; the customer representative challenges the stated outcome.", "when": "Write before detailed screens and revise when the purpose or boundary changes.", "where": "Maintain beside the scope statement and link to PRD decisions and the SRS.", "which": "Use business outcomes here; keep individual button rules in functional requirements.", "how": "Connect each proposed capability to the learner decision or misunderstanding it helps address.", "sections": [{"heading": "Problem and outcome", "text": "Market Lane needs to offer products without promising the same stock twice. Shoppers need a clear price, a short period to review their choice, a definite order result and a predictable full-return process. This bounded example uses one product per order so the commitments can be followed clearly from business need to test evidence."}, {"heading": "Outcome-to-capability rationale", "columns": ["Outcome", "Capability", "Evidence to seek"], "rows": [["Avoid overselling", "Reserve only available stock during review", "A request beyond availability is rejected without allocation."], ["Provide a reliable order outcome", "Create one order for one confirmed review token", "Repeated confirmation identifies the same order."], ["Handle a full return predictably", "Restore that order’s quantity and simulate its full refund once", "Repeated return does not add stock or another refund."]]}, {"heading": "Boundary and proposed success check", "text": "Use two products and one fictional customer to keep arithmetic inspectable. Do not add delivery, tax, discounts, login, or real payments. A proposed review activity asks a reader to calculate a SGD 24.00 order and its return from the displayed rules; no learning measurement has been conducted."}]}, {"id": "mrd", "title": "Market research hypotheses", "stage": "requirements", "what": "Records hypotheses about the audience's difficulties and the evidence needed to test them.", "why": "Separates an appealing product idea from claims that real users have requested or validated it.", "who": "The analyst proposes questions; representative nontechnical readers would supply research evidence.", "when": "Use before committing effort to additional teaching interactions or catalogue complexity.", "where": "Keep hypotheses with planned research notes, without presenting imagined interviews as findings.", "which": "Use an MRD for audience opportunity; a PRD decides the specific product response.", "how": "State a testable expectation, seek counterexamples, and mark each hypothesis unvalidated until investigated.", "sections": [{"heading": "Opportunity hypothesis", "text": "Some nontechnical readers may understand an order confirmation but misunderstand a stock hold. Market Lane proposes a visible stock-and-reservation model to address that gap. This is a hypothesis, not survey evidence. The demonstration should remain small until observation shows which part of the purchase sequence is actually confusing."}, {"heading": "Hypotheses awaiting research", "columns": ["Hypothesis", "Proposed observation", "Evidence against it"], "rows": [["A hold is mistaken for a stock sale", "Ask what changed after reviewing two notebooks", "Readers distinguish on-hand, held, and available"], ["Retries are assumed to be new purchases", "Replay one confirmation and ask what changed", "Readers predict idempotent behaviour without help"], ["Returns are assumed to restore indefinitely", "Show a repeated return request", "Readers explain the once-only rule accurately"]]}, {"heading": "Research decision", "text": "Recruit a varied small group for exploratory observation, including people who use keyboard navigation. Ask them to explain the sequence without leading terms. Record misunderstandings and exceptions rather than converting a few observations into population statistics. A wider catalogue is not justified merely because it looks more realistic."}]}, {"id": "prd", "title": "Product requirements document", "stage": "requirements", "what": "Defines the proposed Market Lane experience and the boundaries of this specific demonstration.", "why": "Turns the educational outcome into a coherent set of small, connected user journeys.", "who": "The product owner leads scope decisions with design, development, and testing input.", "when": "Use after the problem is understood and before building individual interactions.", "where": "Keep as the experience overview linked to detailed SHOP requirements and release notes.", "which": "Include user-facing capabilities here; infrastructure choices belong in architecture and technical requirements.", "how": "Describe the starting state, critical transitions, exclusions, and signals that users need.", "sections": [{"heading": "Experience promise", "text": "The reader selects Notebook or Bottle and a quantity, sees an exact total, reviews a temporary hold, simulates confirmation, and returns a completed order. Each step exposes on-hand, held, and available stock. Multiple completed orders remain in the tab. The interface explains the 120-second deadline and temporary memory before the reader relies on them."}, {"heading": "Version boundary", "columns": ["Included", "Reason", "Excluded neighbour"], "rows": [["Two fixed products", "Transparent quantities and totals", "Catalogue administration"], ["One pending review", "Visible reservation lifecycle", "A multi-product basket or simultaneous reviews"], ["Full simulated return", "Reversal and retry reasoning", "Partial returns or payment settlement"], ["Public single-customer state", "Low-friction demonstration", "Implemented account login"]]}, {"heading": "Proposed release decision", "text": "The experience is ready for consideration only when actual checks demonstrate the specified transitions and the presentation accurately describes simulation and reset. No document here grants release approval. Any request for real accounts, payments, or shared inventory requires a new PRD and associated risk work."}]}, {"id": "crd", "title": "Customer requirements statement", "stage": "requirements", "what": "Captures the fictional customer's expectations in everyday language before technical translation.", "why": "Keeps needs visible when precise state rules become more detailed than the customer story.", "who": "The customer representative would review these authored statements; no interview has been performed.", "when": "Use during elicitation and compare again when reviewing the proposed purchase experience.", "where": "Keep beside the BRD, with links from each statement to its SHOP rules.", "which": "Customer expectations explain experience; they do not prescribe databases, frameworks, or implementation details.", "how": "Write what the customer needs to understand and the result they expect.", "sections": [{"heading": "Illustrative customer voice", "text": "I want to know the total before committing, whether the items are being held, and how long that hold lasts. If I press again because I am unsure, I do not want another order. If I return the whole order, I want to see the full simulated refund and know the return is complete."}, {"heading": "Statements translated into checks", "columns": ["Customer statement", "Requirement link", "Observable signal"], "rows": [["Let me check the exact total", "SHOP-FR-03, SHOP-FR-04", "SGD 24.00 for two notebooks"], ["Tell me when my hold is lost", "SHOP-FR-06", "Expired status and restored stock"], ["Do not buy twice if I retry", "SHOP-FR-05", "Same recorded order on replay"], ["Do not return twice by accident", "SHOP-FR-07", "Same refund on repeated return"]]}, {"heading": "Questions still worth asking", "text": "Observe whether readers understand 'available' versus 'reserved' and whether expiry feels like cancellation or failure. Ask whether the full-return label implies a real refund despite the simulation notice. These questions inform wording and interaction design; they do not change the core rules without a recorded decision."}]}, {"id": "srs", "title": "Software requirements specification", "stage": "requirements", "what": "Provides the authoritative set of ten proposed SHOP requirements for the bounded demonstration.", "why": "Prevents design documents and tests from silently adopting different stock or deadline rules.", "who": "The analyst maintains identifiers; developers and testers challenge completeness and testability.", "when": "Baseline before implementation work, then use controlled revisions for behaviour changes.", "where": "Keep the rule set linked to the RTM, design records, and test cases.", "which": "Use this specification for normative behaviour; examples illustrate but do not override it.", "how": "Review each rule against valid, invalid, repeated, and time-dependent actions.", "sections": [{"heading": "System boundary", "text": "Market Lane runs one fictional customer in one in-memory instance. An order contains exactly one product and quantity. Several completed orders may coexist, with at most one pending review. The specification does not claim persistence, multi-user inventory, authentication, payment security, or accessibility conformance. Reset removes all local orders and replay history."}, {"heading": "Stable requirement baseline", "columns": ["ID", "Title", "Required behaviour"], "rows": [["SHOP-FR-01", "Fixed catalogue and starting stock", "The one-customer demo starts with Notebook (NOTEBOOK), unit price 1200 cents and on-hand stock 5, and Bottle (BOTTLE), unit price 2000 cents and on-hand stock 2. Available stock equals on-hand stock minus the pending hold for that product. Selection, reservation, orders, refunds, and replay history start empty."], ["SHOP-FR-02", "Valid product and quantity", "Each purchase selects exactly one known product and a positive whole-number quantity. Reject blank, zero, negative, fractional, nonnumeric, or unsafe numeric quantities. A product must be selected before review. A multi-product basket is outside scope; each completed order contains only its selected product and quantity."], ["SHOP-FR-03", "Exact totals", "Compute the order total from its fixed catalogue unit price and quantity using integer cents. There is no tax, shipping charge, or discount. Two notebooks total 2400 cents, displayed as SGD 24.00. Ignore any caller-supplied unit price or total."], ["SHOP-FR-04", "Create a stock hold at review", "Only one pending review is permitted. Review checks the selected quantity against available stock and, if it fits, creates a hold for exactly 120 seconds and fixes the product, quantity, and price. On-hand stock is unchanged; available stock subtracts the hold. Selection edits require cancelling the pending review first. Any new review while one is pending is rejected without extending the original deadline."], ["SHOP-FR-05", "Confirm once before the deadline", "Confirm requires an explicit hold token. A first confirmation succeeds only for a pending reservation with now strictly earlier than expiresAt. Reduce on-hand stock by its quantity, consume the hold, and create one order linked to that token. Available stock does not fall again. Replaying the same confirmed token returns its original order, even after return, with no new stock or payment effect. Missing or unknown tokens are rejected. Multiple completed orders may coexist; no real funds move."], ["SHOP-FR-06", "Release cancelled or expired stock once", "Cancellation clears a pending hold once without changing on-hand stock. A pending review expires when now is equal to or later than expiresAt, also clearing its hold once. Available stock therefore increases by the released quantity. Every state-changing command and state read reconciles expiry; a delayed screen timer never permits a late confirmation. Repeated cancellation or expiry processing has no additional stock effect."], ["SHOP-FR-07", "Return a completed order once", "A completed, unreturned order can be fully returned. Restore its original quantity to that product's on-hand stock and record a simulated refund equal to its entire recorded total. Mark only that order returned. Retrying its return retrieves the same refund without restoring stock again. Other orders and any current hold remain unchanged. Partial returns and returns of pending, cancelled, expired, or unknown records are rejected."], ["SHOP-FR-08", "Public, temporary demonstration", "The demonstration has one fictional customer, no implemented account login, no address or payment-card capture, and no real payment integration. State exists only in memory for the current demo instance. Restart or reset restores initial stock and clears reservation, order, refund, and replay history. Account login is possible future scope, requiring separate requirements and design."], ["SHOP-QR-01", "Understandable and operable interaction", "Proposed acceptance checks require keyboard access to all purchase and return controls, programmatically associated quantity errors, visible review status and remaining time, explicit simulated-payment labels, and a readable order/refund summary at 320 CSS pixels without horizontal page scrolling. Accessibility and timing limitations must be recorded rather than asserting full conformance."], ["SHOP-TR-01", "Single authority for state and money", "The in-memory demo uses one synchronous command handler, integer cents, explicit reservation/order states, hold-token-to-order links, and an injectable clock; validate before mutating and apply each local transition as a whole. This is not a concurrency or security guarantee across tabs or users. A real service would need server authority, durable transactions, authentication/authorisation, unique idempotency constraints, and recovery design."]]}, {"heading": "Interpretation and change", "text": "At exactly the deadline, an unconfirmed hold is expired. Replaying a token that already produced an order retrieves that original order instead of reconsidering the old deadline. Missing tokens are rejected. Fixed catalogue prices determine totals. If another document conflicts, resolve the discrepancy against this baseline and update the affected links."}]}, {"id": "frd", "title": "Functional requirements document", "stage": "requirements", "what": "Describes the customer's actions and the resulting reservation, order, and refund transitions.", "why": "Connects precise requirements to complete journeys, including rejected and repeated actions.", "who": "The analyst drafts flows; the designer and developer examine each observable outcome.", "when": "Use while designing interactions and deriving functional test scenarios.", "where": "Link each flow to the SRS and its matching UI and test records.", "which": "Focus on functions and state changes; keep performance and platform constraints elsewhere.", "how": "Walk the same selection through review, cancel, confirm, expiry, and return.", "sections": [{"heading": "Review flow", "text": "From a selected product and quantity, validate the known product and positive whole quantity. Reconcile expiry, require no other pending review, and compare quantity with available stock before mutation. Create the hold and capture price and quantity, leaving on-hand unchanged. Show available stock after subtracting the hold. Selection changes require cancelling that review."}, {"heading": "Command outcomes", "columns": ["Command and state", "Expected result", "Requirement"], "rows": [["Confirm PENDING before deadline", "One COMPLETED order; on-hand reduced and hold consumed", "SHOP-FR-05"], ["Cancel PENDING", "CANCELLED; quantities released once", "SHOP-FR-06"], ["Read PENDING at deadline", "EXPIRED; quantities released once", "SHOP-FR-06"], ["Return COMPLETED order", "RETURNED; full stock restoration and refund", "SHOP-FR-07"], ["Replay successful hold token", "Existing original order; no new mutation", "SHOP-FR-05"]]}, {"heading": "Rejection behaviour", "text": "A stock failure identifies the requested and available quantities and creates no hold. Confirming an expired or cancelled review returns its final status and offers a fresh review. Returning a pending or missing order creates no refund. Returning one completed order restores its quantity while leaving other orders and any separate pending hold intact."}]}, {"id": "quality-requirements", "title": "Quality requirements", "stage": "requirements", "what": "Defines proposed observable usability and accessibility checks for the small shopping interaction.", "why": "Stops vague claims such as easy or accessible from substituting for inspectable evidence.", "who": "The designer proposes checks; a tester and accessibility reviewer would evaluate actual behaviour.", "when": "Agree alongside functional rules, before layout and timeout decisions become costly.", "where": "Link to SHOP-QR-01, the accessibility review, and the unexecuted quality test case.", "which": "Distinguish acceptance checks from future performance targets and from a conformance claim.", "how": "Specify the conditions, expected observation, and how unresolved limitations affect readiness.", "sections": [{"heading": "Quality scope", "text": "The proposed checks cover keyboard operation, labelled quantity errors, visible reservation state, readable order and refund amounts, and a layout usable at 320 CSS pixels. The demonstration must say that payment and refund are simulated. These checks are concrete starting points, not a complete accessibility audit or a claim of compliance."}, {"heading": "Proposed checks", "columns": ["Concern", "Check condition", "Expected evidence"], "rows": [["Keyboard operation", "Complete review, confirm, and return without a pointer", "Focus trace and recorded outcome"], ["Error understanding", "Enter quantity 1.5", "Associated message identifies whole numbers"], ["Narrow layout", "Viewport width 320 CSS pixels", "No horizontal page scrolling"], ["Reservation awareness", "Review and reach t=120", "Visible expiry and clear next action"]]}, {"heading": "Timing limitation", "text": "A fixed 120-second hold can disadvantage some users. Review relevant timing guidance before any conformance claim. The current behaviour remains fixed for this case; a timing adjustment would need an explicit requirement change and stock-policy analysis. Rendering a countdown does not resolve the accessibility question."}]}, {"id": "technical-requirements", "title": "Technical requirements", "stage": "requirements", "what": "States the local implementation constraints and the extra obligations a real service would introduce.", "why": "Prevents a tidy interface from being mistaken for reliable distributed commerce.", "who": "The developer proposes the local mechanism; a future service architect would assess operational extensions.", "when": "Use before selecting state storage, clocks, or payment-related integration boundaries.", "where": "Link to SHOP-TR-01, the architecture, concurrency review, and dependency register.", "which": "Separate required demo mechanics from proposed production mechanisms that are outside this version.", "how": "Define numeric representation, command authority, time comparison, and restart semantics explicitly.", "sections": [{"heading": "Demo mechanics", "text": "Represent money as integer cents and quantities as validated safe integers. One synchronous command handler owns mutable state. Inject the clock so boundary cases can be checked without waiting. Reconcile expiry during reads and commands. Do not rely on a screen timer, button disabling, or caller-supplied totals to enforce rules."}, {"heading": "Two implementation contexts", "columns": ["Concern", "In-memory demonstration", "Proposed real service"], "rows": [["State authority", "One command handler per instance", "Authenticated server commands and durable store"], ["Inventory", "Local on-hand count and one separate hold", "Atomic reservation/confirmation transaction and conflict handling"], ["Replay", "In-memory reservation-to-order link", "Durable unique keys tied to customer and intent"], ["Time", "Controlled clock and deadline comparison", "Authoritative server time and recovery worker"]]}, {"heading": "Explicit limitation", "text": "Refreshing or resetting removes all local history. Separate tabs are independent instances, not competing customers. A browser-only map cannot guarantee cross-user inventory or survive a crash. Real payment collection is absent; adding it would require an independently reviewed design, never just replacing the simulated confirmation label."}]}, {"id": "backlog", "title": "Prioritised product backlog", "stage": "requirements", "what": "Breaks the proposed experience into implementable increments while retaining the rule dependencies.", "why": "Shows why attractive screen work cannot precede the underlying reservation and retry behaviour.", "who": "The product owner proposes order; developers and testers refine effort and acceptance boundaries.", "when": "Use for planning the next coherent increment and reassess after actual feedback.", "where": "Keep work items linked to SHOP IDs and their expected test cases.", "which": "Backlog order represents sequencing; it does not redefine the normative requirement set.", "how": "Deliver state correctness first, then interaction, and finally evidence and release preparation.", "sections": [{"heading": "Proposed first increment", "text": "Build catalogue state, exact single-product totals, and quantity validation together. Next deliver review, confirm, cancel, expiry, and per-order return as a connected state model. Track on-hand separately from the one hold. Add the interface once transitions can be exercised directly. No backlog item is marked completed in this illustrative plan."}, {"heading": "Work items", "columns": ["Item", "Requirement links", "Completion evidence to collect"], "rows": [["ML-01 Catalogue and totals", "SHOP-FR-01, SHOP-FR-02, SHOP-FR-03", "SHOP-TC-01 through SHOP-TC-07"], ["ML-02 Hold and terminal transitions", "SHOP-FR-04, SHOP-FR-05, SHOP-FR-06", "SHOP-TC-08 through SHOP-TC-15"], ["ML-03 Full return", "SHOP-FR-07", "SHOP-TC-16 and SHOP-TC-17"], ["ML-04 Operable demo shell", "SHOP-FR-08, SHOP-QR-01", "SHOP-TC-18 and reset evidence"], ["ML-05 Release evidence", "SHOP-TR-01", "Build record and readiness review"]]}, {"heading": "Deferral rule", "text": "Account login, tax, discounts, and real payment remain outside the backlog for this version. A proposal to add them becomes a scope decision first. Do not hide extra features inside an existing item such as 'finish checkout'; their requirements and evidence would be materially different."}]}, {"id": "rtm", "title": "Requirements traceability matrix", "stage": "requirements", "what": "Connects each stable SHOP requirement to design evidence and the specified test cases.", "why": "Exposes rules with no checking plan and tests that lack an agreed purpose.", "who": "The analyst maintains links; the tester checks coverage when either requirements or cases change.", "when": "Use during reviews, change impact analysis, and preparation of a real test summary.", "where": "Store alongside the SRS and link to documents by their stable case IDs.", "which": "Traceability is planned coverage, not evidence that any linked test has passed.", "how": "Review links in both directions and record actual outcomes in separate execution records.", "sections": [{"heading": "Trace convention", "text": "SHOP-FR identifiers describe behaviour, SHOP-QR-01 describes interaction quality, and SHOP-TR-01 describes local technical constraints. SHOP-TC identifiers below refer to the 18 cases in the test-cases document. All links are planned and illustrative; there is no execution status attached to this matrix."}, {"heading": "Planned coverage", "columns": ["Requirement", "Design document IDs", "Test case IDs"], "rows": [["SHOP-FR-01", "data-model, ui", "SHOP-TC-01, SHOP-TC-02"], ["SHOP-FR-02", "lld, ui", "SHOP-TC-03, SHOP-TC-04, SHOP-TC-05, SHOP-TC-06"], ["SHOP-FR-03", "lld, data-model", "SHOP-TC-02, SHOP-TC-04"], ["SHOP-FR-04", "lld, api, interface-failure-contract", "SHOP-TC-02, SHOP-TC-07, SHOP-TC-08, SHOP-TC-09"], ["SHOP-FR-05", "api, concurrency-review", "SHOP-TC-02, SHOP-TC-12, SHOP-TC-13, SHOP-TC-14, SHOP-TC-15"], ["SHOP-FR-06", "lld, ui", "SHOP-TC-10, SHOP-TC-11, SHOP-TC-13"], ["SHOP-FR-07", "data-model, api", "SHOP-TC-14, SHOP-TC-16, SHOP-TC-17"], ["SHOP-FR-08", "hld, privacy-register", "SHOP-TC-01, SHOP-TC-18"], ["SHOP-QR-01", "ui, accessibility-review", "SHOP-TC-18"], ["SHOP-TR-01", "hld, lld, concurrency-review", "SHOP-TC-02, SHOP-TC-05, SHOP-TC-07, SHOP-TC-09, SHOP-TC-11, SHOP-TC-14, SHOP-TC-16"]]}, {"heading": "Review trigger", "text": "Changing reservation duration affects the deadline rule, UI, clock setup, cases 11 through 13, user guidance, and timing review. Changing return scope affects order data, refund calculation, cases 14, 16, and 17, and readiness. This matrix identifies impact but cannot decide whether the change is valuable."}]}, {"id": "assumption-log", "title": "Assumption and uncertainty log", "stage": "requirements", "what": "Distinguishes fixed case facts from unvalidated beliefs that influence the shopping experience.", "why": "Prevents guesses about users or browser behaviour from becoming invisible product commitments.", "who": "The analyst records assumptions and assigns the role best placed to investigate them.", "when": "Use throughout discovery and reopen entries when a scope or environment change challenges them.", "where": "Link entries to the affected SHOP rule, design decision, or research question.", "which": "An agreed case rule is not an assumption; audience understanding and suitability may be.", "how": "Record the consequence of being wrong and the evidence needed to retire the uncertainty.", "sections": [{"heading": "Boundary of certainty", "text": "Prices, stocks, one pending review, the 120-second hold, and full simulated returns are case decisions. Whether readers understand these rules or can complete the review comfortably is not established. Treating the fixed timer as a useful exercise does not prove that the same timer is suitable for an accessible retail service."}, {"heading": "Open assumptions", "columns": ["ID and belief", "If wrong", "Proposed check"], "rows": [["A-01 Readers distinguish on-hand, held, and available stock", "Review or confirmation feedback may mislead", "Observe explanation of a two-notebook selection"], ["A-02 Reset is understood as a new demo", "Readers may think orders were lost", "Ask what refresh will do before trying it"], ["A-03 120 seconds supports the exercise", "Some readers cannot review comfortably", "Timing and accessibility review"], ["A-04 One local instance is sufficient", "Audience may infer multi-user inventory", "Check whether labels explain instance isolation"]]}, {"heading": "Resolution practice", "text": "When an observation contradicts an assumption, record the observation and its context. Then decide whether wording, interaction, or scope should change. Do not rewrite the original assumption as if the team had known the answer from the start; the history explains why the design evolved."}]}, {"id": "prioritization", "title": "Priority and dependency decision", "stage": "requirements", "what": "Explains the proposed ordering of Market Lane work using value, risk, and dependencies.", "why": "Protects the learning outcome from being displaced by decorative or commercially familiar features.", "who": "The product owner proposes priorities with input from the developer, tester, and customer representative.", "when": "Use before iteration planning and whenever new evidence competes for available effort.", "where": "Keep with the backlog so ordering has a visible rationale.", "which": "Distinguish essential correctness from useful presentation polish and explicitly deferred commercial scope.", "how": "Compare consequences of omission before comparing convenience or estimated implementation effort.", "sections": [{"heading": "Decision basis", "text": "Reservation, once-only confirmation, and once-only return are central because they expose the state-management decisions the case teaches. Clear wording and keyboard operation are also necessary for participating in the exercise. Catalogue search would add effort without improving understanding of the two-product model."}, {"heading": "Proposed priority decisions", "columns": ["Candidate", "Priority", "Reason"], "rows": [["Reservation and inventory consistency", "Essential", "A hold must not reduce on-hand stock before confirmation"], ["Replay-safe confirmation and per-order return", "Essential", "Duplicate outcomes or changes to another order break core rules"], ["Visible status and keyboard controls", "Essential", "Readers must inspect and operate the sequence"], ["Decorative product photography", "Optional", "Does not change the state-learning outcome"], ["Account login", "Deferred future scope", "Introduces identity and persistence requirements"]]}, {"heading": "Dependency note", "text": "A polished receipt depends on a stable order model. A reliable countdown display depends on authoritative deadline checks beneath it. Implementing these in reverse order can create apparent completion while core questions remain unresolved. Revisit priorities using observed difficulty and defects, not only requests for more realistic retail features."}]}, {"id": "privacy-register", "title": "Data and privacy register", "stage": "requirements", "what": "Records the minimal fictional data the demo needs and the information it should never request.", "why": "Prevents a simulated checkout from casually collecting real customer or payment details.", "who": "The product owner and developer maintain the boundary; future privacy specialists assess real-service expansion.", "when": "Review before adding forms, persistence, analytics, or external integrations.", "where": "Keep with the data model and future-scope decisions rather than burying it in interface text.", "which": "Separate app-level fictional state from possible hosting logs that require their own inspection.", "how": "List each data item, its purpose, lifetime, and any unresolved external handling.", "sections": [{"heading": "Data-minimisation decision", "text": "The app uses DEMO-CUSTOMER without a name, email, address, password, or card field. Product quantities, local order IDs, and simulated refund amounts exist only for the current instance. Reset clears them. This document does not claim that a hosting environment has no access logs or telemetry; those settings must be inspected separately."}, {"heading": "Data inventory", "columns": ["Data", "Purpose", "Lifetime and handling"], "rows": [["DEMO-CUSTOMER", "Associate the one local journey", "Fixed fictional value; no identity claim"], ["Selection and reservation", "Calculate and hold chosen items", "Local memory until transition or reset"], ["Order and refund records", "Explain completion and reversal", "Local memory until reset"], ["Potential hosting request logs", "Operate the hosting service", "Outside demo model; inspect actual provider settings"]]}, {"heading": "Change boundary", "text": "Adding login, delivery addresses, real payments, persistent analytics, or support uploads would create new data flows. First specify need, access, retention, deletion, and processor responsibilities. No such feature is implemented or authorised by the current shopping case, and a simulation label alone would not make collecting real details appropriate."}]}, {"id": "hld", "title": "High-level design", "stage": "design", "what": "Shows the proposed parts of the single-customer shopping demonstration and their boundaries.", "why": "Prevents stock authority from being scattered across screens with different interpretations of a hold.", "who": "The developer explains the architecture to the designer, tester, and release owner.", "when": "Use before implementation and revisit when adding storage or any external service.", "where": "Keep with the technical requirements and the more detailed state and interface records.", "which": "Choose one local state owner for this demo; distributed service architecture remains future work.", "how": "Follow a command from the screen through validation, transition, and the resulting view.", "sections": [{"heading": "Local architecture", "text": "The UI submits commands to a single in-memory shopping model. The model holds catalogue prices, on-hand stock, reservation records, orders, refunds, and links from confirmed hold tokens to orders. A clock adapter supplies time. A view builder derives held and available stock after reconciling expiry. Formatting converts cents into SGD text without owning inventory decisions."}, {"heading": "Component responsibility", "columns": ["Component", "Owns", "Must not own"], "rows": [["Shopping model", "Validating and applying state transitions", "DOM rendering"], ["Clock adapter", "Current time and controllable test time", "Business permission to confirm"], ["View builder", "Available = on-hand minus pending hold", "An independent stock counter"], ["UI", "Selection, feedback, keyboard interaction", "Authoritative prices or replay decisions"]]}, {"heading": "Real-service boundary", "text": "The demo has no backend, real payment processor, customer identity, or shared inventory. A future service would move command authority and durable records to the server. Multiple browser instances would then compete for stock and require transaction, authentication, recovery, and reconciliation design that the local architecture does not provide."}]}, {"id": "lld", "title": "Detailed state and calculation design", "stage": "design", "what": "Specifies command order, reservation states, and the arithmetic behind stock and totals.", "why": "Resolves edge cases that a screen sketch cannot show, especially expiry and replay.", "who": "The developer owns the design proposal; the tester challenges boundary and stale-command cases.", "when": "Use while implementing the model and during reviews of any transition change.", "where": "Link to SHOP-FR-02 through SHOP-FR-07 and the corresponding test cases.", "which": "Use explicit states and derived availability rather than several independently adjusted display counters.", "how": "Check command history, reconcile time, validate preconditions, then apply one synchronous transition.", "sections": [{"heading": "Command sequence", "text": "Require the exact record token for a command. A confirmed hold token returns its original order without another mutation; missing tokens are rejected. Otherwise reconcile pending expiry, locate the intended record, check preconditions, calculate the next state, and apply it synchronously. Never let an old reservation token operate on a newer pending hold."}, {"heading": "State transitions", "columns": ["From and action", "To", "Stock effect"], "rows": [["No pending hold; review 2 notebooks", "PENDING until now + 120 seconds", "On-hand 5; held 2; available 3"], ["PENDING; confirm before deadline", "CONSUMED plus COMPLETED order", "On-hand 3; held 0; available 3"], ["PENDING; cancel or reach deadline", "CANCELLED or EXPIRED", "On-hand unchanged; hold cleared"], ["COMPLETED order; full return", "RETURNED plus refund", "Add that order's quantity to on-hand"], ["RETURNED order; repeat return", "Same RETURNED order", "No additional stock effect"]]}, {"heading": "Calculation and invariant", "text": "For two notebooks, 2 × 1200 = 2400 cents. On-hand stock plus the quantity in completed, unreturned orders equals initial stock for each product. Available equals on-hand minus its pending hold and must never be negative. A return can coexist with another pending review; clear neither that review nor its hold."}]}, {"id": "data-model", "title": "Data model and state dictionary", "stage": "design", "what": "Defines the fictional product, reservation, order, refund, and reservation-to-order links.", "why": "Preserves the evidence needed to distinguish a hold, sale, retry, and return.", "who": "The developer proposes fields; the analyst and tester check that rules remain representable.", "when": "Use before command implementation and whenever a new state or retention rule is proposed.", "where": "Keep beside the API contract, privacy register, and stock-invariant review.", "which": "Separate mutable product on-hand stock from immutable purchase facts and current record status.", "how": "Give records stable local identifiers and derive available stock from authoritative state.", "sections": [{"heading": "Record relationships", "text": "A reservation refers to one product and quantity and snapshots its unit price and total. A consumed hold token links to exactly one order. Each order can link to at most one full simulated refund. Multiple orders may exist, but only one reservation is PENDING. These links make confirmation and return replays retrieve existing results."}, {"heading": "Proposed fields", "columns": ["Record", "Key fields", "Constraint"], "rows": [["Product", "id, label, unitCents, onHand", "NOTEBOOK 1200/5; BOTTLE 2000/2 initially"], ["Reservation", "id, productId, quantity, unitCents, totalCents, expiresAt, status", "One product; one PENDING record"], ["Order", "id, reservationId, productId, quantity, totalCents, status", "Unique reservationId; COMPLETED or RETURNED"], ["Refund", "id, orderId, amountCents, simulated", "Unique orderId; amount equals original total"]]}, {"heading": "History and restart", "text": "Retain terminal reservations during the instance so stale IDs receive meaningful responses. A returned order retains its original amount and quantity; its status and refund link explain the reversal. Reset clears all records and restores initial on-hand stock. None of this history is durable across a restarted demo."}]}, {"id": "api", "title": "Command and response contract", "stage": "design", "what": "Defines local commands and their results without claiming that a network API is implemented.", "why": "Allows the UI and test harness to use the same authoritative shopping behaviour.", "who": "The developer proposes the contract; UI work and testing depend on its stable meanings.", "when": "Use before connecting controls and whenever retry or error semantics change.", "where": "Keep with the detailed design and the interface failure contract.", "which": "Use local function calls now; an HTTP interface would be a separate future design.", "how": "Specify identifiers, intent, returned status, and whether repeating a request can mutate state.", "sections": [{"heading": "Contract convention", "text": "The proposed local commands are review, confirm, cancel, returnOrder, getState, and reset. Read and mutation commands reconcile pending expiry before exposing current availability. Commands identify the exact reservation or order; they do not act on whichever record happens to be selected on screen. Price and total are calculated from trusted model data."}, {"heading": "Local operations", "columns": ["Operation and input", "Success result", "Repeat behaviour"], "rows": [["review(productId, quantity)", "Hold token, fixed total, deadline", "Reject a new review while one is pending; never extend its deadline"], ["confirm(holdToken)", "Original order ID and recorded total", "Same confirmed token returns that order; missing token rejected"], ["cancel(reservationId)", "Final reservation status", "Terminal record causes no further release"], ["returnOrder(orderId)", "Order status and full refund receipt", "Same order returns its existing refund"], ["getState()", "Products, derived stock, current records", "Reconcile expiry; do not create orders"]]}, {"heading": "Proposed real API", "text": "A real server would authenticate the customer, validate ownership, bind idempotency keys to customer and intent, and commit inventory plus order changes durably. A request timeout would require result lookup or safe replay. Those controls are proposed extensions; the demo contains no HTTP endpoint or actual payment call."}]}, {"id": "ui", "title": "User interface specification", "stage": "design", "what": "Describes the proposed screens and messages for one-product purchases and per-order returns.", "why": "Makes the invisible stock commitments legible before the reader presses a confirmation control.", "who": "The designer proposes wording and flow; customer representatives and testers would review actual screens.", "when": "Use after core rules are agreed and before styling obscures important status differences.", "where": "Keep alongside the functional flow and accessibility review.", "which": "Display on-hand, held, and available as distinct concepts; never call a hold a completed purchase.", "how": "Use explicit action labels and show the selected product, quantity, total, and final status.", "sections": [{"heading": "Selection and review", "text": "The selection view offers Notebook at SGD 12.00 and Bottle at SGD 20.00 with one quantity field. Review displays a fixed single-product summary, total, remaining hold time, and Cancel review or Confirm simulated payment. While pending, changing selection requires cancellation. A visible notice explains that refresh resets the instance and no real money moves."}, {"heading": "State-specific communication", "columns": ["State", "Proposed message", "Action"], "rows": [["PENDING, 2 notebooks", "2 held; 3 available; total SGD 24.00", "Confirm simulated payment or Cancel review"], ["EXPIRED", "Your hold expired. No order was created.", "Review selection again"], ["COMPLETED", "Order recorded; simulated payment SGD 24.00", "Return entire order"], ["RETURNED", "Full simulated refund SGD 24.00 recorded", "View refund; no second restoration"]]}, {"heading": "Multiple orders", "text": "List each completed or returned order with its own product, quantity, amount, and ID. Returning order A must not imply that B was returned or clear a separate pending review. Preserve useful focus after state changes and announce important status once; do not force screen readers to hear a countdown every second."}]}, {"id": "adr", "title": "Architecture decision record", "stage": "design", "what": "Records the proposed choice of local memory, derived availability, and a single transition owner.", "why": "Explains why a deliberately simple implementation is suitable only for this educational boundary.", "who": "The developer proposes the decision; the product owner would accept its product limitations.", "when": "Create before implementation and supersede if persistence, shared stock, or real payments enter scope.", "where": "Keep in the design record with links to SHOP-TR-01 and future-service concerns.", "which": "Choose one synchronous model instead of independently mutating stock in UI event handlers.", "how": "Compare the alternatives, state consequences, and name the conditions that reopen the decision.", "sections": [{"heading": "Proposed decision ADR-SHOP-01", "text": "Use one in-memory model with explicit record states, integer cents, derived availability, and an injectable clock. This keeps transitions inspectable and supports deterministic checking of a 120-second deadline. The status is Proposed; no architecture review or approval is claimed."}, {"heading": "Alternatives considered", "columns": ["Option", "Benefit", "Consequence"], "rows": [["Independent UI counters", "Fast initial screen assembly", "Easy to double-decrement or restore the wrong stock"], ["Single local model", "Transparent transition logic and controlled tests", "No persistence or cross-tab authority"], ["Durable server service", "Can coordinate customers and preserve history", "Requires substantially more security and operational design"]]}, {"heading": "Consequences and reconsideration", "text": "Refresh starts over; local replay protection ends with the instance. Separate tabs cannot simulate reliable competition for the final bottle. If requirements add shared stock, login, real settlement, or durable orders, this decision must be replaced rather than stretched with browser storage and an unchanged security claim."}]}, {"id": "threat-model", "title": "Threat model and trust boundaries", "stage": "design", "what": "Examines where manipulated inputs and misleading expectations could undermine the demonstration or a future service.", "why": "Keeps browser-side validation and simulation labels from being mistaken for production security.", "who": "The developer and reviewer analyse the demo; specialists would assess any operational successor.", "when": "Review before accepting external inputs or adding identity, persistence, and payment integrations.", "where": "Link to the API contract, privacy register, and technical requirements.", "which": "Separate local correctness controls from server-side security controls that are only proposed.", "how": "Follow product, quantity, price, reservation ID, and order ID across each trust boundary.", "sections": [{"heading": "Demo trust statement", "text": "Anyone controlling a browser can inspect or alter a local demonstration. The goal is clear normal behaviour and robust handling of malformed inputs, not protection of real funds or identity. Do not add hidden secrets, live credentials, or real card fields. The authoritative local model should ignore supplied prices and reject invalid quantities and IDs."}, {"heading": "Threats and responses", "columns": ["Scenario", "Demo response", "Real-service extension"], "rows": [["Caller changes unit price", "Recalculate from fixed catalogue", "Server-owned catalogue and authorised changes"], ["Old reservation ID is replayed", "Check exact record and terminal state", "Customer ownership and durable replay protection"], ["Two customers claim the last bottle", "Not modelled across isolated tabs", "Atomic server transaction and conflict response"], ["Interface looks like real payment", "Persistent simulated labels; no card capture", "Separate regulated payment integration design"]]}, {"heading": "Review outcome", "text": "These are design considerations, not penetration-test findings or a security certification. An operational service would need to analyse account takeover, authorisation, abuse, sensitive data, payment-provider failures, and recovery. A successful local replay test does not establish protection against any of those threats."}], "refs": ["https://cheatsheetseries.owasp.org/cheatsheets/Transaction_Authorization_Cheat_Sheet.html"]}, {"id": "interface-failure-contract", "title": "Failure and retry contract", "stage": "design", "what": "Defines what the caller should receive when a shopping command cannot proceed or is repeated.", "why": "Prevents ambiguous errors from encouraging duplicate confirmation or a silent new reservation.", "who": "The developer specifies outcomes; the designer and tester verify useful recovery instructions.", "when": "Use before connecting actions and when investigating reports of uncertain outcomes.", "where": "Maintain alongside the API document so success and failure semantics stay aligned.", "which": "Distinguish validation, state conflict, expiry, and completed-command replay.", "how": "Return a stable reason, relevant final state, and a recovery action without mutating unrelated records.", "sections": [{"heading": "Error model", "text": "The proposed local result contains an outcome code, the relevant record ID when known, a human-readable explanation, and current derived stock. Failed validation creates no hold. A completed-command replay is a successful lookup, not an error and not another transaction. No failure automatically substitutes a new reservation for an old one."}, {"heading": "Expected outcomes", "columns": ["Code or outcome", "Condition", "Recovery"], "rows": [["INVALID_QUANTITY", "Zero, fraction, nonnumeric, or unsafe value", "Correct quantity; preserve on-hand stock"], ["INSUFFICIENT_STOCK", "Requested quantity exceeds available", "Choose a lower quantity; no hold created"], ["PENDING_REVIEW_EXISTS", "Any new review while another hold is pending", "Continue or cancel that review"], ["RESERVATION_EXPIRED", "First confirm at or beyond deadline", "Review again with a new request"], ["ORDER_REPLAY", "Repeated confirmed hold token", "Show existing order; do not purchase again"], ["MISSING_OR_UNKNOWN_TOKEN", "Confirmation has no valid hold token", "Use the intended current review; never infer a fresh purchase"]]}, {"heading": "Transport distinction", "text": "There is no network in the local command contract, so network-timeout handling is not implemented here. A real API must distinguish a rejected operation from an unknown outcome after transport loss. The caller would need status lookup or a replay-safe key; inventing a fresh key immediately could create a duplicate purchase."}]}, {"id": "concurrency-review", "title": "Concurrency and transaction review", "stage": "design", "what": "Examines competing transitions and the limits of the demo's single synchronous state owner.", "why": "Protects once-only stock movement and explains what changes when several clients share inventory.", "who": "The developer and tester review local ordering; a future backend specialist reviews durable transactions.", "when": "Use before adding asynchronous work inside commands or connecting multiple clients.", "where": "Keep with SHOP-TR-01, the detailed design, and the architecture decision.", "which": "Separate local event ordering from database isolation, durable uniqueness, and cross-process recovery.", "how": "Test opposing action orders and identify the invariant each possible winner must preserve.", "sections": [{"heading": "Local ordering", "text": "Apply each command synchronously without awaiting between checks and state update. Confirm before the deadline consumes the hold; a later expiry pass then has nothing pending to release. Expiry at the deadline wins over a first confirmation then. Replaying an already confirmed hold token retrieves its original order even when the displayed clock is later."}, {"heading": "Competing actions", "columns": ["Pair", "Required local outcome", "Proposed real-service protection"], "rows": [["Confirm versus expiry", "Exactly one terminal reservation transition", "Atomic conditional update using authoritative time"], ["Two confirmation requests", "At most one order for a reservation", "Unique reservation-to-order constraint and transaction"], ["Return versus return", "At most one refund and restoration per order", "Unique refund/order constraint and durable transaction"], ["Return A while review B is pending", "Restore A; retain B's hold", "Transactionally consistent on-hand and reservation state"]]}, {"heading": "Real-service proposal", "text": "Use a server transaction that validates stock and commits reservation or sale changes together, with a deliberate isolation and conflict-retry strategy. Persist idempotency results and enforce uniqueness in storage. This is a design direction, not an implemented guarantee; database isolation alone does not define ownership, payment recovery, or user-facing retry behaviour."}], "refs": ["https://www.postgresql.org/docs/current/transaction-iso.html"]}, {"id": "development-plan", "title": "Development work plan", "stage": "development", "what": "Orders implementation work around exact arithmetic and safe transitions before screen polish.", "why": "Reduces rework by exposing model errors while the interface is still simple.", "who": "The developer proposes increments; the tester identifies checks needed after each increment.", "when": "Use before implementation and update when a discovered defect changes dependencies.", "where": "Link work items to backlog IDs, SHOP requirements, and expected evidence.", "which": "Prefer a small coherent model over separate button handlers that each manipulate inventory.", "how": "Build and inspect one transition family at a time, then connect the complete journey.", "sections": [{"heading": "Implementation sequence", "text": "Start with catalogue constants, quantity validation, and integer-cent totals. Add record states and derived availability. Implement review and expiry reconciliation before confirmation; link each consumed hold token to its order and implement per-order full return. Expose a controlled clock and reset path for tests. Only then connect selection, review, and order-history controls."}, {"heading": "Proposed increments", "columns": ["Increment", "Deliverable", "Check before continuing"], "rows": [["Model foundation", "Products, totals, safe quantities", "Cases 01 through 07 expectations"], ["Reservation and purchase", "Hold, deadline, cancellation, confirmation", "Cases 08 through 15 expectations"], ["Per-order return", "One refund and restoration", "Cases 16 and 17 expectations"], ["Interface and packaging", "Operable controls and honest notices", "Case 18 plus readiness evidence"]]}, {"heading": "Completion discipline", "text": "A planned increment is not complete merely because code has been written. Capture actual checks and review results when implementation exists. If asynchronous simulation is introduced later, review command ordering again; inserting an await between stock validation and mutation changes assumptions behind the local design."}]}, {"id": "code-review", "title": "Code review record and checklist", "stage": "development", "what": "Provides a focused illustrative review agenda for the inventory, retry, and return implementation.", "why": "Directs attention to behaviour that visual inspection of the page cannot establish.", "who": "A second developer or qualified reviewer would inspect code; the tester supplies counterexamples.", "when": "Use before combining model changes and after a fix touches critical transitions.", "where": "Keep actual review findings with the code change and link the relevant SHOP rule.", "which": "This document proposes review checks; it contains no claim that repository code was reviewed.", "how": "Trace a command through validation, state mutation, and repeat execution using concrete quantities.", "sections": [{"heading": "Illustrative review scenario", "text": "Trace review of two notebooks from on-hand 5 to held 2 and available 3. On confirm, inspect that on-hand becomes 3 while held becomes 0. Then trace return of that order while a different bottle order remains completed. A review should verify which exact record changes, not merely that the screen looks plausible."}, {"heading": "Review checks", "columns": ["Check", "Fault it would catch", "Evidence to request"], "rows": [["Prices read from catalogue", "Caller lowers the total", "Calculation call path"], ["No await inside local transition", "State changes between check and commit", "Command implementation"], ["Reservation ID checked on cancel", "Stale cancel clears a newer hold", "Terminal-record branch"], ["Refund keyed to order", "Repeated return adds stock twice", "Return branch and case 16 result"], ["Existing hold-token order link checked", "Replay creates another order", "Case 14 result and recorded link"]]}, {"heading": "Decision status", "text": "Review outcome: not performed in this authored example. A future record should identify the change revision, reviewer, findings, corrections, and remaining concerns. Do not convert this checklist into a Passed result without inspecting the actual implementation and collecting the relevant evidence."}]}, {"id": "build-record", "title": "Illustrative build record", "stage": "development", "what": "Defines the evidence needed to identify a reproducible build of the Market Lane demo.", "why": "Prevents a release candidate from being identified only by a screenshot or a remembered browser tab.", "who": "The developer captures build facts; the release owner checks their completeness.", "when": "Create for each actual release candidate after the source revision and dependencies are known.", "where": "Store with deployment evidence and link the exact source revision and generated artifact.", "which": "Use verifiable identifiers for actual builds; the example below intentionally records no fabricated hash.", "how": "Record inputs, build command, outcome, artifact identity, and relevant limitations.", "sections": [{"heading": "Sample record status", "text": "Candidate label: ML-DEMO-CANDIDATE, illustrative only. Source revision: not recorded because no build was executed for this content document. Dependency lock identity: not recorded. Build outcome: not executed. These entries make the missing evidence visible instead of presenting plausible-looking identifiers as facts."}, {"heading": "Evidence fields", "columns": ["Field", "Current example value", "Required for an actual candidate"], "rows": [["Source", "Not recorded", "Exact revision and any uncommitted changes"], ["Dependencies", "Not recorded", "Runtime versions and lockfile identity"], ["Build", "Not executed", "Command, environment, result, and relevant output"], ["Artifact", "Not produced by this document", "Filename/location and integrity identifier"], ["Configuration", "Local simulated commerce intended", "Verify no live payment keys or endpoints"]]}, {"heading": "Reproduction and checks", "text": "An actual builder should use the repository's documented commands and capture their outputs. Verify that catalogue constants remain 1200 and 2000 cents and that the timeout remains 120 seconds. A successful build only shows packaging succeeded; it does not replace the transition, accessibility, or readiness checks."}]}, {"id": "dependency-register", "title": "Dependency and environment register", "stage": "development", "what": "Records the capabilities and third-party dependencies the proposed demo would rely on.", "why": "Exposes hidden network or persistence assumptions before they affect release claims.", "who": "The developer maintains the register; the release owner checks the delivered dependency set.", "when": "Use when selecting tools, updating packages, or reproducing a candidate build.", "where": "Keep with the build record and architecture decision.", "which": "Distinguish necessary runtime capabilities from optional libraries and absent payment integrations.", "how": "Record purpose, update responsibility, failure effect, and actual version when selected.", "sections": [{"heading": "Dependency position", "text": "The case requires browser scripting, a rendered interface, a clock abstraction, and local state. It does not require a payment SDK, customer identity provider, remote product API, or browser persistence. Framework and build-tool choices have not been specified here; their names and versions must be recorded from the actual project rather than invented."}, {"heading": "Register entries", "columns": ["Dependency or capability", "Use", "Failure or review concern"], "rows": [["Browser JavaScript runtime", "Execute local commands", "Unsupported behaviour prevents interaction"], ["Clock abstraction", "Calculate and test the hold deadline", "Wrong unit or clock source shifts expiry"], ["UI/build packages if chosen", "Render and package the demo", "Record versions and review updates"], ["Hosting environment if used", "Deliver static application files", "Check caching, headers, and possible request logs"], ["Payment provider", "Absent by scope", "Any future addition requires a new design"]]}, {"heading": "Update rule", "text": "Before upgrading a dependency, assess whether it affects input parsing, timers, focus management, or build output. Recheck relevant cases on the resulting candidate. A dependency inventory supports investigation and repeatability, but an entry in a register does not prove that a package is safe or that an update was tested."}]}, {"id": "ai-review", "title": "AI-assisted work review", "stage": "development", "what": "Describes how generated text or code would be checked against the shopping rules.", "why": "Prevents confident output from introducing real payment, extra scope, or incorrect stock arithmetic.", "who": "The human author remains responsible; a reviewer challenges generated assumptions and checks evidence.", "when": "Use whenever AI assists implementation, test drafting, documentation, or defect analysis.", "where": "Keep the reviewed output with the relevant requirement and actual code or document revision.", "which": "Use AI as a drafting aid; retain human decisions about scope and acceptance.", "how": "Compare generated claims with the stable rules, concrete examples, and executed evidence when available.", "sections": [{"heading": "Review scenario", "text": "An AI suggestion to subtract stock on both review and confirm is wrong for this case. Review only creates a hold; confirmation lowers on-hand and removes that hold. A generated checkout using a card form is also outside scope. Check these details explicitly instead of accepting familiar shopping patterns as requirements."}, {"heading": "Checks for generated output", "columns": ["Risk", "Question", "Required correction"], "rows": [["Invented implementation evidence", "Was this command actually run?", "Label plans and expected results accurately"], ["Scope drift", "Did it add multi-product baskets or login?", "Remove or propose as separate future scope"], ["Stock-model drift", "Does review change on-hand stock?", "Preserve on-hand and derive availability"], ["Weak retry logic", "Is disabling a button the only protection?", "Enforce model-level record and hold-token checks"], ["Unsafe data request", "Does it solicit real customer details?", "Keep only fictional local state"]]}, {"heading": "Acceptance of assistance", "text": "Preserve useful reasoning but verify every behavioural claim against SHOP requirements. Run relevant checks on actual changes and record what happened. Generated tests can repeat the same mistaken assumption as generated code, so use independent numerical examples and opposing transitions rather than treating agreement between two generated artifacts as proof."}]}, {"id": "test-plan", "title": "Test plan", "stage": "testing", "what": "Defines the proposed scope and method for checking the single-product shopping model.", "why": "Ensures stock timing and replay behaviour receive as much attention as successful confirmation.", "who": "The tester leads checking with developer support for the controlled clock and state inspection.", "when": "Use before execution and revise when requirements or implementation assumptions change.", "where": "Link to the 18-case specification, test-data fixtures, and actual execution records when available.", "which": "Combine direct model checks with interface checks; neither alone covers the whole experience.", "how": "Run each case from its stated fixture, capture actual outcomes, and investigate mismatches.", "sections": [{"heading": "Scope and approach", "text": "The plan covers the ten SHOP requirements using 18 specified cases. Direct model checks inspect on-hand, held, available, record counts, and identifiers. A controllable clock checks t=119, t=120, and t=121 without real waiting. Interface checks assess labels, focus, quantity feedback, and narrow layout. Real payments, shared inventory, and account login are outside scope."}, {"heading": "Coverage groups", "columns": ["Group", "Cases", "Main evidence"], "rows": [["Catalogue, selection, arithmetic", "SHOP-TC-01 through SHOP-TC-07", "Inputs, totals, and unchanged state on rejection"], ["Reservation, deadline, replay", "SHOP-TC-08 through SHOP-TC-15", "Clock values, statuses, IDs, and stock snapshots"], ["Return and interaction", "SHOP-TC-16 through SHOP-TC-18", "Per-order refunds, unaffected records, UI observations"]]}, {"heading": "Entry and exit proposal", "text": "Execution needs an identified build, a resettable instance, state inspection, and clock control. Proposed exit requires actual results for all cases, resolved release-blocking defects, and a documented accessibility/readiness decision. This is a plan only: no execution, pass rate, or approval is claimed."}]}, {"id": "test-cases", "title": "Eighteen specified test cases", "stage": "testing", "what": "Provides concrete inputs and expected results for the core rules and their boundaries.", "why": "Allows reviewers to challenge requirements before accepting the behaviour of an actual implementation.", "who": "The tester would execute the cases; developers use them to understand intended edge behaviour.", "when": "Use after a candidate exists and rerun affected cases following relevant changes.", "where": "Keep stable SHOP-TC identifiers linked from the RTM and any actual defect record.", "which": "Expected results describe the specification; actual outcomes must be recorded separately.", "how": "Reset between independent setups and record time, state, IDs, and counts before and after.", "sections": [{"heading": "Execution convention", "text": "All 18 cases below are authored specifications and have status Not executed. Unless a setup says otherwise, start with notebook on-hand 5 and bottle on-hand 2, no hold, and empty history. Controlled times are seconds from t=0. The words fresh instance mean an independent reset; cases must not inherit hidden state from one another."}, {"heading": "Specified cases", "columns": ["ID", "Purpose", "Requirement links", "Setup", "Actions", "Expected result"], "rows": [["SHOP-TC-01", "Initial state and reset", "SHOP-FR-01, SHOP-FR-08", "Fresh instance; then repeat after creating an order and reset.", "Inspect products and empty collections. Reset after a completed purchase.", "NOTEBOOK is 1200 cents, on-hand/available 5; BOTTLE is 2000 cents, on-hand/available 2. No selection, hold, order, refund, or retry history remains after reset."], ["SHOP-TC-02", "Exact total and purchase", "SHOP-FR-01, SHOP-FR-03, SHOP-FR-04, SHOP-FR-05, SHOP-TR-01", "Fresh instance at t=0.", "Select 2 notebooks; submit review including an untrusted total of 1 cent; confirm before deadline.", "Model total is 2400 cents. Review: notebook on-hand 5, held 2, available 3. Confirm: on-hand 3, held 0, available 3, exactly one SGD 24.00 order; no real payment."], ["SHOP-TC-03", "Smallest valid quantity", "SHOP-FR-02", "Fresh instance.", "Select Notebook with quantity 1 and review.", "Accept one unit: SGD 12.00; notebook on-hand 5, held 1, available 4. No order before confirmation."], ["SHOP-TC-04", "Available-stock upper boundary", "SHOP-FR-02, SHOP-FR-03", "Independent fresh instances for each subcase.", "Review 5 notebooks in one instance and 2 bottles in another.", "Notebook total SGD 60.00 with on-hand 5, held 5, available 0. Bottle total SGD 40.00 with on-hand 2, held 2, available 0. Both exact-stock requests succeed."], ["SHOP-TC-05", "Invalid quantity classes", "SHOP-FR-02, SHOP-TR-01", "Fresh instance for each value.", "Attempt review with blank, 0, -1, 1.5, text abc, Infinity, and 9007199254740992.", "Reject each value with a quantity error. No hold, order, or stock mutation. A parser must not silently turn a fraction into a whole quantity."], ["SHOP-TC-06", "Missing or unknown product", "SHOP-FR-02", "Fresh instance for each subcase.", "Review with no selection, then with product ID PEN and quantity 1.", "Reject both; create no reservation. Stock remains notebook 5 and bottle 2. Do not default silently to another product."], ["SHOP-TC-07", "Insufficient and sold-out stock", "SHOP-FR-04, SHOP-TR-01", "Fresh instance, then a separate instance after completing an order for both bottles.", "Request 6 notebooks in the first instance. Request 1 bottle in the sold-out instance.", "First attempt creates no hold and leaves notebook on-hand 5. Second reports available 0 and leaves bottle on-hand 0. No new order or partial state change."], ["SHOP-TC-08", "Only one pending review", "SHOP-FR-04", "Hold 2 notebooks at t=0 as reservation A.", "At t=10, try a new review for 1 bottle.", "Reject the new review. A still expires at t=120; notebook on-hand 5, held 2, available 3; bottle stock remains 2."], ["SHOP-TC-09", "Repeated review cannot extend or alter the hold", "SHOP-FR-04, SHOP-TR-01", "Hold 2 notebooks at t=0 as reservation A.", "At t=30 try another review for 2 notebooks, then try quantity 3 without cancelling A.", "Reject both new reviews. A retains its original token, quantity 2, total SGD 24.00, and deadline t=120. On-hand stays 5, held stays 2, available stays 3."], ["SHOP-TC-10", "Cancel once and protect a new hold", "SHOP-FR-06", "Hold 2 notebooks as reservation A.", "Cancel A twice, then attempt confirm A. Create a new bottle hold B and cancel A again.", "A stays CANCELLED; no order is created. Notebook on-hand/available returns to 5. The stale cancellation leaves B pending with bottle on-hand 2, held 1, available 1."], ["SHOP-TC-11", "Expiry at the exact deadline", "SHOP-FR-06, SHOP-TR-01", "Review 2 notebooks at t=0.", "Read state at t=119, then at t=120 and again at t=121. Repeat expiry reconciliation.", "At 119: held 2, available 3. At 120: reservation EXPIRED, on-hand remains 5, held 0, available 5. Later reconciliation causes no further increase."], ["SHOP-TC-12", "Last valid pre-deadline confirmation", "SHOP-FR-05", "Review 1 bottle at t=0.", "First confirm at t=119; read state at t=121.", "Exactly one SGD 20.00 completed order. Bottle on-hand/available 1, held 0. Later expiry processing cannot restore stock from the consumed reservation."], ["SHOP-TC-13", "First confirmation at or after expiry", "SHOP-FR-05, SHOP-FR-06", "Independent fresh instances, each reviewing 1 bottle at t=0.", "First confirm at exactly t=120 in one instance and t=121 in the other.", "Reject both and mark reservations EXPIRED. Bottle on-hand/available 2, held 0. No order or payment simulation is recorded."], ["SHOP-TC-14", "Confirmation replay after success and return", "SHOP-FR-05, SHOP-FR-07, SHOP-TR-01", "Complete 2 notebooks before expiry using hold token A.", "Confirm A again after its old deadline; return its order; confirm A again.", "Every replay identifies the same original order; after return its status remains RETURNED. There is one original order and one SGD 24.00 refund. Notebook on-hand remains 5 after return; no fresh sale."], ["SHOP-TC-15", "Missing or unknown confirmation token", "SHOP-FR-05", "Fresh instance; also repeat after a 1-bottle order has completed.", "Attempt confirm without a token, with an unknown token, and without an active review or a known completed token.", "Reject each attempt without creating an order or hold. Fresh stock remains 5/2. In the completed-order subcase there is still only one order and bottle on-hand/available remains 1."], ["SHOP-TC-16", "Per-order return once with other live work", "SHOP-FR-07, SHOP-TR-01", "Complete A for 2 notebooks and B for 1 bottle. Create pending review C for 1 notebook.", "Return A fully and repeat the return.", "One SGD 24.00 refund for A. Notebook on-hand 5, held by C 1, available 4. A is RETURNED, B remains COMPLETED, bottle on-hand 1, C remains PENDING. Repeating return changes nothing."], ["SHOP-TC-17", "Invalid and partial returns", "SHOP-FR-07", "Independent setups: a pending review, an unknown order ID, and a completed order for 2 notebooks.", "Attempt to return the pending record, unknown ID, and only 1 unit of the 2-unit order.", "Reject all invalid requests. Create no refund or stock change. The completed 2-unit order remains COMPLETED until a valid full return."], ["SHOP-TC-18", "Operable and honest interface", "SHOP-FR-08, SHOP-QR-01", "Fresh demo at 320 CSS pixel width; keyboard navigation; assistive-technology checks as available.", "Select, trigger a quantity error, review, cancel, confirm a new review, and return. Inspect labels and timed-state updates.", "Controls are keyboard reachable, errors associated, focus usable, and page has no horizontal scrolling. Payment/refund are explicitly simulated, no real credentials or card data requested, and expiry is visible. Record timing limitations; this case alone does not establish full conformance."]]}, {"heading": "Evidence discipline", "text": "For each execution, record the actual build, inputs, clock readings, relevant record IDs, on-hand/held/available values, result, and any discrepancy. Do not report a case as passed because its expected result is written here. Case 18 contains several interface checks; record individual observations and any unsupported assistive-technology conditions."}]}, {"id": "defect", "title": "Illustrative defect report", "stage": "testing", "what": "Shows a concrete duplicate-return fault and the evidence needed to investigate it.", "why": "Demonstrates why a plausible refund message cannot substitute for stock-invariant checking.", "who": "The tester would report the observation; the developer investigates and proposes a correction.", "when": "Use only if an actual implementation exhibits the described behaviour; this report is hypothetical.", "where": "Link a real occurrence to its revision, SHOP-FR-07, and SHOP-TC-16.", "which": "Separate the observed symptom from a suspected cause and from an unverified fix.", "how": "Reproduce from reset, compare exact stock values, and check unrelated orders remain unchanged.", "sections": [{"heading": "Example DEF-SHOP-01", "text": "Hypothetical symptom: returning the same two-notebook order twice produces notebook on-hand stock 7. Expected stock is 5. Reproduction: reset to 5, confirm 2 notebooks so on-hand is 3, return once to restore 5, then repeat the return. This authored report is not a claim that the current implementation has this defect."}, {"heading": "Triage detail", "columns": ["Field", "Illustrative entry", "Reason"], "rows": [["Impact", "Duplicate stock and potentially duplicate refund", "Violates SHOP-FR-07"], ["Priority", "Release-blocking if reproduced", "Core once-only reversal is incorrect"], ["Suspected cause", "Mutation occurs before checking RETURNED state", "Hypothesis requiring code inspection"], ["Expected correction", "Retrieve existing refund before any repeat mutation", "Protects stock and refund count"], ["Verification", "Case 16 plus return/replay cases 14 and 17", "Covers related transitions"]]}, {"heading": "Closure evidence", "text": "A real closure record should include reproduction on the faulty revision, the correction, executed results on the new revision, and any related regression evidence. Changing the return button to disabled is insufficient if the model can still be called twice. The example remains unverified and open as a teaching record."}]}, {"id": "test-summary", "title": "Illustrative test summary", "stage": "testing", "what": "Shows how results and gaps should be reported without inventing execution evidence.", "why": "Distinguishes a complete test specification from demonstrated behaviour in a release candidate.", "who": "The tester prepares the summary; the product and release owners consider its implications.", "when": "Create after an actual run, updating it when defects are fixed or coverage changes.", "where": "Link each reported result to the build and execution records rather than this plan alone.", "which": "Use Not executed for the current authored dataset; do not infer Pass from expected results.", "how": "Count statuses, identify material gaps, and explain how they affect the proposed release decision.", "sections": [{"heading": "Current evidence position", "text": "Eighteen cases have been specified, but this document records no actual execution. Build identity is not recorded; environment, run date, tester, and observed results are not supplied. Consequently there is no pass rate and no evidence-based release recommendation. The hypothetical duplicate-return defect is not an observed failure count."}, {"heading": "Case accounting", "columns": ["Group", "Specified", "Executed status"], "rows": [["Catalogue and quantities: cases 01–07", "7", "Not executed"], ["Reservation and confirmation: cases 08–15", "8", "Not executed"], ["Returns and interface: cases 16–18", "3", "Not executed"], ["Total", "18", "0 executed; 18 not executed"]]}, {"heading": "Next evidence needed", "text": "Run the model and interface checks against an identified candidate, record actual outcomes, and investigate discrepancies. Summarise timing and accessibility limitations separately from arithmetic correctness. A future release recommendation should state which risks remain and who decided to accept them; a clean table format cannot suppl
