const GUIDE={"concepts": [{"id": "software-in-daily-life", "stage": "foundations", "title": "Software in everyday life", "explanation": "Software directs computers to perform tasks, often without making itself visible. A lift controller, a booking page, and a supermarket checkout all depend on instructions running somewhere. The screen is only one possible doorway into that work. Looking for the task, the information used, and the resulting action helps you recognise software even when there is no obvious app icon.", "ask": "Which ordinary activity would become difficult if its hidden software stopped working?", "sources": ["https://www.ibm.com/think/topics/software-development"]}, {"id": "software-ingredients", "stage": "foundations", "title": "The ingredients behind an app", "explanation": "An app combines instructions, information, and settings with supporting technology. Its instructions describe behaviour, its information records things that matter, and its settings select choices such as language or limits. People also need explanations for operating and maintaining it. Harbour Bank may display only two account cards, yet those cards depend on values, formatting rules, navigation, and a place for the program to run.", "ask": "What would be missing if a team delivered only the visible screens?", "sources": ["https://www.ibm.com/think/topics/software-development", "https://www.ibm.com/think/topics/configuration-management"]}, {"id": "misunderstanding-user-needs", "stage": "foundations", "title": "When the team solves the wrong need", "explanation": "A team can produce working software and still disappoint its users. Perhaps staff request a report because they cannot find one urgent item; building a larger report may increase their searching. Misunderstanding often begins when a suggestion is treated as the underlying need. Watching the task and asking what happens next can reveal a smaller, more useful change before development effort accumulates.", "ask": "What evidence would show whether a requested feature addresses the user's actual difficulty?", "sources": ["https://www.gov.uk/service-manual/user-research/start-by-learning-user-needs"]}, {"id": "problem-before-solution", "stage": "foundations", "title": "Describe the problem before choosing a solution", "explanation": "A useful problem statement names who is affected, what they are trying to achieve, and what currently gets in the way. It also gives the team a way to recognise improvement. For Harbour Bank, the learning problem might be understanding how a transfer changes two balances. Starting there helps the team choose suitable interactions without assuming that more screens or more features automatically help.", "ask": "How would you describe a frustrating task without naming a particular app or feature?", "sources": ["https://www.gov.uk/service-manual/agile-delivery/how-the-discovery-phase-works"]}, {"id": "programs-data-configuration", "stage": "foundations", "title": "Programs, data, and configuration", "explanation": "Programs supply instructions, data supplies the values being handled, and configuration supplies adjustable operating choices. In Harbour Bank, subtracting an amount follows program instructions, the current balance is data, and a permitted transfer limit can be configuration. These distinctions help locate a problem. A wrong balance, a mistaken calculation, and an incorrect limit may look similar on screen but require different corrections.", "ask": "If the app rejects every amount above SGD 100, which ingredient would you investigate first?", "sources": ["https://www.ibm.com/think/topics/configuration-management"]}, {"id": "data-to-information", "stage": "foundations", "title": "Turning data into useful information", "explanation": "A stored number becomes useful when people know its meaning and context. The value 250000 alone says little; interpreted as integer cents, it represents SGD 2,500.00 in Harbour Bank's current account. Software can organise, calculate, and label data so someone can make a decision. Incorrect units, stale values, or missing context can make a polished display misleading even when its arithmetic is correct.", "ask": "What labels and context would you need before trusting a number on a dashboard?", "sources": ["https://aws.amazon.com/what-is/data-analytics/"]}, {"id": "input-process-output-feedback", "stage": "foundations", "title": "Follow a request through the system", "explanation": "An input gives the system something to work with, processing applies rules, and an output communicates or records the result. Feedback helps a person decide what to do next. Entering a transfer amount starts this sequence in Harbour Bank. Validation can produce an explanation instead of a transfer; a review screen then lets the user check the proposed change before confirmation updates the balances.", "ask": "What feedback should appear when the input is valid but the user has not confirmed yet?", "sources": ["https://aws.amazon.com/what-is/data-analytics/", "https://www.nasa.gov/reference/4-2-technical-requirements-definition/"]}, {"id": "people-process-system", "stage": "foundations", "title": "A service includes people and procedures", "explanation": "A digital service extends beyond its software. People decide policy, answer questions, handle exceptions, and keep the service operating. Procedures describe how those actions fit together. A technically successful submission can still leave someone stranded if nobody handles the next step. When examining a service, follow the user's whole journey and identify both automated actions and human responsibilities, including the support needed when something goes wrong.", "ask": "Which person or process must respond after the software completes its part?", "sources": ["https://www.gov.uk/service-manual/service-standard/point-2-solve-a-whole-problem"]}, {"id": "software-dependence", "stage": "foundations", "title": "Understand what depends on software", "explanation": "Dependence grows when several activities rely on the same digital service. If one component fails, people may lose access to information, approvals, or their next task. Understanding this dependence means asking who is affected, how quickly the impact grows, and what recovery is possible. The right level of reliability follows the consequences of failure, rather than the apparent size or visual simplicity of the application.", "ask": "If this service became unavailable for an hour, who would be affected first?", "sources": ["https://docs.aws.amazon.com/wellarchitected/2024-06-27/framework/reliability.html"]}, {"id": "physical-digital-maintenance", "stage": "foundations", "title": "Why software still needs maintenance", "explanation": "A chair wears down through physical use; program instructions do not wear down in that way. Software still needs attention because defects emerge, surrounding technology changes, and people's expectations develop. The same program can behave differently when its browser, data, or connected service changes. Maintenance therefore includes investigation, adaptation, and improvement, alongside fixing faults. Keeping software useful requires ongoing ownership after its initial delivery.", "ask": "What change outside an application could make yesterday's working version unsuitable today?", "sources": ["https://aws.amazon.com/what-is/application-lifecycle-management/"]}, {"id": "automation-benefits-limits", "stage": "foundations", "title": "What automation can and cannot do", "explanation": "Automation can repeat a defined task quickly and consistently, reducing repeated typing and routine handling. Its usefulness depends on whether the task and rules are understood. A mistaken rule can be repeated just as efficiently as a correct one. Good automation design makes exceptions visible, provides useful feedback, and leaves people with a clear way to investigate situations that the normal procedure does not cover.", "ask": "Which part of a familiar task is predictable enough to automate, and which needs judgement?", "sources": ["https://www.ibm.com/think/topics/automation"]}, {"id": "applications-and-platforms", "stage": "foundations", "title": "Business applications and enabling platforms", "explanation": "Business applications help people complete recognisable tasks, such as arranging a delivery or recording an expense. Enabling platforms provide common capabilities those applications need, including computing, storage, databases, and communication. Users may never see these supporting layers directly. Distinguishing them helps teams explain responsibilities and costs: improving a business workflow and expanding the capacity beneath it solve different needs, even when both changes contribute to the same service.", "ask": "Which capabilities could several different business applications share?", "sources": ["https://docs.aws.amazon.com/whitepapers/latest/aws-overview/what-is-cloud-computing.html"]}, {"id": "application-domains", "stage": "foundations", "title": "Different domains ask different things of software", "explanation": "Software serves many settings, including entertainment, administration, transport, healthcare, and industrial equipment. Each setting brings its own language, users, operating conditions, and consequences when something fails. A playful animation and a medical device should not be judged by identical priorities. Domain knowledge helps the team decide what correctness means, which risks deserve attention, and whose expertise is needed when making or reviewing design decisions.", "ask": "How would your priorities change when moving from a music app to a traffic control system?", "sources": ["https://www.ibm.com/think/topics/software-development"]}, {"id": "developer-collaboration", "stage": "foundations", "title": "How developers work together", "explanation": "Developers divide work while keeping a shared understanding of how the parts connect. They use version history to track changes and reviews to discuss proposed updates before combining them. These practices support learning as well as fault detection. Collaboration also means agreeing names, interfaces, and responsibilities so that one person's change does not surprise everyone else. Useful explanations make future maintenance easier for colleagues who were absent from the original discussion.", "ask": "What information would another developer need to understand why you changed a calculation?", "sources": ["https://docs.github.com/en/enterprise-server%403.19/pull-requests/collaborating-with-pull-requests/getting-started/about-collaborative-development-models"]}, {"id": "uncertainty-and-tradeoffs", "stage": "foundations", "title": "Make uncertainty and tradeoffs visible", "explanation": "Software decisions often involve incomplete knowledge and competing aims. A quicker delivery may cover fewer situations; an extra capability may increase complexity and maintenance effort. Teams improve decisions by naming the uncertainty, comparing realistic options, and recording why a choice fits the current goal. Small experiments can answer expensive questions early. A decision can be reasonable today and still deserve revision when better evidence becomes available.", "ask": "Which unknown would most change your decision, and how could you investigate it cheaply?", "sources": ["https://www.nasa.gov/reference/6-8-decision-analysis/"]}, {"id": "practical-engineering-principles", "stage": "foundations", "title": "Engineering habits that help", "explanation": "Useful engineering habits include simplifying a problem, separating responsibilities, checking assumptions, and making changes easy to inspect. These habits are tools, not a checklist that guarantees success. In Harbour Bank, keeping money calculations separate from screen formatting makes both easier to understand. A good principle earns its place by helping the team explain a decision, detect mistakes, or change the software with less effort.", "ask": "Which responsibility could you separate to make a small application easier to reason about?", "sources": ["https://ieeecs-media.computer.org/media/education/swebok/swebok-v4.pdf"]}, {"id": "current-future-processes", "stage": "foundations", "title": "Compare the current and future process", "explanation": "The current process shows what people actually do today, including workarounds and repeated checks. The future process describes the intended way of working after a change. Comparing them reveals which steps disappear, which responsibilities move, and which new problems might arise. Draw both using ordinary actions and decisions before discussing technology. The aim is to improve the outcome, rather than simply turning every existing step into a digital form.", "ask": "Which current step exists only because of a limitation that the future process could remove?", "sources": ["https://www.gov.uk/service-manual/agile-delivery/how-the-discovery-phase-works"]}, {"id": "delivery-workflow", "stage": "foundations", "title": "How an idea becomes a delivered change", "explanation": "A delivery workflow makes the route from an idea to a usable change visible. A request is clarified, prioritised, designed, implemented, checked, and prepared for release. Feedback can send it back for further work at any point. Teams need clear evidence of readiness between activities, such as agreed behaviour or passing checks. A workflow is useful when it exposes waiting, uncertainty, and ownership, rather than merely giving tasks different status labels.", "ask": "What evidence should accompany a change before someone else accepts responsibility for the next step?", "sources": ["https://docs.aws.amazon.com/wellarchitected/latest/devops-guidance/development-lifecycle.html"]}, {"id": "iterative-feedback", "stage": "foundations", "title": "Improve through short feedback cycles", "explanation": "Iteration means returning to work with something newly learned. A team might sketch an interaction, observe someone trying it, and revise the design before writing much code. Later, tests and operational observations provide further feedback. Each cycle should answer a meaningful question. Simply repeating meetings or producing more versions does not create learning unless the team examines the evidence and lets it influence what happens next.", "ask": "What could you show users early to discover whether your proposed interaction makes sense?", "sources": ["https://www.gov.uk/service-manual/agile-delivery/agile-government-services-introduction"]}, {"id": "lifecycle-duration", "stage": "foundations", "title": "Software lives beyond its launch", "explanation": "An application's life can extend from its first proposal through years of operation to replacement or retirement. Initial development is only part of that time. Teams may add capabilities, repair problems, update dependencies, and move information to a successor. Thinking about the full lifespan changes early choices: readable decisions, manageable data, and clear ownership help the people who will inherit the service long after its first release.", "ask": "What will a future team need when it eventually replaces this application?", "sources": ["https://aws.amazon.com/what-is/application-lifecycle-management/"]}, {"id": "lifecycle-coordination", "stage": "foundations", "title": "Why coordinate the lifecycle", "explanation": "Lifecycle coordination connects decisions that would otherwise drift apart. A new requirement affects design, implementation, checking, release preparation, and support. If those connections are missed, one group may prepare for behaviour that another group has already changed. A shared lifecycle view helps people see dependencies, arrange reviews, and plan resources. Its value comes from making the work coherent while preserving room to respond to what the team learns.", "ask": "Who should hear about a changed requirement before it reaches users?", "sources": ["https://aws.amazon.com/what-is/sdlc/"]}, {"id": "activities-and-roles", "stage": "foundations", "title": "Activities are different from job titles", "explanation": "An activity describes work that must happen; a role describes responsibility or expertise. Understanding users, checking behaviour, and preparing a release are activities that may involve several people. In a small team, one person may contribute to many of them. In a larger team, specialists may lead particular areas. Quality improves when responsibilities are clear without assuming that only one job title is allowed to ask useful questions.", "ask": "Which activity needs input from several roles even if one person remains accountable?", "sources": ["https://www.gov.uk/service-manual/the-team"]}, {"id": "six-common-activity-groups", "stage": "foundations", "title": "Six useful groups of lifecycle work", "explanation": "One useful overview groups software work into understanding requirements, designing a solution, implementing it, checking it, delivering it, and maintaining it. Planning and coordination connect all six. These groups describe recurring concerns, not sealed compartments. Checking can reveal a requirement problem, and maintenance can start a new design discussion. Teams use different labels and boundaries, so always clarify the actual work instead of relying on a familiar phase name.", "ask": "Which activity groups might be involved when a released feature confuses its users?", "sources": ["https://aws.amazon.com/what-is/sdlc/"]}, {"id": "lifecycle-and-methodology", "stage": "foundations", "title": "Lifecycle and methodology", "explanation": "A lifecycle describes the broad work involved across software's existence. A methodology or delivery approach describes how a team organises that work, including sequencing, collaboration, and decision practices. The same need for design and checking remains whether a team plans large stages or delivers small increments. Understanding the distinction avoids a common mistake: assuming that choosing an approach removes the need to perform essential engineering activities.", "ask": "How could two teams organise the same lifecycle activities differently while pursuing the same outcome?", "sources": ["https://ieeecs-media.computer.org/media/education/swebok/swebok-v4.pdf"]}, {"id": "proportionate-governance", "stage": "foundations", "title": "Use governance that fits the consequences", "explanation": "Governance establishes who can make decisions, what evidence they need, and how unresolved concerns receive attention. The amount of oversight should match the potential consequences, complexity, and obligations of the work. A public demonstration and an operational banking service need very different assurance. Useful governance helps decisions happen at the right time and keeps responsibilities visible; collecting documents without reviewing their meaning adds little confidence.", "ask": "What additional evidence would you require before turning an educational demonstration into a real service?", "sources": ["https://www.gov.uk/service-manual/agile-delivery/governance-principles-for-agile-service-delivery", "https://owasp.org/projects/samm"]}, {"id": "software-misconceptions", "stage": "foundations", "title": "Common assumptions worth questioning", "explanation": "Software is not finished forever when it launches, and adding people does not automatically remove coordination problems. A working screen does not prove that every rule, data change, and exception is correct. Likewise, an inexpensive copy of a program does not make its support free. Recognising these assumptions helps nontechnical participants ask better questions about ownership, evidence, ongoing costs, and the difference between a convincing demonstration and dependable operation.", "ask": "Which assumption about software has influenced a decision you have seen at work?", "sources": ["https://aws.amazon.com/what-is/application-lifecycle-management/"]}, {"id": "software-supply-chain", "stage": "foundations", "title": "Follow the software supply chain", "explanation": "Software usually combines work from many places: code written by the team, reusable packages, build tools, and services operated by suppliers. Together these form its supply chain. A small change in one ingredient can affect the finished product. For Harbour Bank, even a package that formats currency deserves an owner and a known version. A real service would also track where release components came from and how they were checked. Understanding these connections helps business colleagues ask useful questions about support, security, and continuity.", "ask": "If a supplier stopped maintaining one important component, who would know and what would happen next?", "sources": ["https://csrc.nist.gov/Projects/ssdf"]}, {"id": "define-product-outcomes", "stage": "foundations", "title": "Define the change users should experience", "explanation": "A product outcome describes an improvement in someone's experience or ability to complete a task. For Harbour Bank, an outcome might be that people can move money between their own accounts with confidence about the amount and destination. The team can investigate this through observed task completion and questions about what users understood. Agree the outcome before choosing features, then revisit it after changes. A polished screen is useful evidence of design work, but evidence of a better user experience comes from people using it.", "ask": "What would a user do more confidently after your change, and how would you find out?", "sources": ["https://www.gov.uk/service-manual/service-standard/point-10-define-success-publish-performance-data"]}, {"id": "value-versus-output", "stage": "foundations", "title": "Separate work completed from value created", "explanation": "Outputs are things a team produces, such as screens, reports, or completed tasks. Value is the benefit those things create after considering their costs and consequences. Adding three transfer screens increases output, yet it may make a simple journey harder. A clearer review step could create more value with less visible work. Compare proposed changes against the user outcome, the effort to build them, and the effort to keep them working. Sometimes simplifying a process or removing an unnecessary feature provides the strongest benefit.", "ask": "Which completed item on a project could disappear without making users' lives worse?", "sources": ["https://www.gov.uk/service-manual/service-standard/point-10-define-success-publish-performance-data"]}, {"id": "read-data-with-context", "stage": "foundations", "title": "Read numbers with their context", "explanation": "Data literacy means asking what a number represents before drawing a conclusion from it. A transfer completion rate needs a definition of an attempt, a time period, and an explanation of excluded cases. Ten successful attempts from a small demonstration cannot establish how a real banking service performs. For Harbour Bank, distinguish starting balances, entered amounts, and completed changes. Also ask whether repeated attempts come from the same person. Definitions, missing records, and sample size can change the meaning of a result more than its attractive chart suggests.", "ask": "What missing definition could make a reported 95 percent success rate misleading?", "sources": ["https://www.gov.uk/government/publications/the-government-data-quality-framework/the-government-data-quality-framework-guidance"]}, {"id": "ethical-product-tradeoffs", "stage": "foundations", "title": "Make ethical tradeoffs visible", "explanation": "A technically correct feature can still cause avoidable harm. Making a transfer journey faster may save time, while removing opportunities to notice an error may reduce user control. Ethical discussion asks who benefits, who carries the risk, and who has been left out of the decision. In Harbour Bank, the review before confirmation gives people a chance to inspect their choice. Explain the reason for that step and test whether it helps. Record difficult tradeoffs so later teams understand the people and consequences behind a design decision.", "ask": "Who might bear the downside of a feature that looks efficient to the project team?", "sources": ["https://www.acm.org/binaries/content/assets/about/acm-code-of-ethics-booklet.pdf"]}, {"id": "human-judgment-with-ai", "stage": "foundations", "title": "Keep judgment with accountable people", "explanation": "AI can propose explanations, alternatives, and draft work quickly. Its fluency does not establish that its assumptions fit your situation. A useful working habit is to separate the suggestion, the evidence supporting it, and the person responsible for accepting it. If AI says Harbour Bank should allow transfers to other people, compare that suggestion with the agreed restriction to a person's own accounts. Ask for uncertainty and counterexamples. Human review works best when reviewers have enough context, time, and authority to challenge the output.", "ask": "What evidence would you require before accepting an AI suggestion that changes a business rule?", "sources": ["https://airc.nist.gov/airmf-resources/airmf/appendices/app-c-ai-risk-management-and-human-ai-interaction/"]}, {"id": "agreeing-scope", "stage": "requirements", "title": "Agree what is inside the boundary", "explanation": "Scope sets a shared boundary around the intended outcome, users, capabilities, and exclusions. Harbour Bank covers a public demo login and transfers between one person's two fictional accounts. Payments to other people and real banking operations sit outside that boundary. Recording these limits makes estimates and reviews more useful. When someone proposes an addition, the team can discuss its value and consequences instead of silently assuming it was always included.", "ask": "Which tempting feature would you explicitly exclude from the first version, and why?", "sources": ["https://www.nasa.gov/reference/4-1-stakeholder-expectations-definition/"]}, {"id": "needs-and-solutions", "stage": "requirements", "title": "Separate the need from the proposed solution", "explanation": "A need describes an outcome someone must achieve; a solution is one possible way to enable it. Wanting confidence before a transfer is a need. A review screen is a proposed solution that can be assessed against that need. Keeping both visible encourages useful alternatives while preserving the purpose. It also prevents the team from mistaking a stakeholder's first suggestion for the only acceptable design.", "ask": "What underlying need could explain a request for an extra confirmation message?", "sources": ["https://www.gov.uk/service-manual/user-research/start-by-learning-user-needs"]}, {"id": "discovering-context", "stage": "requirements", "title": "Learn the setting around the request", "explanation": "Context explains where, when, and why a requirement matters. Investigate the user's task, existing information, access needs, operating environment, and the events before and after the interaction. A requirement that seems straightforward in a quiet office may be difficult on a small screen or with interrupted attention. Context gives the team a basis for choosing realistic examples and judging whether the proposed behaviour would actually help.", "ask": "What environmental or accessibility detail could change how someone completes this task?", "sources": ["https://www.gov.uk/service-manual/agile-delivery/how-the-discovery-phase-works"]}, {"id": "clarifying-assumptions", "stage": "requirements", "title": "Bring assumptions into the open", "explanation": "An assumption fills a gap in what the team knows. It can help work move forward, but it should not quietly become a confirmed requirement. Record the assumption, its effect if wrong, and how it will be checked. For Harbour Bank, agree explicitly that amounts use SGD and no more than two decimal places. Small unstated interpretations can otherwise produce different interfaces, calculations, and tests.", "ask": "Which apparently obvious statement would you ask another stakeholder to confirm?", "sources": ["https://www.nasa.gov/reference/appendix-c-how-to-write-a-good-requirement/"]}, {"id": "interviews-observation-workshops", "stage": "requirements", "title": "Choose a discovery method for the question", "explanation": "Interviews help uncover motivations and remembered experiences. Observation reveals actual steps, interruptions, and workarounds that people may forget to mention. Workshops bring several perspectives together to compare a shared process or settle terminology. These methods complement each other. Choose participants deliberately, ask for concrete examples, and distinguish observed facts from opinions. A workshop agreement can still need checking with people who could not attend.", "ask": "Which question would benefit most from watching someone work rather than asking them to describe it?", "sources": ["https://www.gov.uk/service-manual/user-research/using-in-depth-interviews"]}, {"id": "observable-requirements", "stage": "requirements", "title": "Write requirements people can check", "explanation": "A useful requirement describes observable behaviour under stated conditions. Replace a request such as 'handle transfers properly' with a specific rule: Harbour Bank accepts an amount from SGD 0.01 to SGD 10,000.00, provided it does not exceed the selected source balance. Separate related rules when they can fail independently. A reviewer should be able to imagine the evidence that would demonstrate whether each statement is satisfied.", "ask": "What observation would prove that your proposed requirement has been met?", "sources": ["https://www.nasa.gov/reference/appendix-c-how-to-write-a-good-requirement/"]}, {"id": "unambiguous-reviewable-requirements", "stage": "requirements", "title": "Make one meaning easy to agree", "explanation": "Words such as quick, simple, and appropriate leave room for different interpretations. Reviewable requirements replace vague terms with agreed conditions, units, limits, and outcomes. Define important terms once and use them consistently. For Harbour Bank, 'own accounts' means the demo user's current and savings accounts. Reading a requirement aloud with someone from another role often exposes missing conditions that seemed obvious to its author.", "ask": "Which word in a requirement could two reasonable readers interpret differently?", "sources": ["https://www.nasa.gov/reference/appendix-c-how-to-write-a-good-requirement/"]}, {"id": "elicitation-and-analysis", "stage": "requirements", "title": "Discover needs, then examine what they imply", "explanation": "Elicitation brings possible requirements into view through conversations, observation, documents, and examples. Analysis examines what those findings mean together. The team looks for missing cases, contradictions, dependencies, feasibility concerns, and priorities. These activities repeat as understanding improves. Hearing 'let me move money' is a starting point; analysis asks which accounts, which amounts, what happens before confirmation, and what the user sees if the action cannot proceed.", "ask": "What additional questions turn a broad request into a coherent set of rules?", "sources": ["https://www.nasa.gov/reference/4-2-technical-requirements-definition/"]}, {"id": "validation-and-change", "stage": "requirements", "title": "Validate requirements and manage change", "explanation": "Requirements validation asks whether the agreed description captures the intended need and is understandable, feasible, and checkable. Reviews and prototypes can reveal gaps before implementation. Once agreement exists, change remains possible, but its effects should be considered and communicated. Record the reason, affected requirements, decision, and updated evidence. Otherwise, an innocent wording change can leave the design, tests, and support guidance describing different versions of the intended service.", "ask": "Who needs to review a changed rule, and which related work must be updated?", "sources": ["https://www.nasa.gov/reference/6-2-requirements-management/"]}, {"id": "stakeholder-identification", "stage": "requirements", "title": "Find everyone with a relevant stake", "explanation": "Stakeholders include more than the person funding the work. Users, service staff, operators, maintainers, and people affected by the outcome can each reveal different needs. Identify their interest, knowledge, influence, and responsibility before deciding how to involve them. For Harbour Bank, a learner, a content author, and a developer may notice different problems. Looking beyond the most available voice reduces the chance that important perspectives remain invisible.", "ask": "Whose work or experience changes because of this software even if they never operate it directly?", "sources": ["https://www.nasa.gov/reference/4-1-stakeholder-expectations-definition/"]}, {"id": "resolving-requirement-conflicts", "stage": "requirements", "title": "Resolve competing requirements explicitly", "explanation": "Requirements can conflict because stakeholders value different outcomes or use the same words differently. First clarify the underlying concern, then compare options against shared goals and constraints. Someone may want fewer transfer steps while someone else wants a deliberate check before balances change. A review screen with clear confirmation may address both concerns. Record the chosen tradeoff and who owns the decision so the disagreement does not resurface as inconsistent implementation.", "ask": "Which shared goal could help two stakeholders compare their competing requests?", "sources": ["https://www.nasa.gov/reference/6-8-decision-analysis/"]}, {"id": "requirement-categories", "stage": "requirements", "title": "Behaviour, quality, and constraints", "explanation": "Functional requirements describe what the software does. Quality requirements describe how well it must work under stated conditions, such as its responsiveness or accessibility. Constraints restrict possible solutions, for example a required operating environment or data representation. In Harbour Bank, reviewing a transfer is behaviour, a measurable response target would describe quality, and using integer cents constrains money representation. Categories help reviewers notice gaps; every category still needs precise wording.", "ask": "Can you write one behavioural requirement, one measurable quality requirement, and one constraint for the same feature?", "sources": ["https://ieeecs-media.computer.org/media/education/swebok/swebok-v4.pdf"]}, {"id": "acceptance-criteria", "stage": "requirements", "title": "Agree the evidence for acceptance", "explanation": "Acceptance criteria describe the conditions that must hold for a particular change to be accepted. They turn discussion into examples people can evaluate together. Starting from Harbour Bank's SGD 2,500.00 current balance and SGD 1,000.00 savings balance, confirming a SGD 125.00 transfer should leave SGD 2,375.00 and SGD 1,125.00. Criteria should also address relevant rejection paths and confirm that reviewing alone leaves balances unchanged.", "ask": "Which unsuccessful or cancelled path should be included alongside your successful example?", "sources": ["https://www.nasa.gov/reference/appendix-i-verification-and-validation-plan-outline/"]}, {"id": "business-requirements-document", "stage": "requirements", "title": "The business requirements document", "explanation": "A business requirements document, often called a BRD, explains why an initiative matters and what business outcomes and boundaries have been agreed. It may bring together the problem, stakeholders, success measures, scope, and major constraints. Its value is shared direction, not its length. Organisations use the name differently, so agree the document's purpose and audience before writing it, then keep it connected to more detailed requirements as decisions evolve.", "ask": "What decision should a sponsor be able to make after reading your BRD?", "sources": ["https://www.iiba.org/knowledgehub/the-business-analysis-standard/4-implementing-business-analysis/4-4-understanding-requirements-and-designs/"]}, {"id": "software-requirements-specification", "stage": "requirements", "title": "The software requirements specification", "explanation": "A software requirements specification, or SRS, records the expected software behaviour and relevant quality requirements, interfaces, data rules, and constraints. It gives designers, developers, and testers a common reference for what must be achieved. Requirements need stable identifiers and a clear route back to their purpose. An SRS may be maintained in a tool or several linked records; its usefulness depends on clarity, coverage, and upkeep rather than its file format.", "ask": "Could a tester derive meaningful checks from your SRS without inventing missing rules?", "sources": ["https://swehb.nasa.gov/pages/viewpage.action?navigatingVersions=true&pageId=146540002"]}, {"id": "functional-requirements-document", "stage": "requirements", "title": "The functional requirements document", "explanation": "A functional requirements document, commonly shortened to FRD, focuses on what users and systems can do and how each function behaves. It may describe inputs, decisions, outputs, exceptions, and state changes. For Harbour Bank, that could include selecting two different accounts, entering an amount, reviewing it, and confirming the transfer. The name is not universal; avoid maintaining duplicate rules when an SRS or another agreed record already serves the purpose.", "ask": "Where would you record what happens when the user changes the amount after reviewing it?", "sources": ["https://www.nasa.gov/reference/4-2-technical-requirements-definition/"]}, {"id": "choosing-requirements-documents", "stage": "requirements", "title": "Choose records that answer real questions", "explanation": "Requirements can live in user stories, use cases, process maps, interface specifications, decision tables, prototypes, or linked combinations of these. Choose the form that helps the intended readers make decisions and check understanding. A picture may explain a journey while a table captures amount rules more clearly. Keep a recognised source for each agreed rule and link related records so updates remain consistent as the software changes.", "ask": "Which representation would make the most confusing requirement easier for its readers to discuss?", "sources": ["https://swehb.nasa.gov/pages/viewpage.action?navigatingVersions=true&pageId=146540002"]}, {"id": "discovery-interview-evidence", "stage": "requirements", "title": "Learn from specific user experiences", "explanation": "Discovery interviews explore how people currently do a task, where they struggle, and what matters to them. Ask for a recent example instead of asking whether they like your proposed feature. For Harbour Bank, invite someone to describe the last time they checked a transfer amount before sending it. Follow their story with neutral questions about uncertainty and recovery. Keep observations separate from your interpretation, and include people with different access needs. Several consistent stories can reveal a useful pattern, while one interview cannot represent every user.", "ask": "How could you turn 'Would you like a faster transfer screen?' into a question about a real experience?", "sources": ["https://www.gov.uk/service-manual/user-research/using-in-depth-interviews"]}, {"id": "visible-assumption-log", "stage": "requirements", "title": "Turn assumptions into questions", "explanation": "An assumption log records what the team currently believes without enough evidence. Include the belief, why it matters, what would happen if it were wrong, and how someone will check it. An example is that Harbour Bank users understand the labels 'current' and 'savings' without extra explanation. Testing that belief early may prevent confusing account choices later. Review the log when new evidence arrives and mark beliefs as supported, changed, or still uncertain. This makes uncertainty manageable instead of allowing guesses to quietly become requirements.", "ask": "Which assumption would cause the most expensive rework if it proved false next month?", "sources": ["https://www.gov.uk/service-manual/user-research/plan-user-research-for-your-service"]}, {"id": "prioritize-with-reasons", "stage": "requirements", "title": "Prioritize with reasons people can inspect", "explanation": "Prioritization decides what deserves attention first when time and capacity are limited. Consider user benefit, risk, urgency, effort, and dependencies together. For Harbour Bank, correct balance changes and review before confirmation are more fundamental to the agreed journey than decorative animations. Write the reason beside each priority and identify what will wait. Revisit the order when evidence changes, because an accessibility problem or a newly discovered error may deserve immediate attention. A shared method makes tradeoffs discussable and reduces the influence of whoever speaks most loudly.", "ask": "If only one improvement could be delivered this week, what evidence would justify your choice?", "sources": ["https://www.gov.uk/service-manual/agile-delivery/deciding-on-priorities"]}, {"id": "map-delivery-dependencies", "stage": "requirements", "title": "Expose work that depends on other work", "explanation": "A delivery dependency exists when one piece of work needs a decision, capability, or result from somewhere else. A real transfer service might depend on account ownership checks, an agreed transaction record, and support procedures. Record the dependency, its owner, the date it is needed, and the effect of delay. Harbour Bank's browser prototype can explore the interaction without those live services, but that does not remove them from a production plan. Making dependencies visible helps teams sequence work and avoid discovering missing agreements at release time.", "ask": "What could another team deliver late that would prevent your apparently finished feature from being usable?", "sources": ["https://www.gov.uk/service-manual/the-team/running-more-than-one-team"]}, {"id": "privacy-as-requirements", "stage": "requirements", "title": "Specify how personal information is handled", "explanation": "Privacy requirements describe why information is needed, who can use it, where it goes, and when it should be removed. Begin with the smallest set of data needed for the task. A real Harbour Bank service would need explicit decisions about transaction records, support access, retention, and information shown in logs. Its browser demonstration should use fictional information because it has no real banking controls. Make these expectations testable and assign owners; a general promise to 'respect privacy' gives a development team too little direction.", "ask": "Which proposed data field could you remove while still helping the user complete the task?", "sources": ["https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.01162020.pdf"]}, {"id": "accessibility-acceptance-criteria", "stage": "requirements", "title": "Write accessibility into acceptance criteria", "explanation": "Accessibility becomes easier to deliver when it is part of the agreed behavior from the beginning. For Harbour Bank, examples include completing the transfer with a keyboard and giving the user a way to check and correct details before confirmation. Describe what someone must be able to do, then connect that behavior to relevant accessibility criteria and a verification method. These examples cover only part of accessibility. Include people who use assistive technology in research so the requirements reflect how the whole journey works in practice.", "ask": "Could your acceptance criteria explain how a person completes this journey without using a mouse?", "sources": ["https://www.w3.org/WAI/WCAG22/Understanding/keyboard.html", "https://www.w3.org/WAI/WCAG22/Understanding/error-prevention-legal-financial-data.html"]}, {"id": "quality-attribute-scenarios", "stage": "requirements", "title": "Make quality expectations measurable", "explanation": "Words such as fast, reliable, and easy to maintain need context before a team can test them. A quality scenario names the situation, the event, the expected response, and a measurable limit. For example, a proposed real service might require an account summary to appear within an agreed time under a defined workload. The team must choose and justify that target; the browser prototype cannot prove live capacity. Concrete scenarios let business and technical colleagues discuss the same expectation and discover expensive tradeoffs before implementation begins.", "ask": "How would you rewrite 'the system must be fast' so two people could independently judge whether it passed?", "sources": ["https://www.sei.cmu.edu/library/reasoning-about-software-quality-attributes/"]}, {"id": "ai-requirements-critique", "stage": "requirements", "title": "Ask AI to challenge a requirement", "explanation": "AI can help inspect a draft requirement by looking for ambiguity, missing cases, and conflicting rules. Supply the agreed context and ask it to distinguish questions from proposed changes. For Harbour Bank, 'allow amounts up to SGD 10,000' still needs the minimum, decimal precision, available balance rule, and confirmation behavior. Compare every suggestion with stakeholder evidence and record the decision. An AI critique is useful input to discussion, but it cannot decide what the organization has authorized or replace conversations with people affected by the requirement.", "ask": "Which ambiguity would you ask AI to look for, and who would decide the correct answer?", "sources": ["https://www.nist.gov/itl/ai-risk-management-framework"]}, {"id": "turn-requirements-into-design", "stage": "design", "title": "Turn requirements into design", "explanation": "A requirement states an outcome or constraint; design explains how the software will achieve it. Harbour Bank permits transfers between two owned accounts. Designers therefore decide how accounts appear, where ownership and balance checks happen, and how the review screen receives the proposed transfer. Linking each decision to a requirement helps colleagues spot missing work before anyone commits to a particular screen or code structure.", "ask": "Which design decision would make the owned-account restriction visible and enforceable?", "sources": ["https://www.nasa.gov/reference/4-4-design-solution-definition/", "https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695442/SWE-057%2B-%2BSoftware%2BArchitecture"]}, {"id": "connect-high-and-low-level-design", "stage": "design", "title": "Connect high-level and low-level design", "explanation": "High-level design describes the major parts and their relationships. Low-level design supplies the detail needed to build an individual part. For Harbour Bank, the first view might connect the transfer form, rule checker, review screen, and account state. The second might specify exactly how amount text becomes integer cents. These are different viewing distances on one solution, and teams should keep their assumptions consistent.", "ask": "Would a disagreement about accepting three decimal places belong in the broad architecture view or the detailed rule design?", "sources": ["https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695442/SWE-057%2B-%2BSoftware%2BArchitecture", "https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695443/SWE-058%2B-%2BDetailed%2BDesign"]}, {"id": "assign-clear-component-responsibilities", "stage": "design", "title": "Assign clear component responsibilities", "explanation": "A component is a piece of software with a defined job. Give Harbour Bank’s form responsibility for collecting choices, its rule checker responsibility for deciding whether a proposal is valid, and its confirmation action responsibility for updating both balances together. Clear boundaries make changes easier to discuss and test. If every screen contains its own version of the transfer rules, those versions can quietly disagree.", "ask": "Where should a revised transfer limit be changed so every screen uses the same rule?", "sources": ["https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695442/SWE-057%2B-%2BSoftware%2BArchitecture", "https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695443/SWE-058%2B-%2BDetailed%2BDesign"]}, {"id": "learn-through-models-and-prototypes", "stage": "design", "title": "Learn through models and prototypes", "explanation": "A model highlights selected aspects of a design, while a prototype lets people try an early representation. A paper sketch can reveal whether Harbour Bank customers confuse source and destination accounts. A clickable mock-up can explore the review step. Neither proves that money calculations or security work. Choose the simplest representation that can answer the current question, and record what remains untested when the exercise ends.", "ask": "What could a paper prototype reveal about a transfer, and what would require working software?", "sources": ["https://www.nasa.gov/reference/4-4-design-solution-definition/", "https://www.nasa.gov/reference/system-engineering-handbook-appendix/"]}, {"id": "preserve-useful-design-evidence", "stage": "design", "title": "Preserve useful design evidence", "explanation": "Useful design evidence explains a decision well enough for someone else to assess or change it. For Harbour Bank, keep the component sketch, transfer rules, sample review screen, and a short record explaining integer cents. Include important assumptions and rejected options. A large document is not automatically stronger evidence: a small, current explanation tied to requirements is often more useful than an impressive diagram nobody maintains.", "ask": "What would a new colleague need to understand why the transfer uses integer cents?", "sources": ["https://www.nasa.gov/reference/4-4-design-solution-definition/", "https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695443/SWE-058%2B-%2BDetailed%2BDesign"]}, {"id": "design-for-failures-and-competing-actions", "stage": "design", "title": "Design for failures and competing actions", "explanation": "Designers ask what happens when an action fails, arrives twice, or competes with another action. A real banking service must protect balances with server-side authorization and suitable transaction controls; disabling a button alone cannot provide that protection. Harbour Bank’s browser-memory demonstration can illustrate repeated confirmation and unchanged balances after rejection, but it has no server or production security. The design should state that boundary clearly before anyone generalizes the example.", "ask": "Why would preventing a second click be insufficient protection for a real transfer service?", "sources": ["https://www.postgresql.org/docs/current/transaction-iso.html", "https://cheatsheetseries.owasp.org/cheatsheets/Business_Logic_Security_Cheat_Sheet.html"]}, {"id": "choose-an-architecture-style", "stage": "design", "title": "Choose an architecture style", "explanation": "An architecture style supplies broad rules for organizing a system. A layered application separates concerns; independently deployed services split responsibilities across running systems. Each choice changes communication, testing, deployment, and operational effort. Harbour Bank’s small browser demonstration can keep distinct responsibilities inside one application. Splitting it into many services would add coordination work without automatically improving the learning experience or the correctness of a transfer.", "ask": "What concrete need would justify adding a separate service to this demonstration?", "sources": ["https://learn.microsoft.com/en-us/azure/architecture/guide/architecture-styles/"]}, {"id": "apply-patterns-in-context", "stage": "design", "title": "Apply patterns in context", "explanation": "A design pattern describes a recurring problem and a reusable approach to it. It is a starting point for judgment, not a badge of quality. For example, a retry pattern can help recover from temporary communication failures, but repeating a real money movement without duplicate protection could be harmful. Harbour Bank needs a clearly defined confirmation action; any additional pattern should solve an identified problem and include its costs.", "ask": "What must be known about an operation before retrying it becomes a sensible design choice?", "sources": ["https://learn.microsoft.com/en-us/azure/architecture/patterns/", "https://cheatsheetseries.owasp.org/cheatsheets/Business_Logic_Security_Cheat_Sheet.html"]}, {"id": "make-the-interface-understandable-and-accessible", "stage": "design", "title": "Make the interface understandable and accessible", "explanation": "A usable transfer screen makes the next action clear; an accessible one also works for people using different senses and input methods. Harbour Bank should label both accounts, identify SGD amounts, support keyboard navigation, and connect error messages to the relevant fields. Do not rely on red alone to communicate rejection. The review screen should repeat the source, destination, and amount so users can recognize a mistaken choice before confirming.", "ask": "Could someone complete and correct a transfer using only a keyboard and spoken page information?", "sources": ["https://www.w3.org/WAI/fundamentals/accessibility-principles/"]}, {"id": "use-sequence-data-flow-and-decision-models", "stage": "design", "title": "Use sequence, data-flow, and decision models", "explanation": "Different diagrams answer different questions. A sequence model shows the order of interactions; a data-flow model shows where information moves; a decision model shows how conditions select an outcome. For Harbour Bank, trace entry to review to confirmation, follow the amount into balance calculations, and list rejection conditions separately. Trying to squeeze all three questions into one picture can obscure a missing check or an unexpected route around review.", "ask": "Which model would best expose a route that updates balances before the user confirms?", "sources": ["https://www.nasa.gov/reference/system-engineering-handbook-appendix/", "https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695443/SWE-058%2B-%2BDetailed%2BDesign"]}, {"id": "compare-design-alternatives-with-evidence", "stage": "design", "title": "Compare design alternatives with evidence", "explanation": "Compare alternatives against the same needs and constraints. Harbour Bank might present account selection as two menus or as a clear current-to-savings switch. Judge both against direction clarity, keyboard use, error recovery, and implementation effort. A short trial can supply evidence where opinions differ. Record why the chosen option fits today’s situation and which change in circumstances would make the team reconsider it.", "ask": "What small experiment would help choose the clearest account-selection design?", "sources": ["https://www.nasa.gov/reference/4-4-design-solution-definition/", "https://www.w3.org/WAI/fundamentals/accessibility-principles/"]}, {"id": "classify-data-before-design", "stage": "design", "title": "Classify data before choosing protections", "explanation": "Data classification groups information according to its sensitivity and the consequences of misuse. A public help page, a customer's transaction history, and a secret access key require different handling. Use the organization's agreed labels and connect them to access, storage, sharing, and retention decisions. A real Harbour Bank design would carry those decisions into backups, exports, and logs as well as its main database. The prototype's fictional balances help explain the idea, but they do not demonstrate that real customer information would receive suitable protection.", "ask": "Where could a copy of sensitive information receive weaker protection than the original?", "sources": ["https://learn.microsoft.com/en-us/azure/well-architected/security/data-classification"]}, {"id": "agree-api-contracts", "stage": "design", "title": "Agree the contract between components", "explanation": "An application programming interface, or API, is a defined way for software components to communicate. Its contract describes the information a caller sends, the response it receives, and how errors are represented. A proposed Harbour Bank transfer contract could specify account identifiers, an amount in integer cents, and a clear transaction status. Agree what happens when fields are missing or the request cannot be completed. Examples make the contract easier for nontechnical reviewers to inspect and help separately built components work together without hidden assumptions.", "ask": "What would both sides of an interface need to agree before interpreting the number 1000 as money?", "sources": ["https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design"]}, {"id": "authentication-and-authorization", "stage": "design", "title": "Separate identity from permission", "explanation": "Authentication establishes who is making a request. Authorization decides whether that identity may perform the requested action on the particular resource. Signing in successfully would not give a real Harbour Bank customer permission to move money from someone else's account. The server would need to check ownership and allowed actions for each relevant request. Hiding an account in a menu is helpful presentation, but a caller may change a request outside that menu. The browser demonstration illustrates account choices without providing real identity or permission enforcement.", "ask": "After someone signs in, what additional question must the service answer before allowing a transfer?", "sources": ["https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"]}, {"id": "idempotency-and-safe-retries", "stage": "design", "title": "Design what a repeated request means", "explanation": "When a response is delayed, a user or network client may try the same action again. Idempotency means repeating a request has the same intended effect as performing it once. For a proposed real transfer service, a unique request key can help recognize retries and return the recorded outcome without moving money twice. The design must define key scope, retention, and what happens if details change. Disabling Harbour Bank's confirmation button can discourage duplicate clicks in the prototype, but it cannot provide server guarantees across network retries.", "ask": "If a customer sees no confirmation, how could the service distinguish a retry from an intentional second transfer?", "sources": ["https://docs.stripe.com/api/idempotent_requests"]}, {"id": "concurrent-balance-changes", "stage": "design", "title": "Account for actions happening together", "explanation": "Concurrency means several operations can overlap. Suppose two requests each try to move SGD 2,000 from the same real account while both initially read a SGD 2,500 balance. Checking the balance separately and updating it later could allow an invalid combined result. A production design needs coordinated database operations and an appropriate isolation strategy so each accepted transfer preserves the rules. It also needs a plan for conflicts and retries. Harbour Bank's in-memory browser behavior cannot establish that a shared service would handle simultaneous customers correctly.", "ask": "What could go wrong if two requests both make a decision using the same old balance?", "sources": ["https://www.postgresql.org/docs/current/transaction-iso.html"]}, {"id": "draw-trust-boundaries", "stage": "design", "title": "Mark where trust changes", "explanation": "A trust boundary is a point where information moves between areas with different control or confidence. A browser, an application server, and a supplier service are examples of different areas. Draw the data flow, then ask what each receiver must verify before accepting a message. In a real Harbour Bank service, an amount sent by the browser would require server validation even when the visible form already checked it. This exercise reveals security responsibilities that a tidy screen diagram can hide and helps reviewers ask concrete questions about misuse.", "ask": "Which piece of information in your design crosses a boundary where it should be checked again?", "sources": ["https://community.owasp.org/Threat_Modeling"]}, {"id": "record-architecture-decisions", "stage": "design", "title": "Keep the reason behind a design decision", "explanation": "An architecture decision record is a short account of an important design choice. Capture the problem, the options considered, the chosen option, and its consequences. Harbour Bank could record why amounts use integer cents: the representation makes two-decimal money rules explicit and supports exact addition within the permitted range. Include limits and future questions, such as supporting currencies with different minor units. A later team can then understand the reasoning instead of copying a choice blindly or reopening a discussion without knowing what was already considered.", "ask": "Which design choice would be hardest for a new colleague to understand six months from now?", "sources": ["https://learn.microsoft.com/en-us/azure/well-architected/architect-role/architecture-decision-record"]}, {"id": "test-design-tradeoffs", "stage": "design", "title": "Use small experiments to compare options", "explanation": "A design experiment explores a specific uncertainty before the team commits to a larger solution. State the question, compare plausible options, and decide what evidence would change your mind. For Harbour Bank, people might try two review summaries to see which better communicates the source account, destination, and amount. Keep the agreed confirmation rule intact while investigating presentation. A browser prototype can provide evidence about understanding and interaction, while questions about live security or capacity require different experiments. Record both what the experiment showed and what it could not establish.", "ask": "What is the smallest experiment that would help you choose between two design options?", "sources": ["https://www.gov.uk/service-manual/design/making-prototypes"]}, {"id": "build-in-small-usable-increments", "stage": "development", "title": "Build in small usable increments", "explanation": "An increment adds a coherent piece of usable capability. Harbour Bank could first deliver a working balance display, then a complete transfer journey with validation, review, and confirmation. Each increment should meet the agreed quality standard and work with what already exists. A half-built confirmation button is progress on a task, but it does not yet give a user a dependable way to move the demonstration’s money.", "ask": "What is the smallest transfer capability a person could actually use and assess?", "sources": ["https://scrumguides.org/scrum-guide.html"]}, {"id": "translate-rules-into-explicit-checks", "stage": "development", "title": "Translate rules into explicit checks", "explanation": "Implementation turns agreed rules into precise decisions. Harbour Bank accepts SGD amounts from 0.01 to 10,000, requires different owned accounts, and rejects insufficient funds. Parse valid money text into integer cents so balance arithmetic remains exact. Reject unsupported precision instead of silently changing the amount. Repeat the necessary checks when confirming, because the decision to apply a transfer must match the reviewed details and current demonstration state.", "ask": "Why should the code reject an amount with three decimal places instead of quietly rounding it?", "sources": ["https://cheatsheetseries.owasp.org/cheatsheets/Business_Logic_Security_Cheat_Sheet.html", "https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695443/SWE-058%2B-%2BDetailed%2BDesign"]}, {"id": "review-code-with-a-second-perspective", "stage": "development", "title": "Review code with a second perspective", "explanation": "Peer review lets another developer examine a proposed change before it becomes shared code. The reviewer considers understandable logic, consistency with requirements, error handling, and evidence from tests. In Harbour Bank, a useful review might ask whether both balances change together and whether editing an amount invalidates the previous review. Automated checks help, but a person can connect business meaning to details that a tool does not understand.", "ask": "Which business rule would you ask a reviewer to trace through the confirmation code?", "sources": ["https://cheatsheetseries.owasp.org/cheatsheets/Secure_Code_Review_Cheat_Sheet.html"]}, {"id": "understand-development-tool-roles", "stage": "development", "title": "Understand development tool roles", "explanation": "Development tools have distinct jobs. An editor helps people change files, version control records changes, a debugger helps inspect execution, and a test runner checks expected behavior. A build process prepares software for use. For Harbour Bank, Git can explain when the transfer limit changed, while a debugger can reveal why a rejected transfer altered a balance. Buying more tools does not replace clear requirements or careful decisions.", "ask": "Which tool would help investigate the history of a rule change, and which would help inspect its behavior?", "sources": ["https://git-scm.com/book/en/v2/Getting-Started-About-Version-Control", "https://learn.microsoft.com/en-us/dotnet/core/testing/"]}, {"id": "test-units-and-their-connections", "stage": "development", "title": "Test units and their connections", "explanation": "A unit test checks a small part in isolation; an integration test checks parts working together. Harbour Bank can unit-test the conversion of 12.34 into 1,234 cents and the insufficient-funds rule. An integration test can pass form data through validation and confirmation, then inspect both balances. These checks answer different questions. Correct individual parts may still exchange the wrong values or run in the wrong order.", "ask": "What problem could escape amount-parser tests but appear when the form and confirmation action are connected?", "sources": ["https://learn.microsoft.com/en-us/dotnet/core/testing/"]}, {"id": "measure-performance-before-changing-code", "stage": "development", "title": "Measure performance before changing code", "explanation": "Performance work begins with a defined activity and a measurement. For Harbour Bank, measure how long the page takes to become usable and how quickly confirmation updates the display on a stated device. Record conditions and compare repeated runs against a baseline. If reporting many observations, percentiles help expose slower experiences hidden by an average. A fast local demonstration provides no evidence about a real bank’s server capacity.", "ask": "What conditions would you record so two page-speed measurements can be compared fairly?", "sources": ["https://learn.microsoft.com/en-us/azure/well-architected/performance-efficiency/performance-targets"]}, {"id": "use-test-first-development-deliberately", "stage": "development", "title": "Use test-first development deliberately", "explanation": "Test-driven development uses a short loop: write a focused test that fails, add enough code to pass it, then improve the code while keeping tests green. For Harbour Bank, begin with the rule that zero cannot be transferred. The initial failure shows that the test can detect missing behavior. This technique encourages explicit examples, but the chosen examples still need review and do not replace broader testing.", "ask": "What would you investigate if a new test passed before you had implemented its intended behavior?", "sources": ["https://learn.microsoft.com/en-us/visualstudio/test/quick-start-test-driven-development-with-test-explorer?view=vs-2022"]}, {"id": "version-control-history", "stage": "development", "title": "Use version history to explain changes", "explanation": "Version control records changes to project files over time so people can inspect, compare, and recover earlier work. A useful change groups a coherent purpose and explains why it was needed. For Harbour Bank, fixing how an amount is parsed should be easy to distinguish from rewriting a help message. Reviewers can then connect the changed behavior to the requirement and its checks. Version history supports collaboration and investigation, but recovering earlier source code does not automatically reverse transactions or restore data in a real service.", "ask": "Could a colleague identify the purpose and expected behavior of your latest change from its history?", "sources": ["https://git-scm.com/book/en/v2/Getting-Started-About-Version-Control"]}, {"id": "reproducible-build-inputs", "stage": "development", "title": "Make the build repeatable and inspectable", "explanation": "A build turns source files and other inputs into something that can run or be released. A reproducible build produces identical output when the same source, environment, and instructions are used. Record relevant tool and dependency versions so another person can investigate differences. If Harbour Bank works on one laptop but changes unexpectedly elsewhere, uncontrolled build inputs may be involved. Reproducibility helps establish what was produced from a particular revision. It provides evidence about the process; it does not by itself prove that the product is correct or secure.", "ask": "What unrecorded input could make two people produce different releases from the same source files?", "sources": ["https://reproducible-builds.org/docs/definition/"]}, {"id": "choose-dependencies-deliberately", "stage": "development", "title": "Treat reused code as a responsibility", "explanation": "A dependency is software your project relies on to do part of its work. Reuse can save substantial effort, but the team inherits questions about maintenance, licensing, compatibility, and known vulnerabilities. Before adding a package to Harbour Bank, identify the actual need and whether a simpler existing capability is sufficient. Record the selected version and examine indirect dependencies that arrive with it. Assign responsibility for future updates and failures. Popularity or an AI recommendation can start an investigation, but neither is enough evidence to accept a component.", "ask": "What ongoing work would your team inherit by adding this dependency?", "sources": ["https://www.gov.uk/service-manual/technology/managing-software-dependencies"]}, {"id": "keep-secrets-out-of-code", "stage": "development", "title": "Handle secrets as controlled access", "explanation": "Secrets include passwords, tokens, and private keys that grant access to systems or information. A real service needs a controlled way to supply them, limit who can read them, and replace them when necessary. Avoid putting secrets in source files, screenshots, logs, or AI prompts. Browser code is delivered to the user, so a secret embedded there cannot remain confidential. Harbour Bank's demonstration should need no real banking credentials. If a secret is exposed, deleting its visible copy is insufficient; the team must address whether that credential still grants access.", "ask": "If a secret appeared in a shared file yesterday, what must happen beyond deleting that line today?", "sources": ["https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"]}, {"id": "configuration-versus-code", "stage": "development", "title": "Separate settings from program behavior", "explanation": "Configuration supplies values that may differ between environments, such as a service address or a logging setting. Keeping these values separate from program logic can make releases easier to move and inspect. Configuration still needs validation, ownership, and change records because an incorrect setting can break a working program. In Harbour Bank, a demonstration label is a different kind of setting from the agreed transaction limit. Changing the SGD 10,000 limit changes business behavior and therefore needs an explicit requirement decision, even if technically stored as configuration.", "ask": "Which setting looks harmless but could change an important promise to users?", "sources": ["https://12factor.net/config"]}, {"id": "review-ai-generated-code", "stage": "development", "title": "Review AI code against the actual rules", "explanation": "AI-generated code deserves the same review as any other contribution. Ask what changed, which assumptions it makes, and how the behavior was verified. For Harbour Bank, inspect whether an amount is converted to integer cents, whether both accounts belong to the user in the proposed real design, and whether confirmation is required before balances change. A readable explanation from the AI does not prove the implementation follows it. Review the actual change, run relevant checks, and keep a person accountable for accepting the result.", "ask": "Which business rule could plausible-looking generated code silently violate?", "sources": ["https://docs.github.com/copilot/responsible-use/chat-in-github"]}, {"id": "focus-testing-on-consequences-and-likelihood", "stage": "testing", "title": "Focus testing on consequences and likelihood", "explanation": "Risk-focused testing gives attention to problems according to their likely occurrence and consequences. For Harbour Bank, changing the wrong account balance deserves more attention than a slightly uneven margin. Consider mistaken inputs, repeat confirmation, insufficient funds, and users who cannot reach a control. Explain the priorities and remaining gaps. Limited time requires choices, and an explicit risk discussion makes those choices visible to the people accepting the outcome.", "ask": "If you had only thirty minutes, which transfer risks would you test first and why?", "sources": ["https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695671/5.10%2B-%2BSTP%2B-%2BSoftware%2BTest%2BPlan", "https://learn.microsoft.com/en-us/azure/well-architected/operational-excellence/testing"]}, {"id": "agree-what-done-means", "stage": "testing", "title": "Agree what done means", "explanation": "The Definition of Done is a shared quality standard for a completed increment. Harbour Bank’s team might require reviewed code, passing rule tests, an accessible transfer journey, and clearly stated demonstration limits. A feature meeting its acceptance criteria can still miss this wider standard. Agree the standard before declaring work finished, and make any unmet condition visible instead of quietly treating it as someone else’s future task.", "ask": "Which quality condition should apply to every Harbour Bank increment, even when a particular feature does not mention it?", "sources": ["https://scrumguides.org/scrum-guide.html"]}, {"id": "state-the-question-a-test-must-answer", "stage": "testing", "title": "State the question a test must answer", "explanation": "A test objective explains what the testing should establish. “Try the transfer page” gives little direction. “Determine whether rejection leaves both balances unchanged” identifies a meaningful concern and guides useful cases. Harbour Bank can pursue separate objectives for calculation accuracy, review clarity, and keyboard operation. Agreeing the question first helps the team select evidence, recognize completion, and explain what the exercise has not established.", "ask": "How would you turn “check the review screen” into an objective with a clear expected outcome?", "sources": ["https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695671/5.10%2B-%2BSTP%2B-%2BSoftware%2BTest%2BPlan", "https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695451/SWE-068%2B-%2BEvaluate%2BTest%2BResults"]}, {"id": "combine-static-and-dynamic-checks", "stage": "testing", "title": "Combine static and dynamic checks", "explanation": "Static testing examines work without running the software; dynamic testing observes software in execution. Reading Harbour Bank’s requirements may reveal that the maximum amount is missing. Running the form may reveal that an entered amount bypasses the maximum. Both findings matter. Reviews can start before a working application exists, while execution provides evidence about behavior that a document or code inspection alone cannot establish.", "ask": "Which transfer problem could you detect before any executable software exists?", "sources": ["https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf"]}, {"id": "distinguish-verification-from-validation", "stage": "testing", "title": "Distinguish verification from validation", "explanation": "Verification asks whether the product meets its specified requirements; validation asks whether it serves the intended users and purpose. Harbour Bank might correctly display every required review field yet leave users unsure which account loses money. Checking the fields supports verification. Observing users explain the transfer direction supports validation. Teams need both perspectives, because faithful implementation of an unclear or unsuitable requirement can still produce a disappointing result.", "ask": "What user observation would challenge a transfer screen that technically satisfies every written field requirement?", "sources": ["https://www.nasa.gov/reference/5-0-product-realization/"]}, {"id": "interpret-passing-tests-with-care", "stage": "testing", "title": "Interpret passing tests with care", "explanation": "A passing test establishes that a particular observation matched its expectation under stated conditions. It does not prove the absence of defects. Harbour Bank might pass ten ordinary transfers while still mishandling zero, unusual decimal input, or repeated confirmation. Confidence grows through useful variation and critical review of expectations. Report the scope alongside the result so people can distinguish demonstrated behavior from assumptions that remain unexamined.", "ask": "What additional information would you request alongside a report saying “all transfer tests passed”?", "sources": ["https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf"]}, {"id": "separate-error-defect-and-failure", "stage": "testing", "title": "Separate error, defect, and failure", "explanation": "An error is a human mistake, a defect is a problem in a work product, and a failure is incorrect behavior observed during execution. A developer may misunderstand cents, write a faulty conversion, and cause Harbour Bank to move the wrong amount. Distinguishing these helps investigation: record the observed failure first, locate the defect, then improve the conditions that made the original mistake more likely.", "ask": "In a report about an incorrect balance, what is observed evidence and what still requires investigation?", "sources": ["https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf"]}, {"id": "control-test-data-and-environments", "stage": "testing", "title": "Control test data and environments", "explanation": "A test needs a known starting point. Harbour Bank begins with SGD 2,500 in current and SGD 1,000 in savings, stored only in browser memory. Record whether the demonstration was reset, which account was selected, and what previous actions occurred. Use fictional data and a stated browser version. A result from a changed balance or different environment may be legitimate, but it must not be mistaken for the original scenario.", "ask": "Why might two people get different results from the same SGD 1,200 transfer instruction?", "sources": ["https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695671/5.10%2B-%2BSTP%2B-%2BSoftware%2BTest%2BPlan"]}, {"id": "share-quality-work-ac
