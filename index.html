tecture understandable before discussing individual functions.", "who": "Designer and developer with product-owner review.", "when": "After requirements are stable enough to model.", "where": "Case workspace with the state and data models.", "which": "Browser presentation, workflow controller, resource ledger, and test clock.", "how": "Follow choice through review, confirmation, approval, completion, and collection.", "sections": [{"heading": "Responsibility flow", "text": "The interface displays the visitor's selection and current state. The workflow controller evaluates an action using catalogue rules, the current clock, and resource ownership. The ledger applies one coherent update and returns a result for display. All components live in the browser for this demonstration."}, {"heading": "Proposed components", "columns": ["Component", "Owns", "Must not infer"], "rows": [["Catalogue", "Two repairs, prices, required skills, and required parts", "Additional repair methods or safety advice"], ["Workflow controller", "Action preconditions and allowed transitions", "Consent from mere booking confirmation"], ["Resource ledger", "Free, held, reserved, consumed parts and slot ownership", "Availability from a stale screen alone"], ["Presentation", "Review summary, states, messages, and controls", "Server security guarantees"]]}, {"heading": "Architecture boundary", "text": "A browser-only design is appropriate for a fictional local model, but its memory is neither shared authoritative inventory nor durable booking storage. A real service would place authorization and atomic resource management behind a controlled service boundary and assess repair safety separately."}]}, {"id": "lld", "title": "Low-level transition design", "stage": "design", "what": "The exact order of checks and updates for each state-changing action.", "why": "Prevent partial holds, invalid work starts, and repeated consumption.", "who": "Developer implements; reviewer examines each branch.", "when": "Before implementation and while reviewing changes.", "where": "Case workspace beside technical requirements.", "which": "Review, confirm, approve, complete, handover, cancel, and expiry.", "how": "Check current state first, derive one next state, then commit it once.", "sections": [{"heading": "Review and confirmation algorithm", "text": "Review first checks for an existing unexpired hold and refuses a second review while it remains active. To choose different details, the visitor cancels that review, releasing its slot and part, then makes a new selection. With no active hold, review checks active-booking eligibility, catalogue compatibility, slot capacity, and free stock before acquiring both resources together. Confirm recognizes an already confirmed hold, otherwise validates expiry and eligibility before converting its allocations."}, {"heading": "Transition effects", "columns": ["Action and permitted origin", "Result", "Resource effect"], "rows": [["Approve: Awaiting approval", "In progress with one consent event", "Part remains reserved and slot remains occupied"], ["Complete: In progress", "Ready", "One reserved part becomes consumed"], ["Handover: Ready", "Collected", "Slot remains used; visitor active limit clears"], ["Cancel or decline: Awaiting approval", "Cancelled", "Part and slot return to free"]]}, {"heading": "Repeat and rejection algorithm", "text": "For a repeat of an established action, return its established result without adding an event or altering resources. A different action that is prohibited in the current state returns a clear reason and preserves the entire prior state. Expiry is evaluated at action time using now greater than or equal to expiresAt, not by trusting the displayed expiry time."}]}, {"id": "data-model", "title": "Repair workflow data model", "stage": "design", "what": "The proposed records and relationships that represent the fictional session.", "why": "Keep ownership and resource accounting inspectable.", "who": "Developer with test-review input.", "when": "Before implementing the ledger.", "where": "Case workspace with example fixtures.", "which": "Catalogue, technicians, slots, stock, holds, bookings, and consent events.", "how": "Store stable identifiers and derive availability from explicit allocations.", "sections": [{"heading": "Identity and relationships", "text": "A hold identifies one fictional visitor, one repair type, one technician-slot pair, one part, and an expiry instant. A confirmed booking retains the originating hold identifier so repeated confirmation can locate it. Consent refers to the booking. The model uses a synthetic visitor identifier rather than real contact or identity data."}, {"heading": "Record responsibilities", "columns": ["Record", "Important fields", "Constraint"], "rows": [["Repair", "id, label, priceCents, skill, partType", "Bicycle 1500/cycle/brakePad; lamp 2000/electrical/switch"], ["Slot", "technicianId, time, allocationOwner", "Only 09:00 or 10:00 and at most one owner"], ["Part ledger", "starting, held, reserved, consumed", "All nonnegative; free is derived"], ["Hold", "id, visitorId, selection, expiresAt", "Exactly 120 seconds from acquisition"], ["Booking", "id, originatingHoldId, state, allocation", "One active booking per visitor"], ["Consent", "bookingId, approvalTime, affirmative", "At most one approval event for the transition"]]}, {"heading": "Terminal records", "text": "Collected and Cancelled remain visible in the session history. Collected retains its consumed part and used slot. Cancelled retains an audit of the decision but owns no part or slot. A deliberate full reset clears all records and restores both brake pads, the switch, and all four technician-slot pairs together."}]}, {"id": "api", "title": "Workflow action contract", "stage": "design", "what": "A proposed interface between the screen and in-memory workflow functions.", "why": "Let callers and implementers agree on inputs, results, and failures.", "who": "Developer and interface reviewer.", "when": "Before screens call state-changing functions.", "where": "Case workspace; this is not a live network API.", "which": "Stable identifiers, action names, current states, and reason codes.", "how": "Use explicit action results and read the ledger after every planned check.", "sections": [{"heading": "Contract scope", "text": "This contract describes local function calls for the demo. A real network API would need authentication, authorization, persistence, concurrency, and a reliable retry policy that are outside this implementation. Callers send identifiers and user choices; the model derives prices, skill compatibility, part needs, and permitted transitions."}, {"heading": "Proposed operations", "columns": ["Operation", "Input", "Result"], "rows": [["beginReview", "repairId, technicianId, slotTime, syntheticVisitorId", "holdId, expiresAt, summary or unchanged-state failure"], ["confirmHold", "holdId", "Existing or new bookingId in Awaiting approval, or expiry failure"], ["approveBooking", "bookingId, affirmative decision", "In progress with one recorded consent, or rejection"], ["completeBooking", "bookingId", "Ready or established completion result without repeat consumption"], ["handoverBooking", "bookingId", "Collected or existing Collected result"], ["cancelBooking / declineApproval", "bookingId", "Cancelled with released allocations, or unchanged-state rejection"]]}, {"heading": "Failure shape", "text": "Return a reason such as incompatible technician, occupied slot, unavailable part, expired hold, active booking, or prohibited transition together with the current safe state. Never return success for only half of a resource acquisition. User-facing wording must identify a useful next step without presenting an unverified operation as completed."}]}, {"id": "ui", "title": "Interface and content specification", "stage": "design", "what": "The proposed screens, action wording, and feedback for the repair journey.", "why": "Make irreversible or restricted workflow changes understandable.", "who": "Designer and accessibility reviewer with product-owner input.", "when": "Before implementation and after observed confusion.", "where": "Case workspace with the user guide.", "which": "Selection, review, Awaiting approval, work, collection, and terminal history.", "how": "Design each view around its current state and the permitted next action.", "sections": [{"heading": "Review content", "text": "Show the selected repair, compatible technician, fictional slot time, displayed price, and the hold expiry as a clock time. The resource table explains the relevant part and its availability. Explain that confirmation creates a booking awaiting approval and does not begin repair work. Cancel review returns to selection and releases its resources. The displayed expiry time is information; the action handler still checks the actual expiry instant."}, {"heading": "State-dependent actions", "columns": ["State", "Primary message", "Available next action"], "rows": [["Awaiting approval", "Your booking is reserved; work has not begun", "Approve work or decline/cancel"], ["In progress", "Approval is recorded; work is in progress", "Complete in the simulation"], ["Ready", "The simulated job is ready for collection", "Record handover"], ["Collected", "Handover is recorded; this job is closed", "Start another eligible booking"], ["Cancelled", "No work began; the reserved resources were released", "Start another eligible booking"]]}, {"heading": "Failure and access behavior", "text": "Show an expired-review message with a route to check availability again. Keep useful selection information where practical, without keeping an expired allocation. Ensure actions have clear labels, keyboard access, visible focus, and understandable status announcements. Never imply that the demo diagnoses an item, takes payment, or certifies electrical safety."}]}, {"id": "adr", "title": "Decision record: one guarded resource ledger", "stage": "design", "what": "The rationale for centralizing state changes in the demo.", "why": "Keep future changes consistent with atomic holds and repeat-safe actions.", "who": "Technical reviewer and developer propose; product owner reviews consequences.", "when": "Before implementation; revise through a new decision when needed.", "where": "Case workspace under architecture decisions.", "which": "One authoritative in-memory ledger for the fictional session.", "how": "Compare alternatives against the rules and record known limits.", "sections": [{"heading": "Decision and context", "text": "Propose one ledger that owns holds, bookings, parts, and technician slots. Every action computes a valid next state before replacing the current state. The choice supports the requirement that slot and part acquisition succeed together and that duplicate actions do not duplicate effects."}, {"heading": "Options considered", "columns": ["Option", "Benefit", "Problem or consequence"], "rows": [["Separate screen-owned counters", "Quick to display", "Can disagree after cancellation or repeated completion"], ["Central in-memory ledger", "Simple to inspect and reset consistently", "Limited to one browser session"], ["Persistent shared service", "Can support real users and durable records", "Requires additional controls and scope beyond this demo"]]}, {"heading": "Consequences to review", "text": "The ledger should expose readable snapshots for planned tests and derive free stock rather than update unrelated counters. It must preserve terminal records within a session. This choice does not establish protection against browser tampering, independent tabs, concurrent network clients, or real inventory changes."}]}, {"id": "threat-model", "title": "Threat and misuse model", "stage": "design", "what": "A proposed analysis of how the workflow could be misused or misunderstood.", "why": "Identify checks and scope wording before implementation.", "who": "Developer, product owner, and security reviewer if a real service is proposed.", "when": "During design and when adding external integrations.", "where": "Case workspace with trust-boundary notes.", "which": "Browser actions, mutable local state, allocation ownership, and misleading claims.", "how": "Consider altered inputs, repeated actions, state jumps, and data exposure.", "sections": [{"heading": "Assets and boundaries", "text": "The demo's assets are consistent fictional state and truthful explanation. A browser user can inspect or alter local state, so the interface must not claim real authorization or inventory protection. A future server and actual repair operation would introduce separate trust boundaries and require a new assessment."}, {"heading": "Misuse scenarios", "columns": ["Scenario", "Proposed demo response", "Boundary"], "rows": [["Assign lamp job to Mira", "Reject incompatible technician and preserve state", "Local correctness only"], ["Send Complete twice", "Recognize established completion and avoid further consumption", "No distributed exactly-once claim"], ["Skip approval by calling a function", "Reject state jump without recorded affirmative consent", "Browser can still be modified by its owner"], ["Interpret displayed price as payment", "State that prices are illustrative and no payment occurs", "No transaction-processing capability"]]}, {"heading": "Future-service questions", "text": "Before proposing real deployment, assess who may approve, complete, or hand over a job, how inventory changes are authenticated, and how records are retained. Qualified safety checks remain outside this demo. The model identifies questions; it is not an executed security test or a declaration of safety."}]}, {"id": "development-plan", "title": "Implementation plan", "stage": "development", "what": "A proposed sequence of small changes that build the complete model.", "why": "Reduce integration surprises and make important rules reviewable.", "who": "Developer and reviewer, coordinated by the product owner.", "when": "Before coding; adjust when evidence reveals a problem.", "where": "Case workspace with backlog and planned test links.", "which": "Catalogue, ledger, actions, interface, and focused verification.", "how": "Build rules first and demonstrate each slice using explicit fixtures.", "sections": [{"heading": "Implementation approach", "text": "Start with fixed data and pure state selectors, then implement resource acquisition and transition guards. Keep time injectable for expiry tests. Add screens that render the current state rather than maintaining a separate set of business counters. Each slice should carry its relevant checks and explanatory wording."}, {"heading": "Planned slices", "columns": ["Slice", "Main behavior", "Evidence to collect"], "rows": [["Resource core", "Skills, slots, parts, atomic review", "Compatibility and capacity cases"], ["Booking", "Expiry, confirmation, active-job limit", "Boundary and repeated-confirm cases"], ["Work lifecycle", "Approval, complete, handover, cancellation", "Transition and conservation cases"], ["Interaction", "Review summary, errors, keyboard flow", "Manual journey and accessibility notes"]]}, {"heading": "Completion and risk handling", "text": "Record actual changed files and build revision when work occurs. If a rule cannot be implemented as specified, raise a decision rather than silently weakening it. No schedule, successful implementation, or passed check is asserted here; this plan describes work and evidence still to be produced."}]}, {"id": "code-review", "title": "Code review checklist and review plan", "stage": "development", "what": "The questions reviewers should answer about the proposed implementation.", "why": "Find rule violations that a convincing screen can hide.", "who": "An independent code reviewer where available, with developer responses.", "when": "For each relevant change and before readiness assessment.", "where": "Case workspace; completed findings should link to actual code revision.", "which": "Guard order, atomic state updates, identifiers, expiry, and resource conservation.", "how": "Trace the changed code through both successful and rejected paths.", "sections": [{"heading": "Review focus", "text": "Inspect whether prices, skills, and part types come from the catalogue rather than user-supplied display text. Verify that confirmation converts a hold and that completion consumes its reservation once. Read handlers for direct calls as well as their visible buttons, because hiding an action does not prove the transition is guarded."}, {"heading": "Specific review prompts", "columns": ["Area", "Question", "Expected evidence"], "rows": [["Expiry", "Is now equal to expiresAt rejected?", "Comparison and boundary test"], ["Cancellation", "Are part and slot released only from Awaiting approval?", "Guarded transition and repeated-cancel case"], ["Completion", "Can Ready or Collected consume another part?", "Existing-result branch and ledger snapshots"], ["State ownership", "Can separate UI counters drift from allocations?", "Single ledger derivation"]]}, {"heading": "Review status", "text": "This is a proposed review record with no findings or approval yet. When a review is performed, record the revision, reviewer, concrete findings, resolution, and remaining concerns. An AI explanation may support inspection but cannot substitute for the changed code and actual verification."}]}, {"id": "build-record", "title": "Proposed build evidence record", "stage": "development", "what": "The information to capture when a demo build is actually produced.", "why": "Connect verification and release decisions to an identifiable artifact.", "who": "Developer records; reviewer checks traceability.", "when": "For each candidate submitted to verification.", "where": "Case workspace with a future artifact reference and test results.", "which": "Source revision, inputs, build command, output, and verification status.", "how": "Populate the record from actual execution; retain failed results as evidence.", "sections": [{"heading": "Current evidence status", "text": "No build has been executed or accepted by this document. The candidate is the proposed Second Spark browser demo with the fixed catalogue and ten functional rules. A future record must identify a real source revision and produced artifact before any test outcome is attached to it."}, {"heading": "Evidence to capture", "columns": ["Field", "Required case-specific content", "Current state"], "rows": [["Source identity", "Revision implementing the ten REPAIR-FR rules", "Not yet produced"], ["Build inputs", "Runtime, dependency versions, and exact command", "To be captured during the actual build"], ["Artifact identity", "Location and digest or equivalent release identifier", "No artifact claimed"], ["Verification link", "Results for the eighteen cases and manual reviews", "Planned cases only"]]}, {"heading": "Acceptance use", "text": "A successful build would show only that the artifact was produced under recorded conditions. It would not prove correct allocation, accessibility, or real-service safety. Rebuild after relevant changes and ensure the readiness review references the artifact that was actually checked."}]}, {"id": "test-plan", "title": "Repair workflow test plan", "stage": "testing", "what": "The scope, fixtures, techniques, and evidence approach for verification.", "why": "Check resource integrity and user understanding systematically.", "who": "Test reviewer coordinates; developer supports controllable fixtures.", "when": "Before execution and whenever the rule baseline changes.", "where": "Case workspace with cases, test data, and summary.", "which": "All ten functional rules, eighteen cases, and manual interaction reviews.", "how": "Run independent fixtures, compare full state snapshots, and report actual outcomes.", "sections": [{"heading": "Scope and techniques", "text": "Use compatibility, capacity, part-shortage, state-transition, repeated-action, and clock-boundary checks. Verify both displayed messages and underlying allocations. Each independent case starts from its stated fixture; avoid allowing one test's consumed parts to change another test's meaning."}, {"heading": "Planned test groups", "columns": ["Group", "Method", "Evidence"], "rows": [["Resource allocation", "Compatible and unavailable fixtures", "Before-and-after ledger and slot owners"], ["Timing", "Controllable time immediately before, at, and after expiry", "Clock values and confirm outcomes"], ["Lifecycle", "Permitted and prohibited action sequences", "State and consent-event history"], ["Interaction", "Keyboard and comprehension walkthroughs", "Manual observations and unresolved issues"]]}, {"heading": "Entry and exit proposals", "text": "Execution requires an identifiable build and fixtures that conserve stock. Proposed exit criteria include evidence for all eighteen cases, no unresolved incorrect-resource or prohibited-transition defect, and reviewed accessibility findings. These are proposed gates; no results, acceptance, or release authorization are recorded here."}]}, {"id": "test-cases", "title": "Eighteen planned functional test cases", "stage": "testing", "what": "Concrete inputs, actions, and expected outcomes for the fixed repair rules.", "why": "Make failures diagnosable and prevent a screen-only definition of success.", "who": "Test reviewer executes; developer investigates discrepancies.", "when": "Against an identified candidate build after fixture validation.", "where": "Case workspace linked from the traceability matrix.", "which": "Exactly REPAIR-TC-01 through REPAIR-TC-18.", "how": "Use controlled state and time, then compare expected and actual full-state effects.", "sections": [{"heading": "Execution conventions", "text": "All rows are planned and unexecuted. Capacity and shortage fixtures use the current visitor's Collected jobs, which no longer count as active but retain their used slots and consumed parts. This keeps the cases within the single-visitor model. Each fixture must account for its held, reserved, and consumed parts before the visitor acts."}, {"heading": "Functional cases", "columns": ["Case", "Rules", "Initial state", "Actions", "Expected result", "Evidence", "Status"], "rows": [["REPAIR-TC-01", "REPAIR-FR-02", "Fresh state; choose Bicycle tune-up at 09:00.", "Try Jules, then Mira.", "Jules is rejected without allocation; Mira is compatible and review shows SGD 15 with one brake pad held.", "Compare skills, summary, slot owner, and ledger.", "Planned; not run"], ["REPAIR-TC-02", "REPAIR-FR-02", "Fresh state; choose Lamp switch replacement at 10:00.", "Try Mira, then Jules.", "Mira is rejected without allocation; Jules is compatible and review shows SGD 20 with the switch held.", "Compare catalogue, summary, slot owner, and ledger.", "Planned; not run"], ["REPAIR-TC-03", "REPAIR-FR-01", "Separate fixtures with one visitor booking in Awaiting approval, In progress, and Ready.", "Attempt to begin another review in each fixture.", "Each attempt fails; the existing active booking and all resources remain unchanged.", "Snapshot booking count and allocations before and after each attempt.", "Planned; not run"], ["REPAIR-TC-04", "REPAIR-FR-03", "A Collected bicycle job used Mira 09:00 and consumed one brake pad; one pad is free, Mira 10:00 is free, and the visitor has no active booking.", "Request bicycle at Mira 09:00, then Mira 10:00.", "09:00 fails because the slot remains used, without acquiring a part. 10:00 holds the remaining pad and slot: one pad is consumed, one held, and zero free.", "Inspect old Collected state, slot ownership, visitor active count, and the two-pad conservation equation.", "Planned; not run"], ["REPAIR-TC-05", "REPAIR-FR-04", "A Collected lamp job used Jules 09:00 and consumed the only switch; zero switches are free, Jules 10:00 is free, and the visitor has no active booking.", "Request lamp at Jules 10:00.", "Part shortage prevents review. Jules 10:00 remains free, no hold is created, and the switch ledger stays one consumed with zero free, held, or reserved.", "Inspect Collected state, the used 09:00 and free 10:00 slots, and the one-switch conservation equation.", "Planned; not run"], ["REPAIR-TC-06", "REPAIR-FR-03, REPAIR-FR-04, REPAIR-FR-05", "Fresh state and controlled clock at T.", "Begin bicycle review at Mira 09:00.", "Exactly one pad and one slot are held; one pad stays free; expiresAt equals T plus 120 seconds; no booking exists.", "Capture hold, stock equation, slot owner, and empty booking list.", "Planned; not run"], ["REPAIR-TC-07", "REPAIR-FR-05, REPAIR-FR-10", "A Collected lamp job at Jules 09:00 consumed the switch. A current bicycle review holds Mira 09:00 and one pad, leaving one pad free; no booking is active.", "Try starting a lamp review while the bicycle review is active. Cancel the bicycle review, choose lamp at Jules 10:00, and attempt review. Then start a valid bicycle review and cancel it.", "The initial replacement attempt is refused and preserves the bicycle hold. Explicit cancellation releases its pad and slot. The subsequent lamp review fails for shortage without a partial hold. Cancelling the later bicycle review leaves both pads free; the old lamp job and consumed switch remain unchanged.", "Compare snapshots after refused replacement, explicit cancellation, failed new review, and the later cancellation; repeating cancellation must not release resources twice.", "Planned; not run"], ["REPAIR-TC-08", "REPAIR-FR-05, REPAIR-FR-06", "Fresh review acquired at T.", "Confirm at T plus 119.999 seconds.", "One Awaiting approval booking is created using the same allocations; held part becomes reserved without changing free count.", "Capture clock, originating hold, booking, and ledger.", "Planned; not run"], ["REPAIR-TC-09", "REPAIR-FR-05", "Fresh review acquired at T.", "Confirm exactly at T plus 120.000 seconds.", "Confirmation fails; no booking exists; both slot and part are released.", "Capture exact clock value, reason, and restored resource counts.", "Planned; not run"], ["REPAIR-TC-10", "REPAIR-FR-05, REPAIR-FR-10", "A review screen remains open beyond its deadline.", "At T plus 121 seconds, confirm from the stale screen and repeat the attempt.", "Both attempts fail; expiry releases resources once; stock never exceeds starting quantity.", "Compare snapshots across repeated stale actions.", "Planned; not run"], ["REPAIR-TC-11", "REPAIR-FR-06, REPAIR-FR-10", "Valid bicycle hold.", "Confirm twice with the same hold identifier.", "Both results identify one Awaiting approval booking; one pad is reserved and one slot occupied.", "Count bookings, originating-hold links, and allocations.", "Planned; not run"], ["REPAIR-TC-12", "REPAIR-FR-07, REPAIR-FR-10", "One Awaiting approval booking.", "Approve affirmatively, then repeat approval.", "Booking becomes In progress with one consent event; the repeat adds none; part remains reserved.", "Inspect consent count, state, and ledger.", "Planned; not run"], ["REPAIR-TC-13", "REPAIR-FR-03, REPAIR-FR-09, REPAIR-FR-10", "Awaiting approval bicycle booking at Mira 09:00.", "Cancel, then repeat cancel.", "One Cancelled record remains; both pads are free, Mira 09:00 is free, and a new booking may begin; repeat does not add stock.", "Inspect state, active count, slot, and conservation equation.", "Planned; not run"], ["REPAIR-TC-14", "REPAIR-FR-07, REPAIR-FR-09", "Awaiting approval lamp booking.", "Decline approval.", "Booking becomes Cancelled with no affirmative consent or work; switch and Jules slot become free.", "Inspect state, consent absence, and allocations.", "Planned; not run"], ["REPAIR-TC-15", "REPAIR-FR-09, REPAIR-FR-10", "Separate In progress, Ready, and Collected fixtures with consistent stock.", "Attempt cancel and decline in each fixture.", "Each action is rejected; state, used slot, and reserved or consumed part remain unchanged.", "Compare full before-and-after snapshots.", "Planned; not run"], ["REPAIR-TC-16", "REPAIR-FR-04, REPAIR-FR-08", "In progress lamp booking with one switch reserved.", "Complete once.", "Booking becomes Ready; reserved switches become zero, consumed switches become one, and Jules slot remains used.", "Capture state and stock categories, including zero free switches.", "Planned; not run"], ["REPAIR-TC-17", "REPAIR-FR-01, REPAIR-FR-08, REPAIR-FR-10", "In progress bicycle booking with one reserved pad.", "Complete twice, hand over twice, then call Complete again; begin a new eligible review.", "One pad is consumed total; old booking stays Collected; old slot stays used; repeat actions add no effects; new review is allowed at a free compatible slot.", "Compare terminal record, event count, remaining stock, and new hold.", "Planned; not run"], ["REPAIR-TC-18", "REPAIR-FR-07, REPAIR-FR-08, REPAIR-FR-10", "Separate review, expired-hold, Awaiting approval, Cancelled, and In progress fixtures.", "Try work approval from review or expired hold; Complete from Awaiting approval or Cancelled; Handover from In progress.", "All prohibited transitions fail with an allowed-next-step explanation; no booking, consent, consumption, or release is invented.", "Compare complete state snapshots and reason messages for every subcase.", "Planned; not run"]]}, {"heading": "Reporting convention", "text": "Record actual result, build revision, time settings, and evidence after running a case. A message alone is insufficient: inspect booking count, consent, slot ownership, and the part conservation equation where relevant. A failed or blocked subcase keeps its parent case from being reported as passed."}]}, {"id": "defect", "title": "Illustrative defect report: repeated completion", "stage": "testing", "what": "A specimen report for a possible duplicate-consumption defect.", "why": "Show how to report a rule violation without claiming it was observed.", "who": "Tester would report; developer would investigate; owner would prioritize.", "when": "Only after an actual mismatch is reproduced; this specimen is hypothetical.", "where": "Case workspace, later linked to a real defect record if observed.", "which": "REPAIR-FR-04, REPAIR-FR-08, REPAIR-FR-10 and REPAIR-TC-17.", "how": "State preconditions, exact actions, expected result, and recorded actual evidence.", "sections": [{"heading": "Hypothetical symptom", "text": "Suppose a second Complete action on an already Ready bicycle booking subtracts another brake pad. That would violate repeat safety and stock conservation. This example is not a finding from the current implementation; it describes the report that would be useful if such behavior were observed."}, {"heading": "Reproduction and evidence plan", "columns": ["Step", "Expected behavior", "Evidence to collect"], "rows": [["Prepare In progress bicycle booking", "One pad reserved and one free", "Initial ledger and booking state"], ["Complete once", "Ready with one pad consumed and one free", "First result and ledger"], ["Complete again", "Same Ready outcome and unchanged counts", "Second result plus comparison"]]}, {"heading": "Proposed triage", "text": "Treat verified duplicate consumption as release-blocking under the readiness proposal because it makes availability incorrect. Investigate the action handler and ledger ownership rather than only disabling the button. A fix would need the focused repeat case and relevant lifecycle checks against the corrected build before closure."}]}, {"id": "test-summary", "title": "Planned test summary record", "stage": "testing", "what": "The structure for reporting actual verification coverage and remaining uncertainty.", "why": "Prevent planned checks being misrepresented as passed evidence.", "who": "Test reviewer prepares; readiness participants inspect.", "when": "After an execution cycle and before a release decision.", "where": "Case workspace with case evidence and defect links.", "which": "The eighteen functional cases plus exploratory and accessibility work.", "how": "Summarize outcomes honestly and tie every conclusion to an artifact.", "sections": [{"heading": "Current status", "text": "All eighteen functional cases are specified, and none is recorded as executed. Accessibility evaluation, exploratory testing, and user acceptance are also planned. There is no verified build, pass total, approval, or release recommendation in this record."}, {"heading": "Current evidence position", "columns": ["Area", "Planned scope", "Recorded outcome"], "rows": [["Functional verification", "Eighteen cases covering ten rules", "0 executed; 18 planned"], ["Accessibility", "Keyboard, focus, labels, status, and comprehension", "Not evaluated"], ["Exploration", "Changing choices, expiry, and repeated actions", "Not performed"], ["Acceptance", "Visitor and coordinator scenario review", "Not performed"]]}, {"heading": "Future conclusion format", "text": "After execution, report passed, failed, and blocked cases separately, with the actual revision and conditions. Explain any excluded scenarios and material defects. A proposed release recommendation must state its evidence and limitations instead of converting the existence of a test plan into confidence."}]}, {"id": "uat", "title": "User acceptance plan", "stage": "testing", "what": "A proposed review of whether the workflow meets visitor and coordinator needs.", "why": "Test understanding and suitability alongside technical correctness.", "who": "Visitor and coordinator representatives, facilitated by the product owner.", "when": "After core behavior works and before release acceptance.", "where": "Case workspace with participant observations.", "which": "Booking clarity, consent, resource explanations, and terminal status.", "how": "Use realistic scenarios, neutral prompts, and explicit acceptance decisions.", "sections": [{"heading": "Acceptance approach", "text": "Invite participants to describe what each action will do before using it. Focus on whether they distinguish temporary review, confirmed booking, approval to begin work, and collection. Use only fictional repair records and explain that no real repair or payment is being arranged."}, {"heading": "Proposed acceptance scenarios", "columns": ["Scenario", "Question to observe", "Expected understanding"], "rows": [["Bicycle booking", "What changes when you confirm?", "Resources remain reserved and work awaits approval"], ["Lamp decline", "What happens if you decline now?", "Booking is Cancelled and resources return"], ["Ready item", "Can you book another job before handover?", "Ready remains active until Collected"], ["Expired review", "Can the old selection still be confirmed?", "Availability must be checked again"]]}, {"heading": "Decision record", "text": "Record observed misunderstandings, participant context, proposed corrections, and the person making an acceptance decision. No participant has approved the workflow through this plan. Acceptance cannot replace the exact expiry, repeat-action, and ledger checks, and it does not certify actual repair safety."}]}, {"id": "deployment-plan", "title": "Demo deployment plan", "stage": "deployment", "what": "The proposed steps for publishing an identified browser demonstration.", "why": "Preserve truthful scope and ensure checked behavior matches the release.", "who": "Release owner with developer and reviewer support.", "when": "After evidence is available and before publication.", "where": "Case workspace with readiness record and release artifact.", "which": "The fictional in-memory demo only.", "how": "Check the candidate, publish through the agreed route, then verify core journeys.", "sections": [{"heading": "Prepublication plan", "text": "Identify the exact artifact and collect the planned rule, accessibility, and scope evidence. Verify that initial data matches the two technicians, four technician-slot pairs, two brake pads, and one switch. Keep the workflow-only disclaimer visible; no real bookings or payment collection should be introduced."}, {"heading": "Proposed release steps", "columns": ["Step", "Check", "Stop condition"], "rows": [["Candidate review", "Readiness evidence refers to this artifact", "Missing critical rule evidence"], ["Publish demo", "Use the approved project hosting process", "Unexpected external data collection or service behavior"], ["Immediate verification", "Fresh state and representative booking, expiry, and cancellation", "Wrong catalogue, allocation, or state transition"], ["Recovery readiness", "Previous demo artifact can be restored", "No usable recovery route"]]}, {"heading": "After publication", "text": "Record the actual release time, artifact identity, checks performed, and any issue found. A rollback returns the demo code to an earlier version; it cannot recover a visitor's in-memory session. This document authorizes no publication and records no completed deployment."}]}, {"id": "release-notes", "title": "Proposed release notes", "stage": "deployment", "what": "A visitor-facing description for the planned demo release.", "why": "Set accurate expectations about included behavior and limitations.", "who": "Product owner writes; release owner confirms against the artifact.", "when": "At candidate review and after an actual release decision.", "where": "Case workspace; publish beside the demo only when accurate.", "which": "The fixed Second Spark workflow and its known boundaries.", "how": "Describe observable behavior without claiming unexecuted results.", "sections": [{"heading": "Proposed release description", "text": "Second Spark demonstrates choosing a bicycle or lamp repair, temporarily holding a compatible slot and part, confirming a booking, deciding whether work begins, and marking completion and collection. These notes describe intended behavior for a candidate; no release or successful validation is claimed."}, {"heading": "Included and limited", "columns": ["Area", "Intended behavior", "Limit"], "rows": [["Appointments", "Mira and Jules each have 09:00 and 10:00 slots", "One fictional day only"], ["Parts", "Two brake pads and one switch with explicit allocation", "In-memory fictional stock"], ["Work status", "Awaiting approval through Collected or Cancelled", "No actual repair or safety process"], ["Price", "SGD 15 bicycle and SGD 20 lamp", "Information only; no payment"]]}, {"heading": "Visitor expectations", "text": "Review holds last 120 seconds and require a new availability check after expiry. Refresh or deliberate reset returns the demonstration to its initial fictional state. Qualified inspection, diagnosis, electrical safety, personal-data protections, and real service operations are outside scope."}]}, {"id": "user-guide", "title": "Visitor and coordinator guide", "stage": "deployment", "what": "Plain-language instructions for the intended demo journey.", "why": "Help people understand choices and state changes without technical knowledge.", "who": "Product owner and designer; accessibility reviewer checks clarity.", "when": "Before publication and whenever behavior changes.", "where": "Case workspace and proposed in-demo help.", "which": "The two repair choices and permitted actions.", "how": "Explain consequences at the moment the visitor makes each decision.", "sections": [{"heading": "Choose, review, and confirm", "text": "Choose Bicycle tune-up for SGD 15 with Mira, or Lamp switch replacement for SGD 20 with Jules, at 09:00 or 10:00 on the fictional day. Review temporarily holds the required part and slot for 120 seconds. Confirm before it expires to create Awaiting approval. Confirmation does not begin work or take payment."}, {"heading": "What each status means", "columns": ["Status", "Meaning", "Next permitted step"], "rows": [["Awaiting approval", "Your part and slot are reserved; work has not begun", "Approve or decline/cancel"], ["In progress", "Affirmative approval has been recorded", "Mark complete in the simulation"], ["Ready", "Completion consumed the reserved part", "Record handover"], ["Collected", "The job is closed and its slot remains used", "Book another eligible job"], ["Cancelled", "No work began and resources were released", "Book another eligible job"]]}, {"heading": "If something is unavailable", "text": "A requested job needs both a compatible free slot and its part. If either is missing, review cannot start and neither resource should be acquired. If review expires, check availability again. Cancellation is available only before work, while Awaiting approval. The demo offers no real repair, safety advice, payment, or durable booking."}]}, {"id": "operations", "title": "Demo operations runbook", "stage": "maintenance", "what": "A proposed guide for checking and recovering the demonstration.", "why": "Help maintainers diagnose inconsistent fictional state without inventing real service actions.", "who": "Demo maintainer and release owner.", "when": "During verification, after a reported issue, and after release changes.", "where": "Case workspace beside incident and recovery plans.", "which": "Catalogue integrity, resource conservation, expiry, and artifact identity.", "how": "Observe first, preserve evidence, then reset or recover deliberately.", "sections": [{"heading": "Operational boundary", "text": "Operate only the browser demonstration. Do not interpret a Ready status as proof that an actual item is safe, and do not request real visitor or payment information. Before resetting a faulty session, capture its states, actions, clock conditions, and build identity using only fictional records."}, {"heading": "Proposed checks", "columns": ["Check", "Expected initial or invariant result", "Response to discrepancy"], "rows": [["Starting catalogue", "Two fixed repairs, Mira cycle-only, Jules electrical-only", "Compare artifact and configuration with requirements"], ["Stock equation", "Starting equals free plus held plus reserved plus consumed", "Preserve snapshot and open an incident record"], ["Slot ownership", "At most one owner per technician-time pair", "Stop relying on displayed availability"], ["Expired holds", "Cannot confirm at or beyond 120 seconds", "Capture time and repeat boundary case"]]}, {"heading": "Recovery choices", "text": "For a session problem, a deliberate full reset restores every fictional record and allocation together. For a code regression, restore a previously identified artifact and verify core behavior. State clearly that neither operation recovers real bookings because the demo has no such service or durable data."}]}, {"id": "dr-plan", "title": "Demo recovery plan", "stage": "deployment", "what": "The proposed approach to recovering a broken demonstration or release.", "why": "Distinguish restoring code from restoring data the demo never persists.", "who": "Release owner and maintainer.", "when": "Before publication and during a relevant incident.", "where": "Case workspace with artifact and operations records.", "which": "Published code, initial fixtures, and in-memory session state.", "how": "Preserve evidence, select a recovery path, then verify the restored starting state.", "sections": [{"heading": "Recovery scope", "text": "The demo holds fictional state in memory and offers no durable booking recovery. A reset intentionally discards the session and restores the fixed initial data. A release recovery restores a known artifact. These actions must be explained accurately so a user does not believe a real repair booking has been recovered or retained."}, {"heading": "Recovery scenarios", "columns": ["Situation", "Proposed action", "Verification"], "rows": [["Inconsistent session allocations", "Capture evidence, then perform full reset", "Two pads, one switch, four free slots, and no bookings"], ["Published code regression", "Restore an identified prior artifact", "Catalogue and representative lifecycle checks"], ["Unavailable demo page", "Investigate hosting and artifact availability", "Page loads and fictional scope remains visible"], ["Broken reset behavior", "Stop treating reset as recovery; inspect implementation", "All records and resources reset together"]]}, {"heading": "Exercise plan", "text": "Rehearse the chosen recovery procedure against a disposable demo session and record actual duration and outcome. No recovery exercise has been performed by this document, and no recovery-time target is claimed. A future real service would need separate data restoration, reconciliation, continuity, and qualified repair-safety procedures."}]}, {"id": "change-request", "title": "Proposed change request: two active jobs", "stage": "maintenance", "what": "An example assessment of a request to allow two simultaneous visitor bookings.", "why": "Show how a seemingly small feature changes rules and evidence.", "who": "Product owner evaluates with design, development, and test reviewers.", "when": "Only if the request is raised; no change is approved here.", "where": "Case workspace with the requirements baseline.", "which": "A hypothetical expansion beyond REPAIR-FR-01.", "how": "Compare benefits, affected constraints, implementation effort, and verification impact.", "sections": [{"heading": "Requested change and current decision", "text": "The hypothetical request is to let one visitor book both a bicycle and a lamp before collecting either. The current baseline permits only one active booking, so the request is outside scope and remains unapproved. The existing demo must continue rejecting a second active job."}, {"heading": "Impact assessment", "columns": ["Area", "Question raised", "Affected evidence"], "rows": [["Visitor experience", "How are two jobs and approvals distinguished?", "CRD, UI, user guide, and acceptance plan"], ["Resource handling", "Can each booking retain independent allocations?", "Data model, action contract, and concurrency review"], ["Verification", "Which single-active-job expectations must change?", "REPAIR-TC-03 and traceability map"], ["Scope", "Is the additional complexity justified?", "Product requirements and prioritization record"]]}, {"heading": "Decision route", "text": "Seek evidence that the extra capability solves a meaningful problem, then obtain an explicit baseline decision before editing behavior. If accepted, update every affected document and test rather than weakening the guard alone. If declined, retain the request and rationale so future reviewers understand the boundary."}]}, {"id": "incident", "title": "Illustrative incident record: unavailable switch mismatch", "stage": "maintenance", "what": "A specimen record for a hypothetical inconsistency in displayed stock.", "why": "Explain coordination and evidence preservation without inventing an actual incident.", "who": "Maintainer coordinates; developer investigates; product owner assesses impact.", "when": "If an issue is reported; this specimen is not an observed event.", "where": "Case workspace with session snapshots and artifact identity.", "which": "A discrepancy between displayed switches and actual allocations.", "how": "Separate reported symptoms, verified facts, hypotheses, and next actions.", "sections": [{"heading": "Hypothetical report", "text": "A visitor reports that the lamp option appears available after a Collected lamp job at Jules 09:00 consumed the only switch. Jules 10:00 is free, but no switch is free. This could be a stale display or a stock-accounting defect. The statement is an illustrative scenario, not an incident that has happened or a confirmed root cause."}, {"heading": "Initial response plan", "columns": ["Action", "Purpose", "Evidence"], "rows": [["Identify artifact and fixture", "Establish what was running", "Revision and initial allocation snapshot"], ["Compare screen with ledger", "Separate presentation from resource logic", "Displayed switch count, Collected job, and its consumed-part record"], ["Attempt review in a safe test session", "Check whether the guard prevents over-allocation", "Result and unchanged or changed state"], ["Record workaround and scope", "Explain the impact accurately", "Demo-only message and reset/recovery choice"]]}, {"heading": "Resolution criteria", "text": "A resolution would require evidence that availability derives from the ledger and that a shortage cannot acquire a partial slot hold. Record the actual fix, relevant case outcomes, and communication. Do not declare resolution simply because a refresh hides the symptom; preserve what explains the failure."}]}, {"id": "maintenance-plan", "title": "Demo maintenance plan", "stage": "maintenance", "what": "The recurring work needed to keep rules, content, and behavior aligned.", "why": "Prevent drift between the teaching example and its implementation.", "who": "Product owner, maintainer, and reviewer.", "when": "After changes and at agreed maintenance reviews.", "where": "Case workspace with dependency and service-measure records.", "which": "Rule consistency, compatibility, accessibility, dependencies, and scope.", "how": "Use a small ownership schedule and evidence-based change review.", "sections": [{"heading": "Maintenance priorities", "text": "Preserve the fixed catalogue, the distinction between confirmation and approval, and resource conservation through every supported transition. Review wording when people misunderstand the journey. Keep the demonstration visibly fictional and remove abandoned integrations or claims that imply real repair operations."}, {"heading": "Proposed maintenance activities", "columns": ["Trigger", "Activity", "Owner"], "rows": [["Rule change proposed", "Assess downstream documents and tests", "Product owner"], ["Dependency or browser change", "Review compatibility and targeted behavior", "Maintainer"], ["Reported interaction barrier", "Investigate with relevant access method", "Accessibility reviewer"], ["Release candidate", "Run agreed readiness evidence checks", "Release owner"], ["Content review", "Confirm scope and examples remain consistent", "Content owner"]]}, {"heading": "Evidence and retirement", "text": "Record what was actually reviewed, changed, and verified rather than ticking an indefinite checklist. If the demo is retired, explain the replacement or closure and remove misleading booking invitations. There are no real visitor bookings to migrate, but public links and learning expectations still deserve a clear transition."}]}, {"id": "assumption-log", "title": "Assumption log", "stage": "requirements", "what": "Unverified beliefs that affect the usefulness and clarity of the case.", "why": "Make uncertainty visible before it becomes an undocumented requirement.", "who": "Researcher and product owner.", "when": "At discovery and whenever new evidence challenges a belief.", "where": "Case workspace with audience and acceptance plans.", "which": "User understanding and workflow suitability; fixed rules remain explicit.", "how": "Assign a validation method and consequence to each belief.", "sections": [{"heading": "Assumptions versus rules", "text": "The two repair types, prices, skills, stock counts, and transitions are fixed scenario rules. Beliefs about how easily people understand them are assumptions. Keep those categories separate so user research can improve explanations without silently changing the functional baseline."}, {"heading": "Initial unverified assumptions", "columns": ["Assumption", "Consequence if wrong", "Planned check"], "rows": [["Visitors distinguish booking from approval", "They may think work has begun too early", "Ask participants to explain Awaiting approval"], ["A 120-second hold is understandable", "Expiry may feel arbitrary or surprising", "Observe review with a displayed expiry clock time and expiry message"], ["Ready is understood as still active", "People may expect another booking before collection", "Ask what can happen next from Ready"], ["Part shortage wording is clear", "Visitors may repeatedly try other times without understanding stock", "Observe lamp-shortage scenario"]]}, {"heading": "Update convention", "text": "Each assumption remains unverified until evidence is recorded. Add the observation, date, owner, and decision when research happens. A participant's confusion should lead to an examined explanation or design change, not an invented research conclusion or automatic relaxation of the rules."}]}, {"id": "prioritization", "title": "Prioritization decision record", "stage": "requirements", "what": "The proposed ordering of scope and verification work.", "why": "Keep limited effort focused on behavior whose failure changes commitments.", "who": "Product owner with delivery and review contributors.", "when": "Before implementation and during issue triage.", "where": "Case workspace with backlog and readiness criteria.", "which": "Core rule integrity, comprehension, accessibility, and optional polish.", "how": "Compare user impact, rule risk, dependencies, and effort explicitly.", "sections": [{"heading": "Decision basis", "text": "A misleading booking commitment or incorrect resource count can undermine the whole example. Therefore prioritize allocation, expiry, approval, and repeated actions ahead of decorative enhancements. Accessibility is part of each user journey and should not be deferred as a final cosmetic task."}, {"heading": "Proposed priority decisions", "columns": ["Item", "Priority", "Reason"], "rows": [["Atomic slot and part hold", "Essential first slice", "Other booking behavior depends on correct allocation"], ["Exact expiry and repeat safeguards", "Essential before acceptance", "Boundary errors can create duplicate or invalid commitments"], ["Keyboard approval and clear status", "Essential interaction evidence", "Visitors must understand and control consent"], ["Decorative animation", "Optional after core evidence", "Does not resolve an unmet workflow rule"], ["Real payments and diagnosis", "Outside scope", "Would introduce fundamentally different responsibilities"]]}, {"heading": "Reassessment rule", "text": "Revisit priorities when actual findings arrive. A concrete accessibility barrier or stock defect may change the order of work more than a stakeholder preference for visual polish. Record the reason and affected work so the team can inspect the tradeoff rather than infer it from the latest request."}]}, {"id": "privacy-register", "title": "Demo privacy and data register", "stage": "requirements", "what": "The proposed inventory of data used by the fictional workflow.", "why": "Keep personal information out of a model that lacks production controls.", "who": "Product owner and developer.", "when": "Before implementation and when a new field or integration is proposed.", "where": "Case workspace with the data model and scope statement.", "which": "Synthetic visitor identifier, choices, status, and fictional resource records.", "how": "List purpose and handling for each field and reject unnecessary real data.", "sections": [{"heading": "Data minimization for this scope", "text": "The demo needs no real name, phone number, email, address, payment detail, or description of a person's actual item. A synthetic visitor identifier supports the one-active-job rule. Technician names are fictional scenario labels. All state is in memory and should be presented as disposable demonstration data."}, {"heading": "Proposed data inventory", "columns": ["Data", "Purpose", "Handling"], "rows": [["Synthetic visitor identifier", "Associate one active booking with the demo visitor", "Fixed fictional identifier; no identity claim"], ["Repair and slot choice", "Evaluate catalogue and capacity rules", "In-memory session record"], ["Consent event", "Show that approval precedes work", "Fictional affirmative action and time"], ["Part ledger and status", "Explain resource effects", "In-memory counters and allocation records"], ["Real contact or payment information", "No purpose in this scope", "Do not collect"]]}, {"heading": "Future-service decision", "text": "Any proposal to collect real information requires a separate review of purpose, access, retention, disclosure, and applicable obligations. The presence of a consent event here concerns permission to begin the simulated workflow; it does not establish a production privacy or legal-consent process."}]}, {"id": "accessibility-review", "title": "Accessibility review plan", "stage": "testing", "what": "The planned checks for understanding and operating the demo with different access needs.", "why": "Catch barriers that correct business logic alone cannot reveal.", "who": "Accessibility reviewer with user participation where feasible.", "when": "During design, implementation, and readiness review.", "where": "Case workspace with manual observations and issue records.", "which": "Keyboard access, focus, labels, errors, timing, and status changes.", "how": "Combine manual journeys, suitable tools, and direct user feedback.", "sections": [{"heading": "Timing and understanding", "text": "Review holds expire after 120 seconds under the fixed case rules. Assess whether the displayed expiry clock time and subsequent expiry message are perceivable and whether returning to selection is understandable. The fixed time limit must be treated as a subject for accessibility review, not assumed to satisfy all accessibility requirements; a real service may need additional accommodations."}, {"heading": "Planned interaction checks", "columns": ["Check", "Case-specific action", "Evidence"], "rows": [["Keyboard operation", "Choose repair and slot, confirm, approve, and hand over", "Focus sequence and usable controls"], ["Status communication", "Trigger expiry, shortage, cancellation, and Ready", "What is visible and announced"], ["Clear labels", "Compare Confirm booking with Approve work", "Participant explanation of consequences"], ["Error recovery", "Attempt incompatible or unavailable choice", "Clear reason and accessible next step"], ["Timing barrier", "Review with an access method requiring more time", "Observed difficulty and proposed decision"]]}, {"heading": "Reporting and decisions", "text": "Record tested browsers, assistive tools, participants where appropriate, and exact barriers. A clean automated scan cannot establish that the journey is usable or fully conforms to an accessibility standard. No accessibility evaluation or conformance claim has been completed in this plan."}]}, {"id": "interface-failure-contract", "title": "Failure and recovery contract", "stage": "design", "what": "The proposed failure results and unchanged-state guarantees for each action.", "why": "Prevent callers from treating a refused action as a partial success.", "who": "Developer and interface reviewer.", "when": "Before integration and when an error path changes.", "where": "Case workspace beside the workflow action contract.", "which": "Eligibility, compatibility, capacity, expiry, and prohibited transitions.", "how": "Return a clear reason, current state, and permitted next step.", "sections": [{"heading": "Failure principle", "text": "A refused action must not silently consume a part, occupy a new slot, record approval, or change a booking's status. An expired hold releases its resources before reporting that it cannot be confirmed. Trying to begin another review while an unexpired hold exists leaves that hold unchanged. The visitor must explicitly cancel it to release its resources, then choose and check new details."}, {"heading": "Proposed failure responses", "columns": ["Reason", "Resource and state effect", "User next step"], "rows": [["REVIEW_ALREADY_ACTIVE", "Existing review and its held resources remain unchanged", "Confirm or cancel the current review before choosing again"], ["INCOMPATIBLE_TECHNICIAN", "No new hold or booking", "Choose the technician matching the repair"], ["SLOT_UNAVAILABLE", "No part acquired", "Choose another compatible free slot"], ["PART_UNAVAILABLE", "No slot acquired", "Choose another available repair or stop"], ["HOLD_EXPIRED", "Old hold released; no booking created", "Return to selection and check again"], ["ACTIVE_BOOKING_EXISTS", "Existing booking unchanged", "Finish or permissibly cancel the active job"], ["TRANSITION_NOT_ALLOWED", "Booking and resources unchanged", "Use the action allowed for the current state"]]}, {"heading": "Repeated requests and unknown records", "text": "A recognized repeat returns the established outcome without additional effects. An unknown hold or booking identifier produces a clear unchanged-state failure rather than creating a record implicitly. A future network service would also need a separate contract for uncertain transport outcomes; the local demo must not claim that capability."}]}, {"id": "concurrency-review", "title": "Concurrency and repeat-action review", "stage": "design", "what": "The proposed analysis of overlapping attempts and duplicate events.", "why": "Protect limited resources even when actions occur close together.", "who": "Technical reviewer and developer.", "when": "During design and before accepting allocation changes.", "where": "Case workspace with ledger and repeat-action cases.", "which": "Local event sequencing and test contention; future distributed work remains separate.", "how": "Inspect guard timing, ownership, and atomic update boundaries.", "sections": [{"heading": "Local guarantee and limit", "text": "For the browser model, route mutations through one synchronous guarded update so each action sees the latest state. Close-together button events must not each reserve the same resource. This does not provide coordination between independent tabs, browsers, real workers, or servers; those would require a shared authoritative design."}, {"heading": "Interleavings to inspect", "columns": ["Competing actions", "Required outcome", "Planned evidence"], "rows": [["Two confirmations for one hold", "One booking and one reservation", "REPAIR-TC-11"], ["Confirm at the expiry boundary", "Expiry rule wins at now equal to deadline", "REPAIR-TC-09"], ["Two Complete events", "One consumption and an established repeat result", "REPAIR-TC-17"], ["Review after a Collected job consumed the only switch", "Free later slot stays unheld because no switch is free", "REPAIR-TC-05"], ["Cancel after approval has changed state", "Cancellation rejected without release", "REPAIR-TC-15"]]}, {"heading": "Future-service proposal", "text": "A real shared service would require persistent ownership, atomic slot-and-part allocation, transaction isolation or equivalent conflict control, and a defined retry policy. It would also need to distinguish transport retries from new user intent. These are design questions for later scope, not controls established by a local demonstration."}]}, {"id": "dependency-register", "title": "Proposed dependency register", "stage": "development", "what": "An inventory plan for components the actual implementation may rely on.", "why": "Avoid inventing a package inventory or leaving reused code without ownership.", "who": "Developer records actual components; maintainer owns updates.", "when": "At implementation, build recording, and dependency changes.", "where": "Case workspace linked to the actual build record when available.", "which": "Browser APIs, runtime, UI packages, and test tooling actually selected.", "how": "Record purpose, version, source, owner, and verification impact.", "sections": [{"heading": "Current inventory status", "text": "No actual implementation dependency list has been supplied for this case. Do not fill the register with guessed package names or versions. The proposed design needs browser rendering, an in-memory model, and controllable time for tests; those capabilities may be implemented with or without additional packages."}, {"heading": "Inventory categories to complete from evidence", "columns": ["Category", "Case-specific purpose", "Review question"], "rows": [["Browser platform", "Display controls and run local state transitions", "Which supported environments are actually checked?"], ["Build runtime and tools", "Produce the candidate artifact", "Are versions and commands recorded?"], ["UI dependencies, if used", "Render forms, states, and feedback", "Do they preserve keyboard and focus behavior?"], ["Test tools, if used", "Control time and inspect state", "Can they exercise exact expiry and repeated actions?"], ["External integrations", "None required by the agreed demo", "Has an unnecessary data or service dependency appeared?"]]}, {"heading": "Update decision", "text": "For every actual component, assign an owner and inspect compatibility, maintenance status, and relevant security information. A version update affecting timers or event handling should trigger the expiry and repeat-action checks. The register remains a plan until populated from the real project and build."}]}, {"id": "ai-review", "title": "AI contribution review record", "stage": "development", "what": "The proposed human review of AI-assisted rules, code, or test suggestions.", "why": "Prevent plausible generated work from silently changing the fixed scenario.", "who": "Human author and reviewer remain responsible for acceptance.", "when": "Whenever AI contributes material used in the case.", "where": "Case workspace with changed content and evidence links.", "which": "Catalogue facts, state semantics, resource effects, and scope claims.", "how": "Compare generated suggestions with authoritative case rules and independently derived examples.", "sections": [{"heading": "Review approach", "text": "Give an AI the explicit ten rules and ask it to identify ambiguities rather than invent new behavior. Inspect the actual output before using it. An AI may incorrectly treat confirmation as consent, reopen a completed slot, or suggest a safety procedure the demo must not provide."}, {"heading": "Specific challenges", "columns": ["Generated suggestion", "Required review response", "Independent reference"], "rows": [["Start work immediately on confirmation", "Reject; Awaiting approval is required", "REPAIR-FR-06 and REPAIR-FR-07"], ["Return a part after completion", "Reject; completion consumes it", "REPAIR-FR-04 and REPAIR-FR-08"], ["Allow lamp assignment to Mira", "Reject; Mira is cycle-only", "REPAIR-FR-02"], ["Give electrical repair instructions", "Remove; outside workflow-demo scope", "Scope statement"], ["Mark planned tests as passed", "Reject unsupported evidence claim", "Test summary and build record"]]}, {"heading": "Evidence record", "text": "When review happens, identify the contribution, corrections, reviewer, and verification performed. Independently calculate ledger examples and inspect transition guards. This document records a proposed review method, not a completed AI audit, code approval, or assurance that generated material is accurate."}]}, {"id": "test-data", "title": "Controlled test data and fixtures", "stage": "testing", "what": "The fictional starting data and resource-consistent variants for planned checks.", "why": "Make results repeatable and prevent accidental use of real visitor information.", "who": "Test reviewer prepares; developer supports fixture loading.", "when": "Before each independent case and when adding a scenario.", "where": "Case workspace and disposable test environment.", "which": "Fixed catalogue plus labelled used-slot, consumed-part, and lifecycle fixtures.", "how": "Reset intentionally, seed complete allocations, and check conservation before acting.", "sections": [{"heading": "Baseline fixture", "text": "Use one fictional day, visitor DEMO-VISITOR, Mira with cycle skill, Jules with electrical skill, and 09:00 and 10:00 slots for each technician. Start with two brake pads and one switch, all free. Bicycle price is 1500 cents and lamp price is 2000 cents. There are no bookings, holds, or consent events."}, {"heading": "Resource-consistent fixtures", "columns": ["Fixture", "Allocations", "Purpose"], "rows": [["FRESH", "All four technician slots free; pads 2 free; switch 1 free", "Basic catalogue and hold checks"], ["CYCLE-09-COLLECTED", "Current visitor has a Collected job at Mira 09:00; one pad consumed and one free; Mira 10:00 free; no active booking", "Used slot rejection followed by a valid alternative in REPAIR-TC-04"], ["LAMP-09-COLLECTED", "Current visitor has a Collected job at Jules 09:00; switch 1 consumed and 0 free; Jules 10:00 free; no active booking", "Part shortage despite available time in REPAIR-TC-05"], ["LAMP-IN-PROGRESS", "Current visitor has consent, Jules slot, and one reserved switch", "Completion and prohibited cancellation"], ["LAMP-COLLECTED-WITH-CYCLE-HOLD", "Jules 09:00 used by a Collected lamp job and the switch consumed; Mira 09:00 held for bicycle review; pads 1 held and 1 free; no active booking", "Explicit cancel before reselection, followed by shortage, in REPAIR-TC-07"]]}, {"heading": "Clock and integrity", "text": "For time-sensitive cases, set acquisition to a known T and advance to the exact requested instant. Do not wait approximately two minutes and assume the boundary was tested. Every fixture must satisfy starting equals free plus held plus reserved plus consumed, and no slot may have two owners. Use only synthetic records."}]}, {"id": "exploratory-charter", "title": "Exploratory charter: changing minds and repeating actions", "stage": "testing", "what": "A focused planned investigation beyond the eighteen prepared cases.", "why": "Discover confusing combinations while keeping observations reproducible.", "who": "An exploratory tester or reviewer.", "when": "After core flows exist and before readiness review.", "where": "Disposable demo session with notes in the case workspace.", "which": "Explicit cancellation before reselection, stale review, consent, and terminal records.", "how": "Explore for a bounded session, follow surprises, and preserve a timeline.", "sections": [{"heading": "Mission and boundaries", "text": "Investigate whether a visitor can understand resource ownership while changing their mind or repeating an action. Begin from a known fixture and record the build. Use fictional data only. tal interval':'Request a repair slot'}</h2>${form}<div class="actions"><button class="btn" type="submit">Review ${id==='shopping'?'order':'booking'}</button></div></form>`}<h2>Records in this tab</h2>${id!=='repair'?`<p class="hint">Simulated payment records: ${s.payments.length} · Simulated refund records: ${s.refunds.length}</p>`:''}${s.records.length?s.records.map(r=>`<div class="receipt case-record"><h3>Record ${r.id} · ${esc(r.status)}</h3><p>${esc(caseRecordSummary(id,r))} · ${money(r.cents)}</p>${r.paymentId?`<p class="hint">Payment ${esc(r.paymentId)}${r.refundId?' · Refund '+esc(r.refundId):''}</p>`:''}${id==='repair'&&r.approved?'<p class="hint">Simulated approval recorded once.</p>':''}<div class="actions">${id==='shopping'&&r.status==='Completed'?`<button data-case-action="return" data-case-id="${id}" data-record="${r.id}">Return order</button>`:id==='rentals'&&r.status==='Confirmed'?`<button data-case-action="cancel" data-case-id="${id}" data-record="${r.id}">Cancel future booking</button>`:id==='repair'&&r.status==='Awaiting approval'?`<button data-case-action="approve" data-case-id="${id}" data-record="${r.id}">Approve work</button><button data-case-action="cancel" data-case-id="${id}" data-record="${r.id}">Decline / cancel</button>`:id==='repair'&&r.status==='In progress'?`<button data-case-action="complete" data-case-id="${id}" data-record="${r.id}">Complete job</button>`:id==='repair'&&r.status==='Ready'?`<button data-case-action="collect" data-case-id="${id}" data-record="${r.id}">Record handover</button>`:''}</div></div>`).join(''):'<p>No completed or confirmed records yet.</p>'}</div></div><p class="hint">Proposed real-service controls and multi-user tests are explained in the case documents. Successful use of this single-tab demonstration is not evidence that those controls have been implemented.</p>`;

const bank={loggedIn:false,accounts:{current:250000,savings:100000},history:[],pending:null,failures:0,lockUntil:0,lastActive:0,tab:'overview',message:'',kind:'',form:{amount:'',source:'current',destination:'savings'}};

function amountToCents(raw){const s=String(raw).trim();if(!/^\d+(\.\d{1,2})?$/.test(s))throw Error('Enter a positive amount using digits and no more than two decimal places.');const [w,f='']=s.split('.');const n=Number(w)*100+Number(f.padEnd(2,'0'));if(!Number.isSafeInteger(n)||n<1||n>1000000)throw Error('Enter an amount from SGD 0.01 to SGD 10,000.00.');return n;}
