nd release owners assess its fit.", "when": "Before implementation; revisit if shared reservations or real payments enter scope.", "where": "Keep with the high-level design and scope statement.", "which": "Compare browser memory with persistence and a server service against the actual learning objective.", "how": "Record context, alternatives, consequences, and the conditions that would require reconsideration.", "sections": [{"heading": "Proposed decision", "text": "Use one browser-memory state controller with separate domain functions and views. This makes the rental rules inspectable without collecting customer information or operating a real service. The record is a design proposal, not a signed architecture approval."}, {"heading": "Alternatives", "columns": ["Option", "Benefit", "Cost or consequence"], "rows": [["Browser memory", "Simple resettable example; direct rule visibility.", "No durability or shared cross-user reservation authority."], ["Browser persistence", "Retain fictional sessions across reloads.", "More lifecycle and cleanup behavior without solving shared availability."], ["Authoritative server", "Could coordinate durable shared reservations.", "Requires authentication, authorization, concurrency, operations, and provider integration work."]]}, {"heading": "Reconsideration trigger", "text": "If the intended outcome changes from learning to real bookings, this choice no longer meets the need. Do not incrementally add card fields or customer data to the current demo and assume that the missing service architecture has been solved."}]}, {"id": "threat-model", "title": "Threat model", "stage": "design", "what": "Identify misuse scenarios and distinguish demo limitations from proposed production controls.", "why": "Avoid presenting browser-only checks as security for actual vehicle or payment commitments.", "who": "Developers and a security reviewer examine the model with product and operations.", "when": "During design and before introducing any real data, network endpoint, or provider.", "where": "Keep beside trust boundaries, privacy register, and production assumptions.", "which": "Treat the browser as editable by its user and review all state-changing operations.", "how": "Describe the asset, misuse, current boundary, and additional control a real service would require.", "sections": [{"heading": "Trust boundary", "text": "The browser state is suitable for an educational simulation and can be changed by its user. No actual car inventory, customer identity, card information, or funds are entrusted to it. Local consistency tests are valuable but do not establish production security."}, {"heading": "Threat scenarios", "columns": ["Scenario", "Demo consequence", "Proposed production control"], "rows": [["Tampered displayed price", "Learner can alter local state; no real charge occurs.", "Server derives price from approved rate policy and binds it to authorized booking details."], ["Competing users reserve one interval", "Separate browser sessions do not share authority.", "Server-enforced exclusion and transactional reservation with defined contention handling."], ["Repeated payment or refund request", "Local guards demonstrate intended once-only effects.", "Durable idempotency, authorization, provider correlation, and reconciliation."], ["Accidental sensitive data collection", "No personal-data entry belongs in the current UI.", "Data minimization and approved purpose/retention design before onboarding is proposed."]]}, {"heading": "Review outcome needed", "text": "A security reviewer would need implemented server boundaries and relevant evidence before evaluating a real service. This example has neither a completed security assessment nor a claim that its local guards resist a malicious user."}]}, {"id": "development-plan", "title": "Development plan", "stage": "development", "what": "Sequence implementation work and the evidence needed at each step.", "why": "Reduce the chance of building interface states on ambiguous rules.", "who": "Developers plan with the tester and product owner.", "when": "Before starting the increment and when a change alters dependencies.", "where": "Keep with the backlog and linked build and review records.", "which": "Build the bounded browser flow without live integrations.", "how": "Implement domain behavior first, connect complete journeys next, and gather meaningful verification evidence.", "sections": [{"heading": "Implementation approach", "text": "Start with pure interval and price functions, then the review lifecycle and record transitions. Connect the interface only after these responsibilities are clear. Small increments should remain consistent with the same ten requirements."}, {"heading": "Proposed work sequence", "columns": ["Step", "Deliverable", "Evidence to obtain"], "rows": [["1 Domain rules", "Fleet constants, interval validator, overlap predicate, integer-cent quote.", "Boundary and adjacency checks against RENT-TC-01..12."], ["2 State transitions", "One pending review; expiry/cancel; confirm and refund guards.", "Controlled-time and repeated-action checks RENT-TC-13..17."], ["3 Complete interface", "Selection, review, outcome, cancellation, clear simulation boundaries.", "RENT-TC-18, keyboard review, and user tasks."], ["4 Delivery preparation", "Repeatable build and reviewed release candidate.", "Build record, test summary, readiness decision."]]}, {"heading": "Scope control", "text": "Do not implement licence collection, payment forms, editable maintenance, real calendars, or physical return as convenient additions. A need for those features requires a separate change request and business-approved policy work."}]}, {"id": "code-review", "title": "Code review record", "stage": "development", "what": "Provide a focused checklist and evidence structure for reviewing a rental change.", "why": "Direct reviewer attention to interval boundaries and once-only state changes.", "who": "A developer other than the author would review the change with domain context.", "when": "Before integration of rule, state, or interface changes.", "where": "Attach the completed record to the actual change and build when available.", "which": "Review the smallest coherent change with its linked requirements and tests.", "how": "Record the code reference, observation, requested correction, and resolution after review occurs.", "sections": [{"heading": "Review status", "text": "This is a prepared review checklist. No code revision, reviewer action, or approval is claimed. A completed record must identify the actual change and distinguish observed findings from questions."}, {"heading": "Review focus", "columns": ["Check", "Question", "Relevant rules"], "rows": [["Interval operators", "Does equality at a shared endpoint remain non-overlapping?", "RENT-FR-03"], ["Frozen quote", "Does confirmation use the reviewed car, interval, and integer total?", "RENT-FR-04, RENT-FR-05, RENT-FR-08"], ["Expiry ordering", "Is expiry evaluated during the action at >=120 seconds?", "RENT-FR-07"], ["Duplicate effects", "Can the same review or booking action create another payment or refund?", "RENT-FR-08, RENT-FR-09"], ["Scope boundary", "Are sensitive fields, live provider calls, and maintenance editing absent?", "RENT-FR-10"]]}, {"heading": "Resolution practice", "text": "A reviewer should connect an objection to the requirement and concrete scenario. Record any fix and the relevant verification evidence before resolving the comment; a checklist tick without examination is not review evidence."}]}, {"id": "build-record", "title": "Build record", "stage": "development", "what": "Capture which source and environment produced a particular deliverable.", "why": "Make reported test outcomes and a potential rollback refer to an identifiable artifact.", "who": "The developer or build system supplies facts; the release owner checks their completeness.", "when": "For each candidate considered for testing or publication.", "where": "Kee nvite users with varied interaction needs and capture what they understand before pressing confirm."}, {"heading": "Acceptance tasks", "columns": ["Task", "Expected understanding", "Observation to record"], "rows": [["Book City [5,8)", "Three days at SGD 180, with return day 8 excluded.", "Can the participant identify car, boundaries, total, and simulation?"], ["Handle Family maintenance", "[9,11) is unavailable; [12,14) is allowed.", "Can the participant recover without trying to edit the maintenance block?"], ["Recover from expiry", "At 120 seconds the old review cannot confirm.", "Does the participant know a new review is needed and no payment occurred?"], ["Cancel a future booking", "Full original simulated amount refunded once.", "Can the participant distinguish booking cancellation from pending-review cancellation?"]]}, {"heading": "Acceptance decision", "text": "The product owner should record the task evidence, unresolved issues, and decision after sessions occur. User acceptance does not establish production security, real-payment correctness, or policies beyond the bounded demonstration."}]}, {"id": "deployment-plan", "title": "Deployment plan", "stage": "deployment", "what": "Prepare an identifiable browser demonstration for publication and recovery.", "why": "Ensure the delivered artifact matches the candidate whose evidence is reviewed.", "who": "The release owner coordinates with developers and testers.", "when": "After a candidate exists and before publishing it.", "where": "Keep with build identity, release notes, test evidence, and rollback instructions.", "which": "Deploy only the static demonstration assets and approved configuration; no live rental integrations.", "how": "Check the candidate, publish through the chosen hosting process, perform stated checks, and retain the prior artifact.", "sections": [{"heading": "Deployment status", "text": "This is a plan, not a record of publication. A release decision needs the actual artifact and verificat n is needed."}, {"heading": "How to use the journey", "columns": ["Goal", "Steps", "Expected meaning"], "rows": [["Review a quote", "Choose City, pickup 5, return 8, then request review.", "Three days at SGD 180; one 120-second hold, not yet a booking."], ["Confirm", "Inspect the fixed review and confirm simulated payment before expiry.", "One booking reserves [5,8); no real funds move."], ["Cancel pending review", "Select cancel while the review is pending.", "Hold released; no payment or refund."], ["Cancel confirmed booking", "Choose cancellation for a confirmed demo booking.", "One full simulated refund and released interval; all demo bookings are future."], ["Recover from unavailable dates", "Choose a non-overlapping interval; Family [10,12) remains blocked.", "Adjacent return/pickup boundaries are allowed."]]}, {"heading": "Expired and reset sessions", "text": "An expired review must be replaced with a new review. Repeating the same confirmation or cancellation must not add another simulated charge or refund. The example keeps state only in browser memory, so do not rely on it as a saved reservation record."}]}, {"id": "operations", "title": "Operations runbook", "stage": "maintenance", "what": "Describe how to support the demonstration and what a real service would additionally require.", "why": "Keep simple educational recovery distinct from managing real reservations.", "who": "The service owner maintains the runbook with development and release support.", "when": "Before publication and when a support incident or design change reveals a gap.", "where": "Keep with release identity, incident records, and recovery guidance.", "which": "Operate static assets and reproducible fictional state; no customer database or payment provider exists.", "how": "Identify the affected build, reproduce with fictional data, assess scope, and choose correction or rollback.", "sections": [{"heading": "Support boundary", "text": "A lost browser session is a lost demonstration state, not a lost real booking. Support should ask for car, offsets, action sequence, elapsed hold timing, and build information without requesting personal, licence, or payment details."}, {"heading": "Operational situations", "columns": ["Signal", "Demo response", "Production proposal only"], "rows": [["Static page unavailable", "Check hosting delivery and restore a known artifact if required.", "Define service availability targets and on-call ownership."], ["Unexpected booking outcome", "Reproduce with fictional state and link relevant RENT-TC cases.", "Investigate authoritative reservation and financial records."], ["Expired hold confusion", "Explain 120-second expiry and fresh-review recovery.", "Operate lease monitoring against server authority."], ["Suspected duplicate effect", "Inspect local record counts for the same identifier.", "Reconcile durable provider outcomes and incident impact."]]}, {"heading": "Escalation record", "text": "Record observed impact, candidate identity, reproduction status, and chosen next action. Do not promise retrieval of an in-memory session or a real refund, and do not mark a production control operational merely because this runbook describes it."}]}, {"id": "dr-plan", "title": "Recovery plan", "stage": "maintenance", "what": "Plan recovery of the educational site and outline separate durable-service recovery needs.", "why": "Avoid pretending that browser memory has backup or reservation recovery guarantees.", "who": "The release owner leads demo recovery; a future service owner would own durable recovery policy.", "when": "Before delivery and after any change to hosting or persistence.", "where": "Keep with deployment artifacts, dependency versions, and incident procedures.", "which": "Recover the site artifact; reset fictional session state from defined initialization.", "how": "Restore a known artifact, inspect core behavior, and record the recovery exercise results.", "sections": [{"heading": "Recovery objective boundary", "t us", "text": "Hypothetical CR-RENT-01 asks whether a 180-second hold would give learners more review time. It is not approved or implemented. RENT-FR-05 and RENT-FR-07 remain unchanged at 120 seconds."}, {"heading": "Impact assessment", "columns": ["Area", "Potential change if approved", "Evidence or owner"], "rows": [["Product rule", "Revise hold and expiry statements and explain the reason.", "Product owner; policy decision record."], ["Implementation", "Update expiry calculation, displayed guidance, and countdown behavior consistently.", "Developer; review and focused checks."], ["Tests and documentation", "Revise exact-boundary vectors, RTM, guide, and release notes.", "Tester and writer; rerun affected cases."], ["Alternatives", "Improve wording or provide a fresh-review path without changing the hold.", "User observation and accessibility review."]]}, {"heading": "Decision gate", "text": "Obtain evidence about the actual learning difficulty before deciding. If accepted later, record the new version and execute revised boundaries; if rejected, preserve the reason and keep the existing cases and behavior."}]}, {"id": "incident", "title": "Incident scenario", "stage": "maintenance", "what": "Provide a response example for a suspected duplicate simulated payment.", "why": "Teach factual containment and investigation without inventing a real incident.", "who": "A service owner would coordinate developer investigation and release decisions.", "when": "Use if a participant reports repeated confirmation effects; this record is only a scenario.", "where": "Link an actual incident to build, reproduction evidence, defects, and corrective changes.", "which": "Limit current impact to fictional in-browser records.", "how": "Record the report, separate observed facts from hypotheses, reproduce, and verify the correction.", "sections": [{"heading": "Scenario status", "text": "Hypothetical report: a learner says double confirmation produced two payment rows for one City [5,8) review. No such incident has been observed or reproduced in this record. The model requires one booking and one SGD 180 simulated payment."}, {"heading": "Response sequence", "columns": ["Step", "Action", "Evidence to record"], "rows": [["Assess", "Identify build, review identifier, actions, and whether records truly duplicated.", "Participant report and local state without personal information."], ["Reproduce", "Run RENT-TC-16 with controlled repeated confirmation.", "Actual booking/payment counts and outcome identifiers."], ["Contain and correct", "Consider a corrected candidate or artifact rollback if evidence supports it.", "Decision owner, change reference, and relevant review."], ["Verify and learn", "Retest duplicate handling and related cancellation/expiry behavior.", "Executed results and root-cause conclusions only after investigation."]]}, {"heading": "Production distinction", "text": "A real duplicate-charge incident would need provider reconciliation, customer-impact handling, and approved communication procedures. Those actions are not meaningful for simulated records, and no actual customer payment or notification is involved here."}]}, {"id": "maintenance-plan", "title": "Maintenance plan", "stage": "maintenance", "what": "Plan how to keep the demonstration and its evidence aligned over time.", "why": "Prevent small wording, timing, or dependency changes from creating inconsistent rules.", "who": "The product owner, developer, and service owner share scheduled and change-triggered work.", "when": "After release and whenever rules, dependencies, or user feedback change.", "where": "Keep with change requests, dependency register, and release history.", "which": "Maintain the two-car model and clearly separated production proposals.", "how": "Prioritize by impact, use traceability to select checks, and update evidence with each candidate.", "sections": [{"heading": "Maintenance principle", "text": "A change is complete only when the rule, implementation, interface explanation, tests, and relevant documents agree. The fixed Family [10,12) block is data for the case, not a routine editable schedule."}, {"heading": "Maintenance work", "columns": ["Trigger", "Planned activity", "Evidence"], "rows": [["Rule or wording change", "Review impact through RENT-FR links and user tasks.", "Updated documents plus executed relevant checks."], ["Dependency update", "Assess compatibility and repeat affected domain and interface checks.", "Version diff, build identity, and results."], ["Reported confusion", "Review participant evidence and improve explanation without silently changing policy.", "UAT observations and recorded decision."], ["Proposed commercial feature", "Start discovery and business policy approval separately.", "New scoped requirements and architecture proposal."]]}, {"heading": "Review cadence", "text": "Choose a practical review cadence once ownership and publication context are known. No recurring schedule or automation has been created by this plan, and no maintenance task is claimed as completed."}]}, {"id": "assumption-log", "title": "Assumption and policy log", "stage": "requirements", "what": "Separate fixed demo facts from unresolved assumptions about a possible real rental service.", "why": "Prevent familiar commercial practices from being silently added to the example.", "who": "The analyst maintains entries and the product owner assigns decision owners.", "when": "Start during discovery and review when scope or evidence changes.", "where": "Keep beside the business requirements and architecture decision record.", "which": "Record fictional timing, future-booking cancellation, and missing production policy decisions.", "how": "Label each entry as fixed scope or unvalidated proposal and state the evidence needed.", "sections": [{"heading": "How to read this log", "text": "Fixed case rules are not assumptions to improvise around. They remain in force until a recorded change. Production policies below are deliberately unresolved and must receive business approval before a real implementation is designed."}, {"heading": "Facts and open policy questions", "columns": ["Entry", "Current status", "Owner or next action"], "rows": [["All bookings are future", "Fixed demo scope; full simulated refund on confirmed cancellation.", "Product owner preserves this simplification."], ["Family [10,12) maintenance", "Fixed, non-editable case input.", "Operations reviews meaning; no UI administration added."], ["Real pickup and return policy", "Unspecified production policy; inspection and physical return excluded.", "Rental business must define times, buffers, locations, and handling."], ["Real eligibility and charges", "Unspecified production policy; no licences, fees, tax, deposit, or insurance in demo.", "Business and relevant specialists must define approved requirements."], ["Real payment and refund terms", "Unspecified production policy and provider integration.", "Business owner defines terms; technical team then designs evidence and controls."]]}, {"heading": "Resolution discipline", "text": "Record a decision date, owner, rationale, and affected requirements only when a decision occurs. An assumption does not become evidence merely because it has remained in the log for a long time."}]}, {"id": "prioritization", "title": "Prioritization record", "stage": "requirements", "what": "Explain the proposed ordering of rental work by user impact and dependencies.", "why": "Spend effort first on behavior that determines whether the model is trustworthy.", "who": "The product owner decides priorities with technical and testing input.", "when": "Before planning an increment and when newly observed risks change importance.", "where": "Keep linked to backlog items, requirements, and unresolved evidence gaps.", "which": "Prioritize the defined core while keeping commercial extensions separate.", "how": "Compare consequences, dependency order, and learning value; record reasons for deferral.", "sections": [{"heading": "Prioritization basis", "text": "The key learning outcome is understanding commitment and reversal. A polished catalogue has limited value if it permits overlapping bookings or duplicate simulated payments. The order below is a proposal and does not claim work completion."}, {"heading": "Proposed priorities", "columns": ["Priority", "Work", "Reason"], "rows": [["First", "Date, price, overlap, adjacency, and maintenance rules.", "Every later journey depends on correct eligibility and availability."], ["Next", "Review hold, expiry, confirmation, and refund guards.", "These determine commitment and once-only simulated effects."], ["Alongside core", "Clear labels, keyboard access, and honest simulation boundaries.", "Learners must be able to understand and operate the journey."], ["Before publication", "Executed tests, user observations, build identity, and readiness review.", "Evidence is necessary to assess the actual candidate."], ["Separate discovery", "Licences, payments, real calendars, handover, and physical return.", "They add new policy and architecture needs beyond this case."]]}, {"heading": "Changing priority", "text": "If a participant cannot use the interface or a state inconsistency appears, reassess impact using evidence. Avoid treating the priority list as fixed permission to postpone a blocking accessibility or correctness issue."}]}, {"id": "privacy-register", "title": "Privacy and data register", "stage": "requirements", "what": "Inventory the data intentionally used by the demonstration and excluded collection.", "why": "Keep a simple educational model from accumulating unnecessary personal information.", "who": "The product owner and developer maintain the register; a privacy specialist would review any real-service proposal.", "when": "Before adding fields, analytics, integrations, or persistent storage.", "where": "Keep beside the data model, dependency register, and proposed production policies.", "which": "Limit application state to fictional cars, intervals, identifiers, and simulated amounts.", "how": "Record purpose, storage boundary, and prohibited data; assess hosting or telemetry separately before use.", "sections": [{"heading": "Data-minimization boundary", "text": "The demo does not ask for a name, contact detail, licence, address, identity document, or card. Booking and financial identifiers are fictional session records. Browser memory is the application-state boundary, not a claim about the privacy practices of an unspecified hosting provider."}, {"heading": "Data inventory", "columns": ["Data category", "Purpose and storage", "Policy"], "rows": [["Car and maintenance constants", "Explain availability in browser memory.", "City/Family and fixed [10,12); no person associated."], ["Offsets, quote, and record identifiers", "Demonstrate booking transitions during one session.", "Keep fictional and local; no customer identity linkage."], ["Licence and payment details", "No purpose in this demonstration.", "Do not collect or add fields."], ["Contact, identity, and address", "No purpose in this demonstration.", "Do not collect or request through support."], ["Hosting logs or analytics proposal", "Not specified by this case.", "Assess actual collection, purpose, retention, and notices before enabling."]]}, {"heading": "Production gate", "text": "A real service requires approved purposes, lawful handling requirements, retention, access controls, and rights processes appropriate to its context. This register supplies no legal determination or approval and does not authorize extending current fields."}]}, {"id": "accessibility-review", "title": "Accessibility review plan", "stage": "testing", "what": "Plan checks for operating and understanding the rental journey with varied access needs.", "why": "Expose barriers that ordinary mouse-based happy-path testing misses.", "who": "An accessibility reviewer and representative participants would assess the actual candidate.", "when": "During interface development and before an accessibility or release claim.", "where": "Keep observations linked to UI states, defects, and quality requirements.", "which": "Cover labels, keyboard operation, focus, errors, status changes, and the fixed hold timer.", "how": "Combine code inspection, keyboard tasks, and assistive-technology observation; record actual findings.", "sections": [{"heading": "Review boundary", "text": "No accessibility conformance claim is made. The fixed 120-second hold needs explicit assessment of timing accessibility and any applicable exception; its presence is not automatically acceptable. A safe fresh-review route must not be described as proof that every timing need is met."}, {"heading": "Planned checks", "columns": ["Area", "Task", "Expected evidence"], "rows": [["Labels and constraints", "Find car, pickup, and return controls using keyboard and spoken information.", "Understandable names and the 1..30, 1..14, and excluded-return explanations."], ["Errors", "Submit an invalid interval and a maintenance overlap.", "Field or contextual error is identifiable, readable, and not conveyed by color alone."], ["Focus and status", "Create, cancel, expire, and confirm a review.", "Logical focus and meaningful status announcements without every-second chatter."], ["Timing", "Observe review and expiry with varied users and assistive tools.", "Document barriers and a justified policy decision; do not change the fixed rule silently."], ["Cancellation", "Cancel a confirmed booking without a pointer.", "Understand the full simulated refund and released interval."]]}, {"heading": "Evidence handling", "text": "Record browser, assistive tool, method, task, observation, and affected state. Automated results may help locate issues but must not be presented as a complete accessibility assessment."}]}, {"id": "interface-failure-contract", "title": "Interface failure contract", "stage": "design", "what": "Specify how local operations report failure and preserve state.", "why": "Keep the interface from treating every error as a booking or retrying a risky action blindly.", "who": "Developers and testers agree the contract with the product owner.", "when": "Before connecting views to transitions and when adding a new failure condition.", "where": "Keep beside the interface specification and detailed design.", "which": "Use explicit invalid-input, unavailable, pending-exists, expired, and terminal outcomes.", "how": "Define user guidance, allowed retry, and side-effect rules for each outcome.", "sections": [{"heading": "Failure principle", "text": "A rejected operation creates no booking or simulated financial effect. Return enough information for the interface to explain recovery without guessing. A terminal record identifier lets repeated actions return the existing outcome rather than recreate an operation."}, {"heading": "Outcome contract", "columns": ["Condition", "Result and state", "Recovery"], "rows": [["Invalid offsets or duration", "Invalid-input; no hold, booking, payment, or refund.", "Correct the fields and request review."], ["Overlapping booking or maintenance", "Unavailable; existing state unchanged.", "Choose a valid non-overlapping interval."], ["Another pending review", "Pending-review-exists; preserve original snapshot.", "Cancel it or let it expire before another review."], ["Review reaches 120 seconds", "Expired; release hold; no booking or payment.", "Request a new review."], ["Confirmed review retried", "Existing confirmed outcome; no extra effects.", "Show the same booking."], ["Cancelled booking retried", "Existing cancelled outcome; no extra refund.", "Show the original cancellation result."]]}, {"heading": "External-service proposal", "text": "A future provider timeout would be an uncertain outcome requiring durable correlation and reconciliation, not automatic permission to charge again. No such network or provider failure path is implemented in the current local simulation."}]}, {"id": "concurrency-review", "title": "Concurrency and retry review", "stage": "design", "what": "Examine competing actions, record reuse, and the limits of one-browser state.", "why": "Protect the model from duplicated effects while avoiding false shared-service guarantees.", "who": "Developers and testers review the transitions; a future backend owner would assess server concurrency.", "when": "During state design and before changing confirmation, expiry, or cancellation.", "where": "Keep beside detailed design, interface outcomes, and controlled-time tests.", "which": "Review local action ordering and label multi-user controls as production proposals.", "how": "Evaluate each race by preconditions, winning transition, and final record counts.", "sections": [{"heading": "Scope of authority", "text": "The demonstration has one in-memory controller and one pending review slot. It can serialize local actions, but separate tabs or users do not coordinate reservations. A UI button being disabled is feedback, not a production lock."}, {"heading": "Competing actions", "columns": ["Scenario", "Required local result", "Proposed production consideration"], "rows": [["Two confirmations for one review", "First valid confirmation records effects; repeat returns the same result.", "Durable idempotency and transactional uniqueness."], ["Confirmation at expiry", "At elapsed >=120 seconds, expire and reject before creating effects.", "Authoritative server clock and defined lease checks."], ["Pending cancellation near confirmation", "Whichever valid transition occurs first determines state; stale cancel-review cannot refund a confirmed booking.", "Atomic transition with state/version checks."], ["Two cancellations for one booking", "One full simulated refund; repeat returns terminal result.", "Durable refund deduplication and provider reconciliation."], ["Separate users seek one interval", "Not protected across independent browser sessions.", "Server-enforced interval exclusion and tested transaction/retry strategy."]]}, {"heading": "Evidence required", "text": "Run the local repeated-action and controlled-clock cases and inspect final counts. A production concurrency proposal needs simultaneous-client tests against the chosen durable design; single-browser success does not supply that evidence."}]}, {"id": "dependency-register", "title": "Dependency register", "stage": "development", "what": "Identify what the demonstration relies on and how changes should be assessed.", "why": "Expose browser, build, hosting, and library assumptions without inventing installed packages.", "who": "Developers maintain implementation dependencies and the release owner tracks delivery dependencies.", "when": "At implementation setup and every dependency addition or upgrade.", "where": "Keep with actual manifests, lockfiles, build records, and operational ownership.", "which": "Record categories now and exact versions only when an implementation exists.", "how": "Assign an owner, purpose, version evidence, failure effect, and verification response.", "sections": [{"heading": "Register status", "text": "No particular library, framework, or hosting service is asserted to be installed by this case. Exact package names and versions must come from the actual implementation and build record rather than this prepared register."}, {"heading": "Dependencies to identify", "columns": ["Dependency", "Purpose and risk", "Evidence and action"], "rows": [["Browser runtime", "Renders controls and runs memory state and hold clock.", "Record tested versions; inspect timing, focus, and initialization."], ["Build toolchain", "Produces static assets.", "Record runtime, manifest, lockfile, command, and output."], ["UI or utility packages, if used", "May affect forms, arithmetic, timing, or accessibility.", "Justify need; review actual version and affected behavior."], ["Static hosting, if used", "Delivers the demonstration assets.", "Record service and artifact; assess delivery, logs, and rollback."], ["Real payment or fleet provider", "Absent from current scope.", "Do not add without approved discovery and interface design."]]}, {"heading": "Update discipline", "text": "Assess the actual change and run relevant domain and interface checks before accepting an upgrade. Preserve the previous artifact and dependency evidence when it may be needed for rollback or investigation."}]}, {"id": "ai-review", "title": "AI-assisted work review", "stage": "development", "what": "Define human checks for any AI-generated rental prose, code, or tests.", "why": "Catch plausible additions that violate the exact model or invent verification claims.", "who": "The author remains accountable and a knowledgeable reviewer assesses generated work.", "when": "Whenever AI output is proposed for inclusion in the case or implementation.", "where": "Keep review evidence with the actual change and its requirements.", "which": "Check rules, arithmetic, state transitions, privacy boundaries, and evidence wording.", "how": "Compare outputs against the canonical RENT-FR list and verify behavior independently.", "sections": [{"heading": "Review status", "text": "This checklist does not claim that generated code has been inspected or tested. AI suggestions are proposals until a person checks the relevant source and evidence. Keep fictional data in prompts and do not supply licence, identity, or card information."}, {"heading": "Likely generation errors", "columns": ["Risk", "Concrete review question", "Required correction"], "rows": [["Invented real-world fees", "Did the output add tax, deposit, insurance, or cancellation penalties?", "Remove them from current behavior; use separate approved-policy proposals if needed."], ["Calendar assumptions", "Did it use real months, time zones, or inclusive return days?", "Restore integer offsets and half-open intervals."], ["State shortcuts", "Did it skip review, extend expiry silently, or allow duplicate payments?", "Align transitions with RENT-FR-05..09 and test boundaries."], ["False evidence", "Does a document say tested, approved, secure, or production-ready without supporting records?", "Replace with accurate planned status and evidence requirements."]]}, {"heading": "Independent verification", "text": "A generated test that copies a generated implementation’s assumption can agree with the same mistake. Use independently reasoned examples such as Family maintenance adjacency and exact 120-second expiry to challenge both."}]}, {"id": "test-data", "title": "Test data catalogue", "stage": "testing", "what": "Provide reproducible fictional fixtures for planned rental checks.", "why": "Make failures interpretable and keep previous holds from contaminating another case.", "who": "The tester maintains fixtures and developers provide controlled clock and state setup.", "when": "Before every independent test or data vector.", "where": "Keep fixture definitions with test cases and execution evidence.", "which": "Use only cars, offsets, record identifiers, and simulated amounts.", "how": "Initialize known state, seed only specified valid records, and record elapsed timing explicitly.", "sections": [{"heading": "Fixture rules", "text": "Fresh state always retains Family maintenance [10,12). Clear pending reviews, bookings, and simulated financial records between independent vectors. A seeded confirmed booking must include its single matching simulated payment; all bookings remain future for this demonstration."}, {"heading": "Fixtures", "columns": ["Fixture", "Data", "Use"], "rows": [["RF-EMPTY", "City/6000; Family/9000; Family [10,12); no other records.", "Basic dates, prices, and maintenance cases."], ["RF-CITY-BOOKED", "RF-EMPTY plus confirmed City [5,8), total 18000 cents, one simulated payment.", "Overlap, containment, adjacency, and cancellation."], ["RF-PENDING", "RF-EMPTY plus pending City [5,8), total 18000 cents, creation t0, expiry t0+120 seconds.", "One-review, expiry, and pending cancellation."], ["RF-TIME-BOUNDARY", "Independent RF-PENDING at elapsed 119, 120, and 121 seconds.", "Exact expiry boundary without waiting ambiguously."], ["RF-CANCELLED", "RF-CITY-BOOKED cancelled once with one 18000-cent refund.", "Repeated cancellation and released availability."]]}, {"heading": "Evidence integrity", "text": "Fixtures are test support, not a hidden user maintenance editor. Record any direct state seeding, clock control, and software version so a reviewer can distinguish arranged conditions from the behavior being tested."}]}, {"id": "exploratory-charter", "title": "Exploratory testing charter", "stage": "testing", "what": "Guide a focused investigation of confusing or unexpected rental-state behavior.", "why": "Explore interactions that a fixed script may not anticipate.", "who": "A tester or paired tester and product participant conducts the session.", "when": "After a usable candidate exists and alongside planned cases.", "where": "Keep notes, discoveries, and follow-up cases linked to the candidate.", "which": "Investigate selection changes, expiry visibility, repeated actions, and cancellation understanding.", "how": "Use a time-bounded session with a clear mission, record the path, and turn useful discoveries into evidence or follow-up work.", "sections": [{"heading": "Mission and status", "text": "Proposed session: investigate whether a person can always tell the difference between available, held, expired, confirmed, and cancelled. The session has not been conducted, so the risks below are prompts rather than findings."}, {"heading": "Investigation prompts", "columns": ["Area", "Explore", "Record"], "rows": [["Review identity", "Try changing selection, navigating away, and returning while a review is active.", "Whether the fixed quote and permitted next action remain clear."], ["Expiry", "Leave the view idle and act near the 120-second boundary.", "Displayed status versus actual action-time decision."], ["Repeated actions", "Repeat confirm and cancellation controls quickly and after status changes.", "Result identities and booking/payment/refund counts."], ["Maintenance and adjacency", "Compare Family [9,11), [8,10), and [12,14).", "Whether rejection and recovery explanations reflect the same rule."], ["Keyboard journey", "Move through errors and disappearing review states without a pointer.", "Focus continuity and status comprehension."]]}, {"heading": "Debrief", "text": "Summarize explored paths, actual discoveries, unexamined areas, and follow-up tests. Do not treat an exploratory session as exhaustive coverage or create a defect from a suspicion without preserving the observation."}]}, {"id": "readiness-review", "title": "Readiness review", "stage": "deployment", "what": "Assemble the evidence required for a decision on a specific demonstration candidate.", "why": "Make missing verification and unresolved risks visible before publication.", "who": "The release owner coordinates product, development, testing, and accessibility input.", "when": "After a candidate and actual evidence are available.", "where": "Keep the decision record with build identity and supporting documents.", "which": "Assess educational-site readiness only; production-service readiness is a different decision.", "how": "Review evidence quality, open issues, scope wording, rollback, and ownership before recording a decision.", "sections": [{"heading": "Current decision state", "text": "No readiness decision is recorded. The document bundle and eighteen planned cases do not establish a verified candidate. Approval fields must remain pending until the responsible people review actual evidence."}, {"heading": "Decision inputs", "columns": ["Area", "Required evidence", "Current status"], "rows": [["Candidate identity", "Source, dependencies, build output, and artifact reference.", "Not supplied by this case record."], ["Behavior", "Executed RENT-TC results with relevant state evidence.", "18 planned; 0 executions recorded."], ["User experience", "Accessibility observations and user task evidence.", "Planned; not performed here."], ["Scope and policy", "Clear simulation notice, no personal fields or live payments, fixed maintenance.", "Requires candidate inspection."], ["Recovery and ownership", "Rollback artifact and named operational responsibilities.", "Plan prepared; actual readiness not assessed."]]}, {"heading": "Decision language", "text": "Record approve, defer, or reject only after the review, with reasons and conditions. If evidence is missing, say so plainly. A production proposal additionally needs approved business policies and implemented, tested service controls."}]}, {"id": "service-measures", "title": "Service measures", "stage": "maintenance", "what": "Define useful proposed measurements and their interpretation.", "why": "Assess the demonstration without mistaking simulated activity for business performance.", "who": "The service owner and product owner choose measures with privacy and testing input.", "when": "Before instrumenting a candidate or evaluating a release.", "where": "Keep definitions with quality criteria, privacy review, and execution records.", "which": "Measure correctness and learning usability; separate future commercial indicators.", "how": "State numerator, denominator, observation method, and limits before collecting results.", "sections": [{"heading": "Measurement boundary", "text": "No analytics are enabled and no measurements are reported by this document. A count of simulated bookings is not revenue or a real conversion rate. Collection must respect the no-personal-data scope and be assessed before adding telemetry."}, {"heading": "Proposed measures", "columns": ["Measure", "Definition and method", "Interpretation limit"], "rows": [["Duplicate-effect count", "Count extra booking, payment, or refund records per repeated identifier during controlled checks.", "Target is zero in those checks; not evidence of multi-user production safety."], ["Boundary correctness", "Observed expected outcomes among executed overlap, adjacency, and expiry vectors.", "Report vectors and missing coverage; a percentage alone is insufficient."], ["Local interaction latency", "Measure specified view-update times on a stated build, browser, and device.", "No target yet agreed; does not measure server capacity."], ["Task understanding", "Record whether participants accurately explain interval, hold, and simulation after each task.", "Requires actual participant evidence and careful interpretation."], ["Future service indicators", "Propose reservation conflicts, provider reconciliation delay, and availability only during production discovery.", "Need approved targets, authoritative data, and separate implementation."]]}, {"heading": "Use of results", "text": "Compare like conditions, investigate changes, and retain the method with each observation. Do not optimize for more confirmations at the cost of understanding, accessibility, or the accuracy of the reservation model."}]}]}, {"id": "repair", "title": "Community repair hub", "brand": "Second Spark", "intro": "Second Spark is a fictional community repair hub that lends structure to a small service journey: choose a repair, reserve suitable resources, review the choice, approve the work, and collect the item. Every document below is a proposed specification or planned evidence item. No listed test, approval, release, inspection, or recovery exercise has actually been completed.", "scope": "This browser workflow demonstration uses fictional records and one visitor with at most one active booking. It models resource availability and work status in memory. It provides no actual diagnosis, electrical safety instructions, payment processing, or production personal-data controls. A real repair service would require qualified safety checks and appropriate operating procedures outside this demonstration.", "startingState": "On a fictional day, Mira has cycle skills only and Jules has electrical skills only. Each technician has slots at 09:00 and 10:00, with one job per technician per slot. Stock starts at two brake pads and one switch, all free. There are no holds or bookings. Bicycle tune-up costs SGD 15 and requires Mira plus one brake pad. Lamp switch replacement costs SGD 20 and requires Jules plus one switch. Prices are information only; no payment is taken.", "roles": [{"role": "Visitor", "responsibility": "Choose one repair and slot, review within the hold period, confirm a booking, decide whether to approve work, and collect a Ready item."}, {"role": "Coordinator", "responsibility": "Explain the workflow and record the visitor's approval or decline in the simulation; manage only the transitions permitted by the rules."}, {"role": "Technician", "responsibility": "Represent work status for a compatible assigned job and mark it Ready in the simulation; actual repair procedures are outside scope."}, {"role": "Product owner", "responsibility": "Decide scope and resolve business-rule ambiguities, including capacity, stock, expiry, and terminal-state behavior."}, {"role": "Developer and reviewer", "responsibility": "Implement and inspect the in-memory workflow, resource accounting, and repeat-action safeguards."}, {"role": "Test and accessibility reviewer", "responsibility": "Plan and gather evidence for the agreed rules and usable interaction; no approval is assumed from this role listing."}], "rules": [{"id": "REPAIR-FR-01", "title": "One active booking per visitor", "text": "The visitor may have at most one active booking. Awaiting approval, In progress, and Ready are active. Collected and Cancelled are terminal and allow a new booking. A review hold is not yet a booking; only one review hold may exist for the visitor."}, {"id": "REPAIR-FR-02", "title": "Fixed repair catalogue and skills", "text": "Bicycle tune-up is SGD 15, requires cycle skill, and reserves one brake pad. Lamp switch replacement is SGD 20, requires electrical skill, and reserves one switch. Mira is cycle-only and Jules is electrical-only. No substitute repair, technician skill, or part is inferred."}, {"id": "REPAIR-FR-03", "title": "Technician slot capacity", "text": "The fictional day has 09:00 and 10:00 slots. A technician can serve one job per slot. Holds and confirmed bookings occupy that capacity. Completion and collection leave the used slot occupied for that day. Only an unconfirmed hold release or permitted cancellation makes its slot available again."}, {"id": "REPAIR-FR-04", "title": "Part reservation and consumption", "text": "Starting stock is two brake pads and one switch. Free stock equals starting stock minus held, reserved, and consumed quantities. Review holds one required part; confirmation converts that hold to a booking reservation without reserving another. Completion consumes the reserved part exactly once. Declining approval or cancelling before work releases the reservation."}, {"id": "REPAIR-FR-05", "title": "Review holds expire after 120 seconds", "text": "Entering review acquires a compatible free technician slot and one free required part together for 120 seconds. If either is unavailable, acquire neither. An existing active review must be confirmed or cancelled before another selection can enter review. To change the selection, cancel review first; that releases its part and slot, after which the new choice is checked independently. At or after the expiry instant the hold is invalid, releases both resources, and cannot be confirmed; a new availability check is required."}, {"id": "REPAIR-FR-06", "title": "Confirmation creates Awaiting approval", "text": "Confirmation succeeds only for a valid unexpired hold and a visitor without an active booking. It converts the existing hold to one booking in Awaiting approval. The slot and part remain reserved. Repeating confirmation for that same hold returns the existing booking and does not create another."}, {"id": "REPAIR-FR-07", "title": "Approval records consent before work", "text": "Approving an Awaiting approval booking records affirmative consent and changes it to In progress. Declining approval follows the cancellation rule. Work cannot start from review, an expired hold, Cancelled, Collected, or Ready. Repeating an already recorded approval makes no additional change."}, {"id": "REPAIR-FR-08", "title": "Complete then hand over", "text": "Complete is allowed only from In progress and consumes the reserved part once while changing the booking to Ready. Handover is allowed only from Ready and changes it to Collected. Repeated Complete on Ready or Collected and repeated Handover on Collected return the established result without consuming resources or reopening the job."}, {"id": "REPAIR-FR-09", "title": "Cancel before work only", "text": "Cancel and decline approval are allowed only from Awaiting approval. They mark the booking Cancelled and release its reserved part and technician slot. Cancellation is prohibited from In progress, Ready, and Collected. Repeating cancellation on Cancelled returns its existing result without adding stock again."}, {"id": "REPAIR-FR-10", "title": "Guard all transitions and repeated actions", "text": "Every action validates the current workflow state and resource ownership at the moment it runs. A repeated action for the same hold or booking must not create a second reservation, second booking, second stock consumption, or duplicate consent event. Prohibited transitions leave state and resource counts unchanged and explain the allowed next step."}], "journeys": [{"title": "Bicycle repair from choice to collection", "steps": ["Choose Bicycle tune-up and Mira at 09:00.", "Review the SGD 15 price and the 120-second hold on Mira's slot plus one brake pad.", "Confirm before expiry to create Awaiting approval.", "Record the visitor's affirmative approval to start In progress.", "Mark the job complete to consume one brake pad and make it Ready.", "Record handover to make it Collected; a new booking is now allowed."], "success": "Exactly one booking reaches Collected, one brake pad is consumed, one brake pad remains free, and Mira's 09:00 slot remains used.", "failure": "If the hold expires before confirmation, no booking is created and its slot and part are released. A new review must recheck availability."}, {"title": "Lamp booking declined before work", "steps": ["Choose Lamp switch replacement and Jules at 10:00.", "Review the SGD 20 price and hold one switch with Jules's slot.", "Confirm while the hold is valid.", "Decline approval while the booking is Awaiting approval.", "Inspect the Cancelled record and the released switch and slot."], "success": "The booking remains Cancelled, free switches return to one, Jules's 10:00 slot becomes free, and the visitor can begin another booking.", "failure": "Decline is rejected after work has started. The workflow provides no cancellation path from In progress, Ready, or Collected."}, {"title": "Unavailable resource without a partial hold", "steps": ["Use a clearly labelled fixture with a Collected lamp job at Jules 09:00: its switch is consumed, zero switches are free, and Jules 10:00 remains free.", "Choose Lamp switch replacement at Jules 10:00; the Collected job no longer counts as active.", "Attempt to enter review.", "Inspect the shortage message and confirm that Jules 10:00 remains free and no hold was created."], "success": "Review is refused because the only switch was consumed by the Collected job. Jules 10:00 remains free, the old 09:00 slot remains used, and stock remains one consumed switch with zero free, held, or reserved switches.", "failure": "Reserving Jules 10:00 despite the part shortage would create a partial hold and violate the all-or-nothing review rule. The Collected job must not be mistaken for an active booking."}], "stages": [{"id": "requirements", "focus": "Turn a friendly repair idea into precise promises about choices, capacity, consent, and status.", "example": "REPAIR-FR-05 explains exactly when a hold expires; REPAIR-FR-09 limits cancellation to Awaiting approval.", "evidence": "Planned review of the rule register, assumption log, and 18 test cases; no stakeholder approval has yet been recorded.", "decision": "Agree that Ready remains active and that Collected permits the next booking while preserving the used slot.", "practice": "Practice 1: Predict the resource ledger."}, {"id": "design", "focus": "Represent slots, stock, holds, and bookings so every transition has a clear resource effect.", "example": "Confirmation converts an existing hold into a reservation; completion changes reserved stock to consumed stock.", "evidence": "Proposed state table, data model, failure contract, and concurrency review.", "decision": "Use one guarded state update for each action so the prototype never exposes a half-reserved review.", "practice": "Practice 1: Predict the resource ledger."}, {"id": "development", "focus": "Implement the agreed behavior in small reviewable changes.", "example": "A repeated Complete action returns the existing Ready or Collected result and does not subtract another part.", "evidence": "Planned code review and build record; no implementation or successful build is asserted by these documents.", "decision": "Keep catalogue data and transition rules explicit, and keep all balances of stock derivable from the ledger.", "practice": "Practice 2: Challenge a repeated action."}, {"id": "testing", "focus": "Use boundary, resource, and sequence cases to challenge the workflow.", "example": "Attempt confirmation immediately before the deadline and exactly at it; inspect booking and resource changes.", "evidence": "Eighteen specified cases plus an exploratory charter and accessibility review, all awaiting execution.", "decision": "Judge each result from the rule and ledger, not only the visible success message.", "practice": "Practice 2: Challenge a repeated action."}, {"id": "deployment", "focus": "Publish a clearly labelled workflow demonstration only when appropriate checks have evidence.", "example": "The launch review checks fictional data, scope wording, expiry behavior, and a recovery route to a previous demo release.", "evidence": "Proposed readiness checklist, release notes, user guidance, and deployment plan.", "decision": "Do not describe a demo release as a functioning repair, payment, or safety service.", "practice": "Practice 3: Make the release decision."}, {"id": "maintenance", "focus": "Keep the rule explanations, dependencies, and demonstration behavior consistent as changes arrive.", "example": "A request for a second simultaneous job needs a documented rule change and revised capacity tests.", "evidence": "Planned service measures, incident record, maintenance schedule, and change assessment.", "decision": "Preserve completed and cancelled history within the session; reset deliberately restores the whole fictional starting state.", "practice": "Practice 3: Make the release decision."}], "exercises": [{"title": "Practice 1: Predict the resource ledger", "prompt": "Starting with two brake pads and one switch, review and confirm a Bicycle tune-up at Mira 09:00. Then decline approval. Describe the part and slot state at review, after confirmation, and after decline.", "answer": "Review holds one brake pad and Mira 09:00, leaving one brake pad free. Confirmation converts the same part hold to a booking reservation and leaves free stock unchanged. Decline marks that booking Cancelled, releases its part and slot, restores two free brake pads, and allows another booking. No part was consumed."}, {"title": "Practice 2: Challenge a repeated action", "prompt": "A lamp booking has been approved and is In progress with one switch reserved. Complete is clicked twice, handover is recorded, and Complete is clicked again. What should change and what must remain unchanged?", "answer": "The first Complete consumes the reserved switch and makes the booking Ready. The second returns the established Ready result without further consumption. Handover makes it Collected. The last Complete returns the established completed result without reopening the job. Switches remain zero free and one consumed; Jules's slot stays used; the visitor can book another eligible job."}, {"title": "Practice 3: Make the release decision", "prompt": "A proposed demo release has attractive screens and passing ordinary booking checks, but no evidence for expiry at exactly 120 seconds, repeated completion, or keyboard approval. What should the readiness record say?", "answer": "Record those checks as unverified and keep release readiness pending under the proposed gates. Assign owners to run the targeted cases and keyboard journey, preserve their evidence, and review any defects. Do not turn a plan into a claimed pass or approval. A later decision must identify the tested revision and explicitly state any accepted limitations."}], "documents": [{"id": "stakeholders", "title": "Stakeholder map", "stage": "requirements", "what": "People affected by the proposed repair workflow and the decisions they own.", "why": "Prevent slot, stock, and consent rules being decided without the relevant perspective.", "who": "Product owner with visitor, coordinator, and technician representatives.", "when": "Before agreeing scope and whenever a rule changes.", "where": "Case workspace beside the rule register.", "which": "Visitor clarity, practical coordination, compatible skills, and evidence ownership.", "how": "Discuss one complete repair journey and record unresolved decisions.", "sections": [{"heading": "Decision boundaries", "text": "The visitor controls consent to begin work. The coordinator can record that choice but cannot infer approval from confirmation. Technician skills are fixed for the demo. The product owner resolves scope questions; this document records proposed responsibilities, not approvals."}, {"heading": "Contributions to request", "columns": ["Participant", "Question to resolve", "Planned evidence"], "rows": [["Visitor representative", "Can I tell booking confirmation from approval to begin work?", "Observed explanation of the review and approval screens"], ["Coordinator representative", "Can I understand expiry and resource release?", "Walkthrough of cancel, decline, and expired hold"], ["Technician representative", "Is assignment limited to the stated skills?", "Review of Mira and Jules compatibility examples"]]}, {"heading": "Open discussion", "text": "Ask whether the terminal-state wording is understandable: Ready still occupies the visitor's active job, Collected allows another job, and neither completion nor collection reopens the used slot. Capture objections with an owner before changing the rules."}]}, {"id": "brd", "title": "Business requirements document", "stage": "requirements", "what": "The proposed benefit, scope, and operating boundaries of Second Spark.", "why": "Connect workflow choices to a clear community-service purpose.", "who": "Product owner drafts; stakeholder representatives review.", "when": "At case initiation and after a material scope decision.", "where": "Case workspace under requirements.", "which": "Transparent booking, fair resource use, explicit consent, and clear collection status.", "how": "Compare every proposed feature with the stated benefit and exclusions.", "sections": [{"heading": "Business problem and intended benefit", "text": "A small repair hub needs a clear way to coordinate limited skills, appointment capacity, and parts. The intended benefit is that a visitor understands what has been booked and whether work has begun, while the coordinator avoids promising resources twice. This is an educational workflow demonstration, not an operating repair service."}, {"heading": "Proposed business boundaries", "columns": ["Area", "Included", "Excluded"], "rows": [["Booking", "One active job and a 120-second review hold", "Real customer identity and multi-location scheduling"], ["Resources", "Two repair types, two technicians, four technician slots", "Supplier ordering and real inventory assurance"], ["Work", "Approval, In progress, Ready, and Collected status", "Diagnosis, repair instructions, and actual safety certification"]]}, {"heading": "Decision and success evidence", "text": "The proposed scope succeeds when planned checks demonstrate valid state transitions and conserved resources, and users can explain confirmation versus approval. A real service proposal would need qualified safety processes and additional controls assessed independently; this demo cannot establish those capabilities."}]}, {"id": "mrd", "title": "Market and audience needs brief", "stage": "requirements", "what": "A hypothesis about the audience and alternatives for this fictional community hub.", "why": "Avoid presenting invented market demand as established research.", "who": "Product owner and researcher.", "when": "Before expanding beyond the fixed demonstration.", "where": "Case workspace with audience assumptions.", "which": "Visitors with limited time, coordinators tracking capacity, and technicians receiving suitable work.", "how": "Label hypotheses and plan interviews about current coordination practices.", "sections": [{"heading": "Audience hypothesis", "text": "The proposed audience includes community visitors deciding whether to leave an item and volunteers coordinating limited resources. Their likely questions are whether the right person is available, what the listed repair costs, and whether they can decline before work. These are hypotheses to investigate, not findings from completed interviews."}, {"heading": "Alternatives to investigate", "columns": ["Current approach", "Potential strength", "Question for research"], "rows": [["Paper appointment sheet", "Easy to see in one place", "How are parts and skill compatibility checked?"], ["Telephone coordination", "A person can clarify uncertainty", "How are choices and consent recorded consistently?"], ["Shared calendar", "Shows occupied times", "How are part shortages and job states represented?"]]}, {"heading": "Research decision", "text": "Interview a varied set of prospective visitors and coordinators using recent examples. Ask what they currently do when a resource is unavailable or someone changes their mind. Use the findings to revise the audience hypothesis before claiming a market opportunity or proposing additional features."}]}, {"id": "prd", "title": "Product requirements document", "stage": "requirements", "what": "The specific product behavior and scope for the proposed browser demonstration.", "why": "Give reviewers a common view of the complete experience.", "who": "Product owner with design, development, and testing contributors.", "when": "After the initial needs discussion and before implementation.", "where": "Case workspace; links to REPAIR-FR-01 through REPAIR-FR-10.", "which": "The choose, review, confirm, approve, complete, and collect journey.", "how": "Define the main journey, alternate outcomes, and evidence needed to accept it.", "sections": [{"heading": "Product proposition", "text": "Second Spark shows how a repair booking moves through explicit commitments. Review temporarily holds capacity and a part. Confirmation creates Awaiting approval, while a later affirmative approval starts work. Completion consumes the part and makes the item Ready; handover makes it Collected."}, {"heading": "Experience priorities", "columns": ["Priority", "Behavior", "Reason"], "rows": [["Essential", "Compatible slot and part acquired together", "Avoid promises the hub cannot support"], ["Essential", "Approval distinct from booking confirmation", "Keep consent visible"], ["Essential", "Expiry and cancellation release resources correctly", "Keep availability understandable"], ["Later proposal", "Notifications or real payments", "Outside the fixed demo scope"]]}, {"heading": "Acceptance boundary", "text": "All ten functional rules require planned evidence. The demo starts from fixed fictional records and retains changes only in memory. Publication must retain the workflow-only scope statement; a polished interface does not establish real repair, identity, safety, payment, or inventory controls."}]}, {"id": "crd", "title": "Customer requirements document", "stage": "requirements", "what": "The visitor's needs stated as clear promises about the repair journey.", "why": "Keep internal resource rules connected to what the visitor can understand.", "who": "Researcher and product owner, with planned visitor review.", "when": "Before finalizing interaction wording.", "where": "Case workspace beside the proposed user journey.", "which": "Choice clarity, transparent price, reversible waiting, consent, and collection.", "how": "Translate each need into an observable behavior and link it to a rule.", "sections": [{"heading": "Visitor perspective", "text": "The visitor needs to know which repair is being requested, who can handle it, when it is scheduled, and the displayed price. They also need to understand that review is temporary, confirmation does not start work, and declining before work returns the slot and part."}, {"heading": "Needs translated into behavior", "columns": ["Visitor need", "Visible behavior", "Rule"], "rows": [["I want to check before committing", "Review shows repair, technician, time, price, and hold expiry", "REPAIR-FR-05"], ["I want to decide whether work begins", "Awaiting approval offers approve or decline", "REPAIR-FR-07"], ["I want to know when I can collect", "Completion displays Ready; handover displays Collected", "REPAIR-FR-08"]]}, {"heading": "Questions for validation", "text": "Ask prospective visitors to explain the consequence of each action in their own words. Investigate any confusion between cancel and handover, or between a displayed price and payment. No customer feedback has yet been gathered for this proposed document."}]}, {"id": "srs", "title": "Software requirements specification", "stage": "requirements", "what": "A precise description of states, inputs, outputs, and invariants.", "why": "Make the fixed rules implementable and independently testable.", "who": "Developer, reviewer, and test reviewer.", "when": "Before coding and after approved requirement changes.", "where": "Case workspace with the functional rule register.", "which": "All ten REPAIR-FR rules, fixed catalogue data, and in-memory scope.", "how": "Inspect each action against its preconditions, effects, and rejection behavior.", "sections": [{"heading": "State model", "text": "A valid hold precedes a booking and lasts 120 seconds. Booking states are Awaiting approval, In progress, Ready, Collected, and Cancelled. Only the first three are active for the visitor. Expired holds never become bookings. The system checks expiry at action time, so a stale display of the expiry time cannot extend a hold."}, {"heading": "Core invariants", "columns": ["Invariant", "Meaning", "Failure response"], "rows": [["Stock conservation", "Starting equals free plus held plus reserved plus consumed", "Reject invalid update and preserve prior state"], ["Slot exclusivity", "Each technician-time pair has at most one occupying hold or booking", "Refuse conflicting review"], ["Visitor limit", "At most one active booking and one review hold per visitor", "Explain the existing commitment"], ["Consent before work", "In progress requires affirmative recorded approval", "Reject start from any other state"]]}, {"heading": "Interface behavior", "text": "Every mutation returns the resulting state or an explicit unchanged-state reason. Prices are fixed informational values, and the model uses no actual payment. For a real shared service, server-side ownership, atomic persistence, authorization, and safety procedures would need separate specification; they are not provided by the browser model."}]}, {"id": "frd", "title": "Functional requirements document", "stage": "requirements", "what": "The allocation and transition rules grouped by functional responsibility.", "why": "Keep behavior precise while avoiding duplicate contradictory rules.", "who": "Product owner owns rules; developers and testers use them.", "when": "At specification baseline and when a change request is accepted.", "where": "Case workspace; the top-level rules remain authoritative.", "which": "REPAIR-FR-01 through REPAIR-FR-10 without renumbering.", "how": "Group rules into workflows and derive tests from their observable effects.", "sections": [{"heading": "Rule ownership and stability", "text": "The ten REPAIR-FR identifiers are stable references. New wording must preserve their agreed meaning unless a change request explicitly updates the baseline and downstream evidence. The document does not treat a planned review as stakeholder acceptance."}, {"heading": "Functional groups", "columns": ["Group", "Rules", "Required result"], "rows": [["Eligibility and capacity", "REPAIR-FR-01, REPAIR-FR-02, REPAIR-FR-03", "Only one active visitor job with compatible exclusive capacity"], ["Stock and review", "REPAIR-FR-04, REPAIR-FR-05", "Part and slot held together, then released or converted"], ["Consent and work", "REPAIR-FR-06, REPAIR-FR-07, REPAIR-FR-08", "Confirmation, approval, completion, and handover remain distinct"], ["Cancellation and repeats", "REPAIR-FR-09, REPAIR-FR-10", "Only permitted reversals occur and repeats have no duplicate effects"]]}, {"heading": "Ambiguities resolved for this case", "text": "Ready remains active until handover. A completed slot stays used for the fictional day. Confirming at the exact expiry instant fails. Changing a selection requires cancelling the current review first; trying to begin another review before that leaves the existing hold unchanged. Decline is the same state and resource transition as cancellation."}]}, {"id": "quality-requirements", "title": "Quality requirements", "stage": "requirements", "what": "Proposed expectations for clarity, accessibility, correctness, and responsiveness.", "why": "Ensure the demonstration is assessed beyond the happy path.", "who": "Product owner and relevant reviewers.", "when": "During requirements and at readiness review.", "where": "Case workspace; results belong in later evidence records.", "which": "The browser workflow under stated test conditions, not production service guarantees.", "how": "Specify observable scenarios and record conditions before executing checks.", "sections": [{"heading": "Quality scope", "text": "The highest priority is understandable, consistent state. A visitor should be able to tell whether resources are temporarily held, booked, consumed, or released. Proposed responsiveness checks use a recorded local browser and device; they cannot establish server throughput or real hub capacity."}, {"heading": "Proposed quality scenarios", "columns": ["Quality", "Scenario", "Planned evidence"], "rows": [["Accessibility", "Keyboard user reviews, confirms, approves, and collects", "Manual journey notes and focus observations"], ["Correctness", "A repeated completion does not consume twice", "Before-and-after part ledger"], ["Clarity", "Visitor distinguishes confirmation from approval", "Observed explanation of action consequences"], ["Resilience", "Expired review cannot confirm from stale screen", "Clock-controlled boundary case"]]}, {"heading": "Decision criteria", "text": "Treat incorrect stock, duplicate bookings, or prohibited transitions as release-blocking under the proposed gate. Accessibility and wording issues require severity assessment with evidence. No numeric performance target or universal accessibility conformance claim is invented here; the team must agree and test the intended conditions."}]}, {"id": "technical-requirements", "title": "Technical requirements", "stage": "requirements", "what": "Implementation constraints needed for the specified in-memory model.", "why": "Make the demonstration's guarantees and limitations explicit.", "who": "Developer and technical reviewer.", "when": "Before implementation and during architecture review.", "where": "Case workspace with the proposed data model.", "which": "Browser memory, deterministic fixtures, guarded mutations, and explicit expiry times.", "how": "Translate invariants into narrow functions that can be inspected and exercised.", "sections": [{"heading": "Proposed runtime", "text": "Keep catalogue, technicians, slots, stock, holds, bookings, and consent events in one in-memory state model. A time provider supplies the current instant for expiry comparisons and can be controlled during tests. Refreshing or deliberately resetting starts a new fictional session; the demo offers no durable booking service."}, {"heading": "Implementation constraints", "columns": ["Constraint", "Purpose", "Check to plan"], "rows": [["Expiry timestamp stored with hold", "Enforce 120 seconds at action time", "Compare before, at, and after the deadline"], ["Stable hold and booking identifiers", "Recognize repeated actions", "Repeat confirm and complete against the same record"], ["Single guarded mutation path", "Avoid partial resource updates", "Inspect failure branches for unchanged state"], ["Catalogue values kept explicit", "Prevent inferred skills, parts, or prices", "Review exact fixed data"]]}, {"heading": "Real-service boundary", "text": "The browser is under the user's control. A real service would require authenticated requests, server-side permission checks, persistent transactions, reliable time, and operational oversight. These are proposed future concerns and must never be implied by a disabled button or a successful local simulation."}]}, {"id": "backlog", "title": "Prioritized product backlog", "stage": "requirements", "what": "Small proposed work items tied to the repair rules.", "why": "Sequence delivery so state integrity exists before polish.", "who": "Product owner orders; delivery contributors estimate and implement.", "when": "Before work starts and after new evidence.", "where": "Case workspace with rule links and planned acceptance cases.", "which": "Only the fixed demo scope and necessary explanation.", "how": "Build vertical slices and keep each item's completion dependent on actual evidence.", "sections": [{"heading": "Ordering rationale", "text": "Start with explicit catalogue data and the resource ledger, then add review, confirmation, consent, work, and terminal states. Add presentation and accessibility alongside each slice. Avoid a complete-looking interface that relies on unimplemented resource rules."}, {"heading": "Initial proposed backlog", "columns": ["Order", "Work item", "Acceptance focus"], "rows": [["1", "Catalogue and compatible technician selection", "REPAIR-FR-02"], ["2", "Atomic review hold and 120-second expiry", "REPAIR-FR-03, REPAIR-FR-04, REPAIR-FR-05"], ["3", "Confirmation and visitor active-job limit", "REPAIR-FR-01, REPAIR-FR-06"], ["4", "Approval, completion, and handover", "REPAIR-FR-07, REPAIR-FR-08"], ["5", "Cancellation and repeat safeguards", "REPAIR-FR-09, REPAIR-FR-10"], ["6", "Keyboard journey and scope wording", "Quality requirements and readiness review"]]}, {"heading": "Completion convention", "text": "Items begin as proposed, not done. Completion requires the changed behavior, relevant checks, and review evidence tied to a build revision. Notification delivery, real payments, repair guidance, and additional skills or parts remain outside this backlog unless separately authorized through a scope change."}]}, {"id": "rtm", "title": "Requirements traceability matrix", "stage": "requirements", "what": "Links between each functional rule, design responsibility, and planned test evidence.", "why": "Expose missing coverage and the impact of a rule change.", "who": "Test reviewer maintains; product owner reviews coverage.", "when": "At baseline, after changes, and before readiness review.", "where": "Case workspace beside the rule register and test cases.", "which": "The ten stable REPAIR-FR identifiers and eighteen REPAIR-TC cases.", "how": "Follow each rule forward to behavior and backward from a failing case.", "sections": [{"heading": "Traceability convention", "text": "A link means a test is planned to examine a requirement; it does not mean the rule has passed. The test-case document defines the exact actions and expected results. Design responsibilities identify where a change needs review when a requirement changes."}, {"heading": "Coverage map", "columns": ["Requirement", "Design responsibility", "Planned cases"], "rows": [["REPAIR-FR-01", "Visitor active-state selector", "REPAIR-TC-03, REPAIR-TC-17"], ["REPAIR-FR-02", "Catalogue and skill compatibility", "REPAIR-TC-01, REPAIR-TC-02"], ["REPAIR-FR-03", "Technician-slot ownership", "REPAIR-TC-04, REPAIR-TC-06, REPAIR-TC-13"], ["REPAIR-FR-04", "Part ledger and reservation conversion", "REPAIR-TC-05, REPAIR-TC-06, REPAIR-TC-16, REPAIR-TC-17"], ["REPAIR-FR-05", "Hold allocator and expiry guard", "REPAIR-TC-06, REPAIR-TC-07, REPAIR-TC-08, REPAIR-TC-09, REPAIR-TC-10"], ["REPAIR-FR-06", "Confirm transition", "REPAIR-TC-08, REPAIR-TC-11"], ["REPAIR-FR-07", "Consent event and approval transition", "REPAIR-TC-12, REPAIR-TC-14, REPAIR-TC-18"], ["REPAIR-FR-08", "Complete and handover transitions", "REPAIR-TC-16, REPAIR-TC-17, REPAIR-TC-18"], ["REPAIR-FR-09", "Cancel and decline transitions", "REPAIR-TC-13, REPAIR-TC-14, REPAIR-TC-15"], ["REPAIR-FR-10", "Guarded and repeat-safe actions", "REPAIR-TC-07, REPAIR-TC-11, REPAIR-TC-12, REPAIR-TC-13, REPAIR-TC-17, REPAIR-TC-18"]]}, {"heading": "Review use", "text": "When a rule changes, inspect every listed design responsibility and test case before accepting the change. Also inspect narrative documents and user guidance; traceability to tests does not catch contradictory wording elsewhere. Record unexecuted coverage as planned rather than counting it as verified."}]}, {"id": "hld", "title": "High-level design", "stage": "design", "what": "A proposed view of the demo's major responsibilities and data flow.", "why": "Make the archi
