"id": "quiz-62", "rationale": "Tools can reduce mistakes and accelerate work, but cannot guarantee correctness. An automated test may pass while missing a requirement that was never included in the test. Inputs, configuration and human review still matter.", "stage": "requirements", "correct": [1]}, {"slide": 63, "classification": "Correct", "issue": "“Voice of the end-user” is not a universal definition unique to an FRD. SRD/ARD are unexplained and give weak discrimination.", "question": "In this lesson, which document describes detailed functional behaviour and user interactions?", "options": ["BRD", "FRD", "RTM"], "answer": "B — FRD", "notes": "In this deck, FRD details required functions and interactions. An SRS can also include functional requirements; FRD is not the only way to capture the user perspective. BRD emphasises business needs; RTM records links.", "lesson": "55–58", "source": "", "id": "quiz-63", "rationale": "In this lesson, the FRD describes functional behaviour and user interactions. For example, it states what happens when a user selects a product or submits an invalid quantity. Organisations may record the same information under other document names.", "stage": "requirements", "correct": [1]}, {"slide": 80, "classification": "Keep", "issue": "The intended B answer is clear and aligned. “Writing and coding source code” in A can optionally become “Writing production source code”.", "question": "What is the primary objective of the design phase?", "options": ["Writing and coding source code", "Creating a detailed system specification/blueprint", "Gathering user requirements"], "answer": "B — Creating a detailed system specification/blueprint", "notes": "Design describes a proposed solution and its important decisions. The answer is about the primary objective, not a claim that all other activities are forbidden during design.", "lesson": "70–73", "source": "", "id": "quiz-80", "rationale": "Design primarily develops a specification or blueprint for the solution. Writing production code is an implementation activity, although design can involve prototypes. For example, a checkout flow can be explored before the production feature is built.", "stage": "design", "correct": [1]}, {"slide": 81, "classification": "Correct", "issue": "Code documentation is also a questionable design deliverable, and tests can be designed early. The current single correct answer D is not secure.", "question": "Which item is primarily an implementation output rather than a design deliverable?", "options": ["System architecture diagram", "User interface prototype", "Detailed component design", "Production source code implementing a feature"], "answer": "D — Production source code implementing a feature", "notes": "A, B and C describe or explore the solution. D implements it. Small coded prototypes may support design; the qualifier “primarily” avoids a rigid phase boundary.", "lesson": "70, 72–73; early testing discussed in 93, 105", "source": "", "id": "quiz-81", "rationale": "Production source code implementing the feature is the primary implementation output in this question. Architecture diagrams, component designs and interface prototypes support design. A prototype may itself contain code without being the final production implementation.", "stage": "design", "correct": [3]}, {"slide": 82, "classification": "Minor", "issue": "The True key is defensible, but the statement sounds as though every process must produce a separate LLD document.", "question": "Low-level design (LLD) describes components in enough detail to support implementation.", "options": ["True", "False"], "answer": "True", "notes": "LLD concerns component-level decisions. The required documentation format and amount depend on the project; a separate formal document is not universally mandatory.", "lesson": "70, 73", "source": "", "id": "quiz-82", "rationale": "LLD provides enough detail to guide implementation of components. For example, it can specify input validation, processing rules and error responses for order submission. The appropriate detail depends on the work and the team's needs.", "stage": "design", "correct": [0]}, {"slide": 83, "classification": "Minor", "issue": "The answer B is correct. Remove “by contrast” without an immediate antecedent and the informal altitude expression.", "question": "Which design level describes the overall structure, major components and their relationships?", "options": ["LLD", "HLD", "SRS"], "answer": "B — HLD (High-Level Design)", "notes": "HLD addresses overall organisation; LLD supplies component detail. SRS describes required software behaviour and qualities.", "lesson": "70, 73", "source": "", "id": "quiz-83", "rationale": "HLD describes major components, their responsibilities and relationships. An overview connecting an order service, payment provider and stock store belongs at this level. Individual validation steps belong in more detailed design.", "stage": "design", "correct": [1]}, {"slide": 84, "classification": "Correct", "issue": "Repeats slide 80; reuse for the existing design-evaluation point.", "question": "Evaluating design models helps check whether the proposed solution meets the software requirements.", "options": ["True", "False"], "answer": "True", "notes": "A design model should be assessed against the agreed requirements. This helps reveal gaps and unsuitable decisions before implementation. Design evaluation provides evidence, not a guarantee of future implementation quality.", "lesson": "72", "source": "", "id": "quiz-84", "rationale": "Evaluating design models helps identify gaps before implementation. A review might reveal that the proposed order flow has no response for unavailable stock. This reduces risk but does not prove the completed software will be correct.", "stage": "design", "correct": [0]}, {"slide": 94, "classification": "Minor", "issue": "Answer C is correct but “writing and coding” is redundant and understates the development outcome.", "question": "In the development phase, what is the primary goal of the team?", "options": ["Testing the software", "Designing the user interface", "Implementing working software", "Documenting requirements"], "answer": "C — Implementing working software", "notes": "Development combines implementation with review, verification, unit testing and debugging, as slide 88 states. “Primary” does not exclude those supporting activities.", "lesson": "86, 88–93", "source": "", "id": "quiz-94", "rationale": "The primary development goal is implementing working software. Coding is accompanied by testing, review and debugging rather than treated as sufficient by itself. For example, an order feature must produce the intended result, not simply compile successfully.", "stage": "development", "correct": [2]}, {"slide": 95, "classification": "Keep", "issue": "Answer D is correct and cleanly distinguishes test scope. Standardise “unit testing” capitalisation if doing a polish pass.", "question": "What is the specific purpose of unit testing during development?", "options": ["To test the integration of different software modules", "To verify the functionality of the entire system", "To validate user requirements", "To test individual software components in isolation"], "answer": "D — To test individual software components in isolation", "notes": "The target is an individual component; integration testing examines interactions. Isolation may require a suitable harness or substitutes for dependencies.", "lesson": "90–91; reinforced by 111", "source": "[ISTQB CTFL 4.0.1](https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf) — section 2.2.1", "id": "quiz-95", "rationale": "Unit testing checks a separately testable component, often controlling or replacing its external dependencies. A tax-calculation function can be checked with known inputs and expected results. That does not establish whether the full checkout integrates it correctly.", "stage": "development", "correct": [3]}, {"slide": 96, "classification": "Optional substitution", "issue": "The original C answer is correct, but the question repeats slide 94 almost exactly. This small substitution uses the already-taught TDD topic.", "question": "In TDD, what is normally written before the implementation of the next small behaviour?", "options": ["The final user manual", "The production deployment announcement", "An automated test for that behaviour", "The complete design of every future feature"], "answer": "C — An automated test for that behaviour", "notes": "First establish a failing test, then implement enough to pass and refactor while tests remain passing. This applies to the next increment, not writing every test before any code.", "lesson": "93", "source": "[ISTQB CTFL 4.0.1](https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf) — section 2.1.3", "id": "quiz-96", "rationale": "TDD begins the next small behaviour with an automated test, which should initially fail for the intended reason. For example, a test specifies that an expired reservation cannot be confirmed before the corresponding behaviour is implemented.", "stage": "development", "correct": [2]}, {"slide": 97, "classification": "Correct", "issue": "“As early as possible” does not uniquely identify unit testing; regression checks may also run early. It duplicates slide 95.", "question": "After two separately tested modules are connected, which testing checks their interaction?", "options": ["System testing", "Integration testing", "Acceptance testing", "Unit testing"], "answer": "B — Integration testing", "notes": "The target is the interface and behaviour between the connected components. This is component integration testing, not a repeat of each component in isolation. Update the old D key.", "lesson": "91 introduces both forms; 111 later reinforces the distinction", "source": "[ISTQB CTFL 4.0.1](https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf) — section 2.2.1", "id": "quiz-97", "rationale": "Integration testing checks how connected components work together. A stock service and order service may each pass unit tests but disagree about the format of a reservation identifier. Their interaction requires its own checks.", "stage": "development", "correct": [1]}, {"slide": 98, "classification": "Correct", "issue": "A DBMS can support software construction; it is not a generally invalid member of a development toolchain.", "question": "Which tool primarily stores, queries and manages persistent application data?", "options": ["Integrated Development Environment (IDE)", "Version control system (VCS)", "Database management system (DBMS)"], "answer": "C — Database management system (DBMS)", "notes": "A DBMS manages application data. IDEs primarily support code creation/debugging; VCS tracks versioned changes. Asking primary purpose avoids the false exclusion.", "lesson": "90; connects with data persistence in 74", "source": "[PostgreSQL: application and database functions](https://www.postgresql.org/about/)", "id": "quiz-98", "rationale": "A DBMS manages persistent application data through storage, queries and related controls. For example, it holds order records that remain after an application restarts. An IDE supports development work, while version control records revisions to project files.", "stage": "development", "correct": [2]}, {"slide": 129, "classification": "Correct", "issue": "The existing answer combines testing with fixing. It also treats finding bugs as the only testing objective.", "question": "What is a key objective of software testing?", "options": ["Writing production source code", "Evaluating software quality and revealing defects", "Gathering user requirements", "Designing the user interface"], "answer": "B — Evaluating software quality and revealing defects", "notes": "Testing provides evidence. Repairing the cause is debugging; subsequent tests evaluate the repair. Keep the distinction even when one person performs both activities.", "lesson": "103–105, 116–119", "source": "[ISTQB CTFL 4.0.1](https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf) — sections 1.1.1–1.1.2", "id": "quiz-129", "rationale": "Testing evaluates quality and reveals defects. For example, submitting an invalid quantity checks whether actual behaviour matches the agreed rule. Investigating and correcting the cause is debugging, followed by suitable checks of the change.", "stage": "testing", "correct": [1]}, {"slide": 130, "classification": "Minor", "issue": "D is a defensible typical answer, but artifact purpose is clearer than assuming which team is allowed to create it.", "question": "Which artifact is primarily guidance for end users rather than testware?", "options": ["Test plan", "Test cases", "Test results", "User manual"], "answer": "D — User manual", "notes": "Tests can review manuals, and team responsibilities can overlap. The question classifies the artifact’s purpose rather than imposing an ownership rule.", "lesson": "105, 113–119; later deployment guidance 139", "source": "", "id": "quiz-130", "rationale": "A user manual primarily guides end users, while test plans, cases and results support testing. A manual may itself be reviewed or tested, but that does not change its primary purpose in this question.", "stage": "testing", "correct": [3]}, {"slide": 131, "classification": "Correct", "issue": "“Bugs and successful code” is not a reliable pair of test outputs. A sound test run may find no new defect; testing does not manufacture working code.", "question": "Which pair records test outcomes and problems found?", "options": ["Test results and defect reports", "Design diagrams and user manuals"], "answer": "A — Test results and defect reports", "notes": "Results record observations; reports describe identified problems. Do not imply that every test run must find a bug or that passing results prove perfection.", "lesson": "115–119; coordinate with correction to 115", "source": "", "id": "quiz-131", "rationale": "Test results record outcomes; defect reports document problems found. If an invalid quantity is accepted, the result records the failure and the defect report explains how to reproduce it. Both records should make their relationship clear.", "stage": "testing", "correct": [0]}, {"slide": 132, "classification": "Correct", "issue": "The RTM tracks relationships; its existence does not ensure that requirements are implemented, adequately tested or satisfied.", "question": "Which statement about a Requirements Traceability Matrix (RTM) is true?", "options": ["It links requirements to tests and results to help assess coverage", "It is a visual diagram of the system architecture", "It is primarily used to manage financial risks"], "answer": "A — It links requirements to tests and results to help assess coverage", "notes": "Review the linked tests and their evidence. A missing link reveals a gap; a populated cell alone does not prove adequate coverage or a passed requirement.", "lesson": "121–127; coordinate with planned tracking-versus-guarantee corrections", "source": "[NASA: requirements management](https://www.nasa.gov/reference/6-2-requirements-management/)", "id": "quiz-132", "rationale": "An RTM links requirements to tests and evidence to support coverage assessment. A quantity rule with linked but unexecuted tests is not yet verified by those tests. The matrix should be read alongside execution results and remaining risks.", "stage": "testing", "correct": [0]}, {"slide": 133, "classification": "Correct", "issue": "“To discovery” is a grammar error; running software describes dynamic testing, not all testing. The item also repeats slide 129.", "question": "What can we conclude when all selected tests pass?", "options": ["The software is perfect and ready for every use", "The tested cases met expected results; defects may remain", "No future regression testing is needed", "All untested paths must also be correct"], "answer": "B — The tested cases met expected results; defects may remain", "notes": "Passing selected cases provides bounded evidence, not proof about every possible condition. This reuses the finite-test limitation already taught.", "lesson": "103, 108", "source": "[ISTQB CTFL 4.0.1](https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf) — section 1.3", "id": "quiz-133", "rationale": "Passing selected tests shows that their observed outcomes matched expectations under those conditions. It does not establish correctness for untested inputs, environments or interactions. For example, ordinary orders may pass while simultaneous reservations expose a defect.", "stage": "testing", "correct": [1]}, {"slide": 150, "classification": "Correct", "issue": "“Most commonly” is an unsupported popularity claim, and the original question lacks a question mark. Ask about observable behaviour.", "question": "An app store gradually offers automatic updates to a larger percentage of users. Which strategy is this?", "options": ["In-place replacement", "Phased rollout", "Blue/green environment switch"], "answer": "B — Phased rollout", "notes": "Availability is expanded over time. Apple documents this behaviour for automatic updates; manual downloads may still be possible. Do not generalise the same schedule to all app stores.", "lesson": "146", "source": "[Apple: phased app updates](https://developer.apple.com/help/app-store-connect/update-your-app/release-a-version-update-in-phases)", "id": "quiz-150", "rationale": "The app store expands availability of automatic updates over time, which is a phased rollout. This describes how users receive the release rather than how server instances are replaced. The release mechanism's controls should be understood before relying on it.", "stage": "deployment", "correct": [1]}, {"slide": 151, "classification": "Correct", "issue": "A 10/90 split alone does not uniquely distinguish canary from an experiment or a gradual blue/green switch. State the risk-checking purpose and narrow C.", "question": "A team sends 10% of traffic to a new version, checks failures, then expands only if checks pass. Which approach is this?", "options": ["Canary rollout", "Stop-all/recreate deployment", "Blue/green with one full traffic switch"], "answer": "A — Canary rollout", "notes": "The small initial exposure and health-based expansion identify canary behaviour. It can use blue/green infrastructure; the labels are not universally exclusive. A traffic ratio alone does not determine intent.", "lesson": "146–149", "source": "[AWS: canary deployments](https://docs.aws.amazon.com/whitepapers/latest/overview-deployment-options/canary-deployments.html)", "id": "quiz-151", "rationale": "The small initial traffic share and health-based expansion identify a canary rollout. For example, a rise in failed orders among that group should prompt investigation before further exposure. Merely splitting traffic does not define an A/B experiment.", "stage": "deployment", "correct": [0]}, {"slide": 152, "classification": "Correct", "issue": "“In-place” is not universally synonymous with an outage: it can be performed as a rolling update. The lesson’s particular stop-all case needs a precise label.", "question": "Which approach stops all old application instances before starting their replacements?", "options": ["Canary rollout", "Recreate (stop-all replacement)", "Blue/green deployment"], "answer": "B — Recreate (stop-all replacement)", "notes": "For this stated strategy there is an unavailable interval. In-place describes where an update occurs and can also be rolling; it does not by itself prove downtime.", "lesson": "143; coordinate the Recreate label with that lesson", "source": "[Kubernetes: deployment strategies](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy); [AWS: deployment strategies](https://docs.aws.amazon.com/whitepapers/latest/introduction-devops-aws/deployment-strategies.html)", "id": "quiz-152", "rationale": "Recreate stops the old application instances before starting replacements, so the service has an interruption during that interval. For example, a planned maintenance window may be used for the replacement and verification.", "stage": "deployment", "correct": [1]}, {"slide": 153, "classification": "Minor", "issue": "C is the intended and reasonable answer. “One at a time” is too narrow; rolling updates can use batches. Use the more widely recognised label.", "question": "Which strategy gradually replaces old instances with new ones, often in batches?", "options": ["Phased app-store release", "Blue/green with a full traffic switch", "Rolling update (ramped rollout)", "Recreate (stop-all replacement)"], "answer": "C — Rolling update (ramped rollout)", "notes": "This identifies instance replacement, not merely increasing user eligibility. Availability depends on capacity and readiness controls; gradual replacement alone does not guarantee no downtime.", "lesson": "144; coordinate the label and availability qualification", "source": "[Kubernetes: deployment strategies](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy)", "id": "quiz-153", "rationale": "Rolling updates replace old instances gradually, individually or in batches. For example, healthy instances continue serving orders while a batch is replaced and checked. This differs from an app store expanding update availability to users.", "stage": "deployment", "correct": [2]}, {"slide": 166, "classification": "Correct", "issue": "“Upstream” is not a standard maintenance process type. Its correct answer merely memorises an imprecise lesson label.", "question": "Which description best fits software maintenance?", "options": ["Hardware replacement only", "A one-off post-release check", "Customer training only", "Controlled change to existing software"], "answer": "D — Controlled change to existing software", "notes": "Maintenance can correct, adapt, improve or prevent problems. A change can require renewed analysis, design, implementation and testing; a feedback loop is not a standard “upstream” classification.", "lesson": "157–159, 163, 165", "source": "[IEEE SWEBOK Guide, software maintenance chapter](https://ieeecs-media.computer.org/media/education/swebok/swebok-v4.pdf)", "id": "quiz-166", "rationale": "Maintenance is controlled change to existing software. Correcting an order defect, adapting an integration and improving response time can all qualify. It is broader than a one-off check, hardware replacement or user training alone.", "stage": "maintenance", "correct": [3]}, {"slide": 167, "classification": "Minor", "issue": "The intended False key is defensible, but the comparison lacks a time horizon and the notes imply a universal budget share.", "question": "Maintenance costs are always lower than initial development costs.", "options": ["True", "False"], "answer": "False", "notes": "Costs depend on operational life, change scope, system condition and skills. Maintenance may be substantial; no universal percentage or ranking is established here.", "lesson": "160–162", "source": "[IEEE SWEBOK Guide, software maintenance chapter](https://ieeecs-media.computer.org/media/education/swebok/swebok-v4.pdf)", "id": "quiz-167", "rationale": "Maintenance is not always cheaper than initial development. A long-lived service may undergo many changes, while another has a short life and limited change demand. The deck's percentage chart is illustrative and should not be treated as a universal cost rule.", "stage": "maintenance", "correct": [1]}, {"slide": 168, "classification": "Minor", "issue": "False is correct. Use a statement rather than a question mark and make the rejected automatic relationship explicit.", "question": "Software automatically becomes easier to maintain as it gets older.", "options": ["True", "False"], "answer": "False", "notes": "Age alone does not establish maintainability. Documentation, architecture, tests, dependency support and available skills affect effort. Some improvements reduce effort; neglected changes can increase it.", "lesson": "162", "source": "", "id": "quiz-168", "rationale": "Age does not automatically make software easier to maintain. Documentation, modular structure and tests can help, while obsolete dependencies or lost knowledge can make changes harder. For example, an old integration with no available expertise may need substantial investigation.", "stage": "maintenance", "correct": [1]}, {"slide": 169, "classification": "Correct", "issue": "“Required” should be “requires”. Profit/loss objectives can legitimately drive software changes, so B is not a reliable incorrect option.", "question": "Which two are legitimate drivers of software maintenance? Select two.", "options": ["Changing industry requirements", "Eliminating the need for future testing", "Keeping technical teams employed", "Business or organisational changes"], "answer": "A and D", "notes": "A and D describe changes in needs or operating context. Profitability can also motivate maintenance, so the old profit/loss option should not be marked inherently invalid. The revised distractors are not sound maintenance objectives.", "lesson": "158–159", "source": "[IEEE SWEBOK Guide, software maintenance chapter](https://ieeecs-media.computer.org/media/education/swebok/swebok-v4.pdf)", "id": "quiz-169", "rationale": "Industry requirements and business or organisational changes are legitimate drivers. A revised returns policy, for example, may require new approval rules. Maintenance does not eliminate future testing, and keeping a team occupied is not a product need.", "stage": "maintenance", "correct": [0, 3]}]};

const STAGES=[
{id:'requirements',title:'Requirements',intro:'Agree on the problem and what the service must do before choosing how to build it.',slides:'40–66',who:'A business analyst facilitates. Customers, the product owner, support, operations, security and developers contribute. The accountable business owner agrees priorities.',when:'Begin before committing to a solution. Refine requirements whenever feedback or a proposed change reveals a gap.',input:'A business problem, stakeholder concerns, current processes, constraints and known risks.',output:'Agreed needs, observable requirements, acceptance criteria, assumptions and traceability.',steps:['Describe the current problem in everyday language.','Identify everyone affected, including people who do not use the screens.','Gather examples of normal use and things going wrong.','Separate what the service must do from how a proposed solution might work.','Resolve conflicting needs and agree priorities.','Record clear requirements, review them with stakeholders and track later changes.'],example:'A customer asks to “move money easily”. Clarification establishes that the first version transfers SGD between two accounts owned by the same customer. It must not permit a negative source balance. International payments are outside this example.',ask:'What does “easily” mean in an observable task?',answer:'For this case: choose the source and destination, enter an amount, review the details, confirm once and receive a receipt. Usability should also be checked with representative users.',docs:['stakeholders','brd','mrd','prd','crd','srs','frd','quality-requirements','technical-requirements','backlog','rtm'],exit:'Stakeholders can explain the agreed scope, disputed assumptions have owners, and important requirements can be checked.',risk:'A long document can still contain unclear requirements. “Secure”, “fast” and “user-friendly” need context and evidence.',refs:['nasa']},
{id:'design',title:'Design',intro:'Explain how the service will meet the requirements, including what happens when something goes wrong.',slides:'67–84',who:'Architects and technical analysts lead relevant decisions. Developers, testers, business analysts, security, operations and users review the parts that affect them.',when:'Start after enough requirements are understood. Revisit decisions when requirements, constraints or evidence change.',input:'Agreed requirements, risks, constraints, acceptance criteria and existing system knowledge.',output:'A proposed structure, detailed behaviour, screen flows, data rules, interfaces and recorded decisions.',steps:['Draw a small picture of users, the application and its dependencies.','Assign a clear responsibility to each component.','Describe data and the rules that must always hold.','Walk through successful, failed and repeated requests.','Sketch screens and check them with users.','Review trade-offs, record important decisions and test assumptions with prototypes.'],example:'A transfer requires a debit from the source and a credit to the destination. The proposed real service commits both together, or neither. Its design also explains what happens if a customer repeats a request after losing the response.',ask:'Why is a picture of the screens not enough to design a transfer?',answer:'Screens cannot by themselves explain transaction consistency, access checks, data storage, duplicate requests or recovery after failure.',docs:['hld','lld','data-model','api','ui','adr','threat-model'],exit:'The design addresses the requirements, critical failure paths are explained and implementation does not depend on unrecorded guesses.',risk:'A prototype demonstrates an idea. It is not evidence that production security, performance or recovery has been implemented.',refs:['owasp','postgres']},
{id:'development',title:'Development',intro:'Turn the agreed behaviour into working components, checking the work as it is created.',slides:'85–98',who:'Developers and a technical lead implement and review changes. Testers and business specialists clarify expected behaviour. Operations contributes delivery constraints.',when:'Work in small increments once a feature has enough clarity. Feed discoveries back into requirements and design.',input:'Requirements and acceptance criteria, designs, interface contracts, standards and test ideas.',output:'Reviewed changes, unit and integration tests, build artifacts, configuration guidance and updated documentation.',steps:['Choose a small, understandable behaviour.','Clarify its expected result with an example.','Implement and test the behaviour.','Review the change with another qualified person.','Check interactions with related components.','Record the change and package a repeatable build.'],example:'Before implementing amount validation, write examples: 10.25 is valid; zero, a negative value and 1.234 are invalid. The logic represents money in whole cents so decimal rounding does not silently alter the amount.',ask:'What is the difference between code compiling and the feature working?',answer:'Compilation only checks certain rules of the programming language. Tests and reviews must still examine whether behaviour meets the requirement.',docs:['development-plan','code-review','build-record'],exit:'The agreed increment meets its quality criteria, reviews and required tests are complete, and its version is identifiable.',risk:'Tools assist people. An IDE, debugger or automated test cannot guarantee an error-free product.',refs:['istqb','scrum']},
{id:'testing',title:'Testing',intro:'Compare what is required with what is observed, and use evidence to decide what still needs attention.',slides:'99–133',who:'Developers, testers, users, product owners and operations contribute different kinds of evidence. Quality is shared, with explicit responsibility for each decision.',when:'Start with reviews of requirements and designs. Execute tests when software is available and repeat relevant tests after changes.',input:'Requirements, acceptance criteria, designs, builds, environments, test data and known risks.',output:'Test cases, execution results, defect reports, coverage links and a clear statement of remaining risk.',steps:['Choose tests based on importance and risk.','Write inputs and expected results before execution.','Prepare controlled data and a known environment.','Run tests and record actual results.','Report defects with reproduction steps and useful evidence.','Recheck fixes, run relevant regression tests and summarise remaining risk.'],example:'Starting from SGD 2,500, a withdrawal of SGD 2,500 succeeds and leaves zero. A fresh test starting from the same balance rejects SGD 2,500.01. These two cases check the permitted boundary rather than only an ordinary amount.',ask:'If both boundary tests pass, is the whole bank correct?',answer:'No. They establish results only for those conditions. Other operations, access rules, concurrency and failure cases still need evidence.',docs:['test-plan','test-cases','defect','test-summary','uat','rtm'],exit:'Decision-makers know what was tested, what failed, what remains untested and whether agreed acceptance conditions are satisfied.',risk:'A traceability link is not a passed test, and a passed test is not proof that no defect remains.',refs:['istqb','nasa']},
{id:'deployment',title:'Deployment',intro:'Make an approved version available in its target environment and establish that people can operate it.',slides:'134–153',who:'Release leads coordinate developers, operations, database administrators, testers, security and business representatives. Named owners confirm readiness and recovery actions.',when:'After agreed readiness conditions are met. Preparation starts earlier because configuration, training and recovery need planning.',input:'An identifiable build, test evidence, approvals appropriate to the organisation, configuration, runbooks and a recovery plan.',output:'A verified release, deployment evidence, release notes, user guidance and an operational handover.',steps:['Check the exact version, dependencies and known limitations.','Confirm configuration and data compatibility.','Choose a rollout strategy appropriate to service needs.','Rehearse the release and recovery steps.','Deploy and perform selected health or smoke checks.','Monitor outcomes and communicate the handover or recovery decision.'],example:'The offline guide is released as one HTML file. Its release check opens that exact file without a network connection, completes a transfer and verifies that the expected receipt appears. A real banking release would additionally need server, security and operational evidence.',ask:'Why is reverting application code not always enough for rollback?',answer:'A new version may also change data or external systems. Recovery must account for those changes rather than assume that older code can safely read everything.',docs:['deployment-plan','release-notes','user-guide','operations','dr-plan'],exit:'The intended version is running, agreed checks pass, support knows the service, and recovery responsibilities are clear.',risk:'Rolling updates can maintain service only when readiness, capacity and compatibility are suitable. No strategy guarantees safety by its name alone.',refs:['kubernetes','aws-bluegreen']},
{id:'maintenance',title:'Maintenance',intro:'Keep delivered software useful through controlled correction, adaptation and improvement.',slides:'154–170',who:'Support and operations identify service issues; product owners prioritise needs; developers, testers, security and administrators assess and implement changes.',when:'Throughout the service lifetime, including planned improvements, dependency changes, incidents and eventual retirement.',input:'Monitoring, user feedback, incidents, change requests, dependency information and service objectives.',output:'Approved changes, fixes, updated evidence, revised guidance and lessons from operation.',steps:['Monitor service outcomes and gather feedback.','Describe the gap and its effect on users.','Assess scope, dependencies, priority and risk.','Design and implement the change with suitable review.','Test the change and existing behaviour it might affect.','Deliver, observe the result and update documents.'],example:'The permitted transfer amount may change from SGD 10,000 to a new approved limit. The change affects the SRS, screen help, validation, boundary tests and user guide. Updating only the screen would leave inconsistent behaviour.',ask:'Which document helps find the tests affected by the change?',answer:'The traceability matrix links the requirement to tests and other relevant evidence. The links must be kept current.',docs:['change-request','incident','maintenance-plan','operations','rtm'],exit:'The original need is addressed, important existing behaviour is protected and monitoring confirms the outcome.',risk:'Software does not physically wear out, but dependencies, documentation, skills and changing needs affect maintainability. The course cost chart is illustrative.',refs:['swebok']}
];
const SOURCES={nasa:{title:'NASA Systems Engineering Handbook: Requirements Management',url:'https://www.nasa.gov/reference/6-2-requirements-management/',note:'Background on requirements, baselines and traceability. The banking documents are original teaching examples.'},istqb:{title:'ISTQB Foundation Level syllabus v4.0.1',url:'https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf',note:'Terminology for reviews, dynamic testing, test levels, evidence and limits of testing.'},scrum:{title:'The Scrum Guide: Definition of Done',url:'https://scrumguides.org/scrum-guide.html#definition-of-done',note:'Source for the agreed quality criteria of an increment. The guide does not require this example document set.'},owasp:{title:'OWASP Authentication Cheat Sheet',url:'https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html',note:'Background for the real-system security discussion. The local demo does not implement production authentication.'},session:{title:'OWASP Session Management Cheat Sheet',url:'https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html',note:'Further reading about real session controls, invalidation and expiry.'},postgres:{title:'PostgreSQL tutorial: Transactions',url:'https://www.postgresql.org/docs/current/tutorial-transactions.html',note:'Background for atomic debit-and-credit operations in the proposed real system.'},kubernetes:{title:'Kubernetes documentation: Deployments',url:'https://kubernetes.io/docs/concepts/workloads/controllers/deployment/',note:'Operational examples of recreate and rolling update behaviour.'},'aws-bluegreen':{title:'AWS: Blue/Green Deployments',url:'https://docs.aws.amazon.com/whitepapers/latest/blue-green-deployments/welcome.html',note:'Background on parallel environments and switching a release.'},swebok:{title:'IEEE Computer Society: SWEBOK Guide v4',url:'https://ieeecs-media.computer.org/media/education/swebok/swebok-v4.pdf',note:'Reference for the broader software engineering lifecycle, design and maintenance.'},wcag:{title:'W3C: WCAG 2.2',url:'https://www.w3.org/TR/WCAG22/',note:'Accessibility reference. A checklist alone is not evidence of conformance.'}};

['FR-01','Login','A learner using learner / Learn123! enters the demo. Wrong credentials show a generic error. Three consecutive failures lock the simulated login for 30 seconds.','TC-01, TC-02, TC-03'],
['FR-02','Logout and session expiry','Logout or 5 minutes without an authenticated banking action ends the simulated session. Viewing an account or starting/reviewing/confirming a banking task counts as activity. Another login is required to use account operations.','TC-04, TC-05'],

['TC-16','BR-02','Fresh balances; deposit tests','Deposit 0.01; reset; deposit 10,000.00','Both inclusive boundaries accepted. Integer cents preserve exact values.'],
['TC-17','NFR-01','Any screen','Use Tab, Shift+Tab, Enter; inspect labels and error text; use a narrow window','Controls reachable with visible focus; errors understandable; no clipped essential content. Not a complete accessibility audit.'],
['TC-18','NFR-02','Local file, network disabled','Open all guide areas; perform all demo operations; refresh file','Content and demo work offline. Refresh resets account/session state; no server calls occur.']
];

context:[['Customer','Uses the browser'],['Banking interface','Collects input and shows outcomes'],['Banking service','Checks rules and permissions'],['Ledger database','Records committed transactions']],
