apiVersion: v1
kind: ServiceAccount
metadata:
  name: bank-reader
  namespace: tk-bank
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bank-pod-reader
  namespace: tk-bank
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bank-pod-reader
  namespace: tk-bank
subjects:
- kind: ServiceAccount
  name: bank-reader
  namespace: tk-bank
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bank-pod-reader
