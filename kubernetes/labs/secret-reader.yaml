apiVersion: v1
kind: Secret
metadata:
  name: dummy-report
  namespace: tk-bank
type: Opaque
stringData:
  token: fictional-training-token
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-reader
  namespace: tk-bank
spec:
  containers:
  - name: reader
    image: busybox:1.37
    command:
    - sh
    - -c
    - wc -c < /secret/token
    volumeMounts:
    - name: secret
      mountPath: /secret
      readOnly: true
  restartPolicy: Never
  automountServiceAccountToken: false
  volumes:
  - name: secret
    secret:
      secretName: dummy-report
