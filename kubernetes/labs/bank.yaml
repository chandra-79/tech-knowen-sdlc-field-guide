apiVersion: v1
kind: Namespace
metadata:
  name: tk-bank
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-page
  namespace: tk-bank
data:
  index.html: <!doctype html><html><h1>Harbour Bank learning service</h1><p>Version
    one. Fictional information only.</p></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-web
  namespace: tk-bank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bank-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: bank-web
    spec:
      automountServiceAccountToken: false
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: page
          mountPath: /usr/share/nginx/html
          readOnly: true
      volumes:
      - name: page
        configMap:
          name: bank-page
---
apiVersion: v1
kind: Service
metadata:
  name: bank-web
  namespace: tk-bank
spec:
  selector:
    app: bank-web
  ports:
  - port: 80
    targetPort: 80
