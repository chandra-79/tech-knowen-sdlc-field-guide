# Prerequisite: compatible Gateway controller and CRDs.
# Replace YOUR_INSTALLED_CLASS with an existing GatewayClass.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bank-public
  namespace: tk-bank
spec:
  gatewayClassName: YOUR_INSTALLED_CLASS
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank-info
  namespace: tk-bank
spec:
  parentRefs:
    - name: bank-public
  hostnames:
    - bank.example.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bank-web
          port: 80
