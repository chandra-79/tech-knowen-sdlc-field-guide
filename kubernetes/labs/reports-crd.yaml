apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bankreports.learning.techknowen.example
spec:
  group: learning.techknowen.example
  scope: Namespaced
  names:
    plural: bankreports
    singular: bankreport
    kind: BankReport
    shortNames:
    - brpt
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - period
            properties:
              period:
                type: string
                pattern: ^[0-9]{4}-[0-9]{2}$
