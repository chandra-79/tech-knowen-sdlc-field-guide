ecute application reconciliation logic.", "refs": ["https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/", "https://kubernetes.io/docs/concepts/extend-kubernetes/operator/"], "mode": "Local cluster", "code": "@lab:reports-crd.yaml", "prereq": "Complete Setup and the starter application lab."}, {"id": "api-versions", "track": "ckad", "title": "API discovery and deprecation-safe changes", "domain": "Observability and maintenance", "summary": "Match manifests to the cluster’s supported API rather than memorising old examples.", "understand": ["apiVersion identifies an API group/version, not the kubectl binary version. Different resource kinds can use different API versions within the same cluster. Use api-resources and explain to discover supported shapes and fields.", "A removed API version can make an old manifest fail before any Pod is created. A version change may also require field changes; replacing only the apiVersion line is not a complete migration strategy."], "deep": ["Storage versions and served versions are related but distinct. API conversion and CRD conversion webhooks become important when custom types evolve. Upgrade planning should inventory deprecated APIs, chart outputs, controllers and admission integrations—not just application images.", "kubectl client/server skew has support limits. The course lab uses Kubernetes 1.35; use a client within the documented one-minor-version range. Read current exam instructions before scheduling because the published documentation site, practice cluster and examination environment can differ."], "case": "Confirm that bank Deployment uses apps/v1 and its Service uses v1. Explain why those two values do not conflict.", "nodes": [{"title": "Discover", "detail": "List served resources and versions"}, {"title": "Validate", "detail": "Check fields and server acceptance"}, {"title": "Migrate", "detail": "Test behaviour before upgrading production"}], "diagramType": "flow", "lab": "Run API discovery and explain for Deployment, Ingress and CronJob. Use server-side dry-run on supplied manifests. Compare an old Ingress example with the current schema without applying obsolete objects.", "verify": "You identify both the resource’s served version and its required backend field structure. Runtime behaviour remains a separate check.", "fault": "No matches for kind: distinguish an absent CRD from a removed built-in API version and from a typo.", "question": "Does changing apiVersion always migrate an old object specification correctly?", "answer": "No. Required fields and semantics can change too. Consult the migration guidance and validate the resulting object.", "refs": ["https://kubernetes.io/docs/reference/using-api/deprecation-guide/", "https://kubernetes.io/docs/reference/version-skew-policy/"], "mode": "Local cluster", "code": "kubectl api-resources\nkubectl api-versions\nkubectl explain ingress.spec.rules.http.paths.backend\nkubectl apply --dry-run=server -f bank.yaml", "prereq": "Complete Setup and the starter application lab."}, {"id": "ckad-capstone", "track": "ckad", "title": "CKAD capstone and timed readiness", "domain": "Certification practice", "summary": "Demonstrate independent application delivery, then practise under a time budget.", "understand": ["Use the lessons to build a small bank information service in a fresh namespace without copying a complete solution blindly. The target includes two replicas, configuration, probes, requests/limits, a Service, a completion-based reporting task and a restricted read-only ServiceAccount.", "Work through one feature at a time: declare, inspect, exercise and record. Do not mark a task complete merely because apply returned success. Capture object state and the behaviour the requirement asked for."], "deep": ["The practice assessment is original and is not an exam dump. Use a two-hour rehearsal as a training exercise, checking current official exam duration, environment, permitted resources and candidate rules separately. Do not assume that tools available in this guide are allowed during an exam.", "Readiness has two dimensions: fast accurate use of primitives and sound diagnosis when something fails. Repeat a scenario with a changed namespace, image or label so success depends on understanding. Maintain a mistake log: symptom, false assumption, correcting evidence and a faster verification command."], "case": "The bank information service release must remain reachable during a failed candidate rollout. Its report Job finishes once per intended business operation in the design, while the demo prints only a marker.", "nodes": [{"title": "Build", "detail": "Create the required objects"}, {"title": "Break and repair", "detail": "Selector, image or readiness fault"}, {"title": "Prove", "detail": "Request test, state evidence and explanation"}], "diagramType": "flow", "lab": "Use the assessment page’s CKAD task set. Complete a guided attempt, then a timed independent attempt in a fresh namespace. Score observable outcomes using the supplied rubric; do not count reading completion as a passed practical task.", "verify": "All five CKAD domains have associated lesson/lab evidence. Repeat weak tasks with changed conditions and explain the limits of each observation.", "fault": "A learner is fast at YAML generation but never checks namespace or endpoints. Include both in the final verification sequence for every relevant task.", "question": "Does finishing this reading path establish certification or SME status?", "answer": "No. It supports preparation. Independent practical evidence, ongoing operations experience and the official exam are separate outcomes.", "refs": ["https://github.com/cncf/curriculum/blob/master/CKAD_Curriculum_v1.35.pdf", "https://training.linuxfoundation.org/certification/certified-kubernetes-application-developer-ckad/", "https://docs.linuxfoundation.org/tc-docs/certification/important-instructions-cka-ckad-cks"], "mode": "Timed local practice", "code": "kubectl config current-context\nkubectl create namespace tk-ckad-attempt\nkubectl -n tk-ckad-attempt get all\n# Build and verify the task set in this namespace.\n# Cleanup only after saving the evidence you need:\nkubectl delete namespace tk-ckad-attempt", "prereq": "Complete Setup and the starter application lab."}], "labs": {"bank-info/Chart.yaml": "apiVersion: v2\nname: bank-info\ndescription: Original TechKnowen teaching chart\ntype: application\nversion: 0.1.0\nappVersion: \"1.27\"\n", "bank-info/templates/deployment.yaml": "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: {{ .Release.Name }}\nspec:\n  replicas: {{ .Values.replicaCount }}\n  selector:\n    matchLabels:\n      app.kubernetes.io/instance: {{ .Release.Name }}\n  template:\n    metadata:\n      labels:\n        app.kubernetes.io/instance: {{ .Release.Name }}\n    spec:\n      containers:\n        - name: web\n          image: {{ .Values.image | quote }}\n          ports:\n            - containerPort: 80\n          readinessProbe:\n            httpGet:\n              path: /\n              port: 80\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: {{ .Release.Name }}\nspec:\n  selector:\n    app.kubernetes.io/instance: {{ .Release.Name }}\n  ports:\n    - port: 80\n      targetPort: 80\n", "bank-info/values.yaml": "replicaCount: 2\nimage: nginx:1.27-alpine\n", "bank.yaml": "apiVersion: v1\nkind: Namespace\nmetadata:\n  name: tk-bank\n---\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: bank-page\n  namespace: tk-bank\ndata:\n  index.html: <!doctype html><html><h1>Harbour Bank learning service<\/h1><p>Version\n    one. Fictional information only.<\/p><\/html>\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: bank-web\n  namespace: tk-bank\nspec:\n  replicas: 2\n  selector:\n    matchLabels:\n      app: bank-web\n  strategy:\n    type: RollingUpdate\n    rollingUpdate:\n      maxUnavailable: 0\n      maxSurge: 1\n  template:\n    metadata:\n      labels:\n        app: bank-web\n    spec:\n      automountServiceAccountToken: false\n      containers:\n      - name: web\n        image: nginx:1.27-alpine\n        ports:\n        - containerPort: 80\n        resources:\n          requests:\n            cpu: 50m\n            memory: 32Mi\n          limits:\n            cpu: 250m\n            memory: 128Mi\n        readinessProbe:\n          httpGet:\n            path: /\n            port: 80\n          periodSeconds: 3\n        livenessProbe:\n          httpGet:\n            path: /\n            port: 80\n          initialDelaySeconds: 10\n          periodSeconds: 10\n        volumeMounts:\n        - name: page\n          mountPath: /usr/share/nginx/html\n          readOnly: true\n      volumes:\n      - name: page\n        configMap:\n          name: bank-page\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: bank-web\n  namespace: tk-bank\nspec:\n  selector:\n    app: bank-web\n  ports:\n  - port: 80\n    targetPort: 80\n", "ingress.yaml": "apiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: bank-web\n  namespace: tk-bank\nspec:\n  ingressClassName: replace-with-installed-class\n  rules:\n  - host: bank.example.test\n    http:\n      paths:\n      - path: /\n        pathType: Prefix\n        backend:\n          service:\n            name: bank-web\n            port:\n              number: 80\n", "init.yaml": "apiVersion: v1\nkind: Pod\nmetadata:\n  name: bank-init\n  namespace: tk-bank\nspec:\n  containers:\n  - name: web\n    image: nginx:1.27-alpine\n    volumeMounts:\n    - name: shared\n      mountPath: /usr/share/nginx/html\n  initContainers:\n  - name: prepare\n    image: busybox:1.37\n    command:\n    - sh\n    - -c\n    - echo \"Harbour Bank prepared page\" > /work/index.html\n    volumeMounts:\n    - name: shared\n      mountPath: /work\n  volumes:\n  - name: shared\n    emptyDir: {}\n", "jobs.yaml": "apiVersion: batch/v1\nkind: Job\nmetadata:\n  name: bank-report\n  namespace: tk-bank\nspec:\n  backoffLimit: 1\n  template:\n    spec:\n      restartPolicy: Never\n      containers:\n      - name: report\n        image: busybox:1.37\n        command:\n        - sh\n        - -c\n        - 'echo \"Fictional bank report: total demo units 3500\"'\n---\napiVersion: batch/v1\nkind: CronJob\nmetadata:\n  name: bank-report-schedule\n  namespace: tk-bank\nspec:\n  schedule: 0 6 * * *\n  timeZone: Etc/UTC\n  suspend: true\n  concurrencyPolicy: Forbid\n  successfulJobsHistoryLimit: 1\n  failedJobsHistoryLimit: 1\n  jobTemplate:\n    spec:\n      backoffLimit: 1\n      template:\n        spec:\n          restartPolicy: Never\n          containers:\n          - name: report\n            image: busybox:1.37\n            command:\n            - sh\n            - -c\n            - 'echo \"Fictional bank report: total demo units 3500\"'\n", "kustomize/base/deployment.yaml": "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: bank-overlay\nspec:\n  replicas: 2\n  selector:\n    matchLabels:\n      app: bank-overlay\n  template:\n    metadata:\n      labels:\n        app: bank-overlay\n    spec:\n      containers:\n      - name: web\n        image: nginx:1.27-alpine\n", "kustomize/base/kustomization.yaml": "resources:\n  - deployment.yaml\n", "kustomize/overlays/practice/kustomization.yaml": "resources:\n  - ../../base\n  - namespace.yaml\nnamespace: tk-kustomize\nreplicas:\n  - name: bank-overlay\n    count: 3\n", "kustomize/overlays/practice/namespace.yaml": "apiVersion: v1\nkind: Namespace\nmetadata:\n  name: tk-kustomize\n", "pending.yaml": "apiVersion: v1\nkind: Pod\nmetadata:\n  name: bank-pending\n  namespace: tk-bank\nspec:\n  containers:\n  - name: worker\n    image: busybox:1.37\n    command:\n    - sleep\n    - '3600'\n    resources:\n      requests:\n        cpu: '100'\n        memory: 32Mi\n", "policy.yaml": "apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: bank-web-ingress\n  namespace: tk-bank\nspec:\n  podSelector:\n    matchLabels:\n      app: bank-web\n  policyTypes:\n  - Ingress\n  ingress:\n  - from:\n    - podSelector:\n        matchLabels:\n          role: frontend\n    ports:\n    - protocol: TCP\n      port: 80\n", "rbac.yaml": "apiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: bank-reader\n  namespace: tk-bank\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  name: bank-pod-reader\n  namespace: tk-bank\nrules:\n- apiGroups:\n  - ''\n  resources:\n  - pods\n  verbs:\n  - get\n  - list\n  - watch\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: bank-pod-reader\n  namespace: tk-bank\nsubjects:\n- kind: ServiceAccount\n  name: bank-reader\n  namespace: tk-bank\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n  kind: Role\n  name: bank-pod-reader\n", "report.yaml": "apiVersion: learning.techknowen.example/v1\nkind: BankReport\nmetadata:\n  name: september\n  namespace: tk-bank\nspec:\n  period: 2026-09\n", "reports-crd.yaml": "apiVersion: apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata:\n  name: bankreports.learning.techknowen.example\nspec:\n  group: learning.techknowen.example\n  scope: Namespaced\n  names:\n    plural: bankreports\n    singular: bankreport\n    kind: BankReport\n    shortNames:\n    - brpt\n  versions:\n  - name: v1\n    served: true\n    storage: true\n    schema:\n      openAPIV3Schema:\n        type: object\n        properties:\n          spec:\n            type: object\n            required:\n            - period\n            properties:\n              period:\n                type: string\n                pattern: ^[0-9]{4}-[0-9]{2}$\n", "secret-reader.yaml": "apiVersion: v1\nkind: Secret\nmetadata:\n  name: dummy-report\n  namespace: tk-bank\ntype: Opaque\nstringData:\n  token: fictional-training-token\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: secret-reader\n  namespace: tk-bank\nspec:\n  containers:\n  - name: reader\n    image: busybox:1.37\n    command:\n    - sh\n    - -c\n    - wc -c < /secret/token\n    volumeMounts:\n    - name: secret\n      mountPath: /secret\n      readOnly: true\n  restartPolicy: Never\n  automountServiceAccountToken: false\n  volumes:\n  - name: secret\n    secret:\n      secretName: dummy-report\n", "security.yaml": "apiVersion: v1\nkind: Pod\nmetadata:\n  name: secure-worker\n  namespace: tk-bank\nspec:\n  containers:\n  - name: worker\n    image: busybox:1.37\n    command:\n    - sh\n    - -c\n    - id; echo safe > /work/result; cat /work/result; sleep 3600\n    securityContext:\n      allowPrivilegeEscalation: false\n      readOnlyRootFilesystem: true\n      capabilities:\n        drop:\n        - ALL\n    volumeMounts:\n    - name: work\n      mountPath: /work\n  automountServiceAccountToken: false\n  securityContext:\n    runAsNonRoot: true\n    runAsUser: 10001\n    runAsGroup: 10001\n    fsGroup: 10001\n    seccompProfile:\n      type: RuntimeDefault\n  volumes:\n  - name: work\n    emptyDir: {}\n", "storage.yaml": "apiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: bank-learning-data\n  namespace: tk-bank\nspec:\n  accessModes:\n  - ReadWriteOnce\n  resources:\n    requests:\n      storage: 128Mi\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: bank-storage\n  namespace: tk-bank\nspec:\n  containers:\n  - name: worker\n    image: busybox:1.37\n    command:\n    - sleep\n    - '3600'\n    volumeMounts:\n    - name: data\n      mountPath: /data\n  volumes:\n  - name: data\n    persistentVolumeClaim:\n      claimName: bank-learning-data\n"}, "commands": {"starter": "kubectl apply -f bank.yaml\nkubectl -n tk-bank rollout status deployment/bank-web --timeout=120s\nkubectl -n tk-bank get endpointslices -l kubernetes.io/service-name=bank-web\nkubectl -n tk-bank port-forward service/bank-web 8080:80\n# In another terminal: curl http://127.0.0.1:8080", "init-sidecars": "kubectl apply -f init.yaml\nkubectl -n tk-bank wait --for=condition=Ready pod/bank-init --timeout=120s\nkubectl -n tk-bank get pod bank-init -o yaml\nkubectl -n tk-bank exec bank-init -- cat /usr/share/nginx/html/index.html", "jobs": "kubectl apply -f jobs.yaml\nkubectl -n tk-bank wait --for=condition=complete job/bank-report --timeout=120s\nkubectl -n tk-bank logs job/bank-report\nkubectl -n tk-bank create job report-now --from=cronjob/bank-report-schedule\nkubectl -n tk-bank wait --for=condition=complete job/report-now --timeout=120s\nkubectl -n tk-bank logs job/report-now", "secrets": "kubectl apply -f secret-reader.yaml\nkubectl -n tk-bank get pod secret-reader\nkubectl -n tk-bank logs secret-reader\nkubectl auth can-i get secrets -n tk-bank", "resources": "kubectl apply -f pending.yaml\nkubectl -n tk-bank describe pod bank-pending\nkubectl -n tk-bank delete pod bank-pending", "identity-rbac": "kubectl apply -f rbac.yaml\nkubectl auth can-i get pods -n tk-bank --as=system:serviceaccount:tk-bank:bank-reader\nkubectl auth can-i get secrets -n tk-bank --as=system:serviceaccount:tk-bank:bank-reader", "security-context": "kubectl apply -f security.yaml\nkubectl -n tk-bank wait --for=condition=Ready pod/secure-worker --timeout=120s\nkubectl -n tk-bank logs secure-worker\nkubectl -n tk-bank exec secure-worker -- sh -c \"echo blocked > /root-test\"\n# The last command should fail: the root filesystem is read-only.", "storage": "kubectl apply -f storage.yaml\nkubectl -n tk-bank wait --for=condition=Ready pod/bank-storage --timeout=120s\nkubectl -n tk-bank exec bank-storage -- sh -c \"echo retained > /data/marker\"\nkubectl -n tk-bank delete pod bank-storage\nkubectl apply -f storage.yaml\nkubectl -n tk-bank wait --for=condition=Ready pod/bank-storage --timeout=120s\nkubectl -n tk-bank exec bank-storage -- cat /data/marker\nkubectl get pv", "network-policy": "# Basic kind: schema check only.\nkubectl apply --dry-run=server -f policy.yaml\n# Apply and test traffic only in the documented enforcing environment.\n# kubectl apply -f policy.yaml", "ingress": "kubectl apply --dry-run=server -f ingress.yaml\nkubectl get ingressclass\n# Set the actual installed class before live application.", "extensions": "kubectl apply -f reports-crd.yaml\nkubectl wait --for=condition=Established crd/bankreports.learning.techknowen.example --timeout=60s\nkubectl apply -f report.yaml\nkubectl -n tk-bank get bankreports\n# No report controller is installed by this example."}, "domains": {"ckad": [{"title": "Application Design and Build", "weight": "20%", "lessons": ["images", "pod-design", "init-sidecars", "workload-choice", "jobs", "storage"]}, {"title": "Application Deployment", "weight": "20%", "lessons": ["rollouts", "release-strategies", "helm", "kustomize"]}, {"title": "Application Observability and Maintenance", "weight": "15%", "lessons": ["probes", "debugging", "api-versions"]}, {"title": "Application Environment, Configuration and Security", "weight": "25%", "lessons": ["configuration", "secrets", "resources", "identity-rbac", "security-context", "extensions"]}, {"title": "Services and Networking", "weight": "20%", "lessons": ["services-dns", "network-policy", "ingress"]}], "cka": [{"title": "Cluster Architecture, Installation and Configuration", "weight": "25%", "lessons": ["cluster-internals", "kubeadm", "availability", "upgrades", "etcd-recovery", "extension-interfaces", "admin-rbac"]}, {"title": "Workloads and Scheduling", "weight": "15%", "lessons": ["scheduling", "autoscaling", "disruptions", "rollouts", "configuration"]}, {"title": "Services and Networking", "weight": "20%", "lessons": ["cni-dataplane", "coredns", "gateway-api", "network-policy", "services-dns"]}, {"title": "Storage", "weight": "10%", "lessons": ["csi-storage", "storage"]}, {"title": "Troubleshooting", "weight": "30%", "lessons": ["node-triage", "control-plane-triage", "network-triage", "observability", "cka-capstone"]}], "gcp": []}, "assessments": {"ckad": {"title": "CKAD independent rehearsal", "minutes": 120, "namespace": "tk-ckad-attempt", "tasks": [{"title": "Build the workload", "points": 20, "task": "Create a two-replica information service with explicit image, labels, requests/limits and readiness. Use an original page marker and a ConfigMap. Choose an appropriate controller.", "evidence": "Saved manifests; two Ready replicas; correct page from the workload.", "solution": "Use a Deployment whose selector matches its template. Mount the page ConfigMap. Validate rollout and response separately."}, {"title": "Deploy and recover", "points": 20, "task": "Render a Kustomize overlay or Helm package, change a version, introduce a bad image and restore the known-good revision.", "evidence": "Rendered YAML; stalled-rollout evidence; successful recovery and response.", "solution": "Inspect rendered names and labels. Read Events for pull failure. Restore the intended Pod template, then check rollout and HTTP. Explain what image rollback cannot undo."}, {"title": "Observe and diagnose", "points": 15, "task": "Repair a wrong readiness path and collect current/previous logs where applicable. Explain the resulting traffic effect.", "evidence": "Root cause, changed field, readiness and endpoint observations.", "solution": "A failing readiness check can leave the process running while removing it from normal Service traffic. Correct the endpoint and repeat the request."}, {"title": "Configure and restrict", "points": 25, "task": "Run a non-root compatible worker with a writable scratch volume. Mount a dummy Secret without logging it. Give a separate ServiceAccount Pod-read permissions but no Secret-read permission.", "evidence": "Observed UID and allowed write; byte-count-only Secret check; auth can-i yes/no pair.", "solution": "Use compatible paths, drop capabilities and disable privilege escalation. Define narrow Role and RoleBinding. Test actual effective permissions."}, {"title": "Connect and explain policy", "points": 20, "task": "Expose the workload with a Service and repair a wrong selector. Write an Ingress for the lab host and a NetworkPolicy permitting a labelled frontend. Test routing/policy only where controllers and an enforcing CNI exist.", "evidence": "Service request succeeds; backend addresses match; Ingress/controller evidence and allowed/denied policy tests, or explicit not-tested dependencies.", "solution": "Service selectors, ports and ready endpoints must align. Ingress needs a controller. NetworkPolicy needs enforcement. Missing infrastructure means the corresponding practical outcome is not earned, even when YAML validates."}], "rubric": "Award each task’s points only when its stated observable outcomes are demonstrated. Partial credit: split the listed outcomes evenly and document which were observed. 80/100 is this guide’s suggested readiness target, not an official passing score. Repeat all missed tasks independently. If policy or ingress infrastructure is absent, record the attempt as incomplete rather than silently reallocating those points."}}, "sources": [{"title": "CNCF CKAD and CKA curricula", "url": "https://github.com/cncf/curriculum", "note": "Domain mapping, weights and detailed objectives; CC BY 4.0."}, {"title": "Kubernetes documentation", "url": "https://kubernetes.io/docs/", "note": "Concepts, tasks and API references. Each lesson links its relevant pages."}, {"title": "Kubernetes Basics tutorial", "url": "https://kubernetes.io/docs/tutorials/kubernetes-basics/", "note": "Public introductory teaching sequence."}, {"title": "Kubernetes the Hard Way — Kelsey Hightower", "url": "https://github.com/kelseyhightower/kubernetes-the-hard-way", "note": "Manual cluster-building reference; linked, not copied."}, {"title": "KodeKloud public CKAD course outline", "url": "https://notes.kodekloud.com/docs/Certified-Kubernetes-Application-Developer-CKAD/First-Section/Introduction", "note": "Public teaching-format reference; no paid course or exam material reproduced."}, {"title": "kind quick start", "url": "https://kind.sigs.k8s.io/docs/user/quick-start/", "note": "Local learning cluster setup."}, {"title": "Linux Foundation candidate instructions", "url": "https://docs.linuxfoundation.org/tc-docs/certification/important-instructions-cka-ckad-cks", "note": "Verify current rules and permitted resources before taking an exam."}, {"title": "Google Associate Cloud Engineer", "url": "https://cloud.google.com/learn/certification/cloud-engineer", "note": "ACE objectives and preparation guidance."}, {"title": "Google Professional Cloud Architect", "url": "https://cloud.google.com/learn/certification/cloud-architect", "note": "Follow the current standard exam guide linked here; it differs from the renewal guide."}, {"title": "Google Cloud Well-Architected Framework", "url": "https://cloud.google.com/architecture/framework", "note": "Operational, security, reliability, cost, performance and sustainability perspectives."}], "reviewed": "2026-09-28", "validation": "On 2026-09-28, the local Kubernetes 1.35.8 kind lab passed 46 recorded operations/assertions covering the starter Service request, init preparation, Jobs, dummy Secret mounting, Pending diagnosis, RBAC allow/deny checks, restricted execution, PVC persistence, CRD discovery, Kustomize and rollback. The supplied Helm chart was linted, installed, upgraded and rolled back. NetworkPolicy and Ingress received server schema checks only; enforcement and ingress routing were not executed. Administrator VM, Gateway, metrics and GCP exercises require their stated environments and are not claimed as executed here."};

function code(s){return `<div class="code-wrap"><button data-copy aria-label="Copy this code">Copy</button><pre><code>${esc(s)}</code></pre></div>`}
function wrap(s,n=31){const out=[];let line='';for(const w of String(s).split(/\s+/)){if((line+' '+w).trim().length>n&&line){out.push(line);line=w}else line=(line+' '+w).trim()}if(line)out.push(line);return out}
function text(x,y,s,cl='',size=12,n=31){return `<text x="${x}" y="${y}" class="${cl}" font-size="${size}">${wrap(s,n).map((t,i)=>`<tspan x="${x}" dy="${i?17:0}">${esc(t)}</tspan>`).join('')}</text>`}
function diagram(l,deep=false){const uid='tk-'+l.id+'-'+(++figureSerial),title=deep?'Trace the responsibilities':'See the idea',nodes=l.nodes;const comparison=['workload-choice','probes','release-strategies','init-sidecars','gcp-compute','gcp-data','gke-modes','scheduling','availability','observability','gcp-architecture'].includes(l.id);const seq=l.diagramType==='sequence';let height=seq?392:deep?430:280;let body='';const defs=`<defs><marker id="${uid}-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path class="head" d="M0 0L8 3L0 6Z"/></marker></defs>`;
 if(seq){const xs=[112,336,560];body+=xs.map(x=>`<path class="arrow" stroke-dasharray="4 5" d="M${x} 80V350"/>`).join('');const messages=l.id==='api-control-plane'?['Persist requested state','Observe and reconcile','Bind and run workload','Report observed status']:['Submit the request','Resolve the responsible actor','Apply the intended change','Return observed evidence'];const rows=[[0,1],[1,2],[2,1],[1,0]];rows.forEach(([a,b],i)=>{let y=132+i*60;body+=`<path class="arrow" ${i>1?'stroke-dasharray="4 4"':''} marker-end="url(#${uid}-arrow)" d="M${xs[a]} ${y}H${xs[b]}"/>`+text(Math.min(xs[a],xs[b])+12,y-12,messages[i],'sub',11,30)});nodes.forEach((n,i)=>body+=`<rect class="node ${i===1?'focus':''}" x="${xs[i]-94}" y="24" width="188" height="52" rx="6"/>`+text(xs[i]-80,46,n.title,'',12,24));}
 else if(deep&&!comparison){nodes.forEach((n,i)=>{const y=24+i*128;if(i<2)body+=`<path class="arrow" marker-end="url(#${uid}-arrow)" d="M336 ${y+94}V${y+126}"/>`});nodes.forEach((n,i)=>{const y=24+i*128;body+=`<rect class="node ${i===1?'focus':''}" x="112" y="${y}" width="448" height="94" rx="6"/>`+text(130,y+24,n.title,'',14,49)+text(130,y+49,n.detail,'sub',12,49)});}
 else{if(!comparison)for(let i=0;i<2;i++)body+=`<path class="arrow" marker-end="url(#${uid}-arrow)" d="M${220+i*224} 136H${242+i*224}"/>`;nodes.forEach((n,i)=>{const x=20+i*224;body+=`<rect class="node ${i===1?'focus':''}" x="${x}" y="64" width="196" height="152" rx="6"/>`+text(x+14,92,n.title,'',14,20)+text(x+14,136,n.detail,'sub',12,24)});}
 const desc=seq?'Read messages from top to bottom. Each actor has a lifeline; observations return after requested changes.':comparison?'Compare the three responsibilities. The boxes are alternatives or related concerns, not a mandatory execution order.':'Follow the labelled responsibilities in reading order. Each handoff has a distinct purpose.';
 return `<figure class="figure"><h3>${esc(title)} · ${esc(l.title)}</h3><div class="diagram-scroll"><svg viewBox="0 0 692 ${height}" role="img" aria-labelledby="${uid}-title ${uid}-desc"><title id="${uid}-title">${esc(l.title)}</title><desc id="${uid}-desc">${esc(desc+' '+nodes.map(n=>n.title+': '+n.detail).join('. '))}</desc>${defs}${body}</svg></div><figcaption>${esc(desc)} ${seq?'This is a simplified teaching trace; detailed asynchronous behaviour is explained in the text.':''}</figcaption><details><summary>Read the diagram as text</summary><div><ol>${nodes.map(n=>`<li><strong>${esc(n.title)}:</strong> ${esc(n.detail)}</li>`).join('')}</ol></div></details></figure>`}
function nav(track=currentTrack){$('#navigation').innerHTML=`<a href="#/" ${location.hash==='#/'?'class="active"':''}>Learning programme</a><div class="nav-label">Choose a path</div>${Object.entries(tracks).filter(([k])=>DATA.lessons.some(l=>l.track===k)).map(([k,t])=>`<a href="#/track/${k}" class="${track===k?'active':''}">${esc(t.label)}</a>`).join('')}<div class="nav-label">Practise and verify</div><a href="#/labs">Manifest and command library</a><a href="#/assessments">Independent assessments</a><a href="#/coverage">Certification coverage</a><a href="#/progress">My learning evidence</a><a href="#/sources">Sources and review scope</a><div class="nav-label">TechKnowen</div><a href="../index.html">← SDLC Field Guide</a><a href="https://ajnacs.com/" target="_blank" rel="noopener noreferrer">Ajna Consulting Services ↗</a><a href="https://github.com/chandra-79/tech-knowen-sdlc-field-guide" target="_blank" rel="noopener noreferrer">☆ Star on GitHub</a>`}
function home(){return `<div class="hero"><div class="eyebrow">TechKnowen · Kubernetes & Cloud</div><h1>Understand the system.<br>Build it. Break it. Recover it.</h1><p class="lede">A progressive, practical learning programme from your first container to Kubernetes development, cluster administration and Google Cloud architecture.</p><div class="flow-path">Foundations → CKAD → CKA → Google Cloud ACE → PCA & GKE practice</div></div><div class="cards">${Object.entries(tracks).filter(([k])=>DATA.lessons.some(l=>l.track===k)).map(([k,t],i)=>`<a class="card" href="#/track/${k}"><span class="eyebrow">PATH ${i+1} · ${DATA.lessons.filter(l=>l.track===k).length} LESSONS</span><h2>${esc(t.title)}</h2><p>${esc(t.intro)}</p><strong>Open ${esc(t.label)} →</strong></a>`).join('')}</div><div class="callout"><strong>One connected learning case</strong><p>Harbour Bank begins as a fictional, read-only information page. Later exercises examine reports, releases, identity, reliability and cloud architecture. No exercise moves real money or processes real customer data.</p></div><h2>Every lesson gives you a way to prove understanding</h2><div class="cards grid-3"><div class="card"><h3>1 · Understand</h3><p>Plain-language concepts, an original diagram and a worked case.</p></div><div class="card"><h3>2 · See behind the scenes</h3><p>Control flow, dependencies, failure modes and the limits of each abstraction.</p></div><div class="card"><h3>3 · Practise independently</h3><p>Lab setup, commands, verification, a failure exercise and an explained self-check.</p></div></div><p class="note">Reading and local completion records are not certification or proof of professional mastery. Build evidence from real lab runs, then repeat with changed conditions. This guide’s source review is dated ${DATA.reviewed}; check official exam rules before booking.</p><p><a href="#/lesson/setup">Start the setup guide →</a> · <a href="#/sources">Research and attribution →</a></p>`}
function trackPage(id){const t=tracks[id];if(!t)return missing();currentTrack=id;const ls=DATA.lessons.filter(l=>l.track===id),done=ls.filter(l=>state.done.includes(l.id)).length;return `<div class="eyebrow">${esc(t.label)}</div><h1>${esc(t.title)}</h1><p class="lede">${esc(t.intro)}</p><p>${done} of ${ls.length} lessons marked reviewed. Practical evidence is tracked separately in your notes.</p><div class="progress"><i style="width:${ls.length?100*done/ls.length:0}%"></i></div>${[...new Set(ls.map(l=>l.domain))].map(d=>`<h2>${esc(d)}</h2>${ls.filter(l=>l.domain===d).map(l=>`<div class="step"><span class="tag">${esc(l.mode)}</span><h3><a href="#/lesson/${l.id}">${state.done.includes(l.id)?'✓ ':''}${esc(l.title)}</a></h3><p>${esc(l.summary)}</p></div>`).join('')}`).join('')}<p><a href="#/coverage">See objective coverage and dependencies →</a></p>`}
function lesson(id,tab='understand'){const l=DATA.lessons.find(l=>l.id===id);if(!l)return missing();currentTrack=l.track;const index=DATA.lessons.indexOf(l);let content='';if(tab==='understand')content=`<h2>The central idea</h2>${l.understand.map(p=>`<p>${esc(p)}</p>`).join('')}${diagram(l)}<div class="callout"><strong>Harbour Bank · worked context</strong><p>${esc(l.case)}</p></div><a class="pill" href="#/lesson/${id}?view=deep">Explore behind the scenes →</a>`;else if(tab==='deep')content=`<h2>Behind the scenes</h2>${l.deep.map(p=>`<p>${esc(p)}</p>`).join('')}${diagram(l,true)}<h2>A failure to reason through</h2><p>${esc(l.fault)}</p><div class="check"><h3>${esc(l.question)}</h3><details><summary>Reveal the explanation</summary><div><p>${esc(l.answer)}</p></div></details></div><a class="pill" href="#/lesson/${id}?view=lab">Put the idea into practice →</a>`;else content=labView(l);return `<div class="breadcrumbs"><a href="#/track/${l.track}">${esc(tracks[l.track].label)}</a> / ${esc(l.domain)}</div><h1>${esc(l.title)}</h1><p class="lede">${esc(l.summary)}</p><div class="meta"><span class="tag">${esc(l.mode)}</span><span>Source review: ${DATA.reviewed}</span></div><nav class="tabs" aria-label="Lesson depth">${[['understand','1 · Understand'],['deep','2 · Behind the scenes'],['lab','3 · Hands-on']].map(([k,t])=>`<a href="#/lesson/${id}?view=${k}" class="${tab===k?'active':''}" ${tab===k?'aria-current="page"':''}>${t}</a>`).join('')}</nav>${content}<h2>References and further reading</h2><ul>${l.refs.map(u=>`<li><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(sourceName(u))}</a></li>`).join('')}</ul><section class="personal"><h2>Your evidence, in your words</h2><label for="notes">Record what you ran, observed and still need to verify. Do not paste credentials.</label><textarea id="notes" data-note="${id}" placeholder="Context/version · prediction · commands · observations · correction · repeat result">${esc(state.notes[id]||'')}</textarea><p class="note">Saved only in this browser. No account or server sync. Reading completion does not imply a passed lab.</p><button id="done" data-done="${id}">${state.done.includes(id)?'✓ Reviewed — mark unread':'Mark this lesson reviewed'}</button><div class="status" id="save-status" aria-live="polite"></div></section><div class="lesson-nav">${index?`<a href="#/lesson/${DATA.lessons[index-1].id}">← ${esc(DATA.lessons[index-1].title)}</a>`:'<a href="#/">← Programme</a>'}${index<DATA.lessons.length-1?`<a href="#/lesson/${DATA.lessons[index+1].id}">${esc(DATA.lessons[index+1].title)} →</a>`:'<a href="#/assessments">Independent assessment →</a>'}</div>`}
function labView(l){let example=l.code.startsWith('@lab:')?DATA.labs[l.code.slice(5)]:l.code;return `<div class="callout"><strong>Environment and prerequisites</strong><p>${esc(l.prereq)}</p><p>${esc(l.mode)}. ${/cloud|GCP/i.test(l.mode)?'Cloud commands can incur charges. Choose your own isolated project, estimate cost and review cleanup before creating resources. The guide never executes these commands for you.':'Use only the disposable learning environment. Confirm kubeconfig, context and namespace before changes.'}</p></div><h2>Predict, then do</h2><p>${esc(l.lab)}</p>${l.code.startsWith('@lab:')?`<p>Save this as <code>${esc(l.code.slice(5))}</code>. ${l.id==='jobs'?'The scheduled job is deliberately suspended; create an immediate Job for practice.':''}</p>`:''}${example?code(example):''}${DATA.commands[l.id]?`<h3>Run and inspect</h3>${code(DATA.commands[l.id])}`:''}${['helm','kustomize','extensions'].includes(l.id)?'<p><a href="#/labs">Open all related files in the manifest library →</a></p>':''}<h2>Expected evidence</h2><p>${esc(l.verify)}</p><p class="note">Expected evidence describes what you must observe. It is not a pre-filled test result.</p><h2>Break or challenge one assumption</h2><p>${esc(l.fault)}</p><details><summary>Self-check: ${esc(l.question)}</summary><div><p>${esc(l.answer)}</p></div></details><h2>Record and clean up</h2><p>${/cloud|GCP/i.test(l.mode)?'List the resources created, their region and dependencies. Delete only the named lab resources after collecting evidence; verify disks, addresses, snapshots and log retention that can remain billable. Never delete a shared project as a shortcut.':/Offline|design|reasoning/i.test(l.mode)?'Keep your diagram, assumptions and explanation. Repeat the exercise with one changed constraint.':/VM/.test(l.mode)?'Save observations, then dispose of only the dedicated VM lab. Do not run reset or data-directory removal on a real cluster.':'Delete only objects created for the independent experiment. Keep tk-bank while other lessons use it. At the end, kind delete cluster --name techknowen-course --kubeconfig "$KUBECONFIG" removes the disposable cluster and its local lab data.'}</p>`}
function library(){return `<div class="eyebrow">Original learning fixtures</div><h1>Manifest and command library</h1><p class="lede">Small, readable examples. Save the displayed text under the stated filename; review it before applying. Files are shown in-page without download controls.</p><div class="callout"><p>Start with <a href="#/lesson/setup">Setup</a>, then <a href="#/lesson/starter?view=lab">the starter application</a>. Helm and Kustomize directories need all their listed files. Manifests with replacement values require your environment’s actual settings.</p></div>${Object.entries(DATA.labs).map(([name,s])=>`<details><summary>${esc(name)}</summary><div>${code(s)}</div></details>`).join('')}`}
function assessment(id){if(!id)return `<h1>Demonstrate what you can do</h1><p class="lede">Original practical tasks and architecture exercises. Guided practice comes first; independent evidence comes next.</p><div class="cards">${Object.entries(DATA.assessments).map(([k,a])=>`<a class="card" href="#/assessments/${k}"><span class="tag">${a.minutes} minute practice budget</span><h2>${esc(a.title)}</h2><p>${a.tasks.length} tasks with observable evidence and explained review criteria.</p></a>`).join('')}</div>`;const a=DATA.assessments[id];if(!a)return missing();return `<div class="eyebrow">Independent practice · not an official exam</div><h1>${esc(a.title)}</h1><p>${esc(a.rubric)}</p><div class="callout"><span id="timer" class="timer">${a.minutes}:00</span><button data-timer="${a.minutes}">Start / restart timer</button><button id="stop-timer">Stop timer</button><p class="note">The timer is a practice aid. It does not submit work, enforce an exam or measure readiness automatically.</p></div>${a.tasks.map((t,i)=>`<section class="step"><span class="tag">${t.points} points</span><h2>${i+1}. ${esc(t.title)}</h2><p>${esc(t.task)}</p><h3>Evidence to collect</h3><p>${esc(t.evidence)}</p><details><summary>Review guidance — open after your attempt</summary><div><p>${esc(t.solution)}</p></div></details></section>`).join('')}`}
function coverage(){return `<h1>Curriculum coverage and learning boundaries</h1><p class="lede">Certification is the starting map. Practical depth also includes design judgement, failure recovery and explaining what a test does not establish.</p><p>Reviewed ${DATA.reviewed}. CNCF’s published curricula identify Kubernetes 1.35 in their filenames. Recheck the candidate instructions for the exam you book; this is a researched learning baseline, not a guarantee about future exam versions.</p>${Object.entries(DATA.domains).filter(([k])=>DATA.lessons.some(l=>l.track===k)).map(([k,ds])=>`<h2>${esc(tracks[k].label)}</h2><div class="table-wrap"><table><thead><tr><th>Domain / weight</th><th>Study and practise</th></tr></thead><tbody>${ds.map(d=>`<tr><td>${esc(d.title)}${d.weight?' · '+esc(d.weight):''}</td><td>${d.lessons.map(id=>{const l=DATA.lessons.find(l=>l.id===id);return l?`<a href="#/lesson/${id}">${esc(l.title)}</a>`:''}).filter(Boolean).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`).join('')}<h2>Professional depth beyond an exam</h2><p>Repeated incident diagnosis, measured restore exercises, least-privilege design, architecture decisions and reviewed evidence support developing expertise. No reading list or quiz can guarantee SME status.</p><p><a href="#/sources">Official curricula, documentation and teaching references →</a></p>`}
function sources(){return `<h1>Sources, attribution and review scope</h1><p class="lede">Original TechKnowen explanations, teaching diagrams, case material and exercises, informed by public primary documentation.</p><p>The review sampled the official concept, task and reference sections relevant to this programme and the published exam objectives. It did not reproduce or claim to read every documentation page, paid bootcamp, video or book. Source review date: ${DATA.reviewed}.</p><h2>How the research shaped the course</h2><ul><li>Kubernetes documentation supplies API semantics and operational constraints.</li><li>CNCF curricula supply the certification domain map. Domain labels/weights are attributed to CNCF’s CC BY 4.0 curriculum.</li><li>Kelsey Hightower’s Kubernetes the Hard Way informs the decision to expose certificates, runtimes, networking and control-plane responsibilities. Its text, scripts and diagrams are not redistributed.</li><li>The official Kubernetes Basics tutorial and public KodeKloud course outline informed the progression from explanation to demonstration, lab and diagnosis. Their proprietary lessons and assessment tasks are not copied.</li><li>Google Cloud documentation and exam guides support the ACE-to-PCA path and GKE-specific responsibilities.</li></ul><h2>Starting references</h2><ul>${DATA.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a> — ${esc(s.note)}</li>`).join('')}</ul><h2>Technical and execution boundaries</h2><p>${esc(DATA.validation)}</p><p>The content reads offline from this one HTML file. Software installation, image pulls, official source links and Google Cloud services need network access. The site does not run shell commands or create cloud resources. Local notes are not sent to a server.</p><p>Certification names belong to their respective organisations. This independent guide is not endorsed by CNCF, The Linux Foundation, Google or the referenced educators.</p>`}
function sourceName(u){try{const x=new URL(u);return x.hostname+' · '+decodeURIComponent(x.pathname.split('/').filter(Boolean).slice(-2).join(' / ')).replaceAll('-',' ')}catch{return u}}
function progress(){return `<h1>Your learning evidence</h1><p class="lede">${state.done.length} lessons marked reviewed. These are personal reading records, not automatically verified lab results.</p>${Object.entries(tracks).filter(([k])=>DATA.lessons.some(l=>l.track===k)).map(([k,t])=>`<h2>${esc(t.label)}</h2><ul>${DATA.lessons.filter(l=>l.track===k).map(l=>`<li>${state.done.includes(l.id)?'✓':'○'} <a href="#/lesson/${l.id}">${esc(l.title)}</a>${state.notes[l.id]?' · notes saved':''}</li>`).join('')}</ul>`).join('')}`}
function search(q){const term=q.toLowerCase().trim(),ls=term?DATA.lessons.filter(l=>JSON.stringify(l).toLowerCase().includes(term)):[];return `<h1>Find a concept or lab</h1><p>${ls.length} lessons match “${esc(q)}”. Search covers all paths, explanations, examples and practical instructions.</p>${ls.map(l=>`<div class="search-item"><span class="tag">${esc(tracks[l.track].label)}</span><h3><a href="#/lesson/${l.id}">${esc(l.title)}</a></h3><p>${esc(l.summary)}</p></div>`).join('')}`}
function missing(){return '<h1>That lesson is not available.</h1><p><a href="#/">Return to the learning programme</a>.</p>'}
function render(){figureSerial=0;const hash=location.hash.slice(1)||'/',[path,query]=hash.split('?'),p=path.split('/'),params=new URLSearchParams(query||'');let html;if(path==='/')html=home();else if(p[1]==='track')html=trackPage(p[2]);else if(p[1]==='lesson')html=lesson(p[2],['deep','lab'].includes(params.get('view'))?params.get('view'):'understand');else if(p[1]==='labs')html=library();else if(p[1]==='assessments')html=assessment(p[2]);else if(p[1]==='coverage')html=coverage();else if(p[1]==='sources')html=sources();else if(p[1]==='progress')html=progress();else if(p[1]==='search')html=search(params.get('q')||'');else html=missing();$('#main').innerHTML=html;nav();document.title=($('#main h1')?.textContent||'Kubernetes & Cloud')+' · TechKnowen';document.body.classList.remove('nav-open');$('#menu').setAttribute('aria-expanded','false');bind();}
function bind(){document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const txt=b.parentElement.querySelector('code').textContent;try{await navigator.clipboard.writeText(txt);b.textContent='Copied'}catch{const range=document.createRange();range.selectNodeContents(b.parentElement.querySelector('code'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);b.textContent='Selected — copy manually'}});$('#notes')?.addEventListener('input',e=>{state.notes[e.target.dataset.note]=e.target.value;$('#save-status').textContent=save()?'Notes saved locally.':'Browser storage is unavailable. Copy your notes before leaving.'});$('#done')?.addEventListener('click',e=>{const id=e.target.dataset.done;state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];const stored=save();e.target.textContent=state.done.includes(id)?'✓ Reviewed — mark unread':'Mark this lesson reviewed';$('#save-status').textContent=stored?'Reading status saved locally.':'Storage unavailable; status lasts only for this session.'});$('[data-timer]')?.addEventListener('click',e=>{clearInterval(timerHandle);timerEnd=Date.now()+Number(e.target.dataset.timer)*60000;const update=()=>{const s=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if($('#timer'))$('#timer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s)clearInterval(timerHandle)};update();timerHandle=setInterval(update,1000)});$('#stop-timer')?.addEventListener('click',()=>clearInterval(timerHandle));}
$('#search-form').onsubmit=e=>{e.preventDefault();location.hash='/search?q='+encodeURIComponent($('#search').value)};$('#theme').onclick=()=>{const dark=document.body.classList.toggle('dark');$('#theme').setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');try{localStorage.setItem('tk-guide-theme',dark?'dark':'light')}catch{}};$('#menu').onclick=()=>{const v=document.body.classList.toggle('nav-open');$('#menu').setAttribute('aria-expanded',String(v))};try{if(localStorage.getItem('tk-guide-theme')==='dark')document.body.classList.add('dark')}catch{}window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
