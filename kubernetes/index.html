a disposable Linux worker VM, correct runtime socket and permission to conduct isolated failure experiments."}, {"id": "control-plane-triage", "track": "cka", "title": "Diagnose API, static Pod and certificate failures", "domain": "Troubleshooting", "summary": "Locate the failed dependency when kubectl itself stops working.", "understand": ["If the API is unavailable, first distinguish DNS/endpoint resolution, TCP reachability, TLS validation, authentication, authorization and server health. Each boundary produces different evidence. Do not replace credentials to solve a network timeout.", "kubeadm commonly runs control-plane components as static Pods managed by kubelet. Their manifests live on the control-plane host. When the API is down, host-level runtime and service tools may be necessary."], "deep": ["An invalid manifest edit can stop an API server. Keep a known-good copy outside the watched manifest directory: backup files inside that directory can be interpreted as additional manifests. File paths, certificate mounts and listening addresses must match the actual host.", "Certificate expiry, incorrect SANs and untrusted issuers are distinct TLS problems. kubeadm certs check-expiration is useful for kubeadm-managed certificates, but it does not inspect every external certificate in a platform. Renewal requires the correct ownership and component restart procedure. Track validity proactively rather than treating expiry as an unpredictable outage."], "case": "The bank platform runbook includes a stable API endpoint, host access, a sanitized manifest checkpoint and a certificate inventory before any control-plane maintenance.", "nodes": [{"title": "Reach the API", "detail": "Name, network and TLS checks"}, {"title": "Inspect host components", "detail": "Static manifests and runtime logs"}, {"title": "Repair one dependency", "detail": "Restore health and retest clients"}], "diagramType": "flow", "lab": "On the disposable VM control plane, inventory static manifests and certificate expiration. Practise recovering a deliberately malformed copied manifest only after recording a known-good version and an out-of-band access route.", "verify": "The corrected control plane serves readyz, authenticated kubectl calls and subsequent workload changes. Record the exact failed field or certificate condition.", "fault": "An administrator stores api-server.yaml.bak beside static manifests. Move backup material outside the watched directory and inspect the resulting duplicate/conflicting workload behaviour.", "question": "Where should a backup copy of a static Pod manifest be stored?", "answer": "Outside the kubelet’s watched manifest directory so it cannot be mistaken for another active manifest.", "refs": ["https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/", "https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/", "https://kubernetes.io/docs/tasks/debug/debug-cluster/"], "mode": "Disposable Linux VM lab", "code": "sudo kubeadm certs check-expiration\nsudo ls /etc/kubernetes/manifests\nsudo crictl ps -a\nsudo journalctl -u kubelet --since \"15 minutes ago\"\nkubectl get --raw=\"/readyz?verbose\"", "prereq": "Disposable kubeadm VM, host access and known-good backups. Do not edit a real control-plane manifest for practice."}, {"id": "network-triage", "track": "cka", "title": "A networking fault tree you can actually use", "domain": "Troubleshooting", "summary": "Test names, endpoints, ports, policies and cross-node paths independently.", "understand": ["Begin at the client and reproduce a specific request. Can the hostname resolve? Does the destination Service exist in the intended namespace? Does it select ready endpoints? Does the backend process listen on the target port? Each answer removes a class of causes.", "Test the direct backend and Service path separately where permitted. A working Pod IP with a broken Service suggests selection or forwarding issues; a broken Pod IP can point to application listening, policy or network reachability."], "deep": ["A timeout and connection refusal imply different observations but are not universal diagnoses. A firewall can reject or drop; a proxy can generate an error on behalf of another component. Interpret the error with packet path and controller evidence rather than a memorised slogan.", "NetworkPolicy checks need both source egress and destination ingress. External exposure adds load-balancer health checks, firewall rules, route attachment and TLS. Do not make a dozen simultaneous changes: change one suspected cause, repeat the original request, and retain the before/after evidence."], "case": "bank-web is Ready but its Service has a typo in app selection. The fastest decisive evidence is an empty EndpointSlice set for that Service and a comparison of labels.", "nodes": [{"title": "Resolve and select", "detail": "DNS, namespace and endpoints"}, {"title": "Reach the listener", "detail": "Port, policy and data plane"}, {"title": "Check external layers", "detail": "Gateway/Ingress, TLS and load balancer"}], "diagramType": "flow", "lab": "Patch only the bank Service selector to an incorrect value, record the endpoint state and a failed client request, then restore bank.yaml and repeat the same request. Run this only in the disposable course cluster.", "verify": "Your root cause identifies the wrong selector and your recovery evidence includes a real successful response, not merely Ready Pods.", "fault": "An external 503 is treated as a DNS failure. Explain what the HTTP response already proves and inspect backend health next.", "question": "What evidence most directly checks whether a Service selects usable backends?", "answer": "Inspect its EndpointSlices, endpoint readiness and the corresponding Pod labels and ports.", "refs": ["https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/", "https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/", "https://kubernetes.io/docs/concepts/services-networking/network-policies/"], "mode": "Local cluster", "code": "kubectl -n tk-bank get svc bank-web -o yaml\nkubectl -n tk-bank get pods --show-labels\nkubectl -n tk-bank get endpointslices -l kubernetes.io/service-name=bank-web\nkubectl -n tk-bank patch svc bank-web -p '{\"spec\":{\"selector\":{\"app\":\"bank-typo\"}}}'\n# Observe the fault, then restore:\nkubectl apply -f bank.yaml", "prereq": "Complete Setup and the starter application lab."}, {"id": "observability", "track": "cka", "title": "Metrics, logs, events, traces and audit", "domain": "Troubleshooting", "summary": "Choose evidence for the question instead of collecting noise.", "understand": ["Metrics show measurements over time. Logs describe individual process events. Traces connect work across request boundaries. Kubernetes Events describe object-related observations, while audit logs record configured API activity. These are complementary signals.", "A CPU graph does not explain every failed user request. An application log without timestamps, correlation or retention may be insufficient for incident reconstruction. Define the question first: saturation, error rate, restart cause, latency segment or unauthorized API change."], "deep": ["A useful service-level indicator measures user-relevant outcomes, such as valid information-page requests that succeed within a threshold. Infrastructure availability is only a proxy. Percentiles require meaningful sample volumes, and averages can hide slow tails.", "Telemetry has cost and privacy implications. Do not log dummy patterns in a way that encourages logging real tokens, account numbers or payloads later. Control cardinality, retention and access. Monitoring should test its own gaps: a missing metric series is different from zero failures."], "case": "For the bank page, compare request success with Pod readiness, restart count and node resource usage. A green node dashboard does not prove the page content is correct.", "nodes": [{"title": "User outcome", "detail": "Success, latency and correctness"}, {"title": "System signals", "detail": "Metrics, logs, traces and Events"}, {"title": "Decision", "detail": "Diagnose, alert or verify a change"}], "diagramType": "flow", "lab": "Create a short evidence timeline for a failed rollout: timestamps, desired image, Events, ready replica count and HTTP result. Where metrics are unavailable, explicitly mark that signal absent instead of inventing utilization.", "verify": "The timeline supports a causal explanation and separates observed facts from hypotheses. No sensitive values appear in the evidence.", "fault": "No errors are logged because the logger is broken. Add an independent request probe and monitor telemetry health.", "question": "Is the absence of error logs proof that the service is healthy?", "answer": "No. Traffic or telemetry may be missing. Correlate independent user-level checks and signal health.", "refs": ["https://kubernetes.io/docs/concepts/cluster-administration/observability/", "https://kubernetes.io/docs/concepts/cluster-administration/logging/", "https://kubernetes.io/docs/tasks/debug/debug-cluster/resource-metrics-pipeline/"], "mode": "Local cluster", "code": "kubectl -n tk-bank get events --sort-by=.metadata.creationTimestamp\nkubectl -n tk-bank logs deployment/bank-web --timestamps --tail=40\nkubectl -n tk-bank get pods -o wide\n# top requires a working metrics API:\nkubectl -n tk-bank top pods", "prereq": "Complete Setup and the starter application lab."}, {"id": "cka-capstone", "track": "cka", "title": "CKA incident room and recovery rehearsal", "domain": "Certification practice", "summary": "Operate a cluster through change and failure with explicit evidence.", "understand": ["A cluster administrator must connect symptoms across applications, nodes and platform components. The capstone uses a separate multi-node lab and a set of controlled faults: bad placement, broken Service selection, node service interruption and storage misunderstanding.", "Before injecting a fault, define the expected blast radius, the recovery route and the evidence to capture. Change one thing at a time. A task is complete only when the original acceptance condition works again."], "deep": ["The CKA domain map gives troubleshooting the largest share, so diagnosis must be practised, not left as a reading appendix. Include timed read-only triage before repair: context, namespace, object status, recent changes, Events and relevant component logs.", "A local single-node cluster cannot prove highly available control-plane recovery or real cross-node networking. Keep those as separate VM exercises and record them as incomplete until actually performed. Professional depth adds change review, recovery rehearsal and incident communication beyond command speed."], "case": "The bank platform must serve its page, schedule replacements, resolve internal names and preserve the learning marker after a controlled recovery. Each success criterion is checked independently.", "nodes": [{"title": "Prepare", "detail": "Known-good state and recovery route"}, {"title": "Diagnose", "detail": "Collect evidence before one repair"}, {"title": "Prove recovery", "detail": "Retest service and platform dependencies"}], "diagramType": "flow", "lab": "Complete the CKA assessment task set. Use the multi-node/VM environment for its infrastructure tasks and local kind only for compatible workload tasks. Repeat unresolved faults until you can diagnose them without following an answer script.", "verify": "Retain a change log, fault timeline, repair diff and repeated acceptance checks. Mark unavailable infrastructure exercises honestly rather than awarding yourself completion.", "fault": "A reboot restores a node but the recurring disk-growth cause is unexplained. Write the prevention and monitoring follow-up before closing the incident.", "question": "Why does restoration alone not complete an incident investigation?", "answer": "Service recovery is essential, but the unresolved cause can recur. Record cause, contributing conditions, prevention and follow-up verification.", "refs": ["https://github.com/cncf/curriculum/blob/master/CKA_Curriculum_v1.35.pdf", "https://training.linuxfoundation.org/certification/certified-kubernetes-administrator-cka/", "https://kubernetes.io/docs/tasks/debug/debug-cluster/"], "mode": "Timed VM / cluster practice", "code": "", "prereq": "Complete CKAD and CKA lessons; disposable multi-node VM lab and tested recovery procedures."}, {"id": "gcp-start", "track": "gcp", "title": "Cloud setup, projects and cost boundaries", "domain": "ACE foundations", "summary": "Establish identity, scope, location and a cleanup plan before provisioning.", "understand": ["A Google Cloud project groups resources, enabled APIs, quotas and access policies. A billing account pays for linked usage; it is not the same thing as a project. A region is a geographical deployment area, while zones are separate locations within a region. Some services are regional, some zonal and some global.", "Install the current gcloud CLI or use Cloud Shell. Select a project you are allowed to use. Start with read-only inventory. Set a budget alert and check pricing before creating anything: an alerts-only budget sends notifications; it does not cap spending. Free credits, free-tier eligibility and regional pricing must be checked separately."], "deep": ["The CLI account, active configuration, project and Application Default Credentials are related but different settings. A command can use explicit flags that override defaults. A script can therefore affect a different project from the one displayed in a browser. Record project ID, region and identity with every lab result.", "API enablement grants availability of a service, not permission to use every resource. Quotas limit some operations but do not constitute a comprehensive spending stop. Build a resource inventory with an owner, location, creation purpose and cleanup command before starting. Never include real credentials in notes."], "case": "Harbour Bank learning uses one isolated sandbox and fictional content. The design for a real enterprise would separate environments and responsibilities; the inexpensive lab intentionally avoids reproducing that full organisation.", "nodes": [{"title": "Identity and project", "detail": "Who acts, and in which sandbox?"}, {"title": "Location and limits", "detail": "Region, APIs, quotas and budget"}, {"title": "Evidence and cleanup", "detail": "Inventory every created resource"}], "diagramType": "flow", "lab": "Run the read-only commands below. Replace the project ID in your shell before any later exercise. In the console, inspect billing linkage, budgets and the APIs dashboard. Write a cost/cleanup checklist. Offline: annotate a fictional inventory and identify which facts still require account verification.", "verify": "Record the selected account, project ID and region without copying tokens. Identify the budget notification recipients and explain what happens if they ignore an alert.", "fault": "A learner assumes a budget automatically stops a cluster. Identify the continuing billable resources and the separate action needed to remove them.", "question": "Does enabling an API create a free service entitlement?", "answer": "No. Enablement permits API use; permissions, quotas, pricing and resource charges remain separate.", "refs": ["https://cloud.google.com/sdk/docs/install", "https://cloud.google.com/resource-manager/docs/creating-managing-projects", "https://cloud.google.com/billing/docs/how-to/budgets", "https://cloud.google.com/docs/quotas/overview"], "mode": "GCP lab / offline design", "code": "gcloud version\ngcloud auth list\ngcloud config list\nexport TK_PROJECT=\"YOUR_ISOLATED_PROJECT_ID\"\nexport TK_REGION=\"us-central1\"\ngcloud projects describe \"$TK_PROJECT\"\ngcloud services list --enabled --project=\"$TK_PROJECT\"", "prereq": "A Google account and an authorised sandbox for live work. Reading and offline design need no account. No cloud resources are created by opening this guide."}, {"id": "gcp-hierarchy", "track": "gcp", "title": "Organisation, folders and landing-zone decisions", "domain": "ACE foundations", "summary": "Structure ownership before scattering resources across projects.", "understand": ["An organisation can contain folders and projects. Folders group projects for ownership and policy. Resources live under projects, but some controls and access are inherited from higher levels. Billing linkage is a separate relationship, so changing a folder does not itself move the bill.", "A landing zone is a prepared foundation: identity, resource hierarchy, network boundaries, logging, billing and operational ownership. It is not one Google Cloud product. A small learner account without an organisation can still study these decisions using a diagram."], "deep": ["IAM allow policies inherited from ancestors can grant access that is not obvious from a project-only view. Deny policies and organisation policies address different questions: who may perform an action versus which configurations are permitted. Inspect effective controls, not only the policy nearest the resource.", "Too many projects add administration; too few weaken isolation and cost accountability. Choose boundaries using environment, team autonomy, data sensitivity, quota needs and blast radius. Shared VPC centralises network ownership while service projects retain workload responsibility. Document exceptions rather than turning every exception into a new undocumented pattern."], "case": "Propose bank-sandbox, bank-test and bank-production projects under environment folders, with a shared-network host project in the enterprise design. Only the sandbox is used for learning.", "nodes": [{"title": "Organisation / folders", "detail": "Inherited governance and ownership"}, {"title": "Projects", "detail": "Environment and accountability boundaries"}, {"title": "Resources", "detail": "Workloads with effective policies"}], "diagramType": "architecture", "lab": "Draw the proposed hierarchy and a separate billing relationship. Give each project an owner and three permitted actions. Use get-ancestors where your account supports an organisation, and compare actual ancestry with the design. Offline: identify where a broad inherited grant would reach.", "verify": "The design explains why each boundary exists, where network ownership sits and how inherited access will be reviewed.", "fault": "A project administrator removes a local grant but access remains. Investigate ancestor grants and group membership instead of repeatedly editing the same binding.", "question": "Is a billing account a parent in the resource hierarchy?", "answer": "No. Billing association and organisation/folder/project ancestry are distinct relationships.", "refs": ["https://cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy", "https://cloud.google.com/architecture/landing-zones", "https://cloud.google.com/vpc/docs/shared-vpc"], "mode": "GCP lab / offline design", "code": "gcloud projects get-ancestors \"$TK_PROJECT\"\ngcloud projects get-iam-policy \"$TK_PROJECT\"", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gcp-iam", "track": "gcp", "title": "IAM, service accounts and least privilege", "domain": "ACE foundations", "summary": "Grant a specific identity only the actions needed on the intended resource.", "understand": ["A principal is an identity such as a user, group or service account. A role is a collection of permissions. A binding associates principals with a role on a resource, sometimes with a condition. Prefer a suitable predefined role at the narrowest practical scope over broad basic roles.", "A service account represents a workload identity; it is not a human login shared by a team. Kubernetes ServiceAccounts and Google IAM service accounts are different resources. A person allowed to deploy software should not automatically be able to impersonate every privileged workload identity."], "deep": ["Permission to attach or impersonate a service account can become a path to its authority. Review both resource access and identity delegation. Short-lived federation or impersonation is preferable to distributing long-lived key files, but still requires narrowly designed trust.", "Allow policies, deny policies, conditions, organisation controls and service-specific checks can all influence the result. An IAM grant may also take time to propagate. Use a denied action as evidence to investigate the exact principal, permission, resource and condition; do not “fix” every 403 by granting Owner."], "case": "A bank report reader should read only the dummy report bucket. A release identity may deploy the information service without reading production financial data.", "nodes": [{"title": "Principal", "detail": "User, group or workload identity"}, {"title": "Binding and scope", "detail": "Role on the intended resource"}, {"title": "Decision and audit", "detail": "Allowed action or explained denial"}], "diagramType": "flow", "lab": "Create a role matrix for viewer, deployer and report reader. Inspect existing policies and describe one predefined role. In an approved sandbox, have an administrator grant only the chosen narrow role, then test one intended read and one deliberately disallowed action. Offline: review the matrix for privilege escalation.", "verify": "Record the principal, resource scope, allowed action and denied action. Explain service-account delegation separately from ordinary resource access.", "fault": "A deployment fails with 403 and the proposed remedy is Owner. Identify the missing permission and the smallest justified role instead.", "question": "Does knowing a service-account email give permission to act as it?", "answer": "No. Identity use and impersonation require explicit authority; the address is only an identifier.", "refs": ["https://cloud.google.com/iam/docs/overview", "https://cloud.google.com/iam/docs/service-account-overview", "https://cloud.google.com/iam/docs/best-practices-for-managing-service-account-keys"], "mode": "GCP lab / offline design", "code": "gcloud iam roles describe roles/storage.objectViewer\ngcloud iam service-accounts list --project=\"$TK_PROJECT\"\ngcloud projects get-iam-policy \"$TK_PROJECT\"", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gcp-network", "track": "gcp", "title": "VPC, subnets, routes, firewalls and private access", "domain": "ACE foundations", "summary": "A packet needs a route, permission and a reachable destination.", "understand": ["A VPC network is global; its subnets are regional. IP ranges must be planned so connected networks do not overlap. Routes choose a path. Firewall policies permit or deny traffic along relevant boundaries. Neither a route nor a firewall rule creates an application listener.", "Cloud NAT supports outbound connections and their return traffic for eligible resources without external IPv4 addresses; it is not a general unsolicited inbound entry point. Private Google Access and private service access solve other connectivity needs. Learn the destination and service model before choosing a mechanism."], "deep": ["For GKE, node, Pod and Service addressing interact with VPC design. Running out of Pod addresses can prevent growth even when CPU quota remains. A network plan therefore needs address capacity, security boundaries, DNS, egress and connectivity to managed dependencies.", "Hybrid connections add VPN or Interconnect, route advertisement, redundancy, MTU and DNS decisions. Network reachability does not establish application authentication. Trace both directions of a connection and identify the exact control blocking it before broadening access."], "case": "Place bank workloads in a dedicated regional subnet. The future report database has a private connection plan, while administrators reach the platform through an approved access path rather than exposing management ports to everyone.", "nodes": [{"title": "Address and route", "detail": "VPC, subnet and destination path"}, {"title": "Security boundary", "detail": "Firewall and identity controls"}, {"title": "Dependency access", "detail": "DNS, private services and egress"}], "diagramType": "architecture", "lab": "Inventory networks, subnets and firewall rules using read-only commands. Draw the route from a private workload to a Google API and separately to the public internet. Mark which path needs NAT or private access in your chosen design. Offline: use invented, non-overlapping CIDRs.", "verify": "For each path, explain source, destination, DNS, route, firewall and authentication. Include an address-capacity estimate for cluster growth.", "fault": "A private node cannot pull an external image. Verify DNS and outbound connectivity; adding an inbound web firewall rule does not repair egress.", "question": "Does Cloud NAT expose a private workload to arbitrary incoming internet connections?", "answer": "No. It supports configured outbound connectivity and return traffic; inbound exposure requires a separate design.", "refs": ["https://cloud.google.com/vpc/docs/vpc", "https://cloud.google.com/vpc/docs/routes", "https://cloud.google.com/vpc/docs/firewalls", "https://cloud.google.com/nat/docs/overview", "https://cloud.google.com/vpc/docs/private-google-access"], "mode": "GCP lab / offline design", "code": "gcloud compute networks list --project=\"$TK_PROJECT\"\ngcloud compute networks subnets list --project=\"$TK_PROJECT\"\ngcloud compute firewall-rules list --project=\"$TK_PROJECT\"", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gcp-compute", "track": "gcp", "title": "Choose VMs, managed containers or GKE", "domain": "ACE foundations", "summary": "Select the operating model from constraints, not from product popularity.", "understand": ["Compute Engine supplies virtual machines and extensive OS control. Managed instance groups maintain VM fleets from templates and can scale them. Cloud Run runs supported container workloads with a managed execution model. GKE offers Kubernetes APIs and ecosystem integration with a managed control plane.", "Choose using workload shape, required runtime control, team skills, scaling, networking, state, startup time and operational cost. A container image alone does not make every service the best fit. Different parts of one business system can reasonably use different platforms."], "deep": ["A VM group health check, application readiness check and user-level service indicator answer different questions. Autoscaling can add instances, but cannot repair a serial database bottleneck or incorrect concurrency handling. Stateless replicas need external state and retry-aware interactions.", "Managed services transfer selected infrastructure duties to the provider; they do not transfer responsibility for access design, application bugs, data retention or cost. Document which patching, scaling and incident tasks remain with your team for each option."], "case": "The tiny bank information page does not inherently require GKE. We choose GKE for Kubernetes learning. A production recommendation might favour a simpler managed container service, while a legacy OS-bound reporting engine could remain on VMs.", "nodes": [{"title": "Compute Engine / MIG", "detail": "OS control and fleet responsibility"}, {"title": "Cloud Run", "detail": "Managed application execution"}, {"title": "GKE", "detail": "Kubernetes orchestration and ecosystem"}], "diagramType": "comparison", "lab": "Write a decision record comparing all three for the information page and a long-running legacy report worker. Score operational effort, required control, scaling and cost assumptions. Use read-only inventory if a sandbox already contains examples; no resource creation is necessary.", "verify": "The chosen option follows a stated requirement, with one rejected alternative and a condition that would change the decision.", "fault": "A team chooses Kubernetes because the app is containerised. Identify whether it actually needs Kubernetes-specific capabilities.", "question": "Does using a managed service remove application security responsibilities?", "answer": "No. The provider manages defined infrastructure layers; workload identity, code, data and configuration still need owners.", "refs": ["https://cloud.google.com/compute/docs/instance-groups", "https://cloud.google.com/run/docs/overview/what-is-cloud-run", "https://cloud.google.com/kubernetes-engine/docs/concepts/kubernetes-engine-overview"], "mode": "GCP lab / offline design", "code": "gcloud compute instances list --project=\"$TK_PROJECT\"\ngcloud run services list --project=\"$TK_PROJECT\"\ngcloud container clusters list --project=\"$TK_PROJECT\"", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gcp-storage", "track": "gcp", "title": "Object storage, lifecycle and recovery", "domain": "ACE operations", "summary": "Treat durability, access, retention and recoverability as separate choices.", "understand": ["Cloud Storage holds objects in buckets. An object store is not a general POSIX filesystem and does not automatically behave like a local disk. Choose location and storage class using access frequency, availability requirements and the costs of operations, retrieval and early deletion where applicable.", "Uniform bucket-level access simplifies access management through IAM rather than mixing object ACLs. Public access prevention helps avoid unintended public sharing. Retention, versioning, soft deletion and lifecycle rules solve different problems; understand their interaction before promising deletion or recovery."], "deep": ["A lifecycle rule can change classes or delete objects when conditions match. That is an automated policy with consequences, not merely a label. Retained or recoverable versions can continue to consume storage and incur charges after an ordinary delete.", "Encryption at rest is part of the service, while customer-managed keys add control and key-availability obligations. A bucket with no public access can still be accessed by an overprivileged identity. Verify both policy and an actual allowed/denied read."], "case": "Store only dummy bank statements such as “Learning report: no financial data.” Give a report reader object-view permission and keep the bucket private. Record retention decisions as a learning design, not a legal banking compliance claim.", "nodes": [{"title": "Bucket policy", "detail": "Location, access and protection"}, {"title": "Object lifecycle", "detail": "Create, read, version and expire"}, {"title": "Recovery test", "detail": "Restore the intended checkpoint"}], "diagramType": "flow", "lab": "In your sandbox, use the console to create a uniquely named private bucket in the chosen region, review retention/soft-delete defaults and upload one dummy text file. List and read it with your authorised identity. Delete the test object and bucket when permitted; inspect recoverable versions and retention before assuming billing ended. Offline: design the lifecycle table.", "verify": "Capture location, access policy and the dummy response. Explain whether deleting the current object leaves recoverable copies and what costs may remain.", "fault": "A cleanup attempt is blocked by retention. Explain why a retention control should not be enabled casually during a short-lived lab.", "question": "Is object versioning the same as a tested business recovery process?", "answer": "No. You still need the right versions, access, dependencies and a verified restoration procedure.", "refs": ["https://cloud.google.com/storage/docs/introduction", "https://cloud.google.com/storage/docs/uniform-bucket-level-access", "https://cloud.google.com/storage/docs/lifecycle", "https://cloud.google.com/storage/docs/soft-delete"], "mode": "GCP lab / offline design", "code": "export TK_BUCKET=\"YOUR_UNIQUE_LAB_BUCKET\"\ngcloud storage buckets describe \"gs://$TK_BUCKET\" --project=\"$TK_PROJECT\"\ngcloud storage ls \"gs://$TK_BUCKET\"\n# Read only your known dummy object:\ngcloud storage cat \"gs://$TK_BUCKET/learning-report.txt\"", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gcp-data", "track": "gcp", "title": "Select a database and preserve business invariants", "domain": "ACE foundations", "summary": "Match transactions, access patterns and scale before choosing a database.", "understand": ["Cloud SQL provides managed relational engines for familiar relational workloads. Spanner addresses distributed relational needs with its own design and cost considerations. Firestore is a document database; Bigtable targets large-scale key-oriented workloads; BigQuery is an analytical warehouse. These are not interchangeable stores with different logos.", "Begin with reads, writes, transaction boundaries, latency, volume, consistency, recovery and operational skills. A balance transfer needs reliable business invariants. Kubernetes replicas do not make two unrelated database writes atomic."], "deep": ["For a hypothetical transfer, debit, credit and the immutable transfer record must obey the chosen transaction model. An idempotency key prevents a retried request from creating a second logical transfer when implemented with durable uniqueness and result handling. A network timeout leaves an uncertain result that must be reconciled, not blindly repeated.", "Separate operational transactions from analytical queries when their load and latency needs differ. Replication is not automatically a backup: it may copy a bad write quickly. Database-specific point-in-time recovery, schema migration compatibility and a verified restore remain essential."], "case": "The current lab serves only a static page. A future bank transfer service would need an explicitly designed ledger and database transaction model. A reporting warehouse can consume controlled copies rather than run every report against the live transaction path.", "nodes": [{"title": "Transactional store", "detail": "Atomic business changes"}, {"title": "Document / key access", "detail": "Fit the query and consistency model"}, {"title": "Analytics", "detail": "Historical aggregation and exploration"}], "diagramType": "comparison", "lab": "Create a data decision table for user preferences, transfer records and monthly aggregate reports. Walk through a timeout after a committed transfer and a duplicate retry. Write pseudocode with a durable idempotency record. No real financial system or cloud database is required for this design exercise.", "verify": "Explain where atomicity lives, how duplicates are detected and which recovery checkpoint restores correct business state.", "fault": "A proposal places an authoritative ledger in an eventually reconciled cache. Identify the lost-update, durability and audit questions before selecting a product.", "question": "Can a queue or Kubernetes restart guarantee exactly one financial effect?", "answer": "No. Correct effects require application and storage semantics, such as durable idempotency and transactional boundaries.", "refs": ["https://cloud.google.com/sql/docs/introduction", "https://cloud.google.com/spanner/docs/overview", "https://cloud.google.com/firestore/docs/overview", "https://cloud.google.com/bigtable/docs/overview", "https://cloud.google.com/bigquery/docs/introduction"], "mode": "Offline architecture exercise", "code": "", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gcp-events", "track": "gcp", "title": "Events, queues, retries and idempotency", "domain": "ACE operations", "summary": "Decouple work without pretending delivery and business effects are identical.", "understand": ["A publisher sends an event; a subscription makes it available to consumers. Pub/Sub supports asynchronous communication so a slow report generator does not need to block a user-facing request. Cloud Tasks serves a different task-dispatch model where a producer targets scheduled work.", "A consumer must decide when to acknowledge success. If it crashes after changing data but before acknowledgement, delivery may be repeated. Design the effect to tolerate retries, and distinguish a delivery guarantee from an end-to-end business guarantee."], "deep": ["Retry limits, backoff, dead-letter handling, message retention and ordering requirements affect recovery. Ordering can reduce concurrency and has scope conditions. Exactly-once delivery features have documented boundaries; they do not make an arbitrary database update plus external email one atomic operation.", "An outbox pattern can record a business change and an event intention in one database transaction. A separate publisher forwards that intention, while consumers deduplicate where needed. Observe backlog age as well as count: a small set of very old messages can hide a stuck customer workflow."], "case": "A dummy statement-request event triggers a report worker. Each request has a stable ID so retrying the event does not create duplicate externally visible reports.", "nodes": [{"title": "Publish intention", "detail": "Stable event ID and relevant metadata"}, {"title": "Deliver and process", "detail": "Retries, acknowledgement and deduplication"}, {"title": "Recover failures", "detail": "Backlog, dead-letter review and replay"}], "diagramType": "flow", "lab": "Offline, trace publish → process → write result → crash → redelivery using a table of event ID and stored result. For an optional sandbox lab, use the Pub/Sub console tutorial with dummy events, inspect a subscription backlog, and delete only the created topic/subscription afterward.", "verify": "The second delivery produces the same logical result rather than a duplicate effect. The runbook says who investigates messages that cannot be processed.", "fault": "A consumer acknowledges before persisting its result and crashes. Explain the lost-work window and change the processing boundary.", "question": "Does acknowledging receipt prove that a business operation completed?", "answer": "No. Acknowledgement should follow the application’s durable success condition, subject to its processing design.", "refs": ["https://cloud.google.com/pubsub/docs/overview", "https://cloud.google.com/pubsub/docs/exactly-once-delivery", "https://cloud.google.com/tasks/docs/dual-overview", "https://cloud.google.com/pubsub/docs/dead-letter-topics"], "mode": "GCP lab / offline design", "code": "gcloud pubsub topics list --project=\"$TK_PROJECT\"\ngcloud pubsub subscriptions list --project=\"$TK_PROJECT\"", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gke-modes", "track": "gcp", "title": "GKE Autopilot and Standard responsibilities", "domain": "GKE developer and administrator", "summary": "Choose how much node management belongs to your team.", "understand": ["GKE manages the Kubernetes control plane. Autopilot additionally manages much of the node infrastructure and applies workload constraints; Standard provides more control over node pools and configuration. Both still require correct application manifests, identity, networking and operational decisions.", "Use current feature support and workload requirements when choosing. Privileged host access, unusual agents, specialised infrastructure and migration constraints need explicit review. Do not infer support or price solely from the mode name."], "deep": ["An Autopilot workload can receive defaults or adjusted requests according to current platform rules. Inspect the admitted Pod, not just your local YAML. Standard node pools introduce machine type, size, autoscaling, upgrade and security decisions that must have owners.", "A regional control plane does not distribute application replicas correctly by itself. Node placement, topology constraints, storage, dependencies and capacity still determine the user’s experience. Regional availability and disaster recovery across regions are different designs."], "case": "Use Autopilot for an optional managed-platform lab, then document what would justify Standard for a specialised bank workload. Keep the simpler local kind environment for most CKAD practice.", "nodes": [{"title": "Autopilot", "detail": "Managed infrastructure with guardrails"}, {"title": "Standard", "detail": "More node-pool control and decisions"}, {"title": "Shared responsibility", "detail": "Workloads, identity, data and outcomes"}], "diagramType": "comparison", "lab": "Compare the current GKE mode documentation against the bank page, a privileged diagnostic agent and a specialised compute job. Inspect a cluster if available. Produce an owner matrix for node patching, image updates, IAM, backups and workload probes.", "verify": "Each responsibility has an explicit owner and a reason. Identify which local lab manifests may need adaptation before Autopilot admission.", "fault": "A restricted workload is rejected and the team assumes Kubernetes YAML is universal. Inspect GKE admission requirements and choose a compatible workload or justified platform change.", "question": "Does Autopilot make application image patching Google’s responsibility?", "answer": "No. Managed infrastructure duties do not remove ownership of your application image and dependencies.", "refs": ["https://cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview", "https://cloud.google.com/kubernetes-engine/docs/concepts/cluster-architecture", "https://cloud.google.com/kubernetes-engine/docs/concepts/autopilot-security"], "mode": "GCP lab / offline design", "code": "gcloud container clusters list --project=\"$TK_PROJECT\"", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gke-first", "track": "gcp", "title": "Create, inspect and remove a learning GKE cluster", "domain": "GKE developer and administrator", "summary": "Connect cloud control-plane access to the Kubernetes workflow you already know.", "understand": ["Creating a cluster requires an authorised project, billing, enabled APIs, available quota and a compatible network. Use a dedicated node service account with the documented minimum node role. This identity handles node-level operations; it is different from an application’s identity.", "The commands below deliberately name the project, region, network and cluster. Replace every placeholder after reviewing the creation page. A dedicated kubeconfig prevents cloud credentials from overwriting your local lab configuration. Install the GKE authentication plugin through official instructions."], "deep": ["get-credentials configures client access; it does not grant every Kubernetes action. The network endpoint, Google authentication, IAM and Kubernetes authorization all matter. An account can list a cluster yet fail to access its API or create a workload.", "Deploy a fresh copy of bank.yaml and inspect any Autopilot changes to resources. Use ClusterIP plus port-forward rather than creating a public load balancer for this first lab. Deletion must include verification of dependent resources and retained storage; a successful CLI exit alone is not your full cleanup evidence."], "case": "The same fictional information page runs in a new managed cluster. Compare the resulting Pod resources and node information with kind, then explain the responsibilities now handled by GKE.", "nodes": [{"title": "Cloud provisioning", "detail": "Project, node identity and cluster"}, {"title": "Client access", "detail": "Dedicated kubeconfig and authentication"}, {"title": "Workload evidence", "detail": "Ready Pods plus a verified response"}], "diagramType": "flow", "lab": "First create a reviewed node service account and grant roles/container.defaultNodeServiceAccount as described in the official guide; ensure the creator may act as it. Use an existing isolated lab VPC/subnet. Run the commands only after confirming cost. Verify the bank marker through localhost. Delete the named cluster and inspect remaining resources. Offline: annotate every prerequisite and predict the observations.", "verify": "Record cluster location, API context, admitted Pod settings, page response and cleanup inventory. Cloud execution is learner-performed; the course authors did not provision your project.", "fault": "get-credentials works but kubectl is forbidden. Identify the active principal and authorization layer rather than downloading a service-account key.", "question": "Does obtaining kubeconfig automatically grant cluster-admin?", "answer": "No. Client connection settings and authentication are separate from authorization.", "refs": ["https://cloud.google.com/kubernetes-engine/docs/how-to/creating-an-autopilot-cluster", "https://cloud.google.com/kubernetes-engine/docs/how-to/cluster-access-for-kubectl", "https://cloud.google.com/kubernetes-engine/docs/how-to/service-accounts"], "mode": "GCP lab / offline design", "code": "export TK_CLUSTER=\"tk-bank-learning\"\nexport TK_NETWORK=\"YOUR_LAB_NETWORK\"\nexport TK_SUBNET=\"YOUR_LAB_SUBNET\"\nexport TK_NODE_SA=\"YOUR_NODE_SA@$TK_PROJECT.iam.gserviceaccount.com\"\nexport KUBECONFIG=\"$PWD/gke-learning-kubeconfig\"\ngcloud services enable container.googleapis.com --project=\"$TK_PROJECT\"\ngcloud container clusters create-auto \"$TK_CLUSTER\" --project=\"$TK_PROJECT\" --region=\"$TK_REGION\" --network=\"$TK_NETWORK\" --subnetwork=\"$TK_SUBNET\" --service-account=\"$TK_NODE_SA\" --release-channel=regular\ngcloud container clusters get-credentials \"$TK_CLUSTER\" --project=\"$TK_PROJECT\" --region=\"$TK_REGION\"\nkubectl config current-context\nkubectl apply -f bank.yaml\nkubectl -n tk-bank rollout status deployment/bank-web --timeout=600s\nkubectl -n tk-bank port-forward service/bank-web 8080:80\n# After verification, stop forwarding with Ctrl-C.\n# Delete ONLY this disposable cluster when finished with GKE lessons:\n# gcloud container clusters delete \"$TK_CLUSTER\" --project=\"$TK_PROJECT\" --region=\"$TK_REGION\"", "prereq": "An isolated billable project; container API; reviewed network/subnet; node service account and required grants; GKE auth plugin; bank.yaml. Check current regional pricing and quotas first."}, {"id": "gke-identity", "track": "gcp", "title": "Workload Identity Federation for GKE", "domain": "GKE developer and administrator", "summary": "Let a named Kubernetes workload access a narrowly scoped cloud resource.", "understand": ["A Kubernetes ServiceAccount identifies a Pod to Kubernetes. Workload Identity Federation for GKE allows eligible workloads to obtain short-lived Google Cloud credentials using that workload identity. It avoids placing a downloaded long-lived service-account key into a Kubernetes Secret.", "One supported approach grants a resource role directly to the federated principal. Another uses IAM service-account impersonation when needed for supported service or application requirements. These are alternative configurations, not steps that must always be combined."], "deep": ["The identity includes the workload pool, namespace and Kubernetes ServiceAccount name. Misstating any of them can bind permission to the wrong subject. Trust scope and Kubernetes permissions matter too: someone able to run arbitrary Pods as a privileged ServiceAccount can potentially exercise its cloud permissions.", "Autopilot enables the relevant managed identity integration; Standard requires the appropriate cluster/node-pool configuration. Application credential discovery must use the intended identity path. Test a permitted operation and a denied operation; successful Pod startup is not proof of Google API access."], "case": "The bank report-reader Pod uses a dedicated KSA and may read only the dummy bucket. It cannot upload objects or read unrelated buckets. Node identity is not reused as the application identity.", "nodes": [{"title": "Pod and KSA", "detail": "Named namespace/workload identity"}, {"title": "Federated credentials", "detail": "Short-lived identity through GKE"}, {"title": "Resource IAM", "detail": "Allow only the intended bucket read"}], "diagramType": "flow", "lab": "Follow the linked direct-resource-access walkthrough using your dummy bucket. Create bank-reports in tk-bank, derive the project number, and grant objectViewer to its exact principal on that bucket. Run the official test Pod configured with serviceAccountName bank-reports. Compare a dummy read with a denied write. Remove the binding after the lab. Offline: trace identity and trust without inventing token contents.", "verify": "Capture the KSA name, redacted principal construction, successful dummy read and denied write. Do not store token output. Confirm no downloaded key file was used.", "fault": "The bucket role exists but names the default namespace. Compare the bound principal with the actual Pod’s namespace and ServiceAccount.", "question": "Is a KSA automatically the same object as an IAM service account?", "answer": "No. They are separate identities. Federation or an explicitly configured impersonation relationship connects access where required.", "refs": ["https://cloud.google.com/kubernetes-engine/docs/concepts/workload-identity", "https://cloud.google.com/kubernetes-engine/docs/how-to/workload-identity"], "mode": "GCP lab / offline design", "code": "kubectl -n tk-bank create serviceaccount bank-reports\nexport TK_PROJECT_NUMBER=\"$(gcloud projects describe \"$TK_PROJECT\" --format=\"value(projectNumber)\")\"\nexport TK_PRINCIPAL=\"principal://iam.googleapis.com/projects/$TK_PROJECT_NUMBER/locations/global/workloadIdentityPools/$TK_PROJECT.svc.id.goog/subject/ns/tk-bank/sa/bank-reports\"\ngcloud storage buckets add-iam-policy-binding \"gs://$TK_BUCKET\" --member=\"$TK_PRINCIPAL\" --role=roles/storage.objectViewer\n# Run the linked official test Pod using this KSA; never print credentials.\n# After collecting evidence:\n# gcloud storage buckets remove-iam-policy-binding \"gs://$TK_BUCKET\" --member=\"$TK_PRINCIPAL\" --role=roles/storage.objectViewer", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gke-network", "track": "gcp", "title": "GKE networking, exposure and policy", "domain": "GKE developer and administrator", "summary": "Separate cluster service discovery from VPC and external traffic.", "understand": ["Pod networking, Service addressing and external exposure are different layers. A ClusterIP is for cluster-internal service access. A LoadBalancer Service requests an implementation-specific load balancer. Ingress or Gateway can express richer routing when a compatible controller and configuration are present.", "GKE networking choices include IP allocation, endpoint access, dataplane features and network policy. Dataplane V2 uses an eBPF-based implementation; it does not make every traffic path or security control identical to another cluster."], "deep": ["External traffic can depend on forwarding rules, health checks, firewall permissions, backend readiness, route status and TLS. A Pod serving localhost in its container can still be unreachable from a backend health check. Keep Kubernetes and cloud evidence together.", "Private nodes do not imply a private control-plane endpoint, nor do they guarantee working egress to every registry. Network policies, VPC firewall rules and IAM act at different boundaries. Design and test both permitted and forbidden paths; a diagram with a lock icon is not evidence of isolation."], "case": "The bank learning page stays behind port-forward initially. A later exposure design introduces a Gateway and certificate while retaining explicit internal access to reports and an isolated data dependency.", "nodes": [{"title": "Inside the cluster", "detail": "Pod IPs, DNS and Service endpoints"}, {"title": "At the boundary", "detail": "Gateway / load balancer and health"}, {"title": "Across the VPC", "detail": "Firewall, egress and private access"}], "diagramType": "architecture", "lab": "Inspect the cluster network configuration and bank EndpointSlices. Draw browser → external entry → Service/backend → Pod and label which addresses and resources are real in your lab. If you add a GKE Gateway, use the current controller guide, verify status and an actual request, then remove cloud load-balancing resources as part of cleanup. Offline: identify the checks for a 503.", "verify": "Explain every boundary and distinguish a programmed route from a healthy response. Identify where policy is actually enforced.", "fault": "All Pods are Ready but the external backend is unhealthy. Compare health-check path/port, firewall and routing instead of scaling replicas blindly.", "question": "Does a private node configuration prove all cluster access is private?", "answer": "No. API endpoint exposure, workload ingress and outbound connectivity are separate settings.", "refs": ["https://cloud.google.com/kubernetes-engine/docs/concepts/alias-ips", "https://cloud.google.com/kubernetes-engine/docs/concepts/dataplane-v2", "https://cloud.google.com/kubernetes-engine/docs/concepts/gateway-api", "https://cloud.google.com/kubernetes-engine/docs/concepts/network-overview"], "mode": "GCP lab / offline design", "code": "gcloud container clusters describe \"$TK_CLUSTER\" --region=\"$TK_REGION\" --project=\"$TK_PROJECT\"\nkubectl -n tk-bank get service,endpointslices\nkubectl get networkpolicies -A", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gke-lifecycle", "track": "gcp", "title": "Release channels, scaling and disruption budgets", "domain": "GKE developer and administrator", "summary": "Keep infrastructure current while protecting application service.", "understand": ["A release channel controls the stream of GKE versions and upgrade behaviour. Maintenance windows and exclusions influence timing within supported limits; they do not promise indefinite avoidance of required updates. Review current lifecycle rules and support dates.", "Workload autoscaling changes replicas or resource recommendations. Infrastructure autoscaling changes available capacity according to the platform mode and constraints. These loops are related but distinct. A replica request can remain unsatisfied because of quota, address space, storage topology or incompatible placement."], "deep": ["A PodDisruptionBudget protects against some voluntary disruptions through the eviction path. It cannot prevent every node failure, application crash or involuntary disruption. Too-strict budgets combined with unhealthy replicas can obstruct maintenance without creating more actual resilience.", "Before an upgrade, check deprecated APIs, webhooks, CNI/CSI dependencies, node characteristics and application acceptance tests. Stage changes in a representative environment and retain evidence. Avoid scaling down solely because average CPU looks low when peak latency or memory is the real constraint."], "case": "The bank page uses two or more replicas, meaningful readiness and a reviewed disruption budget. A maintenance rehearsal tests actual page availability while a node is replaced rather than claiming success from the final Ready count.", "nodes": [{"title": "Version policy", "detail": "Channel, support and maintenance"}, {"title": "Capacity loops", "detail": "Replica demand and available nodes"}, {"title": "Service verification", "detail": "Disruption tolerance and request tests"}], "diagramType": "flow", "lab": "Inspect cluster release-channel configuration and workload resources. Build a maintenance checklist and rehearse Pod replacement in the local lab. In GKE, inspect upgrade notifications and autoscaler decisions without forcing an unsupported downgrade. Offline: analyse a Pending Pod with exhausted quota.", "verify": "Identify which component scales, what metric drives it and what can block it. State whether your evidence covers a Pod restart, node replacement or control-plane upgrade.", "fault": "An HPA asks for more Pods but no node capacity arrives. Check requests, quotas, topology and autoscaler evidence before lowering readiness standards.", "question": "Does a disruption budget guarantee zero downtime?", "answer": "No. It is one voluntary-disruption control; capacity, health, routing, state and involuntary failures still matter.", "refs": ["https://cloud.google.com/kubernetes-engine/docs/concepts/release-channels", "https://cloud.google.com/kubernetes-engine/docs/concepts/cluster-autoscaler", "https://cloud.google.com/kubernetes-engine/docs/concepts/maintenance-windows-and-exclusions"], "mode": "GCP lab / offline design", "code": "kubectl -n tk-bank get deployment,hpa,pdb\nkubectl -n tk-bank get events --sort-by=.metadata.creationTimestamp\ngcloud container operations list --project=\"$TK_PROJECT\" --region=\"$TK_REGION\"", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gcp-delivery", "track": "gcp", "title": "Artifact Registry, build provenance and progressive delivery", "domain": "ACE operations", "summary": "Promote a traceable artifact through verified environments.", "understand": ["Artifact Registry stores build artifacts such as container images. A build pipeline produces an image, tests it and records evidence. A deployment pipeline changes an environment to run a selected artifact. Separating build from promotion helps ensure the tested image is the one being deployed.", "An image tag is a convenient name that may move. A digest identifies content. Pin an approved digest for reproducible promotion, while planning how new security updates will be built and released. Do not place cloud secrets in image layers or source repositories."], "deep": ["Cloud Build can execute builds and Cloud Deploy can manage supported delivery targets and rollout processes. Pipeline identities need carefully bounded authority. A build that can deploy production without review collapses a useful trust boundary even if every step has a green status.", "Scanning, provenance and admission policy are complementary controls. A scan result is time-dependent and not proof of zero vulnerabilities. Binary Authorization can enforce configured deployment policy for supported targets, but application correctness and data migration safety still require tests and a rollback/forward-fix plan."], "case": "Promote one bank information-page digest from test to a small production canary. Verify the marker and request health before increasing exposure. Keep any database migration backward compatible through the transition.", "nodes": [{"title": "Build and attest", "detail": "Source, tests and artifact digest"}, {"title": "Approve and promote", "detail": "Environment-specific release authority"}, {"title": "Observe and recover", "detail": "Canary evidence and rollback limits"}], "diagramType": "flow", "lab": "Create an offline release evidence sheet: source revision, image digest, test result, approver, target and recovery action. Optionally use an isolated Artifact Registry repository and the official build quickstart with the dummy page; record identity permissions and delete stored artifacts afterward. Compare an image change with a database schema change.", "verify": "The same digest appears in build evidence and the running Pod specification. Explain what an image rollback does not undo.", "fault": "A pipeline rebuilds a mutable tag separately in production. Identify why passing tests in staging no longer proves the deployed bytes were tested.", "question": "Does an image digest prove that the image is safe?", "answer": "No. It identifies content. Security, correctness, provenance and authorization need additional evidence.", "refs": ["https://cloud.google.com/artifact-registry/docs/overview", "https://cloud.google.com/build/docs/overview", "https://cloud.google.com/deploy/docs/overview", "https://cloud.google.com/binary-authorization/docs/overview"], "mode": "GCP lab / offline design", "code": "gcloud artifacts repositories list --project=\"$TK_PROJECT\"\nkubectl -n tk-bank get deployment bank-web -o yaml\n# Compare spec image digest with your approved release evidence.", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gcp-iac", "track": "gcp", "title": "Infrastructure as code, state and change review", "domain": "ACE operations", "summary": "Make infrastructure intent reviewable and repeatable.", "understand": ["Infrastructure as code records desired resources in versioned files. Terraform plans differences and applies supported changes through provider APIs. State associates configuration with managed objects; it is not merely a disposable cache.", "A plan is a proposal based on current information, not an unconditional guarantee. Review replacements, identity permissions, dependencies and cost before applying. Start with a small isolated resource and name every variable rather than copying a large production template blindly."], "deep": ["State can contain sensitive values even when terminal output hides them. Protect the backend, access, locking and recovery. Concurrent writers and out-of-band changes create drift and confusion. Importing an existing resource needs care so configuration describes the actual intended lifecycle.", "A successful infrastructure apply does not prove the application works. Follow it with configuration checks and service acceptance tests. Separate secrets from source, pin appropriate provider/module versions and use an authorised delivery identity for changes."], "case": "The bank platform records network and cluster intent separately from workload manifests. A pull-request review checks destructive replacements before the plan is approved for the sandbox.", "nodes": [{"title": "Configuration", "detail": "Versioned intent and variables"}, {"title": "Plan and state", "detail": "Match resources and review change"}, {"title": "Apply and verify", "detail": "Provision, then test real outcomes"}], "diagramType": "flow", "lab": "Create an original pseudocode module interface for project, region, network and labels. Review the linked Google Cloud Terraform tutorial before a live apply. If Terraform is available, run fmt and validate on a local configuration; use plan only with an authorised sandbox. Offline: annotate a hypothetical plan replacing a stateful resource.", "verify": "Your review identifies state protection, destructive changes, drift and post-apply tests. Do not claim a plan was executed when only a design was reviewed.", "fault": "A developer commits a state file because it looks like JSON documentation. Identify sensitive content risk and the intended protected backend.", "question": "Does terraform validate confirm that cloud permissions and quota will allow apply?", "answer": "No. Validation checks configuration consistency; live planning and execution have additional dependencies.", "refs": ["https://cloud.google.com/docs/terraform/terraform-overview", "https://cloud.google.com/docs/terraform/best-practices/general-style-structure", "https://cloud.google.com/docs/terraform/resource-management/store-state"], "mode": "GCP lab / offline design", "code": "# In a reviewed Terraform learning directory:\nterraform fmt -check\nterraform validate\n# Run plan/apply only after configuring your authorised isolated project.", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gcp-observe", "track": "gcp", "title": "Cloud operations: logs, metrics, alerts and SLOs", "domain": "ACE operations", "summary": "Monitor the experience users receive and the dependencies that explain it.", "understand": ["Cloud Logging records supported log data and Cloud Monitoring provides metrics, dashboards and alerting. An SLI measures an outcome; an SLO defines a target over a window. A service can have healthy infrastructure metrics while returning the wrong content or failing a critical workflow.", "Choose a small set of meaningful indicators: valid request success, latency, data freshness and correctness checks where appropriate. Route actionable alerts to an owner with a runbook. A dashboard nobody interprets is not an incident response capability."], "deep": ["If a monthly request-success target is 99.9%, the error budget is 0.1% of the measured valid requests in that window. This is not automatically the same as a fixed number of downtime minutes. Define exclusions, sampling, missing data and denominator carefully before using a percentage.", "Logs and metrics have access, retention, cardinality and ingestion costs. Audit logging and application logging have different coverage. Redact sensitive values and protect investigation access. Test the alert path, including notifications, instead of assuming an enabled policy reaches a responder."], "case": "The bank page check requests the page and verifies its marker. A second signal checks elevated failure rates. The incident note correlates rollout time, Pod state and user-level errors without exposing account data.", "nodes": [{"title": "Measure outcome", "detail": "Requests, latency and valid evidence"}, {"title": "Correlate signals", "detail": "Logs, metrics, traces and changes"}, {"title": "Act with ownership", "detail": "Alert, runbook and recovery check"}], "diagramType": "flow", "lab": "Write one SLI definition and calculate a request-based error budget for 200,000 requests at 99.9% success: 200 failed requests are the full budget. Inspect recent dummy-workload logs if running GKE. Design and test a low-volume non-paging notification only in your own lab. Offline: diagnose an evidence timeline.", "verify": "The indicator has a clear numerator, denominator and window. Your alert has an owner, response and test result, or is explicitly marked untested.", "fault": "No failures appear because the telemetry pipeline stopped. Add signal-health checks and independent synthetic requests.", "question": "Is a 99.9% request SLO necessarily a promise of exactly 43.2 minutes downtime per month?", "answer": "No. Request-based and time-based SLIs have different denominators; traffic distribution and window definitions matter.", "refs": ["https://cloud.google.com/monitoring/docs/monitoring-overview", "https://cloud.google.com/logging/docs/overview", "https://cloud.google.com/stackdriver/docs/solutions/slo-monitoring", "https://cloud.google.com/architecture/framework/operational-excellence"], "mode": "GCP lab / offline design", "code": "gcloud logging read 'resource.type=\"k8s_container\"' --project=\"$TK_PROJECT\" --limit=10 --format=json\n# Use only dummy workloads; redact identifying and sensitive log fields.", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gcp-security", "track": "gcp", "title": "Threat models, secrets, keys and policy boundaries", "domain": "PCA architecture", "summary": "Design controls around assets, identities and plausible failure paths.", "understand": ["A threat model identifies valuable assets, trust boundaries, potential misuse and mitigations. For a cloud workload, examine user entry, workload identity, image delivery, data access, administration and recovery. Each control should address a stated threat rather than decorate a diagram.", "Secret Manager stores secrets with version and access controls. Cloud KMS manages cryptographic keys. They solve related but different problems. IAM limits actions, organisation policies restrict configurations, and VPC Service Controls can reduce supported-service data-exfiltration paths. None replaces the others."], "deep": ["A customer-managed encryption key adds responsibilities for permissions, rotation, availability and recovery. Disabling a key can make protected data unavailable; it is not a casual incident toggle. Secrets must be rotated with application compatibility and rollback in mind.", "Separate preventive, detective and recovery controls. A blocked public bucket does not prevent an authorised but compromised workload from reading data it is allowed to access. Reduce authority, observe unusual behaviour and rehearse response. Compliance statements need actual requirements and evidence; architecture diagrams alone cannot certify compliance."], "case": "The bank report worker receives only read access to dummy reports. The release identity cannot alter IAM. An incident runbook explains how to revoke workload access and verify recovery without deleting the data.", "nodes": [{"title": "Assets and boundaries", "detail": "Data, identities and supply chain"}, {"title": "Controls", "detail": "Least privilege, secrets and policy"}, {"title": "Evidence and response", "detail": "Audit, containment and verified recovery"}], "diagramType": "architecture", "lab": "Draw a threat model with five trust boundaries. For each, write one abuse case, a preventive control and an observable signal. Inspect only metadata for existing sandbox secrets; never print secret payloads. Offline: rehearse a leaked-key scenario and prefer eliminating static keys where possible.", "verify": "The control matrix maps each threat to an owner and a verification step, and acknowledges residual risk and service limitations.", "fault": "A proposal claims encryption eliminates the need for IAM. Explain why an authorised attacker can still request plaintext through the service.", "question": "Are Secret Manager and KMS interchangeable?", "answer": "No. Secret Manager manages secret values and versions; KMS manages cryptographic keys and operations used by supported integrations.", "refs": ["https://cloud.google.com/secret-manager/docs/overview", "https://cloud.google.com/kms/docs/key-management-service", "https://cloud.google.com/vpc-service-controls/docs/overview", "https://cloud.google.com/resource-manager/docs/organization-policy/overview", "https://cloud.google.com/architecture/framework/security"], "mode": "GCP lab / offline design", "code": "gcloud secrets list --project=\"$TK_PROJECT\"\n# Do not run secret payload access commands for documentation screenshots.", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gcp-recovery", "track": "gcp", "title": "Backups, regional failure and disaster recovery", "domain": "PCA architecture", "summary": "Recover the business service, not merely its Kubernetes objects.", "understand": ["RPO expresses acceptable data loss measured back from an incident; RTO expresses the target time to restore the defined service. These are objectives agreed with stakeholders, not automatic properties of a product. Measure actual restoration results against them.", "A recovery design includes configuration, application artifacts, persistent data, identities, networking and dependent services. Availability within a region and recovery after a regional failure need different evidence. Replication may improve availability while also replicating accidental deletion."], "deep": ["Backup for GKE can protect selected Kubernetes resources and supported volume data, but it is not a backup of the entire cloud project. Cluster infrastructure, node-pool configuration, registry images and external data services require their own recovery arrangements. A target cluster and correct permissions are part of the restoration path.", "Cross-region recovery adds location constraints, quotas, keys, DNS, data replication lag and consistency decisions. A warm standby costs more than rebuilding from backups but may meet a shorter RTO. Never claim an RTO based solely on the configured backup schedule."], "case": "For the learning bank page, Git content plus available images and infrastructure configuration may be enough to rebuild. A future ledger needs a separate database recovery procedure and reconciliation of incomplete transfers.", "nodes": [{"title": "Checkpoint each dependency", "detail": "Objects, data, images and infrastructure"}, {"title": "Restore the service", "detail": "Capacity, identity and correct order"}, {"title": "Prove business recovery", "detail": "Known records, requests and measured time"}], "diagramType": "architecture", "lab": "Build a recovery inventory with owner, backup method, location and restore test. Restore the local PVC marker into a separate learning workload where supported. For GKE backup practice, follow the official supported-resource guide in a billable sandbox. Offline: simulate losing the original region and identify missing dependencies.", "verify": "Report measured versus target recovery time, the latest verified data checkpoint and anything not restored. Include application-level checks.", "fault": "A backup plan covers Kubernetes manifests but omits the external database. Identify the false sense of recoverability and assign a separate database test.", "question": "Does Backup for GKE automatically capture Cloud SQL databases and all project infrastructure?", "answer": "No. Those dependencies need their own backup or rebuild plans and coordinated verification.", "refs": ["https://cloud.google.com/kubernetes-engine/docs/add-on/backup-for-gke/concepts/backup-for-gke", "https://cloud.google.com/architecture/dr-scenarios-planning-guide", "https://cloud.google.com/architecture/framework/reliability"], "mode": "GCP lab / offline design", "code": "", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gcp-cost", "track": "gcp", "title": "Capacity, cost and sustainable operation", "domain": "PCA architecture", "summary": "Compare complete operating cost against measurable service needs.", "understand": ["Cloud cost includes compute, storage, operations, network transfer and supporting services such as logs or load balancers. Estimate a complete workload, not only the price of one VM. State region, utilisation, data volume and retention assumptions next to the estimate.", "Rightsizing matches resources to observed demand with headroom. Autoscaling can reduce idle capacity but needs limits and trustworthy metrics. Commitments suit sufficiently predictable usage; interruptible capacity suits workloads that can tolerate interruption and retry."], "deep": ["A lower unit price may increase total cost if it causes longer runtime, excessive retries or operational complexity. Cross-zone/region traffic and data access patterns can change an apparently cheap design. Measure cost per useful outcome, such as a completed dummy report, alongside latency and failure rate.", "Sustainability decisions include avoiding unnecessary work, selecting efficient resources and considering location constraints and available environmental data. Do not claim a precise carbon saving without a supported methodology. Financial and sustainability trade-offs still need security, reliability and data-location constraints."], "case": "The bank sandbox should not keep an oversized cluster running between exercises. The production design estimates a steady baseline, peak scaling and retained data separately before considering purchasing commitments.", "nodes": [{"title": "Demand and constraints", "detail": "Workload, latency and recovery needs"}, {"title": "Resource model", "detail": "Capacity, transfer, storage and telemetry"}, {"title": "Measure and improve", "detail": "Unit cost with service quality intact"}], "diagramType": "flow", "lab": "Create a monthly estimate using the current calculator for a stated region and workload. Include logs, load balancing, storage and transfer. Compare idle and peak cases, then list shutdown/retention actions for the lab. Offline: use labelled illustrative units rather than inventing current prices.", "verify": "Every cost has an assumption and source/date. The recommended saving does not silently worsen a required SLO or recovery objective.", "fault": "A learner deletes the VM but leaves disks, addresses and snapshots. Inspect the inventory and explain which resources can continue to cost money.", "question": "Is a budget alert a substitute for reviewing resource inventory?", "answer": "No. Alerts help detect spending, while ownership, inventory and deliberate cleanup control what continues to run.", "refs": ["https://cloud.google.com/products/calculator", "https://cloud.google.com/architecture/framework/cost-optimization", "https://cloud.google.com/architecture/framework/sustainability", "https://cloud.google.com/billing/docs/how-to/budgets"], "mode": "Offline architecture / optional GCP billing review", "code": "", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gcp-migration", "track": "gcp", "title": "Migration, hybrid connectivity and data cutover", "domain": "PCA architecture", "summary": "Move dependencies and operations, not just compute instances.", "understand": ["A migration starts with an inventory of applications, owners, dependencies, data, network paths and business constraints. Rehosting changes where a workload runs; replatforming changes selected platform services; refactoring changes application design. Choose per workload rather than imposing one strategy on everything.", "Plan pilot, migration waves, validation, cutover and recovery. Data movement requires a consistency boundary: which system accepts writes, how changes replicate, when clients switch and what happens if validation fails."], "deep": ["A rollback after new writes reach the target is more complicated than changing DNS back. The source may now be stale. Define reconciliation and reverse-data strategy before permitting target writes. DNS caching, sessions, certificates and third-party callbacks can extend a cutover beyond the visible deployment.", "Hybrid operation adds identity, routing, latency, observability and support ownership across environments. A cloud dependency that performs poorly over a high-latency link may require redesign or colocating the workload. Rehe
