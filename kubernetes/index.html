</span>TechKnowen<small>KUBERNETES & CLOUD</small></a><nav id="navigation" aria-label="Learning programme"></nav></aside><div class="shell"><header><button id="menu" aria-label="Toggle navigation" aria-expanded="false">☰</button><span class="header-title small">LEARN · BUILD · VERIFY</span><form id="search-form" role="search"><input id="search" type="search" aria-label="Search lessons and labs" placeholder="Find a concept, command or failure…"><button type="submit">Search</button></form><button id="theme" aria-label="Switch colour mode">◐</button></header><main id="main" tabindex="-1"></main><footer>TechKnowen · Original learning material · <a href="https://ajnacs.com/" target="_blank" rel="noopener noreferrer">ajnacs.com</a> · <a href="#/sources">Sources & scope</a></footer></div><script>const DATA={"glossary": [{"term": "API server", "meaning": "The Kubernetes entry point that authenticates, authorizes and admits API requests.", "lesson": "api-control-plane"}, {"term": "Admission", "meaning": "Checks or changes an API write after authentication and authorization.", "lesson": "identity-rbac"}, {"term": "Affinity", "meaning": "A placement rule expressing required or preferred relationships.", "lesson": "scheduling"}, {"term": "Artifact", "meaning": "A produced item such as an image or release manifest, with traceable identity.", "lesson": "gcp-delivery"}, {"term": "Authentication", "meaning": "Establishing who the caller is.", "lesson": "identity-rbac"}, {"term": "Authorization", "meaning": "Deciding whether that caller may perform an action.", "lesson": "gcp-iam"}, {"term": "Canary", "meaning": "A release exposed to a controlled subset before wider promotion.", "lesson": "release-strategies"}, {"term": "CNI", "meaning": "A network integration contract used to configure container connectivity.", "lesson": "extension-interfaces"}, {"term": "ConfigMap", "meaning": "A Kubernetes object for non-secret configuration.", "lesson": "configuration"}, {"term": "Container", "meaning": "A running isolated process environment based on an image.", "lesson": "images"}, {"term": "Control plane", "meaning": "Components that coordinate desired state and cluster operations.", "lesson": "cluster-internals"}, {"term": "CRI", "meaning": "The interface kubelet uses to communicate with a compatible container runtime.", "lesson": "extension-interfaces"}, {"term": "CRD", "meaning": "A definition that adds a custom resource kind and schema to the API.", "lesson": "extensions"}, {"term": "CSI", "meaning": "An interface for integrating storage with container orchestrators.", "lesson": "csi-storage"}, {"term": "Data plane", "meaning": "The execution and traffic-serving path, distinct from control configuration.", "lesson": "cni-dataplane"}, {"term": "Deployment", "meaning": "A controller for managing interchangeable application replicas and rollouts.", "lesson": "workload-choice"}, {"term": "Digest", "meaning": "A content identifier for an artifact; it identifies bytes rather than proving safety.", "lesson": "images"}, {"term": "DNS", "meaning": "Name resolution, which is separate from the later connection to the returned address.", "lesson": "coredns"}, {"term": "etcd", "meaning": "The datastore used for Kubernetes API state in this architecture.", "lesson": "etcd-recovery"}, {"term": "Eviction", "meaning": "A request to remove a Pod; voluntary eviction can be checked against a disruption budget.", "lesson": "disruptions"}, {"term": "Gateway", "meaning": "A Gateway API resource describing listeners and entry-point intent.", "lesson": "gateway-api"}, {"term": "Idempotency", "meaning": "A design property that makes repeating an operation avoid duplicate logical effects.", "lesson": "gcp-events"}, {"term": "Image", "meaning": "Packaged filesystem layers and metadata used to start containers.", "lesson": "images"}, {"term": "Ingress", "meaning": "A Kubernetes API resource for supported HTTP routing rules; it needs a controller.", "lesson": "ingress"}, {"term": "KSA", "meaning": "A Kubernetes ServiceAccount, distinct from a Google IAM service account.", "lesson": "gke-identity"}, {"term": "kubeconfig", "meaning": "Client connection and identity settings with selectable contexts.", "lesson": "objects-contexts"}, {"term": "kubelet", "meaning": "The node agent that manages assigned Pods through the runtime.", "lesson": "node-triage"}, {"term": "Namespace", "meaning": "An organisational scope for many Kubernetes objects, not automatic network isolation.", "lesson": "objects-contexts"}, {"term": "Node", "meaning": "A machine or learning-node container that runs Kubernetes node responsibilities.", "lesson": "setup"}, {"term": "Operator", "meaning": "A controller that reconciles custom domain-specific intent.", "lesson": "extensions"}, {"term": "Pod", "meaning": "The Kubernetes execution unit for one or more tightly related containers.", "lesson": "pod-design"}, {"term": "Probe", "meaning": "A configured check used for startup, readiness or liveness decisions.", "lesson": "probes"}, {"term": "PVC", "meaning": "A request for persistent storage; its binding and mount must be verified.", "lesson": "storage"}, {"term": "Quorum", "meaning": "The majority agreement needed for a consistent etcd cluster to make progress.", "lesson": "availability"}, {"term": "Reconciliation", "meaning": "Repeated comparison of desired state with observed state, followed by corrective actions.", "lesson": "orientation"}, {"term": "Request / limit", "meaning": "A resource request informs scheduling; a limit configures relevant runtime constraints.", "lesson": "resources"}, {"term": "RPO", "meaning": "A target for acceptable data loss relative to an incident.", "lesson": "gcp-recovery"}, {"term": "RTO", "meaning": "A target time for restoring a defined service; actual results need measurement.", "lesson": "gcp-recovery"}, {"term": "Service", "meaning": "A stable service abstraction selecting eligible workload endpoints.", "lesson": "services-dns"}, {"term": "SLI / SLO", "meaning": "An outcome indicator and its target over a defined window.", "lesson": "gcp-observe"}, {"term": "StatefulSet", "meaning": "A controller with stable identity and storage-related workload semantics.", "lesson": "workload-choice"}, {"term": "Taint / toleration", "meaning": "A node repelling condition and a Pod permission to tolerate it; tolerance does not force placement.", "lesson": "scheduling"}, {"term": "VPC", "meaning": "A cloud network boundary containing regional subnets and configured connectivity.", "lesson": "gcp-network"}, {"term": "Workload identity", "meaning": "An identity used by running software rather than a shared human login.", "lesson": "gke-identity"}], "deepDiagrams": {"api-control-plane": {"title": "From a Deployment declaration to a running Pod", "nodes": [["kubectl", "Submit desired Deployment"], ["API server + etcd", "Authorize, admit and persist"], ["Controllers", "Create ReplicaSet and Pods"], ["Scheduler", "Bind an unscheduled Pod"], ["kubelet + runtime", "Start assigned containers"], ["Status and readiness", "Report observed health"]], "edges": [[0, 1, "request"], [1, 2, "watch"], [2, 3, "Pod via API"], [3, 4, "binding via API"], [4, 5, "observe"]], "caption": "API-mediated reconciliation is asynchronous. Controllers, scheduler and kubelet use the API; the linear path is a responsibility sequence, not direct calls from controller to scheduler."}, "services-dns": {"title": "A banking request takes the data-plane path", "nodes": [["Client Pod", "Requests bank-web"], ["Cluster DNS", "Returns Service address"], ["Service data plane", "Uses endpoint information"], ["Ready web Pod", "Listens on targetPort 80"], ["Application response", "Returns the learning page"], ["API/control plane", "Publishes desired route state"]], "edges": [[0, 1, "resolve"], [1, 2, "client connects"], [2, 3, "forward"], [3, 4, "respond"]], "caption": "The client resolves the name, then sends traffic through the implemented data plane. DNS does not proxy the HTTP request. The API supplies configuration; it is not on the application packet path."}, "probes": {"title": "Probe failure has different consequences", "nodes": [["Startup not complete", "Hold other probes back"], ["Startup succeeds", "Enable ordinary health checks"], ["Readiness fails", "Ready condition becomes false"], ["Endpoint updates", "Remove from normal traffic"], ["Liveness threshold fails", "Restart the container"], ["Application correctness", "Still needs end-to-end tests"]], "edges": [[0, 1, "success"], [1, 2, "readiness branch"], [2, 3, "propagate"], [1, 4, "liveness branch"]], "caption": "Readiness and liveness are independent after startup succeeds. A restart is not the action for readiness failure. Endpoint changes are asynchronous."}, "identity-rbac": {"title": "Three separate gates for an API write", "nodes": [["Presented identity", "Token or certificate"], ["Authentication", "Recognize the caller"], ["Authorization", "Permit verb/resource/scope"], ["Admission", "Validate or mutate a write"], ["Persisted API state", "Accept desired object"], ["Reconciliation", "Runtime outcome follows later"]], "edges": [[0, 1, "identify"], [1, 2, "policy check"], [2, 3, "if allowed"], [3, 4, "if admitted"], [4, 5, "observe intent"]], "caption": "An authenticated caller can be forbidden; an authorized write can be rejected by admission. An accepted object can still fail to become a healthy workload."}, "storage": {"title": "Storage follows a lifecycle beyond one container", "nodes": [["PVC request", "Capacity, class and access"], ["Scheduling context", "Topology may be needed first"], ["Storage provisioner", "Create or select backing volume"], ["PV binding", "Associate claim and volume"], ["Node mount", "Expose data to the container"], ["Application backup", "Separate recoverable checkpoint"]], "edges": [[0, 1, "late binding"], [1, 2, "compatible location"], [2, 3, "bind"], [3, 4, "attach/mount"]], "caption": "This example shows delayed binding. Other classes can bind immediately. The backup is a separate responsibility; a mounted volume is not a verified restore."}, "rollouts": {"title": "Rolling update with two desired replicas", "nodes": [["Old revision", "Two ready replicas"], ["Surge capacity", "Allow one candidate Pod"], ["Candidate readiness", "Check real serving readiness"], ["Reduce old revision", "Only after capacity is ready"], ["Complete rollout", "New revision serves requests"], ["Stalled candidate", "Inspect Events; restore version"]], "edges": [[0, 1, "new template"], [1, 2, "start"], [2, 3, "if ready"], [3, 4, "repeat"], [2, 5, "if failure"]], "caption": "Assumes maxSurge 1 and maxUnavailable 0. Spare schedulable capacity is required. Rollback changes the workload template, not external database effects."}, "network-policy": {"title": "A connection needs both relevant directions allowed", "nodes": [["Source Pod", "Identity through labels"], ["Egress policies", "Union of source allowances"], ["DNS dependency", "Resolve names if needed"], ["Destination ingress", "Union of destination allowances"], ["Listening application", "Target port must be open"], ["Enforcing CNI", "Programs the actual controls"]], "edges": [[0, 1, "send"], [1, 3, "allowed path"], [3, 4, "allow target port"]], "caption": "DNS and the enforcing implementation are dependencies, not policy objects that automatically run in sequence. Test both allowed and denied clients. Policies do not create listeners."}, "cluster-internals": {"title": "Control-plane state versus node execution", "nodes": [["API endpoint", "TLS, identity and admission"], ["etcd quorum", "Persist Kubernetes state"], ["Controllers", "Reconcile desired objects"], ["Scheduler", "Choose eligible node"], ["kubelet", "Observe assignment and health"], ["CRI runtime + CNI", "Start sandbox and containers"]], "edges": [[0, 1, "persist"], [0, 2, "watch API"], [0, 3, "watch API"], [3, 4, "binding via API"], [4, 5, "execute"]], "caption": "Control-plane components coordinate through API state. etcd is not the bank application database. Placement and execution are separate responsibilities."}, "etcd-recovery": {"title": "A recoverable service needs several checkpoints", "nodes": [["etcd snapshot", "Kubernetes API state"], ["Infrastructure code", "Networks and cluster settings"], ["Image registry", "Required artifact digests"], ["Application data", "Database / volume backup"], ["Isolated restore", "Rebuild compatible dependencies"], ["Acceptance evidence", "Data correctness and requests"]], "edges": [[0, 4, "restore API state"], [1, 4, "recreate"], [2, 4, "supply artifacts"], [3, 4, "restore data"], [4, 5, "verify"]], "caption": "These are separate recovery inputs. An etcd snapshot alone does not contain image binaries, every volume or external service state."}, "gateway-api": {"title": "Ownership and reference boundaries in Gateway API", "nodes": [["GatewayClass", "Implementation selection"], ["Gateway listener", "Platform-owned entry point"], ["HTTPRoute", "Application-owned routing"], ["Backend Service", "Resolves ready backends"], ["ReferenceGrant", "Target namespace permits reference"], ["Controller data plane", "Programs and serves traffic"]], "edges": [[0, 1, "class"], [1, 2, "allowed attachment"], [2, 3, "backend reference"], [4, 3, "if cross-namespace"], [1, 5, "reconcile"]], "caption": "Route attachment and cross-namespace backend permission are separate checks. The configured data plane must actually serve a request; declarations and status are complementary evidence."}, "gcp-network": {"title": "Trace two different outbound destinations", "nodes": [["Private workload", "No external address on the instance"], ["VPC routing and firewall", "Permit the intended outbound path"], ["Public internet", "External registry or API destination"], ["Google API endpoint", "Supported Google service destination"], ["Cloud NAT path", "Configured public egress and return"], ["Private Google Access", "Configured access to Google APIs"]], "edge  EndpointSlices"], ["Backend reachability", "Target port, listener and policy"], ["External boundary", "Gateway, TLS and load-balancer health"], ["Repeated request", "Before/after outcome with evidence"]], "edges": [[0, 1, "check resolution"], [1, 2, "check intended destination"], [2, 3, "test backend path"], [0, 4, "if external entry used"], [3, 5, "verify after correction"]], "caption": "Do not treat all timeouts as one cause. Compare direct backend and Service paths where permitted, then inspect external layers if they exist."}, "observability": {"title": "Signals answer different diagnostic questions", "nodes": [["User request", "Outcome and latency measurement"], ["Metrics", "Trends, saturation and error rates"], ["Application logs", "Timestamped process observations"], ["Distributed trace", "Segments across request boundaries"], ["Kubernetes / audit evidence", "Object Events and API actions"], ["Incident hypothesis", "Correlate, test and verify"]], "edges": [[0, 1, "aggregate measurements"], [0, 2, "record application events"], [0, 3, "trace participating components"], [1, 5, "support diagnosis"], [4, 5, "explain platform changes"]], "caption": "Signals are complementary, not interchangeable. Missing telemetry is not zero failure; minimise sensitive data and excessive cardinality."}, "ckad-capstone": {"title": "Developer evidence loop", "nodes": [["Defined task", "Acceptance condition and scope"], ["Prepared environment", "Versions, context and recovery path"], ["Independent attempt", "No copied solution during the task"], ["Observed evidence", "Workload and request behaviour"], ["Review and correction", "Explain gaps, not only final status"], ["Changed-condition repeat", "Demonstrate transferable reasoning"]], "edges": [[0, 1, "prepare safely"], [1, 2, "attempt"], [2, 3, "record actual observations"], [3, 4, "assess against criteria"], [4, 5, "repeat with variation"]], "caption": "Offline reasoning and live execution provide different evidence. Record unperformed tasks honestly; a timer or completion mark is not certification."}, "cka-capstone": {"title": "Administrator evidence loop", "nodes": [["Defined task", "Acceptance condition and scope"], ["Prepared environment", "Versions, context and recovery path"], ["Independent attempt", "No copied solution during the task"], ["Observed evidence", "Node, platform and recovery behaviour"], ["Review and correction", "Explain gaps, not only final status"], ["Changed-condition repeat", "Demonstrate transferable reasoning"]], "edges": [[0, 1, "prepare safely"], [1, 2, "attempt"], [2, 3, "record actual observations"], [3, 4, "assess against criteria"], [4, 5, "repeat with variation"]], "caption": "Offline reasoning and live execution provide different evidence. Record unperformed tasks honestly; a timer or completion mark is not certification."}, "gcp-capstone": {"title": "Cloud engineer / architect evidence loop", "nodes": [["Defined task", "Acceptance condition and scope"], ["Prepared environment", "Versions, context and recovery path"], ["Independent attempt", "No copied solution during the task"], ["Observed evidence", "Cloud operation and design judgement"], ["Review and correction", "Explain gaps, not only final status"], ["Changed-condition repeat", "Demonstrate transferable reasoning"]], "edges": [[0, 1, "prepare safely"], [1, 2, "attempt"], [2, 3, "record actual observations"], [3, 4, "assess against criteria"], [4, 5, "repeat with variation"]], "caption": "Offline reasoning and live execution provide different evidence. Record unperformed tasks honestly; a timer or completion mark is not certification."}, "gcp-start": {"title": "Scope and billing checks precede provisioning", "nodes": [["Authenticated account", "Principal used by the CLI"], ["Named project", "Explicit target resource scope"], ["Billing association", "Who pays for this project?"], ["APIs and quotas", "Availability and applicable limits"], ["Budget notifications", "Inform recipients; not a spending cap"], ["Resource inventory", "Created items and cleanup evidence"]], "edges": [[0, 1, "act in authorised scope"], [1, 2, "check linked billing"], [1, 3, "check service readiness"], [2, 4, "configure cost visibility"], [1, 5, "track created resources"]], "caption": "Default CLI configuration can be overridden by command flags. Budget alerts, quotas and deliberate resource cleanup solve different problems."}, "gcp-iam": {"title": "Explain an access decision without using broad roles", "nodes": [["Principal", "Human, group or workload"], ["Role permissions", "Actions included in chosen role"], ["Resource binding", "Role grant at intended scope"], ["Inherited controls", "Ancestor policy and constraints"], ["Effective decision", "Principal, action, resource and context"], ["Observed allow / deny", "Test intended access boundaries"]], "edges": [[0, 2, "bind intended subject"], [1, 2, "grant permission set"], [2, 4, "evaluate local grant"], [3, 4, "evaluate effective controls"], [4, 5, "test actual operation"]], "caption": "Service-account impersonation authority must also be reviewed. A project-local policy is not necessarily the complete effective access picture."}, "gcp-compute": {"title": "Select an operating model from requirements", "nodes": [["Workload constraints", "State, runtime, scale and team skills"], ["VM / managed instance group", "OS control and fleet operation"], ["Cloud Run", "Managed supported container workload"], ["GKE", "Kubernetes APIs and ecosystem"], ["Responsibility matrix", "Who patches, scales and responds?"], ["Decision evidence", "Trade-offs, cost and revisit trigger"]], "edges": [[0, 1, "evaluate OS-control fit"], [0, 2, "evaluate managed-app fit"], [0, 3, "evaluate orchestration fit"], [1, 4, "VM duties"], [4, 5, "compare complete operating cost"]], "caption": "The three platforms are alternatives or complementary roles. The GKE course choice is a learning objective, not proof that every information page needs Kubernetes."}, "gcp-storage": {"title": "Retention and recovery affect deletion outcomes", "nodes": [["Private bucket", "Location, class and IAM policy"], ["Dummy object", "Current content generation"], ["Protection settings", "Versioning, soft delete or retention"], ["Lifecycle rules", "Automated matching actions"], ["Deletion request", "May be constrained or recoverable"], ["Recovery / cost evidence", "Which copies and charges remain?"]], "edges": [[0, 1, "store object"], [2, 1, "govern protection"], [3, 4, "trigger configured action"], [1, 4, "user requests deletion"], [4, 5, "inspect actual remaining state"]], "caption": "Features and costs depend on configuration and current service rules. A successful delete of a current object is not always removal of every retained copy."}, "gke-modes": {"title": "Platform mode changes the ownership boundary", "nodes": [["Application team", "Images, configuration and outcomes"], ["Autopilot infrastructure", "GKE manages more node decisions"], ["Standard node pools", "Team selects additional node settings"], ["Managed control plane", "GKE operates API infrastructure"], ["Workload constraints", "Admission and supported capabilities"], ["Operational evidence", "Requests, identity, data and recovery"]], "edges": [[0, 1, "deploy supported workload"], [0, 2, "configure workload and node choices"], [1, 3, "use managed API"], [2, 3, "use managed API"], [4, 5, "verify admitted behaviour"]], "caption": "Modes have shared and distinct responsibilities. Inspect current support and admitted settings instead of assuming local kind behaviour is identical."}, "gke-first": {"title": "Cloud provisioning and Kubernetes access are separate gates", "nodes": [["Project prerequisites", "Billing, API, quota and network"], ["Node service account", "Least privilege for node duties"], ["GKE cluster operation", "Create named regional learning cluster"], ["Client kubeconfig", "Endpoint and authentication plugin"], ["Kubernetes authorization", "Allowed operations for caller"], ["Bank acceptance test", "Ready Pods, endpoints and page marker"]], "edges": [[0, 2, "permit provisioning"], [1, 2, "configure node identity"], [2, 3, "get connection settings"], [3, 4, "authenticate request"], [4, 5, "deploy and verify if authorised"]], "caption": "Node identity is not automatically the application identity. Learning commands do not provision anything until the learner explicitly runs them in their own project."}, "gke-lifecycle": {"title": "Maintenance depends on both policy and spare capacity", "nodes": [["Release channel", "Version stream and support lifecycle"], ["Maintenance controls", "Windows and supported exclusions"], ["Workload readiness", "Healthy replicas and useful probes"], ["Disruption policy", "Permitted voluntary evictions"], ["Available capacity", "Placement, quota and autoscaling"], ["Post-change checks", "Actual user and dependency behaviour"]], "edges": [[0, 1, "configure timing within limits"], [2, 3, "determine disruption allowance"], [3, 4, "need replacement capacity"], [1, 5, "verify maintenance outcome"], [4, 5, "verify restored workload"]], "caption": "Maintenance controls do not promise indefinite upgrade avoidance. A strict disruption budget cannot manufacture healthy replicas or spare capacity."}, "gcp-iac": {"title": "State links configuration with real resources", "nodes": [["Versioned configuration", "Reviewed desired infrastructure"], ["Protected state", "Resource mapping and sensitive data"], ["Provider API observation", "Read actual cloud state"], ["Plan", "Proposed changes and replacements"], ["Approved apply", "Authorised identity performs change"], ["Acceptance tests", "Infrastructure and application evidence"]], "edges": [[0, 3, "desired intent"], [1, 3, "known resource mapping"], [2, 3, "refresh observation"], [3, 4, "review before action"], [4, 5, "verify actual outcome"]], "caption": "A plan is not an executed result. Protect state and locking, and review drift, destructive replacements and costs before applying."}, "gcp-observe": {"title": "Define the denominator before trusting the SLO", "nodes": [["Valid request population", "What counts in the window?"], ["Good request criterion", "Success and latency condition"], ["SLI calculation", "Good divided by valid total"], ["SLO target", "Objective over defined window"], ["Error-budget decision", "Allowed bad outcomes and burn"], ["Actionable alert", "Owner, runbook and notification test"]], "edges": [[0, 2, "denominator"], [1, 2, "numerator"], [2, 3, "compare with target"], [3, 4, "derive remaining allowance"], [4, 5, "alert on meaningful risk"]], "caption": "A request-based objective is not a fixed downtime allowance. Missing data, exclusions and telemetry health must be explicitly handled."}, "gcp-security": {"title": "Match controls to an actual threat boundary", "nodes": [["Asset and abuse case", "What is valuable and how misused?"], ["Identity permissions", "Least privilege and delegation"], ["Network/service perimeter", "Supported connectivity constraints"], ["Secrets and key controls", "Access, rotation and availability"], ["Detection evidence", "Audit and actionable signals"], ["Response and recovery", "Contain, restore and verify"]], "edges": [[0, 1, "prevent identity misuse"], [0, 2, "reduce network/exfiltration paths"], [0, 3, "protect sensitive material"], [1, 4, "observe access decisions"], [4, 5, "respond with evidence"]], "caption": "Controls are complementary. Encryption does not prevent an authorised principal from requesting plaintext; compliance needs actual requirements and evidence."}, "gcp-cost": {"title": "Cost improvement must preserve required outcomes", "nodes": [["Demand model", "Baseline, peak and workload shape"], ["Resource estimate", "Compute, storage, traffic and telemetry"], ["Service constraints", "Latency, availability and recovery"], ["Measured usage", "Utilisation and useful outcomes"], ["Optimisation choice", "Right-size, schedule or change design"], ["Recheck value", "Unit cost and quality after change"]], "edges": [[0, 1, "estimate complete footprint"], [2, 1, "constrain design"], [1, 3, "compare with observations"], [3, 4, "identify supported improvement"], [4, 5, "verify saving and outcomes"]], "caption": "Use current regional prices and dated assumptions. A cheaper unit is not necessarily a cheaper completed task, and resource deletion may leave retained costs."}, "gcp-architecture": {"title": "A defensible decision connects requirements to evidence", "nodes": [["Business outcome", "Why the service exists"], ["Quality constraints", "Measurable latency, recovery and access"], ["Candidate options", "Several plausible operating models"], ["Decision record", "Choice, consequences and assumptions"], ["Architecture views", "Context, deployment and trust boundaries"], ["Experiments and review", "Test claims and define revisit triggers"]], "edges": [[0, 1, "derive measurable needs"], [1, 2, "evaluate fit"], [2, 3, "record trade-off"], [3, 4, "explain responsibilities"], [4, 5, "validate uncertain assumptions"]], "caption": "A component diagram alone does not explain why a choice is appropriate. Distinguish an implemented learning sample from a proposed future banking platform."}}, "lessons": [{"id": "orientation", "track": "foundation", "title": "Your first mental model", "domain": "Foundations", "summary": "Kubernetes keeps a declared workload running across a group of machines.", "understand": ["An application is the software people use. A container packages its program and dependencies. A Pod is the Kubernetes unit that runs one or more closely related containers. A node is a machine; a cluster is a coordinated group of nodes. These are different boundaries, not interchangeable names.", "Instead of asking an operator to restart each failed process, you describe a desired state: two copies of the banking information service, using a particular image. Controllers repeatedly compare that intent with observed state. They request changes when the two differ. Kubernetes helps with placement and recovery; it does not invent correct business rules or repair a corrupt database."], "deep": ["A declaration is stored through the API. Reconciliation is asynchronous: successful submission does not mean the application is ready. Status, Events and an actual request give different evidence. The scheduler chooses a node for an unscheduled Pod; the kubelet on that node asks a runtime to run its containers.", "The control plane coordinates. The data plane carries application traffic. Existing containers can continue when the control plane is unavailable, while scheduling, rollout and repair operations may fail. A cluster is therefore not one magical computer with instantaneous state."], "case": "Harbour Bank begins with a read-only information page. It contains no accounts or money. Two identical replicas let us study availability before introducing external data and identity.", "nodes": [{"title": "Intent", "detail": "Two information-page replicas"}, {"title": "Reconciliation", "detail": "Compare desired and observed state"}, {"title": "Evidence", "detail": "Ready Pods and a successful HTTP request"}], "diagramType": "flow", "lab": "Before installing anything, draw a laptop, two worker machines, one API server and two Pods. Place each term from the introduction. Mark where a user request travels and where an operator sends a declaration.", "verify": "Explain why a running container and an accepted YAML file are insufficient evidence that a customer can reach the page.", "fault": "Claim to challenge: Kubernetes automatically makes every application highly available. Identify the single database, single region and bad application code that can still fail.", "question": "Does Kubernetes understand whether a transfer is financially correct?", "answer": "No. It manages declared infrastructure and workload state. Financial invariants belong in the application, storage design and tests.", "refs": ["https://kubernetes.io/docs/concepts/overview/components/", "https://kubernetes.io/docs/concepts/architecture/controller/"], "mode": "Offline reasoning", "code": "", "prereq": "Ordinary computer familiarity."}, {"id": "terminal", "track": "foundation", "title": "Terminal, files, HTTP and YAML", "domain": "Foundations", "summary": "Learn the small set of command-line and networking ideas used in every lab.", "understand": ["A terminal runs commands. A path identifies a file or directory. A shell expands variables before a program receives them. Copy commands line by line while reading their purpose; angle-bracket placeholders are not literal values. A pipe sends one command’s output to another.", "HTTP is a request/response protocol. A hostname must resolve to an address; a connection must reach a listening port; then an HTTP handler responds. A DNS error, connection refusal and HTTP 503 describe different layers. YAML represents maps and lists using indentation; spaces and exact field names matter."], "deep": ["kubectl turns your request into Kubernetes API operations. The apiVersion and kind select a schema, metadata identifies the object, spec usually expresses intent and status reports observations. Unknown or wrongly indented fields are not harmless formatting changes.", "A manifest may parse as YAML but still be invalid for its Kubernetes resource or cluster version. Client-side generation, schema inspection and server-side dry-run answer progressively different questions. None proves runtime connectivity. Learn to preserve stderr, exit codes and the namespace when recording an observation."], "case": "A banking page might resolve correctly but return 503 because no ready backend exists. Do not change DNS merely because “the website is down.”", "nodes": [{"title": "Name", "detail": "Resolve bank-web to an IP"}, {"title": "Connection", "detail": "Connect to the Service port"}, {"title": "Response", "detail": "Inspect status and response body"}], "diagramType": "flow", "lab": "Create a working folder and a text file. Run the commands below. Explain every pipeline stage. Then inspect the supplied starter manifest and identify map keys versus list items.", "verify": "You can distinguish a command failure from a valid empty result and explain why indentation changes object structure.", "fault": "Indent a container image under metadata in a copied file; compare YAML parsing with Kubernetes validation. Restore the original before applying.", "question": "Is HTTP 404 a DNS failure?", "answer": "No. An HTTP server answered. Investigate routing/path or the application rather than assuming the hostname failed.", "refs": ["https://kubernetes.io/docs/reference/kubectl/", "https://kubernetes.io/docs/concepts/overview/working-with-objects/"], "mode": "Local cluster", "code": "pwd\nmkdir -p techknowen-labs\ncd techknowen-labs\nprintf \"ready\\n\" > observation.txt\ncat observation.txt\nkubectl explain deployment.spec.template.spec.containers", "prereq": "A terminal; kubectl is installed in the next lesson."}, {"id": "setup", "track": "foundation", "title": "Set up a disposable learning cluster", "domain": "Foundations", "summary": "Use a local container-backed cluster before spending money on cloud infrastructure.", "understand": ["Install a container engine, kubectl and kind using their official platform instructions. On macOS or Windows, the engine runs Linux containers through a virtual machine. On Linux it normally uses the host kernel. Check that the engine is running before asking kind to create nodes.", "The course cluster is named techknowen-course. A separate kubeconfig keeps lab access apart from normal work. Every command must target that configuration. The pinned node image below provides a reproducible Kubernetes 1.35 learning baseline corresponding to the researched curriculum; it is not a promise about the version of your future exam."], "deep": ["A kind node is a container that contains Kubernetes node services; application containers run through containerd inside it. This nested arrangement is convenient for API practice but does not reproduce cloud load balancers, independent physical failure domains or a managed control plane.", "Allow approximately 4 CPUs, 6–8 GB RAM and image-download disk space for comfortable practice; this is a planning estimate. Internet is needed for installation and image pulls. The guide itself is offline-readable; a real cluster cannot be simulated merely by opening the HTML. Use the offline reasoning tasks if the runtime is unavailable."], "case": "The banking demo needs no GCP project. Local port forwarding exposes the learning page only through the chosen localhost listener.", "nodes": [{"title": "Laptop", "detail": "Terminal and dedicated kubeconfig"}, {"title": "kind node", "detail": "Disposable Linux node container"}, {"title": "Workloads", "detail": "Banking Pods in lab namespaces"}], "diagramType": "architecture", "lab": "Follow the linked installation pages for your operating system. Start the container engine. Run the setup commands; wait until the node reports Ready. Keep this terminal’s KUBECONFIG setting for subsequent labs.", "verify": "kubectl cluster-info names the lab server; get nodes shows Ready; current-context is kind-techknowen-course. Save client/server versions with your evidence.", "fault": "If the Docker socket is unavailable, start the engine rather than changing application YAML. If ImagePullBackOff appears later, check registry access and architecture.", "question": "Why use a dedicated kubeconfig?", "answer": "It reduces the chance that a learning command changes an unrelated cluster. Confirm context before every mutating exercise.", "refs": ["https://kind.sigs.k8s.io/docs/user/quick-start/", "https://kubernetes.io/docs/tasks/tools/", "https://github.com/kubernetes-sigs/kind/releases/tag/v0.33.0"], "mode": "Local cluster", "code": "mkdir -p techknowen-labs\ncd techknowen-labs\nexport KUBECONFIG=\"$PWD/kubeconfig\"\ndocker info\nkind create cluster --name techknowen-course --kubeconfig \"$KUBECONFIG\" --image kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0\nkubectl config current-context\nkubectl get nodes\nkubectl version", "prereq": "Container engine, kind v0.33.0 and a kubectl client within one minor version of the API server. Use official installation instructions."}, {"id": "api-control-plane", "track": "foundation", "title": "What happens after kubectl apply?", "domain": "Foundations", "summary": "Follow intent through the API, controllers, scheduler and node.", "understand": ["kubectl contacts the API server using the selected context. Authentication identifies the caller. Authorization checks the requested action. Admission can validate or change the object before accepted state is persisted. A Deployment controller and ReplicaSet controller then create the objects needed to reach the desired replica count.", "The scheduler does not start a container. It chooses a suitable node and records that assignment. The kubelet observes the assignment, obtains the image through the runtime and reports status. Readiness is a separate signal from process creation."], "deep": ["Controllers normally watch API changes and use work queues; they do not all write directly to etcd. Each controller must tolerate retries and changes since its last observation. Resource versions help detect conflicting updates. Ownership references associate Pods with ReplicaSets and Deployments, enabling garbage collection.", "The request-to-running journey crosses several asynchronous boundaries. A timeout from kubectl does not necessarily prove the server rejected an operation; inspect named state before retrying a create. Conversely, an API success means acceptance, not successful scheduling. Pending, image pull and readiness failures need different evidence."], "case": "Ask for two bank-web replicas. Observe a Deployment, its ReplicaSet and two Pods. Deleting one Pod should produce a replacement with a new identity, not revive the deleted object.", "nodes": [{"title": "API server", "detail": "Accept and persist desired state"}, {"title": "Controllers", "detail": "Create and count owned Pods"}, {"title": "Scheduler + kubelet", "detail": "Assign a node; run and report"}], "diagramType": "flow", "lab": "After the starter lab, inspect ownerReferences and watch the Pod list in a second terminal. Delete exactly one bank-web Pod by its name and compare old/new UIDs.", "verify": "The Deployment returns to two Ready replicas. Record the owner chain and distinguish replacement from a container restart inside the same Pod.", "fault": "If a replacement remains Pending, inspect Events and resource requests before deleting more Pods.", "question": "Does the scheduler write container processes onto a node?", "answer": "No. It binds a Pod to a node. The kubelet and container runtime perform execution.", "refs": ["https://kubernetes.io/docs/concepts/overview/components/", "https://kubernetes.io/docs/concepts/architecture/controller/", "https://kubernetes.io/docs/concepts/architecture/garbage-collection/"], "mode": "Local cluster", "code": "kubectl -n tk-bank get deploy,rs,pods\nkubectl -n tk-bank get pods -o \"custom-columns=NAME:.metadata.name,UID:.metadata.uid,OWNER:.metadata.ownerReferences[0].kind\"\nkubectl -n tk-bank get events --sort-by=.metadata.creationTimestamp", "prereq": "Complete Setup and the starter application lab."}, {"id": "starter", "track": "foundation", "title": "Run the Harbour Bank information service", "domain": "Foundations", "summary": "Start with a tiny, observable service that every later lesson can change.", "understand": ["This sample serves a static, fictional banking information page. It does not authenticate users, hold balances, transfer money or connect to a bank. We use this small workload to learn deployment mechanics without confusing Kubernetes practice with financial software implementation.", "The manifest creates a namespace, ConfigMap, Deployment and ClusterIP Service. Two web containers read a page from the ConfigMap. A Service selects their shared app label. Port forwarding supplies a temporary local route for your browser. No public load balancer is created."], "deep": ["The Deployment’s selector must match its Pod template labels. The Service’s selector is independent and must also match the intended Pods. A ready Deployment can coexist with a broken Service selector. Test both workload readiness and the request path.", "The nginx image is a teaching dependency, not a production image recommendation. Later security labs use a dedicated compatible unprivileged workload rather than blindly applying restrictive settings to an image that expects root-owned paths. A ConfigMap mounted as a directory updates eventually; environment-variable values are captured at container start."], "case": "Your acceptance criterion is precise: two Ready bank-web Pods, a Service with usable endpoints, and a localhost HTTP response containing Harbour Bank learning service.", "nodes": [{"title": "Browser", "detail": "localhost:8080 via port-forward"}, {"title": "Service", "detail": "Select app=bank-web"}, {"title": "Two Pods", "detail": "Serve the mounted information page"}], "diagramType": "architecture", "lab": "Save the starter YAML shown below as bank.yaml, apply it, wait for rollout, then run port-forward in a separate terminal. Open http://127.0.0.1:8080. Stop the forward with Ctrl-C when finished.", "verify": "Run curl in another terminal and retain its HTTP response. Inspect EndpointSlices to see the selected Pod addresses. A resource count alone is not the acceptance test.", "fault": "Change the Service selector to app=bank-typo, observe the missing endpoints, then reapply bank.yaml. Do not alter the Deployment selector to fix a Service mistake.", "question": "Which resource gives the Pods a stable in-cluster access name?", "answer": "The Service. Pod addresses can change; the Service selects the current eligible endpoints.", "refs": ["https://kubernetes.io/docs/concepts/workloads/controllers/deployment/", "https://kubernetes.io/docs/concepts/services-networking/service/"], "mode": "Local cluster", "code": "@lab:bank.yaml", "prereq": "Setup complete. Save the manifest in your techknowen-labs folder."}, {"id": "objects-contexts", "track": "foundation", "title": "Names, namespaces, labels and ownership", "domain": "Foundations", "summary": "Find the right object before changing it.", "understand": ["A context chooses a cluster, credentials and an optional default namespace. Namespaces organise many namespaced objects; they do not by themselves enforce network isolation. Names are unique within the relevant kind and scope, while UIDs identify a particular object instance.", "Labels are queryable key/value groupings. An annotation carries extra metadata that is not intended as a selection mechanism. A selector may return zero, one or many objects. Always inspect a selection before using it in a delete, scale or patch command."], "deep": ["A Deployment owns ReplicaSets, which own Pods. Deleting a child alone usually triggers replacement while the controller still desires it. A namespace does not scope Nodes, PersistentVolumes, ClusterRoles or CRDs. RBAC Roles can grant namespace-limited operations, but a user may also have broader grants.", "Finalizers delay actual deletion until their cleanup conditions are satisfied. Removing one by hand can leave infrastructure or data behind. Examine the responsible controller and its failure before forcing deletion. Prefer declarative changes to the owning workload for lasting effects."], "case": "Keep banking exercises in tk-bank and independent tasks in a unique tk-* namespace. Never use an unreviewed all-namespaces deletion as a cleanup shortcut.", "nodes": [{"title": "Context", "detail": "Which cluster and identity?"}, {"title": "Namespace + kind", "detail": "Which scope and object type?"}, {"title": "Name or selector", "detail": "Which exact objects will change?"}], "diagramType": "flow", "lab": "List contexts without switching to an unknown cluster. Query bank Pods by label. Add an annotation to the Deployment, then compare metadata with the Pod template.", "verify": "The selector lists exactly the intended Pods. You can explain why annotating a Deployment object alone need not annotate its Pods.", "fault": "Run the same read-only query in a namespace with no workload; “No resources found” is not proof that the cluster is empty.", "question": "Does a namespace automatically block another namespace’s network traffic?", "answer": "No. Network isolation requires enforced policies or other network controls.", "refs": ["https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/", "https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/", "https://kubernetes.io/docs/concepts/overview/working-with-objects/finalizers/"], "mode": "Local cluster", "code": "kubectl config get-contexts\nkubectl -n tk-bank get pods -l app=bank-web --show-labels\nkubectl -n tk-bank annotate deployment bank-web learning.techknowen/topic=ownership --overwrite\nkubectl api-resources --namespaced=false", "prereq": "Complete Setup and the starter application lab."}, {"id": "images", "track": "ckad", "title": "Build and inspect container images", "domain": "Design and build", "summary": "Make a reproducible artifact before asking Kubernetes to run it.", "understand": ["An image is a read-only filesystem and execution configuration. A running container adds a writable layer and processes. An image tag is a movable name; a digest identifies content. A Dockerfile describes a build, while a Kubernetes manifest describes how an image runs.", "Use a small build context, exclude credentials with .dockerignore, and separate build tools from runtime files when appropriate. Never put a real secret in a build argument or image layer and assume deleting it in a later layer erases history."], "deep": ["The image architecture must match the node or support that platform through a multi-platform manifest. A local image exists in the laptop engine, not automatically in kind’s inner container runtime. kind load docker-image copies it into the cluster nodes; a remote registry is another distribution path.", "Kubernetes uses imagePullPolicy to decide when to resolve or pull. Changing the policy does not repair a nonexistent image name, denied registry credentials or incompatible CPU architecture. For production, rebuild patched dependencies, scan the artifact and promote an immutable digest. A scan is evidence about known issues, not proof that code is safe."], "case": "Package the bank information page as tk-bank-web:1. Replace the page with a clear version marker so a rollout can be observed without a real transaction.", "nodes": [{"title": "Source", "detail": "HTML and Dockerfile"}, {"title": "Build artifact", "detail": "Image with a content identity"}, {"title": "Node runtime", "detail": "Pull or load, then execute"}], "diagramType": "flow", "lab": "Create index.html containing a fictional bank heading and use the Dockerfile below. Run docker build -t tk-bank-web:1 ., inspect the image, and run kind load docker-image tk-bank-web:1 --name techknowen-course. Deploy it in a separate namespace; the starter bank ConfigMap would otherwise hide the image’s page.", "verify": "Fetch the page from the separate workload and compare the visible marker. Inspect imageID in Pod status and distinguish it from the desired image tag.", "fault": "Use a missing tag and inspect ImagePullBackOff and Events. Restore the real image; avoid repeatedly deleting the Pod without fixing the image reference.", "question": "Does changing a tag in a registry necessarily restart existing Pods?", "answer": "No. Running Pods are not automatically replaced merely because the tag points elsewhere. Roll out an explicit immutable version.", "refs": ["https://kubernetes.io/docs/concepts/containers/images/", "https://docs.docker.com/build/concepts/dockerfile/"], "mode": "Local cluster", "code": "FROM nginx:1.27-alpine\nCOPY index.html /usr/share/nginx/html/index.html\nEXPOSE 80", "prereq": "Setup complete; a separate image-lab namespace. Dockerfile is not Kubernetes YAML."}, {"id": "pod-design", "track": "ckad", "title": "Pods, commands and container lifecycle", "domain": "Design and build", "summary": "Choose what must live together and what should scale separately.", "understand": ["Containers in a Pod share its network namespace and can communicate over localhost. They share files only through explicitly mounted volumes. A Pod is scheduled as a unit; adding containers is not a way to create independently scalable services.", "Kubernetes command and args override image execution defaults. Shell operators such as pipes require an explicit shell; an exec-form command is not automatically interpreted as shell syntax. A process should handle termination and write useful output to stdout/stderr."], "deep": ["Pod phase, container state and readiness are different. Running can contain an unhealthy or restarting container. CrashLoopBackOff describes restart backoff shown by tooling, not a Pod phase. The same Pod may restart a container, while a controller can create a different Pod after deletion.", "During termination, graceful shutdown and traffic draining must work together. A preStop hook consumes the termination grace period; it does not provide extra time beyond it. An application must stop accepting new work and complete or safely retry in-flight work. A forced kill can interrupt processing despite a healthy-looking deployment history."], "case": "A future bank API and its separate notification service should not share one Pod merely because both belong to banking. A tightly coupled file-transform helper may be a reasonable Pod companion.", "nodes": [{"title": "Pod boundary", "detail": "Shared network and scheduling fate"}, {"title": "Main process", "detail": "Handle requests and termination"}, {"title": "Mounted volume", "detail": "Explicitly share selected files"}], "diagramType": "flow", "lab": "Create a short-lived busybox Pod with --restart=Never and a command that prints a marker. Inspect its phase, exit code and logs. Compare it with the long-running bank-web Pod.", "verify": "The short task reaches Succeeded after exit code 0. You can identify which command was run and why it should not be deployed as an endlessly restarted server.", "fault": "Change exit 0 to exit 7 in a new Pod. Inspect terminated state instead of treating every non-running Pod as a network issue.", "question": "Is CrashLoopBackOff one of the official Pod phases?", "answer": "No. It is a waiting reason/backoff symptom. Inspect container state, last termination and logs to find the underlying cause.", "refs": ["https://kubernetes.io/docs/concepts/workloads/pods/", "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/", "https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/"], "mode": "Local cluster", "code": "kubectl -n tk-bank run one-task --image=busybox:1.37 --restart=Never -- sh -c \"echo bank-check; exit 0\"\nkubectl -n tk-bank logs one-task\nkubectl -n tk-bank get pod one-task -o yaml\nkubectl -n tk-bank delete pod one-task", "prereq": "Complete Setup and the starter application lab."}, {"id": "init-sidecars", "track": "ckad", "title": "Init containers and native sidecars", "domain": "Design and build", "summary": "Give preparation and continuous support different lifecycle rules.", "understand": ["A regular init container completes before the main application starts. It can create a file or wait for a prerequisite, but a permanently failing init prevents startup. A sidecar provides continuing support, such as a local proxy or file consumer.", "Native sidecars are expressed as initContainers with restartPolicy: Always. They start in init ordering but continue alongside application containers. Do not confuse this with an ordinary init container or with a second app container in the containers list."], "deep": ["A startup probe on a native sidecar can gate progression through startup. A readiness probe can affect the readiness of the whole Pod. Native sidecars have lifecycle handling designed for orderly startup/shutdown and do not keep a Job from completing after its main containers finish.", "Shared emptyDir data lasts for the Pod lifetime, not forever. Retrying an init must be safe: writing a file atomically is easier to reason about than applying a non-idempotent database migration on every restart. For migrations, use a deliberately coordinated process with locking and rollback planning."], "case": "A bank information Pod receives a generated learning page from an init container. A later experiment adds a support container that reads the same shared volume.", "nodes": [{"title": "Init", "detail": "Generate a page, then exit"}, {"title": "Application", "detail": "Serve the prepared file"}, {"title": "Sidecar", "detail": "Continue support alongside the app"}], "diagramType": "flow", "lab": "Apply init.yaml from the manifest library. Inspect initContainerStatuses, then fetch the page. Change the init command to exit 1 in a copied manifest and observe that the application cannot start; restore the successful command.", "verify": "The init exits 0 before nginx serves the file. Explain which volume makes the file visible to both containers and what deletion of the Pod loses.", "fault": "A helper runs forever as a regular init container. Correct the lifecycle design rather than lengthening a readiness timeout.", "question": "Why can an ordinary long-running init block the main container?", "answer": "The kubelet waits for regular init containers to complete successfully before starting the application containers.", "refs": ["https://kubernetes.io/docs/concepts/workloads/pods/init-containers/", "https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/"], "mode": "Local cluster", "code": "@lab:init.yaml", "prereq": "Complete Setup and the starter application lab."}, {"id": "workload-choice", "track": "ckad", "title": "Choose Deployment, DaemonSet or StatefulSet", "domain": "Design and build", "summary": "The controller should express the workload’s actual identity and placement needs.", "understand": ["A Deployment manages interchangeable replicas. A DaemonSet places a Pod on eligible nodes, making it useful for node-local agents. A StatefulSet gives stable ordered identities and can connect each replica with its own persistent claim.", "Stable identity does not implement database replication. A StatefulSet can preserve a name while the application still needs quorum, backup, leader election or recovery logic. Choose the simplest resource that satisfies the real workload."], "deep": ["Deployments use ReplicaSets to manage revisions and counts. DaemonSet eligibility depends on node selection and scheduling constraints; it is not a promise of exactly one Pod on every possible machine. StatefulSets normally use a headless Service for stable network identity and have different update and ordering controls.", "Deleting a Pod is a useful failure experiment, but deleting storage is a different, potentially destructive operation. Claims and volumes have their own lifecycle. Read retention and reclaim settings before attempting cleanup. Separate disposable lab records from a real database before experimenting."], "case": "bank-web is stateless and fits a Deployment. A node log collector fits a DaemonSet. A replicated database requires a deliberate stateful design and may be managed outside the cluster.", "nodes": [{"title": "Interchangeable web", "detail": "Deployment replicas"}, {"title": "Node-local collector", "detail": "DaemonSet placement"}, {"title": "Stable replica identity", "detail": "StatefulSet plus storage design"}], "diagramType": "architecture", "lab": "Inspect the running bank Deployment and the kube-system DaemonSets using read-only commands. Record desired/current/ready counts and explain which nodes are eligible. Design a three-replica database identity table without claiming that three Pods equal a functioning database.", "verify": "You can justify each controller and identify the additional application-level replication requirement for a database.", "fault": "A team uses three independent database Pods behind a Service without replication. Explain why requests could observe unrelated datasets.", "question": "Does StatefulSet make a database highly available by itself?", "answer": "No. It supplies workload identity and ordering primitives. The database must implement and be configured for replication and failure handling.", "refs": ["https://kubernetes.io/docs/concepts/workloads/controllers/deployment/", "https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/", "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/"], "mode": "Local cluster", "code": "kubectl -n tk-bank describe deployment bank-web\nkubectl -n kube-system get daemonsets\nkubectl explain statefulset.spec.volumeClaimTemplates", "prereq": "Complete Setup and the starter application lab."}, {"id": "jobs", "track": "ckad", "title": "Jobs and CronJobs without duplicate surprises", "domain": "Design and build", "summary": "Completion-based work needs explicit retry and concurrency rules.", "understand": ["A Job manages work that should finish. A CronJob creates Jobs on a schedule. A schedule is not a guarantee of precisely one business execution at a precise instant. Restarts, retries and controller conditions can cause missed or repeated work.", "Set a retry budget and consider a deadline. Forbid on a CronJob avoids overlapping Jobs from that same CronJob, but it is not a global lock across other producers. Keep successful and failed history small enough to inspect without accumulating forever."], "deep": ["backoffLimit limits failed Job attempts; activeDeadlineSeconds limits elapsed execution time. completions and parallelism answer different questions: how much successful work is required versus how many Pods may work simultaneously. Work partitioning still belongs to your application.", "For a financial reconciliation job, record a business operation key and make repeat processing harmless. An HTTP timeout might occur after the downstream write committed. Blindly retrying a transfer could duplicate an effect even if the Kubernetes Job eventually shows Complete."], "case": "The course reconciliation Job prints a fictional total and exits. A real reconciliation design would compare immutable records and record which reporting period was processed.", "nodes": [{"title": "Schedule", "detail": "CronJob creates an execution"}, {"title": "Job", "detail": "Retry within a defined budget"}, {"title": "Business record", "detail": "Deduplicate the reporting period"}], "diagramType": "flow", "lab": "Apply jobs.yaml. Wait for the one-off Job to complete and inspect its logs. Create an immediate Job from the CronJob, rather than waiting for its schedule, then compare Job ownership and results.", "verify": "Both tasks finish and log the expected marker. Explain why two successful logs are not proof of exactly-once financial processing.", "fault": "Make a copied Job exit 1 with backoffLimit: 1. Inspect the failed Pods and final condition, then delete that named experiment.", "question": "Does concurrencyPolicy: Forbid prevent all duplicate business processing?", "answer": "No. It limits overlap for that CronJob. Application-level deduplication remains necessary.", "refs": ["https://kubernetes.io/docs/concepts/workloads/controllers/job/", "https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/"], "mode": "Local cluster", "code": "@lab:jobs.yaml", "prereq": "Complete Setup and the starter application lab."}, {"id": "configuration", "track": "ckad", "title": "ConfigMaps and configuration rollout", "domain": "Environment and security", "summary": "Keep environment-specific values separate from the image.", "understand": ["A ConfigMap carries non-secret configuration. A container can consume values as environment variables, arguments or mounted files. The application must know how to read them; Kubernetes does not automatically change application behaviour merely because a key exists.", "A mounted directory can receive eventual updates, but a process may cache what it read. Environment variables do not change in a running process. A subPath mount does not receive the normal projected-volume updates. Choose a reload or rollout strategy deliberately."], "deep": ["The bank page is projected from a ConfigMap directory. An updated key can become visible without rebuilding nginx. A deployment that reads a database host once during startup may instead require replacement Pods. Use versioned configuration names or a Pod-template checksum when you need a reviewable rollout trigger.", "Configuration should be validated before release. A syntactically valid URL can still target the wrong environment. Record the intended config version alongside the image version and keep a compatible rollback combination. Reverting only the image may not restore previous behaviour."], "case": "Change the learning page’s heading in bank.yaml. Observe file projection separately from Pod restart; record both the response and Pod UID.", "nodes": [{"title": "ConfigMap", "detail": "Non-secret values"}, {"title": "Delivery choice", "detail": "Environment or mounted files"}, {"title": "Application", "detail": "Reload or restart deliberately"}], "diagramType": "flow", "lab": "Edit only index.html in the starter ConfigMap and reapply bank.yaml. Repeatedly fetch the page until it changes. Then inspect the container environment and explain why projected files and environment variables differ.", "verify": "The page eventually changes while the Pod identity can remain the same. Do not claim an immediate update deadline from this one observation.", "fault": "Reference a missing ConfigMap key in a copied Pod. Diagnose the configuration error from Events instead of changing the Service.", "question": "Will an updated ConfigMap automatically rewrite an existing process environment?", "answer": "No. Environment variables are set when the container starts; replace or restart through the workload strategy.", "refs": ["https://kubernetes.io/docs/concepts/configuration/configmap/", "https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/"], "mode": "Local cluster", "code": "kubectl -n tk-bank get configmap bank-page -o yaml\nkubectl apply -f bank.yaml\nkubectl -n tk-bank get pods -l app=bank-web -o wide", "prereq": "Complete Setup and the starter application lab."}, {"id": "secrets", "track": "ckad", "title": "Secrets, identity and credential boundaries", "domain": "Environment and security", "summary": "Encoding is not encryption, and reading permission is security-sensitive.", "understand": ["A Secret is an API object for sensitive values. Base64 encodes bytes for representation; anyone who can read the encoded value can decode it. Protect API access, storage encryption, audit exposure and the application’s handling of credentials.", "Use fictional values in labs. Avoid placing real credentials in committed manifests, terminal history, screenshots or logs. A Secret mounted in a Pod becomes accessible to the processes that can read that mount; the object type alone does not make the process trustworthy."], "deep": ["Secret changes delivered through mounted volumes are eventual and still require application reload behaviour. Environment-based consumption requires a new process. imagePullSecrets authenticate image pulls, while a ServiceAccount identifies an application to the Kubernetes API; neither is a universal application login.", "Short-lived workload identity reduces reliance on long-lived keys in cloud environments. In GKE, Workload Identity Federation connects Kubernetes workload identity to Google Cloud authorization. That relationship does not replace Kubernetes RBAC or automatically grant database-level access."], "case": "A fictional report worker reads a dummy token from a mounted file. Its check prints only the file’s byte count, never the token value.", "nodes": [{"title": "Secret object", "detail": "Restrict API access"}, {"title": "Projected file", "detail": "Mount only where needed"}, {"title": "Application", "detail": "Avoid logging the value"}], "diagramType": "flow", "lab": "Create a dummy Secret and apply secret-reader.yaml. Inspect logs to verify the file exists without printing its contents. Review who can get Secrets with kubectl auth can-i.", "verify": "The worker prints a positive byte count. Explain why this demonstrates mounting, not encryption at rest or proper production access control.", "fault": "Change the Secret name in the Pod to a nonexistent name; inspect the mount/configuration event and restore it.", "question": "Does base64 protect a leaked Secret from a reader?", "answer": "No. Base64 is reversible encoding. Access controls and encryption address different parts of the exposure.", "refs": ["https://kubernetes.io/docs/concepts/configuration/secret/", "https://kubernetes.io/docs/concepts/security/secrets-good-practices/"], "mode": "Local cluster", "code": "@lab:secret-reader.yaml", "prereq": "Complete Setup and the starter application lab."}, {"id": "resources", "track": "ckad", "title": "Requests, limits, quotas and OOM", "domain": "Environment and security", "summary": "Separate scheduling promises from runtime constraints.", "understand": ["Requests inform scheduling and resource sharing; limits constrain runtime consumption where supported. CPU is compressible: a CPU limit can throttle execution. Exceeding a memory limit can lead to an OOM kill. A request is not an instruction to continuously consume that quantity.", "ResourceQuota limits aggregate namespace usage or object counts. LimitRange can supply defaults and validate per-object values. A rejected API request, a Pending Pod and a killed container indicate different enforcement points."], "deep": ["100m CPU is one tenth of a CPU unit. 128Mi is a binary memory quantity. Read units carefully: confusing memory suffixes can produce absurdly small or large requests. Scheduling uses requests and placement constraints, not simply the current output of top.", "A large request can leave a Pod Pending on a mostly idle cluster because the scheduler reserves capacity against declared requests. A tiny memory limit may start successfully and fail only under traffic. Measure representative startup and steady-state behaviour before selecting settings; limits are neither capacity planning nor protection against all noisy-neighbour effects."], "case": "bank-web starts with modest explicit requests and limits. A controlled copy requests 100 CPUs to make the scheduling failure obvious without allocating them.", "nodes": [{"title": "Admission", "detail": "Quota and limit validation"}, {"title": "Scheduler", "detail": "Place using requests"}, {"title": "Runtime", "detail": "CPU throttling or memory enforcement"}], "diagramType": "flow", "lab": "Inspect requests and limits in bank.yaml. Create pending.yaml from the library; describe it and read the FailedScheduling event. Delete only the pending experiment afterward.", "verify": "The oversized Pod stays Pending with an insufficient CPU explanation. No successful application process should be inferred from API acceptance.", "fault": "A container reports OOMKilled. Compare lastState, limits and application memory evidence before merely raising the limit.", "question": "Why can a Pod remain Pending while top shows idle CPUs?", "answer": "Placement is based on requests and constraints, not just instantaneous measured utilization.", "refs": ["https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/", "https://kubernetes.io/docs/concepts/policy/resource-quotas/", "https://kubernetes.io/docs/concepts/policy/limit-range/"], "mode": "Local cluster", "code": "@lab:pending.yaml", "prereq": "Complete Setup and the starter application lab."}, {"id": "identity-rbac", "track": "ckad", "title": "Authentication, RBAC and ServiceAccounts", "domain": "Environment and security", "summary": "Identify a caller, authorize an action, then evaluate admission rules.", "understand": ["Authentication answers who the caller is. Authorization asks whether that identity may perform a verb on a resource in a scope. Admission evaluates an authorized request before accepting certain changes. A valid identity can still receive Forbidden.", "A ServiceAccount is a Kubernetes workload identity. A Role defines permissions in a namespace; a RoleBinding grants permissions to a subject. A ClusterRole can describe broader permissions and can also be bound within a namespace. Avoid using cluster-admin as a generic application fix."], "deep": ["RBAC grants are additive: an extra broad binding can allow an operation despite a carefully narrow Role elsewhere. There is no ordinary RBAC deny rule that subtracts that grant. Inspect effective permissions rather than only one YAML file.", "A mounted projected ServiceAccount token is not a user password or Google Cloud service-account key. Disable automatic token mounting for workloads that do not need API access. Admission security policies can still reject a Pod even when a caller is allowed to create Pods. Keep identity, API permission and workload security diagnosis separate."], "case": "A bank status reader needs get/list/watch on Pods in tk-bank, not permission to read customer credentials or alter all namespaces.", "nodes": [{"title": "Authenticate", "detail": "Which identity called?"}, {"title": "Authorize", "detail": "Can it get Pods here?"}, {"title": "Admit", "detail": "Does this change satisfy policies?"}], "diagramType": "flow", "lab": "Apply rbac.yaml. Use auth can-i with the supplied ServiceAccount identity to test get Pods and get Secrets. Impersonation for this local test requires the lab administrator context; a normal learner may not have that right.", "verify": "Pod read is yes; Secret read is no. Explain why a RoleBinding subject namespace and the resource namespace are distinct fields.", "fault": "Bind the Role to the wrong ServiceAccount name in a copy. Diagnose Forbidden by inspecting subjects and roleRef rather than granting cluster-admin.", "question": "Can a RoleBinding itself contain permission rules?", "answer": "No. It associates subjects with a referenced Role or ClusterRole; the referenced role contains the rules.", "refs": ["https://kubernetes.io/docs/reference/access-authn-authz/rbac/", "https://kubernetes.io/docs/concepts/security/service-accounts/", "https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/"], "mode": "Local cluster", "code": "@lab:rbac.yaml", "prereq": "Complete Setup and the starter application lab."}, {"id": "security-context", "track": "ckad", "title": "Run with a deliberate security context", "domain": "Environment and security", "summary": "Reduce process privilege while preserving the files and ports the app needs.", "understand": ["A securityContext controls aspects of a Pod or container’s execution. Running as a non-root user, preventing privilege escalation and dropping capabilities limit what a compromised process can do. A read-only root filesystem blocks writes there, but applications may still need explicitly mounted writable directories.", "Pod Security Admission evaluates workload settings against policy levels. It is an admission mechanism, not an antivirus or runtime network firewall. Security settings must be compatible with the image and its expected UID, paths and port."], "deep": ["Capabilities split some privileged operations into specific permissions. Adding all capabilities defeats a narrow design. allowPrivilegeEscalation: false prevents gaining more privileges through mechanisms such as setuid; it does not revoke privileges already granted. seccompProfile: RuntimeDefault requests the runtime’s default syscall filter.", "An application can be non-root and still read every credential mounted into its filesystem. Reduce identity permissions and mounts too. A failing read-only-root experiment should lead to inspection of writable paths, not immediate removal of every security setting."], "case": "The security demonstration is a small busybox process that writes only to /work on emptyDir, rather than forcing the original nginx image into incompatible settings.", "nodes": [{"title": "Admission policy", "detail": "Check acceptable Pod settings"}, {"title": "Container identity", "detail": "UID, capabilities and seccomp"}, {"title": "Filesystem", "detail": "Read-only root; explicit /work volume"}], "diagramType": "flow", "lab": "Apply security.yaml, inspect the process identity and the successful /work output in logs. Attempt a write to an unmounted root path using a copied command and record the permission failure.", "verify": "The container uses the declared nonzero UID and writes only to its mounted writable path. Keep the restrictive settings in the corrected configuration.", "fault": "runAsNonRoot is set but the image defaults to UID 0. Choose a compatible image or explicit valid UID; do not call the rejection a scheduling failure.", "question": "Does non-root execution remove the need for least-privilege API access?", "answer": "No. Process privilege and API authorization protect different boundaries.", "refs": ["https://kubernetes.io/docs/tasks/configure-pod-container/security-context/", "https://kubernetes.io/docs/concepts/security/pod-security-standards/", "https://kubernetes.io/docs/concepts/security/pod-security-admission/"], "mode": "Local cluster", "code": "@lab:security.yaml", "prereq": "Complete Setup and the starter application lab."}, {"id": "storage", "track": "ckad", "title": "Volumes, PVCs and persistence", "domain": "Design and build", "summary": "Know which deletion or restart destroys which data.", "understand": ["A container writable layer is ephemeral. emptyDir survives a container restart inside a Pod but is deleted with the Pod. A PersistentVolumeClaim asks for storage with a size, access mode and optionally a StorageClass. A PersistentVolume represents the supplied storage resource.", "A PVC is not a backup. A bound claim does not prove that application data is consistent or recoverable. Storage access modes describe supported mounting constraints, not database transaction isolation or filesystem permissions."], "deep": ["Dynamic provisioning uses a StorageClass and its provisioner. WaitForFirstConsumer delays binding/provisioning until scheduling context is known, which matters for zonal storage. An immediate expectation that every new PVC must already be Bound can therefore misdiagnose healthy behaviour.", "ReadWriteOnce means read/write mounting by one node, not universally one Pod. ReadWriteOncePod has a different single-Pod intent and requires compatible CSI support. A Delete reclaim policy can remove backing storage when a claim is removed. Inspect lifecycle settings before deleting a stateful lab."], "case": "Write a harmless learning marker to a PVC, delete only the consumer Pod, and recreate it against the same claim. The marker should survive that specific event.", "nodes": [{"title": "PVC", "detail": "Request capacity and access mode"}, {"title": "PV / provisioner", "detail": "Bind a suitable backing volume"}, {"title": "Pod mount", "detail": "Read and write the persistent path"}], "diagramType": "flow", "lab": "Apply storage.yaml. Write a marker, delete the named consumer Pod and reapply the file. Read the marker from the replacement. Keep the PVC until the observation is complete.", "verify": "The new Pod has a different UID while the marker remains. Record StorageClass and reclaim policy; do not extrapolate this into a tested disaster-recovery guarantee.", "fault": "If Pending, check whether a default class/provisioner exists and whether binding waits for a consumer. Investigate node/zone constraints before replacing data.", "question": "Does a surviving PVC prove a backup can be restored?", "answer": "No. Persistence through Pod replacement and independently verified backup recovery are different properties.", "refs": ["https://kubernetes.io/docs/concepts/storage/volumes/", "https://kubernetes.io/docs/concepts/storage/persistent-volumes/", "https://kubernetes.io/docs/concepts/storage/storage-classes/"], "mode": "Local cluster", "code": "@lab:storage.yaml", "prereq": "Complete Setup and the starter application lab."}, {"id": "probes", "track": "ckad", "title": "Startup, readiness and liveness probes", "domain": "Observability and maintenance", "summary": "Ask three different health questions instead of using one endpoint for everything.", "understand": ["Startup asks whether initialization has completed. While a startup probe has not succeeded, liveness and readiness probes are held back. Readiness controls eligibility for normal Service traffic. Liveness can trigger a container restart after repeated failures.", "A dependency outage is not always a reason to restart your application. If every instance restarts because a shared database is briefly unavailable, you may amplify the incident. Choose endpoints and thresholds based on what corrective action is useful."], "deep": ["The probe target runs from the node’s perspective for HTTP/TCP probes; reaching localhost from your browser proves a different route. Named ports and application listen addresses must agree. A probe may succeed while a business endpoint fails, so end-to-end tests remain necessary.", "For approximate startup tolerance, reason from periodSeconds and failureThreshold, then account for probe timing rather than treating their product as a precise SLA. Readiness recovery is asynchronous through endpoint updates and traffic paths. It is not an instantaneous global traffic switch."], "case": "bank-web readiness checks the served page and liveness checks nginx. A copied Deployment with a nonexistent readiness path becomes unready while its process continues running.", "nodes": [{"title": "Startup", "detail": "Has initialization finished?"}, {"title": "Readiness", "detail": "Should this replica receive traffic?"}, {"title": "Liveness", "detail": "Would restarting this process help?"}], "diagramType": "flow", "lab": "Inspect the starter probes. In a separate copied workload, set readiness path to /missing. Observe Running with Ready false, then correct it. Do not intentionally break the primary bank service while other labs depend on it.", "verify": "The container can be Running while the Pod is unready. Inspect EndpointSlice readiness and explain the different effects of failing liveness versus readiness.", "fault": "A slow-starting service is killed repeatedly by an aggressive liveness probe. Add a justified startup probe and verify startup behaviour rather than simply disabling health checks.", "question": "Does a readiness failure automatically restart the container?", "answer": "No. It marks readiness false. Liveness/startup failure thresholds can cause restarts.", "refs": ["https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/", "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/"], "mode": "Local cluster", "code": "kubectl -n tk-bank get pods\nkubectl -n tk-bank describe deployment bank-web\nkubectl -n tk-bank get endpointslices -l kubernetes.io/service-name=bank-web -o yaml", "prereq": "Complete Setup and the starter application lab."}, {"id": "debugging", "track": "ckad", "title": "Debug from symptoms to evidence", "domain": "Observability and maintenance", "summary": "Use status, Events, logs and a request test in a repeatable order.", "understand": ["Start by naming the symptom: not scheduled, image not pulled, process exits, unready, or unreachable through a Service. Each symptom poi
