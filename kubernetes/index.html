nts to a different layer. get gives a summary; describe supplies conditions and Events; logs exposes process output; exec tests inside a running container.", "Use logs --previous when the prior container instance crashed. Select the container with -c when a Pod has several. A missing shell in a minimal image is expected and does not prove the application is broken."], "deep": ["Ephemeral debug containers can help when a production image lacks tools, subject to permissions and runtime support. They alter the Pod’s diagnostic state and should be used deliberately. Debug access may expose memory, mounted secrets or network access, so it is a privileged operational capability.", "Events are temporary observations, not a durable audit history. Standard output is not automatically retained after every deletion. Production logging needs collection, retention and access controls. Record timestamps, object UID, recent changes and the smallest reproduction before changing multiple variables."], "case": "Inject a wrong Service selector, a nonexistent image and a wrong readiness path in separate disposable experiments. Each should produce a different diagnosis and repair.", "nodes": [{"title": "Symptom", "detail": "Pending, crashing, unready or unreachable?"}, {"title": "Evidence", "detail": "Conditions, Events, logs and endpoints"}, {"title": "Repair", "detail": "Change one cause, then repeat the request"}], "diagramType": "flow", "lab": "Use the provided triage commands against bank-web. Then create a new busybox Pod that exits 7. Find its exit code and logs. Explain how the evidence differs from an image pull failure.", "verify": "Your incident note includes a symptom, evidence, causal hypothesis, one correction and a repeated acceptance check.", "fault": "A page is unreachable but Pods are Ready. Inspect Service selector, ports, EndpointSlices and client path before restarting every Pod.", "question": "What does logs --previous retrieve?", "answer": "The previous terminated container instance’s logs when available, not a complete historical archive of all deleted Pods.", "refs": ["https://kubernetes.io/docs/tasks/debug/debug-application/", "https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/", "https://kubernetes.io/docs/concepts/cluster-administration/logging/"], "mode": "Local cluster", "code": "kubectl -n tk-bank get pods -o wide\nkubectl -n tk-bank get events --sort-by=.metadata.creationTimestamp\nkubectl -n tk-bank logs deployment/bank-web --tail=30\nkubectl -n tk-bank get service,endpointslices\nkubectl -n tk-bank describe deployment bank-web", "prereq": "Complete Setup and the starter application lab."}, {"id": "services-dns", "track": "ckad", "title": "Services, DNS and the packet path", "domain": "Services and networking", "summary": "A stable name selects changing endpoints; it is not the application itself.", "understand": ["A ClusterIP Service provides stable in-cluster access to selected endpoints. port is the Service-facing port; targetPort is the backend port. containerPort documents a container port but does not make a process listen or expose it externally.", "DNS normally resolves a Service name inside the cluster. A short name uses the caller’s namespace search path. bank-web.tk-bank.svc.cluster.local is a typical fully qualified name when the cluster domain is cluster.local; clusters can choose a different domain."], "deep": ["EndpointSlices represent backend addresses and conditions. kube-proxy or an alternative data plane programs forwarding; the Service is not necessarily a standalone proxy process. Implementations may use iptables, IPVS or eBPF mechanisms. Avoid drawing the API server in every customer request path.", "NodePort exposes a port through node networking; LoadBalancer asks an integration to provide external load balancing. A local kind cluster does not automatically supply a cloud load balancer. A pending external address may reflect missing integration rather than a failed Pod. Port-forward is a development access mechanism, not proof of production ingress."], "case": "A client Pod reaches bank-web through cluster DNS while your laptop uses port-forward. Compare the two paths rather than assuming they test identical networking.", "nodes": [{"title": "Client Pod", "detail": "Resolve Service DNS"}, {"title": "Service routing", "detail": "Select ready EndpointSlice backends"}, {"title": "Web Pod", "detail": "Listen on targetPort 80"}], "diagramType": "architecture", "lab": "Run a disposable busybox client to fetch http://bank-web.tk-bank.svc.cluster.local. Inspect Service ports and EndpointSlices. Then deliberately change a copied Service targetPort and compare the resulting connection failure.", "verify": "The client receives the page through Service DNS. The selected addresses match the intended Pods, and the backend port matches the application listener.", "fault": "Correct DNS but no response: inspect endpoints and targetPort before editing CoreDNS. No endpoints: inspect selector and readiness first.", "question": "Does declaring containerPort: 80 start an HTTP server?", "answer": "No. The process in the image must actually listen. The declaration alone neither starts it nor exposes it outside the Pod.", "refs": ["https://kubernetes.io/docs/concepts/services-networking/service/", "https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/", "https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/"], "mode": "Local cluster", "code": "kubectl -n tk-bank run client --image=busybox:1.37 --restart=Never -- wget -qO- http://bank-web.tk-bank.svc.cluster.local\nkubectl -n tk-bank logs client\nkubectl -n tk-bank delete pod client\nkubectl -n tk-bank get service bank-web -o yaml", "prereq": "Complete Setup and the starter application lab."}, {"id": "network-policy", "track": "ckad", "title": "NetworkPolicy and explicit reachability tests", "domain": "Services and networking", "summary": "A policy document is effective only when the network implementation enforces it.", "understand": ["NetworkPolicy selects Pods and allows specified ingress or egress traffic. Policies are additive. Once a Pod is isolated for a direction, the permitted traffic is the union of applicable allow rules. Source egress and destination ingress must both allow a connection when both ends are isolated.", "A namespaceSelector and podSelector in one peer entry combine conditions. Separate peer entries are alternatives. Empty selectors and empty rule lists have different meanings; read the YAML structure carefully."], "deep": ["DNS is often the first dependency accidentally blocked by default-deny egress. Permit the correct DNS destination and protocols for your cluster, then test name resolution separately from application access. A policy can select Pods by namespace labels without making namespace names a built-in security boundary.", "The basic kind setup’s default networking is not a NetworkPolicy enforcement lab. Use a documented compatible CNI such as Calico or Cilium in a separate policy-capable cluster. An API server accepting the object is not evidence of enforcement. Record allowed and denied requests from distinct clients, and check plugin-specific behaviour."], "case": "Only a labelled bank frontend should reach the backend’s web port; an unlabelled diagnostic client should be denied. The outcome must be tested in an enforcing environment.", "nodes": [{"title": "Client egress", "detail": "Source must permit the destination"}, {"title": "Policy boundary", "detail": "Match namespace, labels and port"}, {"title": "Server ingress", "detail": "Destination must permit the source"}], "diagramType": "flow", "lab": "Inspect policy.yaml and predict the result for a labelled and an unlabelled client. In a policy-enforcing cluster, apply it and run both request tests with timeouts. In basic kind, stop at schema inspection and record enforcement as not tested.", "verify": "Collect one allowed request and one denied request plus CNI identity. API creation alone does not satisfy this lab.", "fault": "A default-deny egress policy breaks every hostname. Test DNS and add the narrowly required DNS allowance instead of allowing all egress indiscriminately.", "question": "Is successful kubectl apply proof that a NetworkPolicy blocks traffic?", "answer": "No. Enforcement requires a supporting network plugin and observed traffic tests.", "refs": ["https://kubernetes.io/docs/concepts/services-networking/network-policies/", "https://kubernetes.io/docs/tasks/administer-cluster/network-policy-provider/"], "mode": "Policy-capable cluster", "code": "@lab:policy.yaml", "prereq": "Networking lesson; a separate cluster with a verified NetworkPolicy-enforcing CNI for traffic tests."}, {"id": "ingress", "track": "ckad", "title": "Ingress rules and the controller behind them", "domain": "Services and networking", "summary": "The route object and the traffic-handling implementation are separate.", "understand": ["An Ingress describes HTTP/HTTPS routing to Services. An Ingress controller interprets that declaration and configures a traffic-handling implementation. Creating an Ingress without a matching controller does not create a reachable website.", "Hosts, paths, pathType and backend Service ports must fit together. An IngressClass selects or describes the responsible implementation. TLS needs a certificate and private key in the expected Secret format, plus a hostname that the certificate covers."], "deep": ["Ingress is a stable but frozen API; Gateway API is the extensible successor discussed in CKA and deeper networking lessons. Controller-specific annotations are not portable Kubernetes behaviour. Check the chosen controller’s maintained installation and compatibility guidance rather than pasting an obsolete quickstart.", "External DNS, load-balancer health checks, the controller route and backend readiness are different dependencies. A Host header can select a route during local testing even before public DNS is configured. A TLS handshake can succeed while the backend returns 503; that proves different portions of the path."], "case": "bank.example.test routes / to bank-web on port 80. The fictional hostname is a lab input, not a public DNS record or a real bank domain.", "nodes": [{"title": "Host + path", "detail": "bank.example.test /"}, {"title": "Ingress controller", "detail": "Resolve route and TLS configuration"}, {"title": "Service backend", "detail": "bank-web port 80"}], "diagramType": "architecture", "lab": "Read ingress.yaml and validate it against the API. In a cluster with an installed, maintained controller, set the correct ingressClassName and use its documented local access path. Send a request with the matching Host header; record the controller and version.", "verify": "An end-to-end request reaches the bank page. Without a controller, record only schema validation and explain the missing execution component.", "fault": "An Ingress exists but no traffic arrives. Check class/controller reconciliation, address and route events before changing the application.", "question": "Why can an Ingress exist without serving any requests?", "answer": "It is desired routing configuration. A compatible controller and reachable data plane must implement it.", "refs": ["https://kubernetes.io/docs/concepts/services-networking/ingress/", "https://kubernetes.io/docs/concepts/services-networking/ingress-controllers/"], "mode": "Ingress-capable cluster", "code": "@lab:ingress.yaml", "prereq": "Services lesson plus an installed maintained Ingress controller for live routing."}, {"id": "rollouts", "track": "ckad", "title": "Rolling updates and honest rollback", "domain": "Application deployment", "summary": "Observe availability while replacing a version, not only after it finishes.", "understand": ["A Deployment rollout creates a new ReplicaSet when its Pod template changes. maxSurge allows extra Pods during replacement; maxUnavailable allows a bounded reduction in available replicas. Percentages and rounding matter for small replica counts.", "Readiness determines when new replicas can serve. A rollout can stall even though Pods exist. Inspect rollout status, conditions and Events, and retain the previous known-good version. An automatic restart of unhealthy containers is not the same as a rollback of the Deployment."], "deep": ["With two replicas, maxUnavailable: 0 and maxSurge: 1, a new ready replica is needed before an old one can be removed. This needs spare schedulable capacity. If a quota or resource shortage blocks the surge, rollout may not progress even though the existing version is healthy.", "rollout undo restores a prior Pod template revision. It does not reverse a database migration, external message or independently changed ConfigMap. Design backward-compatible data transitions and record configuration alongside image versions. A successful rollback command is only the beginning of recovery verification."], "case": "Change the bank Deployment image to an intentionally nonexistent tag to observe a stalled replacement while old ready replicas continue serving; then undo the Pod-template change.", "nodes": [{"title": "Old ReplicaSet", "detail": "Keep available capacity"}, {"title": "New ReplicaSet", "detail": "Start, probe and become ready"}, {"title": "Traffic + evidence", "detail": "Verify the new response before completion"}], "diagramType": "flow", "lab": "Run the commands below on the disposable starter Deployment. rollout status is expected to time out for the bad image. Inspect the state, undo, then wait for successful rollout and fetch the page.", "verify": "Old ready replicas preserve service in the specified strategy, and rollback restores a healthy Deployment. Record actual observed counts and image references.", "fault": "Undo succeeds but the page remains incorrect because configuration changed independently. Restore a compatible configuration and retest.", "question": "Does rollout undo undo a schema migration?", "answer": "No. It restores Deployment revision state, not external database operations.", "refs": ["https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"], "mode": "Local cluster", "code": "kubectl -n tk-bank set image deployment/bank-web web=nginx:techknowen-does-not-exist\nkubectl -n tk-bank rollout status deployment/bank-web --timeout=30s\nkubectl -n tk-bank get pods\nkubectl -n tk-bank rollout undo deployment/bank-web\nkubectl -n tk-bank rollout status deployment/bank-web --timeout=120s", "prereq": "Complete Setup and the starter application lab."}, {"id": "release-strategies", "track": "ckad", "title": "Blue/green and canary with Kubernetes primitives", "domain": "Application deployment", "summary": "Choose how traffic reaches versions and define the evidence for promotion.", "understand": ["Blue/green keeps two versions available and switches the active route or selector. Canary exposes a limited share of traffic to the candidate while observing errors and latency. Both require a promotion decision and a recovery route.", "A Service selecting one old Pod and one new Pod is not a guarantee of exactly 50% user traffic. Connection reuse, session behaviour and implementation details can make counts uneven. Accurate weighted routing requires a capable traffic layer and measurement."], "deep": ["Label versions explicitly so a route can choose the intended candidate. Reusing identical broad selectors can mix versions unintentionally. A shared database must remain compatible with both versions during the transition; otherwise traffic switching can expose data incompatibility.", "Promotion criteria should include a baseline, minimum observation volume, error thresholds and business correctness. A low-error five-request test is weak evidence. Long-lived connections and caches may keep traffic on old code after a selector change, so define what rollback actually guarantees."], "case": "Create bank-blue and bank-green pages with visible version markers. A stable bank-active Service selects one colour. Verify the marker before and after the selector change.", "nodes": [{"title": "Blue", "detail": "Known-good version remains available"}, {"title": "Routing decision", "detail": "Select active version deliberately"}, {"title": "Green", "detail": "Candidate validated before promotion"}], "diagramType": "architecture", "lab": "Copy the starter into a separate namespace with two Deployments labelled release=blue and release=green and two distinct page ConfigMaps. Point one Service at blue, fetch it, switch only its selector to green, then switch back.", "verify": "Requests return the selected version marker. Record the observed transition and explain why the experiment does not test database rollback or exact traffic weighting.", "fault": "The candidate is unhealthy yet the Service is switched anyway. Add readiness verification and a rollback condition to the release checklist.", "question": "Do replica ratios guarantee exact canary traffic percentages?", "answer": "No. They can approximate distribution under some conditions. Use a suitable routing layer and measured request data for controlled weights.", "refs": ["https://kubernetes.io/docs/concepts/workloads/controllers/deployment/", "https://kubernetes.io/docs/concepts/services-networking/service/"], "mode": "Local cluster", "code": "kubectl -n tk-release patch service bank-active -p '{\"spec\":{\"selector\":{\"app\":\"bank-web\",\"release\":\"green\"}}}'\nkubectl -n tk-release get endpointslices -l kubernetes.io/service-name=bank-active", "prereq": "Build the separate blue/green exercise described here before executing the selector change."}, {"id": "helm", "track": "ckad", "title": "Helm: inspect, install, upgrade and recover", "domain": "Application deployment", "summary": "Treat a chart as a package that renders Kubernetes resources.", "understand": ["A chart packages templates and default values. A release is an installed instance of that chart. Values customise the rendered objects; the resulting YAML still needs to be valid and appropriate for the cluster. Chart version and application image version are different identifiers.", "Inspect an unfamiliar chart before installing it. It may create cluster-scoped permissions, webhooks, storage or external services. A package manager is not a trust decision. Prefer a maintained source, an explicit version and a review of rendered manifests."], "deep": ["helm template renders locally but cannot prove that all server capabilities, admission rules or runtime dependencies will accept the result. Upgrade and rollback manage release revisions, but hooks and external effects complicate reversibility. Persistent data may outlive a release or be affected by its cleanup policies.", "A value named replicas has no universal meaning unless the chart uses it. Verify the rendered Deployment rather than assuming an override worked. Quote values with ambiguous types when necessary and keep reviewed values in a file instead of a long, unrepeatable command."], "case": "The supplied small bank-info chart creates a two-replica nginx Deployment and a Service in its release namespace. It avoids cluster-wide permissions and external load balancers.", "nodes": [{"title": "Chart + values", "detail": "Reviewed package and overrides"}, {"title": "Rendered objects", "detail": "Inspect image, replicas and permissions"}, {"title": "Release", "detail": "Install, observe, upgrade and rollback"}], "diagramType": "flow", "lab": "Create the chart files from the manifest library. Run helm lint and helm template before install. Install into tk-helm, upgrade replicaCount to 3, inspect history, then rollback to revision 1 and verify two replicas.", "verify": "Observed Deployment replicas follow rendered values. Record Helm release history and verify service reachability rather than relying only on a successful Helm exit.", "fault": "Change an unused value and observe no manifest difference. Find the template key actually used instead of assuming every value is automatically interpreted.", "question": "Is a Helm release the same as a chart version?", "answer": "No. A release is an installed instance with its own revision history. The chart is the versioned package.", "refs": ["https://helm.sh/docs/intro/using_helm/", "https://helm.sh/docs/chart_template_guide/getting_started/"], "mode": "Local cluster", "code": "helm lint ./bank-info\nhelm template bank-info ./bank-info --namespace tk-helm\nhelm upgrade --install bank-info ./bank-info -n tk-helm --create-namespace --wait\nhelm upgrade bank-info ./bank-info -n tk-helm --set replicaCount=3 --wait\nhelm history bank-info -n tk-helm\nhelm rollback bank-info 1 -n tk-helm --wait", "prereq": "Install Helm using its official instructions. Create the supplied bank-info chart files first."}, {"id": "kustomize", "track": "ckad", "title": "Kustomize: reusable bases and explicit overlays", "domain": "Application deployment", "summary": "Change declared YAML without embedding a programming template language.", "understand": ["A Kustomize base contains reusable resources. An overlay references a base and supplies environment-specific patches or transformations. kubectl includes Kustomize through -k. Render first so changes in names, namespaces, labels and images are visible before apply.", "A patch must target the intended kind/name and path. An overlay is not a replacement for understanding the underlying Kubernetes resource. Incorrect label transformations can alter selection and ownership in ways that surprise learners."], "deep": ["Generated ConfigMaps and Secrets can use content-derived name suffixes. References in supported fields are updated during rendering, making configuration changes produce new names and potentially a Pod-template change. Disabling the suffix changes that rollout story.", "Do not mix imperative edits and declarative ownership casually. A later apply may overwrite a manual change. Inspect the rendered objects and compare live state, then reconcile the intended source. Server-side apply field ownership can surface conflicts that should be understood rather than forcibly discarded."], "case": "The base bank Deployment has two replicas. A practice overlay changes only its replica count and namespace; the rendered output should make that difference obvious.", "nodes": [{"title": "Base", "detail": "Reusable workload YAML"}, {"title": "Overlay", "detail": "Targeted environment changes"}, {"title": "Rendered result", "detail": "Review exact objects before apply"}], "diagramType": "flow", "lab": "Create the kustomize files from the library. Run kubectl kustomize kustomize/overlays/practice, inspect the output, apply it and confirm three replicas in tk-kustomize.", "verify": "The output has the expected namespace and replica count. Explain why reviewing the source patch alone is less conclusive than inspecting the full render.", "fault": "A patch target name is wrong. Correct the target or rendered naming transformation instead of editing the live object as the permanent fix.", "question": "What should you inspect before applying an overlay?", "answer": "The complete rendered manifests, including selectors, namespace, images and generated resource references.", "refs": ["https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/", "https://kubernetes.io/docs/reference/using-api/server-side-apply/"], "mode": "Local cluster", "code": "kubectl kustomize kustomize/overlays/practice\nkubectl apply -k kustomize/overlays/practice\nkubectl -n tk-kustomize rollout status deployment/bank-overlay\nkubectl -n tk-kustomize get deployment bank-overlay", "prereq": "Create the supplied base and overlay files before running these commands."}, {"id": "extensions", "track": "ckad", "title": "CRDs and Operators: schema versus behaviour", "domain": "Environment and security", "summary": "A new API type needs a controller if it is meant to operate something.", "understand": ["A CustomResourceDefinition adds a resource type to the Kubernetes API. A custom resource is one instance of that type. A controller can watch those instances and act on them. An Operator combines domain knowledge with controller behaviour for an application or platform capability.", "A CRD alone does not create databases, backups or certificates. It provides an API schema and storage for declared objects. The responsible controller, permissions and dependencies must be present for reconciliation."], "deep": ["Schema validation rejects some malformed custom resources before a controller sees them. Status conditions should communicate accepted intent and observed progress, with a distinction between an admitted object and a ready managed service. Finalizers often coordinate cleanup of external resources.", "Installing an Operator can introduce broad permissions, admission webhooks and upgrade responsibilities. Review its CRDs, compatibility and uninstall behaviour. A removed controller with remaining finalizers can leave resources terminating indefinitely. Never clear finalizers merely to make the display look tidy without understanding orphaned effects."], "case": "The fictional BankReport custom resource records a desired reporting period. In the schema-only exercise, it deliberately does not generate a report because no report controller is installed.", "nodes": [{"title": "CRD", "detail": "Register a validated resource shape"}, {"title": "Custom resource", "detail": "Request a BankReport period"}, {"title": "Controller", "detail": "Optional implementation performs the work"}], "diagramType": "architecture", "lab": "Apply reports-crd.yaml and a BankReport instance. Discover it with api-resources and get it. Change the required period to an invalid type and observe validation rejection. Identify the absent controller explicitly.", "verify": "The valid object is stored; no report output is claimed. You can explain what additional reconciler and permissions would be needed.", "fault": "A team says the Operator works because kubectl get shows a custom resource. Ask for status conditions, controller logs and the actual managed result.", "question": "What does registering a CRD execute?", "answer": "It extends the API schema. It does not, by itself, execute application reconciliation logic.", "refs": ["https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/", "https://kubernetes.io/docs/concepts/extend-kubernetes/operator/"], "mode": "Local cluster", "code": "@lab:reports-crd.yaml", "prereq": "Complete Setup and the starter application lab."}, {"id": "api-versions", "track": "ckad", "title": "API discovery and deprecation-safe changes", "domain": "Observability and maintenance", "summary": "Match manifests to the cluster’s supported API rather than memorising old examples.", "understand": ["apiVersion identifies an API group/version, not the kubectl binary version. Different resource kinds can use different API versions within the same cluster. Use api-resources and explain to discover supported shapes and fields.", "A removed API version can make an old manifest fail before any Pod is created. A version change may also require field changes; replacing only the apiVersion line is not a complete migration strategy."], "deep": ["Storage versions and served versions are related but distinct. API conversion and CRD conversion webhooks become important when custom types evolve. Upgrade planning should inventory deprecated APIs, chart outputs, controllers and admission integrations—not just application images.", "kubectl client/server skew has support limits. The course lab uses Kubernetes 1.35; use a client within the documented one-minor-version range. Read current exam instructions before scheduling because the published documentation site, practice cluster and examination environment can differ."], "case": "Confirm that bank Deployment uses apps/v1 and its Service uses v1. Explain why those two values do not conflict.", "nodes": [{"title": "Discover", "detail": "List served resources and versions"}, {"title": "Validate", "detail": "Check fields and server acceptance"}, {"title": "Migrate", "detail": "Test behaviour before upgrading production"}], "diagramType": "flow", "lab": "Run API discovery and explain for Deployment, Ingress and CronJob. Use server-side dry-run on supplied manifests. Compare an old Ingress example with the current schema without applying obsolete objects.", "verify": "You identify both the resource’s served version and its required backend field structure. Runtime behaviour remains a separate check.", "fault": "No matches for kind: distinguish an absent CRD from a removed built-in API version and from a typo.", "question": "Does changing apiVersion always migrate an old object specification correctly?", "answer": "No. Required fields and semantics can change too. Consult the migration guidance and validate the resulting object.", "refs": ["https://kubernetes.io/docs/reference/using-api/deprecation-guide/", "https://kubernetes.io/releases/version-skew-policy/"], "mode": "Local cluster", "code": "kubectl api-resources\nkubectl api-versions\nkubectl explain ingress.spec.rules.http.paths.backend\nkubectl apply --dry-run=server -f bank.yaml", "prereq": "Complete Setup and the starter application lab."}, {"id": "ckad-capstone", "track": "ckad", "title": "CKAD capstone and timed readiness", "domain": "Certification practice", "summary": "Demonstrate independent application delivery, then practise under a time budget.", "understand": ["Use the lessons to build a small bank information service in a fresh namespace without copying a complete solution blindly. The target includes two replicas, configuration, probes, requests/limits, a Service, a completion-based reporting task and a restricted read-only ServiceAccount.", "Work through one feature at a time: declare, inspect, exercise and record. Do not mark a task complete merely because apply returned success. Capture object state and the behaviour the requirement asked for."], "deep": ["The practice assessment is original and is not an exam dump. Use a two-hour rehearsal as a training exercise, checking current official exam duration, environment, permitted resources and candidate rules separately. Do not assume that tools available in this guide are allowed during an exam.", "Readiness has two dimensions: fast accurate use of primitives and sound diagnosis when something fails. Repeat a scenario with a changed namespace, image or label so success depends on understanding. Maintain a mistake log: symptom, false assumption, correcting evidence and a faster verification command."], "case": "The bank information service release must remain reachable during a failed candidate rollout. Its report Job finishes once per intended business operation in the design, while the demo prints only a marker.", "nodes": [{"title": "Build", "detail": "Create the required objects"}, {"title": "Break and repair", "detail": "Selector, image or readiness fault"}, {"title": "Prove", "detail": "Request test, state evidence and explanation"}], "diagramType": "flow", "lab": "Use the assessment page’s CKAD task set. Complete a guided attempt, then a timed independent attempt in a fresh namespace. Score observable outcomes using the supplied rubric; do not count reading completion as a passed practical task.", "verify": "All five CKAD domains have associated lesson/lab evidence. Repeat weak tasks with changed conditions and explain the limits of each observation.", "fault": "A learner is fast at YAML generation but never checks namespace or endpoints. Include both in the final verification sequence for every relevant task.", "question": "Does finishing this reading path establish certification or SME status?", "answer": "No. It supports preparation. Independent practical evidence, ongoing operations experience and the official exam are separate outcomes.", "refs": ["https://github.com/cncf/curriculum/blob/master/CKAD_Curriculum_v1.35.pdf", "https://training.linuxfoundation.org/certification/certified-kubernetes-application-developer-ckad/", "https://docs.linuxfoundation.org/tc-docs/certification/faq-cka-ckad-cks"], "mode": "Timed local practice", "code": "kubectl config current-context\nkubectl create namespace tk-ckad-attempt\nkubectl -n tk-ckad-attempt get all\n# Build and verify the task set in this namespace.\n# Cleanup only after saving the evidence you need:\nkubectl delete namespace tk-ckad-attempt", "prereq": "Complete Setup and the starter application lab."}, {"id": "cluster-internals", "track": "cka", "title": "Control plane internals and the Hard Way lens", "domain": "Cluster lifecycle", "summary": "Learn what each component needs before relying on an installer.", "understand": ["A working cluster depends on identities, certificates, API connectivity, persistent state, scheduling, node execution, network routing and DNS. kubeadm and managed services automate parts of that work; understanding the parts makes failures diagnosable.", "etcd stores Kubernetes API state. The API server is the normal entry point for that state. Controllers reconcile resources and the scheduler assigns unscheduled Pods. A kubelet manages the Pods assigned to its node through a container runtime interface."], "deep": ["Kubernetes the Hard Way is valuable because it exposes trust and bootstrap dependencies. Study how certificate subjects, SANs, kubeconfig endpoints and component flags connect. An otherwise valid certificate for the wrong endpoint still fails hostname verification; a trusted identity still needs authorization.", "A small cluster may colocate several components on one machine. That does not make them one process or one failure mode. In a stacked etcd topology, losing a control-plane machine can affect both API serving and datastore membership. Draw failure domains separately from software responsibilities before claiming redundancy."], "case": "For the proposed banking platform, distinguish an unavailable API endpoint from unavailable banking traffic. Existing Pods may still answer requests while new scheduling and configuration changes fail.", "nodes": [{"title": "Trust and API", "detail": "Certificates, identity and accepted state"}, {"title": "Control loops", "detail": "Controller and scheduler decisions"}, {"title": "Node execution", "detail": "kubelet, runtime and Pod network"}], "diagramType": "architecture", "lab": "On the disposable kind cluster, list kube-system Pods and inspect the node container’s /etc/kubernetes/manifests directory with a read-only docker exec. Map each static manifest to a responsibility. Compare the map with the Hard Way repository; do not run its bootstrap commands against this cluster.", "verify": "Produce a dependency map showing which components talk to the API, which persist state and which execute workloads. Label colocated components and independent failure domains.", "fault": "An operator restarts every worker because kubectl cannot reach the API. Propose a control-plane connectivity investigation first.", "question": "Do all Kubernetes components write directly to etcd?", "answer": "No. Components normally coordinate through the Kubernetes API. Direct datastore access is restricted to the control-plane design.", "refs": ["https://kubernetes.io/docs/concepts/overview/components/", "https://github.com/kelseyhightower/kubernetes-the-hard-way", "https://kubernetes.io/docs/concepts/architecture/control-plane-node-communication/"], "mode": "Local cluster", "code": "kubectl -n kube-system get pods -o wide\ndocker exec techknowen-course-control-plane ls /etc/kubernetes/manifests\nkubectl get --raw=\"/readyz?verbose\"", "prereq": "Complete Setup and the starter application lab."}, {"id": "kubeadm", "track": "cka", "title": "Build a kubeadm cluster with an explicit runbook", "domain": "Cluster lifecycle", "summary": "Prepare Linux machines, bootstrap trust, install networking and verify nodes.", "understand": ["kubeadm bootstraps a Kubernetes control plane and joins nodes; it does not provision virtual machines or choose every network and runtime detail for you. Start with disposable Linux VMs, stable connectivity, correct time, unique identities and the prerequisites required by your selected Kubernetes version.", "Install a compatible runtime and Kubernetes packages from the official version-specific repositories. Match the chosen runtime cgroup configuration with kubelet guidance. Decide the Pod network before init; overlapping Pod, Service and host network ranges cause difficult failures."], "deep": ["kubeadm init generates configuration and certificates and starts static control-plane Pods. A kubeconfig grants administrative access. A join command carries bootstrap information; treat real tokens and admin kubeconfig as sensitive. The node may remain NotReady until the chosen CNI is correctly installed.", "Use a configuration file for repeatability, record the exact package versions and retain a sanitized command log. kubeadm reset is destructive to the node’s Kubernetes configuration and is not a general repair command. It also does not magically undo all network or external-storage changes. Learn cleanup on disposable machines only."], "case": "Build one control-plane VM and two worker VMs for a banking test platform. This introduces genuine node placement choices that a single-node kind cluster cannot demonstrate.", "nodes": [{"title": "Prepare VMs", "detail": "Runtime, time, connectivity and packages"}, {"title": "Bootstrap", "detail": "kubeadm init and controlled node join"}, {"title": "Verify", "detail": "CNI, Ready nodes, DNS and a workload"}], "diagramType": "flow", "lab": "Follow the linked installation and create-cluster guides for your pinned version on three disposable Linux VMs. Use admin/kubeadm-config.yaml in the manifest library as a starting point; review every network range and runtime path. Write down CIDRs and runtime socket before init. Install one compatible CNI using its official guide, join workers, then run the bank starter and a DNS test.", "verify": "All nodes are Ready; system components are healthy; Pods on different nodes communicate; Service DNS and the application response work. Include package versions and sanitized init configuration.", "fault": "Workers join but remain NotReady. Inspect kubelet Events and CNI installation instead of repeatedly regenerating join tokens.", "question": "Does kubeadm provision your VM network and install a chosen CNI automatically?", "answer": "No. Infrastructure and the selected Pod network implementation must be prepared and installed as part of the runbook.", "refs": ["https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/install-kubeadm/", "https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/", "https://kubernetes.io/docs/setup/production-environment/container-runtimes/"], "mode": "Disposable Linux VM lab", "code": "sudo kubeadm config images list\nsudo kubeadm init --config kubeadm-config.yaml\n# Use the generated, reviewed join command only on your lab workers.\nkubectl get nodes -o wide\nkubectl -n kube-system get pods -o wide", "prereq": "Three disposable Linux VMs; official version-matched package/runtime instructions; a reviewed kubeadm-config.yaml and CNI plan. Commands are runbook steps, not a complete installer."}, {"id": "availability", "track": "cka", "title": "High availability, quorum and failure domains", "domain": "Cluster lifecycle", "summary": "More replicas help only when failures and dependencies are understood.", "understand": ["A highly available control plane needs redundant API serving, an endpoint that can reach healthy API servers and a datastore design that tolerates intended failures. etcd uses quorum: a three-member cluster needs two members to agree; losing two removes its ability to make progress.", "Control-plane redundancy does not ensure application availability. Workloads, ingress, DNS, storage and external services need their own failure-domain design. Three replicas on one node do not survive that node’s failure."], "deep": ["Adding an even-numbered etcd member does not always improve failure tolerance. A four-member cluster needs three votes and still tolerates only one member loss. Quorum protects consistency by refusing progress without enough agreement; forcing independent writes during a partition would undermine that property.", "A load balancer for the API is itself a dependency. Certificates must cover the chosen endpoint. In a stacked topology, each control-plane loss can remove an etcd member too; external etcd separates roles at additional operational cost. Design for the failures you can test and afford, not merely a larger diagram."], "case": "The bank platform’s design proposes three control-plane nodes across failure domains and application replicas distributed across workers, with independent storage recovery evidence.", "nodes": [{"title": "API availability", "detail": "Healthy servers behind a stable endpoint"}, {"title": "etcd quorum", "detail": "Two of three members agree"}, {"title": "Application availability", "detail": "Spread replicas and protect dependencies"}], "diagramType": "architecture", "lab": "Create a failure table for one, two and three members lost from a three-member datastore. Separately remove a worker in a disposable multi-node lab and observe application placement. Keep datastore failure injection in an isolated admin lab with a tested recovery plan.", "verify": "Your table correctly distinguishes consistency-preserving unavailability from data loss. Your application test records actual available replicas and request success during a node event.", "fault": "A proposal calls four etcd nodes twice as resilient as two. Calculate majority requirements and compare three versus four.", "question": "How many member failures can a healthy three-member etcd cluster tolerate while maintaining quorum?", "answer": "One, provided the remaining two can communicate and are healthy.", "refs": ["https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/ha-topology/", "https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/high-availability/", "https://etcd.io/docs/v3.6/faq/"], "mode": "Architecture exercise / optional VM lab", "code": "", "prereq": "Complete Setup and the starter application lab."}, {"id": "upgrades", "track": "cka", "title": "Upgrade without ignoring compatibility", "domain": "Cluster lifecycle", "summary": "Plan versions, backups, node disruption and verification together.", "understand": ["An upgrade is a controlled change to interacting components. Review supported version skew, deprecated APIs, runtime/CNI/CSI compatibility and backup readiness. kubeadm upgrades follow a documented order; skipping minor versions is unsupported in the standard kubeadm upgrade path.", "Upgrade the control plane, then additional control-plane nodes and workers following the version-specific procedure. Drain workloads at the instructed point, upgrade packages, restart services and uncordon after verification."], "deep": ["A healthy API is only one success condition. Admission webhooks, DNS, storage provisioning, ingress and workload rollouts must also work. A PodDisruptionBudget can block voluntary eviction if the workload cannot tolerate the drain. That is useful evidence of insufficient spare capacity, not a reason to force deletion immediately.", "The newest online documentation may describe a different source/target version than your lab. Select the archived documentation for your actual transition. Package repositories and exact version strings vary by distribution; resolve and pin them rather than copying an old apt command from a blog."], "case": "Upgrade the isolated bank admin lab one supported minor step. Keep the information service under repeated requests and record disruption and recovery times as observations.", "nodes": [{"title": "Plan", "detail": "Compatibility and tested recovery"}, {"title": "Change one node", "detail": "Upgrade, drain and restart as documented"}, {"title": "Verify and return", "detail": "Node health and application behaviour"}], "diagramType": "flow", "lab": "In the VM lab, inventory versions and run kubeadm upgrade plan. Follow the exact version-transition guide for package and control-plane changes. Upgrade one worker at a time and verify the bank request path after each.", "verify": "All component versions are within supported skew; nodes return Ready; DNS, Service access, storage and rollouts pass. Record any observed interruption.", "fault": "Drain is blocked by a budget. Inspect allowed disruptions and replica health; add justified capacity or repair replicas before deciding whether a disruption exception is acceptable.", "question": "Is a successful control-plane upgrade sufficient evidence that workloads are healthy?", "answer": "No. Test the dependent components and application paths after the infrastructure change.", "refs": ["https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/", "https://kubernetes.io/releases/version-skew-policy/", "https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/"], "mode": "Disposable Linux VM lab", "code": "kubectl get nodes -o wide\nsudo kubeadm upgrade plan\n# Continue with the official guide for YOUR source and target versions.\n# Replace LAB_WORKER with a verified disposable worker name.\nkubectl drain LAB_WORKER --ignore-daemonsets\nkubectl uncordon LAB_WORKER", "prereq": "A disposable kubeadm VM cluster, a tested backup/restore path and the version-specific upgrade guide. Do not use kind node containers as a substitute for this exercise."}, {"id": "etcd-recovery", "track": "cka", "title": "Back up and restore control-plane state", "domain": "Cluster lifecycle", "summary": "A snapshot is useful only when a restoration is understood and tested.", "understand": ["etcd stores Kubernetes API state, including sensitive data depending on encryption configuration. Protect snapshots like the cluster’s data and credentials. Use the tool versions and endpoint/TLS settings appropriate to the cluster.", "An etcd snapshot does not back up application data on persistent volumes or in external databases. Recovering Kubernetes objects without their corresponding data can leave a superficially restored but unusable service."], "deep": ["etcdctl snapshot save and etcdutl snapshot restore have different roles. Restoration builds a new data directory; it is not a harmless overwrite of a running datastore. Kubernetes watches and caches require careful revision handling after a restore; follow current etcd disaster-recovery guidance, including revision bump and compaction marking where recommended.", "The recovery runbook must cover member identity, endpoints, certificates, manifests, data-directory ownership and restart order. Test in an isolated environment and verify both API objects and application dependencies. Document an observed recovery duration; an untested estimate is not an achieved RTO."], "case": "The bank recovery plan separates cluster configuration, image availability, the fictional page content and any future external ledger data. Each has a restore owner and verification test.", "nodes": [{"title": "Snapshot", "detail": "Capture and protect API state"}, {"title": "Restore isolated state", "detail": "Correct tools, identity and revision handling"}, {"title": "Verify dependencies", "detail": "Objects plus actual application data"}], "diagramType": "flow", "lab": "On a disposable VM cluster, follow the official etcd/Kubernetes backup guide using the cluster’s actual endpoint and certificate paths. Restore into an isolated replacement environment rather than experimenting on a live directory. Record a restore of a known ConfigMap and a working application request.", "verify": "The restored object matches the checkpoint, the API is healthy and the application works. Explicitly list data not included in the etcd snapshot.", "fault": "A restored Deployment references a missing registry image or missing volume data. Explain why an etcd snapshot alone cannot satisfy recovery.", "question": "Does an etcd snapshot include the files on every PersistentVolume?", "answer": "No. It contains Kubernetes datastore state, not all application storage contents.", "refs": ["https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/", "https://etcd.io/docs/v3.6/op-guide/recovery/"], "mode": "Disposable Linux VM lab", "code": "etcdctl version\netcdutl version\n# Use the actual lab endpoint and TLS files from its reviewed runbook.\n# Snapshot example; placeholders must be replaced before execution:\netcdctl --endpoints=https://127.0.0.1:2379 --cacert=LAB_CA --cert=LAB_CLIENT_CERT --key=LAB_CLIENT_KEY snapshot save lab-snapshot.db\netcdutl snapshot status lab-snapshot.db --write-out=table", "prereq": "Disposable etcd/kubeadm VM environment; trusted TLS paths; current recovery documentation. Restore is intentionally a reviewed runbook, not a one-line production command."}, {"id": "extension-interfaces", "track": "cka", "title": "CRI, CNI, CSI and Operators", "domain": "Cluster lifecycle", "summary": "Separate execution, network and storage extension contracts.", "understand": ["CRI connects kubelet with the container runtime. CNI provides container network configuration through an implementation. CSI connects Kubernetes storage operations with storage drivers. These interfaces solve different problems; installing one does not replace the others.", "Operators add domain-specific reconciliation through custom APIs and controllers. They can depend on these lower layers and introduce further permissions, webhooks and lifecycle requirements."], "deep": ["A sandbox creation failure can come from runtime or network setup before the application ever starts. A volume attachment failure can block startup even while the image is already present. Use the failing operation and relevant component logs to choose a boundary to investigate.", "An extension’s version compatibility, privileges and upgrade behaviour belong in cluster lifecycle planning. Helm and Kustomize package/render deployment configuration; they do not guarantee an extension is correct for your Kubernetes version. Inspect CRDs, permissions, Pods and actual network/storage results after installing a component."], "case": "bank-web needs execution and networking; the persistent marker lab additionally needs a storage provisioner. The BankReport CRD adds a schema but still needs a controller for real reports.", "nodes": [{"title": "CRI", "detail": "Run the container sandbox and process"}, {"title": "CNI", "detail": "Configure Pod network connectivity"}, {"title": "CSI", "detail": "Provision, attach and mount storage"}], "diagramType": "architecture", "lab": "Inventory the runtime from node status, the networking DaemonSet/configuration and available CSIDrivers/StorageClasses. Explain the local kind provisioner’s limits. Inspect the report CRD and identify the missing application controller.", "verify": "Your inventory names implementations, versions where available, owners and a concrete validation test for each extension boundary.", "fault": "A Pod cannot mount a volume. Rebuilding its container image will not repair a CSI authentication or topology failure.", "question": "Does installing a CRD automatically implement its reconciliation behaviour?", "answer": "No. A separate controller must reconcile the custom objects, with appropriate dependencies and permissions.", "refs": ["https://kubernetes.io/docs/concepts/containers/cri/", "https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/", "https://kubernetes.io/docs/concepts/storage/volumes/#csi", "https://kubernetes.io/docs/concepts/extend-kubernetes/operator/"], "mode": "Local cluster", "code": "kubectl get nodes -o custom-columns=NAME:.metadata.name,RUNTIME:.status.nodeInfo.containerRuntimeVersion\nkubectl -n kube-system get daemonsets\nkubectl get csidrivers,storageclasses\nkubectl get crds", "prereq": "Complete Setup and the starter application lab."}, {"id": "admin-rbac", "track": "cka", "title": "Administer access without accidental privilege", "domain": "Cluster lifecycle", "summary": "Review effective grants, cluster scope and escalation routes.", "understand": ["Administrative RBAC includes both namespace-scoped work and cluster-scoped resources. A ClusterRoleBinding grants its role across the relevant cluster scope. A RoleBinding can grant a ClusterRole’s applicable permissions within one namespace.", "Permission to create Pods can be powerful because workloads may mount resources or use identities available in that namespace. Access design must consider what a subject can cause indirectly, not just whether it can read one API object directly."], "deep": ["Review bind, escalate and impersonate permissions with particular care. Existing broad grants can undermine a narrow new role because authorization permissions are additive. A service account used by a controller should receive only the operations needed for its reconciliation tasks.", "Separate administrative identities from application identities and record emergency access. Auditing can show API activity but requires a configured policy and retention. Never confuse an audit log of API requests with a complete application transaction audit."], "case": "The banking support role reads Pods and logs but cannot alter RBAC or access Secrets. Platform administrators use a separate, time-bounded operational process.", "nodes": [{"title": "Subject", "detail": "Human or workload identity"}, {"title": "Bindings", "detail": "Namespace and cluster grants"}, {"title": "Effective access", "detail": "Direct and indirect capabilities"}], "diagramType": "flow", "lab": "Extend the local bank-reader Role to allow reading pods/log, then verify it still cannot create rolebindings or read Secrets. Use auth can-i --list for the impersonated identity and explain each granted verb.", "verify": "The access matrix contains allowed and denied operations with observed results. Record that impersonation itself was done using the lab administrator.", "fault": "A narrow Role appears correct but the subject can still read Secrets. Search for another binding that grants the permission.", "question": "Can a narrow Role revoke a broader grant from another binding?", "answer": "No. Standard RBAC grants are additive. Remove or correct the broader grant through the proper administrative process.", "refs": ["https://kubernetes.io/docs/reference/access-authn-authz/rbac/", "https://kubernetes.io/docs/concepts/security/rbac-good-practices/", "https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/"], "mode": "Local cluster", "code": "kubectl auth can-i --list -n tk-bank --as=system:serviceaccount:tk-bank:bank-reader\nkubectl auth can-i create rolebindings -n tk-bank --as=system:serviceaccount:tk-bank:bank-reader\nkubectl get clusterrolebindings", "prereq": "Complete Setup and the starter application lab."}, {"id": "scheduling", "track": "cka", "title": "Scheduling, affinity, taints and spread", "domain": "Workloads and scheduling", "summary": "Separate permission to land from a preference or requirement to land.", "understand": ["The scheduler filters unsuitable nodes and scores eligible choices. Requests, selectors, affinity, taints and storage topology can all affect placement. nodeSelector is an exact matching rule; node affinity offers required and preferred forms.", "A toleration permits a Pod to tolerate a matching taint. It does not force the Pod onto that node. Use a positive placement rule when placement is required. A preferred rule may be ignored when it cannot be satisfied; a required rule can leave the Pod Pending."], "deep": ["Pod affinity and anti-affinity reason about other Pods and topology domains rather than only node labels. Topology spread constraints balance matching workloads across eligible domains with specified skew and unsatisfiable behaviour. Label quality is part of correctness: a missing or misleading zone label invalidates the intended resilience model.", "Binding a Pod with nodeName bypasses the normal scheduler choice and can defeat the reasoning behind scheduling policies. Do not use it as a general remedy for Pending. Read scheduler Events and calculate whether a valid placement actually exists."], "case": "Bank replicas should survive one worker loss. A preferred spread improves ordinary placement, while a required anti-affinity rule may need enough nodes to keep every replica schedulable.", "nodes": [{"title": "Eligibility", "detail": "Resources, taints and required rules"}, {"title": "Preference", "detail": "Score eligible nodes"}, {"title": "Distribution", "detail": "Spread across labelled failure domains"}], "diagramType": "flow", "lab": "On a multi-node disposable cluster, label two workers with fictional zones. Deploy three tiny replicas using a topology spread constraint, inspect placement, then remove one eligible zone label in the lab and observe the outcome. Restore it afterward.", "verify": "The observed placement matches the declared rule and available topology. Record Pending Events when no legal placement exists rather than calling the scheduler random.", "fault": "A Pod tolerates dedicated=bank:NoSchedule but lands elsewhere. Add the required affinity if dedicated placement is truly intended.", "question": "Does a toleration attract a Pod to a tainted node?", "answer": "No. It removes that taint’s scheduling obstacle; selection or affinity determines positive placement intent.", "refs": ["https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/", "https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/", "https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/"], "mode": "Local cluster", "code": "kubectl get nodes --show-labels\nkubectl explain pod.spec.topologySpreadConstraints\nkubectl -n tk-bank get pods -o wide\nkubectl -n tk-bank get events --sort-by=.metadata.creationTimestamp", "prereq": "A disposable multi-node lab for placement experiments; the single-node course cluster supports only inspection."}, {"id": "autoscaling", "track": "cka", "title": "HPA, metrics and node capacity", "domain": "Workloads and scheduling", "summary": "Scaling replicas and supplying machines are separate feedback loops.", "understand": ["Horizontal Pod Autoscaler adjusts replica count from observed metrics and a target. CPU utilization targets depend on requests: without meaningful requests and a working metrics pipeline, the decision can be missing or misleading.", "Node autoscaling changes available cluster capacity. More desired Pods do not guarantee they can be scheduled. Application bottlenecks such as a database connection pool can also prevent extra replicas from improving throughput."], "deep": ["The basic proportional intuition is desired replicas approximately equal current replicas multiplied by observed metric divided by target. Real behaviour also includes missing metrics, readiness, tolerance, stabilization and scaling policies. A brief spike should not be interpreted as an obligation to change replicas instantly.", "HPA and manual replica settings can conflict if both keep overwriting the same desired count. Vertical changes to resource requests can alter CPU utilization ratios. Coordinate scaling ownership and test startup, load, cooldown and maximum capacity with a bounded load generator."], "case": "If four bank replicas average 80% utilization against a 50% target, a simple ratio suggests about seven replicas after rounding up, before the controller’s additional rules and limits.", "nodes": [{"title": "Measure", "detail": "Resource metrics plus requests"}, {"title": "Replica controller", "detail": "Target, bounds and stabilization"}, {"title": "Capacity", "detail": "Nodes and downstream dependencies"}], "diagramType": "flow", "lab": "First check whether metrics.k8s.io is available. In a metrics-enabled disposable cluster, create an autoscaler for a CPU-busy test workload with explicit requests; apply a bounded load and watch replicas. Do not disable production TLS controls just to make a local metrics install work.", "verify": "Record observed metrics, HPA conditions, desired/current replicas and scheduling. Explain any interval where desired replicas exceed running replicas.", "fault": "HPA shows unknown CPU. Inspect metrics API, Pod requests and HPA conditions before increasing maxReplicas.", "question": "Can HPA create new physical or virtual worker nodes by itself?", "answer": "No. HPA changes workload replicas. Node autoscaling is a separate capacity mechanism.", "refs": ["https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/", "https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/", "https://kubernetes.io/docs/tasks/debug/debug-cluster/resource-metrics-pipeline/"], "mode": "Local cluster", "code": "kubectl get apiservice v1beta1.metrics.k8s.io\nkubectl top nodes\nkubectl -n tk-bank top pods\n# Only after a working metrics pipeline and suitable requests:\nkubectl -n tk-bank autoscale deployment bank-web --cpu-percent=60 --min=2 --max=5\nkubectl -n tk-bank describe hpa bank-web", "prereq": "A metrics-enabled disposable cluster; the basic kind setup does not install metrics-server automatically."}, {"id": "disruptions", "track": "cka", "title": "Drains, disruption budgets and graceful shutdown", "domain": "Workloads and scheduling", "summary": "Plan voluntary maintenance without confusing it with failure immunity.", "understand": ["Cordon prevents ordinary new scheduling to a node. Drain evicts eligible workloads so the node can be maintained. A PodDisruptionBudget constrains voluntary disruptions through the eviction API; it is not a shield against a machine crash or every deletion mechanism.", "A budget can allow zero disruptions when too few replicas are healthy. Maintenance then needs restored health or additional capacity. Forcing through the budget changes the availability decision and should be explicit."], "deep": ["DaemonSet and static Pods are handled differently from ordinary controller-managed workloads during drain. Local ephemeral data may be lost when a Pod is removed. The flags that ignore agents or permit emptyDir loss are operational choices, not harmless boilerplate.", "Graceful termination needs cooperation from the application, endpoint updates and traffic draining. A long termination grace period does not guarantee that all requests finish; the process must handle signals and stop accepting new work. Measure what clients actually experience."], "case": "Two healthy bank replicas with minAvailable: 1 can normally tolerate one voluntary eviction, assuming another node can host replacement work. A single-node lab cannot demonstrate node-level continuity.", "nodes": [{"title": "Cordon", "detail": "Stop normal new placement"}, {"title": "Eviction decision", "detail": "Budget and local-data checks"}, {"title": "Replacement + recovery", "detail": "Ready capacity on another node"}], "diagramType": "flow", "lab": "On a disposable multi-node lab, create a PDB for bank-web and drain one worker while sending repeated requests. Record allowedDisruptions before and during maintenance, then uncordon the node.", "verify": "You can show where traffic remained available or failed and why. A successful drain alone is not proof of zero disruption.", "fault": "A one-replica service uses minAvailable: 1, so drain blocks. Explain the availability requirement and capacity trade-off before choosing a remedy.", "question": "Does a PDB prevent a node from unexpectedly failing?", "answer": "No. It controls certain voluntary disruptions; redundancy and recovery design address involuntary failures.", "refs": ["https://kubernetes.io/docs/concepts/workloads/pods/disruptions/", "https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/"], "mode": "Local cluster", "code": "kubectl -n tk-bank create poddisruptionbudget bank-web --selector=app=bank-web --min-available=1\nkubectl -n tk-bank get pdb bank-web\n# Drain only a verified worker in the separate multi-node lab.\nkubectl drain LAB_WORKER --ignore-daemonsets\nkubectl uncordon LAB_WORKER", "prereq": "Disposable multi-node cluster, healthy replicas and an understood local-data policy."}, {"id": "cni-dataplane", "track": "cka", "title": "Pod networking, Service forwarding and eBPF", "domain": "Services and networking", "summary": "Follow packets through implemented networking rather than through API boxes.", "understand": ["Pods need addresses, routes and a way to communicate across nodes. The network implementation may route directly or encapsulate packets; the details depend on the CNI and infrastructure. Service forwarding maps a stable virtual address to usable backends.", "The API stores desired objects and endpoint information, while node-side agents program the data path. Customer HTTP traffic does not normally pass through the Kubernetes API server on its way to a web Pod."], "deep": ["iptables, IPVS and eBPF are implementation mechanisms with different operational tools and trade-offs. Do not diagnose an eBPF-based Service implementation by assuming every Service must have identical iptables chains. Read the implementation’s observability and policy guidance.", "MTU mismatch, routing overlap, source NAT, conntrack pressure and blocked node-to-node ports can cause symptoms that application logs do not explain. Start with one source, one destination, one port and a timestamp. Compare same-node versus cross-node and Pod-IP versus Service-IP paths to narrow the failing boundary."], "case": "If bank-web responds by Pod IP on the same node but cross-node Service access fails, separate overlay/routing health from Service selection before changing the Deployment.", "nodes": [{"title": "Source Pod", "detail": "Network namespace and route"}, {"title": "Node data plane", "detail": "CNI path and Service translation"}, {"title": "Destination Pod", "detail": "Target process and response route"}], "diagramType": "architecture", "lab": "In a multi-node lab, place a diagnostic client away from a bank-web backend. Test DNS, direct Pod address and Service address independently. Record node placement and the CNI implementation.", "verify": "Produce a four-cell result matrix: same/cross node versus Pod/Service address. Use it to explain the smallest suspected failing layer.", "fault": "An application works on one node but fails across nodes. Check routes, MTU and network-agent status before assuming every backend has bad code.", "question": "Does the Service API object itself forward every application packet?", "answer": "No. The configured data-plane implementation programs forwarding based on API state.", "refs": ["https://kubernetes.io/docs/concepts/cluster-administration/networking/", "https://kubernetes.io/docs/concepts/services-networking/service/", "https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/"], "mode": "Local cluster", "code": "kubectl -n tk-bank get pods -o wide\nkubectl -n tk-bank get service bank-web -o wide\nkubectl -n tk-bank get endpointslices -l kubernetes.io/service-name=bank-web\nkubectl -n kube-system get pods -o wide", "prereq": "Service/DNS fundamentals; a multi-node lab for cross-node experiments."}, {"id": "coredns", "track": "cka", "title": "CoreDNS and systematic name-resolution diagnosis", "domain": "Services and networking", "summary": "Check the client, DNS service and upstream resolution separately.", "understand": ["A Pod’s resolver configuration determines which DNS server and search suffixes it uses. Cluster DNS normally supplies Service names and forwards other names according to its configuration. A successful external lookup does not prove that the expected internal namespace name exists.", "Check the exact query, namespace, resolver configuration and DNS response before modifying CoreDNS. A denied DNS packet and an NXDOMAIN reply indicate different failures."], "deep": ["DNS can use both UDP and TCP; policies or firewalls that allow only one may fail for some responses. Search suffix expansion and ndots can produce more queries than the short name suggests. Caching can retain an old answer temporarily, so timing matters.", "CoreDNS itself depends on scheduling, its Service endpoints, API access for service discovery and upstream reachability where forwarding is required. A broad Corefile edit affects many workloads. Validate syntax and change one condition in a disposable environment before proposing a cluster-wide fix."], "case": "From a client in another namespace, bank-web alone may query the wrong namespace. bank-web.tk-bank identifies the intended Service within a typical cluster search configuration.", "nodes": [{"title": "Client resolver", "detail": "Query and search suffixes"}, {"title": "Cluster DNS", "detail": "Service discovery and cache"}, {"title": "Upstream DNS", "detail": "External names when forwarded"}], "diagramType": "flow", "lab": "Run a busybox diagnostic Pod and compare nslookup bank-web.tk-bank with an intentionally misspelled Service name. Inspect /etc/resolv.conf. Check CoreDNS Pods, its Service and logs using read-only commands.", "verify": "You distinguish a valid answer, NXDOMAIN and timeout, and identify which evidence supports each diagnosis.", "fault": "A default-deny policy blocks DNS. Restore the specific resolver access instead of replacing working Service names with hard-coded IPs.", "question": "Does a DNS timeout mean the requested Service name does not exist?", "answer": "Not necessarily. The request or response may be blocked, or the DNS service may be unavailable. NXDOMAIN is a different result.", "refs": ["https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/", "https://kubernetes.io/docs/tasks/administer-cluster/coredns/", "https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/"], "mode": "Local cluster", "code": "kubectl -n tk-bank run dns-check --image=busybox:1.37 --restart=Never -- sh -c \"cat /etc/resolv.conf; nslookup bank-web.tk-bank\"\nkubectl -n tk-bank logs dns-check\nkubectl -n kube-system get service kube-dns\nkubectl -n kube-system logs deployment/coredns --tail=30\nkubectl -n tk-bank delete pod dns-check", "prereq": "Complete Setup and the starter application lab."}, {"id": "gateway-api", "track": "cka", "title": "Gateway API and delegated routing", "domain": "Services and networking", "summary": "Separate infrastructure ownership from application route ownership.", "understand": ["GatewayClass identifies a controller/implementation class. A Gateway configures listeners and infrastructure intent. HTTPRoute expresses application routing rules attached to an allowed parent. This division lets platform and application teams hold different responsibilities.", "Gateway API resources are CRDs, not automatically present on every cluster. Install a compatible implementation and the appropriate CRDs using its official guidance. An accepted HTTPRoute is not the same as a programmed, reachable external endpoint."], "deep": ["Route status conditions such as Accepted and ResolvedRefs help explain whether the parent accepted the route and whether references are valid. A cross-namespace backend reference can require a ReferenceGrant in the target namespace. That grant is distinct from listener allowedRoutes rules governing route attachment.", "Hostnames, listener ports, TLS settings, path rules and backend health all contribute to traffic success. Weighted backends allow more explicit canary intent than changing replica ratios, but observed traffic can still depend on connection patterns. Record status and exercise actual requests."], "case": "The platform team owns a bank-public Gateway. The application team attaches an information-page HTTPRoute whose backend is bank-web; a future cross-namespace backend needs an explicit trust decision.", "nodes": [{"title": "GatewayClass / Gateway", "detail": "Implementation and listener ownership"}, {"title": "HTTPRoute", "detail": "Allowed attachment and routing rules"}, {"title": "Backend + grants", "detail": "Service reference and trust boundaries"}], "diagramType": "architecture", "lab": "Open admin/gateway.yaml in the manifest library, replace its class with a real installed GatewayClass, and save the file. In a Gateway-enabled lab, apply that Gateway and HTTPRoute using the chosen controller’s supported class. Inspect parent status conditions and test the hostname/path. Change the backend name to a missing Service and observe ResolvedRefs before restoring it.", "verify": "The Gateway is programmed, route references resolve and the client receives the intended page. If no implementation is installed, mark runtime routing as not tested.", "fault": "A cross-namespace reference fails despite a matching hostname. Inspect ReferenceGrant and allowedRoutes as separate controls.", "question": "What does ReferenceGrant control?", "answer": "It permits specified cross-namespace references to resources in the namespace that owns the grant; it is not a general network allow rule.", "refs": ["https://kubernetes.io/docs/concepts/services-networking/gateway/", "https://gateway-api.sigs.k8s.io/guides/", "https://gateway-api.sigs.k8s.io/reference/api-types/referencegrant/"], "mode": "Gateway-capable cluster", "code": "kubectl get gatewayclasses\nkubectl apply -f gateway.yaml\nkubectl get gateways,httproutes -A\nkubectl explain httproute.spec.parentRefs\nkubectl describe httproute bank-info -n tk-bank", "prereq": "Gateway API CRDs and a compatible controller; use its version-matched installation and example configuration."}, {"id": "csi-storage", "track": "cka", "title": "Administer storage lifecycle and topology", "domain": "Storage", "summary": "Provisioning, attachment, mounting and recovery are separate operations.", "understand": ["A StorageClass defines provisioning behaviour and parameters for its storage implementation. The PVC requests capacity; the PV records provisioned or supplied storage. A Pod can be blocked while storage is unbound, unattached or unmounted, and those stages need different evidence.", "Reclaim policy governs what happens to backing storage after claim release. Retain preserves a resource for manual handling; Delete can remove it through the provisioner. Neither is a substitute for a tested backup policy."], "deep": ["Zonal storage constrains placement. WaitForFirstConsumer lets scheduling and volume topology be considered together. A volume cannot simply be moved across arbitrary zones because a Pod is rescheduled. CSI controller and node components coordinate provisioning, attachment and mount operations.", "Expansion requires support from the StorageClass, driver, volume and filesystem path. A larger requested PVC does not prove the filesystem inside the running container expanded successfully. Snapshot API availability also does not guarantee application-consistent recovery; quiescing or database-aware backup may be needed."], "case": "The bank marker exercise proves persistence across one Pod replacement. A platform storage acceptance test additionally checks topology, node replacement, reclaim behaviour and a restored data read.", "nodes": [{"title": "Provision", "detail": "Class and capacity produce a volume"}, {"title": "Attach and mount", "detail": "Match node topology and access mode"}, {"title": "Recover", "detail": "Restore and verify application data"}], "diagramType": "flow", "lab": "Inspect the bound marker PVC, PV, StorageClass and consumer node. Build a retention table before any deletion. In a CSI-enabled lab, test a supported expansion and verify both API capacity and the mounted filesystem.", "verify": "Your evidence identifies the driver, binding mode, reclaim policy and failure-stage messages. State clearly which recovery operations were not performed.", "fault": "A Pod moves zones and cannot attach its disk. Investigate topology and storage design instead of force-deleting the PV.", "question": "Does a larger PVC capacity field alone prove an application sees a larger filesystem?", "answer": "No. Verify the actual mounted filesystem and any driver/filesystem expansion conditions.", "refs": ["https://kubernetes.io/docs/concepts/storage/storage-classes/", "https://kubernetes.io/docs/concepts/storage/persistent-volumes/", "https://kubernetes.io/docs/concepts/storage/volume-snapshots/"], "mode": "Local cluster", "code": "kubectl -n tk-bank get pvc bank-learning-data -o yaml\nkubectl get pv\nkubectl get storageclass -o yaml\nkubectl get volumeattachments\nkubectl -n tk-bank describe pod bank-storage", "prereq": "Complete Setup and the starter application lab."}, {"id": "node-triage", "track": "cka", "title": "Diagnose an unhealthy node", "domain": "Troubleshooting", "summary": "Use conditions, kubelet/runtime evidence and resource pressure before restarting blindly.", "understand": ["A node reports conditions such as Ready and resource pressure. NotReady is a symptom, not a root cause. The kubelet may be unable to reach the API, the runtime may be unhealthy, certificates may fail or the node may be under pressure.", "Start with the node object and recent Events, then inspect the node’s own services in the VM lab. kubectl logs cannot retrieve every failure when the kubelet or node connection itself is broken."], "deep": ["Disk pressure can come from images, writable layers, logs or other node storage. Deleting application data is not a safe generic disk remedy. Establish which filesystem is full and what owns the growth. CPU starvation, memory pressure and PID exhaustion have different signatures.", "Use journalctl for service history and crictl for CRI runtime inspection, configured for the correct socket. System time and certificate validity affect TLS. Keep the investigation read-only until a causal hypothesis is strong enough for one controlled change. A reboot may restore service while hiding the unresolved cause."], "case": "A bank worker becomes NotReady while its existing application requests intermittently fail. Collect node conditions and kubelet/runtime evidence before deciding whether to drain, repair or replace it.", "nodes": [{"title": "Cluster evidence", "detail": "Conditions, Events and placement"}, {"title": "Node evidence", "detail": "kubelet, runtime, disk and time"}, {"title": "Controlled repair", "detail": "Verify cause and restore readiness"}], "diagramType": "flow", "lab": "In the disposable Linux VM lab, deliberately stop kubelet on one worker, observe the delayed node condition change, then restore it. Compare that symptom with a read-only disk-pressure investigation. Do not inject faults into a shared cluster.", "verify": "Your record identifies the injected cause, observation delay, affected workloads and the evidence that the node recovered.", "fault": "A node is NotReady and an operator changes the banking image. Explain why workload code is unlikely to fix a stopped kubelet.", "question": "Why might kubectl logs be unavailable during node failure?", "answer": "It relies on a working path to the node/container logs; failure of the kubelet, runtime or connectivity can block that path.", "refs": ["https://kubernetes.io/docs/tasks/debug/debug-cluster/", "https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/", "https://kubernetes.io/docs/concepts/architecture/nodes/"], "mode": "Disposable Linux VM lab", "code": "kubectl describe node LAB_WORKER\n# On that disposable VM, inspect before changing anything:\nsudo systemctl status kubelet containerd\nsudo journalctl -u kubelet --since \"15 minutes ago\"\ndf -h\nsudo crictl info", "prereq": "Admin access to
