arse with realistic data shape and traffic while protecting sensitive information."], "case": "Move the bank information page first as a low-risk pilot. Treat a hypothetical ledger migration as a separate programme with data reconciliation and an explicit write-freeze or replication strategy.", "nodes": [{"title": "Discover and plan", "detail": "Dependencies and migration strategy"}, {"title": "Move and validate", "detail": "Pilot, data sync and cutover checks"}, {"title": "Operate and improve", "detail": "Ownership, recovery and measured outcomes"}], "diagramType": "flow", "lab": "Write a cutover runbook with decision gates, responsible people, data checkpoints, client changes and abort criteria. Walk through failure immediately before and after the first target write. Offline work is the main exercise; do not migrate real financial data.", "verify": "The runbook distinguishes application rollback from data reconciliation and gives an owner for each decision.", "fault": "The plan says “switch DNS back” after a failed target write. Identify divergent data and the missing reconciliation procedure.", "question": "Why is a post-write rollback harder than a pre-cutover abort?", "answer": "The target may contain new authoritative changes absent from the source. Reverting traffic alone can lose or duplicate effects.", "refs": ["https://cloud.google.com/architecture/migration-to-gcp-getting-started", "https://cloud.google.com/architecture/migration-to-google-cloud-transferring-your-large-datasets", "https://cloud.google.com/network-connectivity/docs/vpn/concepts/overview", "https://cloud.google.com/network-connectivity/docs/interconnect/concepts/overview"], "mode": "Offline architecture exercise", "code": "", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gcp-architecture", "track": "gcp", "title": "Architecture decisions and the Well-Architected review", "domain": "PCA architecture", "summary": "Make trade-offs explicit enough for another person to challenge.", "understand": ["An architecture connects requirements to responsibilities, interfaces, data, deployment and operations. Start with business outcomes and measurable constraints: peak demand, acceptable latency, recovery targets, access boundaries, team capability and cost. Product selection comes after those questions.", "A decision record states context, options, choice and consequences. A diagram shows relationships, but prose explains why they exist and where assumptions remain. Review operational excellence, security, reliability, performance, cost and sustainability together rather than optimising one pillar in isolation."], "deep": ["Distinguish functional requirements from quality attributes. “Show a balance” is behaviour; “respond within a defined percentile under stated load” is a measurable quality target. Unknown traffic, regulations or recovery needs are open questions, not excuses to invent precision.", "Use sensitivity analysis: what changes if demand rises tenfold, a region fails or the team halves? An architecture that requires expertise the team does not possess has an operational risk even if the component diagram is technically plausible. Record rejected options and a revisit trigger."], "case": "For a future bank platform, compare a simpler managed application design with a GKE design. Separate the information page, transaction authority, reporting, identity and audit responsibilities. Never imply the teaching page implements this production system.", "nodes": [{"title": "Business and constraints", "detail": "Outcomes and measurable qualities"}, {"title": "Options and decisions", "detail": "Trade-offs and ownership"}, {"title": "Evidence and review", "detail": "Tests, risks and revisit conditions"}], "diagramType": "comparison", "lab": "Produce a context diagram, deployment diagram and two decision records for the bank case. Have a peer challenge cost, failure recovery and access assumptions. Offline: replace the peer with a written adversarial review using the six framework perspectives.", "verify": "Each chosen component supports a requirement. The review includes one meaningful trade-off, unresolved assumption and planned experiment.", "fault": "A proposal adds every cloud product to appear enterprise-ready. Remove components that have no stated requirement or owner.", "question": "Can the technically most flexible platform be the wrong architecture?", "answer": "Yes. Skills, operating cost, complexity, reliability needs and delivery constraints can make a simpler alternative better.", "refs": ["https://cloud.google.com/architecture/framework", "https://cloud.google.com/architecture/architecture-decision-records", "https://cloud.google.com/learn/certification/cloud-architect"], "mode": "Offline architecture exercise", "code": "", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gcp-ai", "track": "gcp", "title": "AI systems, retrieval and model-serving architecture", "domain": "PCA architecture", "summary": "Apply architecture discipline to probabilistic components and sensitive context.", "understand": ["An AI feature needs a defined user task, authorised data and measurable evaluation. Retrieval-augmented generation supplies selected context to a model; it does not guarantee the answer is correct. Training, fine-tuning, inference and retrieval are different activities with different costs and data responsibilities.", "Choose between managed model APIs, managed custom model services and specialised infrastructure according to control, latency, data handling, scale and team skills. Google’s current architecture exam guide includes AI/ML platform topics; consult the current product documentation as names and capabilities evolve."], "deep": ["A retrieval pipeline has ingestion, transformation, indexing, permission-aware retrieval, model invocation and response evaluation. Documents can contain malicious instructions; retrieved text must remain untrusted data. Prevent unauthorised retrieval before generation and test for leakage, unsupported answers and prompt injection.", "Model serving introduces batching, accelerator capacity, startup time, quotas and cost per useful response. Evaluation must include task quality and operational latency/error behaviour. A deterministic fallback or human escalation may be more appropriate than always producing an answer. A model cannot authorise a transfer simply because it produced plausible text."], "case": "The bank prototype adds an optional assistant for public help articles only. It cites approved fictional help content and hands off account-specific requests. It never sees real balances or gains permission to move money.", "nodes": [{"title": "Approved knowledge", "detail": "Permission-aware ingestion and retrieval"}, {"title": "Model interaction", "detail": "Bounded task, context and guardrails"}, {"title": "Evaluation and fallback", "detail": "Quality, leakage, latency and escalation"}], "diagramType": "architecture", "lab": "Offline, create five public-help questions, two unanswerable questions and two hostile retrieved passages. Specify the expected response behaviour and score groundedness, refusal/escalation and leakage. Draw separate retrieval and model-serving dependencies. No paid AI API is required.", "verify": "The evaluation includes failures and an explicit fallback. Explain which claims require a real model test rather than a paper design.", "fault": "A retrieved help article instructs the assistant to reveal secrets. Keep it as untrusted source content and test that it cannot override the application’s authority boundaries.", "question": "Does adding retrieval eliminate hallucinations?", "answer": "No. Retrieval can improve grounding, but source quality, permissions, model behaviour and evaluation still matter.", "refs": ["https://cloud.google.com/vertex-ai/docs/start/introduction-unified-platform", "https://cloud.google.com/vertex-ai/generative-ai/docs/rag-overview", "https://cloud.google.com/architecture/framework/perspectives/ai-ml", "https://cloud.google.com/learn/certification/cloud-architect"], "mode": "Offline architecture and evaluation exercise", "code": "", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}, {"id": "gcp-capstone", "track": "gcp", "title": "ACE operations and PCA architecture capstones", "domain": "Independent practice", "summary": "Demonstrate operational evidence and defend architecture decisions separately.", "understand": ["The ACE practice path asks you to inspect and operate an isolated environment: project, IAM, network, workload, observability and cleanup. The PCA practice path asks you to evaluate requirements, choose an architecture, explain trade-offs and plan reliable operations. These abilities reinforce each other but are not the same assessment.", "Our practical tasks and scenario reviews are original learning exercises, not replicas of Google’s exams or official scoring. Use the current official standard exam guides to plan preparation. Reading the guide and passing a self-check do not by themselves establish professional experience."], "deep": ["Build an evidence portfolio: a reproducible lab record, two fault investigations, a restore rehearsal, an architecture decision and an operational handover. Repeat tasks with changed constraints so you learn reasoning rather than a memorised command sequence.", "For SME development, continue beyond certification into observed incidents, capacity experiments, security reviews, migration rehearsal and reviewed team decisions. Distinguish a design you can explain from a system you have operated under failure. Keep cloud/VM tasks marked pending until actually run."], "case": "The final Harbour Bank design separates the implemented learning page from a proposed transaction platform. Its portfolio labels each claim as observed, documented, calculated or assumed.", "nodes": [{"title": "ACE evidence", "detail": "Operate and troubleshoot deliberately"}, {"title": "PCA judgement", "detail": "Defend options and failure recovery"}, {"title": "Continued practice", "detail": "Repeat with new constraints and review"}], "diagramType": "flow", "lab": "Complete the ACE and PCA assessment pages independently. Use a sandbox for live tasks or label the offline alternative clearly. Review against the criteria, correct gaps and repeat without following the sample reasoning.", "verify": "A reviewer can reproduce your commands or follow your design argument. No unexecuted cloud task is presented as a successful test.", "fault": "A portfolio lists many products but cannot explain a failed request. Return to one complete request path and gather evidence at each boundary.", "question": "What is stronger evidence than marking every lesson complete?", "answer": "A reproducible observation, an explained diagnosis, a tested recovery and a decision defended against changed requirements.", "refs": ["https://cloud.google.com/learn/certification/cloud-engineer", "https://cloud.google.com/learn/certification/cloud-architect", "https://services.google.com/fh/files/misc/professional_cloud_architect_exam_guide_english.pdf"], "mode": "Independent GCP practice / offline review", "code": "", "prereq": "Complete cloud setup. Use your own isolated project and dummy data; cloud resources can incur charges. The offline alternative is a labelled design and predicted evidence, not an executed lab."}], "labs": {"admin/gateway.yaml": "# Prerequisite: compatible Gateway controller and CRDs.\n# Replace YOUR_INSTALLED_CLASS with an existing GatewayClass.\napiVersion: gateway.networking.k8s.io/v1\nkind: Gateway\nmetadata:\n  name: bank-public\n  namespace: tk-bank\nspec:\n  gatewayClassName: YOUR_INSTALLED_CLASS\n  listeners:\n    - name: http\n      protocol: HTTP\n      port: 80\n      allowedRoutes:\n        namespaces:\n          from: Same\n---\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata:\n  name: bank-info\n  namespace: tk-bank\nspec:\n  parentRefs:\n    - name: bank-public\n  hostnames:\n    - bank.example.test\n  rules:\n    - matches:\n        - path:\n            type: PathPrefix\n            value: /\n      backendRefs:\n        - name: bank-web\n          port: 80\n", "admin/hpa.yaml": "apiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata:\n  name: bank-web\n  namespace: tk-bank\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name: bank-web\n  minReplicas: 2\n  maxReplicas: 4\n  metrics:\n    - type: Resource\n      resource:\n        name: cpu\n        target:\n          type: Utilization\n          averageUtilization: 60\n", "admin/kubeadm-config.yaml": "# Teaching starting point, NOT a complete VM installer.\n# Confirm your version, host addresses, runtime and CNI first.\n# 10.244.0.0/16 and 10.96.0.0/12 must not overlap host/VPN ranges.\napiVersion: kubeadm.k8s.io/v1beta4\nkind: InitConfiguration\nnodeRegistration:\n  criSocket: unix:///var/run/containerd/containerd.sock\n---\napiVersion: kubeadm.k8s.io/v1beta4\nkind: ClusterConfiguration\nkubernetesVersion: v1.35.8\nnetworking:\n  podSubnet: 10.244.0.0/16\n  serviceSubnet: 10.96.0.0/12\n---\napiVersion: kubelet.config.k8s.io/v1beta1\nkind: KubeletConfiguration\ncgroupDriver: systemd\n", "admin/spread.yaml": "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: bank-spread\n  namespace: tk-bank\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app: bank-spread\n  template:\n    metadata:\n      labels:\n        app: bank-spread\n    spec:\n      topologySpreadConstraints:\n        - maxSkew: 1\n          topologyKey: kubernetes.io/hostname\n          whenUnsatisfiable: DoNotSchedule\n          labelSelector:\n            matchLabels:\n              app: bank-spread\n      containers:\n        - name: web\n          image: nginx:1.28.0-alpine\n          resources:\n            requests:\n              cpu: 50m\n              memory: 32Mi\n            limits:\n              memory: 64Mi\n", "bank-info/Chart.yaml": "apiVersion: v2\nname: bank-info\ndescription: Original TechKnowen teaching chart\ntype: application\nversion: 0.1.0\nappVersion: \"1.27\"\n", "bank-info/templates/deployment.yaml": "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: {{ .Release.Name }}\nspec:\n  replicas: {{ .Values.replicaCount }}\n  selector:\n    matchLabels:\n      app.kubernetes.io/instance: {{ .Release.Name }}\n  template:\n    metadata:\n      labels:\n        app.kubernetes.io/instance: {{ .Release.Name }}\n    spec:\n      containers:\n        - name: web\n          image: {{ .Values.image | quote }}\n          ports:\n            - containerPort: 80\n          readinessProbe:\n            httpGet:\n              path: /\n              port: 80\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: {{ .Release.Name }}\nspec:\n  selector:\n    app.kubernetes.io/instance: {{ .Release.Name }}\n  ports:\n    - port: 80\n      targetPort: 80\n", "bank-info/values.yaml": "replicaCount: 2\nimage: nginx:1.27-alpine\n", "bank.yaml": "apiVersion: v1\nkind: Namespace\nmetadata:\n  name: tk-bank\n---\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: bank-page\n  namespace: tk-bank\ndata:\n  index.html: <!doctype html><html><h1>Harbour Bank learning service<\/h1><p>Version\n    one. Fictional information only.<\/p><\/html>\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: bank-web\n  namespace: tk-bank\nspec:\n  replicas: 2\n  selector:\n    matchLabels:\n      app: bank-web\n  strategy:\n    type: RollingUpdate\n    rollingUpdate:\n      maxUnavailable: 0\n      maxSurge: 1\n  template:\n    metadata:\n      labels:\n        app: bank-web\n    spec:\n      automountServiceAccountToken: false\n      containers:\n      - name: web\n        image: nginx:1.27-alpine\n        ports:\n        - containerPort: 80\n        resources:\n          requests:\n            cpu: 50m\n            memory: 32Mi\n          limits:\n            cpu: 250m\n            memory: 128Mi\n        readinessProbe:\n          httpGet:\n            path: /\n            port: 80\n          periodSeconds: 3\n        livenessProbe:\n          httpGet:\n            path: /\n            port: 80\n          initialDelaySeconds: 10\n          periodSeconds: 10\n        volumeMounts:\n        - name: page\n          mountPath: /usr/share/nginx/html\n          readOnly: true\n      volumes:\n      - name: page\n        configMap:\n          name: bank-page\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: bank-web\n  namespace: tk-bank\nspec:\n  selector:\n    app: bank-web\n  ports:\n  - port: 80\n    targetPort: 80\n", "ingress.yaml": "apiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: bank-web\n  namespace: tk-bank\nspec:\n  ingressClassName: replace-with-installed-class\n  rules:\n  - host: bank.example.test\n    http:\n      paths:\n      - path: /\n        pathType: Prefix\n        backend:\n          service:\n            name: bank-web\n            port:\n              number: 80\n", "init.yaml": "apiVersion: v1\nkind: Pod\nmetadata:\n  name: bank-init\n  namespace: tk-bank\nspec:\n  containers:\n  - name: web\n    image: nginx:1.27-alpine\n    volumeMounts:\n    - name: shared\n      mountPath: /usr/share/nginx/html\n  initContainers:\n  - name: prepare\n    image: busybox:1.37\n    command:\n    - sh\n    - -c\n    - echo \"Harbour Bank prepared page\" > /work/index.html\n    volumeMounts:\n    - name: shared\n      mountPath: /work\n  volumes:\n  - name: shared\n    emptyDir: {}\n", "jobs.yaml": "apiVersion: batch/v1\nkind: Job\nmetadata:\n  name: bank-report\n  namespace: tk-bank\nspec:\n  backoffLimit: 1\n  template:\n    spec:\n      restartPolicy: Never\n      containers:\n      - name: report\n        image: busybox:1.37\n        command:\n        - sh\n        - -c\n        - 'echo \"Fictional bank report: total demo units 3500\"'\n---\napiVersion: batch/v1\nkind: CronJob\nmetadata:\n  name: bank-report-schedule\n  namespace: tk-bank\nspec:\n  schedule: 0 6 * * *\n  timeZone: Etc/UTC\n  suspend: true\n  concurrencyPolicy: Forbid\n  successfulJobsHistoryLimit: 1\n  failedJobsHistoryLimit: 1\n  jobTemplate:\n    spec:\n      backoffLimit: 1\n      template:\n        spec:\n          restartPolicy: Never\n          containers:\n          - name: report\n            image: busybox:1.37\n            command:\n            - sh\n            - -c\n            - 'echo \"Fictional bank report: total demo units 3500\"'\n", "kustomize/base/deployment.yaml": "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: bank-overlay\nspec:\n  replicas: 2\n  selector:\n    matchLabels:\n      app: bank-overlay\n  template:\n    metadata:\n      labels:\n        app: bank-overlay\n    spec:\n      containers:\n      - name: web\n        image: nginx:1.27-alpine\n", "kustomize/base/kustomization.yaml": "resources:\n  - deployment.yaml\n", "kustomize/overlays/practice/kustomization.yaml": "resources:\n  - ../../base\n  - namespace.yaml\nnamespace: tk-kustomize\nreplicas:\n  - name: bank-overlay\n    count: 3\n", "kustomize/overlays/practice/namespace.yaml": "apiVersion: v1\nkind: Namespace\nmetadata:\n  name: tk-kustomize\n", "pending.yaml": "apiVersion: v1\nkind: Pod\nmetadata:\n  name: bank-pending\n  namespace: tk-bank\nspec:\n  containers:\n  - name: worker\n    image: busybox:1.37\n    command:\n    - sleep\n    - '3600'\n    resources:\n      requests:\n        cpu: '100'\n        memory: 32Mi\n", "policy.yaml": "apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: bank-web-ingress\n  namespace: tk-bank\nspec:\n  podSelector:\n    matchLabels:\n      app: bank-web\n  policyTypes:\n  - Ingress\n  ingress:\n  - from:\n    - podSelector:\n        matchLabels:\n          role: frontend\n    ports:\n    - protocol: TCP\n      port: 80\n", "rbac.yaml": "apiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: bank-reader\n  namespace: tk-bank\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  name: bank-pod-reader\n  namespace: tk-bank\nrules:\n- apiGroups:\n  - ''\n  resources:\n  - pods\n  verbs:\n  - get\n  - list\n  - watch\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\n  name: bank-pod-reader\n  namespace: tk-bank\nsubjects:\n- kind: ServiceAccount\n  name: bank-reader\n  namespace: tk-bank\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n  kind: Role\n  name: bank-pod-reader\n", "report.yaml": "apiVersion: learning.techknowen.example/v1\nkind: BankReport\nmetadata:\n  name: september\n  namespace: tk-bank\nspec:\n  period: 2026-09\n", "reports-crd.yaml": "apiVersion: apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata:\n  name: bankreports.learning.techknowen.example\nspec:\n  group: learning.techknowen.example\n  scope: Namespaced\n  names:\n    plural: bankreports\n    singular: bankreport\n    kind: BankReport\n    shortNames:\n    - brpt\n  versions:\n  - name: v1\n    served: true\n    storage: true\n    schema:\n      openAPIV3Schema:\n        type: object\n        properties:\n          spec:\n            type: object\n            required:\n            - period\n            properties:\n              period:\n                type: string\n                pattern: ^[0-9]{4}-[0-9]{2}$\n", "secret-reader.yaml": "apiVersion: v1\nkind: Secret\nmetadata:\n  name: dummy-report\n  namespace: tk-bank\ntype: Opaque\nstringData:\n  token: fictional-training-token\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: secret-reader\n  namespace: tk-bank\nspec:\n  containers:\n  - name: reader\n    image: busybox:1.37\n    command:\n    - sh\n    - -c\n    - wc -c < /secret/token\n    volumeMounts:\n    - name: secret\n      mountPath: /secret\n      readOnly: true\n  restartPolicy: Never\n  automountServiceAccountToken: false\n  volumes:\n  - name: secret\n    secret:\n      secretName: dummy-report\n", "security.yaml": "apiVersion: v1\nkind: Pod\nmetadata:\n  name: secure-worker\n  namespace: tk-bank\nspec:\n  containers:\n  - name: worker\n    image: busybox:1.37\n    command:\n    - sh\n    - -c\n    - id; echo safe > /work/result; cat /work/result; sleep 3600\n    securityContext:\n      allowPrivilegeEscalation: false\n      readOnlyRootFilesystem: true\n      capabilities:\n        drop:\n        - ALL\n    volumeMounts:\n    - name: work\n      mountPath: /work\n  automountServiceAccountToken: false\n  securityContext:\n    runAsNonRoot: true\n    runAsUser: 10001\n    runAsGroup: 10001\n    fsGroup: 10001\n    seccompProfile:\n      type: RuntimeDefault\n  volumes:\n  - name: work\n    emptyDir: {}\n", "storage.yaml": "apiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: bank-learning-data\n  namespace: tk-bank\nspec:\n  accessModes:\n  - ReadWriteOnce\n  resources:\n    requests:\n      storage: 128Mi\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: bank-storage\n  namespace: tk-bank\nspec:\n  containers:\n  - name: worker\n    image: busybox:1.37\n    command:\n    - sleep\n    - '3600'\n    volumeMounts:\n    - name: data\n      mountPath: /data\n  volumes:\n  - name: data\n    persistentVolumeClaim:\n      claimName: bank-learning-data\n"}, "commands": {"starter": "kubectl apply -f bank.yaml\nkubectl -n tk-bank rollout status deployment/bank-web --timeout=120s\nkubectl -n tk-bank get endpointslices -l kubernetes.io/service-name=bank-web\nkubectl -n tk-bank port-forward service/bank-web 8080:80\n# In another terminal: curl http://127.0.0.1:8080", "init-sidecars": "kubectl apply -f init.yaml\nkubectl -n tk-bank wait --for=condition=Ready pod/bank-init --timeout=120s\nkubectl -n tk-bank get pod bank-init -o yaml\nkubectl -n tk-bank exec bank-init -- cat /usr/share/nginx/html/index.html", "jobs": "kubectl apply -f jobs.yaml\nkubectl -n tk-bank wait --for=condition=complete job/bank-report --timeout=120s\nkubectl -n tk-bank logs job/bank-report\nkubectl -n tk-bank create job report-now --from=cronjob/bank-report-schedule\nkubectl -n tk-bank wait --for=condition=complete job/report-now --timeout=120s\nkubectl -n tk-bank logs job/report-now", "secrets": "kubectl apply -f secret-reader.yaml\nkubectl -n tk-bank get pod secret-reader\nkubectl -n tk-bank logs secret-reader\nkubectl auth can-i get secrets -n tk-bank", "resources": "kubectl apply -f pending.yaml\nkubectl -n tk-bank describe pod bank-pending\nkubectl -n tk-bank delete pod bank-pending", "identity-rbac": "kubectl apply -f rbac.yaml\nkubectl auth can-i get pods -n tk-bank --as=system:serviceaccount:tk-bank:bank-reader\nkubectl auth can-i get secrets -n tk-bank --as=system:serviceaccount:tk-bank:bank-reader", "security-context": "kubectl apply -f security.yaml\nkubectl -n tk-bank wait --for=condition=Ready pod/secure-worker --timeout=120s\nkubectl -n tk-bank logs secure-worker\nkubectl -n tk-bank exec secure-worker -- sh -c \"echo blocked > /root-test\"\n# The last command should fail: the root filesystem is read-only.", "storage": "kubectl apply -f storage.yaml\nkubectl -n tk-bank wait --for=condition=Ready pod/bank-storage --timeout=120s\nkubectl -n tk-bank exec bank-storage -- sh -c \"echo retained > /data/marker\"\nkubectl -n tk-bank delete pod bank-storage\nkubectl apply -f storage.yaml\nkubectl -n tk-bank wait --for=condition=Ready pod/bank-storage --timeout=120s\nkubectl -n tk-bank exec bank-storage -- cat /data/marker\nkubectl get pv", "network-policy": "# Basic kind: schema check only.\nkubectl apply --dry-run=server -f policy.yaml\n# Apply and test traffic only in the documented enforcing environment.\n# kubectl apply -f policy.yaml", "ingress": "kubectl apply --dry-run=server -f ingress.yaml\nkubectl get ingressclass\n# Set the actual installed class before live application.", "extensions": "kubectl apply -f reports-crd.yaml\nkubectl wait --for=condition=Established crd/bankreports.learning.techknowen.example --timeout=60s\nkubectl apply -f report.yaml\nkubectl -n tk-bank get bankreports\n# No report controller is installed by this example."}, "domains": {"ckad": [{"title": "Application Design and Build", "weight": "20%", "lessons": ["images", "pod-design", "init-sidecars", "workload-choice", "jobs", "storage"]}, {"title": "Application Deployment", "weight": "20%", "lessons": ["rollouts", "release-strategies", "helm", "kustomize"]}, {"title": "Application Observability and Maintenance", "weight": "15%", "lessons": ["probes", "debugging", "api-versions"]}, {"title": "Application Environment, Configuration and Security", "weight": "25%", "lessons": ["configuration", "secrets", "resources", "identity-rbac", "security-context", "extensions"]}, {"title": "Services and Networking", "weight": "20%", "lessons": ["services-dns", "network-policy", "ingress"]}], "cka": [{"title": "Cluster Architecture, Installation and Configuration", "weight": "25%", "lessons": ["cluster-internals", "kubeadm", "availability", "upgrades", "etcd-recovery", "extension-interfaces", "admin-rbac", "helm", "kustomize", "extensions"]}, {"title": "Workloads and Scheduling", "weight": "15%", "lessons": ["scheduling", "autoscaling", "disruptions", "rollouts", "configuration", "workload-choice"]}, {"title": "Services and Networking", "weight": "20%", "lessons": ["cni-dataplane", "coredns", "gateway-api", "network-policy", "services-dns", "ingress"]}, {"title": "Storage", "weight": "10%", "lessons": ["csi-storage", "storage"]}, {"title": "Troubleshooting", "weight": "30%", "lessons": ["node-triage", "control-plane-triage", "network-triage", "observability", "cka-capstone"]}], "gcp": [{"title": "ACE · Set up a cloud solution environment", "weight": "20%", "lessons": ["gcp-start", "gcp-hierarchy", "gcp-iam"]}, {"title": "ACE · Plan and configure a cloud solution", "weight": "17.5%", "lessons": ["gcp-network", "gcp-compute", "gcp-storage", "gcp-data", "gcp-cost"]}, {"title": "ACE · Deploy and implement a cloud solution", "weight": "25%", "lessons": ["gke-first", "gke-network", "gke-identity", "gcp-events", "gcp-delivery", "gcp-iac"]}, {"title": "ACE · Ensure successful operation", "weight": "20%", "lessons": ["gke-lifecycle", "gcp-observe", "gcp-recovery", "gcp-capstone"]}, {"title": "ACE · Configure access and security", "weight": "17.5%", "lessons": ["gcp-iam", "gke-identity", "gcp-security"]}, {"title": "PCA · Design and plan architecture", "weight": "25%", "lessons": ["gcp-architecture", "gcp-compute", "gcp-data", "gcp-migration", "gcp-ai"]}, {"title": "PCA · Manage and provision infrastructure", "weight": "17.5%", "lessons": ["gcp-network", "gke-modes", "gke-first", "gcp-storage", "gcp-ai"]}, {"title": "PCA · Design for security and compliance", "weight": "17.5%", "lessons": ["gcp-security", "gcp-hierarchy", "gcp-iam", "gke-identity", "gcp-delivery"]}, {"title": "PCA · Analyse and optimise technical/business processes", "weight": "15%", "lessons": ["gcp-cost", "gcp-migration", "gcp-architecture", "gcp-delivery"]}, {"title": "PCA · Manage implementations", "weight": "12.5%", "lessons": ["gcp-iac", "gcp-delivery", "gcp-migration", "gcp-events"]}, {"title": "PCA · Ensure solution and operational excellence", "weight": "12.5%", "lessons": ["gcp-observe", "gcp-recovery", "gke-lifecycle", "gcp-capstone"]}]}, "assessments": {"ckad": {"title": "CKAD independent rehearsal", "minutes": 120, "namespace": "tk-ckad-attempt", "tasks": [{"title": "Build the workload", "points": 20, "task": "Create a two-replica information service with explicit image, labels, requests/limits and readiness. Use an original page marker and a ConfigMap. Choose an appropriate controller.", "evidence": "Saved manifests; two Ready replicas; correct page from the workload.", "solution": "Use a Deployment whose selector matches its template. Mount the page ConfigMap. Validate rollout and response separately."}, {"title": "Deploy and recover", "points": 20, "task": "Render a Kustomize overlay or Helm package, change a version, introduce a bad image and restore the known-good revision.", "evidence": "Rendered YAML; stalled-rollout evidence; successful recovery and response.", "solution": "Inspect rendered names and labels. Read Events for pull failure. Restore the intended Pod template, then check rollout and HTTP. Explain what image rollback cannot undo."}, {"title": "Observe and diagnose", "points": 15, "task": "Repair a wrong readiness path and collect current/previous logs where applicable. Explain the resulting traffic effect.", "evidence": "Root cause, changed field, readiness and endpoint observations.", "solution": "A failing readiness check can leave the process running while removing it from normal Service traffic. Correct the endpoint and repeat the request."}, {"title": "Configure and restrict", "points": 25, "task": "Run a non-root compatible worker with a writable scratch volume. Mount a dummy Secret without logging it. Give a separate ServiceAccount Pod-read permissions but no Secret-read permission.", "evidence": "Observed UID and allowed write; byte-count-only Secret check; auth can-i yes/no pair.", "solution": "Use compatible paths, drop capabilities and disable privilege escalation. Define narrow Role and RoleBinding. Test actual effective permissions."}, {"title": "Connect and explain policy", "points": 20, "task": "Expose the workload with a Service and repair a wrong selector. Write an Ingress for the lab host and a NetworkPolicy permitting a labelled frontend. Test routing/policy only where controllers and an enforcing CNI exist.", "evidence": "Service request succeeds; backend addresses match; Ingress/controller evidence and allowed/denied policy tests, or explicit not-tested dependencies.", "solution": "Service selectors, ports and ready endpoints must align. Ingress needs a controller. NetworkPolicy needs enforcement. Missing infrastructure means the corresponding practical outcome is not earned, even when YAML validates."}], "rubric": "Award each task’s points only when its stated observable outcomes are demonstrated. Partial credit: split the listed outcomes evenly and document which were observed. 80/100 is this guide’s suggested readiness target, not an official passing score. Repeat all missed tasks independently. If policy or ingress infrastructure is absent, record the attempt as incomplete rather than silently reallocating those points."}, "cka": {"title": "CKA operations and incident rehearsal", "minutes": 120, "tasks": [{"title": "Plan and verify the cluster", "points": 25, "task": "In the disposable VM lab, explain the kubeadm/runtime/CNI configuration, RBAC boundaries and control-plane failure model. Demonstrate a supported lifecycle or isolated restore exercise.", "evidence": "Version inventory, access checks, sanitized runbook and observed recovery verification.", "solution": "Match documentation to the actual version. Protect datastore and application backups separately. Verify API readiness and workload behaviour after recovery."}, {"title": "Schedule and maintain workloads", "points": 15, "task": "Apply deliberate placement rules, inspect an unschedulable workload and conduct a controlled worker drain with a PDB. Explain metrics prerequisites for autoscaling.", "evidence": "Scheduler Events, placement table, allowedDisruptions and request observations.", "solution": "Tolerations permit but do not attract. Required placement can leave Pods Pending. Restore healthy capacity before bypassing a budget."}, {"title": "Repair network paths", "points": 20, "task": "Diagnose a Service-selector fault, compare DNS and direct-backend tests, and verify an HTTPRoute on a Gateway-capable cluster. Demonstrate an enforced NetworkPolicy allow/deny pair.", "evidence": "EndpointSlices, DNS outcomes, route conditions and both allowed/denied traffic.", "solution": "Separate naming, selection, policy and forwarding. CRDs or accepted manifests alone do not prove a controller or policy implementation works."}, {"title": "Explain and recover storage", "points": 10, "task": "Inspect binding mode, topology, access mode and reclaim policy. Demonstrate data persistence after Pod replacement and explain a separate restore plan.", "evidence": "PVC/PV/class details, new Pod UID, preserved marker and backup scope.", "solution": "Persistence is not backup. Reclaim policy can destroy backing storage; inspect it before cleanup."}, {"title": "Diagnose controlled incidents", "points": 30, "task": "Resolve a stopped kubelet in the VM lab, a bad workload image and an unavailable application route. Collect evidence before each repair.", "evidence": "Symptom, hypothesis, decisive observation, minimal repair and repeated acceptance test for each fault.", "solution": "Use host tools when the node/API path is broken. Read image pull Events for registry failures; inspect endpoints and ports for application routing. A reboot alone does not explain cause."}], "rubric": "Original 120-minute training exercise, not official exam questions or scoring. Award points only for demonstrated outcomes; divide task points across its stated outcomes for partial credit. Suggested readiness target: 80/100 plus successful repetition of missed tasks. Infrastructure-dependent tasks remain incomplete when their required lab is unavailable."}, "ace": {"title": "ACE · Operate a cloud learning environment", "minutes": 120, "rubric": "Original practice, not the official exam format. Score evidence out of 100: award each task proportionally for correct configuration, observed verification and explanation. 80 is a suggested internal practice target, not a certification pass mark. Any wrong-project change, exposed credential or unverified cleanup requires correction before claiming readiness. Offline designs are valuable but do not earn live-execution evidence.", "tasks": [{"title": "Establish scope and spending controls", "points": 15, "task": "Identify your sandbox principal, project, region, enabled APIs and billing linkage. Document a budget notification and a complete cleanup inventory before creating resources.", "evidence": "Sanitised read-only output, budget recipient and resource inventory with owner/location.", "solution": "Distinguish the CLI account, active configuration and explicit project flags. A budget notification is not a cap. Include retained disks, addresses, logs and backups in inventory."}, {"title": "Run and verify the information page", "points": 25, "task": "In an authorised sandbox, deploy bank.yaml to a learning GKE cluster with a dedicated kubeconfig. Keep access through port-forward. Explain any changed Pod requests.", "evidence": "Context, cluster location, Ready state, usable endpoints and actual Harbour Bank response; clearly label any infrastructure prerequisites already supplied.", "solution": "Cloud provisioning, client connectivity and Kubernetes authorization are separate. Confirm scope, wait for rollout, inspect endpoints and test the response. Do not count a dry-run as runtime success."}, {"title": "Bound report access", "points": 20, "task": "Use Workload Identity Federation for a dedicated KSA to read one dummy bucket. Prove that an ungranted write is denied.", "evidence": "Identity mapping and policy scope, allowed dummy read, denied write, no credential payloads.", "solution": "Use the exact project number, workload pool, namespace and KSA. Direct principal binding or documented impersonation must match the selected method. Do not solve access failure with broad Owner grants."}, {"title": "Diagnose one controlled service fault", "points": 20, "task": "Introduce a wrong selector on the disposable bank Service. Diagnose and restore it using the smallest justified change. Connect cloud and cluster observations where relevant.", "evidence": "Before/after selector, EndpointSlice state, hypothesis and the same request repeated after repair.", "solution": "Ready Pods alone cannot establish Service health. Compare selection and labels before altering the Deployment. Restore the known manifest and verify the original request."}, {"title": "Handover and cleanup", "points": 20, "task": "Write an operational note and remove only created lab resources after collecting evidence. Explain the remaining billable dependencies or retention obligations.", "evidence": "Inventory reconciled against actual resources, cleanup outputs and an honest list of untested operations.", "solution": "Cluster deletion alone may not remove every disk, backup, address or stored image. Review each created resource, its retention and owner. Do not delete a shared project as a shortcut."}]}, "pca": {"title": "PCA · Defend the Harbour Bank architecture", "minutes": 120, "rubric": "Original scenario workshop and reasoning questions, not official exam questions or a replica of Google’s exam format. Score out of 100 for requirements, coherent decisions, failure analysis, evidence and clear communication. A suggested internal review target is 80, with no unresolved critical access or recovery contradiction. Illustrative business targets below are fictional teaching constraints, not industry or regulatory requirements.", "tasks": [{"title": "Requirements and platform choice", "points": 20, "task": "A fictional team of six supports the information page and plans a report service. Traffic peaks at ten times baseline; the team has limited Kubernetes operations experience. Compare Cloud Run, GKE and a VM fleet, then choose with stated assumptions.", "evidence": "A decision record, rejected alternative, owner matrix and a trigger for revisiting the choice.", "solution": "A simpler managed platform may fit the current application. GKE needs a requirement that justifies its operating model. Separate today’s read-only page from a proposed transactional platform; do not claim an implementation you have not built."}, {"title": "Identity and data boundaries", "points": 20, "task": "Reports must remain private; release automation must not read their contents. Draw workload, deployment and human access paths. Design a future transfer service’s retry/idempotency boundary without implementing real payments.", "evidence": "Trust-boundary diagram, scoped roles, denial tests and a transaction/idempotency explanation.", "solution": "Separate deployer and runtime identities; protect delegation. Use durable storage semantics for business effects. A Kubernetes restart or queue delivery feature does not make two financial writes atomic."}, {"title": "Recovery and migration", "points": 25, "task": "For fictional planning, assume a 60-minute RTO and 15-minute RPO for the report service. Design recovery after region loss and migration from an existing environment. Challenge whether the targets are achieved or merely proposed.", "evidence": "Dependency inventory, restore order, data checkpoint, quota/key assumptions, cutover and post-write rollback plan.", "solution": "Include configuration, images, data, identity and network. Backup for GKE is not a complete project backup. Measure recovery in rehearsal; account for replication lag and write reconciliation after cutover."}, {"title": "Operations and cost", "points": 20, "task": "Define a request-based SLO, an actionable alert, an upgrade process and a cost estimate with assumptions. Explain what changes if traffic grows tenfold for a week.", "evidence": "Numerator/denominator/window, runbook owner, maintenance checks, capacity constraints and a dated cost model.", "solution": "Avoid equating request success with fixed downtime minutes. Include telemetry, storage, transfer and load balancing in costs. Quota, address space and downstream capacity can block autoscaling."}, {"title": "AI help assistant design review", "points": 15, "task": "Add a public-help assistant without account access. Explain retrieval, evaluation, prompt-injection handling and fallback. Include one reason to reject a more complex model platform.", "evidence": "Data-flow diagram, authorised corpus, hostile/unanswerable test cases, quality/latency criteria and escalation behaviour.", "solution": "Retrieved passages are untrusted data, not authority. Restrict sources before generation, test grounding and leakage, and keep financial actions outside the model’s permissions. Managed APIs may reduce operational burden when their data and capability constraints fit."}]}}, "sources": [{"title": "CNCF CKAD and CKA curricula", "url": "https://github.com/cncf/curriculum", "note": "Domain mapping, weights and detailed objectives; CC BY 4.0."}, {"title": "Kubernetes documentation", "url": "https://kubernetes.io/docs/", "note": "Concepts, tasks and API references. Each lesson links its relevant pages."}, {"title": "Kubernetes Basics tutorial", "url": "https://kubernetes.io/docs/tutorials/kubernetes-basics/", "note": "Public introductory teaching sequence."}, {"title": "Kubernetes the Hard Way — Kelsey Hightower", "url": "https://github.com/kelseyhightower/kubernetes-the-hard-way", "note": "Manual cluster-building reference; linked, not copied."}, {"title": "KodeKloud public CKAD course outline", "url": "https://kodekloud.com/courses/certified-kubernetes-application-developer-ckad", "note": "Public teaching-format reference; no paid course or exam material reproduced."}, {"title": "kind quick start", "url": "https://kind.sigs.k8s.io/docs/user/quick-start/", "note": "Local learning cluster setup."}, {"title": "Linux Foundation candidate FAQs and preparation rules", "url": "https://docs.linuxfoundation.org/tc-docs/certification/faq-cka-ckad-cks", "note": "Verify current rules and permitted resources before taking an exam."}, {"title": "Google Associate Cloud Engineer exam guide", "url": "https://cloud.google.com/learn/certification/guides/cloud-engineer", "note": "ACE objectives and preparation guidance."}, {"title": "Google Professional Cloud Architect standard exam guide", "url": "https://services.google.com/fh/files/misc/professional_cloud_architect_exam_guide_english.pdf", "note": "Current standard exam objectives, reviewed 2026-09-28; separate from the renewal guide."}, {"title": "Google Cloud Well-Architected Framework", "url": "https://cloud.google.com/architecture/framework", "note": "Operational, security, reliability, cost, performance and sustainability perspectives."}], "reviewed": "2026-09-28", "validation": "On 2026-09-28, the local Kubernetes 1.35.8 kind lab passed 46 recorded operations/assertions covering the starter Service request, init preparation, Jobs, dummy Secret mounting, Pending diagnosis, RBAC allow/deny checks, restricted execution, PVC persistence, CRD discovery, Kustomize and rollback. The supplied Helm chart was linted, installed, upgraded and rolled back. NetworkPolicy and Ingress received server schema checks only; enforcement and ingress routing were not executed. Administrator VM, Gateway, metrics and GCP exercises require their stated environments and are not claimed as executed here. The HPA and topology-spread Deployment examples also passed server-side dry-run validation; metrics-driven scaling and multi-node placement were not executed. Browser checks covered 229 routes, 142 lesson diagrams, narrow-screen overflow, local notes, search, timer, copying, themes and offline file reading. All 186 cited source URLs were reachable during the final link check; future availability and content can change.\n"};
function detailedDiagram(l){
 const d=DATA.deepDiagrams?.[l.id];if(!d)return '';const uid='detail-'+l.id+'-'+(++figureSerial),width=960,rowH=148;
 const used=new Set(d.edges.flatMap(e=>e.slice(0,2))),extra=d.nodes.map((n,i)=>[n,i]).filter(([n,i])=>!used.has(i));
 const height=30+d.edges.length*rowH+extra.length*112;
 const box=(i,x,y,w=282)=>{const [name,detail]=d.nodes[i];return `<g class="diagram-node"><rect class="node ${i===1?'focus':''}" x="${x}" y="${y}" width="${w}" height="112" rx="6"/>${text(x+16,y+28,name,'',14,30)}${text(x+16,y+66,detail,'sub',12,34)}</g>`};
 let body=d.edges.map(([a,b,label],i)=>{const y=16+i*rowH;return `<path class="arrow" d="M302 ${y+70}H656" marker-end="url(#${uid}-a)"/><rect class="paper" x="316" y="${y+16}" width="328" height="44"/>${text(324,y+35,label,'sub',12,41)}`+box(a,18,y)+box(b,660,y)}).join('');
 extra.forEach(([n,i],j)=>{const y=16+d.edges.length*rowH+j*112;body+=`<g class="diagram-node"><rect class="node" x="18" y="${y}" width="924" height="90" rx="6"/>${text(34,y+28,n[0],'',14,100)}${text(34,y+57,n[1],'sub',12,112)}</g>`});

function render(){clearInterval(timerHandle);figureSerial=0;currentTrack='';const hash=location.hash.slice(1)||'/',[path,query]=hash.split('?'),p=path.split('/'),params=new URLSearchParams(query||'');let html;if(path==='/')html=home();else if(p[1]==='track')html=trackPage(p[2]);else if(p[1]==='lesson')html=lesson(p[2],['deep','lab'].includes(params.get('view'))?params.get('view'):'understand');else if(p[1]==='labs')html=library();else if(p[1]==='assessments')html=assessment(p[2]);else if(p[1]==='coverage')html=coverage();else if(p[1]==='study')html=study();else if(p[1]==='glossary')html=glossary();else if(p[1]==='sources')html=sources();else if(p[1]==='progress')html=progress();else if(p[1]==='search')html=search(params.get('q')||'');else html=missing();$('#main').innerHTML=html;nav();document.title=($('#main h1')?.textContent||'Kubernetes & Cloud')+' · TechKnowen';document.body.classList.remove('nav-open');$('#menu').setAttribute('aria-expanded','false');bind();}
function bind(){document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const txt=b.parentElement.querySelector('code').textContent;try{await navigator.clipboard.writeText(txt);b.textContent='Copied'}catch{const range=document.createRange();range.selectNodeContents(b.parentElement.querySelector('code'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);b.textContent='Selected — copy manually'}});$('#notes')?.addEventListener('input',e=>{state.notes[e.target.dataset.note]=e.target.value;$('#save-status').textContent=save()?'Notes saved locally.':'Browser storage is unavailable. Copy your notes before leaving.'});$('#done')?.addEventListener('click',e=>{const id=e.target.dataset.done;state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];const stored=save();e.target.textContent=state.done.includes(id)?'✓ Reviewed — mark unread':'Mark this lesson reviewed';$('#save-status').textContent=stored?'Reading status saved locally.':'Storage unavailable; status lasts only for this session.'});$('[data-timer]')?.addEventListener('click',e=>{clearInterval(timerHandle);timerEnd=Date.now()+Number(e.target.dataset.timer)*60000;const update=()=>{const s=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if($('#timer'))$('#timer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s)clearInterval(timerHandle)};update();timerHandle=setInterval(update,1000)});$('#stop-timer')?.addEventListener('click',()=>clearInterval(timerHandle));}
$('#search-form').onsubmit=e=>{e.preventDefault();location.hash='/search?q='+encodeURIComponent($('#search').value)};$('#theme').onclick=()=>{const dark=document.body.classList.toggle('dark');$('#theme').setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');try{localStorage.setItem('tk-guide-theme',dark?'dark':'light')}catch{}};$('#menu').onclick=()=>{const v=document.body.classList.toggle('nav-open');$('#menu').setAttribute('aria-expanded',String(v))};try{if(localStorage.getItem('tk-guide-theme')==='dark')document.body.classList.add('dark')}catch{}$('#theme').setAttribute('aria-label',document.body.classList.contains('dark')?'Switch to light mode':'Switch to dark mode');window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();

function glossary(){return `<h1>Plain-language glossary</h1><p class="lede">Use the definition to orient yourself, then follow its lesson for behaviour, limits and practice.</p><div class="table-wrap"><table><thead><tr><th>Term</th><th>Meaning in this guide</th></tr></thead><tbody>${DATA.glossary.map(g=>`<tr><th><a href="#/lesson/${g.lesson}">${esc(g.term)}</a></th><td>${esc(g.meaning)}</td></tr>`).join('')}</tbody></table></div>`}
function study(){const stages=[['1 · Build the mental model','orientation','Explain image → container → Pod → node → cluster, and distinguish a user request from an API declaration.','Draw it from memory and diagnose a hostname error versus HTTP 503.'],['2 · Run a small service','starter','Complete setup and serve the Harbour Bank marker through localhost.','Show Ready Pods, actual endpoints and a successful response; explain what port-forward does not test.'],['3 · Develop and diagnose workloads','images','Study CKAD lessons; vary one manifest field at a time and predict the outcome.','Build an image, configure a workload, test storage, diagnose a failure and recover a rollout.'],['4 · Attempt CKAD independently','ckad-capstone','Use the original timed tasks after guided practice.','Repeat with changed names and constraints; record failed attempts as well as repairs.'],['5 · Operate the underlying platform','kubeadm','Move to dedicated Linux VMs for kubeadm, lifecycle and node fault work.','Demonstrate cross-node networking and an isolated recovery; local single-node success is not HA evidence.'],['6 · Attempt CKA recovery practice','cka-capstone','Diagnose before changing; test control-plane and workload acceptance separately.','Produce a fault timeline, one justified repair and prevention follow-up.'],['7 · Operate Google Cloud','gcp-start','Use an isolated project for ACE/GKE practice or clearly label offline designs.','Verify scope, identity boundaries, workload access and cleanup; budget alerts do not cap costs.'],['8 · Defend and revisit architecture','gcp-architecture','Use PCA scenarios, recovery, migration, security, cost and AI evaluation.','Defend two alternatives, test uncertain assumptions and show what changes under failure or growth.']];return `<h1>A route from first concepts to defensible expertise</h1><p class="lede">Progress through evidence gates instead of promising mastery after a fixed number of days. Reading, guided practice, independent practice and professional experience are different stages.</p>${stages.map(([t,id,work,gate])=>`<section class="step"><h2><a href="#/lesson/${id}">${esc(t)}</a></h2><p>${esc(work)}</p><p><strong>Move on when:</strong> ${esc(gate)}</p></section>`).join('')}<h2>A repeatable study session</h2><ol><li>Explain the simple diagram aloud without reading the prose.</li><li>Predict one observable result and one failure before running the lab.</li><li>Record context, version, command, actual result and uncertainty.</li><li>Use the detailed diagram to explain the responsibility that failed.</li><li>Repeat with a changed condition and close the loop with an actual request or data check.</li></ol><h2>Three honest evidence labels</h2><p><strong>Observed:</strong> actually executed with retained output. <strong>Designed:</strong> reasoned through but not run. <strong>Pending:</strong> requires an environment, review or repeat. Keep these labels in your local lesson notes.</p><h2>Continue toward subject-matter expertise</h2><p>Rehearse restores, upgrade a disposable cluster, investigate a new incident, review a peer’s identity design and measure capacity under changing demand. Keep updating the evidence as versions and services change. Certifications structure preparation; experience comes from repeated work and critical review.</p><p><a href="#/assessments">Open independent practice →</a> · <a href="#/coverage">Compare the current objective map →</a></p>`}
